<!-- Zerkalius Пирамида — v0.008. Сверху одна, под ней три, под ними шесть, дальше десять… — пирамида из тетраэдров и октаэдров. -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerkalius Пирамида — v0.008</title>
<!--
  ═══ ПИРАМИДА (заведена 2026-09-29) ═══════════════════════════════════════════════════════════════
  Вопрос пользователя: «а можно ли вообще расположить единичные [тела] гранями друг к другу так: 1, 2, 3» → «верх, под ней 3,
  под ней ещё больше, и т. д.».
  Ответ — да, но не одними бипирамидами (у них боковые грани наклонные: цепочка грань к грани закручивается спиралью, а вокруг
  ребра пять тетраэдров оставляют щель ~7,4°). Без щелей это делают тетраэдры вместе с октаэдрами: тетраэдрово-октаэдрическая
  укладка пространства. Большой тетраэдр со стороной L режется на:
    ▲ тетраэдры остриём вверх — в слое n (сверху, с нуля) их (n+1)(n+2)/2: 1, 3, 6, 10… (всего L(L+1)(L+2)/6);
    ◆ октаэдры — между слоями: 0, 1, 3, 6… (всего (L−1)L(L+1)/6);
    ▼ тетраэдры остриём вниз — в провалах: 0, 0, 1, 3… (всего (L−2)(L−1)L/6).
  Каждая грань любой части прилегает к грани соседа целиком: ▲ и ▼ — только к октаэдрам, октаэдр — к тем и другим.
  Точки решётки: P(i, j, k) = i·e1 + j·e2 + k·e3, где e1, e2, e3 — рёбра единичного тетраэдра от вершины вниз, i + j + k ≤ L.
  «Раздвинуть» — каждая часть отъезжает от центра пирамиды, и слои 1-3-6 видны поштучно.
  Рисуется на холсте: грани всех частей сортируются по глубине (художник), полупрозрачная заливка и рёбра.
  v0.002, «сделай приближение, масштабирование и достройку отражения от любой грани по клику»: колесо / два пальца — ближе-дальше
  к точке под курсором; правая кнопка, Shift или два пальца — сдвиг вида; щелчок по грани — зеркальная копия этой части через эту
  грань (садится вплотную, грань к грани); по достроенным тоже можно щёлкать; такая часть уже стоит — второй раз не ставится.
  Грань под курсором обведена. ⌖ — вид как был, ✕ — убрать достроенное.
  v0.003, «а также переворачивать ромбы и перемещать»: режим щелчка — ⟲ отражать (как в v0.002) / ✥ двигать (тащишь часть в плоскости
  экрана, отпустил — защёлкивается: её первая вершина встаёт в ближайший узел решётки i·e1 + j·e2 + k·e3, где стоят все вершины укладки,
  поэтому часть снова может сесть грань к грани) / ⇅ переворачивать (поворот на 180° вокруг горизонтали через середину части: тетраэдр
  «остриём вверх» становится «остриём вниз», ровно как в провалах укладки; октаэдр при этом совпадает сам с собой). Части самой пирамиды
  тоже двигаются и переворачиваются: тронутая уходит из пирамиды (removed) и становится своей копией среди достроенных. ✕ — всё как было.
  v0.004, «на мобильном меню на пол-экрана, всё перекрывает, минимализируй»: на узком экране (≤ 600 px) панель — узкая полоса внизу:
  кнопки только значками (слова в span.t спрятаны, смысл — в title), оба ползунка в одну строку, счёт мелко. Кнопка ▾ у заголовка
  сворачивает панель до одной строки «ПИРАМИДА ▸» (на телефоне свёрнута с самого начала, на компьютере — открыта); выбор помнится
  в localStorage piramida_min.
  v0.005, «а если до 64 слоёв? и возможность отключать цвет, чисто рёбрами, и несколько видов сверху, сбоку, и ещё кнопки»:
  в 64 слоях 131 тыс. частей и 700 тыс. граней — холст 2D с сортировкой каждой грани такого не тянет, поэтому рисует WebGL2.
  Части не хранятся объектами: каждая — запись в текстуре данных (4 текселя: сдвиг o и номер заготовки; столбцы матрицы M с цветом),
  вершина = M · заготовка + o (заготовки: 0 — тетраэдр ▲, 1 — октаэдр, 2 — тетраэдр ▼; у пирамиды M единичная, у достроенных —
  отражение или поворот, считается по четырём вершинам). Прозрачность: части сортируются по глубине на процессоре (поразрядно,
  16 бит), а внутри части сначала идут дальние грани, потом ближние (сетка части — две копии граней, лишние сворачиваются
  в шейдере) — как художник у v0.004, только по частям. Щелчок и наведение ищут грань на процессоре: сначала отбор по центру
  части, потом треугольники. Новые кнопки: ▣ грани, ╱ рёбра, ◐ цвет (выключить — всё одним светлым), «Срез» — один слой из L;
  виды ⊤ сверху, ⊥ снизу, ◁ сбоку (на боковую грань по горизонтали), ◇ на ребро, ◢ на грань (перпендикулярно боковой грани),
  ⬙ 3D — поворот плавный, вращение при этом останавливается; 📷 — картинка PNG. Ползунки со стрелками ◂ ▸ (общий slider-arrows.js).
  v0.006, «кнопку скорости — умножает на 2 каждый раз»: рядом с ⟳ кнопка ×N — скорость вращения; щелчок удваивает
  (×1 → ×2 → … → ×32), после ×32 — снова с ×¼. Если вращение стояло, щелчок его включает.
  v0.007, «номер версии не видно после заголовка»: #ver переехал из правого нижнего угла (на телефоне он был спрятан) в заголовок
  панели — сразу после «ПИРАМИДА», виден и в свёрнутой панели.
  v0.008, «×512»: скорость удваивается до ×512 (прежде до ×32), после ×512 — снова ×¼.
-->
<style>
  :root{ --bg:#050608; --panel:rgba(12,14,18,.92); --line:#2a3038; --fg:#cfd8dc; --dim:#7d8388; --acc:#7ee787; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.35 system-ui, sans-serif; overflow:hidden; }
  #cv, #ov{ position:fixed; inset:0; width:100%; height:100%; }
  #cv{ touch-action:none; cursor:grab; }
  #ov{ pointer-events:none; }
  #panel{ position:fixed; left:12px; top:12px; width:230px; max-height:calc(100% - 24px); overflow:auto; box-sizing:border-box; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  #panel h1{ margin:0; font-size:14px; letter-spacing:2px; color:var(--acc); font-weight:600; display:flex; align-items:center; }
  #bMin{ flex:0 0 auto; margin-left:auto; padding:0 6px; border:none; background:none; color:var(--dim); font-size:14px; letter-spacing:0; }
  #panel.min > :not(h1){ display:none; }
  #panel.min{ width:auto; padding:6px 8px; }
  .sl{ display:flex; flex-direction:column; gap:8px; }
  label.s{ display:flex; flex-direction:column; gap:3px; color:var(--dim); }
  label.s b{ color:var(--fg); }
  input[type=range]{ width:100%; }
  .rows{ display:flex; flex-direction:column; gap:4px; }
  .row{ display:flex; gap:4px; flex-wrap:wrap; }
  button{ flex:1 0 auto; background:#0c0f14; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:5px 6px; cursor:pointer; font:inherit; }
  button.on{ color:var(--fg); border-color:var(--acc); }
  #count{ color:var(--dim); font-size:12px; }
  #ver{ margin-left:8px; color:var(--dim); font:11px monospace; letter-spacing:0; font-weight:400; }
  @media (max-width:600px){
    #panel{ left:6px; right:6px; top:auto; bottom:6px; width:auto; max-height:45%; padding:6px 8px; gap:5px; font-size:12px; }
    #panel.min{ right:auto; }
    #panel h1{ font-size:12px; }
    .sl{ flex-direction:row; gap:8px; }
    .sl label.s{ flex:1 1 0; min-width:0; }
    .t{ display:none; }
    .rows{ flex-direction:row; flex-wrap:wrap; }
    .rows .row{ flex-wrap:nowrap; }
    button{ padding:4px 7px; }
    #count{ font-size:11px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="ov"></canvas>
<div id="panel">
  <h1>ПИРАМИДА<span id="ver">v0.008</span><button id="bMin" title="Свернуть / развернуть панель">▾</button></h1>
  <div class="sl">
  <label class="s">Слоёв: <b id="vL">4</b><input type="range" id="sL" min="1" max="64" step="1" value="4"></label>
  <label class="s">Раздвинуть: <b id="vX">0</b><input type="range" id="sX" min="0" max="100" step="1" value="35"></label>
  <label class="s" title="Показать один слой (сверху — 1); в начале шкалы — все">Срез: <b id="vS">все</b><input type="range" id="sS" min="0" max="4" step="1" value="0"></label>
  </div>
  <div class="rows">
  <div class="row">
    <button id="bUp" class="on" title="Тетраэдры остриём вверх: в слоях 1, 3, 6, 10…">▲<span class="t"> верх</span></button>
    <button id="bOct" class="on" title="Октаэдры — между слоями, к ним тетраэдры прилегают гранями">◆<span class="t"> окта</span></button>
    <button id="bDn" class="on" title="Тетраэдры остриём вниз — в провалах между октаэдрами">▼<span class="t"> низ</span></button>
  </div>
  <div class="row">
    <button id="bFace" class="on" title="Грани — полупрозрачная заливка">▣<span class="t"> грани</span></button>
    <button id="bEdge" class="on" title="Рёбра">╱<span class="t"> рёбра</span></button>
    <button id="bCol" class="on" title="Цвет: по слоям и видам частей; выключен — всё одним светлым">◐<span class="t"> цвет</span></button>
  </div>
  <div class="row"><button id="bSpin" class="on" title="Вращение (пробел)">⟳<span class="t"> вращение</span></button><button id="bSpd" title="Скорость вращения: щелчок — вдвое быстрее; после ×512 — снова ×¼">×1</button><button id="bPng" title="Сохранить картинку PNG">📷<span class="t"> снимок</span></button></div>
  <div class="row"><button id="mRef" class="on" title="Щелчок по грани — зеркальная копия части через эту грань">⟲<span class="t"> отражать</span></button><button id="mMove" title="Тащи часть мышью или пальцем; отпустил — встаёт в ближайший узел решётки">✥<span class="t"> двигать</span></button><button id="mFlip" title="Щелчок по части — перевернуть её вверх ногами (тетраэдр остриём вверх ⇄ вниз)">⇅<span class="t"> перевернуть</span></button></div>
  <div class="row">
    <button data-v="top" title="Вид сверху — на основание">⊤<span class="t"> сверху</span></button>
    <button data-v="bot" title="Вид снизу">⊥<span class="t"> снизу</span></button>
    <button data-v="side" title="Вид сбоку — на боковую грань, по горизонтали">◁<span class="t"> сбоку</span></button>
    <button data-v="edge" title="Вид сбоку — на боковое ребро">◇<span class="t"> ребро</span></button>
    <button data-v="face" title="Вид прямо на боковую грань — перпендикулярно ей">◢<span class="t"> грань</span></button>
    <button data-v="iso" title="Вид в три четверти, как в начале">⬙<span class="t"> 3D</span></button>
  </div>
  <div class="row"><button id="bView" title="Приближение и сдвиг — как было">⌖<span class="t"> вид</span></button><button id="bClr" title="Всё как было: убрать достроенное, вернуть сдвинутые и перевёрнутые части">✕<span class="t"> как было</span></button></div>
  </div>
  <div id="count"></div>
</div>
<script>
const cv = document.getElementById("cv"), ov = document.getElementById("ov"), o2 = ov.getContext("2d");
const NOTE_COL = ["#ff5f6d", "#ff9f43", "#ffe066", "#7ee787", "#4dd4ff", "#6b8cff", "#c38cf5"];
let L = 4, X = 0.35, showUp = true, showOct = true, showDn = true, spin = true, yaw = 0.5, pitch = 0.35;
let spd = 1;   // v0.006: скорость вращения, щелчок по ×N удваивает
let slice = 0, showFace = true, showEdge = true, colorOn = true;   // v0.005: срез (0 — все слои), грани, рёбра, цвет
// рёбра единичного тетраэдра от вершины вниз: основание — правильный треугольник, высота √(2/3)
const H = Math.sqrt(2 / 3), R0 = 1 / Math.sqrt(3);
const E = [0, 1, 2].map(i => { const a = Math.PI / 2 + i * 2 * Math.PI / 3; return [R0 * Math.cos(a), -H, R0 * Math.sin(a)]; });
const P = (i, j, k) => [i * E[0][0] + j * E[1][0] + k * E[2][0], i * E[0][1] + j * E[1][1] + k * E[2][1], i * E[0][2] + j * E[1][2] + k * E[2][2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const centroid = (v) => v.reduce((s, q) => add(s, q), [0, 0, 0]).map(x => x / v.length);
// v0.005: заготовки частей (вершина решётки p = 0): 0 — тетраэдр остриём вверх, 1 — октаэдр, 2 — тетраэдр остриём вниз
const S3 = add(add(E[0], E[1]), E[2]);
const TV = [[[0, 0, 0], E[0], E[1], E[2]], [E[0], E[1], E[2], add(E[0], E[1]), add(E[1], E[2]), add(E[0], E[2])], [add(E[0], E[1]), add(E[1], E[2]), add(E[0], E[2]), S3]];
// грани октаэдра: вершины a, b, c, a+b, b+c, a+c — восемь треугольников
const OCT_F = [[0,1,3],[1,2,4],[2,0,5],[3,4,5],[0,3,5],[1,4,3],[2,5,4],[0,1,2]];
const TF = [[[0,1,2],[0,2,3],[0,3,1],[1,3,2]], OCT_F, [[0,1,2],[0,1,3],[1,2,3],[0,2,3]]];
const TE = TF.map(fs => { const s = new Map(); fs.forEach(f => [[f[0], f[1]], [f[1], f[2]], [f[2], f[0]]].forEach(([a, b]) => s.set(Math.min(a, b) + ":" + Math.max(a, b), [a, b]))); return [...s.values()]; });
const TC = TV.map(centroid), T_KIND = ["up", "oct", "dn"];
const removed = new Set();   // v0.003: части пирамиды, которые сдвинули или перевернули (их копии — среди extra); v0.005 — числа keyOf
const keyOf = (t, i, j, k) => (((L * 3 + t) * 65 + i) * 65 + j) * 65 + k;
const colOf = (pc) => pc.col || (pc.kind === "up" ? NOTE_COL[pc.layer % 7] : pc.kind === "oct" ? "#8fa3b8" : "#5b4a7a");
const rgb = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const NOTE_RGB = NOTE_COL.map(rgb), OCT_RGB = rgb("#8fa3b8"), DN_RGB = rgb("#5b4a7a");
function inv3(m){   // обратная к 3×3 (по строкам)
  const [a, b, c] = m[0], [d, e, f] = m[1], [g2, h, i] = m[2], det = a * (e * i - f * h) - b * (d * i - f * g2) + c * (d * h - e * g2);
  return [[(e * i - f * h) / det, (c * h - b * i) / det, (b * f - c * e) / det], [(f * g2 - d * i) / det, (a * i - c * g2) / det, (c * d - a * f) / det], [(d * h - e * g2) / det, (b * g2 - a * h) / det, (a * e - b * d) / det]];
}
const cols3 = (v) => [0, 1, 2].map(r => [1, 2, 3].map(c => v[c][r] - v[0][r]));   // столбцы — рёбра от вершины 0 к 1, 2, 3
const TINV = TV.map(t => inv3(cols3(t)));
function affine(pc){   // достроенная часть = M · заготовка + o (M — отражение / поворот, найдена по четырём вершинам)
  const V = cols3(pc.v), Ti = TINV[pc.tpl], M = [0, 1, 2].map(r => [0, 1, 2].map(c => V[r][0] * Ti[0][c] + V[r][1] * Ti[1][c] + V[r][2] * Ti[2][c]));
  const t0 = TV[pc.tpl][0], o = [0, 1, 2].map(r => pc.v[0][r] - (M[r][0] * t0[0] + M[r][1] * t0[1] + M[r][2] * t0[2]));
  return { M, o };
}
// ── v0.005: части — записи в общих массивах; в текстуре данных по 4 текселя на часть ──
const TW = 4096, PER_ROW = TW / 4;
let cap = 0, N = 0, nP = 0, DATA = null, C0 = null, PI = null, ORD = null, ZK = null, KEY = null, TMP = null, dataVer = 0, cnt = { up: 0, oct: 0, dn: 0 };
let extra = [], hover = null, note = "", noteT = 0;
function setInst(n, o, tp, M, c, ctr){   // M — по строкам; в текстуру идут столбцы
  const d = n * 16;
  DATA[d] = o[0]; DATA[d + 1] = o[1]; DATA[d + 2] = o[2]; DATA[d + 3] = tp;
  for (let col = 0; col < 3; col++) { const q = d + 4 + col * 4; DATA[q] = M[0][col]; DATA[q + 1] = M[1][col]; DATA[q + 2] = M[2][col]; DATA[q + 3] = c[col]; }
  C0[n * 3] = ctr[0]; C0[n * 3 + 1] = ctr[1]; C0[n * 3 + 2] = ctr[2];
}
const ID3 = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
function writeExtra(pc, n){ const { M, o } = affine(pc); setInst(n, o, pc.tpl + (pc.ref ? 4 : 0), M, rgb(colOf(pc)), centroid(pc.v)); }
function rebuild(){
  const tet = (m) => m > 0 ? m * (m + 1) * (m + 2) / 6 : 0, need = tet(L) + tet(L - 1) + tet(L - 2) + extra.length + 1;
  if (need > cap) grow(need);
  N = 0; cnt = { up: 0, oct: 0, dn: 0 };
  const put = (t, i, j, k, layer, p) => {
    if (slice && layer !== slice - 1) return;
    if (removed.has(keyOf(t, i, j, k))) return;
    const n = N++; setInst(n, p, t, ID3, t === 0 ? NOTE_RGB[layer % 7] : t === 1 ? OCT_RGB : DN_RGB, add(p, TC[t]));
    PI[n * 4] = t; PI[n * 4 + 1] = i; PI[n * 4 + 2] = j; PI[n * 4 + 3] = k; cnt[T_KIND[t]]++;
  };
  for (let i = 0; i <= L; i++) for (let j = 0; i + j <= L; j++) for (let k = 0; i + j + k <= L; k++) {
    const n = i + j + k, p = P(i, j, k);
    if (n <= L - 1 && showUp) put(0, i, j, k, n, p);
    if (n <= L - 2 && showOct) put(1, i, j, k, n + 1, p);
    if (n <= L - 3 && showDn) put(2, i, j, k, n + 2, p);
  }
  nP = N;
  extra.forEach((pc, x) => { pc._n = -1; if (slice && pc.layer !== slice - 1) return; const n = N++; pc._n = n; writeExtra(pc, n); PI[n * 4] = -1 - x; });
  for (let n = 0; n < N; n++) ORD[n] = n;
  hover = null; dataVer++;
  if (gl) { upload(0, N); gl.bindBuffer(gl.ARRAY_BUFFER, ordBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, ORD, 0, N); }
}
