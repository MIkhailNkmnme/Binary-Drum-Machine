<!-- Zerkalius Пирамида — v0.021. Сверху одна, под ней три, под ними шесть, дальше десять… — пирамида из тетраэдров и октаэдров. -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerkalius Пирамида — v0.021</title>
<!--
  ═══ ПИРАМИДА (заведена 2026-09-29) ═══════════════════════════════════════════════════════════════
  Вопрос пользователя: «а можно ли вообще расположить единичные [тела] гранями друг к другу так: 1, 2, 3» → «верх, под ней 3,
  под ней ещё больше, и т. д.».
  Ответ — да, но не одними бипирамидами (у них боковые грани наклонные: цепочка грань к грани закручивается спиралью, а вокруг
  ребра пять тетраэдров оставляют щель ~7,4°). Без щелей это делают тетраэдры вместе с октаэдрами: тетраэдрово-октаэдрическая
  укладка пространства. Большой тетраэдр со стороной L режется на:
    ▲ тетраэдры остриём вверх — в слое n (сверху, с нуля) их (n+1)(n+2)/2: 1, 3, 6, 10… (всего L(L+1)(L+2)/6);
    ◆ октаэдры — между слоями: 0, 1, 3, 6… (всего (L−1)L(L+1)/6);
    ▼ тетраэдры остриём вниз — в провалах: 0, 0, 1, 3… (всего (L−2)(L−1)L/6).
  Каждая грань любой части прилегает к грани соседа целиком: ▲ и ▼ — только к октаэдрам, октаэдр — к тем и другим.
  Точки решётки: P(i, j, k) = i·e1 + j·e2 + k·e3, где e1, e2, e3 — рёбра единичного тетраэдра от вершины вниз, i + j + k ≤ L.
  «Раздвинуть» — каждая часть отъезжает от центра пирамиды, и слои 1-3-6 видны поштучно.
  Рисуется на холсте: грани всех частей сортируются по глубине (художник), полупрозрачная заливка и рёбра.
  v0.002, «сделай приближение, масштабирование и достройку отражения от любой грани по клику»: колесо / два пальца — ближе-дальше
  к точке под курсором; правая кнопка, Shift или два пальца — сдвиг вида; щелчок по грани — зеркальная копия этой части через эту
  грань (садится вплотную, грань к грани); по достроенным тоже можно щёлкать; такая часть уже стоит — второй раз не ставится.
  Грань под курсором обведена. ⌖ — вид как был, ✕ — убрать достроенное.
  v0.003, «а также переворачивать ромбы и перемещать»: режим щелчка — ⟲ отражать (как в v0.002) / ✥ двигать (тащишь часть в плоскости
  экрана, отпустил — защёлкивается: её первая вершина встаёт в ближайший узел решётки i·e1 + j·e2 + k·e3, где стоят все вершины укладки,
  поэтому часть снова может сесть грань к грани) / ⇅ переворачивать (поворот на 180° вокруг горизонтали через середину части: тетраэдр
  «остриём вверх» становится «остриём вниз», ровно как в провалах укладки; октаэдр при этом совпадает сам с собой). Части самой пирамиды
  тоже двигаются и переворачиваются: тронутая уходит из пирамиды (removed) и становится своей копией среди достроенных. ✕ — всё как было.
  v0.004, «на мобильном меню на пол-экрана, всё перекрывает, минимализируй»: на узком экране (≤ 600 px) панель — узкая полоса внизу:
  кнопки только значками (слова в span.t спрятаны, смысл — в title), оба ползунка в одну строку, счёт мелко. Кнопка ▾ у заголовка
  сворачивает панель до одной строки «ПИРАМИДА ▸» (на телефоне свёрнута с самого начала, на компьютере — открыта); выбор помнится
  в localStorage piramida_min.
  v0.005, «а если до 64 слоёв? и возможность отключать цвет, чисто рёбрами, и несколько видов сверху, сбоку, и ещё кнопки»:
  в 64 слоях 131 тыс. частей и 700 тыс. граней — холст 2D с сортировкой каждой грани такого не тянет, поэтому рисует WebGL2.
  Части не хранятся объектами: каждая — запись в текстуре данных (4 текселя: сдвиг o и номер заготовки; столбцы матрицы M с цветом),
  вершина = M · заготовка + o (заготовки: 0 — тетраэдр ▲, 1 — октаэдр, 2 — тетраэдр ▼; у пирамиды M единичная, у достроенных —
  отражение или поворот, считается по четырём вершинам). Прозрачность: части сортируются по глубине на процессоре (поразрядно,
  16 бит), а внутри части сначала идут дальние грани, потом ближние (сетка части — две копии граней, лишние сворачиваются
  в шейдере) — как художник у v0.004, только по частям. Щелчок и наведение ищут грань на процессоре: сначала отбор по центру
  части, потом треугольники. Новые кнопки: ▣ грани, ╱ рёбра, ◐ цвет (выключить — всё одним светлым), «Срез» — один слой из L;
  виды ⊤ сверху, ⊥ снизу, ◁ сбоку (на боковую грань по горизонтали), ◇ на ребро, ◢ на грань (перпендикулярно боковой грани),
  ⬙ 3D — поворот плавный, вращение при этом останавливается; 📷 — картинка PNG. Ползунки со стрелками ◂ ▸ (общий slider-arrows.js).
  v0.006, «кнопку скорости — умножает на 2 каждый раз»: рядом с ⟳ кнопка ×N — скорость вращения; щелчок удваивает
  (×1 → ×2 → … → ×32), после ×32 — снова с ×¼. Если вращение стояло, щелчок его включает.
  v0.007, «номер версии не видно после заголовка»: #ver переехал из правого нижнего угла (на телефоне он был спрятан) в заголовок
  панели — сразу после «ПИРАМИДА», виден и в свёрнутой панели.
  v0.008, «×512»: скорость удваивается до ×512 (прежде до ×32), после ×512 — снова ×¼.
  v0.009, «смена вида пусть не останавливает вращение»: goView больше не выключает ⟳ — после плавного перехода вращение
  идёт дальше вокруг вертикали с того же наклона (сверху и снизу — крутится на месте).
  v0.010, «двойной клик — пауза / старт вращения»: два щелчка (касания) в одном месте за 300 мс включают и выключают ⟳.
  Поэтому одиночный щелчок (отразить, перевернуть) выполняется через 300 мс, если второго не было; часть и грань при этом
  берутся в миг щелчка. В режиме ✥ часть снимается с пирамиды только когда её действительно потащили (grabPend), а не
  при нажатии — иначе двойной щелчок оставлял «сдвинутую» часть на прежнем месте.
  v0.011, «кнопка дзен и выход по долгому нажатию, картинку сохранять так, как видно на скорости, ×1024, ползунок на всю
  ширину экрана — плавный, но с метками»:
  ◎ дзен — прячет панель и полосу скорости (body.zen-mode; значок хаба hub-link сам гасит до .18); выход — долгое нажатие
  (600 мс, не сдвигая) на пирамиде или Esc. Скорость — полоса #spdBar внизу во всю ширину: ползунок по степени двойки
  (−2 … 10, т. е. ×¼ … ×1024) с шагом 0,01, у целых степеней прилипает (±0,08); метки ¼ ½ 1 2 … 1024 — щелчок по метке ставит
  её скорость. Кнопка ×N по-прежнему удваивает (до ×1024, потом ×¼) и двигает ползунок. 📷 при вращении складывает 8 последних
  кадров (то, что глаз видит слитно, ~0,13 с при 60 кадрах в секунду): каждый кадр с поворотом на шаг вращения назад,
  среднее по каждой точке; без вращения — один кадр, как было.
  v0.012, «убери выделения текста; под ползунком скорости ещё один — от и до между текущими метками скорости»: на всей
  странице user-select: none (и долгое нажатие на телефоне больше не выделяет и не зовёт меню). Под полосой скорости —
  второй ползунок #sFine: линейно от 2^n до 2^(n+1), где n — метка слева от текущей скорости (fineN; при ×1024 — 512 … 1024),
  с пятью метками (концы и четверти, щелчком ставятся). Пока тянут его, промежуток не меняется (setSpd(v, true)), даже если
  скорость дошла до правой метки; меняют его верхний ползунок, кнопка ×N и метки верхней шкалы.
  v0.013, «ещё режим би-три-рамиды — в каждом ярусе плюс одна»: кнопка ⧫ — вместо укладки тетраэдров и октаэдров ярусы
  треугольных бипирамид (два правильных тетраэдра основанием к основанию: острия вверх и вниз, 5 вершин, 6 граней, 9 рёбер —
  заготовка 3). В ярусе i (сверху, с нуля) их i + 1: центр (j − i/2, −i·H, 0), j = 0 … i; у треугольника-зеркала ребро
  спереди, параллельно оси x. Сбоку это стопка ромбов 1, 2, 3…: соседи в ярусе касаются уголками зеркала, ярус с ярусом —
  тоже в одной точке, без пересечений (грань к грани одинаковые бипирамиды не сходятся, см. шапку v0.001). Цвет — по ярусу. Отражать, двигать,
  переворачивать — как с остальными; щелчок в узел бипирамид (snap по центру: x кратно ½, y кратно H, z = 0). Переключение
  режима убирает достроенное (как ✕). Ключ части — keyOf с L·4 (было L·3: с четвёртой заготовкой номера бы совпали).
  v0.014, «у ползунков скоростей с боков стрелки»: ◂ ▸ по краям обоих ползунков (.sar; общий slider-arrows.js к ним
  по-прежнему не цепляется — data-zerk-arrowed). Верхние — к соседней метке (вдвое медленнее / быстрее), нижние — на 1/100
  промежутка; удержание повторяет (после 380 мс, каждые 70 мс).
  v0.015, «кнопка дзен — отдельно от всех, вверху справа; и кнопку справа посередине по вертикали — нажал и повёл, двигает всё»:
  ◎ (#bZen) ушёл из панели в правый верхний угол, сам по себе; в дзене он остаётся, бледный, и второе нажатие выводит
  (долгое нажатие и Esc — как были). ✥ (#bPan) — у правого края посередине высоты: нажать и вести — сдвигает весь вид
  (panX, panY), как правая кнопка мыши; в дзене спрятан.
  v0.016, «в режиме без радуги нужен выбор цвета»: когда ◐ цвет выключен, рядом появляется квадратик #cMono — выбор цвета
  (input type=color); им красятся и грани, и рёбра (uMonoC в обоих шейдерах, прежде был зашит светлый #cfd9db). Выбор
  помнится (localStorage piramida_mono).
  v0.017, «как скоростями поймать момент, когда кажется, крутится в одну сторону, а потом в другую; существует ли частота
  стояния» → «просто кнопки такие под ползунками, сразу показать»: строка #strobe под ползунками скорости. Поворот за кадр —
  0,004 · скорость, пирамида совпадает сама с собой через 120° (бипирамиды ⧫ — почти через 180°), поэтому
  base = угол / 0,004 (523,6 и 785,4): ■ base — стоит; ⟲ base − 0,5 — медленно назад; ⟳ base + 0,5 — медленно вперёд;
  ✶ base / 2 — два положения чередуются; △ base / 3 — три по кругу. Шаг привязан к кадру, а не ко времени, поэтому стояние
  точное при любой частоте экрана. Набор меняется вместе с режимом (strobeBuild из bBi), нажатая подсвечена.
  v0.018, «сделай бегунки ромбами и стрелки из треугольников равнобедренных»: бегунки обоих ползунков скорости — ромб 14 × 20
  (картинкой SVG в фоне — так одинаково в Chrome и Firefox), верхний зелёный, нижний голубой; метки сдвинуты под середину
  ромба (поле 7 px). Стрелки ◂ ▸ — равнобедренные треугольники 18 × 20 (clip-path, основание 20, боковые ≈ 20,6) цвета своего
  ползунка; буква внутри скрыта, нажатая — ярче.
  v0.019, «на других скоростях тоже надо — пусть при перемещении ползунков для каждого участка найдёт»: кнопки стробоскопа
  считаются заново для промежутка нижнего ползунка (2^n … 2^(n+1)), когда он меняется (из fineBuild). Ищутся скорости, где
  шаг за кадр = p/q периода (период 120°, у бипирамид 180°): s = p/q · base, base = период / 0,004, дробь несократимая, по
  возрастанию q — сначала самые простые (q = 1 — стоит, q = 2 — двоится, q — столько положений по кругу). Первая — с ⟲ и ⟳ по
  бокам (± min(0,5; 0,2 % скорости) — ползёт назад / вперёд), ещё до трёх — следом. На медленных участках q большое
  (сотни положений) — там уже обычное вращение, но точку всё равно видно.
  v0.020, «сделай перемещаемой, кнопки в стандарте ромбов, как последние правки в Zazerkalius (в стиле, не обязательно точно)»
  и «виды — отдельно кнопки»: панель тащится за заголовок (draggable: left/top, место помнится в localStorage piramida_pos,
  двойной щелчок по заголовку — на место). Кнопки рядов, стробоскопа и видов — шестигранники с остриями 120° (--t = 7 px,
  clip-path), первая в ряду — остриём, следующие — выемкой и заходят на t (сцепка, как .tz у конуса Zazerkalius); обводка —
  фоном кнопки, заливка — ::before на 1 px внутри; нажатая — зелёная обводка. Виды (⊤ ⊥ ◁ ◇ ◢ ⬙) и ⌖ ушли из панели
  в отдельную полоску #views вверху посередине — своя ручка ⋮⋮, тоже тащится и помнит место (piramida_views).
  v0.021, «(верх(окта)низ) — так выровняй края ромбами» (запись скобками, как в Zazerkalius): в каждой строке кнопок края
  наружу — остриями, середина — шестигранник ( ), слева от неё — «((» (.cl: остриё влево, выемка справа), справа — «))»
  (.cr); соседи заходят друг в друга на t (.jn). Середина — c = ⌊(n − 1) / 2⌋, при чётном n шестигранник левее середины.
  Строки считаются по факту раскладки (кнопки с одной высотой offsetTop — одна строка, перенос — новая), поэтому shapeRows
  зовётся при изменении размеров (ResizeObserver) и после пересборки стробоскопа; два прохода — после сцепки строки могут
  перестроиться.
  Там же, «ползунки — как у скоростей, числа слева-справа от бегунков и название там же»: Слоёв / Раздвинуть / Срез — ромб-бегунок
  и треугольные стрелки ◂ ▸ (data-for — шаг ползунка, удержание повторяет), подпись «название число» (.slab) едет рядом
  с бегунком — справа от него, а у правого края — слева (placeLabels из ui() и при изменении размеров).
-->
<style>
  :root{ --bg:#050608; --panel:rgba(12,14,18,.92); --line:#2a3038; --fg:#cfd8dc; --dim:#7d8388; --acc:#7ee787; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.35 system-ui, sans-serif; overflow:hidden; }
  body{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #cv, #ov{ position:fixed; inset:0; width:100%; height:100%; }
  #cv{ touch-action:none; cursor:grab; }
  #ov{ pointer-events:none; }
  #panel{ position:fixed; left:12px; top:12px; width:230px; max-height:calc(100% - 124px); overflow:auto; box-sizing:border-box; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  #panel h1{ margin:0; font-size:14px; letter-spacing:2px; color:var(--acc); font-weight:600; display:flex; align-items:center; }
  #bMin{ flex:0 0 auto; margin-left:auto; padding:0 6px; border:none; background:none; color:var(--dim); font-size:14px; letter-spacing:0; }
  #panel.min > :not(h1){ display:none; }
  #panel.min{ width:auto; padding:6px 8px; }
  .sl{ display:flex; flex-direction:column; gap:4px; }
  .scol{ position:relative; }
  .slab{ position:absolute; top:3px; left:0; font:11px/16px system-ui, sans-serif; color:var(--dim); background:rgba(12,14,18,.88); padding:0 4px; border-radius:3px; pointer-events:none; white-space:nowrap; }
  .slab b{ color:var(--fg); }
  input[type=range]{ width:100%; }
  .rows{ display:flex; flex-direction:column; gap:4px; }
  .row{ display:flex; gap:4px; flex-wrap:wrap; }
  button{ flex:1 0 auto; background:#0c0f14; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:5px 6px; cursor:pointer; font:inherit; }
  button.on{ color:var(--fg); border-color:var(--acc); }
  #count{ color:var(--dim); font-size:12px; }
  #cMono{ flex:0 0 auto; width:32px; height:28px; padding:2px; border:1px solid var(--line); border-radius:4px; background:#0c0f14; cursor:pointer; display:none; }
  #cMono.show{ display:block; }
  .srow{ display:flex; align-items:flex-start; gap:6px; }
  #strobe{ display:flex; gap:4px; justify-content:center; margin-top:3px; }
  #strobe button{ flex:0 1 auto; padding:2px calc(var(--t) + 5px); font:11px/18px monospace; }
  body{ --t:7px; }
  .row > button, #strobe > button, #views > button{ position:relative; isolation:isolate; border:none; border-radius:0; background:var(--line); clip-path:polygon(var(--t) 0, calc(100% - var(--t)) 0, 100% 50%, calc(100% - var(--t)) 100%, var(--t) 100%, 0 50%); }
  .row > button::before, #strobe > button::before, #views > button::before{ content:""; position:absolute; inset:1px; z-index:-1; background:#0c0f14; clip-path:polygon(var(--t) 0, calc(100% - var(--t)) 0, 100% 50%, calc(100% - var(--t)) 100%, var(--t) 100%, 0 50%); }
  .row > button.jn, #strobe > button.jn, #views > button.jn{ margin-left:calc(1px - var(--t)); }
  .row > button.cr, #strobe > button.cr, #views > button.cr, .row > button.cr::before, #strobe > button.cr::before, #views > button.cr::before{ clip-path:polygon(0 0, calc(100% - var(--t)) 0, 100% 50%, calc(100% - var(--t)) 100%, 0 100%, var(--t) 50%); }
  .row > button.cl, #strobe > button.cl, #views > button.cl, .row > button.cl::before, #strobe > button.cl::before, #views > button.cl::before{ clip-path:polygon(var(--t) 0, 100% 0, calc(100% - var(--t)) 50%, 100% 100%, var(--t) 100%, 0 50%); }
  .row > button:hover, #strobe > button:hover, #views > button:hover{ background:#4a525c; }
  .row > button.on, #strobe > button.on, #views > button.on{ background:var(--acc); }
  .row > button{ padding:5px calc(var(--t) + 6px); }
  .row, #strobe{ gap:3px 0; }
  #panel h1{ cursor:move; touch-action:none; }
