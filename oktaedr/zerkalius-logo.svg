<!-- Зеркалидус (v 2026-09-29, «Зеркалидус — это Три, переделай знак»): треугольная пирамида и её зеркало — Трёхгранидус.
     Экватор — три вершины, передняя к нам; спереди видны четыре грани (две верхние, две нижние), невидимо одно ребро —
     заднее ребро экватора. Строки бит — вдоль переднего ребра экватора; нижние грани — те же строки, инвертированные. -->
