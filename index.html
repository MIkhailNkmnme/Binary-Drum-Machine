    <title>Zerkalius Control Hub — v0.091</title>
    <!-- v0.041, «oktaedr — лого на сайт»: знак Zerkalius — значком вкладки; на остальных страницах его ставит _js/hub-link.js -->
    <link rel="icon" type="image/svg+xml" href="oktaedr/zerkalius-mark.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        html, body { height: 100%; }
        body {
            position: relative;
            display: flow-root;   /* отступ меню на телефоне остаётся внутри фона, не сдвигает весь body */
            background: #050505;
            color: #00ff66;
            font-family: 'Consolas', 'Roboto Mono', monospace;
            margin: 0;
            overflow: hidden;
        }

        /* Живой фон: обои Zerkalius. Кликам не мешает — события проходят насквозь */
        #bg {
            position: fixed; inset: 0; width: 100%; height: 100%;
            border: 0; z-index: 0; pointer-events: none;
            visibility: hidden;   /* v0.059, «крутящийся конус пока отключи»: не виден, но работает — звук нот играет в нём */
        }

        /* Всё содержимое — поверх фона. Надпись Zerkalius рисуют сами обои, сверху */
        /* v0.048: две главные кнопки — в одну строку (узко — переносятся) */
        .mainrow { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
        .hub {
            position: relative; z-index: 1;
            height: 100vh; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding: 0 24px max(6vh, 44px);   /* v0.049: снизу — не меньше 44 px: под нижней панелью номер версии (.ver, bottom 10px) */
            gap: 22px;
        }

        /* Заголовок для программ чтения и поисковиков; на экране надпись дают обои */
        h1 {
            position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; margin: 0;
        }
        /* v0.038: надпись сверху — прежде её рисовали обои; теперь фон — конус, надпись даёт хаб. Переливается, как кнопки */
        #hubTitle {
            position: fixed; left: 0; right: 0; top: 5vh; z-index: 1; pointer-events: none; text-align: center;
            font: bold clamp(44px, 10vw, 150px)/1 Consolas, "Roboto Mono", monospace; letter-spacing: .04em;
            color: transparent; background: linear-gradient(90deg, #ff5f6d, #ffc371, #6ee7a0, #22d3ee, #b98cf0, #ff5f6d);
            background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
            filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 18px rgba(255, 209, 102, .35));
            animation: hubTitleHue 14s linear infinite;
        }
        @keyframes hubTitleHue { to { background-position: 300% 0; } }
        /* v0.076, по снимку «Сцены 1» из «△ Сетки» Zazerkalius (надпись из треугольников) — «в хаб надо как-то закинуть»: надпись — на прежнем месте
           заголовка (сверху, 5vh, ряд высотой clamp(44px, 10vw, 150px) — под ним ноты). Треугольники — маской (SVG, каждый чуть сжат к своему центру —
           швы между ними), заливка — та же переливающаяся радуга, что была у прежней надписи (#hubTitle, снята в v0.039) */
        #hubLogo { position: fixed; left: 50%; top: 5vh; transform: translateX(-50%); z-index: 1; pointer-events: none; height: clamp(44px, 10vw, 150px);
                   width: min(92vw, 820px); display: flex; align-items: center; justify-content: center;
                   filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 14px rgba(255, 209, 102, .3)); }
        /* v0.077, по снимку «◇ Ромбоидов» Zazerkalius — «как тебе отправить для вставки в индекс хаб», «для хаба Зеркалиус», «да, делай и волну»: надпись —
           «Зеркалиус» строками пиксельного шрифта «Аа» (Zazerkalius v0.848, со строчными), бит — ромб из двух треугольников, ряды вбок «←» — как в окне
           «◇ Ромбоиды» («◇ бит», «▵ каждый»). Рисуется на холсте (#hubLogoCv, скрипт в конце страницы): единицы — светлые, нули — серые, по каждому
           треугольнику тёмная грань; волна — полоса света бежит слева направо, единицы под ней загораются цветами радуги прежней надписи */
        #hubLogoCv { display: block; width: 100%; height: 100%; }
        @media (prefers-reduced-motion: reduce) { #hubTitle { animation: none; } }
        .ver {
            font-size: 11px; letter-spacing: 3px; color: #9fffc8;
            text-shadow: 0 0 6px #000;
            /* v0.008: плашка — на бегущих цифрах обоев голый номер терялся */
            background: rgba(0,0,0,.78); border: 1px solid rgba(0,255,102,.35); border-radius: 3px; padding: 2px 8px 2px 11px;
            /* v0.045, «это вниз»: номер — внизу по центру экрана (наверху теперь ♫ Звук) */
            position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 5;   /* v0.053, «наверх» */
        }

        /* v0.017: «тормоза при наведении на кнопку». У кнопок было своё размытие фона (backdrop-filter) поверх
           живых обоев — браузер размывал их заново на каждом кадре, а у кнопок лаборатории размытие сидело ещё и
           внутри размытой панели. Наведение добавляло увеличение и переход «всего подряд» на четверть секунды,
           включая широкое свечение. Теперь у кнопок размытия нет (фон чуть плотнее), плавно меняются только
           цвет и сдвиг, а свечение включается сразу. Размытие у панелей осталось — оно одно и не вложенное. */
        .menu-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            transition: none;   /* v0.019: наведение — мгновенно; плавный переход казался вялой реакцией */
            box-sizing: border-box;
        }

        /* Флагман */
        .menu-btn.main-engine {
            width: 340px;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 4px;
            border: 2px solid #00ff66;
            color: #00ff66;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.35);
        }
        .menu-btn.main-engine:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 25px #00ff66;
            transform: scale(1.02);
        }

        /* v0.079, по снимку главных кнопок — «эти кнопки в Хабе тоже надо сделать из ромбов — текст»: надпись «Треугольник» / «Зазеркалиус» — строками
           шрифта «Аа» Zazerkalius, бит — ромб (▲ + ▼, чуть сжат к своему центру — швы), ряды вбок «←», как надпись «Зеркалиус» над нотами. Ромбы — маской
           (SVG собирает скрипт в конце страницы), заливка — цвет кнопки (currentColor): перелив hue-main и чёрный при наведении работают как прежде.
           Сбойные полосы этих двух кнопок не трогают — полоса рисует текст буквами */
        .menu-btn.main-engine.rmbOn { padding: 14px 18px; font-size: 0; letter-spacing: 0; }
        /* v0.084, по снимку «△ Сетки» Zazerkalius с двумя фигурами — «сделай такие границы, форму для кнопок», «это две кнопки, вытянутые 4 грани, трапеции»:
           главные кнопки — трапеции с боками под 60°, рамка — один ряд треугольников по краю (каждый чуть сжат к центру — швы). «Треугольник» — узким краем
           вверх (как ▲), «Зазеркалиус» — зеркально, узким вниз (как ▼). Размеры по сетке: сторона треугольника s = ширина / m (целое m), высота — 4 ряда
           (2√3·s), скос — 2s; всё считает скрипт (mainFrame) и кладёт в --bh, --px, --cp (форма), --fm (маска рамки). Рамка — цветом кнопки (currentColor) */
        .menu-btn.main-engine.rmbOn.fmOn { border: none; border-radius: 0; display: flex; align-items: center; height: var(--bh); padding: 0 var(--px); clip-path: var(--cp); }
        .menu-btn.main-engine.rmbOn.fmOn::before { content: ''; position: absolute; inset: 0; background: currentColor; pointer-events: none;
            -webkit-mask: var(--fm) 0 0 / 100% 100% no-repeat; mask: var(--fm) 0 0 / 100% 100% no-repeat; }
        /* v0.085, по снимку кнопки v0.084 — «да, обеим кнопкам такую, только это просто обводка нужна; оставь внутреннюю, а сами треугольники не нужны»:
           обе кнопки — одна трапеция узким краем вверх; рамки из треугольников нет, осталась её внутренняя граница — тонкая обводка цветом кнопки.
           Кнопка обрезана по этой границе (--cp), обводка — маска --fm (контур, 2 px внутрь); места по сетке те же */
        .menu-btn.main-engine .rmbTxt { display: block; width: 100%; background: currentColor;
            -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }

        /* Панели разделов: полупрозрачное стекло поверх обоев */
        .panel {
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(0, 255, 102, 0.18);
            border-radius: 10px;
            padding: 14px 16px 16px;
            /* v0.019: размытие обоев под панелями снято — оно пересчитывалось на каждом кадре обоев;
               вместо него фон плотнее */
        }
        .panel-title {
            font-size: 11px;
            color: #6fbf91;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 12px;
            font-weight: bold;
            text-align: center;
            user-select: none;
        }

        /* v0.043: ♫ Звук живого фона; v0.044 — вверху по центру, пока звучит — рамка мигает */
        /* v0.050: два значка рядом — ♫ строки и ♪ столбцы, каждый своей головкой */
        /* v0.051, «значки нот пониже и побольше»: под надписью Zerkalius (она сверху, 5vh, высотой в clamp ниже), 40 px */
        /* v0.054: семь нот словами (До…Си) — 30 px, в строку, на узком экране переносятся; выключенная — серая, включённая — своим цветом --c */
        #hubSndBox { position: fixed; left: 50%; top: calc(5vh + clamp(44px, 10vw, 150px) + 12px); transform: translateX(-50%); z-index: 5;
                     display: flex; flex-direction: column; align-items: center; width: max-content; max-width: calc(100vw - 32px); font-size: 30px; }
        /* v0.060, «1-2-3-1 — такой треугольник-стрелка»: ряды 1, 2, 3 — наконечник, четвёртый — древко под серединой.
           v0.063, «ноты обрамить каждую ромбом, чтобы в общем получилась»: каждая нота — в ромбе (--dw × --dh), ромбы в ряду касаются боковыми
           вершинами, ряд заходит в ряд на полромба — наконечник складывается из ромбов ребро к ребру; Си — древко, касается Соль вершиной.
           Ромб — clip-path, поэтому и нажимается только ромб (углы соседних не мешают). Рамка — фон кнопки, середина — тёмный ::before */
        #hubSndBox .nrow { display: flex; justify-content: center; gap: 0; font-size: .7em; --dw: 4.9em; --dh: 3.1em; }
        #hubSndBox .nrow.n2, #hubSndBox .nrow.n3 { margin-top: calc(var(--dh) / -2); }
        .hubSnd { position: relative; isolation: isolate; width: var(--dw); height: var(--dh); padding: 0; text-align: center; white-space: nowrap;
                  font: bold 1em/1 system-ui, sans-serif; cursor: pointer; color: #7d8388; border: none; background: #4a5056;
                  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); text-shadow: 0 0 6px #000, 0 0 3px #000; }   /* v0.054 — серая, пока выключена */
        .hubSnd::before { content: ''; position: absolute; inset: 2px; z-index: -1; background: rgba(6, 8, 10, .92); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
        .hubSnd.glitch::before { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); transform: none; }   /* v0.067: сбой смены языка не режет середину ромба (иначе ромб на миг серел полосами) */
        @media (hover: hover) { .hubSnd:hover { color: #c9ced2; background: #7d8388; } }   /* v0.058: на пальце наведение «залипало» */
        /* v0.058: касание — сразу, без вспышки, без меню долгого нажатия и выделения текста */
        .hubSnd { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
        @media (pointer: coarse) {   /* v0.058: палец; v0.063 — ромбы по ширине экрана */
            #hubSndBox { font-size: clamp(20px, 6.4vw, 30px); max-width: calc(100vw - 16px); }
        }
        .hubSnd.on { color: var(--c); background: var(--c); animation: hub-snd-blink 1.1s ease-in-out infinite; }
        /* v0.083, на v0.081–v0.082 — «лучше в этот треугольник», «7 строк — как раз 0-треугольник, первый из 7 строк нулей, перевёрнутый, как раз 7 нот; пусть
           прям биты-ноты стекают вниз через узкое место — вершину треугольника — и только отсюда выходят в общий треугольник»; «треугольник ниже» (под надпись).
           Кнопка «все 7 нот» #hubAll — первая перевёрнутая дырка Серпинского (строки 8–14 при 64): по строке на ноту, сверху До (7 бит) … внизу Си (1 бит).
           Сама кнопка прозрачна (форма — clip-path по контуру дырки, ставит скрипт), всё видимое рисует холст #hubFly: цветные биты, их сток через вершину
           вниз, в общий треугольник, серая дырка с мигающей границей, пока ноты звучат (пауза — граница не мигает); второе нажатие — биты стекают обратно.
           Семь отдельных нот при этом спрятаны (body.allMode); лёжа на телефоне — прежняя стрелка нот. Меню — на прежнем месте */
        /* v0.085, на v0.083 — «сейчас они как и раньше с вершины начинают движение; надо, чтобы отсюда прямо эти же ромбы уходили, по одному за одно нажатие,
           по 1 ноте, по кругу: 7 нажатий — семь нот вылетело, потом следующие»: нажатие выпускает один бит дырки — по кругу До, Ре … Си (из каждой строки —
           ближний к середине), потом второй круг из оставшихся, и так все 28. Первый бит ноты включает её звук; бит идёт к вершине дырки и оттуда летит прямо
           в свою бегущую головку в треугольнике и сливается с ней. Ушедший бит оставляет серое место; граница дырки мигает, пока что-то звучит. Дырка пуста —
           нажатие выключает все ноты, биты возвращаются на места */
        #hubAll, #hubFly { display: none; }
        #hubAll { position: fixed; z-index: 5; padding: 0; border: none; background: transparent; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        #hubFly { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 6; pointer-events: none; }
        body.allMode #hubAll, body.allMode #hubFly { display: block; }
        body.allMode #hubSndBox { display: none; }
        @media (hover: hover) { #hubAll:not(.on):hover + #hubFly { filter: brightness(1.35); } }
        /* v0.061: ⏺ видеозапись хаба — правый верхний угол; идёт запись — красная, мигает */
        #hubRec { position: fixed; right: 10px; top: 6px; z-index: 6; font: 22px/1 system-ui, sans-serif; padding: 4px 8px; cursor: pointer; color: #7d8388;
                  background: none; border: none; text-shadow: 0 0 6px #000; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        @media (hover: hover) { #hubRec:hover { color: #ff6b7a; } }
        #hubRec.on { color: #ff4d5e; animation: hub-rec-blink 1s ease-in-out infinite; }
        @keyframes hub-rec-blink { 50% { opacity: .4; } }
        #hubSndBox.paused .hubSnd.on { animation: none; opacity: .8; }   /* v0.056: пауза — ноты горят, но не мигают */
        /* v0.055: щелчок по запертому меню — серые ноты вспыхивают своим цветом (включи нас) */
        #hubSndBox.nudge .hubSnd:not(.on) { animation: hub-snd-nudge .42s ease-in-out 3; }
        @keyframes hub-snd-nudge { 50% { color: var(--c); text-shadow: 0 0 16px var(--c), 0 0 4px #000; transform: scale(1.15); } }
        body.hush .hub a.menu-btn { pointer-events: auto; cursor: not-allowed; }
        @keyframes hub-snd-blink { 0%, 100% { opacity: 1; text-shadow: 0 0 14px var(--c), 0 0 4px #000; } 50% { opacity: .45; text-shadow: 0 0 2px var(--c), 0 0 4px #000; } }   /* v0.054: свечение — цветом ноты */
        /* v0.051: пока музыка не включилась — меню притушено; первый щелчок включает звук, меню светлеет */
        .hub .mainrow, .hub .panel { transition: opacity .6s; }
        body.hush .hub .mainrow, body.hush .hub .panel { opacity: .28; }
        body.hush { cursor: pointer; }
        /* v0.067, «запустить нажатием — отправить в бесконечность»: нажатая кнопка вспыхивает и улетает вдаль — к середине экрана (--lx, --ly),
           сжимаясь в точку и тая; страница открывается, когда долетела */
        .menu-btn.launch { position: relative; z-index: 20; pointer-events: none; animation: hub-launch .65s cubic-bezier(.55, 0, .9, .45) forwards; }
        @keyframes hub-launch { 0% { transform: none; opacity: 1; } 22% { transform: scale(1.08); opacity: 1; filter: brightness(1.7); }
                                100% { transform: translate(var(--lx, 0), var(--ly, -30vh)) scale(.02); opacity: 0; filter: brightness(2.2) blur(1px); } }
        /* Лаборатория — сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 170px);
            gap: 10px;
        }
        /* Знак и записи — одна строка */
        .row {
            display: flex; gap: 10px; justify-content: center;
        }

        .menu-btn.draft-btn {
            padding: 11px 8px;
            font-size: 14px;
            border: 1px solid rgba(0, 255, 102, 0.22);
            color: #9fdcb8;
            background: rgba(0, 20, 8, 0.6);
        }
        .row .menu-btn.draft-btn { width: 170px; }
        /* v0.091: Синхрофазотрон — битовая надпись (как в шапке страницы) во всю кнопку */
        .menu-btn.sfz-btn { display: flex; align-items: center; justify-content: center; padding: 6px 10px; grid-column: span 2; }   /* «повыше, в длину бы»: на две колонки */
        .menu-btn.sfz-btn svg.sfzlogo { display: block; width: 100%; height: auto; }
        .menu-btn.sfz-btn:hover svg.sfzlogo .s1 { fill: #7fb0ee; }
        .menu-btn.draft-btn:hover {
            border-color: #00ff66;
            color: #00ff66;
            background: rgba(0, 255, 102, 0.10);
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.35);
        }

        /* v0.009: кнопки переливаются теми же цветами, что цифры обоев (зелёный, жёлтый, фиолетовый,
           синий), каждая со своей случайной фазы — не в такт (фазу раздаёт скрипт внизу). Под мышью
           перелив снимается, и кнопка загорается своим обычным зелёным. */
        @keyframes hue-draft {
            0%, 100% { color: #9fdcb8; border-color: rgba(0, 255, 102, 0.35); }
            25%      { color: #ffe08a; border-color: rgba(255, 204, 0, 0.45); }
            50%      { color: #e3a8ff; border-color: rgba(204, 51, 255, 0.45); }
            75%      { color: #a8c6ff; border-color: rgba(64, 128, 255, 0.5); }
        }
        @keyframes hue-main {
            0%, 100% { color: #00ff66; border-color: #00ff66; box-shadow: 0 0 18px rgba(0, 255, 102, 0.5); }
            25%      { color: #ffcc00; border-color: #ffcc00; box-shadow: 0 0 18px rgba(255, 204, 0, 0.5); }
            50%      { color: #d24dff; border-color: #d24dff; box-shadow: 0 0 18px rgba(204, 51, 255, 0.5); }
            75%      { color: #4d8dff; border-color: #4d8dff; box-shadow: 0 0 18px rgba(64, 128, 255, 0.55); }
        }
        /* v0.035: стрелки от Треугольника к Битмультфильмам (слово пользователя «сделай стрелки от Треуг — к Результатам»):
           три дорожки во всю ширину главной кнопки, по каждой вниз бегут шевроны; цвет переливается, как у кнопок.
           Отрицательные поля съедают общий зазор .hub, иначе между кнопками стало бы вдвое просторнее. */
        .flow {
            width: 340px; height: 40px; margin: -12px 0; position: relative;
            display: flex; justify-content: space-around; pointer-events: none;
            animation: hue-flow 12s ease-in-out infinite;
        }
        .flow svg { width: 22px; height: 40px; overflow: visible; filter: drop-shadow(0 0 4px currentColor); }
        .flow line { stroke: currentColor; stroke-width: 1.5; opacity: .35; }
        /* v0.036: «оживи вниз-вверх, пусть дёргаются». Вместо плавного бега вниз — рывки: пара шевронов разом
           прыгает вниз и отскакивает вверх, с короткими замираниями; у каждой дорожки свой темп и фаза, чтобы не
           дёргались хором. «Меньше движения» стрелки больше не останавливает — как и смену языка (v0.028): на Windows
           Server оно включено по умолчанию, и стрелки там стояли мёртвыми. */
        .flow path { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
                     animation: flow-jerk 1.25s cubic-bezier(.2, 1.7, .45, 1) infinite; }
        .flow path:nth-of-type(2) { translate: 0 9px; opacity: .55; }
        .flow svg:nth-child(1) path { animation-duration: 1.1s; animation-delay: -.35s; }
        .flow svg:nth-child(2) path { animation-duration: 1.35s; }
        .flow svg:nth-child(3) path { animation-duration: .95s; animation-delay: -.6s; }
        @keyframes flow-jerk {
            0%   { transform: translateY(0); }
            9%   { transform: translateY(20px); }
            16%  { transform: translateY(5px); }
            24%  { transform: translateY(18px); }
            33%  { transform: translateY(0); }
            45%  { transform: translateY(0); }
            51%  { transform: translateY(22px); }
            57%  { transform: translateY(11px); }
            63%  { transform: translateY(22px); }
            74%  { transform: translateY(2px); }
            82%  { transform: translateY(15px); }
            100% { transform: translateY(0); }
        }
        @keyframes hue-flow {
            0%, 100% { color: #00ff66; } 25% { color: #ffcc00; } 50% { color: #d24dff; } 75% { color: #4d8dff; }
        }
        .menu-btn.draft-btn { animation: hue-draft 14s ease-in-out infinite; }
        .menu-btn.main-engine { animation: hue-main 12s ease-in-out infinite; }
        .menu-btn:hover { animation: none; }

        /* v0.018: сбойные полосы, как в обоях (v0.020 — построчно, через весь экран, см. скрипт внизу): на 3 кадра срываются в сторону
           горизонтальные полосы. Полоса — копия надписи (data-text, раздаёт скрипт внизу) на фоне кнопки,
           обрезанная clip-path по высоте и сдвинутая по X. Места и сдвиги на каждом кадре новые — их задаёт
           скрипт через --g1t/--g1b/--g1x и --g2… Псевдоэлементы живут только на время сбоя. */
        .menu-btn, .panel-title { position: relative; }
        .menu-btn.glitch::before, .menu-btn.glitch::after, .panel-title.glitch::before, .panel-title.glitch::after {
            content: attr(data-text); position: absolute; inset: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            background: inherit; color: inherit; border-radius: inherit; letter-spacing: inherit;
        }
        .glitch::before { clip-path: inset(var(--g1t) 0 var(--g1b) 0); transform: translateX(var(--g1x)); }
        .glitch::after  { clip-path: inset(var(--g2t) 0 var(--g2b) 0); transform: translateX(var(--g2x)); }
        .panel-title.glitch::before, .panel-title.glitch::after { background: #030805; }   /* v0.023: и названия групп */
        .menu-btn.main-engine.glitch::before, .menu-btn.main-engine.glitch::after { background: #000; }
        .menu-btn.draft-btn.glitch::before, .menu-btn.draft-btn.glitch::after { background: #00140a; }

        /* Узкий экран: лаборатория в 2 столбца */
        @media (max-width: 960px) {
            .grid { grid-template-columns: repeat(2, 160px); }

        (() => {

                    for (let j = 0; j < c; j++) { if (r[j] !== '1') continue;

               v0.085: от рамки осталась её внутренняя граница — трапеция между рядами 1 и 3: сверху от 2,5s до w − 2,5s, снизу от 1,5s до w − 1,5s */
            const SQ3 = Math.sqrt(3);
            const mainFrame = (a) => {

                    const w = a.offsetWidth; if (!w) return;
                    const m = Math.max(6, Math.round(w / (68 / (2 * SQ3)))), s = w / m, rh = s * SQ3 / 2, h = 4 * rh;
                    const P = [[2.5 * s, rh], [w - 2.5 * s, rh], [w - 1.5 * s, 3 * rh], [1.5 * s, 3 * rh]], pts = P.map(([x, y]) => f(x) + ',' + f(y)).join(' ');

        (function () {
