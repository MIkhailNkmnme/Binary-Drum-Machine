}

function firstDataIdx(){ for (let i = 0; i < st.rows.length; i++) if (st.rows[i].length) return i; return -1; }
function lastDataIdx(){ for (let i = st.rows.length - 1; i >= 0; i--) if (st.rows[i].length) return i; return -1; }
function nextDataIdx(from){ for (let i = from; i < st.rows.length; i++) if (st.rows[i].length) return i; return -1; }

function canShift(){
  const next = st.goingUp ? st.aIdx - 1 : st.bIdx + 1;
  if (next < 0 || next >= st.rows.length) return false;
  if (!st.rows[next].length) return false;
  const p = st.pats[next];
  if (p && p.text && p.text.length >= 2 && !p.found) return false;
  return true;
}

/* Сквозная цепочка для Гориз.XOR — конкатенация ВСЕХ непустых строк СТРОГО ВЫШЕ rowIdx
   (сама rowIdx не входит — она неподвижная "мишень", по которой скользит цепочка).
   Не зависит от st.used[] (тот заполняется только по пути автоперехода и ломается,
   если пара строк выбрана вручную кликом) — всегда полная история сверху.
   БЕЗ st.tailBuffer: он "плавает" по длине от шага к шагу (обрезается до maxPatLen после
   каждого doStep), а длина этой цепочки должна быть СТАБИЛЬНОЙ, пока идёт скольжение по
   одной строке — иначе цель (totalSteps) двигается и проход никогда честно не завершается. */
function horizChainText(rowIdx){
  let text = "";
  for (let i = 0; i < rowIdx; i++){
    if (st.rows[i] && st.rows[i].length) text += getRowBits(st, i);
  }
  return text;
}

/* Один шаг объединённого поиска для Гориз.XOR: chainText (сквозная — уже найденные строки
   выше rowIdx, в порядке horizChainText: строка 0 первая, строка rowIdx-1 последняя) —
   скользит сквозь fullOrigText (chainText + текущее содержимое rowIdx), въезжая СПРАВА
   РЕВЕРСОМ: ведущий край — это ПОСЛЕДНИЙ символ chainText (то есть конец самой НИЖНЕЙ из
   строк цепочки, ближайшей к цели), он первым касается правого края цели; хвост цепочки
   (chainText[0], начало самой ВЕРХНЕЙ строки) подходит только в самом конце прохода. Позиция
   p результата берёт chain[fullLen+chainLen-1-stepNumber-p]. На каждом шаге результат
   содержит текущее состояние всей объединённой строки целиком; поиск паттерна строки rowIdx
   идёт по этому результату целиком, а не только в её собственном окне. */
function applyHorizBigSlide(chainText, fullOrigText, stepNumber){
  const fullLen = fullOrigText.length;
  const chainLen = chainText.length;
  let out = "";
  for (let p = 0; p < fullLen; p++){
    const chainIdx = fullLen + chainLen - 1 - stepNumber - p;
    const origBit = fullOrigText[p];
    if (chainIdx >= 0 && chainIdx < chainLen) {
      const chBit = chainText[chainIdx];
      if ((origBit === "0" || origBit === "1") && (chBit === "0" || chBit === "1")) {
        out += (origBit === chBit) ? "0" : "1";
      } else {
        out += origBit;
      }
    } else {
      out += origBit;
    }
  }
  return out;
}

/* Диапазон позиций p ВСЕЙ объединённой строки fullOrigText (chainText + целевая строка,
   строго в порядке физического стека сверху вниз — chainText[0]=самая верхняя строка,
   конец fullOrigText=целевая/нижняя строка), сейчас накрытых XOR'ом на шаге stepNumber —
   та же формула, что и chainIdx в applyHorizBigSlide, только выражена через p. Единая
   подсветка: сначала растёт ВНУТРИ целевой строки снизу (p ближе к fullLen-1), и только
   после того как дойдёт до её начала (p=chainLen), продолжает расти ВВЕРХ по строкам
   цепочки — никогда не подсвечивает верхние строки раньше, чем целевая пройдена целиком. */
function horizWindowRange(chainLen, fullLen, stepNumber){
  const start = Math.max(0, fullLen - stepNumber);
  const end = Math.min(fullLen - 1, fullLen - stepNumber + chainLen - 1);
  if (end < start) return null;
  return { start, end };
}

/* === МАРКЕР 07: СТЕП И ЛОГИКА === */
/* Черновик последнего шага: фиксирует какие строки взяты, что за операция и что получилось — для визуального Step Log */
function logStep(opName, rowsUsed, resultText, detail, changes, inputs, highlightRange){
  st.lastOp = {
    step: st.step,
    opName: opName,
    rows: rowsUsed,
    result: resultText || "",
    detail: detail || "",
    pattern: null,
    changes: changes || [],
    inputs: inputs || [],
    highlightRange: highlightRange || null
  };
}

function doStep(pairOnly, forceXor = false, isScan = false, isHorizXor = false, isXorProj = false){
  const a = st.aIdx, b = st.bIdx;
  // Гориз.XOR работает с ОДНОЙ строкой (b) — своя цепочка строится из строк строго выше,
  // 'a' ему не нужен. Общая проверка "a!==b, обе непустые" рассчитана на режимы с парой
  // строк и ломает самый первый шаг генерации (после "🌱 Очистить→1" a===b===0).
  if (isHorizXor) {
    if (b < 0 || b >= st.rows.length || !st.rows[b].length) return false;
  } else {
    if (a === b || a < 0 || b >= st.rows.length) return false;
    if (!st.rows[a].length || !st.rows[b].length) return false;
  }

  const isWrap = (b - a) > 1;
  const target = st.goingUp ? a : b;
  const src = st.goingUp ? b : a;

  const isXor = forceXor || (Math.abs(st.rows[a].length - st.rows[b].length) % 2) === 0;

  // Берем биты с учетом возможного инверсного прогона
  const rowA = getRowBits(st, a);
  const rowB = getRowBits(st, b);

  // Гориз.XOR никогда не использует автопропуск через "короткие/уже найденные" строки —
  // у него полностью своя логика перехода между строками (по завершении лапа).
  const shifted = !isWrap && !isHorizXor && canShift();

  // Собираем участвующие строки для визуального отображения в Черновике
  let inputsForLog = [];
  if (!shifted) {
    if (isXorProj) {
      for(let i=0; i<target; i++) inputsForLog.push({ name: `№${i+1}`, text: getRowBits(st, i) });
    } else if (!pairOnly && isXor && !isHorizXor) {
      for(let i=0; i<=b; i++) inputsForLog.push({ name: `№${i+1}`, text: getRowBits(st, i) });
    } else {
      inputsForLog.push({ name: `№${a+1}`, text: rowA });
      if (a !== b) inputsForLog.push({ name: `№${b+1}`, text: rowB });
    }
  }

  if (!shifted && st.autoShift && !st.goingUp && !isHorizXor && !isXorProj) {
    if (st.rows[b] && st.rows[b].length > 1) {
      st.rows[b] = rotateStrRight(st.rows[b]);
    }
  } else if (shifted) {
    st.used[src] = true;
  }

  // Если мы НЕ переходим на новую строку, производим вычисления.
  // Это защищает уже найденную строку от повторной перезаписи!
  if (!shifted) {
    // РЕЖИМ ПРОЕКЦИИ XOR
    if (isXorProj) {
      if (target > 0) {
        snapshot();
        const res = xorRowsDownTo(st.rows, target - 1, st.align, st);
        if (res.length) {
          const before = st.rows[target];
          st.rows[target] = res;
          logStep("Проекция XOR", "1–" + target, res, "XOR строк выше спроецирован на текущую", [{ row: target + 1, before, after: res }], inputsForLog);
          if (!st.running) say(`Проекция XOR: Строки 1-${target} спроецированы на строку ${target+1}`);
        }
      }
    }
    // РЕЖИМ ГОРИЗОНТАЛЬНОГО XOR — единый объединённый поиск.
    // Сквозная строка (все УЖЕ найденные строки выше текущей) — это и есть скользящая
    // цепочка: она въезжает СПРАВА в область текущей строки b (applyHorizBigSlide), проходит
    // полностью, выезжает. Паттерн строки b ищется по ВСЕЙ сквозной строке результата
    // целиком на каждом шаге — не только в окне самой строки. Один непрерывный проход
    // длиной chainLen+fullLen шагов, без "лапов" и повторов. Решение "перейти на след.
    // строку / остановиться" принимается НИЖЕ, после того как весь проход завершится.
    else if (isHorizXor) {
      if (st.lastHorizRow !== b) {
        st.horizXoredLength = 0;
        st.horizFoundInPass = false;
        st.lastHorizRow = b;
        st.horizBigChain = horizChainText(b);
        st.horizBigOrig = st.horizBigChain + rowB;
        st.horizBigTargetIdx = b;
        st.horizChainLen = st.horizBigChain.length + st.horizBigOrig.length;
      }

      if (!rowB.length) return false;

      // Защита от "залипания": если проход уже был исчерпан раньше (totalSteps достигнут),
      // а движение всё равно не смогло перейти/сгенерировать/остановиться (return false) —
      // повторный клик НЕ должен продолжать скользить дальше (шаг 4, 5, 6... без предела).
      // Раз мы вообще дошли досюда — блок ЛОГИКИ ДВИЖЕНИЯ ниже уже решит, что делать дальше.
      if (st.horizChainLen > 0 && st.horizXoredLength >= st.horizChainLen) {
        return false;
      }

      const ownPat = findPatByOrd(b);

      // Уже найденная строка "замораживается" (не пересчитывается заново).
      if (ownPat && ownPat.found) {
        snapshot();
        st.horizFoundInPass = true;
        st.horizChainLen = 1;
        st.horizXoredLength = 1;
        logStep("Гориз.XOR", [b + 1], rowB, "Паттерн уже найден — скольжение пропущено", [], inputsForLog);
        if (!st.running) say(`Гориз.XOR: строка ${b + 1} уже совпала с паттерном — пропускаем скольжение`);
      } else {
        snapshot();

        const stepNumber = st.horizXoredLength + 1; // 1-индексированный номер шага поиска
        const res = applyHorizBigSlide(st.horizBigChain, st.horizBigOrig, stepNumber);
        const rowLenHere = rowB.length;

        // "Хвост" результата (последние rowLenHere символов) показываем в самой строке —
        // для наглядности; реальный поиск идёт по ВСЕЙ сквозной строке res целиком.
        st.rows[b] = res.length >= rowLenHere ? res.slice(-rowLenHere) : res;

        const winRange = horizWindowRange(st.horizBigChain.length, st.horizBigOrig.length, stepNumber);
        logStep("Гориз.XOR", [b + 1], res, `Шаг поиска ${stepNumber}/${st.horizChainLen}`, [], inputsForLog, winRange);
        if (!st.running) say(`Гориз.XOR: шаг поиска ${stepNumber}/${st.horizChainLen} → '${res}'`);

        st.horizXoredLength++;

        // Ищем СОБСТВЕННЫЙ паттерн этой строки по ВСЕЙ сквозной строке res целиком —
        // своя проверка вместо общего findMatch().
        if (ownPat && ownPat.text && !ownPat.found && textMatchesPattern(res, ownPat.text)) {
          ownPat.found = true; ownPat.kind = 0; ownPat.step = st.step;
          if (st.pull) pullFoundUp(st.pats.indexOf(ownPat));
          st.rows[b] = ownPat.text;
          st.tplRows[b] = ownPat.text;
          st.horizFoundInPass = true;
          if (st.lastOp) st.lastOp.pattern = { text: ownPat.text, kindLabel: "прямой", kind: 0, pos: 0, len: ownPat.text.length };
          if (!st.running) say(`Гориз.XOR: строка ${b + 1} совпала со своим паттерном на шаге ${stepNumber}/${st.horizChainLen}`);
        }
      }
    }
    // ОБЫЧНЫЕ РЕЖИМЫ (Интерливинг / Обычный XOR)
    else if (!isScan) {
      if (isXor) {
        const padToLen = (str, targetLen, align) => {
          if (str.length >= targetLen) return str;
          const shift = alignShift(targetLen, str.length, align);
          return "0".repeat(shift) + str + "0".repeat(targetLen - str.length - shift);
        };

        let maxLen = 0;
        if (pairOnly) {
          maxLen = Math.max(rowA.length, rowB.length);
        } else {
          for (let i = 0; i <= b; i++) if (getRowBits(st, i).length > maxLen) maxLen = getRowBits(st, i).length;
        }

        let needsPadding = false;
        if (pairOnly) {
          if (rowA.length < maxLen || rowB.length < maxLen) needsPadding = true;
        } else {
          for (let i = 0; i <= b; i++) {
            if (getRowBits(st, i).length > 0 && getRowBits(st, i).length < maxLen) { needsPadding = true; break; }
          }
        }

        if (needsPadding && st.stageXor) {
          snapshot();
          const padChanges = [];
          if (pairOnly) {
            const ba = st.rows[a], bb = st.rows[b];
            st.rows[a] = padToLen(rowA, maxLen, st.align);
            st.rows[b] = padToLen(rowB, maxLen, st.align);
            if (st.rows[a] !== ba) padChanges.push({ row: a + 1, before: ba, after: st.rows[a] });
            if (st.rows[b] !== bb) padChanges.push({ row: b + 1, before: bb, after: st.rows[b] });
          } else {
            for (let i = 0; i <= b; i++) {
              if (st.rows[i].length > 0) {
                const bef = st.rows[i];
                st.rows[i] = padToLen(getRowBits(st, i), maxLen, st.align);
                if (st.rows[i] !== bef) padChanges.push({ row: i + 1, before: bef, after: st.rows[i] });
              }
            }
          }
          st.step++;
          logStep("Дополнение нулями (паддинг)", pairOnly ? [a + 1, b + 1] : ("1–" + (b + 1)), pairOnly ? (st.rows[a] + " / " + st.rows[b]) : ("(диапазон выровнен нулями до " + maxLen + " бит)"), "", padChanges, inputsForLog);
          if (!st.running) say("Этап 1: Дополнение нулями");
          return true;
        }

        if (needsPadding) {
          snapshot();
          if (pairOnly) {
            st.rows[a] = padToLen(rowA, maxLen, st.align);
            st.rows[b] = padToLen(rowB, maxLen, st.align);
          } else {
            for (let i = 0; i <= b; i++) {
              if (st.rows[i].length > 0) st.rows[i] = padToLen(getRowBits(st, i), maxLen, st.align);
            }
          }
        }
      }

      if (!isXor || !st.stageXor) snapshot();

      let res;
      if (isXor) res = pairOnly ? xorPair(getRowBits(st, a), getRowBits(st, b), st.align)
                                : xorRowsDownTo(st.rows, b, st.align, st);
      else       res = interleavePair(getRowBits(st, a), getRowBits(st, b), st.align);
      
      if (!res.length) {
        st.undo.pop();
        return false;
      }

      st.rows[target] = res;

      logStep(
        isXor ? (pairOnly ? "XOR (пара)" : "XOR (накопительный)") : "Интерливинг",
        isXor ? (pairOnly ? [a + 1, b + 1] : ("1–" + (b + 1))) : [a + 1, b + 1],
        res,
        "",
        [{ row: target + 1, before: (() => { const t = st.rows[target]; st.rows[target] = res; return t === res ? "" : (arguments.callee._b || (arguments.callee._b = null)); })() }],
        inputsForLog
      );
    } else {
      snapshot();
      logStep("Скан (поиск без изменений)", [a + 1, b + 1], getRowBits(st, target), "", [], inputsForLog);
    }
  } else {
    snapshot(); // Фиксируем состояние перед переходом на следующую строку
    logStep("Переход (строка зафиксирована)", [src + 1], getRowBits(st, src), `Строка №${src + 1} закреплена как использованная, движение продолжается`, [], [{ name: `№${src+1}`, text: getRowBits(st, src) }]);
  }

  st.step++;
  if (st.lastOp) st.lastOp.step = st.step;

  const chain = buildChain(st, a, b);
  const maxPatLen = getMaxPatLen(st);
  
  const searchChainText = (st.tailBuffer || "") + chain.text;
  const tailLen = (st.tailBuffer || "").length;

  // Общий findMatch() перебирает ЛЮБЫЕ ещё не найденные паттерны вперёд по списку,
  // включая паттерны строк, которые в Гориз.XOR ещё даже не построены — это давало ложные
  // срабатывания (паттерн строки 3 помечался найденным раньше, чем строка 3 вообще
  // появлялась). У Гориз.XOR своя проверка — см. ниже, СТРОГО против паттерна ЭТОЙ строки.
  const m = isHorizXor ? null : findMatch(st, searchChainText, b);
  st.hit = null;
  if (m){
    const cells = [];
    for (let k = 0; k < m.len; k++){
      const idxInSearch = (m.pos + k) % searchChainText.length;
      const idxInCurrentChain = idxInSearch - tailLen;
      if (idxInCurrentChain >= 0 && idxInCurrentChain < chain.map.length) {
        const c = chain.map[idxInCurrentChain];
        if (c) cells.push(c);
      }
    }
    st.hit = { cells, kind: m.kind };

    const p = st.pats[m.idx];
    p.found = true; p.kind = m.kind; p.step = st.step; p.skip1 = st.skipFirst;
    if (st.pull) pullFoundUp(m.idx);
    
    // Если нашли паттерн в режиме Гориз.XOR — НЕ прерываем проход, просто запоминаем находку.
    // Переход на следующую строку случится позже, когда вся цепочка пройдёт до конца.
    if (isHorizXor) {
      st.horizFoundInPass = true;
    }

    if (st.lastOp) {
      const kindLabel = m.kind === 1 ? "инверсный" : m.kind === 2 ? "реверс" : "прямой";
      st.lastOp.pattern = { text: p.text, kindLabel, kind: m.kind, pos: m.pos, len: m.len };
    }
  }

  if (searchChainText.length > 0) {
    st.tailBuffer = searchChainText.slice(-maxPatLen);
  }

  // ЛОГИКА ДВИЖЕНИЯ И ПЕРЕХОДОВ
  // Гориз.XOR проверяется ПЕРВЫМ и безусловно — у него полностью своя, самодостаточная
  // логика переходов, которая не должна перебиваться общим isWrap (тот срабатывает почти
  // всегда в этом режиме, т.к. верхняя и нижняя строки обычно не соседние).
  if (isHorizXor) {
    // Один непрерывный проход шагов (см. applyHorizBigSlide) — без
    // "лапов" и повторов. Пока проход не завершён — просто продолжаем скользить дальше,
    // не прерывая находкой на середине (она уже запомнена в st.horizFoundInPass выше).
    const totalSteps = st.horizChainLen || 0;
    if (st.horizXoredLength < totalSteps) {
      return true;
    }

    // Сквозная цепочка целиком проскользила через строку (въехала, прошла, выехала) —
    // теперь решаем: перейти на следующую строку (если было совпадение) или остановиться.
    // Если весь объединённый поиск исчерпан БЕЗ находки (st.horizFoundInPass===false) —
    // дальше двигаться некуда: искать было уже негде, ни переход, ни генерация не сработают
    // (оба ветвления ниже требуют horizFoundInPass), и мы просто провалимся в стоп в конце.
    const nextRowPeek = nextDataIdx(b + 1);
    const nextAlreadyFound = nextRowPeek >= 0 && !!(findPatByOrd(nextRowPeek) || {}).found;
    const canGoOnFound = st.horizFoundInPass || nextAlreadyFound;

    if (canGoOnFound && nextRowPeek >= 0) {
      const nextRow = nextRowPeek;
      snapshot();
      st.used[b] = true;
      st.aIdx = b;
      st.bIdx = nextRow;
      st.horizFoundInPass = false;
      st.horizXoredLength = 0;
      st.horizChainLen = 0;
      // lastHorizRow НЕ трогаем — на следующем клике compute-блок увидит lastHorizRow!==bIdx
      // и сам пересоберёт сквозную (horizBigChain/horizBigOrig) заново для новой строки; здесь
      // обновляем их же для показа в оверлее сразу, без ожидания следующего клика.
      st.horizBigChain = horizChainText(nextRow);
      st.horizBigOrig = st.horizBigChain + getRowBits(st, nextRow);
      st.horizBigTargetIdx = nextRow;
      logStep("Гориз.XOR", [nextRow + 1], getRowBits(st, nextRow), `Переход на строку ${nextRow + 1}`, [], inputsForLog);
      if (!st.running) say(`Гориз.XOR: строка ${b + 1} пройдена целиком — переход на строку ${nextRow + 1}`);
      return true;
    }

    // Строки данных ниже НЕТ, но там уже определён паттерн (без строки) — генерируем
    // СЛЕДУЮЩУЮ строку, ТОЛЬКО ЕСЛИ у ТЕКУЩЕЙ (b) паттерн уже найден (st.horizFoundInPass,
    // выставляется и генерацией, и объединённым поиском при совпадении). Если текущая строка
    // сама не совпала (весь проход исчерпан без находки) — генерировать дальше НЕЛЬЗЯ.
    if (nextRowPeek < 0 && st.horizFoundInPass) {
      const genIdx = b + 1;
      // Используем st.pats.length (не st.rows.length!) — эти массивы не всегда одной
      // длины (рендер показывает паттерны даже для позиций, где ещё нет данных строки,
      // через Math.max(rows.length, pats.length)), а мы записываем НАПРЯМУЮ в st.rows[genIdx] —
      // JS-массив сам расширится, если genIdx окажется за текущим rows.length.
      const genPat = genIdx < st.pats.length ? findPatByOrd(genIdx) : null;
      if (genPat && genPat.text && !genPat.found) {
        const candidate = "1" + getRowBits(st, b);
        st.used[b] = true;
        st.rows[genIdx] = candidate;
        st.tplRows[genIdx] = candidate;
        st.aIdx = b;
        st.bIdx = genIdx;
        st.horizXoredLength = 0;
        st.horizFoundInPass = false;
        st.horizChainLen = 0;
        // lastHorizRow НЕ трогаем (как и при обычном переходе выше) — следующий клик сам
        // соберёт объединённый поиск (chain=строки выше genIdx + этот кандидат) с нуля; здесь
        // обновляем их же для показа в оверлее сразу.
        st.horizBigChain = horizChainText(genIdx);
        st.horizBigOrig = st.horizBigChain + candidate;
        st.horizBigTargetIdx = genIdx;

        // Паттерн ищется КАК ПОДСТРОКА, с учётом галок ⏭ Без 1-го / ⇌ Инв.Рев (см. textMatchesPattern).
        const genMatched = textMatchesPattern(candidate, genPat.text);

        if (genMatched) {
          genPat.found = true; genPat.kind = 0; genPat.step = st.step;
          if (st.pull) pullFoundUp(st.pats.indexOf(genPat));
          if (!st.running) say(`Гориз.XOR: сгенерирована строка ${genIdx + 1} = '1'+пред., паттерн найден в ней`);
        } else {
          if (!st.running) say(`Гориз.XOR: сгенерирована строка ${genIdx + 1} = '1'+пред. (не совпала сразу) — ищем объединённым ХОР-ом`);
        }
        return true;
      }
    }

    if (!st.running) {
      let diag = "";
      if (nextRowPeek < 0) {
        const dbgIdx = b + 1;
        const dbgPat = dbgIdx < st.pats.length ? findPatByOrd(dbgIdx) : null;
        diag = !dbgPat ? ` [паттерна №${dbgIdx + 1} нет]`
             : dbgPat.found ? ` [паттерн №${dbgIdx + 1} уже был найден]`
             : "";
      }
      say(`Гориз.XOR: сквозная цепочка прошла через строку ${b + 1} целиком${nextRowPeek < 0 ? " (последняя строка)" : ""}, совпадений нет — стоп${diag}`);
    }
    return false;
  } else if (isWrap){
    const f = firstDataIdx(), s2 = nextDataIdx(f + 1);
    if (st.goingUp && f >= 0 && s2 >= 0){
      st.aIdx = f; st.bIdx = s2; st.goingUp = false;
      st.passCount++;
      if (st.invPass) {
        const isInvPass = (st.passCount % 2 === 1);
        if (!st.running) say(`Заход ${st.passCount + 1}: ${isInvPass ? "Инверсное чтение битов (0↔1)" : "Прямое чтение"}`);
      }
    }
  } else if (shifted){
    if (st.goingUp){ st.aIdx--; st.bIdx--; } else { st.aIdx++; st.bIdx++; }
  } else if (!st.autoShift) {
    const f = firstDataIdx(), l = lastDataIdx();
    if (!st.goingUp && f >= 0 && b > f + 1){
      st.aIdx = f; st.bIdx = b; st.goingUp = true;
    }
    else if (st.goingUp && l >= 0 && l > a + 1){
      st.aIdx = a; st.bIdx = l; st.goingUp = false;
      st.passCount++;
      if (st.invPass) {
        const isInvPass = (st.passCount % 2 === 1);
        if (!st.running) say(`Заход ${st.passCount + 1}: ${isInvPass ? "Инверсное чтение битов (0↔1)" : "Прямое чтение"}`);
      }
    }
    else return false;
  }
  return true;
}

function pullFoundUp(idx){
  const p = st.pats[idx];
  if (!p) return;
  let target = -1;
  for (let i = 0; i < idx; i++){
    const q = st.pats[i];
    if (!q || !q.text) continue;
    if (!q.found){ if (target < 0) target = i; continue; }
    if (st.keepOrder && q.ord > p.ord){ target = i; break; }
  }
  if (target < 0 || target >= idx) return;
  st.pats.splice(idx, 1);
  st.pats.splice(target, 0, p);
}

/* pullFoundUp() двигает элементы st.pats по позиции в массиве (для визуального "подтягивания"
   наверх), поэтому st.pats[i] после этого больше НЕ обязательно принадлежит строке i.
   Настоящую привязку "паттерн ↔ исходная строка" хранит p.ord — им и нужно искать. */
function findPatByOrd(ord){
  if (!st.pats) return null;
  for (const p of st.pats) if (p && p.ord === ord) return p;
  return null;
}
/* === МАРКЕР 08: LOAD_RESET === */
function parseLines(s){ return s.split(/\r?\n/).map(x => x.trim()); }

/* Ползунок rowCount ограничивает resetAll() числом активных строк — при любой загрузке нового
   набора tplRows (текстом, файлом, вставкой) его нужно подтянуть под новую длину, иначе
   resetAll() обрежет вставленное по СТАРОМУ значению ползунка (например, до 1 строки). */
function syncRowCountToTpl(){
  const rowCountEl = document.getElementById("rowCount");
  if (!rowCountEl) return;
  const total = Math.max(2, st.tplRows.length);
  rowCountEl.max = total;
  if (+rowCountEl.value !== total) {
    rowCountEl.value = total;
  }
  document.getElementById("rowCountVal").textContent = rowCountEl.value;
}

function loadTemplate(){
  st.tplRows = parseLines(document.getElementById("taRows").value);
  st.tplPats = parseLines(document.getElementById("taPats").value);
  syncRowCountToTpl();
  resetAll();
  say("Шаблон загружен: активных строк " + st.rows.filter(Boolean).length +
      " (из " + st.tplRows.filter(Boolean).length + ").");
}

function resetAll(){
  st.running = false;
  const bStopEl = document.getElementById("bStop");
  if (bStopEl) bStopEl.disabled = true;

  // Если у ЭТОЙ вкладки есть своя сохранёнка — восстановить данные из неё (настройки вида/
  // поиска сюда больше не входят, они отдельно — см. DEFAULT_UI_SETTINGS/bResetUiSettings)
  const savedChain = st.tabs && st.tabs[st.activeTab] ? st.tabs[st.activeTab].savedChain : null;
  if (savedChain) {
    st.rows = savedChain.rows.slice();
    st.pats = savedChain.pats.map(p => p ? { ...p } : null);
    st.used = savedChain.used.slice();
  } else {
    const rowCountEl = document.getElementById("rowCount");
    const limit = rowCountEl ? +rowCountEl.value : st.tplRows.length;

    st.rows = st.tplRows.slice(0, limit);
    st.used = st.rows.map(() => false);
    st.pats = st.tplPats.slice(0, limit).map((t, i) => ({ text: t, ord: i, found: false, kind: null, step: null }));
  }

  st.step = 0; st.passCount = 0; st.tailBuffer = "";
  st.hit = null; st.undo = []; st.selectedRows = new Set();
  st.horizBitIdx = 0; st.horizXoredLength = 0; st.lastHorizRow = null; st.horizFoundInPass = false; st.horizChainLen = 0;
  st.horizBigChain = ""; st.horizBigOrig = ""; st.horizBigTargetIdx = -1;
  st.lastOp = null;
  const f = firstDataIdx(), s2 = nextDataIdx(f + 1);
  st.aIdx = f < 0 ? 0 : f; st.bIdx = s2 < 0 ? 1 : s2; st.goingUp = false;
  render();
}
/* === МАРКЕР 09: RENDER === */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const KIND_CLS = ["", "inv", "rev"];

/* Раскрашивает биты 0/1 в HTML — используется и основной таблицей, и Черновиком последнего шага.
   highlightRange {start,end} (включительно, по индексу символа) — подсветка "под окном
   въезжающей цепочки сейчас", как в оверлее Гориз.XOR. */
function bitsHtml(s, highlightRange){
  let h = "";
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    const covered = highlightRange && i >= highlightRange.start && i <= highlightRange.end;
    if (covered && (ch === "0" || ch === "1")) h += '<span class="xored-bit" title="Под въезжающей цепочкой сейчас">' + ch + '</span>';
    else if (ch === "0" || ch === "1") h += '<span class="b' + ch + '">' + ch + '</span>';
    else h += esc(ch);
  }
  return h;
}

/* Список вкладок-цепочек — свой выпадающий список в верхнем меню (см. #chainDd/#chainDdList),
   не нативный <select> — нужно было по кнопке "✕" у КАЖДОЙ вкладки отдельно (не только у
   текущей). Кнопки Сохран/Восстан/+/Очистить — статические элементы там же, эта функция
   только перерисовывает список и подпись текущей вкладки на кнопке-тоггле. */
function renderTabs() {
  const toggleEl = document.getElementById("chainDdToggle");
  const listEl = document.getElementById("chainDdList");
  if (!toggleEl || !listEl) return;
  if (!st.tabs || st.tabs.length === 0) {
    st.tabs = [createDefaultTabState("Цепочка 1")];
    st.activeTab = 0;
  }

  const active = st.tabs[st.activeTab];
  toggleEl.innerHTML = esc(active ? active.name : "Цепочка") + ' <span class="chain-dd-arrow">⌄</span>';

  listEl.innerHTML = st.tabs.map((tab, i) =>
    '<div class="chain-dd-item' + (i === st.activeTab ? " act" : "") + '" data-idx="' + i + '">' +
      '<span class="chain-dd-name">' + esc(tab.name) + '</span>' +
      '<button type="button" class="chain-dd-mini" data-act="save" data-idx="' + i + '" title="Сохранить эту цепочку (без переключения)">💾</button>' +
      '<button type="button" class="chain-dd-mini" data-act="clear" data-idx="' + i + '" title="Полностью очистить эту цепочку">🧹</button>' +
      '<button type="button" class="chain-dd-mini" data-act="reset" data-idx="' + i + '" title="Сбросить эту цепочку к сохранению/шаблону">↺</button>' +
      '<button type="button" class="chain-dd-close" data-idx="' + i + '" title="Закрыть эту вкладку"' +
        (st.tabs.length <= 1 ? " disabled" : "") + '>✕</button>' +
    '</div>'
  ).join("");
}

/* Линейка номеров столбцов — всегда видна над строками, выровнена под сетку битов той же
   .num/.pat/.bits/.pat2 разметкой, что и обычные строки, чтобы клик по метке N сдвигал именно
   N-й символ каждой строки. Прилипает к верху (position:sticky, см. CSS) сразу под .chain-head,
   так что не уезжает при скролле строк вниз.
   Снять выделение — клик по метке ВЫБРАННОГО столбца: её палочка "|" заменяется на "✕" прямо
   на месте (col-cell-clear-glyph) — крестик всегда там же, где сама подсветка, а не отдельно
   сбоку. Символ метки-линии — ASCII "|", не "│": box-drawing глиф не всегда той же ширины, что
   цифры 0/1 в моноширинном шрифте, и линии "съезжали" с сеткой битов на длинных строках; "|"
   гарантированно той же ширины. "Жирность" линии — не шрифтом (не двигает раскладку), а
   CSS-трансформом (scaleX) в .col-cell-tick, см. CSS (у "✕" трансформ отключён — иначе крестик
   растягивало в кривой овал). */
function renderColHeader(maxLen){
  const el = document.getElementById("colHeader");
  if (!el) return;
  if (maxLen <= 0) {
    el.classList.remove("act");
    el.innerHTML = "";
    return;
  }
  el.classList.add("act");

  const alignCls = "al-" + st.align;
  let ticks = "";
  for (let c = 0; c < maxLen; c++) {
    const num = c + 1;
    const isSel = st.selectedCol === c;
    const selCls = isSel ? " sel" : "";
    const glyph = isSel ? '<span class="col-cell-tick col-cell-clear-glyph">✕</span>' : '<span class="col-cell-tick">|</span>';
    ticks += '<span class="col-cell' + selCls + '" data-col="' + c + '" title="Столбец ' + num + (isSel ? " (клик снимет выделение)" : "") + '">' + glyph + '</span>';
  }
  el.innerHTML =
    '<div class="col-hdr-row"><span class="num"></span><span class="pat"></span><span class="bits ' + alignCls + '"><span>' + ticks + '</span></span><span class="num"></span><span class="pat2"></span></div>';
}

/* Границы строк для режима "🔢 Выбор столбца":
   - без выделения — все строки (как раньше);
   - выделена ОДНА строка — от начала таблицы до неё включительно (строки выше и она сама);
   - выделены ДВЕ И БОЛЕЕ строк — только диапазон МЕЖДУ крайними из выделенных (включительно),
     а не от начала таблицы — верхняя выделенная строка сама становится верхней границей. */
function colSelectRowRange(){
  if (!st.selectedRows || st.selectedRows.size === 0) return { lo: 0, hi: Infinity };
  const arr = Array.from(st.selectedRows);
  if (arr.length === 1) return { lo: 0, hi: arr[0] };
  return { lo: Math.min(...arr), hi: Math.max(...arr) };
}

/* Клик по номеру столбца (режим "🔢 Выбор столбца"): КАЖДУЮ строку, которая своими
   символами реально достаёт до этого столбца (с учётом выравнивания), циклически сдвигает
   так, чтобы на этом столбце оказалась '1' — с минимумом единиц слева от неё (bestColumnShift).
   Строки без единиц или не достающие до столбца — не трогаются. */
function selectColumn(col){
  let maxLen = 0;
  for (const s of st.rows) if (s.length > maxLen) maxLen = s.length;
  if (col < 0 || col >= maxLen) return;

  const range = colSelectRowRange();
  snapshot();
  for (let i = range.lo; i < st.rows.length && i <= range.hi; i++) {
    const rowStr = st.rows[i];
    if (!rowStr || !rowStr.length) continue;
    const shift = alignShift(maxLen, rowStr.length, st.align);
    const localCol = col - shift;
    if (localCol < 0 || localCol >= rowStr.length) continue;
    const d = bestColumnShift(rowStr, localCol);
    if (d == null) continue;
    st.rows[i] = rotateRightBy(rowStr, d);
  }
  st.selectedCol = col;
  render();
  saveCache();
}

/* Наведение на номер столбца (режим "🔢 Выбор столбца"): подсвечивает ВЕСЬ столбец —
   сам номер (в обоих рядах десятки/единицы) и соответствующий бит в каждой строке ниже,
   с учётом текущего выравнивания (data-col проставлен в render() по видимой колонке). */
function highlightColumn(col){
  clearColumnHighlight();
  document.querySelectorAll('#colHeader .col-cell[data-col="' + col + '"]').forEach(el => el.classList.add("col-hover"));
  document.querySelectorAll('#rows [data-col="' + col + '"]').forEach(el => el.classList.add("col-hover-bit"));
}
function clearColumnHighlight(){
  document.querySelectorAll(".col-hover").forEach(el => el.classList.remove("col-hover"));
  document.querySelectorAll(".col-hover-bit").forEach(el => el.classList.remove("col-hover-bit"));
}

function render(){
  renderTabs(); // <-- ЭТО ТА САМАЯ СТРОКА, КОТОРУЮ Я ЗАБЫЛ В ПРОШЛЫЙ РАЗ!
  document.getElementById("stepNo").textContent = st.step;

  let maxLen = 0;
  for (const s of st.rows) if (s.length > maxLen) maxLen = s.length;
  renderColHeader(maxLen);

  const hl = new Map();
  if (st.hit) for (const c of st.hit.cells){
    if (!hl.has(c.r)) hl.set(c.r, new Set());
    hl.get(c.r).add(c.p);
  }
  const hitCls = st.hit ? ("hit " + KIND_CLS[st.hit.kind]) : "hit";

  const bgInfo = computeBgSearchTarget();
  const bgTargetIdx = bgInfo ? bgInfo.targetIdx : null;
  const bgMatched = !!(bgInfo && bgInfo.matched);
  if (st.bgSearch) {
    const hitNow = bgMatched ? bgTargetIdx : null;
    if (hitNow !== st.bgSearchLastHit) {
      if (hitNow != null) {
        const matchedLabel = bgInfo.results.filter(r => r.matched).map(r => BG_SEARCH_MODE_LABELS[r.mode] || r.mode).join(", ");
        say(`🔍 Фон-поиск: паттерн строки ${hitNow + 1} найден! (${matchedLabel})`);
      }
      st.bgSearchLastHit = hitNow;
    }
  }

  const out = [];
  const n = Math.max(st.rows.length, st.pats.length);
  const alignCls = "al-" + st.align;

  // Гориз.XOR: подсветка "синим" (xored-bit) идёт по ВСЕЙ въезжающей цепочке целиком — и по
  // строкам выше (они и составляют st.horizBigChain), и по самой целевой строке — а не
  // только по целевой. Глобальный индекс бита строки i (i < hxTarget) внутри
  // st.horizBigChain = сумма длин строк 0..i-1 (в порядке хorizChainText) + k. Целевая
  // строка лежит в st.horizBigOrig на позициях [chainLen, chainLen+rowLen).
  const hxActive = st.mode === "horiz_xor";
  const hxChainLenAll = hxActive ? (st.horizBigChain || "").length : 0;
  const hxFullLenAll = hxActive ? (st.horizBigOrig || "").length : 0;
  const hxTarget = hxActive ? st.horizBigTargetIdx : -1;
  const hxS = hxActive ? (st.horizXoredLength || 0) : 0;
  const hxExhausted = hxActive && (st.horizChainLen || 0) > 0 && hxS >= (st.horizChainLen || 0);
  const hxWin = (hxActive && !hxExhausted) ? horizWindowRange(hxChainLenAll, hxFullLenAll, hxS) : null;
  let hxChainOffset = 0; // бежит вперёд по мере прохода строк цикла (только для i < hxTarget)

  // Режим "🔢 Выбор столбца": границы строк — см. colSelectRowRange() (1 выделенная строка —
  // от начала до неё, 2+ — только между крайними); и подсветка колонки, и сам клик по номеру
  // столбца (см. selectColumn()) это учитывают.
  const colSelRange = colSelectRowRange();

  for (let i = 0; i < n; i++){
    const s = st.rows[i] || "";
    const p = st.pats[i];
    const cls = ["ln"];
    if (st.used[i]) cls.push("used");
    if (i === st.aIdx || i === st.bIdx) cls.push("cur");
    if (st.selectedRows && st.selectedRows.has(i)) cls.push("selected");

    let pat = "";
    let patRight = "";
    if (p && p.text){
      const bgHitSuffix = i === bgTargetIdx ? (bgMatched ? " bg-search-hit" : " bg-search-target") : "";
      const c = (p.found ? ("pat found " + KIND_CLS[p.kind || 0]) : "pat") + bgHitSuffix;
      const c2 = (p.found ? ("pat pat2 found " + KIND_CLS[p.kind || 0]) : "pat pat2") + bgHitSuffix;
      
      const stepHtml = p.found ? '<span class="st">#' + p.step + "</span>" : "";
      
      let textHtml = esc(p.text);
      // Фоновый поиск сверяется через textMatchesPattern(), который сам учитывает живую
      // st.skipFirst (а не "замороженный" p.skip1, записанный только при обычной находке) —
      // подсветка первого символа для target/hit-строки идёт по тому же живому флагу.
      if ((p.found && p.skip1 && p.text.length > 1) || (i === bgTargetIdx && st.skipFirst && p.text.length > 1)) {
        textHtml = '<span class="pat-skip">' + esc(p.text[0]) + '</span>' + esc(p.text.slice(1));
      }
      
      pat = '<span class="' + c + '">' + textHtml + stepHtml + '</span>';
      patRight = '<span class="' + c2 + '">' + textHtml + stepHtml + '</span>';
    } else {
      pat = '<span class="pat"></span>';
      patRight = '<span class="pat pat2"></span>';
    }

    const shift = s.length ? alignShift(maxLen, s.length, st.align) : 0;
    const padRight = s.length ? (maxLen - s.length - shift) : maxLen;
    const marks = hl.get(i);

    // Эта строка — часть въезжающей цепочки (выше целевой строки)?
    const isHxChainRow = hxActive && !hxExhausted && i < hxTarget && s.length > 0;
    // Эта строка — сама целевая строка?
    const isHxTargetRow = hxActive && !hxExhausted && i === hxTarget;

    const isColSel = st.selectedCol >= 0 && i >= colSelRange.lo && i <= colSelRange.hi;

    // Пустой участок строки (до сдвига выравнивания или после конца короткой/пустой строки) —
    // если выбранный столбец попадает именно сюда (в этой строке для него просто нет бита),
    // всё равно подсвечиваем один "пустой" символ на его месте, чтобы подсветка столбца шла
    // сплошной линией по всем строкам диапазона, а не пропускала короткие/пустые строки.
    const blankRun = (startCol, len) => {
      if (len <= 0) return "";
      if (isColSel && st.selectedCol >= startCol && st.selectedCol < startCol + len) {
        const off = st.selectedCol - startCol;
        return "&nbsp;".repeat(off) + '<span class="col-sel-bit">&nbsp;</span>' + "&nbsp;".repeat(len - off - 1);
      }
      return "&nbsp;".repeat(len);
    };
    let bits = blankRun(0, shift);

    for (let k = 0; k < s.length; k++) {
      const bit = s[k];
      let isXoredBit = false;
      if (isHxChainRow && hxWin) {
        // Та же единая шкала p, что и у целевой строки (см. horizWindowRange) — цепочка
        // подсвечивается только после того, как подсветка "дойдёт" до её позиций снизу вверх.
        const globalIdx = hxChainOffset + k;
        isXoredBit = globalIdx >= hxWin.start && globalIdx <= hxWin.end;
      } else if (isHxTargetRow && hxWin) {
        const globalIdx = hxChainLenAll + k;
        isXoredBit = globalIdx >= hxWin.start && globalIdx <= hxWin.end;
      }
      const isColSelBit = isColSel && (shift + k) === st.selectedCol;

      const colAttr = (i >= colSelRange.lo && i <= colSelRange.hi) ? (' data-col="' + (shift + k) + '"') : "";

      if (marks && marks.has(k)) {
        bits += '<span class="' + hitCls + '"' + colAttr + '>' + bit + '</span>';
      } else if (isColSelBit && (bit === '0' || bit === '1')) {
        bits += '<span class="col-sel-bit b' + bit + '"' + colAttr + '>' + bit + '</span>';
      } else if (isXoredBit && (bit === '0' || bit === '1')) {
        bits += '<span class="xored-bit"' + colAttr + '>' + bit + '</span>';
      } else if (bit === '0' || bit === '1') {
        bits += '<span class="b' + bit + '"' + colAttr + '>' + bit + '</span>';
      } else if (colAttr) {
        bits += '<span' + colAttr + '>' + esc(bit) + '</span>';
      } else {
        bits += esc(bit);
      }
    }
    if (isHxChainRow) hxChainOffset += s.length;

    bits += blankRun(shift + s.length, padRight);

    // Строка изменилась относительно исходного шаблона (tplRows) — подсвечиваем номер отдельным
    // цветом (см. .num.changed в CSS), чтобы было видно, какие строки реально трогали.
    const numCls = "num" + (s !== (st.tplRows[i] || "") ? " changed" : "");
    out.push('<div class="' + cls.join(" ") + '" data-idx="' + i + '"><span class="' + numCls + '">' + (i + 1) + "</span>" +
             pat + '<span class="bits ' + alignCls + '"><span>' + bits + "</span></span>" +
             '<span class="' + numCls + '">' + (i + 1) + "</span>" + patRight + "</div>");
  }
  document.getElementById("rows").innerHTML = out.join("");

  let fullChainText = "";
  if (st.mode === "step1" || st.mode === "step2") {
    const aRow = st.rows[st.aIdx] || "";
    const bRow = st.rows[st.bIdx] || "";
    fullChainText = (st.tailBuffer || "") + aRow + bRow;
  } else if (st.mode === "horiz_xor") {
    // Та же скользящая цепочка (строки строго выше bIdx), что реально используется в doStep.
    fullChainText = st.horizBigChain || horizChainText(st.bIdx);
  } else {
    // Все строки от первой до текущей — но БЕЗ самой текущей (st.bIdx): пока строка ещё
    // "в переборе" (например, крутится через autoShift в поиске совпадения), она не
    // зафиксирована и не должна попадать в сквозную. Как только строка "сохраняется"
    // (bIdx сдвигается дальше, эта строка становится историей) — она естественно попадает
    // в диапазон на следующем рендере. Не зависит от st.used[] (тот не всегда надёжно
    // заполнен). Это только для ПОКАЗА — реальный поиск паттернов (buildChain) не трогаем.
    let simple = "";
    for (let i = 0; i < st.bIdx; i++) {
      if (st.rows[i] && st.rows[i].length) simple += getRowBits(st, i);
    }
    fullChainText = (st.tailBuffer || "") + simple;
  }

  // Фоновый поиск (cBgSearch): показываем в этом же окне РЕАЛЬНО вычисленный результат
  // (интерлив / XOR пары / XOR всех выше+выделенной), который сравнивается с паттерном строки
  // ниже выделенной — вместо обычной сквозной строки, которая с этими режимами не связана и
  // не отражала бы, что именно проверяется на совпадение.
  const chainResultLabelEl = document.getElementById("chainResultLabel");
  let bgResultHtml = null;
  if (bgInfo) {
    /* Несколько включённых режимов сразу — каждый в своей строке-flex-ряду (label | check |
       bits), с пометкой найденного. Ширина колонки label — одна на все строки (bgLabelW, в ch,
       шрифт моноширинный), поэтому биты ВСЕХ строк начинаются строго в одном столбце
       независимо от того, какие именно режимы сейчас включены.
       ВАЖНО: галочка "✅" — в ОТДЕЛЬНОМ span'е ФИКСИРОВАННОЙ ширины (.chain-result-line-check),
       а не приклеена к тексту label — эмодзи в большинстве шрифтов заметно ШИРЕ 1ch, и если
       её включать в bgLabelW/label-текст, у найденных строк (с ✅) label оказывался шире
       остальных, и колонка с битами у них уезжала вправо относительно ненайденных строк.
       Каждая строка по умолчанию обрезана в одну линию (long bit-строки иначе распирают окно)
       — клик по строке разворачивает её целиком (см. bgResultExpanded + обработчик клика на
       #chainText). Найденный участок (bgInfo.results[i].range) подсвечивается тем же жёлтым,
       что и .pat.bg-search-hit в самой таблице — видно НЕ только "нашлось", но и ГДЕ именно. */
    const bgLabels = bgInfo.results.map(r => BG_SEARCH_MODE_LABELS[r.mode] || r.mode);
    const bgLabelW = Math.max(...bgLabels.map(l => l.length));
    fullChainText = bgInfo.results
      .map((r, i) => bgLabels[i].padEnd(bgLabelW, " ") + (r.matched ? " ✅" : "   ") + ": " + r.result)
      .join("\n");
    bgResultHtml = bgInfo.results.map((r, i) => {
      let bits = "";
      for (let k = 0; k < r.result.length; k++) {
        const ch = esc(r.result[k]);
        bits += (r.range && k >= r.range.start && k <= r.range.end) ? ('<span class="chain-hit-bits">' + ch + '</span>') : ch;
      }
      const expanded = bgResultExpanded.has(r.mode) ? " expanded" : "";
      return '<div class="chain-result-line' + expanded + '" data-mode="' + esc(r.mode) + '" title="Клик — показать целиком / свернуть обратно">' +
        '<span class="chain-result-line-label" style="min-width:' + bgLabelW + 'ch">' + esc(bgLabels[i]) + '</span>' +
        '<span class="chain-result-line-check">' + (r.matched ? "✅" : "") + '</span>' +
        '<span class="chain-result-line-colon">:</span>' +
        '<span class="chain-result-line-bits">' + bits + '</span>' +
      '</div>';
    }).join("");
    if (chainResultLabelEl) {
      const modeLabels = bgInfo.results.map(r => BG_SEARCH_MODE_LABELS[r.mode] || r.mode).join(" + ");
      chainResultLabelEl.textContent = "🔍 Результат фон-поиска (" + modeLabels + ")";
    }
  } else if (chainResultLabelEl) {
    chainResultLabelEl.textContent = "🔗 Сквозная строка результата";
  }

  const chainLenEl = document.getElementById("chainLen");
  const chainTextEl = document.getElementById("chainText");
  if (chainLenEl && chainTextEl) {
    /* В режиме фон-поиска fullChainText — это несколько подписанных строк сразу, а не чистая
       битовая строка, так что счётчик битов показывает длину результата первого режима */
    chainLenEl.textContent = bgInfo ? (bgInfo.results[0] ? bgInfo.results[0].result.length : 0) : fullChainText.length;
    // Строки результата фон-поиска — всегда по левому краю, независимо от кнопок выравнивания
    // ⇤↔⇥ (те управляют только выравниванием строк/паттернов в самой таблице, не тут)
    chainTextEl.style.textAlign = bgInfo ? "left" : st.align;
    
    let overlayHtml = "";
    
    if (st.mode === "horiz_xor") {
      const b = st.bIdx;
      if (b >= 0 && st.rows[b]) {
        // Сквозная (маленькая, неизменная) = уже найденные строки выше b — она и есть
        // скользящая цепочка, въезжающая СПРАВА в цель. Цель (большая, неизменная) =
        // сквозная + текущее содержимое строки b. Результат = applyHorizBigSlide на шаге S,
        // с подсветкой позиций, сейчас накрытых въезжающей цепочкой.
        const chain = st.horizBigChain || "";
        const full = st.horizBigOrig || getRowBits(st, b);
        const chainLen = chain.length;
        const fullLen = full.length;
        const S = st.horizXoredLength || 0; // сколько шагов поиска уже сделано
        const res = S > 0 ? applyHorizBigSlide(chain, full, S) : full;

        // Единая шкала p по всей объединённой строке (chain, затем цель) — подсветка сперва
        // растёт внутри цели снизу, и только потом переходит на цепочку (см. horizWindowRange).
        const winRange = horizWindowRange(chainLen, fullLen, S);
        let chainHtml = "";
        for (let idx = 0; idx < chainLen; idx++) {
          const ch = chain[idx];
          const active = !!winRange && idx >= winRange.start && idx <= winRange.end;
          if (active && (ch === '0' || ch === '1')) {
            chainHtml += '<span class="xored-bit" title="Сейчас касается цели">' + ch + '</span>';
          } else if (ch === '0' || ch === '1') {
            chainHtml += '<span class="b' + ch + '">' + ch + '</span>';
          } else {
            chainHtml += esc(ch);
          }
        }
        if (!chainHtml) chainHtml = '<span class="empty">пусто</span>';

        let origHtml = "";
        for (let k = 0; k < fullLen; k++) {
          const ch = full[k];
          origHtml += (ch === '0' || ch === '1') ? ('<span class="b' + ch + '">' + ch + '</span>') : esc(ch);
        }

        // Позиции цели, сейчас накрытые въезжающей (справа) цепочкой (тот же winRange, что и выше).
        let resHtml = "";
        for (let j = 0; j < fullLen; j++) {
          const ch = res[j];
          const covered = !!winRange && j >= winRange.start && j <= winRange.end;
          if (covered && (ch === '0' || ch === '1')) {
            resHtml += '<span class="xored-bit" title="Под въезжающей цепочкой сейчас">' + ch + '</span>';
          } else if (ch === '0' || ch === '1') {
            resHtml += '<span class="b' + ch + '">' + ch + '</span>';
          } else {
            resHtml += esc(ch);
          }
        }

        // Прогресс единого непрерывного прохода (въезд + полное перекрытие + выезд)
        const totalSteps = st.horizChainLen || (chainLen + fullLen);
        const progressHtml = '<div class="horiz-progress">🔎 поиск · Шаг ' + Math.min(S, totalSteps) + '/' + totalSteps + '</div>';

        overlayHtml =
          '<div class="horiz-info">' +
            progressHtml +
            '<div class="horiz-ride-row horiz-ride-wrap"><span class="horiz-ride-tag">Сквозная</span><span class="horiz-ride-text">' + chainHtml + '</span></div>' +
            '<div class="horiz-ride-row horiz-ride-wrap"><span class="horiz-ride-tag">Цель</span><span class="horiz-ride-text">' + origHtml + '</span></div>' +
            '<div class="horiz-ride-row horiz-ride-wrap"><span class="horiz-ride-tag">Результат</span><span class="horiz-ride-text">' + resHtml + '</span></div>' +
          '</div>' +
          '<div style="border-top: 1px dashed var(--line); margin: 6px 0; padding-top: 4px; color: var(--dim); font-size: 11px;">Сквозной результат:</div>';
      }
    }
    
    if (!fullChainText && !overlayHtml) {
      chainTextEl.innerHTML = '<span class="empty">пусто</span>';
    } else if (bgResultHtml != null) {
      chainTextEl.innerHTML = bgResultHtml;
      // text-overflow:ellipsis сама рисует "…", но на мелком шрифте среди битов её легко не
      // заметить — меряем по факту (scrollWidth > clientWidth) и вешаем свою явную метку
      // (см. .chain-result-line.truncated в CSS) только на реально обрезанные строки.
      chainTextEl.querySelectorAll(".chain-result-line:not(.expanded) .chain-result-line-bits").forEach(el => {
        if (el.scrollWidth > el.clientWidth) el.parentElement.classList.add("truncated");
      });
    } else {
      let html = "";
      for (let k = 0; k < fullChainText.length; k++) {
        const bit = fullChainText[k];
        html += esc(bit);
      }
      chainTextEl.innerHTML = overlayHtml + (html || '<span class="empty">пусто</span>');
    }
  }

  renderStepLogBox();
}

/* Обновляет визуальный блок "Черновик последнего шага": операция, задействованные строки, результат, найденный паттерн */
function renderStepLogBox(){
  const noEl = document.getElementById("stepLogNo");
  const bodyEl = document.getElementById("stepLogBody");
  if (!bodyEl) return;

  const op = st.lastOp;
  if (!op) {
    if (noEl) noEl.textContent = "0";
    bodyEl.innerHTML = '<span class="step-log-empty">шагов ещё не было</span>';
    return;
  }

  if (noEl) noEl.textContent = op.step;

  let rowsHtml = "";
  if (Array.isArray(op.rows)) {
    rowsHtml = op.rows.map(r => '<span class="step-log-rows-badge">№' + r + '</span>').join("");
  } else if (op.rows) {
    rowsHtml = '<span class="step-log-rows-badge">' + esc(String(op.rows)) + '</span>';
  }

  const RESULT_LIMIT = 160;
  const resultRaw = op.result || "";
  const resultShown = resultRaw.length > RESULT_LIMIT ? resultRaw.slice(0, RESULT_LIMIT) : resultRaw;
  const resultHtml = resultShown.length ? bitsHtml(resultShown, op.highlightRange) : '<span class="empty">пусто</span>';
  const moreHtml = resultRaw.length > RESULT_LIMIT ? ' <span style="color:var(--dim)">…(+' + (resultRaw.length - RESULT_LIMIT) + ' бит)</span>' : '';

  let html = "";
  html += '<div class="step-log-row"><span class="step-log-label">Операция</span><span class="step-log-op">' + esc(op.opName) + '</span></div>';
  html += '<div class="step-log-row"><span class="step-log-label">Строки</span>' + (rowsHtml || '<span class="empty">—</span>') + '</div>';
  if (op.detail) {
    html += '<div class="step-log-row"><span class="step-log-label">Детали</span><span style="color:var(--dim)">' + esc(op.detail) + '</span></div>';
  }
  html += '<div class="step-log-row" style="display:block"><span class="step-log-label" style="display:block;margin-bottom:2px">Результат</span><div class="step-log-result">' + resultHtml + moreHtml + '</div></div>';

  if (op.pattern) {
    const kindCls = op.pattern.kind === 1 ? "inv" : op.pattern.kind === 2 ? "rev" : "";
    html += '<div class="step-log-pattern ' + kindCls + '">🎯 Найден паттерн «' + esc(op.pattern.text) + '» (' + op.pattern.kindLabel + '), позиция ' + op.pattern.pos + ', длина ' + op.pattern.len + '</div>';
  }

  bodyEl.innerHTML = html;
}

/* Функция полной очистки данных текущего активного слота (цепочки).
   Если у вкладки ещё НЕТ своей сохранёнки (пользователь ни разу не жал "Сохранить" вручную) —
   перед стиранием авто-сохраняем состояние КАК ОНО БЫЛО, чтобы "Сброс" потом мог его вернуть.
   Если сохранёнка уже есть — её не трогаем (не затираем осознанное ручное сохранение). */
function clearActiveTab() {
  snapshot();
  if (st.tabs && st.tabs[st.activeTab] && !st.tabs[st.activeTab].savedChain) {
    st.tabs[st.activeTab].savedChain = {
      rows: st.rows.slice(),
      pats: st.pats.map(p => p ? { ...p } : null),
      used: st.used.slice(),
      tplRows: st.tplRows.slice(),
      tplPats: st.tplPats.slice()
    };
  }
  st.tplRows = [];
  st.tplPats = [];
  st.rows = [];
  st.used = [];
  st.pats = [];
  st.step = 0;
  st.passCount = 0;
  st.horizBitIdx = 0;
  st.lastXorBitA = null;
  st.tailText = "";
  st.tailFlags = [];
  st.hit = null;
  st.selectedRows = new Set();
  
  const taR = document.getElementById("taRows");
  const taP = document.getElementById("taPats");
  if (taR) taR.value = "";
  if (taP) taP.value = "";
  
  render();
  saveCache();
  say("Текущая вкладка полностью очищена!");
}

/* Сохранить/очистить/сбросить данные ЛЮБОЙ вкладки по индексу, не обязательно активной (кнопки
   в выпадающем списке цепочек — см. renderTabs()/chainDdListEl). Единственное место, где живёт
   "сохранёнка" цепочки — st.tabs[idx].savedChain (никакого общего на всё приложение поля
   больше нет); настройки вида/поиска сюда не входят — они отдельно, см. captureUiSettings/
   DEFAULT_UI_SETTINGS и кнопки в "Вид".
   Если idx — активная вкладка, читаем/пишем живые st.rows/st.pats и т.д. (полноценно, с
   рендером холста); если нет — работаем НАПРЯМУЮ с объектом st.tabs[idx], не переключаясь на
   неё (без мерцания холста, без временной подмены активной вкладки). */
function tabSaveChainData(idx) {
  if (!st.tabs || !st.tabs[idx]) return;
  const isActive = idx === st.activeTab;
  const src = isActive ? st : st.tabs[idx];
  st.tabs[idx].savedChain = {
    rows: (src.rows || []).slice(),
    pats: (src.pats || []).map(p => p ? { ...p } : null),
    used: (src.used || []).slice(),
    tplRows: (src.tplRows || []).slice(),
    tplPats: (src.tplPats || []).slice()
  };
  renderTabs();
  saveCache();
  say(`✓ «${st.tabs[idx].name}» сохранена!`);
}

function tabClearChainData(idx) {
  if (!st.tabs || !st.tabs[idx]) return;
  if (idx === st.activeTab) { clearActiveTab(); return; }
  const t = st.tabs[idx];
  if (!confirm(`Полностью очистить «${t.name}»? Строки, паттерны и история будут потеряны.`)) return;
  // Та же логика авто-сохранения перед очисткой, что и в clearActiveTab() — если своей
  // сохранёнки у вкладки ещё нет, "Сброс" потом сможет вернуть то, что было.
  if (!t.savedChain) {
    t.savedChain = {
      rows: (t.rows || []).slice(),
      pats: (t.pats || []).map(p => p ? { ...p } : null),
      used: (t.used || []).slice(),
      tplRows: (t.tplRows || []).slice(),
      tplPats: (t.tplPats || []).slice()
    };
  }
  t.tplRows = []; t.tplPats = []; t.rows = []; t.used = []; t.pats = [];
  t.step = 0; t.passCount = 0; t.tailBuffer = ""; t.selectedRows = []; t.undo = [];
  renderTabs();
  saveCache();
  say(`✓ «${t.name}» полностью очищена!`);
}

function tabResetChainData(idx) {
  if (!st.tabs || !st.tabs[idx]) return;
  if (idx === st.activeTab) { resetAll(); saveCache(); say("✓ Сброшена текущая вкладка."); return; }
  const t = st.tabs[idx];
  if (t.savedChain) {
    t.rows = t.savedChain.rows.slice();
    t.pats = t.savedChain.pats.map(p => p ? { ...p } : null);
    t.used = t.savedChain.used.slice();
  } else {
    const limit = (t.tplRows || []).length;
    t.rows = (t.tplRows || []).slice(0, limit);
    t.used = t.rows.map(() => false);
    t.pats = (t.tplPats || []).slice(0, limit).map((text, i) => ({ text, ord: i, found: false, kind: null, step: null }));
  }
  t.step = 0; t.selectedRows = [];
  renderTabs();
  saveCache();
  say(`✓ «${t.name}» сброшена.`);
}
/* === МАРКЕР 10.1: DRAG AND DROP === */
/* Вспомогательная функция для определения зоны броска */
function isOverPatternColumn(e) {
  // Прямое попадание по боковым колонкам или разделителям
  if (e.target.closest('.pat') || e.target.closest('.pat2')) return true;
  if (e.target.closest('.vsplit') || e.target.closest('.vsplit2')) return true;
  
  // Координатный поиск: если мышь левее или правее центральной колонки битсов
  const bitsHead = document.querySelector('.h-bits');
  if (bitsHead) {
    const rect = bitsHead.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right) {
      return true; // Бросок в зону паттернов (левую или правую)
    }
  }
  return false; // Бросок в зону строк
}

/* Умный Drag & Drop файлов с подсветкой целевой колонки */
const canvasEl = document.querySelector(".canvas");
if (canvasEl) {
  canvasEl.addEventListener("dragover", e => {
    e.preventDefault();
    if (isOverPatternColumn(e)) {
      canvasEl.classList.add("drop-pats");
      canvasEl.classList.remove("drop-rows");
    } else {
      canvasEl.classList.add("drop-rows");
      canvasEl.classList.remove("drop-pats");
    }
  });

  canvasEl.addEventListener("dragleave", e => {
    e.preventDefault();
    canvasEl.classList.remove("drop-rows", "drop-pats");
  });

  canvasEl.addEventListener("drop", e => {
    e.preventDefault();
    const isPats = isOverPatternColumn(e);
    canvasEl.classList.remove("drop-rows", "drop-pats");
    
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      const file = e.dataTransfer.files[0];
      const reader = new FileReader();
      reader.onload = ev => {
        const lines = parseLines(ev.target.result);
        if (isPats) {
          st.tplPats = lines;
          say(`Паттерны из файла "${file.name}" загружены в текущую вкладку!`);
        } else {
          st.tplRows = lines;
          syncRowCountToTpl();
          say(`Строки из файла "${file.name}" загружены в текущую вкладку!`);
        }
        resetAll();
        saveCache();
      };
      reader.readAsText(file, "UTF-8");
    }
  });

  /* Ctrl+V над канвасом — тот же приём, что drag&drop файла выше, но из буфера обмена:
     целевая зона (строки в центре / паттерны слева-справа) определяется ПОСЛЕДНЕЙ известной
     позицией мыши над канвасом (у paste-события своих координат нет). Полная замена
     tplRows/tplPats, как при дропе — не точечная вставка по курсору внутри поля. */
  let lastCanvasMouseEvt = null;
  canvasEl.addEventListener("mousemove", e => { lastCanvasMouseEvt = e; });
  canvasEl.addEventListener("mouseleave", () => { lastCanvasMouseEvt = null; });

  document.addEventListener("paste", e => {
    const at = document.activeElement;
    if (at && (at.tagName === "INPUT" || at.tagName === "TEXTAREA" || at.isContentEditable)) return;
    if (!lastCanvasMouseEvt) return;
    const text = e.clipboardData && e.clipboardData.getData("text");
    if (!text) return;
    e.preventDefault();
    const isPats = isOverPatternColumn(lastCanvasMouseEvt);
    const lines = parseLines(text);
    if (isPats) {
      st.tplPats = lines;
      say("Паттерны вставлены из буфера обмена в текущую вкладку!");
    } else {
      st.tplRows = lines;
      syncRowCountToTpl();
      say("Строки вставлены из буфера обмена в текущую вкладку!");
    }
    resetAll();
    saveCache();
  });
}

/* === МАРКЕР 10.2: ВКЛАДКИ === */
/* Управление вкладками-цепочками — свой выпадающий список #chainDd/#chainDdList (см.
   renderTabs()). Тоггл открывает/закрывает список; клик по строке переключает вкладку; клик по
   "✕" в строке закрывает ИМЕННО эту вкладку (не обязательно текущую) — если закрывается НЕ
   активная, живые st.rows/st.pats текущей вкладки не трогаем, просто убираем запись из
   st.tabs и поправляем индекс активной, если она сдвинулась. Если закрывается активная —
   тот же путь, что раньше был у bCloseTab (splice + переход на соседнюю), но с
   loadTabState(idx, true): пропускаем saveActiveTabState(), иначе он попытался бы сохранить
   ЖИВЫЕ (ещё от закрываемой вкладки) st.rows поверх новой активной, испортив её данные. */
const chainDdToggleEl = document.getElementById("chainDdToggle");
const chainDdListEl = document.getElementById("chainDdList");
if (chainDdToggleEl && chainDdListEl) {
  chainDdToggleEl.onclick = (e) => {
    e.stopPropagation();
    chainDdListEl.classList.toggle("open");
  };
  chainDdListEl.addEventListener("click", e => {
    const miniBtn = e.target.closest(".chain-dd-mini");
    if (miniBtn) {
      e.stopPropagation();
      const idx = +miniBtn.dataset.idx;
      const act = miniBtn.dataset.act;
      if (act === "save") tabSaveChainData(idx);
      else if (act === "clear") tabClearChainData(idx);
      else if (act === "reset") tabResetChainData(idx);
      return;
    }
    const closeBtn = e.target.closest(".chain-dd-close");
    if (closeBtn) {
      e.stopPropagation();
      if (!st.tabs || st.tabs.length <= 1) return;
      const idx = +closeBtn.dataset.idx;
      const tabName = (st.tabs[idx] && st.tabs[idx].name) || "эту вкладку";
      if (!confirm(`Закрыть «${tabName}»? Все её строки и история шагов будут потеряны.`)) return;

      if (idx === st.activeTab) {
        st.tabs.splice(idx, 1);
        const newActive = Math.min(idx, st.tabs.length - 1);
        loadTabState(newActive, true);
      } else {
        st.tabs.splice(idx, 1);
        if (idx < st.activeTab) st.activeTab -= 1;
        renderTabs();
        saveCache();
      }
      return;
    }
    const item = e.target.closest(".chain-dd-item");
    if (!item) return;
    chainDdListEl.classList.remove("open");
    const idx = +item.dataset.idx;
    if (idx !== st.activeTab) loadTabState(idx);
  });
  document.addEventListener("click", e => {
    if (!chainDdListEl.classList.contains("open")) return;
    if (e.target.closest("#chainDd")) return;
    chainDdListEl.classList.remove("open");
  });
}

/* Глобальная 💾 в шапке — действует на ТЕКУЩУЮ активную вкладку, через ту же tabSaveChainData(),
   что и мини-кнопки в списке цепочек (единый источник правды — st.tabs[idx].savedChain,
   настройки вида/поиска сюда больше не входят).
   Отдельной кнопки "↩ Восстановить" больше нет — "↺ Сброс" (resetAll) и так уже сначала

   "Восстановить" был точным дублем части поведения "Сброса", просто без отката к шаблону. */

    if (!fullChainText) { say("Сквозная строка пуста"); return; }
    copyTextToClipboard(fullChainText, "Сквозная строка скопирована!");
  };
