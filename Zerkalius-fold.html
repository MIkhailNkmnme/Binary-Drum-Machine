// ВНИМАНИЕ: сам захват теперь в captureFoundRow() ниже — при МУЛЬТИвыделении он не наращивает
// выделение, а двигает его окном постоянного размера (см. её комментарий).
// Общий хвост ручных ◄/►Круг/Круг Инв: после сдвига проверяем фон-поиск и, если что-то нашлось
// И включена "🧲 Захват находки" (st.captureOnFind), ДОБАВЛЯЕМ найденную строку к текущему
// выделению (не заменяя его) — запрос пользователя. Раньше это работало ТОЛЬКО если исходно
// было выделено несколько строк — теперь настраиваемый переключатель, по умолчанию включён и
// работает для ЛЮБОГО выделения, в т.ч. одной строки (запрос пользователя "работает для всяких
// выделений и одной строки тоже"). Сама найденная строка при этом уже НЕ крутилась (цикл выше
// прошёл по r ИЗ ИСХОДНОГО st.selectedRows, до добавления) — её биты не трогаются.
// Дальше — тот же счётчик "Вар: N/M (стр. ...)", что и в "Авто" (см. autoRun()), только тут
// накапливается по кликам подряд, а не по тикам — запрос пользователя ("при ручном тоже надо
// это показывать"). st.manualShiftTurns копится, пока не сменится выделение кликом по строке
// или режим (см. reset в rows.onclick / setMode()).
/* Захват найденной строки в выделение — общий и для "Авто", и для ручных ◄/►Круг.
   Выделена ОДНА строка — просто добавляем найденную, выделение растёт: прежнее поведение,
   оставлено как есть (запрос пользователя).
   Выделено НЕСКОЛЬКО — выделение едет ОКНОМ постоянного размера: добавляем найденную и
   выбрасываем САМУЮ ВЕРХНЮЮ, чтобы число выделенных строк всегда оставалось одним и тем же
   (запрос пользователя). Возвращает индекс выброшенной строки (или -1) — вызывающему коду в
   autoRun() он нужен, чтобы убрать её ещё и из набора вращаемых строк.
   ВАЖНО (запрос пользователя "если выделена одна и она захватывает вторую — потом тоже не снимать
   выделение с верхней"): "выделено несколько" считается по тому, как выделение ПОЯВИЛОСЬ, а не по
   его размеру прямо сейчас. Выделение, ВЫРОСШЕЕ из одной строки захватом (st.captureGrown), растёт
   и дальше — вторая, третья, четвёртая находка просто добавляются, верхняя строка остаётся
   выделенной. Окном постоянного размера едет только то выделение, которое пользователь набрал сам
   (Ctrl/Shift-кликом). Флаг снимается при любой ручной смене выделения — см. рядом с
   st.manualShiftTurns = 0 в rows.onclick/setMode()/Сбросе.
   ИНВАРИАНТ: targetIdx ВСЕГДА строго ниже всего выделения — см. computeBgSearchTarget():
   selIdx = Math.max(...st.selectedRows), targetIdx = selIdx + 1. Поэтому найденная строка не
   может ни уже быть в выделении, ни оказаться самой верхней, и проверок на это тут нет. */
function captureFoundRow(targetIdx){
  if (!st.selectedRows) st.selectedRows = new Set();
  const wasMulti = st.selectedRows.size > 1 && !st.captureGrown;
  if (st.selectedRows.size <= 1) st.captureGrown = true;
  st.selectedRows.add(targetIdx);
  if (!wasMulti) return -1;
  const top = Math.min(...st.selectedRows);
  st.selectedRows.delete(top);
  return top;
}

function afterShiftBgCheck(isShiftInv){
  if (st.captureOnFind) {
    const bgInfo = computeBgSearchTarget();
    if (bgInfo && bgInfo.matched) captureFoundRow(bgInfo.targetIdx);
  }
  st.manualShiftTurns = (st.manualShiftTurns || 0) + 1;
  const idxs = st.selectedRows ? Array.from(st.selectedRows) : [];
  st.shiftVariantTotal = computeShiftTotalTurns(idxs, isShiftInv);
  st.shiftVariantTurns = st.manualShiftTurns;
  st.shiftVariantRows = idxs;
  updateVariantCounter();
}
// Локальный индекс символа строки, который для НЕ-⊙-выравниваний считается "осью" при
// «Сдвиг только на 1» (см. shiftOneRowAxisAware ниже) — запрос пользователя: "ось — граница
// выравнивания строк". Для "По левому краю"/Центр/Центр½/Лесенка/Лесенка½ — это ПЕРВЫЙ бит
// строки (индекс 0), для "По правому краю" и новой "Лесенки правой" — ПОСЛЕДНИЙ бит (по
// смыслу самого выравнивания). НЕ путать с axisCharIdxOf() — та же идея, но для отдельной
// фичи "Тетрис-Ось" (там ось всегда индекс 0, кроме "⊙ Ось"), её не трогаем.
function nonAxisSnapCharIdx(align, len){
  return (align === "right" || align === "rstairs") ? len - 1 : 0;
}
// "⊙ Ось"/"Ось 1.2" — ◄/►Круг(Инв) в этих режимах двигают ТОЛЬКО картинку (axisOffsetMap), не
// сами данные (st.rows/invFlagsMap не трогаем вообще — инверсия у "Инв"-кнопок тоже не имеет
// смысла без реального изменения бита, поэтому все 4 кнопки ведут себя одинаково, просто двигая
// offset) — запрос пользователя ("строки не меняются, только положение относительно оси").
// axisDelta: ◄ = +1, ► = -1 — шаг индекса символа строки (в её ЕСТЕСТВЕННОМ, НЕ переставленном
// порядке — см. axisRowShift() выше), который сейчас стоит на оси. Галка "⊙ Ось: сдвиг только на
// «1»/между «1-0»" (st.axisSnap) — запрос пользователя: теперь общая НЕ ТОЛЬКО для "⊙ Ось"/
// "Ось 1.2", а для ЛЮБОГО выравнивания (см. ветку else/nonAxisSnapCharIdx ниже):
//  "axis", галка ВКЛ  — на оси может стоять только «1»: шаг повторяется в ту же сторону ПО КРУГУ
//                       (через край строки), пока на оси (off) не окажется «1», либо пока не
//                       пройден полный круг (все нули — на месте).
//  "axis", галка ВЫКЛ — обычный одиночный шаг без поиска, на любой символ (в т.ч. «0»).
//  "axis12", галка ВКЛ  — ось попадает В ЗАЗОР между off и следующим символом (off+1) — это
//                         должна быть пара «1»→«0» (полсимвольный сдвиг, см. halfShiftAttr в
//                         render()), шаг ищет ближайшую такую пару БЕЗ зацикливания через край
//                         строки (см. rowHasOneZeroPair) — упёршись в край, дальше не идёт.
//                         У строк совсем без пары «1»→«0» — заморожено, шаг не делает ничего.
//  "axis12", галка ВЫКЛ — зазор между ЛЮБЫМИ соседними символами, ограничения «1»→«0» нет,
//                         заморозки тоже нет — обычный одиночный шаг индекса зазора (по кругу).
//  ЛЮБОЕ ДРУГОЕ выравнивание, галка ВКЛ — сама строка крутится (realRotateFn), пока на её
//                         "оси" (см. nonAxisSnapCharIdx ниже) не окажется «1», либо пока не
//                         пройден полный круг.
//  ЛЮБОЕ ДРУГОЕ выравнивание, галка ВЫКЛ — обычный одиночный поворот, как раньше.
/* Обратная пара к каждой из четырёх функций поворота — нужна режиму "↩ От края назад" в ОБЫЧНЫХ
   выравниваниях: отразившись от края, строку надо крутить в СТОРОНУ, ПРОТИВОПОЛОЖНУЮ нажатой
   кнопке, а сюда приходит только пара для нажатого направления. Через таблицу, чтобы не менять
   сигнатуру и все четыре места вызова. */
const OPPOSITE_ROT = new Map([
  [rotateStrLeft,     [rotateStrRight,    rotateInvFlagsRight]],
  [rotateStrRight,    [rotateStrLeft,     rotateInvFlagsLeft]],
  [rotateStrLeftInv,  [rotateStrRightInv, rotateInvFlagsRightInv]],
  [rotateStrRightInv, [rotateStrLeftInv,  rotateInvFlagsLeftInv]]
]);
/* Позиция строки внутри её собственного кольца поворотов (0..len-1) для режима "↩ От края назад".
   В обычном режиме не нужна вообще — там поворот и так циклический.
   Это лишь ЗАПАСНОЙ счётчик: основной отсчёт берётся ИЗ ДАННЫХ, см. rotationOffsetFromBase(). */
let rowRotOffMap = new Map();
/* На сколько строка r повёрнута вправо ОТНОСИТЕЛЬНО ИСХОДНОЙ — той, к которой возвращает
   "↺ Сброс" (savedChain.rows у сохранённой вкладки, иначе шаблон tplRows; тот же ориентир, что
   у подсветки "номер изменён" в render()). Считается ПО ДАННЫМ перебором поворотов, а не
   накапливается по нажатиям: сколько раз и в какую сторону строку крутили до этого, знать не
   нужно, а Сброс сам собой возвращает отсчёт в ноль — запрос пользователя ("надо запоминать
   строку и первое её положение при сбросах"). null — сопоставить не удалось: строку правили
   вручную, меняли длину, или биты перевёрнуты "Круг Инв" (тогда чистым поворотом исходную не
   получить) — в этом случае вызывающий код падает на запасной rowRotOffMap.
   У строк с повторяющимся узором ("1010") подходящих k несколько — берём наименьший, чтобы
   отсчёт был однозначным. */
function rotationOffsetFromBase(r, s){
  const tabObj = st.tabs && st.tabs[st.activeTab];
  const baseArr = (tabObj && tabObj.savedChain) ? tabObj.savedChain.rows : st.tplRows;
  const b = (baseArr && baseArr[r]) || "";
  if (!b || !s || b.length !== s.length) return null;
  for (let k = 0; k < s.length; k++) if (rotateRightBy(b, k) === s) return k;
  return null;
}
function shiftOneRowAxisAware(r, axisDelta, realRotateFn, invFlagsRotateFn){
  if (st.align === "axis") {
    const s = st.rows[r];
    const len = s.length;
    if (!len) return;
    let off = getAxisOffset(r, len);
    if (st.axisSnap) {
      for (let i = 0; i < len; i++) {
        off = ((off + axisDelta) % len + len) % len;
        if (s[off] === "1") break;
      }
    } else {
      off = ((off + axisDelta) % len + len) % len;
    }
    axisOffsetMap.set(r, off);
  } else if (st.align === "axis12") {
    const s = st.rows[r];
    const len = s.length;
    if (len < 2) return; // нет ни одного возможного зазора
    if (st.axisSnap) {
      if (!rowHasOneZeroPair(s)) return; // заморожена — пары «1»→«0» нет вообще
      let off = getAxisOffset(r, len);
      let next = off;
      for (let i = 0; i < len; i++) {
        next += axisDelta;
        if (next < 0 || next > len - 2) break; // край строки — без зацикливания
        if (s[next] === "1" && s[next + 1] === "0") { off = next; break; }
      }
      axisOffsetMap.set(r, off);
    } else {
      const gaps = len - 1;
      const off = getAxisOffset(r, len);
      axisOffsetMap.set(r, ((off + axisDelta) % gaps + gaps) % gaps);
    }
  } else if (st.align === "axisbit" || st.align === "axisbit12") {
    const s = st.rows[r];
    const len = s ? s.length : 0;
    if (!len) return;
    const aboveIdx = r - 1;
    const above = aboveIdx >= 0 ? st.rows[aboveIdx] : "";
    if (!above || !above.length) return; // нет строки выше — двигать не на что
    const aboveShift = resolveAxisBitShift(aboveIdx);
    let sh = resolveAxisBitShift(r);
    const shBefore = sh; // нужен ниже, чтобы утащить за собой все строки НИЖЕ на ту же величину
    // ЗНАК ОБРАТНЫЙ axisDelta (запрос пользователя — "жму влево, а реально уходят вправо"):
    // в "⊙ Ось"/"Ось 1.2" axisDelta — шаг ИНДЕКСА символа, стоящего на оси (больше индекс —
    // строка стоит ЛЕВЕЕ, т.к. shift = axisCol − off), поэтому там ◄ = +1. Здесь же sh — это
    // сам СТОЛБЕЦ сдвига строки, где больше = ПРАВЕЕ, то есть та же +1 уводила строку в
    // противоположную нажатой сторону.
    const shStep = -axisDelta;
    // Предел расхождения строк (запрос пользователя: «111» и «0000» вместе дают максимум
    // «1110000» — семь символов, не больше; дальше застопорить). Крайние допустимые положения —
    // те, где строки СТЫКУЮТСЯ без нахлёста и без дыры: sh = aboveShift − len (эта строка
    // кончается ровно там, где начинается верхняя) и sh = aboveShift + above.length (начинается
    // ровно там, где верхняя кончилась). В обоих случаях общая ширина = len + above.length; уйди
    // строка дальше — между ними появится пустой зазор, и суммарная ширина станет БОЛЬШЕ суммы
    // длин, чего и просили не допускать.
    // "ОсьБит ½" — граница та же по смыслу, но считать её надо по ВИДИМОМУ положению строк, а не
    // по целому sh: в этом режиме строка с НЕЧЁТНЫМ числом полушаговых звеньев рисуется на
    // полсимвола левее своего sh (см. isAxisBitBetween/extraCh в render()). У соседних строк эта
    // полушаговая поправка разная, поэтому вещественная граница уезжает на ±0.5 (запрос
    // пользователя — "там не на 1, а на 0,5 надо максимальное расхождение"). Приводим обратно к
    // целому sh через ceil/floor — так стоп срабатывает ровно на полсимвола раньше или позже, но
    // сама строка по-прежнему встаёт на целую позицию. У обычной "ОсьБит" обе поправки нулевые,
    // и формула вырождается в прежнюю.
    const halfOf = (idx) => (st.align === "axisbit12" && axisBitHalfSteps(idx) % 2 === 1) ? 0.5 : 0;
    const halfCorr = halfOf(r) - halfOf(aboveIdx);
    const minSh = Math.ceil(aboveShift + halfCorr - len);
    const maxSh = Math.floor(aboveShift + halfCorr + above.length);
    if (st.axisSnap) {
      // Перебор здесь ЦИКЛИЧЕСКИЙ, как и у "⊙ Ось"/"Ось 1.2", только кольцо не по модулю длины
      // строки, а по допустимому диапазону положений [minSh..maxSh] (см. ниже). Если совпадения
      // нет НИ НА ОДНОМ положении, строка не трогается вовсе — тот же принцип, что у Тетриса при
      // провале перебора (см. axisBitShiftMap.set ниже — не вызывается при found=false), чтобы
      // она не улетала на позицию без совпадения (запрос пользователя "биты ушли за пределы
      // своих осей").
      const requirePair = st.align === "axisbit12";
      const adj = requirePair && (axisBitHalfSteps(r) % 2 === 1) ? 1 : 0;
      // Перебор идёт ПО КОЛЬЦУ внутри допустимого диапазона [minSh..maxSh]: дойдя до края,
      // продолжаем с противоположного, а не останавливаемся (запрос пользователя — "когда Круг
      // сдвиг доходит до конца, надо заново по кольцу крутить, а сейчас останавливается").
      // Раньше тут стоял break по границе, и строка упиралась в край: чтобы добраться до
      // положения, лежащего позади, приходилось жать противоположную кнопку.
      // Сам диапазон при этом НЕ расширен — заворачиваем строго внутри него, и позиция всё так же
      // принимается только по axisBitHasMatch, поэтому "за пределы своих осей" строка уехать
      // по-прежнему не может. Длина цикла = размер диапазона: каждое допустимое положение
      // проверяется ровно один раз, повторов нет.
      const span = maxSh - minSh + 1;
      let found = false;
      let sh2 = sh;
      for (let i = 0; i < span; i++) {
        sh2 = axisBitNextSh(r, sh2, shStep, minSh, maxSh);
        if (axisBitHasMatch(s, sh2, above, aboveShift, requirePair, adj)) { found = true; sh = sh2; break; }
      }
      if (!found) { say("ОсьБит: подходящего положения нет ни на одном сдвиге — строка оставлена на месте."); return; }
    } else {
      // Раньше тут стоял ЗАЖИМ в диапазон (Math.max/Math.min) — упёршись в край, строка вставала
      // намертво и следующие нажатия не меняли ничего вообще (запрос пользователя: "следующее
      // нажатие ничего не меняет"). Теперь край обрабатывается так же, как в ветке со снапом:
      // по умолчанию кольцо, а с "↩ От края назад" — отражение (см. axisBitNextSh).
      sh = axisBitNextSh(r, sh, shStep, minSh, maxSh);
    }
    axisBitShiftMap.set(r, sh);
    // Запрос пользователя: в "ОсьБит"/"ОсьБит ½" вся часть таблицы НИЖЕ сдвигаемой строки едет
    // за ней "монолитом". Строки без собственной записи в axisBitShiftMap и так наследуют сдвиг
    // сверху (см. resolveAxisBitShift) — они последуют сами; а вот те, что когда-то двигали
    // отдельно, имеют свою запись и раньше оставались на месте, разрывая картину. Добавляем им
    // ровно ту же дельту, на которую реально уехала эта строка (не axisDelta: при включённой
    // галке "⊙ На оси только «1»" перебор мог перескочить сразу несколько позиций).
    const shDelta = sh - shBefore;
    if (shDelta) {
      for (let k = r + 1; k < st.rows.length; k++) {
        if (axisBitShiftMap.has(k)) axisBitShiftMap.set(k, axisBitShiftMap.get(k) + shDelta);
      }
    }
  } else if (st.axisSnap) {
    const len = st.rows[r] ? st.rows[r].length : 0;
    if (!len) return;
    const localIdx = nonAxisSnapCharIdx(st.align, len);
    for (let i = 0; i < len; i++) {
      invFlagsMap.set(r, invFlagsRotateFn(getInvFlags(r, st.rows[r].length)));
      st.rows[r] = realRotateFn(st.rows[r]);
      if (st.rows[r][localIdx] === "1") break;
    }
  } else {
    const len = st.rows[r] ? st.rows[r].length : 0;
    if (!len) return;
    // "↩ От края назад" работает и тут: как только первый символ доходит до другого края кольца,
    // строка не перескакивает через границу дальше по кругу, а разворачивается и идёт обратно до
    // упора, потом снова вперёд (запрос пользователя). Положение внутри кольца считаем сами
    // (rowRotOffMap) — по самим данным этого не видно, поворот всегда циклический.
    if (st.axisBitBounce && len > 1) {
      // ЗНАК: axisDelta — это шаг индекса символа, стоящего на оси (◄ = +1, ► = −1), а off здесь
      // считает положение ПЕРВОГО СИМВОЛА строки внутри кольца поворотов, и оно движется в
      // ПРОТИВОПОЛОЖНУЮ сторону: ► сдвигает содержимое вправо, то есть первый символ уезжает на
      // бо́льший индекс. Ровно та же инверсия, что и у shStep = −axisDelta в ветке "ОсьБит" выше.
      // Без неё ► от стартового off = 0 сразу упирался в нижний край и отражался, из-за чего
      // "10000" по ► давало "00001" (поворот ВЛЕВО) вместо "01000" — баг-репорт пользователя.
      const step = -axisDelta;
      // Отсчёт — от ИСХОДНОГО положения строки (то, к которому вернёт "↺ Сброс"), вычисленный по
      // самим данным; запомненное значение нужно только когда сопоставить не вышло (ручная
      // правка/"Круг Инв", см. rotationOffsetFromBase).
      const fromBase = rotationOffsetFromBase(r, st.rows[r]);
      const off = (fromBase != null) ? fromBase : (rowRotOffMap.get(r) || 0);
      const next = axisBitNextSh(r, off, step, 0, len - 1);
      const applied = next - off;
      if (!applied) return;
      rowRotOffMap.set(r, next);
      const pair = (applied === step) ? null : OPPOSITE_ROT.get(realRotateFn);
      const rotFn = pair ? pair[0] : realRotateFn;
      const flagFn = pair ? pair[1] : invFlagsRotateFn;
      invFlagsMap.set(r, flagFn(getInvFlags(r, len)));
      st.rows[r] = rotFn(st.rows[r]);
      return;
    }
    invFlagsMap.set(r, invFlagsRotateFn(getInvFlags(r, st.rows[r].length)));
    st.rows[r] = realRotateFn(st.rows[r]);
  }
}
const bShiftLEl = document.getElementById("bShiftL");
if (bShiftLEl) {
  bShiftLEl.onclick = () => {
    if (!st.selectedRows || st.selectedRows.size === 0) { say("Выделите строку кликом."); return; }
    setLastDirMode("shiftL");
    snapshot();
    for (const r of st.selectedRows) if (st.rows[r]) {
      shiftOneRowAxisAware(r, 1, rotateStrLeft, rotateInvFlagsLeft);
    }
    afterShiftBgCheck(false);
    render(); saveCache();
  };
}

const bShiftRInvEl = document.getElementById("bShiftRInv");

const bPadZerosAboveEl = document.getElementById("bPadZerosAbove");
if (bPadZerosAboveEl) {
  bPadZerosAboveEl.onclick = () => {
    if (!st.selectedRows || st.selectedRows.size === 0) { say("Выделите строку кликом."); return; }
    snapshot();
    // При нескольких выделенных строках цель длины — одна для всех: самая длинная
    // из выделенных (а не каждая своя), иначе более короткая выделенная строка
    // ограничивала бы дополнение строк над ней.
    let len = 0;
    for (const selIdx of st.selectedRows) if (st.rows[selIdx] && st.rows[selIdx].length > len) len = st.rows[selIdx].length;
    for (const selIdx of st.selectedRows) {
      if (!st.rows[selIdx]) continue;
      for (let i = 0; i < selIdx; i++) {
        const rowLen = st.rows[i].length;
        if (rowLen < len) {
          const shift = alignShift(len, rowLen, st.align, i);
          // Math.max(0, …) с обеих сторон — см. комментарий у padToLen() в doStep(): у "лесенок"
          // в минус может уйти и правый остаток, и сам сдвиг.
          st.rows[i] = "0".repeat(Math.max(0, shift)) + st.rows[i] + "0".repeat(Math.max(0, len - rowLen - shift));
        }
      }
    }
    render(); saveCache();
  };
}

/* Тетрис: 1-биты строки НАД выделенной "падают" в неё — в её 0-пустоты. Каждый клик делает
   РОВНО ОДНО из следующих действий (все — отдельными кликами, ничего не объединяется):
   1) Не влезает как есть — крутит выделенную строку РОВНО НА ОДИН круговой сдвиг ЗА ЭТОТ клик —
      видимо, на экране (раньше весь перебор поворотов делался мгновенно внутри одного клика
      скрыто, и если подходящего не находилось, строка на экране вообще не шевелилась — запрос
      пользователя "но ни один раз не сдвинул"). Направление и инверсия — ТЕ ЖЕ, что сейчас
      активны у кнопок ◄/►Круг/Круг Инв (см. tetrisRotateFns()/st.lastDirMode), а не жёстко
      "вправо с инверсией" — запрос пользователя "пусть тетрис 2 и тетрис сдвигают с инверсией
      или без в зависимости от [режима] и направление право-лево". tetrisRotKey/tetrisRotAttempt/
      tetrisRotOriginal(Flags) следят за поиском для ТЕКУЩЕЙ пары (aboveIdx, selIdx): как только
      очередной поворот приводит СТРОКУ ОБРАТНО К ИСХОДНОМУ ВИДУ (полный круг — а у сдвига с
      инверсией это, в отличие от обычного сдвига, может занять ДО 2×длина попыток, не длина-1,
      т.к. значения битов тоже меняются, а не только позиции) — сообщаем о неудаче и
      ВОЗВРАЩАЕМ строку к тому виду, с которого начали поиск (см. tetrisRotOriginal; иначе,
      например, "111" после неудачного перебора навсегда остался бы "001" — запрос пользователя
      "почему для 111 сделал 001").
   2) Уже влезает как есть (сразу либо после одного из поворотов на прошлых кликах) —

    if (rotatedFloor === tetris2FloorOriginal) tetris2FloorAttempt = maxFloorAttempts;
    st.rows[selIdx] = rotatedFloor;
    invFlagsMap.set(selIdx, rotatedFloorFlags);
    render(); saveCache();
    say(`🧱 Тетрис 2: выделенная строка повёрнута (${label}, попытка ${tetris2FloorAttempt}/${maxFloorAttempts}) — нажмите ещё раз.`);
    return;
  }

  if (tetris2BelowAttempt < maxBelowAttempts) {
    // Круг выделенной исчерпан без фита — возвращаем выделенную к истинному оригиналу и крутим
    // строку СНИЗУ на один шаг (запрос пользователя: "если под выделенной строка, в которой на
    // месте выходящего бита стоит 1ца — двигать нижнюю, пока там не будет 0"). Следующие клики
    // снова крутят выделенную полный круг, но уже против НОВОЙ ориентации строки снизу.
    st.rows[selIdx] = tetris2FloorOriginal;
    invFlagsMap.set(selIdx, tetris2FloorOriginalFlags);
    tetris2FloorAttempt = 0;

    const rotatedBelow = rotate(st.rows[belowIdx]);
    const rotatedBelowFlags = rotateFlags(getInvFlags(belowIdx, st.rows[belowIdx].length));
    tetris2BelowAttempt++;
    if (rotatedBelow === tetris2BelowOriginal) tetris2BelowAttempt = maxBelowAttempts;
    st.rows[belowIdx] = rotatedBelow;
    invFlagsMap.set(belowIdx, rotatedBelowFlags);
    render(); saveCache();
    say(`🧱 Тетрис 2: круг выделенной исчерпан — повёрнута строка снизу (${label}, попытка ${tetris2BelowAttempt}/${maxBelowAttempts}) — нажмите ещё раз.`);
    return;
  }

  // Оба круга (выделенной под каждую ориентацию снизу, и самой строки снизу) исчерпаны — нигде
  // не подошло. Возвращаем ОБЕ строки к их истинным оригиналам.
  st.rows[selIdx] = tetris2FloorOriginal;
  invFlagsMap.set(selIdx, tetris2FloorOriginalFlags);
  st.rows[belowIdx] = tetris2BelowOriginal;
  invFlagsMap.set(belowIdx, tetris2BelowOriginalFlags);
  tetris2RotKey = null; tetris2FloorAttempt = 0; tetris2FloorOriginal = null; tetris2FloorOriginalFlags = null;
  tetris2BelowAttempt = 0; tetris2BelowOriginal = null; tetris2BelowOriginalFlags = null;
  render(); saveCache();
  say(`🧱 Тетрис 2: испробованы все повороты обеих строк (${label}) — ни одно расположение не даёт впасть, обе строки возвращены к исходному виду.`);
}
const bTetris2El = document.getElementById("bTetris2");
if (bTetris2El) bTetris2El.onclick = tetris2Drop;

/* Ось ВНУТРИ строки для "Тетрис-Ось" — запрос пользователя ("ось у каждого выравнивания будет —
   0 символ, у каждого кроме выравнивания Ось"): для ЛЮБОГО выравнивания, кроме самой "⊙ Ось" —
   ось строки это просто её ПЕРВЫЙ символ (локальный индекс 0), никакого поиска общего столбца по
   всем строкам больше не нужно. Только под выравниванием "⊙ Ось" ось — текущий индекс символа
   строки, стоящий на общей оси-столбце (см. getAxisOffset/axisRowShift выше — крутится
   ◄/►Круг(Инв) в режиме "Ось"). */
function axisCharIdxOf(rowIdx, len){
  if (!len) return 0;
  return st.align === "axis" ? getAxisOffset(rowIdx, len) : 0;
}

/* Тетрис-Ось — запрос пользователя: по нажатию 1-биты ВЫДЕЛЕННОЙ строки (кроме Оси, см.
   axisCharIdxOf()) двигаются ВВЕРХ, в 0-пустоты строки НАД ней. Ось — единственный бит,
   который никогда не переносится и не учитывается при проверке "влезает ли" — она остаётся "1"
   в выделенной, даже когда все остальные её биты после переноса гасятся в 0.
   Поиск поворота — ОДНОУРОВНЕВЫЙ (запрос пользователя "тут надо вращать выделенную только, а не
   над нею"): крутится ТОЛЬКО ВЫДЕЛЕННАЯ (selIdx) строка, строка НАД (aboveIdx) вообще не
   вращается и остаётся неподвижной "плитой". Ось при этом ВСЕГДА выключена из проверки/переноса
   (позиция внутри выделенной строки не зависит от поворотов — сдвиг и длина не меняются
   вращением). Найдя фит — перенос вверх, выделение переходит на строку НИЖЕ опустевшей. */
let tetrisAxisPendingAdvance = -1;
let tetrisAxisRotKey = null;
let tetrisAxisAttempt = 0;
let tetrisAxisOriginal = null;
let tetrisAxisOriginalFlags = null;
function tetrisAxisDrop(){
  if (!st.selectedRows || st.selectedRows.size !== 1) { say("Выделите ровно одну строку — Тетрис-Ось двигает её биты вверх."); return; }
  const selIdx = Array.from(st.selectedRows)[0];

  if (tetrisAxisPendingAdvance === selIdx) {
    tetrisAxisPendingAdvance = -1;
    const nextIdx = selIdx + 1;
    if (nextIdx >= st.rows.length) { say("🧱 Тетрис-Ось: это последняя строка — переходить некуда."); return; }
    st.selectedRows = new Set([nextIdx]);
    render(); saveCache();
    say(`🧱 Тетрис-Ось: выделение перешло на строку №${nextIdx + 1}.`);
    return;
  }

  if (selIdx <= 0) { say("Над выделенной строкой ничего нет — двигать некуда."); return; }
  const aboveIdx = selIdx - 1;
  const falling0 = st.rows[selIdx] || "";
  const floor0 = st.rows[aboveIdx] || "";
  if (!falling0.length) { say("Выделенная строка пуста — двигать нечего."); return; }
  if (!floor0.length) { say("Строка сверху пуста — двигать некуда."); return; }

  const offset = tetrisAlignOffset(falling0.length, floor0.length, selIdx, aboveIdx);
  const axisCharIdx = axisCharIdxOf(selIdx, falling0.length); // позиция оси ВНУТРИ выделенной
                                               // строки — вращением не меняется (сдвиг и длина
                                               // строк вращением не трогаются), остаётся тем же
                                               // индексом весь поиск.
  const noAxis = (s) => (axisCharIdx >= 0 && axisCharIdx < s.length) ? (s.slice(0, axisCharIdx) + "0" + s.slice(axisCharIdx + 1)) : s;

  if (bitsFitIntoGaps(noAxis(falling0), floor0, offset)) {
    snapshot();
    const fallingChecked = noAxis(falling0);
    const mergedArr = floor0.split("");
    for (let i = 0; i < fallingChecked.length; i++){
      if (fallingChecked[i] === "1") mergedArr[i + offset] = "1";
    }
    st.rows[aboveIdx] = mergedArr.join("");
    // Выделенная гасится в 0, КРОМЕ оси — та остаётся "1" (по определению оси).
    const newSel = "0".repeat(falling0.length).split("");
    if (axisCharIdx >= 0 && axisCharIdx < falling0.length) newSel[axisCharIdx] = "1";
    st.rows[selIdx] = newSel.join("");
    tetrisAxisPendingAdvance = selIdx;
    tetrisAxisRotKey = null;
    tetrisAxisAttempt = 0; tetrisAxisOriginal = null; tetrisAxisOriginalFlags = null;
    render(); saveCache();
    say(`🧱 Тетрис-Ось: биты строки №${selIdx + 1} (кроме оси) перенесены вверх в №${aboveIdx + 1} — нажмите ещё раз, чтобы перейти на строку ниже.`);
    return;
  }

  // Шаг 1: не влезает (без учёта оси) — одноуровневый поиск: крутим ТОЛЬКО falling (выделенную),
  // floor (строка НАД) не трогается вообще. Направление/инверсия — из tetrisRotateFns() (та же,
  // что активна у ◄/►Круг/Круг Инв).
  const { rotate, rotateFlags, label } = tetrisRotateFns();
  const key = aboveIdx + ":" + selIdx;
  if (tetrisAxisRotKey !== key) {
    tetrisAxisRotKey = key;
    tetrisAxisAttempt = 0;
    tetrisAxisOriginal = falling0;
    tetrisAxisOriginalFlags = getInvFlags(selIdx, falling0.length).slice();
  }
  const maxAttempts = tetrisAxisOriginal.length * 2;
  snapshot();

  if (tetrisAxisAttempt < maxAttempts) {
    const rotatedFalling = rotate(st.rows[selIdx]);
    const rotatedFallingFlags = rotateFlags(getInvFlags(selIdx, st.rows[selIdx].length));
    tetrisAxisAttempt++;
    if (rotatedFalling === tetrisAxisOriginal) tetrisAxisAttempt = maxAttempts;
    st.rows[selIdx] = rotatedFalling;
    invFlagsMap.set(selIdx, rotatedFallingFlags);
    render(); saveCache();
    say(`🧱 Тетрис-Ось: выделенная строка повёрнута (${label}, попытка ${tetrisAxisAttempt}/${maxAttempts}) — нажмите ещё раз.`);
    return;
  }

  // Круг исчерпан — нигде не подошло. Возвращаем выделенную к истинному оригиналу.
  st.rows[selIdx] = tetrisAxisOriginal;
  invFlagsMap.set(selIdx, tetrisAxisOriginalFlags);
  tetrisAxisRotKey = null;
  tetrisAxisAttempt = 0; tetrisAxisOriginal = null; tetrisAxisOriginalFlags = null;
  render(); saveCache();
  say(`🧱 Тетрис-Ось: испробованы все повороты выделенной строки (${label}) — ни одно расположение не даёт (без учёта оси) впасть, строка возвращена к исходному виду.`);
}
const bTetrisAxisEl = document.getElementById("bTetrisAxis");
if (bTetrisAxisEl) bTetrisAxisEl.onclick = tetrisAxisDrop;

const bDelFirstEl = document.getElementById("bDelFirst");
if (bDelFirstEl) {
  bDelFirstEl.onclick = () => {
    snapshot();
    let deleted = 0;

    if (st.selectedRows && st.selectedRows.size > 0) {
      for (const idx of st.selectedRows) {
        if (st.rows[idx] && st.rows[idx].length > 0) {
          st.rows[idx] = st.rows[idx].slice(1);
          deleted++;
        }
      }
    } else {
      for (let i = 0; i < st.rows.length; i++) {
        if (st.rows[i] && st.rows[i].length > 0) {
          st.rows[i] = st.rows[i].slice(1);
          deleted++;
        }
      }
    }

    render(); saveCache();
    say(`Удалён первый символ из ${deleted} строк.`);
  };
}

/* Отслеживает "только что добавленный кликом bAddRightToggle бит", чтобы повторный клик по тем
   же строкам переключал его 1↔0 вместо добавления нового — см. bAddRightToggle ниже. Любая
   другая правка этих строк (в т.ч. bDelLast) сбрасывает состояние. */
let addRightState = null; // {idxs:number[], length:number[], value:'0'|'1'}

/* Удалить последний символ (справа) — прямой аналог bDelFirst, только с другого конца строки. */
const bDelLastEl = document.getElementById("bDelLast");
if (bDelLastEl) {
  bDelLastEl.onclick = () => {
    snapshot();
    let deleted = 0;

    if (st.selectedRows && st.selectedRows.size > 0) {
      for (const idx of st.selectedRows) {
        if (st.rows[idx] && st.rows[idx].length > 0) {
          st.rows[idx] = st.rows[idx].slice(0, -1);
          deleted++;
        }
      }
    } else {
      for (let i = 0; i < st.rows.length; i++) {
        if (st.rows[i] && st.rows[i].length > 0) {
          st.rows[i] = st.rows[i].slice(0, -1);
          deleted++;
        }
      }
    }

    addRightState = null; // длины строк поменялись — предыдущий "добавленный бит" больше не актуален
    render(); saveCache();
    say(`Удалён последний символ из ${deleted} строк.`);
  };
}

/* "1/0→" — добавляет бит СПРАВА к выделенным строкам (или всем, если ничего не выделено).
   Первый клик дописывает '1'. Если следующий клик — снова по тем же самым строкам, и с прошлого
   клика их длина/последний символ не менялись НИКАК (ни другой кнопкой, ни правкой, ни undo —
   проверяется по факту, а не флагом "было ли что-то ещё"), то новый бит НЕ добавляется, а тот же
   самый последний символ переключается 1↔0. Любое постороннее изменение длины/содержимого этих
   строк само по себе "сбрасывает" продолжение — следующий клик снова допишет новый бит. */
const bAddRightToggleEl = document.getElementById("bAddRightToggle");
if (bAddRightToggleEl) {
  bAddRightToggleEl.onclick = () => {
    const idxs = (st.selectedRows && st.selectedRows.size > 0)
      ? Array.from(st.selectedRows).sort((a, b) => a - b)
      : st.rows.map((_, i) => i);
    if (idxs.length === 0) { say("Нечего дополнять — нет строк."); return; }

    const canToggle = !!addRightState
      && addRightState.idxs.length === idxs.length
      && addRightState.idxs.every((v, i) => v === idxs[i])
      && idxs.every((idx, i) => st.rows[idx]
        && st.rows[idx].length === addRightState.length[i]
        && st.rows[idx][st.rows[idx].length - 1] === addRightState.value);

    snapshot();
    if (canToggle) {
      const newVal = addRightState.value === "1" ? "0" : "1";
      for (const idx of idxs) st.rows[idx] = st.rows[idx].slice(0, -1) + newVal;
      addRightState.value = newVal;
      addRightState.length = idxs.map(idx => st.rows[idx].length);
      say(`Добавленный бит переключён на ${newVal} (${idxs.length} строк).`);
    } else {
      for (const idx of idxs) {
        if (st.rows[idx] == null) continue;
        st.rows[idx] = st.rows[idx] + "1";
      }
      addRightState = {
        idxs: idxs.slice(),
        length: idxs.map(idx => st.rows[idx] ? st.rows[idx].length : 0),
        value: "1"
      };
      say(`Добавлена 1 справа (${idxs.length} строк). Повторный клик — переключит на 0.`);
    }
    render(); saveCache();
  };
}

const bXorSelectedEl = document.getElementById("bXorSelected");
if (bXorSelectedEl) {
  bXorSelectedEl.onclick = () => {
    if (!st.selectedRows || st.selectedRows.size === 0) { say("Выделите строку кликом."); return; }
    const selIdx = Math.min(...Array.from(st.selectedRows));

}

const bInterleaveSearchEl = document.getElementById("bInterleaveSearch");

/* "⧬ Интерлив сквозной" — старт с строки, отмеченной выделением (нужна хотя бы одна строка ВЫШЕ
   для сквозной и одна строка НИЖЕ для паттерна-цели, см. doInterleaveSeqStep()). Если поиск УЖЕ
   идёт (st.interleaveSeqMode) — повторный клик кнопкой ПРОДОЛЖАЕТ его на один сдвиг дальше, а не
   перезапускает с offset=0 на той же строке: раньше сброс шёл БЕЗУСЛОВНО на каждый клик, поэтому
   ручные повторные клики (в отличие от "🚀 Авто", который сам крутит цикл и сюда не заходит)
   зацикливались на первом же сдвиге (см. запрос пользователя — "не делает сдвиги"). */
const bInterleaveSeqSearchEl = document.getElementById("bInterleaveSeqSearch");
if (bInterleaveSeqSearchEl) {
  bInterleaveSeqSearchEl.onclick = () => {
    if (st.interleaveSeqMode) { doInterleaveSeqStep(); return; }
    if (!st.selectedRows || st.selectedRows.size === 0) { say("Выделите строку кликом."); return; }
    const idx = Math.min(...Array.from(st.selectedRows));
    if (idx <= 0 || idx + 1 >= st.rows.length) {
      say("Нужна хотя бы одна строка выше выделенной (для сквозной) и одна ниже (для паттерна).");
      return;
    }
    // Взаимоисключающая подсветка с остальными "режимами Авто" (Шаг/XOR/.../Круг/Спираль/XOR
    // сквозной) — тот же приём, что и у setLastDirMode()/setMode(): гасим их, раз теперь этот
    // режим тоже полноценно участвует в mode-act (см. запрос пользователя, кнопка перенесена
    // в flowGroup).
    if (st.lastDirMode) setLastDirMode(null);
    STEP_MODE_BTN_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove("mode-act"); });
    st.xorSelectedMode = false;
    st.interleaveMode = false;
    st.xorSeqMode = false;
    const xorSeqBtn = document.getElementById("bXorSeqSearch");
    if (xorSeqBtn) xorSeqBtn.classList.remove("mode-act");

    st.interleaveSeqMode = true;
    st.interleaveSeqIdx = idx;
    st.interleaveSeqOffset = 0;
    st.interleaveSeqTryRow = -1;
    st.interleaveSeqBlockN = 1;
    bInterleaveSeqSearchEl.classList.add("mode-act");
    say(`Режим Интерлив сквозной активен. Ищу подходящий поворот...`);
    doInterleaveSeqStep();
  };
}

/* "⨁ XOR сквозной" — то же самое, что "⧬ Интерлив сквозной" выше, только XOR вместо интерливинга
   (см. doXorSeqStep(), запрос пользователя — "также надо чтобы работал Xor"). */
const bXorSeqSearchEl = document.getElementById("bXorSeqSearch");
if (bXorSeqSearchEl) {
  bXorSeqSearchEl.onclick = () => {
    if (st.xorSeqMode) { doXorSeqStep(); return; }
    if (!st.selectedRows || st.selectedRows.size === 0) { say("Выделите строку кликом."); return; }
    const idx = Math.min(...Array.from(st.selectedRows));
    if (idx <= 0 || idx + 1 >= st.rows.length) {
      say("Нужна хотя бы одна строка выше выделенной (для сквозной) и одна ниже (для паттерна).");
      return;
    }
    if (st.lastDirMode) setLastDirMode(null);
    STEP_MODE_BTN_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove("mode-act"); });
    st.xorSelectedMode = false;
    st.interleaveMode = false;
    st.interleaveSeqMode = false;
    const seqBtn = document.getElementById("bInterleaveSeqSearch");
    if (seqBtn) seqBtn.classList.remove("mode-act");

    st.xorSeqMode = true;
    st.xorSeqIdx = idx;
    st.xorSeqOffset = 0;
    st.xorSeqTryRow = -1;
    bXorSeqSearchEl.classList.add("mode-act");
    say(`Режим XOR сквозной активен. Ищу подходящий поворот...`);
    doXorSeqStep();
  };
}

function doInterleaveStep() {
  if (!st.interleaveMode || st.interleavePairIdx < 0) return false;

  const aIdx = st.interleavePairIdx;
  const bIdx = aIdx + 1;

  if (bIdx >= st.rows.length) {
    st.interleaveMode = false;
    say("Конец строк.");
    return false;
  }

  const rowA = getRowBits(st, aIdx);
  const rowB = getRowBits(st, bIdx);
  const intResult = interleavePair(rowA, rowB, st.align);

  let searchResult = intResult;
  const cInterleaveXor = document.getElementById("cInterleaveXor");
  const useXor = cInterleaveXor && cInterleaveXor.checked;

  if (useXor) {
    searchResult = xorPair(intResult, rowB, st.align);
    say(`Интерливинг (${aIdx+1}-${bIdx+1}) + XOR нижней: ${searchResult}`);
  } else {
    say(`Интерливинг (${aIdx+1}-${bIdx+1}): ${searchResult}`);
  }

  const nextPatIdx = bIdx + 1;
  const nextPat = st.pats[nextPatIdx];

  if (!nextPat || !nextPat.text) {
    st.interleaveMode = false;
    say("Нет паттерна для сравнения.");
    return false;
  }

  const patFull = nextPat.text;
  const patSkip = st.skipFirst && patFull.length > 1 ? patFull.slice(1) : patFull;
  const patRev = reverseStr(patFull);
  const patRevSkip = patRev.length > 1 ? patRev.slice(1) : "";

  let matchType = "";
  if (searchResult.indexOf(patFull) >= 0) {
    matchType = "паттерн целиком";
  } else if (patSkip !== patFull && searchResult.indexOf(patSkip) >= 0) {
    matchType = "паттерн без 1-го";
  } else if (searchResult.indexOf(patRev) >= 0) {
    matchType = "реверс целиком";
  } else if (patRevSkip && searchResult.indexOf(patRevSkip) >= 0) {
    matchType = "реверс без 1-го";
  }

  if (matchType) {
    st.interleaveMode = false;
    st.selectedRows.clear();
    st.selectedRows.add(bIdx);
    st.selectedRows.add(nextPatIdx);
    st.aIdx = bIdx;
    st.bIdx = nextPatIdx;
    render(); saveCache();
    say(`✓ Совпадение (${matchType})! Выделение на ${bIdx + 1}-${nextPatIdx + 1}`);
    return false;
  }

  st.interleavePairIdx = bIdx;
  return true;
}

/* "Интерлив сквозной" (см. #bInterleaveSeqSearch): правая часть — САМА строка idx, БЕЗ поворотов
   (как есть, getRowBits()); крутится не она, а ЛЕВАЯ часть — сквозная (все строки ВЫШЕ idx +
   САМА строка idx, horizChainText(idx) + getRowBits(st, idx) — см. запрос пользователя: без её
   собственных бит перебор поворотов не проходил по всей длине кольца): строка "прогоняется" по
   всей длине сквозной — крутится не сама сквозная, а её "кольцо" (seq + ringNextLap(seq), тот же
   довесок, что рисуется в Черновике как "Скв×2") — rotationsOf() перебирает повороты ЭТОГО
   удвоенного кольца, а не просто seq: без довеска перебор проходил только по половине того, что
   визуально показано кольцом, и при включённой 🔁 Инв.кольцо/реверс пропускал реально другие
   сдвиги (см. запрос пользователя). Дальше — повторяются. На каждом повороте строка интерливится
   с НАЧАЛА этого повёрнутого варианта (выравнивание всегда "left" — именно это и даёт "скольжение" строки по
   всей длине сквозной, а не одно фиксированное положение по st.align). Проверяем каждый сдвиг
   против паттерна СЛЕДУЮЩЕЙ строки (idx+1), как обычный Интерлив. Строка не меняется — нечего
   сохранять, просто фиксируем найденный сдвиг и, в отличие от обычного "⧬ Интерлив" (который
   останавливается на первом же совпадении), сразу продолжаем на следующую строку — та же
   сквозная теперь включает и её.

   Если у idx не нашлось совпадения НИ НА ОДНОМ сдвиге — не останавливаемся сразу, а пробуем
   строку НАД ней (idx-1), потом ещё выше и т.д., с той же самой (замороженной) сквозной и тем же
   паттерном-целью idx+1 (см. tryRow ниже, запрос пользователя). Останавливаемся, только когда
   НИ ОДНА строка от idx и выше не подошла, или строки кончились.

   ОДИН ВЫЗОВ = ОДИН СДВИГ (см. запрос пользователя — "пока так сделаем чтобы убедиться как
   работает"): не перебираем все повороты за раз молча, а на каждом отдельном сдвиге логируем
   сквозную (в её текущем повороте) и саму строку в "Черновик последнего шага" (logStep(), те же
   inputs, что показывает обычный черновик) — так видно, что реально проверяется на каждом шаге.
   st.interleaveSeqOffset хранит, на каком сдвиге текущей строки мы сейчас; сбрасывается в 0 при
   переходе на новую строку. */
/* Останавливает "Интерлив сквозной" и гасит подсветку её кнопки — единая точка выхода вместо
   разбросанных "st.interleaveSeqMode = false" по всей doInterleaveSeqStep(), чтобы подсветка
   .mode-act всегда гасла синхронно с самим флагом (см. запрос пользователя — режим должен вести
   себя как остальные режимы "Авто", взаимоисключающе). */
function stopInterleaveSeq(msg){
  st.interleaveSeqMode = false;
  const btn = document.getElementById("bInterleaveSeqSearch");
  if (btn) btn.classList.remove("mode-act");
  if (msg) say(msg);
}

function doInterleaveSeqStep() {
  if (!st.interleaveSeqMode || st.interleaveSeqIdx < 0) return false;

  const idx = st.interleaveSeqIdx;
  if (idx <= 0 || idx >= st.rows.length) {
    stopInterleaveSeq("Конец строк.");
    return false;
  }

  const nextPatIdx = idx + 1;
  const nextPat = st.pats[nextPatIdx];
  if (!nextPat || !nextPat.text) {
    stopInterleaveSeq("Нет паттерна для сравнения.");
    return false;
  }

  // Сквозная и паттерн-цель ЗАМОРОЖЕНЫ на весь перебор. Сквозная включает и саму ВЫДЕЛЕННУЮ
  // строку (idx), не только строки строго выше неё (см. запрос пользователя) — иначе перебор
  // поворотов не проходил по всей длине кольца.
  const seq = horizChainText(idx) + getRowBits(st, idx);
  if (!seq.length) {
    stopInterleaveSeq("Сквозная пустая — нет строк выше для интерливинга.");
    return false;
  }

  // 🪞 "Сквозная сама с собой" (st.seqSelfMode) — правая (неподвижная) часть тоже сама seq, а не
  // строка idx: сквозная въезжает сама в себя навстречу, голова к голове (см. запрос
  // пользователя).
  const selfMode = !!st.seqSelfMode;
  const row = selfMode ? seq : getRowBits(st, idx);
  // "Кольцо" для перебора поворотов — сква + ОДИН дополнительный виток (ringNextLap, тот же,
  // что рисуется в Черновике как "Скв×2") — см. запрос пользователя: без витка перебор шёл
  // только по ПОЛОВИНЕ того, что визуально показано кольцом. При включённой 🔁 Инв.кольцо/
  // реверс виток даёт РЕАЛЬНО другие сдвиги (не повтор seq), их нельзя пропускать.
  const ringSeq = seq + ringNextLap(seq);
  const seqRotations = row.length ? rotationsOf(ringSeq) : [];
  const offset = st.interleaveSeqOffset || 0;

  // 🧱 Блочный интерлив (st.interleaveSeqBlockN): раньше на "ни один сдвиг не подошёл" режим
  // переключался на строку ВЫШЕ — теперь ВМЕСТО этого пробует БОЛЬШИЙ размер блока: N=1 — обычный
  // побитовый интерлив (1 бит сквозной, 1 бит строки, снова 1...), N=2 — блоками по 2 символа,
  // N=3 — по 3, и т.д. (см. запрос пользователя — "если не наход, то делает интерливинг не через
  // 1 бит а через 2 бита потом через 3 и тд", "вместо" перехода на строку выше, не "и"). Строка
  // всегда одна — idx (или сама seq в selfMode), больше не переключается. Максимум — длина row:
  // при N ≥ row.length блок уже не даёт новой структуры (вся строка уходит одним куском).
  if (!st.interleaveSeqBlockN || st.interleaveSeqBlockN < 1) st.interleaveSeqBlockN = 1;
  const blockN = st.interleaveSeqBlockN;

  if (!row.length || offset >= seqRotations.length) {
    const maxN = Math.max(1, row.length);
    if (!row.length || blockN >= maxN) {
      st.interleaveSeqOffset = 0;
      st.interleaveSeqBlockN = 1;
      stopInterleaveSeq(`Интерлив сквозной${selfMode ? " (сама с собой)" : ""}: для строки ${idx + 1} совпадений не найдено ни на одном сдвиге ни при одном размере блока (1..${maxN}).`);
      return false;
    }
    st.interleaveSeqBlockN = blockN + 1;
    st.interleaveSeqOffset = 0;
    say(`Интерлив сквозной: блок ${blockN} не подошёл ни на одном сдвиге, пробую блок ${blockN + 1}...`);
    render(); saveCache();
    return true;
  }

  const patFull = nextPat.text;
  const seqRot = seqRotations[offset];
  const searchResult = interleavePair(seqRot, row, "left", blockN);

  // findPatternKinds() — тот же общий поиск, что и у обычных шагов/фон-поиска: сама учитывает
  // "⏭ Без 1-го" (st.skipFirst) И "⇌ Инв/Рев" (st.allKinds — инверсия/реверс/инверсия+реверс).
  // Она же ищет по КОЛЬЦУ (text + ringNextLap(text).slice(0,len-1) внутри) — а ringNextLap() сама
  // учитывает "🔁 Инв. кольцо" (st.ringInvert), так что и оно уже подключено само собой, раз
  // поиск идёт через findPatternKinds(), а не через ручной indexOf() (см. запросы пользователя —
  // "Без 1-го подключается?"/"Инв.кольцо тоже должна тут работать"/"по кольцу потом ищется?").
  const kinds = findPatternKinds(searchResult, patFull);
  const matchType = kinds.length ? KIND_LABELS_RU[kinds[0].kind] + (kinds[0].skip ? " (без 1-го)" : "") : "";

  // Раскраска "Итог" по ИСТОЧНИКУ каждого символа (все биты строки — синим) — см.
  // interleavePairMarked()/.interleave-src-row в CSS. И ДОПОЛНИТЕЛЬНО — сам найденный паттерн
  // (kinds, уже посчитан выше), чтобы было видно, ГДЕ конкретно совпадение (см. запрос
  // пользователя — "не вижу в результирующей нахождения паттерна"). blockN — та же блочность,
  // что и у самого поиска (searchResult), иначе подсветка разъехалась бы с текстом.
  const searchResultHtml = interleavePairMarked(seqRot, row, "left", kinds, blockN);

  // Для показа в Черновике — сквозная НЕПОДВИЖНА (не повёрнутая seqRot, а исходная seq) и
  // УДВОЕНА, т.к. сдвиг кольцевой — строка на больших offset вылезает за правый край ОДНОЙ
  // сквозной и "заезжает" на её начало по кругу, второй экземпляр справа это показывает вместо
  // обрезки на границе. Второй (довесочный) экземпляр — СЕРЫМ (та же .chain-ring-ext, что и у
  // "Результат фон-поиска"), чтобы визуально не путать его с настоящей сквозной; и это
  // ringNextLap(seq), а не голое повторение seq — если включена "🔁 Инв. кольцо" (st.ringInvert),
  // довесок реально ИНВЕРТИРОВАН (0↔1), как и при настоящем кольцевом поиске в
  // findPatternKinds() (см. запрос пользователя). Строка — с отступом в offset пробелов, чтобы
  // был виден сдвиг бит-в-бит (сам поиск по-прежнему считается через seqRot — это лишь то же
  // самое сравнение в эквивалентном отображении). Короткая подпись "Скв×2" (не длинное
  // описание) — не влезающая в 36px-колонку подписей сбивала бы общее выравнивание битов у всех
  // строк Черновика.
  const seqExtHtml = bitsHtml(seq) + '<span class="chain-ring-ext">' + bitsHtml(ringNextLap(seq)) + '</span>';
  const rowLabel = selfMode ? "Сквозная" : ("№" + (idx + 1));
  const blockTag = blockN > 1 ? `, блок ${blockN}` : "";
  const stepDesc = (selfMode ? "Сквозная сама с собой" : `Строка ${idx + 1}`) +
      `, сдвиг сквозной ${offset}/${seqRotations.length - 1}${blockTag}, паттерн строки ${nextPatIdx + 1} — ` +
      (matchType ? `совпадение (${matchType})` : "нет совпадения");
  logStep(
    "Интерлив сквозной",
    // selfMode: правая часть — вся сквозная 0..idx, показываем весь её диапазон строк, а не
    // одну строку (formatOpRows сам сожмёт массив в диапазон "1-N").
    selfMode ? Array.from({ length: idx + 1 }, (_, i) => i + 1) : [idx + 1],
    searchResult,
    stepDesc,
    [],
    [{ name: "Скв×2", html: seqExtHtml }, { name: rowLabel, text: " ".repeat(offset) + row }],
    null,
    searchResultHtml
  );
  // Живой пересчёт при смене st.seqGlueMode/st.ringInvert/st.ringReverse/st.seqSelfMode ПОСЛЕ
  // записи шага — см. recomputeSeqStepDisplay()/renderStepLogBox(). tryRow сохраняется = idx
  // (для совместимости с recomputeSeqStepDisplay, откат на строку выше там больше не бывает).
  st.lastOp.seqStepInfo = { idx, tryRow: idx, offset, blockN, mode: 'interleave' };

  const foundLabel = selfMode ? "сама с собой" : `строка ${idx + 1}`;
  if (matchType) {
    // В выделении остаётся ТОЛЬКО следующая строка (nextPatIdx), не обе — иначе повторный клик
    // по кнопке (он берёт старт как Math.min(...selectedRows), см. её обработчик) снова находил
    // бы МЕНЬШИЙ индекс (уже пройденную) и перезапускал поиск вместо продолжения дальше.
    st.selectedRows.clear();
    st.selectedRows.add(nextPatIdx);
    st.aIdx = idx;
    st.bIdx = nextPatIdx;
    say(`✓ Интерлив сквозной: ${foundLabel} — найдено (${matchType}, сдвиг сквозной ${offset}${blockTag}), иду дальше...`);
    st.interleaveSeqIdx = idx + 1;
    st.interleaveSeqOffset = 0;
    st.interleaveSeqBlockN = 1;
    render(); saveCache();
    return true;
  }

  st.interleaveSeqOffset = offset + 1;
  say(`Интерлив сквозной: ${foundLabel}, блок ${blockN}, сдвиг ${offset + 1}/${seqRotations.length}...`);
  render(); saveCache();
  return true;
}

/* Останавливает "XOR сквозной" и гасит подсветку её кнопки — см. stopInterleaveSeq() выше,
   тот же приём. */
function stopXorSeq(msg){
  st.xorSeqMode = false;
  const btn = document.getElementById("bXorSeqSearch");
  if (btn) btn.classList.remove("mode-act");
  if (msg) say(msg);
}

/* "XOR сквозной" (см. #bXorSeqSearch) — ПОЛНАЯ копия механики doInterleaveSeqStep() выше (та же
   заморозка сквозной/паттерна-цели, тот же перебор по кругу с откатом на строку выше при полном
   провале, тот же "один вызов = один сдвиг"), только комбинирование через xorPair()/
   xorPairMarked() вместо interleavePair()/interleavePairMarked() (см. запрос пользователя —
   "также надо чтобы работал Xor", по образцу интерливинга по сквозной). */
function doXorSeqStep() {
  if (!st.xorSeqMode || st.xorSeqIdx < 0) return false;

  const idx = st.xorSeqIdx;
  if (idx <= 0 || idx >= st.rows.length) {
    stopXorSeq("Конец строк.");
    return false;
  }

  const nextPatIdx = idx + 1;
  const nextPat = st.pats[nextPatIdx];
  if (!nextPat || !nextPat.text) {
    stopXorSeq("Нет паттерна для сравнения.");
    return false;
  }

  // Сквозная включает и саму ВЫДЕЛЕННУЮ строку (idx) — см. doInterleaveSeqStep() выше, тот же фикс.
  const seq = horizChainText(idx) + getRowBits(st, idx);
  if (!seq.length) {
    stopXorSeq("Сквозная пустая — нет строк выше для XOR.");
    return false;
  }

  // 🪞 "Сквозная сама с собой" (st.seqSelfMode) — см. doInterleaveSeqStep() выше, тот же фикс.
  const selfMode = !!st.seqSelfMode;
  if (st.xorSeqTryRow < 0 || st.xorSeqTryRow > idx) st.xorSeqTryRow = idx;
  const tryRow = selfMode ? idx : st.xorSeqTryRow;

  const row = selfMode ? seq : getRowBits(st, tryRow);
  // "Кольцо" для перебора — см. doInterleaveSeqStep() выше, тот же фикс (иначе перебор шёл
  // только по половине кольца, показанного в Черновике как "Скв×2").
  const ringSeq = seq + ringNextLap(seq);
  const seqRotations = row.length ? rotationsOf(ringSeq) : [];
  const offset = st.xorSeqOffset || 0;

  if (!row.length || offset >= seqRotations.length) {
    if (selfMode || tryRow <= 0) {
      st.xorSeqOffset = 0;
      st.xorSeqTryRow = -1;
      stopXorSeq(selfMode
        ? `XOR сквозной (сама с собой): для строки ${idx + 1} совпадений не найдено ни на одном сдвиге.`
        : `XOR сквозной: для строки ${idx + 1} совпадений не найдено ни в одной строке от неё и выше.`);
      return false;
    }
    st.xorSeqTryRow = tryRow - 1;
    st.xorSeqOffset = 0;
    say(`XOR сквозной: строка ${tryRow + 1} не подошла ни на одном сдвиге, пробую строку ${tryRow} (выше)...`);
    render(); saveCache();
    return true;
  }

  const patFull = nextPat.text;
  const seqRot = seqRotations[offset];
  const searchResult = xorPair(seqRot, row, "left");

  const kinds = findPatternKinds(searchResult, patFull);
  const matchType = kinds.length ? KIND_LABELS_RU[kinds[0].kind] + (kinds[0].skip ? " (без 1-го)" : "") : "";

  // Подсветка найденного паттерна поверх "Итога" — см. interleavePairMarked() выше.
  const searchResultHtml = xorPairMarked(seqRot, row, "left", kinds);
  const seqExtHtml = bitsHtml(seq) + '<span class="chain-ring-ext">' + bitsHtml(ringNextLap(seq)) + '</span>';
  const rowLabel = selfMode ? "Сквозная" : ("№" + (tryRow + 1));
  const stepDesc = (selfMode ? "Сквозная сама с собой" : (`Строка ${tryRow + 1}` + (tryRow !== idx ? ` (вместо ${idx + 1})` : ""))) +
      `, сдвиг сквозной ${offset}/${seqRotations.length - 1}, паттерн строки ${nextPatIdx + 1} — ` +
      (matchType ? `совпадение (${matchType})` : "нет совпадения");
  logStep(
    "XOR сквозной",
    selfMode ? Array.from({ length: idx + 1 }, (_, i) => i + 1) : [tryRow + 1],
    searchResult,
    stepDesc,
    [],
    [{ name: "Скв×2", html: seqExtHtml }, { name: rowLabel, text: " ".repeat(offset) + row }],
    null,
    searchResultHtml
  );
  st.lastOp.seqStepInfo = { idx, tryRow, offset, mode: 'xor' };

  const foundLabel = selfMode ? "сама с собой" : `строка ${tryRow + 1}`;
  if (matchType) {
    st.selectedRows.clear();
    st.selectedRows.add(nextPatIdx);
    st.aIdx = tryRow;
    st.bIdx = nextPatIdx;
    say(`✓ XOR сквозной: ${foundLabel} — найдено (${matchType}, сдвиг сквозной ${offset}), иду дальше...`);
    st.xorSeqIdx = idx + 1;
    st.xorSeqTryRow = -1;
    st.xorSeqOffset = 0;
    render(); saveCache();
    return true;
  }

  st.xorSeqOffset = offset + 1;
  say(`XOR сквозной: ${foundLabel}, сдвиг ${offset + 1}/${seqRotations.length}...`);
  render(); saveCache();
  return true;
}

function doXorSelectedStep() {
  if (!st.xorSelectedMode || st.xorSelectedIdx < 0) return false;

  const selIdx = st.xorSelectedIdx;
  const xorResult = xorRowsDownTo(st.rows, selIdx, st.align, st);

  const nextPatIdx = selIdx + 1;
  const nextPat = st.pats[nextPatIdx];

  if (!nextPat || !nextPat.text) {
    st.xorSelectedMode = false;
    say("Нет паттерна для сравнения.");
    return false;
  }

  const aIdx = 0, bIdx = nextPatIdx - 1;
  const chain = buildChain(st, aIdx, bIdx);
  const searchText = chain.text + xorResult;

  if (!searchText.length) {
    snapshot();
    st.rows[selIdx + 1] = rotateStrRight(st.rows[selIdx + 1]);
    render(); saveCache();
    return true;
  }

  const patFull = nextPat.text;
  const patSkip = st.skipFirst && patFull.length > 1 ? patFull.slice(1) : patFull;
  const patRev = reverseStr(patFull);
  const patRevSkip = patRev.length > 1 ? patRev.slice(1) : "";

  let matchType = "";

  if (patFull && searchText.indexOf(patFull) >= 0) {
    matchType = "паттерн целиком";
  } else if (patSkip !== patFull && searchText.indexOf(patSkip) >= 0) {
    matchType = "паттерн без 1-го";
  } else if (patRev && searchText.indexOf(patRev) >= 0) {
    matchType = "реверс целиком";
  } else if (patRevSkip && searchText.indexOf(patRevSkip) >= 0) {
    matchType = "реверс без 1-го";
  }

  if (matchType) {
    st.xorSelectedMode = false;
    st.selectedRows.clear();
    st.selectedRows.add(selIdx + 1);
    st.aIdx = selIdx + 1;
    st.bIdx = Math.min(selIdx + 2, st.rows.length - 1);
    render(); saveCache();
    say(`✓ Совпадение (${matchType})! Перейдено на строку ${selIdx + 2}`);
    return false;
  }

  snapshot();
  st.rows[selIdx + 1] = rotateStrRight(st.rows[selIdx + 1]);
  render(); saveCache();
  return true;
}

// ГЛОБАЛЬНЫЕ ХОТКЕИ (срабатывают, только если мы не вводим текст в инпутах)
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;

  // Ctrl+Z / Cmd+Z — отмена ЛЮБОЙ ручной операции (снапшот берётся тем же
  // общим механизмом, что и у обычного шага: редактирование строки, сдвиг,
  // добавление нулей, удаление первого символа и т.д. — все они уже вызывают snapshot()).
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") {
    e.preventDefault();
    document.getElementById("bUndo").click();
    return;
  }

  // Ctrl+C / Cmd+C — копирует выделенные (кликом) строки текстом, с выравниванием (см.
  // copySelectedRows). Если ничего не выделено кликом ИЛИ есть обычное текстовое выделение
  // мышью (например в окошке результата) — не вмешиваемся, пусть браузер копирует как обычно.
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c") {
    if (st.selectedRows && st.selectedRows.size > 0 && !window.getSelection().toString()) {
      e.preventDefault();
      copySelectedRows();
      return;
    }
  }

  if (e.key === "Enter") {
    e.preventDefault();
    autoRun();
  } else if (e.key === "Escape") {
    e.preventDefault();
    closeMenus();
    document.getElementById("bReset").click();
    // Выделение строк (st.selectedRows) Escape НЕ трогает — то же поведение, что и у клика по
    // самой кнопке "↺ Сброс" (см. resetAll()) — запрос пользователя (отменяет более раннее
    // "снимай выделение по Escape").
    // НАТИВНОЕ выделение текста браузером (протяжка мышью по битам/паттернам, обычный
    // window.getSelection()) — отдельная штука от st.selectedRows, Escape его по-прежнему чистит.
    if (window.getSelection) {
      const sel = window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
    }
  } else if (e.key === "Delete") {
    // Delete — удалить выделенные (кликом) строки. НЕ связано с откатом шага.
    e.preventDefault();
    deleteSelectedRows();
  } else if (e.key === "Backspace") {
    e.preventDefault();
    document.getElementById("bUndo").click();
  } else if (e.key === "F2") {
    // Редактирование выделенной строки (если выделена ровно одна)
    e.preventDefault();
    if (st.selectedRows && st.selectedRows.size === 1) {
      startEditRow([...st.selectedRows][0]);
    }
  } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && st.selectedCol >= 0) {
    // Пока выбран столбец, ◄► переключают ВЫБРАННЫЙ СТОЛБЕЦ (не крутят символы строк).
    e.preventDefault();
    let maxLen = 0;
    for (const s of st.rows) if (s.length > maxLen) maxLen = s.length;
    const next = e.key === "ArrowRight" ? Math.min(visibleColCount(maxLen) - 1, st.selectedCol + 1) : Math.max(0, st.selectedCol - 1);
    selectColumn(next);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (bShiftLEl) bShiftLEl.click();
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    if (bShiftREl) bShiftREl.click();
  } else if (e.code === "Numpad4") {
    // Нумпад 4/6 — те же ◄/►, но с инверсией бита на границе (см. bShiftLInv/bShiftRInv).
    // e.code (не e.key) — чтобы работало независимо от NumLock (иначе e.key от Numpad4 при
    // выключенном NumLock совпадает с обычной ArrowLeft и перехватывался бы веткой выше).
    e.preventDefault();
    if (bShiftLInvEl) bShiftLInvEl.click();
  } else if (e.code === "Numpad6") {
    e.preventDefault();
    if (bShiftRInvEl) bShiftRInvEl.click();
  } else if (e.code === "Numpad0") {
    // Нумпад 0 — переключить разделитель-границу снизу выделенной строки (см. toggleRowDivider).
    e.preventDefault();
    toggleRowDivider();
  } else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && st.diagFoldPick) {
    // Пока в "Результате" ВЫБРАНА ДИАГОНАЛЬ (клик по её строке, см. st.diagFoldPick), ▲▼
    // переключают выбор на соседнюю диагональ, а не двигают выделение строк (запрос пользователя).
    // Список берём прямо из отрисованной панели — тогда порядок ровно тот, что видно на экране,
    // включая обе стороны (Диаг. ↘ и Диаг. ↙) и хвостовую строку "#49+". По краям заворачивается.
    // Снять выбор (и вернуть ▲▼ выделению строк) — повторный клик по выбранной строке.
    e.preventDefault();
    const diagKeys = Array.from(document.querySelectorAll("#chainText .chain-result-line"))
      .map(el => el.dataset.mode)
      .filter(m => m && m.indexOf("#") >= 0);
    if (!diagKeys.length) return;
    let di = diagKeys.indexOf(st.diagFoldPick);
    di = di < 0 ? 0 : (di + (e.key === "ArrowDown" ? 1 : -1) + diagKeys.length) % diagKeys.length;
    bgResultExpanded.delete(st.diagFoldPick);
    st.diagFoldPick = diagKeys[di];
    bgResultExpanded.add(st.diagFoldPick);
    render();
    const pickedEl = document.querySelector('#chainText .chain-result-line[data-mode="' + st.diagFoldPick + '"]');
    if (pickedEl) pickedEl.scrollIntoView({ block: "nearest" });
  } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    // Двигает ВЫДЕЛЕНИЕ строки вверх/вниз (не путать с ◄► — те крутят символы внутри строки).
    e.preventDefault();
    if (!st.selectedRows) st.selectedRows = new Set();
    const n = Math.max(st.rows.length, st.pats.length);
    if (n === 0) return;
    let cur = st.selectedRows.size === 1 ? [...st.selectedRows][0] : st.bIdx;
    if (typeof cur !== "number" || cur < 0) cur = 0;
    const next = e.key === "ArrowDown" ? Math.min(n - 1, cur + 1) : Math.max(0, cur - 1);
    st.selectedRows.clear();
    st.selectedRows.add(next);
    render();
    saveCache();
    const rowEl = document.querySelector('.ln[data-idx="' + next + '"]');
    if (rowEl) rowEl.scrollIntoView({ block: "nearest" });
  }
});

/* Ползунки шрифта, межстрочного и межсимвольного интервала */
const fs = document.getElementById("fs");
const lh = document.getElementById("lh");
const ls = document.getElementById("ls");

/* Высота строки .ln раньше считалась в CSS как calc(--chain-fs * --chain-lh) — при дробном
   произведении (напр. 19 * 0.65 = 12.35px) сама СЕТКА строк остаётся идеально ровной
   (getBoundingClientRect подтверждает), но у каждой строки РАЗНЫЙ дробный остаток накопленной
   Y-позиции (0, 12.35, 24.7, 37.05...) — при рендере текста браузер подгоняет глифы под
   пиксельную сетку (хинтинг), и округление дробного остатка "плавает" от строки к строке.
   Отсюда одинаковые пары символов (напр. "0" над "0") визуально то сливаются, то нет. Считаем
   произведение здесь в JS и ОКРУГЛЯЕМ до целого пикселя (--row-h) — тогда высота каждой строки
   буквально одно и то же целое число, без дробного остатка вообще. */
function updateRowHeight(){
  const px = Math.round((+fs.value) * (+lh.value));
  document.documentElement.style.setProperty("--row-h", px + "px");
}
/* Сразу при разборе скрипта — на случай самой первой загрузки без кэша вообще (там ветка
   loadCache() не зовёт applyFont()/applyLh(), полагаясь на CSS :root по умолчанию); без этого
   --row-h не проставился бы вообще, и .ln откатилась бы на хардкод-заглушку 12px в CSS. */
updateRowHeight();
function applyFont(){
  const v = +fs.value;
  document.documentElement.style.setProperty("--chain-fs", v + "px");
  document.getElementById("fsVal").textContent = v;
  updateRowHeight();
}
fs.oninput = () => { applyFont(); saveCache(); };

function applyLh(){
  const v = +lh.value;
  document.documentElement.style.setProperty("--chain-lh", v);
  document.getElementById("lhVal").textContent = v;
  updateRowHeight();
}
lh.oninput = () => { applyLh(); saveCache(); };

function applyLs(){
  const v = +ls.value;
  document.documentElement.style.setProperty("--chain-ls", v + "px");
  document.getElementById("lsVal").textContent = v;
}
ls.oninput = () => { applyLs(); saveCache(); };

/* "📐90°" — подбирает межсимвольный интервал (ls) так, чтобы ячейка символа стала КВАДРАТНОЙ
   (ширина = высоте строки --row-h) при текущих fs/lh — тогда любая "лестница" (1,11,111...)
   в таблице строк идёт ровно по 45°. Естественную ширину символа (БЕЗ letter-spacing) меряем
   через canvas.measureText() тем же шрифтом/размером, что и сама таблица (--chain-ff/--chain-fs)
   — жёстко хардкодить соотношение ширина/высота нельзя, оно своё у каждого из 6 шрифтов
   (см. #chainFontSel). letter-spacing браузер добавляет ПОСЛЕ каждого символа как есть, поэтому
   искомый ls = высота_строки − natural_width, округлённый до шага ползунка (0.5). */
function applySquareCellLs(){
  const fsPx = +fs.value;
  const lhVal = +lh.value;
  const rowH = Math.round(fsPx * lhVal); // та же формула, что и updateRowHeight()/--row-h
  const ff = getComputedStyle(document.documentElement).getPropertyValue("--chain-ff").trim() || '"Roboto Mono", Consolas, monospace';
  const measureCanvas = document.createElement("canvas");
  const ctx = measureCanvas.getContext("2d");
  ctx.font = fsPx + "px " + ff;
  const naturalW = ctx.measureText("0").width;
  let target = Math.round((rowH - naturalW) * 2) / 2; // шаг ползунка ls — 0.5
  const min = +ls.min, max = +ls.max;
  const clamped = Math.max(min, Math.min(max, target));
  ls.value = clamped;
  applyLs();
  saveCache();
  if (clamped !== target) {
    say(`📐 Квадратная ячейка требует ls=${target}, но ползунок ограничен [${min}; ${max}] — поставлено ближайшее ${clamped}, идеального 90° не будет.`);
  } else {
    say(`📐 Ячейка символа теперь квадратная (${rowH}×${rowH}px) — лестница идёт ровно по 45°.`);
  }
}
const rightTriangle90BtnEl = document.getElementById("rightTriangle90Btn");
if (rightTriangle90BtnEl) rightTriangle90BtnEl.onclick = applySquareCellLs;

/* #RRGGBB -> rgba(...) с заданной прозрачностью — цвет <input type="color"> всегда непрозрачный,
   а фон выделенной строки (--rowbg-sel) должен оставаться полупрозрачным, иначе перекроет
   текст строки под собой. */
function hexToRgba(hex, alpha){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
  if (!m) return hex;
  return "rgba(" + parseInt(m[1], 16) + "," + parseInt(m[2], 16) + "," + parseInt(m[3], 16) + "," + alpha + ")";
}

}

/* Снимок текущих цветов — для сохранения их ОТДЕЛЬНО у каждой цепочки (см. createDefaultTabState/

   только после того, как col1/currentPreset и т.д. уже объявлены (см. порядок вызова loadCache()). */

  };
}

   последние вручную подобранные (см. col1/col0/colBg.oninput ниже): любая ручная правка цвета
   ПРИ ЛЮБОМ активном пресете не трогает сам пресет, а переносит текущие цвета в "Своя" и
   переключает подсветку на неё. Пока своих цветов ещё не было (st.customPreset пуст) — клик
   по "Своя" запускает как отправную точку Ч/Б (см. PRESETS.bw). */
if (presetGrpEl) {
  presetGrpEl.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      const val = btn.getAttribute("data-val");
      if (val === "custom") {
        const c = st.customPreset || PRESETS.bw;
        col1.value = c.c1; col0.value = c.c0; colBg.value = c.bg || c.cBg;
        applyColors();
      } else if (PRESETS[val]) {
        const p = PRESETS[val];
        col1.value = p.c1;
        col0.value = p.c0;
        colBg.value = p.bg;
        applyColors();
      }
      setPresetActive(val);
      saveCache();
    };
  });
}

function markCustomColor(){
  applyColors();
  st.customPreset = { c1: col1.value, c0: col0.value, bg: colBg.value };
  setPresetActive("custom");
  saveCache();
}
col1.oninput = markCustomColor;
col0.oninput = markCustomColor;
colBg.oninput = markCustomColor;

/* Фон выделенных строк — цвет + прозрачность, без пресетов (см. #rowBgSel/#rowBgSelOpacity в HTML). */
rowBgSel.oninput = () => { applyColorsSel(); saveCache(); };
if (rowBgSelOpacityEl) rowBgSelOpacityEl.oninput = () => { applyColorsSel(); saveCache(); };

function makeDrag(el, varName, x0fn, min, max){
  el.addEventListener("mousedown", e => {
    e.preventDefault();
    const x0 = x0fn();
    el.classList.add("drag");
    document.body.classList.add("dragging");
    const move = ev => {
      const w = Math.max(min, Math.min(max, ev.clientX - x0));
      document.documentElement.style.setProperty(varName, w + "px");
    };
    const up = () => {
      el.classList.remove("drag");
      document.body.classList.remove("dragging");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      saveCache();
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
}

function makeDragRight(el, varName, min, max){
  el.addEventListener("mousedown", e => {
    e.preventDefault();
    const chainRect = document.getElementById("chain").getBoundingClientRect();
    const rightEdge = chainRect.right;
    
    el.classList.add("drag");
    document.body.classList.add("dragging");
    
    const move = ev => {
      let w = rightEdge - ev.clientX; // Чем левее мышь, тем шире колонка
      w = Math.max(min, Math.min(max, w));
      document.documentElement.style.setProperty(varName, w + "px");
    };
    
    const up = () => {
      el.classList.remove("drag");
      document.body.classList.remove("dragging");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      saveCache();
    };
    
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
}

makeDrag(document.getElementById("vsplit"), "--pat-w", () => {

  return p ? p.getBoundingClientRect().left : document.getElementById("chain").getBoundingClientRect().left;

/* Ручка переноса начала отсчёта столбцов — запрос пользователя "для каждого выравнивания нужна
   эта передвигающая начало линия столбца": раньше была видна и работала ТОЛЬКО под "⊙ Ось"/
   "Ось 1/2", теперь двигает st.axisCenterOffset ДЛЯ ЛЮБОГО выравнивания (см. alignShift()/
   resolveAxisBitShift-ветки, где offset теперь тоже прибавляется). Перетаскиваемая граница НАД
   линейкой столбцов (не во всю высоту, как #vsplit/#vsplit2, чтобы не наезжать на сами биты
   строк). В отличие от .vsplit/.vsplit2 (сдвигают CSS-переменную ширины панели), тут тянем
   st.axisCenterOffset — целое число СИМВОЛОВ (колонок), пересчитывается из пикселей через
   ширину одного символа линейки (.col-cell). */
function axisCharWidthPx(){
  const cell = document.querySelector("#colHeader .col-cell");
  if (cell) { const w = cell.getBoundingClientRect().width; if (w > 0) return w; }
  return 8; // разумный запасной вариант, если линейка ещё не отрисована
}
/* Настоящий шаг столбца внутри .bits, В ОТЛИЧИЕ от axisCharWidthPx() (та меряет .col-cell —
   display:flex, letter-spacing на flex-items не действует). Строки битов — обычный inline-текст
   (span'ы внутри одного span'а), там letter-spacing реально раздвигает символы.
   Меряем НАПРЯМУЮ по уже отрисованному DOM — расстояние между двумя реальными соседними битами
   (data-col N и N+1) в первой попавшейся строке, где такая пара есть. Раньше здесь стоял
   canvas.measureText("0")+letter-spacing (тот же приём, что applySquareCellLs()) — но выяснилось,
   что Canvas 2D измеряет текст НЕ идентично тому, как браузер реально раскладывает inline-текст
   со letter-spacing (используется наверное другой алгоритм субпиксельного округления) — на
   большом сдвиге (сотни колонок) эта мелкая на 1 символ погрешность накапливалась в заметный
   перекос столбцов (запрос пользователя — "строки уезжают" даже после перехода на px). Прямой
   замер по DOM такой ошибки не копит вообще — это и есть окончательный источник истины.
   Используется и в drag-обработчике #axisSplit (перевод px мыши в колонки), и в
   updateAxisSplitPosition() (запасной путь, если бит-элемента ещё нет), и в render() (transform
   довеска extraCh) — везде должен быть ОДИН И ТОТ ЖЕ шаг. */
function realColStepPx(){
  const rowsEl = document.getElementById("rows");
  if (rowsEl) {
    for (const row of rowsEl.children) {
      // ".b0,.b1" (а НЕ "[data-col]") — data-col проставляется ТОЛЬКО строкам внутри
      // colSelectRowRange() (см. colAttr в цикле рендера), т.е. у произвольной строки его может
      // не быть вообще; класс b0/b1 есть у КАЖДОГО реального бита всегда. Соседние такие span'ы
      // в одной строке — это соседние символы строки, т.е. соседние столбцы (шаг ровно 1), а
      // сама подсветка пустого места из blankRun() имеет класс col-sel-bit БЕЗ b0/b1 и сюда не
      // попадает.
      const bits = row.querySelectorAll ? row.querySelectorAll(".bits .b0, .bits .b1") : null;
      if (!bits || bits.length < 2) continue;
      // Меряем на ВСЮ длину строки (первый бит → последний), а не по одной соседней паре: одна
      // пара даёт расстояние в один символ, и субпиксельная погрешность этого замера потом
      // умножается на сотни колонок сдвига. Деление длинной базы на число промежутков
      // усредняет её и даёт шаг с точностью, которой хватает на любой сдвиг.
      const d = (bits[bits.length - 1].getBoundingClientRect().left - bits[0].getBoundingClientRect().left) / (bits.length - 1);
      if (d > 0) return d;
    }
  }
  // Запасной вариант — строки ещё не отрисованы (самый первый рендер) — canvas-оценка.
  const fsPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--chain-fs")) || 12;
  const ff = getComputedStyle(document.documentElement).getPropertyValue("--chain-ff").trim() || '"Roboto Mono", Consolas, monospace';
  const ls = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--chain-ls")) || 0;
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  ctx.font = fsPx + "px " + ff;
  const w = ctx.measureText("0").width + ls;
  return w > 0 ? w : 8;
}
/* Значение st.axisCenterOffset, при котором ручка #axisSplit встаёт РОВНО ПОСЕРЕДИНЕ видимой
   области битов (между колонками паттернов .pat/.pat2, т.е. между #vsplit и #vsplit2) — запрос
   пользователя: при КАЖДОМ переключении режима выравнивания линия сбрасывается именно туда, а не
   тащит за собой offset от прошлого режима (у разных выравниваний своя точка отсчёта, из-за чего
   чужой offset уводил строки далеко за экран). Середина видимой области = столбец maxLen/2 — та
   же величина, что и статическая ось у "⊙ Ось" (см. axisRowShift()).
   Для не-⊙ выравниваний линия привязана к ПЕРВОМУ БИТУ ПЕРВОЙ строки (см.
   updateAxisSplitPosition() ниже), поэтому нужный offset = (середина) − (собственный сдвиг этого
   выравнивания). alignShift()/resolveAxisBitShift() теперь offset НЕ включают вообще (он —
   отдельный общий визуальный сдвиг картинки, см. комментарий в alignShift()), так что их
   результат и есть искомый собственный сдвиг, без каких-либо поправок. */
function centerAxisOffset(){
  let maxLen = 0;
  for (const s of st.rows) if (s.length > maxLen) maxLen = s.length;
  if (!maxLen) return 0;
  // У "⊙ Ось"/"Ось 1/2" ось при offset=0 и так стоит ровно на maxLen/2 — центр это и есть 0.
  if (st.align === "axis" || st.align === "axis12") return 0;
  const fd = firstDataIdx();
  const len0 = fd >= 0 ? (st.rows[fd] || "").length : 0;
  const base = (st.align === "axisbit" || st.align === "axisbit12")
    ? resolveAxisBitShift(fd >= 0 ? fd : 0)
    : alignShift(maxLen, len0, st.align, fd >= 0 ? fd : 0);
  return Math.floor(maxLen / 2) - base;
}
/* Пересчитывает position:absolute left/height/видимость #axisSplit — вызывается в конце
   render(). Столбец, где стоит линия: у "⊙ Ось"/"Ось 1/2" — maxLen/2 + axisCenterOffset (та же
   формула, что и в axisRowShift()) — там offset двигает ОСЬ ПОСЕРЕДИНЕ. У ЛЮБОГО другого
   выравнивания линия должна стоять РОВНО на первом символе первой (реально существующей) строки
   (запрос пользователя — "привязана к первому символу первой строки", а раньше ошибочно считалось
   axisCol=offset, т.е. как у "По левому краю", где это совпадает случайно: shift="По левому краю"
   как раз ВСЕГДА равен offset — а у "center"/"stairs"/т.п. первая строка сама по себе уже сдвинута
   на свой собственный alignShift(), офсет только ДОБАВЛЯЕТСЯ к нему — без этой строки линия
   стояла в другом месте, чем реальный первый бит первой строки, у всех выравниваний, кроме
   "По левому краю"). alignShift()/resolveAxisBitShift() сами уже прибавляют offset внутри себя —
   тут просто читаем ИХ РЕЗУЛЬТАТ для первой строки, как это делает и сам render() (см. shift
   в цикле рендера строк выше). Переводим в пиксели через реальный левый край .bits (зависит от
   текущей ширины панелей паттернов — .vsplit/.vsplit2 не участвуют в формуле напрямую, поэтому
   меряем фактическую геометрию, а не считаем через CSS-переменные). document.getElementById()
   каждый раз заново (не кэшируем в const на верхнем уровне) — эта функция ВЫЗЫВАЕТСЯ из render(),
   а render() дёргается местами ещё ДО того, как скрипт дойдёт до этого места (см. остальные
   render() выше по файлу) — кэш в const поймал бы temporal dead zone. */
function updateAxisSplitPosition(maxLen){
  const axisSplitEl = document.getElementById("axisSplit");
  if (!axisSplitEl) return;
  if (!maxLen) { axisSplitEl.classList.remove("act"); return; }
  const chainEl = document.getElementById("chain");
  const bitsEl = document.querySelector("#colHeader .bits") || document.querySelector(".ln .bits");
  const colHeaderEl = document.getElementById("colHeader");
  if (!chainEl || !bitsEl) { axisSplitEl.classList.remove("act"); return; }
  const chainRect = chainEl.getBoundingClientRect();
  const bitsRect = bitsEl.getBoundingClientRect();
  const chPx = realColStepPx();
  const isAxisFamily = st.align === "axis" || st.align === "axis12";
  let leftPx;
  if (isAxisFamily) {
    const axisCol = Math.floor(maxLen / 2) + (st.axisCenterOffset || 0);
    leftPx = (bitsRect.left - chainRect.left) + axisCol * chPx;
  } else {
    // Меряем НАПРЯМУЮ из уже отрисованного DOM первой существующей строки (её .bits > span —
    // тот самый span с extraCh-трансформом, см. render() — внутри первый настоящий бит-span
    // ".b0"/".b1" стоит СРАЗУ на реальной позиции строки: паддинг перед ним — просто текстовые
    // "&nbsp;", не спаны). Раньше здесь пересчитывали то же самое формулой (alignShift() *
    // chPx) — совпадает с реальным рендером только при МАЛЫХ сдвигах: canvas.measureText()
    // (см. realColStepPx()) даёт чуть другую ширину символа, чем реальная раскладка текста
    // браузером, и на большом сдвиге (напр. "По центру" с короткой первой строкой — там
    // сдвиг может быть сотни колонок) эта мелкая на один символ погрешность накапливается в
    // заметный пиксельный промах (запрос пользователя — "не совпадает, только у центрального").
    // Прямой замер геометрии такой ошибки не копит вообще.
    // ".b0,.b1" (а не просто "span") — иначе первым найденным span'ом мог оказаться
    // <span class="col-sel-bit"> ИЗ ПАДДИНГА (см. blankRun() — режим "🔢 Выбор столбца" красит
    // ОДНУ пустую клетку ДО настоящего бита, если st.selectedCol туда попадает), и линия
    // промахивалась на весь отступ. "[data-col]" тут тоже не годится — он есть только у строк
    // внутри colSelectRowRange() (см. colAttr там же), а класс b0/b1 — у любого реального бита.
    const fd = firstDataIdx();
    const wrapEl = fd >= 0 ? document.querySelector('#rows .ln[data-idx="' + fd + '"] .bits > span') : null;
    const bitEl = wrapEl ? wrapEl.querySelector(".b0, .b1") : null;
    if (bitEl) {
      leftPx = bitEl.getBoundingClientRect().left - chainRect.left;
    } else {
      // Запасной вариант (строки ещё не отрисованы / нет цветных спанов) — старая формула.
      // offset прибавляется здесь ЯВНО: alignShift()/resolveAxisBitShift() его больше не
      // содержат (он — общий визуальный сдвиг картинки, см. комментарий в alignShift()).
      const len0 = fd >= 0 ? (st.rows[fd] || "").length : 0;
      const axisCol = ((st.align === "axisbit" || st.align === "axisbit12")
        ? resolveAxisBitShift(fd >= 0 ? fd : 0)
        : alignShift(maxLen, len0, st.align, fd >= 0 ? fd : 0)) + (st.axisCenterOffset || 0);
      leftPx = (bitsRect.left - chainRect.left) + axisCol * chPx;
    }
  }
  axisSplitEl.style.left = leftPx + "px";
  const headBottom = colHeaderEl ? (colHeaderEl.getBoundingClientRect().bottom - chainRect.top) : 24;
  axisSplitEl.style.height = Math.max(16, headBottom) + "px";
  axisSplitEl.classList.add("act");
}

    e.preventDefault();

}
