<!-- === МАРКЕР 00: СТАРТ === -->
<!DOCTYPE html>
<html lang="ru">
<head>
<!-- === МАРКЕР 01: HEAD === -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>Zerkalius Fold — v0.449</title>
<!-- === МАРКЕР 02: STYLE === -->
<style>
  :root{
    --bg:#12141a; --panel:#1a1d26; --line:#2b3040; --fg:#d8dce6; --dim:#7d8598;
    --acc:#4da3ff; --red:#ff4444; --purple:#b060ff; --green:#38c172; --gray:#6b7280;
    /* Приглушённая палитра для рамок групп настроек (запрос пользователя: "ненавязчивые не
       яркие но разных цветов") — те же семейства цветов, что были (синий/оранжевый/красный/
       зелёный/фиолетовый/жёлтый/голубой), просто заметно темнее/бледнее ярких --acc/--red/
       --purple/--green и т.п., которые используются ГЛОБАЛЬНО (кнопки/фокус/подсветка) и их
       менять нельзя — эти muted-переменные ТОЛЬКО для фоновых рамок групп. */
    --m-blue:#3d5a78; --m-blue2:#3d6e78; --m-blue3:#3d4878; --m-teal:#3d7870; --m-slate:#4a5568;
    --m-indigo:#4d4d8a; --m-orange:#a3703d; --m-orange2:#8a6b3d; --m-red:#8a4d4d; --m-green:#3d7a52;
    --m-green2:#4d8a5c; --m-purple:#6b4d8a; --m-purple2:#8a5da8; --m-gold:#8a7a3d; --m-cyan:#3d7a85;
    --side-w:300px;   /* ширина левой панели — тянется мышью за разделитель */
    --chain-fs:19px;  /* размер шрифта полотна */
    --chain-lh:0.65;  /* межстрочный интервал — намеренный плотный наезд (см. диагностику
                          в консоли: сетка строк идеально ровная что при 0.65, что при 1,
                          слияние "0" — это форма символа при сжатии, а не баг раскладки) */
    --chain-ls:0px;   /* межсимвольный интервал (-1px давал наезд по горизонтали — соседние
                          "0" в одной строке визуально слипались; вернули к 0) */
    --chain-ff:"Roboto Mono", Consolas, monospace; /* шрифт цифр полотна — выбирается через
                          #chainFontSel (см. "Вид"): на разных системах одно и то же начертание
                          выглядит то жирным, то тонким (Roboto Mono тут не сама причина — у
                          пользователя стало не жирнее и после ухода на Consolas, дело в самом
                          рендере системного шрифта), поэтому вместо жёсткого выбора — набор
                          готовых вариантов на пробу. */
    --pat-w:12em;     /* ширина левой колонки паттернов */
    --pat-w2:12em;    /* ширина правой колонки паттернов */
    --c1:#ff3333;     /* цвет единиц (по умолчанию — пресет "Спектр") */
    --c0:#555555;     /* цвет нулей */
    --cbg:#000000;    /* фон полотна */
    /* Фон ВЫДЕЛЕННЫХ строк — отдельно от --cbg, применяется только внутри .ln.selected. */
    --rowbg-sel:rgba(255,207,107,.15);
    --c01-hl:#ff9900; /* цвет подсветки "01" (см. #bHighlight01/#col01) — СПЛОШНОЙ, без прозрачности:
                          и "0", и "1" в найденном пробеге красятся ровно в этот один цвет */
    --cv1-hl:#00ccff; /* цвет подсветки "1 под 1" (см. #bHighlightVert1/#colVert1) — тоже сплошной */
    --cd1-hl:#66ff66; /* цвет подсветки "1 по диагонали" (см. #bHighlightDiag1/#colDiag1) — тоже сплошной */
    --cdf-hl:#ff5ecb; /* цвет подсветки "диагонали склейки" (см. #bHighlightDiagFold/#colDiagFold) —
                          показывает САМИ ЛИНИИ, по которым режимы "⧅ Диаг. ↘/↙" собирают результат
                          (и нули тоже, не только единицы — это линия, а не находка) */
    --dim-op: 1;      /* прозрачность будущих строк (100 — ползунок яркости по умолчанию) */
    --std-btn-h: 24px; /* стандартная высота кнопок в сетках (ops-btn-grid/control-group-player/
                           preset-grp/search-grid и т.п.) — было 34px, уменьшено на ~30% */
  }
  /* === МАРКЕР 02.1: CSS_BASE === */
  *{box-sizing:border-box}
  
  /* Фиксируем высоту страницы на 100vh и убираем двойной внешний скроллбар */
  html, body { height: 100vh; overflow: hidden; }
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,Segoe UI,sans-serif; display:flex; flex-direction:column}

  /* === Верхняя полоса вкладок (перенесена из Zerkalius-gpu.html, цвета — под тему fold) === */
  #menuBar{flex:0 0 auto;height:42px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
           background:var(--panel);border-bottom:1px solid var(--line);padding:0 6px;position:relative;
           z-index:200;user-select:none;font-size:12px}
  /* overflow-x:auto тут был страховкой от переполнения по ширине — но по спеке CSS если
     overflow-x задан НЕ visible, а overflow-y не задан явно, то и overflow-y тоже перестаёт
     быть visible (принудительно становится auto) — то есть #menuTabs НЕВИДИМО обрезала и по
     высоте тоже, а ВСЁ, что должно выпадать/торчать ниже нее (.chain-dd-list, .menu-drop,
     старая полоска toggleAllPinsBtn) — просто не рисовалось. Функциональность выпадающих
     списков важнее подстраховки от горизонтального переполнения — убрано. */
  #menuTabs{display:flex;align-items:center;gap:4px;position:relative;min-width:0}
  /* Переключатели верхнего меню (◧П1/П2◨/🔗Р//🧾Ч/) — все ОДНОЙ ширины, а не "гуляющей" по длине
     текста. Раньше класс висел только на Р//Ч, а П1/П2 имели инлайновый стиль и ширину по
     содержимому — кнопки выходили разными (запрос пользователя "одинаковую ширину").
     justify-content нужен потому, что глобальное правило button{} задаёт display:flex, а на
     flex-контейнер text-align не действует — без него подпись липнет влево. */
  .overlay-toggle-btn{font-size:12px;padding:3px 8px;min-width:64px;
    text-align:center;justify-content:center}
  /* Включённое состояние у переключателей верхнего меню (◧П1/П2◨/🔗Р//🧾Ч/) — ПРИГЛУШЁННОЕ, не
     как у кнопок-режимов: .mode-act даёт белую рамку с двойным свечением, и четыре таких кнопки
     подряд слепили (запрос пользователя "убавь яркость включённых"). Тут — только мягкая
     акцентная рамка и лёгкая заливка, состояние читается, но в глаза не бьёт. */
  .overlay-on{border-color:var(--acc) !important;color:var(--acc) !important;
    background:rgba(77,163,255,.10) !important;box-shadow:none !important;font-weight:normal !important}
  .menu-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);color:var(--dim);
            font-family:inherit;font-size:12px;padding:3px 10px;cursor:pointer;border-radius:3px}
  .menu-btn:hover{background:var(--bg);color:var(--fg);border-color:var(--acc)}
  .menu-btn.open,.menu-btn.pinned{background:var(--bg);color:var(--acc);border-color:var(--acc)}
  .menu-btn.open:hover,.menu-btn.pinned:hover{filter:brightness(1.3)}
  .menu-pin-inline{display:none}
  /* Была невидимой тонкой полоской под вкладками (position:absolute, bottom:-Npx, видна только
     при наведении) — #menuTabs имеет overflow-x:auto, а по спеке CSS если ЛЮБАЯ из осей
     overflow не visible, ДРУГАЯ тоже принудительно становится auto (не может остаться
     visible) — то есть #menuTabs на самом деле обрезает и по Y тоже, и всё, что торчало
     за пределы её бокса (в т.ч. эта полоска на bottom:-Npx), просто не рисовалось. Поэтому
     теперь обычная маленькая кнопка-иконка В ПОТОКЕ (как остальные .menu-btn), а не
     обрезаемый абсолютный довесок. */
  #toggleAllPinsBtn{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--dim);
                     border-radius:3px;padding:3px 8px;cursor:pointer;font-size:12px}
  #toggleAllPinsBtn:hover{border-color:var(--acc);color:var(--fg)}
  #toggleAllPinsBtn.all-on{border-color:var(--acc);color:var(--acc);background:rgba(77,163,255,.15)}

  /* Общая рамка вокруг 📌 + вкладок (Шаги/Правка строк/Поиск/Вид) — раньше у каждой кнопки
     была своя рамка (двойные линии между соседними), теперь один общий бордюр на группу.
     У 📌 (первый сегмент) СВОЯ рамка снята — border:none у обеих, вместо неё общий
     border-right-разделитель между сегментами. При наведении на 📌 подсвечивается ВСЯ
     группа целиком (не только сама кнопка) — через CSS-комбинатор "общий сосед" (~), т.к.
     .menu-btn идут в DOM следом за #toggleAllPinsBtn внутри той же #menuTabsGroup. */
  #menuTabsGroup{display:flex;align-items:center;border:1px solid #22d3ee;border-radius:3px;overflow:hidden}
  #menuTabsGroup #toggleAllPinsBtn,#menuTabsGroup .menu-btn{border:none;border-right:1px solid var(--line);border-radius:0}
  #menuTabsGroup #toggleAllPinsBtn:hover ~ .menu-btn{background:var(--bg);color:var(--fg);border-right-color:var(--acc)}
  /* .menu-btn:hover/.open/.pinned красили ВСЮ рамку кнопки в акцентный — теперь у кнопки
     рамки нет (border:none выше), остался только правый разделитель, ему и возвращаем
     акцентный цвет в тех же состояниях, чтобы подсветка/активность вкладки не потерялись. */
  #menuTabsGroup .menu-btn:hover,#menuTabsGroup .menu-btn.open,#menuTabsGroup .menu-btn.pinned{border-right-color:var(--acc)}
  /* То же самое для 📌 — глобальные #toggleAllPinsBtn:hover/.all-on красили border-color, но
     проигрывают по специфичности правилу border:none выше (2 ID против 1 ID+psevdo/класс). */
  #menuTabsGroup #toggleAllPinsBtn:hover,#menuTabsGroup #toggleAllPinsBtn.all-on{border-right-color:var(--acc)}
  .menu-drop{display:none;position:absolute;top:42px;left:2px;width:320px;max-height:82vh;overflow-y:auto;
             background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 4px 4px;
             padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.6);flex-direction:column;gap:6px;z-index:300;
             scrollbar-width:none} /* Скролл рабочий, полосу не рисуем — см. .controls выше */
  .menu-drop::-webkit-scrollbar{width:0;height:0;background:transparent}
  .menu-drop.open{display:flex}

  /* Свой выпадающий список вкладок-цепочек (замена <select>) — у каждой строки своя кнопка "✕" */
  .chain-dd{position:relative;display:inline-block}
  .chain-dd-toggle{font-size:12px;padding:2px 8px;background:#232735;color:var(--fg);
    border:1px solid var(--line);border-radius:3px;cursor:pointer;display:flex;align-items:center;
    gap:4px;width:140px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chain-dd-toggle:hover{border-color:var(--acc)}
  .chain-dd-arrow{color:var(--dim);font-size:10px}
  .chain-dd-list{display:none;position:absolute;top:100%;left:0;margin-top:2px;min-width:170px;
    max-height:60vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:300;scrollbar-width:none}
  .chain-dd-list::-webkit-scrollbar{width:0;height:0;background:transparent}
  .chain-dd-list.open{display:block}
  .chain-dd-item{display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:5px 8px;cursor:pointer;font-size:12px;color:var(--fg)}
  .chain-dd-item:hover{background:rgba(255,255,255,.06)}
  .chain-dd-item.act{background:rgba(77,163,255,.18);color:var(--acc);font-weight:600}
  .chain-dd-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .chain-dd-name-input{flex:1;min-width:0;font-size:12px;font:inherit;color:var(--fg);
    background:#0d1322;border:1px solid var(--acc);border-radius:3px;padding:1px 4px;outline:none}
  .chain-dd-close{flex:0 0 auto;background:none;border:none;color:var(--dim);cursor:pointer;
    padding:0 3px;font-size:12px;line-height:1}
  .chain-dd-close:hover{color:var(--red)}
  .chain-dd-close:disabled{opacity:.3;cursor:default}
  /* Мини-кнопки 💾/🧹/↺ в строке вкладки — дублируют глобальные, но для ЛЮБОЙ вкладки в
     списке, без переключения на неё */
  .chain-dd-mini{flex:0 0 auto;background:none;border:none;color:var(--dim);cursor:pointer;
    padding:0 2px;font-size:11px;line-height:1;opacity:.7}
  .chain-dd-mini:hover{color:var(--acc);opacity:1}
  /* Подвал выпадающего списка вкладок — экспорт/импорт ВСЕХ цепочек. position:sticky, чтобы при
     длинном списке (он скроллится, max-height:60vh) кнопки оставались на виду внизу, а не
     уезжали под список. Отделён линией сверху — это действие не про конкретную вкладку. */
  .chain-dd-footer{position:sticky;bottom:0;display:flex;gap:4px;padding:4px 6px;
    border-top:1px solid var(--line);background:var(--panel)}
  .chain-dd-file{flex:1;font-size:11px;padding:3px 6px;background:#232735;color:var(--fg);
    border:1px solid var(--line);border-radius:3px;cursor:pointer;justify-content:center}
  .chain-dd-file:hover{border-color:var(--acc);color:var(--acc)}
  /* Очистка кэша — действие необратимое, поэтому отделена цветом от соседних "Файл". */
  .chain-dd-wipe{color:var(--red)}
  .chain-dd-wipe:hover{border-color:var(--red);color:var(--red);background:rgba(255,77,77,.12)}
  .menu-panel{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:4px;
              background:var(--panel);padding:0 4px 4px}
  /* position:sticky — у длинного содержимого (напр. "Лог находок" + "Суммы длин") панель
     скроллится ЦЕЛИКОМ вместе с заголовком (см. .floating-panel/.controls/.menu-drop —
     overflow-y:auto стоит на НИХ, а не отдельно на теле панели) — шапка с заголовком/крестиком
     уезжала вместе с контентом. Sticky держит её прибитой к верху ИМЕННО того контейнера,
     который реально скроллится, не трогая сам контент — запрос пользователя "скролл норм
     сделай, и чтобы заголовок не трогал". background — иначе проскроленный текст просвечивал
     бы под ней. */
  .panel-head{display:flex;align-items:center;gap:8px;padding:6px 2px 4px;border-bottom:1px solid var(--line);
              margin-bottom:2px;cursor:grab;touch-action:none;
              position:sticky;top:0;left:0;z-index:2;background:var(--panel)}
  .panel-head:active{cursor:grabbing}
  .panel-drag{color:var(--dim);font-size:12px;letter-spacing:2px;user-select:none}
  .panel-head:hover .panel-drag{color:var(--acc)}
  .panel-title{font-weight:bold;font-size:12px;color:var(--fg);flex:1}
  .panel-close{color:var(--dim);font-size:13px;line-height:1;cursor:pointer;padding:2px 3px}
  .panel-close:hover{color:var(--red)}
  .dragging{opacity:.45;outline:1px dashed var(--acc)}
  /* max-height/overflow-y — иначе у вкладки, вытащенной плавающим окном на холст (в отличие от
     закреплённого дока .controls/выпадающего .menu-drop — у обоих есть свой overflow-y:auto),
     длинное содержимое (напр. "Лог находок" + "Суммы длин") просто обрезалось краем экрана без
     возможности прокрутки — запрос пользователя "скрола не хватает". */
  .floating-panel{position:fixed;z-index:120;width:290px;
                  box-shadow:0 8px 24px rgba(0,0,0,.6);
                  opacity:1 !important;outline:none !important;user-select:none;
                  max-height:80vh;overflow-y:auto;scrollbar-width:thin}
  /* resize:both — запрос пользователя "сделай расширяемой за угол", но ТОЛЬКО у "Лога находок"
     (не у всех плавающих панелей — id панели-обёртки см. в JS, 'panelWrap_' + mid из MENUS,
     здесь mid === 'menuFindLog'), у него таблица режимов фон-поиска шире стандартных 290px,
     обрезалась многоточием. overflow:auto (не только -y) нужен именно тут, чтобы resize вообще
     работал (спека CSS требует overflow != visible на обеих осях) — .panel-head внутри
     специально position:sticky С top И left (см. её правило выше), поэтому при горизонтальном
     скролле сам заголовок никуда не уезжает. */
  #panelWrap_menuFindLog.floating-panel{min-width:220px;min-height:120px;resize:both;overflow:auto}
  /* Тонкий скролл вместо толстого системного — тот же приём, что у .step-log-body — запрос
     пользователя "лог находок замени скрол на невидимый или какой получше и тоньше". */
  .floating-panel::-webkit-scrollbar{width:6px}
  .floating-panel::-webkit-scrollbar-thumb{background:#2b3040;border-radius:3px}
  .floating-panel::-webkit-scrollbar-track{background:transparent}
  .control-group{display:flex;flex-direction:column;gap:4px}
  .control-group-btn{display:flex;flex-wrap:wrap;gap:4px}

  /* Вкладка "Шаги" (opsGroup) — 2 колонки РОВНО (та же причина, что у .control-group-player:
     flex-wrap пакует то 2, то 3 в ряд в зависимости от длины текста и выглядит рвано), кнопки
     короче — текст не переносится, режется по ширине. */
  .ops-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .ops-btn-grid button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:var(--std-btn-h)}

  /* Авто/Стоп + все кнопки-режимы (см. setMode() — то, что реально повторяет "Авто") — одна
     общая рамка (см. HTML #flowGroup): сверху Авто/Стоп строкой, ниже сетка режимов 2 колонки. */
  .control-group-flow{display:flex;flex-direction:column;gap:4px;border:1px solid var(--m-blue);
    background:rgba(61,90,120,.14);border-radius:3px;padding:4px;margin-bottom:4px}
  /* Авто/Стоп отделены от сетки режимов ниже пунктиром + своим отступом — иначе в общей рамке
     не видно, что это разные по смыслу группы (сама рамка теперь общая на обе). Кнопка Авто —
     ТОГО ЖЕ размера, что и остальные (не растянута на всю ширину flex:1), просто ПО ЦЕНТРУ своей
     строки (justify-content:center) — запрос пользователя "кнопку такого же размера как и все,
     но расположи по центру на своей строке". */
  .control-group-flow .flow-top-row{display:flex;gap:4px;padding-bottom:4px;justify-content:center;
    border-bottom:1px dashed rgba(77,163,255,.35)}
  .control-group-flow .flow-modes-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .control-group-flow button{min-height:var(--std-btn-h)}

  /* «Плеер» правки строк — крупные кнопки транспортного вида (вкладка «Правка строк»).
     Сетка 2 колонки РОВНО (не flex-wrap с процентами — тот пакует то 2, то 3 в ряд
     в зависимости от содержимого и выглядит рвано). */
  .control-group-player{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  /* padding был 8px 6px — вместе со шрифтом 15px это давало ~34px, min-height:24px не мог
     перебить (контент и так выше). Уменьшил паддинг, чтобы кнопки реально сели на стандартные
     24px, как и остальные группы кнопок (ops-btn-grid/preset-grp/search-grid). */
  .control-group-player button{font-size:15px;padding:2px 6px;min-height:var(--std-btn-h)}
  .control-group-player .align-grp{grid-column:1 / -1;display:flex}
  .control-group-player .align-grp button{flex:1;font-size:16px;padding:7px 4px;min-height:auto}

  button{background:#232735;color:var(--fg);border:1px solid var(--line);border-radius:3px;
         padding:1px 5px;cursor:pointer;font:inherit;display:flex;align-items:center;gap:3px;white-space:nowrap}
  button:hover{border-color:var(--acc)}
  button:disabled{opacity:.4;cursor:default}
  button.stop{border-color:var(--red);color:#ffb0b0}
  
  /* Выделение активного режима выполнения рамкой и свечением */
  button.mode-act {
    border-color: #ffffff !important;
    box-shadow: 0 0 6px #ffffff, inset 0 0 4px rgba(255,255,255,0.3);
    font-weight: bold;
  }

  #bUndo {
    border-color: var(--acc);
  }
  
  /* Группа кнопок выравнивания */
  .align-grp{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  /* 5 кнопок режимов фон-поиска шире одной строки узкой панели — переносим */
  #bgSearchModeGrp{flex-wrap:wrap}
  .align-grp button{border:none;border-radius:0;border-right:1px solid var(--line);padding:1px 5px}
  .align-grp button:last-child{border-right:none}
  /* #alignGrp (⇤↔⇥…) — плавающая полоса ПОВЕРХ баров «Результат»/«Черновик», сразу под верхним
     меню (запрос пользователя). В DOM он переносится в .main-layout скриптом (см. МАРКЕР 10.2b —
     иначе position:absolute считался бы от .chain, где он лежал раньше, и полоса ехала бы вместе
     с холстом при скролле). z-index выше .overlay-box (95), чтобы быть НАД панелями, а не под
     ними. top:6px — та же стартовая высота, с которой layoutOverlayBoxes() кладёт первый бар
     стопки. Кнопки крупнее прежних 3px/10px — запрос "увеличь высоту иконок" (~24px). */
  #alignGrp{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:100;
    background:rgba(14,16,21,0.97);box-shadow:0 4px 14px rgba(0,0,0,.45)}
  #alignGrp button{padding:5px 12px;font-size:13px;line-height:1.1}
  /* ◄/► переключатель "какая сторона — вверх" для Спирали (spiralDirGrp) — сидит В ОДНОЙ рамке
     с ▲/▼ Спираль во вкладке "Шаги" (flow-modes-grid, см. запрос пользователя — переключатель
     влияет только на Спираль, значит должен быть рядом с ней). ID-селектор нужен независимо от
     того, в какой .control-group он окажется — унаследованный .align-grp button местами даёт
     padding:7px 4px и font-size:16px, этого одного min-height мало (контент и так выше 24px,
     min-height не перебивает), нужно переопределить и padding/font-size тоже, не только высоту. */
  #spiralDirGrp button{min-height:var(--std-btn-h);padding:1px 5px;font-size:12px}
  .align-grp button.act{background:rgba(77,163,255,0.2);color:var(--acc)}
  /* Фон-поиск выключен целиком (клик по заголовку, см. toggleBgSearch): выбранные режимы
     остаются отмеченными — набор ведь сохраняется, — но красятся СЕРЫМ вместо акцентного синего,
     чтобы сразу было видно, что сейчас они ни на что не влияют (запрос пользователя). */
  #bgSearchModeGrp.bg-off button.act{background:rgba(255,255,255,0.07);color:var(--dim)}
  /* Режим есть, но на ТЕКУЩЕМ выравнивании не считается (пока это только "Диагонали" вне
     "Центр ½", см. diagAlignOk()) — кнопку гасим, но галку .act НЕ снимаем: вернулись на
     "Центр ½" — режим снова работает без лишних кликов. */
  #bgSearchModeGrp button.mode-na{opacity:0.4;text-decoration:line-through;}

  label.chk{display:inline-flex;align-items:center;gap:2px;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap;
             border:1px solid transparent;border-radius:3px;padding:1px 5px;transition:border-color .15s,box-shadow .15s,color .15s}
  /* Галки-переключатели (не цвет/диапазон) — сама галка спрятана, выделение состояния идёт
     подсветкой всей плашки белым свечением (тот же приём, что button.mode-act). */
  label.chk:has(input[type="checkbox"]){border-color:var(--line)}
  label.chk:has(input[type="checkbox"]):hover{border-color:var(--acc)}
  label.chk input[type="checkbox"]{position:absolute;width:0;height:0;margin:0;opacity:0;pointer-events:none}
  label.chk:has(input[type="checkbox"]:checked){
    border-color:#ffffff;
    box-shadow:0 0 6px #ffffff, inset 0 0 4px rgba(255,255,255,0.3);
    color:var(--fg);
    font-weight:bold;
  }
  /* "🔍 Фон-поиск" — больше не галка, просто заголовок, подсвечивается сам (та же светящаяся
     рамка, что у чекбоксов выше), когда включён хотя бы один режим фон-поиска — см.
     bgSearchActive()/render() в JS. */
  /* Выглядит как обычная кнопка (рамка + фон + ховер, как у <button>), а не как подпись: это
     переключатель "фон-поиск вкл/выкл" по клику, и в выключенном состоянии, без свечения, он
     читался просто как текст — было непонятно, что по нему вообще можно нажать (запрос
     пользователя). Рамка была border:1px solid transparent — то есть невидимая. */
  #bgSearchTitle{display:inline-block;color:var(--dim);background:#232735;
    border:1px solid var(--line);border-radius:3px;padding:2px 8px;user-select:none}
  #bgSearchTitle:hover{border-color:var(--acc);color:var(--fg)}
  #bgSearchTitle.bg-search-active{border-color:#ffffff;box-shadow:0 0 6px #ffffff, inset 0 0 4px rgba(255,255,255,0.3);color:var(--fg);font-weight:bold;}
  /* Заголовок + цветной квадратик — тоже в виде кнопки (рамка+фон, как у обычных <button>),
     а не голый текст с плавающим квадратиком без границ (см. "Цвет 1"/"Цвет 0"/"Фон" и т.п.). */
  label.chk:has(input[type="color"]){border-color:var(--line);background:#232735}
  label.chk:has(input[type="color"]):hover{border-color:var(--acc)}
  /* Пара "кнопка-тумблер + её цвет" (01/1↕1/1⤡1) — визуально ОДНА кнопка с перегородкой
     внутри, а не два отдельных бордюра рядом (тот же приём, что у .align-grp). */
  .hl-combo{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .hl-combo:hover{border-color:var(--acc)}
  .hl-combo button{border:none;border-radius:0;border-right:1px solid var(--line)}
  .hl-combo input[type="color"]{border:none;border-radius:0;width:18px}
  select{background:#232735;color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:1px;font-size:11px}

  /* Вкладка "Вид": ползунок межстрочного интервала (lh) — вертикальный, стоит СБОКУ от
     остальных (столбик rowCount/fs/ls/dim), а не в общем стеке строк. align-items:stretch (не
     flex-start) + align-self:stretch у .chk-vertical — вертикальный ползунок растягивается на
     всю высоту столбца рядом (вровень с первой и последней горизонтальной строкой), а не
     торчит коротким огрызком где-то посередине. */
  .view-sliders-row{display:flex;align-items:stretch;gap:10px}
  .view-sliders-col{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
  /* padding уменьшен (было 6px 4px) — освобождает вертикальному треку больше высоты внутри
     (само)стретченного label'а. */
  label.chk.chk-vertical{flex-direction:column;gap:4px;padding:2px 4px;align-self:stretch}
  /* Значение под вертикальным ползунком — по центру своей узкой колонки (не по правому краю,
     как у горизонтальных: там общий столбец с соседними значениями, тут его нет), фикс.
     ширина сохраняется, поэтому при смене числа (0.5 → 1 → 1.35...) сама позиция не "прыгает". */
  .chk-vertical .view-slider-val{text-align:center}
  /* flex:1 1 auto одного не хватало — <input type=range> с writing-mode:vertical-lr считает
     flex-basis:auto по своему intrinsic-размеру (нативный контрол), не по доступному месту,
     из-за чего внизу оставалась пустая область. flex-basis:0 (третье число) убирает intrinsic
     размер из уравнения совсем — трек стартует с 0 и flex-grow:1 честно раздувает его на всё
     оставшееся место рядом с иконкой/значением. */
  .range-vertical{writing-mode:vertical-lr;width:16px;min-height:0;flex:1 1 0;accent-color:#ff9900}
  /* Иконка слева от каждого ползунка — фиксированная ширина, чтобы все ползунки в столбце
     начинались строго в одном месте (иначе 🔢/A/↔/💡 разной ширины сдвигали каждый трек). */
  .view-slider-icon{display:inline-block;width:18px;text-align:center;flex:0 0 auto}
  /* Значение справа от ползунка — тоже фиксированная ширина (одна на все), чтобы цифры
     стояли по правому краю в один столбец независимо от того, сколько в них знаков. */
  .view-slider-val{display:inline-block;width:26px;text-align:right;flex:0 0 auto}
  /* Сами горизонтальные ползунки — растягиваются на всю доступную ширину строки вместо
     фиксированных 120px (оставлявших много пустого места в широкой панели). */
  .view-slider-range{flex:1 1 auto;min-width:60px;accent-color:var(--acc)}
  /* Оранжевый — только у ползунков МЕЖСИМВОЛЬНОГО/межстрочного интервала (#ls/#lh), они сливались
     с синей рамкой блока #view-sliders-row сильнее остальных (стоят рядом с бордюром вплотную).
     Остальные (rowCount/fs/dim) — обычный синий accent-color, как было изначально. */
  #ls{accent-color:#ff9900}

  /* Пресеты цветов — сетка кнопок в 2 ряда вместо <select>. Активный пресет — button.mode-act
     (белое свечение, тот же приём, что и у активного режима выполнения). */
  .preset-grp{display:grid;grid-template-columns:repeat(4, 1fr);gap:4px}
  .preset-grp button{font-size:11px;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:var(--std-btn-h)}

  /* Вкладка "Поиск" — галки в 2 колонки, той же стандартной высоты (34px), что и остальные
     группы кнопок в приложении (см. .ops-btn-grid/.control-group-player/.preset-grp) */
  .search-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .search-grid > label.chk{min-height:var(--std-btn-h);box-sizing:border-box}

  /* Рамка "как сверять паттерн": ⇌ Инв/Рев + ⏭ Без 1-го, под ними 🔁 Инв. кольцо (+ реверс).
     white-space:normal и min-width:0 у галок внутри — ЗАЩИТА от того же бага, на котором
     споткнулась подпись "⏩ Турбо": минимум колонки у 1fr равен min-content, а .chk по умолчанию
     nowrap, поэтому длинная подпись ("🔁 Инв. кольцо реверс") раздула бы свою колонку и перекосила
     всю сетку. Тут она просто переносится на вторую строку. */
  .search-match-box{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:4px;
    border:1px solid var(--m-indigo);background:rgba(77,77,138,0.12);border-radius:3px;padding:4px}
  .search-match-box > label.chk{min-width:0;white-space:normal;min-height:var(--std-btn-h);
    box-sizing:border-box}

  /* Компактные палитры цветов */
  input[type="color"]{width:14px;height:14px;padding:0;border:1px solid var(--line);border-radius:2px;cursor:pointer;background:transparent}
  
  .sep{flex:0 0 1px;height:14px;background:var(--line);margin:0 2px}
  .counter{margin-left:auto;color:var(--dim);white-space:nowrap}
  .counter b{color:var(--acc);font-size:13px}

  .main-layout{position:relative;flex:1 1 0;min-height:0;height:100%}

  /* Плавающие доки поверх холста (аналог #leftPanel/#rightPanel из Zerkalius-gpu.html) */
  /* top было 6px (тот же отступ, что у .canvas со всех сторон) — убрали верхний отступ у
     панелей конкретно (не у канваса), они теперь сразу под верхним меню; max-height поэтому
     тоже пересчитан (был запас на 6px сверху + 6px снизу, теперь только снизу). */
  /* padding было 6px по кругу — раз панели теперь и так вплотную к краям (left/right/top:0),
     этот внутренний отступ давал тот же эффект зазора изнутри. Убрано. */
  /* top:0 убирали, потом вернули маленький зазор между верхним меню и вкладкой — левый/правый
     край и внутренний padding остались вплотную (0), только top снова с небольшим отступом. */
  .controls{position:absolute;top:6px;width:var(--side-w);max-height:calc(100% - 6px);overflow-y:auto;
            display:flex;flex-direction:column;background:transparent;padding:0;box-sizing:border-box;
            z-index:90;box-shadow:0 0 16px rgba(0,0,0,.5);user-select:none;
            scrollbar-width:none} /* Скролл остаётся рабочим (колесо/тач), просто не рисуем полосу */
  .controls::-webkit-scrollbar{width:0;height:0;background:transparent}
  .controls.dock-empty{background:transparent;box-shadow:none}
  /* Пока док пустой, у него нет содержимого, растягивающего высоту — сама подсветка при
     перетаскивании (drop-zone-hint/drag-target) была короткой полоской по высоте пустого дока
     вместо всей доступной зоны сброса. Форсируем полную высоту (та же формула, что и
     max-height у .controls) именно в этих двух состояниях. */
  .controls.drop-zone-hint{outline:2px dashed rgba(77,163,255,.45);outline-offset:-2px;height:calc(100% - 12px)}
  .controls.drag-target{outline:2px dashed var(--acc);outline-offset:-2px;background:rgba(77,163,255,.1);
                         box-shadow:0 0 20px rgba(77,163,255,.35);height:calc(100% - 12px)}
  /* Было left/right:6px (тот же боковой отступ, что у .canvas) — убрали и его, как раньше
     верхний (top:0 у .controls), панели теперь вплотную к краям экрана слева/справа тоже. */
  #leftPanel{left:0}
  #rightPanel{right:0}
  .scrollable-settings{display:flex;flex-direction:column;gap:6px}
  body.hide-side .controls{display:none}
  /* Скрыть колонку паттернов по отдельности (левую/правую) — прячет саму колонку (во всех
     трёх местах, где используется .pat/.pat2: шапка, линейка столбцов, строки) и её ручку
     изменения ширины; .bits естественно займёт освободившееся место (flex:1). */
  body.hide-pat-l .pat, body.hide-pat-l .vsplit{display:none}
  body.hide-pat-r .pat2, body.hide-pat-r .vsplit2{display:none}
  body.dragging{user-select:none;cursor:col-resize}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px}
  .box h3{margin:0 0 5px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  textarea{width:100%;height:150px;background:#0e1015;color:var(--fg);border:1px solid var(--line);
           border-radius:4px;padding:5px;font:12px/1.35 "Roboto Mono",Consolas,monospace;resize:vertical}

  /* Полотно цепочки — единственный чистый вертикальный скроллбар */
  .canvas{position:absolute;inset:0; background:var(--cbg);border:1px solid var(--line);border-radius:5px;
          padding:6px 12px 6px 2px; overflow-x:hidden; overflow-y:auto; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
          /* Верхний отступ резервирует место под весь стек закреплённых overlay-баров
             (#chainResultBox + #stepLogBox, см. JS: МАРКЕР 10.2b OVERLAY_STACK держит
             --result-box-h суммой их высот), чтобы бары не перекрывали строки */
          padding-top: calc(6px + var(--result-box-h, 0px));
          scrollbar-width:none} /* Прокрутка колесом/тачем рабочая, просто не рисуем полосу — тот же приём, что у .controls/.menu-drop/#menuTabs */
  .canvas::-webkit-scrollbar{width:0;height:0;background:transparent}

  /* === МАРКЕР 02.2: CSS_CHAIN_UI === */
  /* Анимация броска файла Drag & Drop прямо на холст */
  .canvas.drop-active {
    border: 2px dashed var(--acc) !important;
    box-shadow: inset 0 0 24px rgba(77, 163, 255, 0.3), 0 0 16px rgba(77, 163, 255, 0.4) !important;
    background: #0d1322 !important;
  }
  

  /* Убран overflow у .chain, чтобы исключить появление дублирующего скроллбара */
  .chain{font:var(--chain-fs)/var(--chain-lh) var(--chain-ff); letter-spacing:var(--chain-ls);
         white-space:pre;position:relative; width:100%; max-width:100%; overflow:visible;
         padding-left:3px; padding-top:4px;
         user-select:none} /* padding-top (не просто margin у #alignGrp) — запрос пользователя
         "отступы неодинаковые" — margin-top у #alignGrp (первый видимый ребёнок .chain,
         .chain-head перед ним нулевой высоты и тоже margin:0) СХЛОПЫВАЛСЯ с чем-то выше по
         дереву (классический margin collapsing "родитель без padding/border — считает края
         одним целым с первым ребёнком"), поэтому реальный зазор сверху не совпадал с тем, что
         задан margin-bottom у #alignGrp снизу (тот не схлопывается — после него идёт #colHeader
         с реальным содержимым). padding у родителя collapsing не подвержен — гарантированно
         ровно 4px. Иначе клик с микро-сдвигом мыши по строке оставлял текстовое
         выделение битов, и это ложно блокировало Ctrl+C-копирование выделенных строк (см.
         keydown-обработчик: он нарочно уступает дорогу настоящему текстовому выделению).
         padding-left — небольшой отступ от левого края панели/дока для №/паттерна первой
         колонки (иначе цифры номеров строк упирались прямо в край). .vsplit (абсолютно
         позиционирован относительно .chain) сам не сдвигается вместе с padding — этот же
         отступ явно добавлен и в его формулу left ниже, чтобы граница осталась на месте
         стыка .pat/.bits. */
  
  /* Шапка колонок табличной части — текстовые подписи ("№"/"Паттерн"×2) убраны совсем, сама
     .chain-head схлопнута в невидимую полоску (height:0, overflow:hidden). Она нужна ТОЛЬКО
     ради ширины/позиции своих span'ов (.num/.h-pat/.h-bits/.h-pat2) — isOverPatternColumn()
     (drag&drop) определяет по .h-bits.getBoundingClientRect(), где колонка паттернов, а где
     строк. При height:0 её содержимое всё равно раскладывается (width не зависит от height),
     просто визуально ничего не рисует и не занимает места — линейка столбцов (#colHeader)
     идёt сразу следом без зазора. */
  .chain-head{display:flex;gap:8px;align-items:center;height:0;padding:0;margin:0;border:none;
              overflow:hidden;font-size:.85em;color:var(--dim);
              text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;
              background:var(--cbg);z-index:3;user-select:none}
  .chain-head .num, .chain-head .h-bits, .chain-head .h-pat, .chain-head .h-pat2{visibility:hidden}

  /* Центрирование заголовка центрального столбика (теперь здесь живут вкладки) */
  .h-bits{font-weight:700;color:var(--fg);padding-left:4px;text-align:center;display:flex;justify-content:center}

  /* Будущие строки изначально затемнены.
     height задан ЯВНО через --row-h (целое число пикселей, считается и округляется в JS —
     см. updateRowHeight()), а НЕ через calc(--chain-fs * --chain-lh) напрямую: при дробном
     произведении (напр. 19*0.65=12.35px) сетка строк остаётся ровной геометрически, но у
     каждой строки свой дробный остаток накопленной Y-позиции, и хинтинг текста браузером
     "плавает" от строки к строке — отсюда одинаковые пары символов то сливались, то нет.
     Целый --row-h убирает дробный остаток совсем. */
  .ln{display:flex;gap:8px;align-items:center;opacity:var(--dim-op);transition:opacity 0.2s;cursor:pointer;
      height:var(--row-h, 12px)}
  .ln:hover{background:rgba(255,255,255,0.03)}
  /* Непрозрачный фон под .num пробовали трижды (обычный background — "полосы"; ::before с
     нахлёстом — двойная opacity на стыке строк из-за своей opacity:var(--dim-op) у каждой .ln;
     ::before без нахлёста — "разрывы" в цифрах, где хвост символа при плотном line-height
     обрезается своей же границей) — каждый вариант давал свой визуальный артефакт. Оставлено
     БЕЗ фона (как было исходно) — тут это того не стоит, в отличие от .pat/.pat2 (те длинные и
     реже страдают от вертикального нахлёста соседних строк). */
  .num{flex:0 0 2em;text-align:right;color:#4b5262;font-size:.85em;white-space:nowrap}
  /* Номер строки, изменённой относительно исходного шаблона (tplRows) — см. render() */
  .num.changed{color:#ff9900;font-weight:700}
  /* "⚖ Показать балансы" (см. #bShowBalances в "Виде", formatBalanceTotals() в JS) — итоговая
     сумма "N-M" (единицы минус нули), без скобок. flex:0 0 auto — не тянется/не сжимается,
     ширина ровно по содержимому. Цвет каждого числа — свой, инлайн-стилем в render() (белый для
     "1", серый для "0"), тут только базовый цвет знака "-" между ними. "Пробеги вместо битов"
     (#bRunsAsBits) — отдельная фича, этот класс не использует (она заменяет содержимое .bits
     напрямую, см. formatRunsHtml()). */
  /* padding:0 3px — ВСЕГДА, не только у .row-balance-eq ниже: если бы паддинг появлялся ТОЛЬКО
     при подсветке "баланс поровну", именно эти строки становились бы на 6px шире остальных и
     цепочка после метки уезжала вбок только у них (см. запрос пользователя — "где баланс равный
     съезжает"). Держим паддинг одинаковым всегда, .row-balance-eq снизу меняет только цвет/фон. */
  .row-balance{flex:0 0 auto;color:#4b5262;font-size:.85em;white-space:pre;padding:0 3px}
  /* Единиц и нулей в строке ровно поровну — вместо двухцветной раскраски всё целиком одним
     акцентным цветом + подсветка фоном, чтобы такая "сбалансированная" строка сразу бросалась
     в глаза (см. запрос пользователя). */
  .row-balance-eq{color:#ffcf6b !important;background:rgba(255,207,107,.18);border-radius:2px;
    box-shadow:0 0 6px rgba(255,207,107,.5)}
  /* ОБЩИЙ баланс над колонкой построчных балансов (в линейке столбцов, см. renderColHeader()):
     сумма единиц/нулей по ВЫДЕЛЕННЫМ строкам, а если ничего не выделено — по всей таблице.
     Число заметно шире построчных меток, поэтому оно position:absolute ВНУТРИ той же распорки:
     ширину распорки (а значит и позицию .bits в шапке) не меняет, просто вылезает влево поверх
     пустой колонки паттернов — иначе линейка столбцов разъехалась бы со строками (та же природа
     бага, что и "после вставки баланса съехала", см. комментарий у balanceSpacer).
     z-index:2 — .pat в этой же шапке имеет свой фон и z-index:1, иначе он перекрыл бы вылезшую
     влево часть числа. */
  .col-hdr-balance{position:relative}
  .col-hdr-balance-val{position:absolute;right:3px;top:0;white-space:pre;z-index:2;padding:0 3px}
  /* Номер у ЛЕВОГО края поля битов (см. render()) сидит сразу после .pat, а у .pat справа уже
     зарезервировано 28px под номер шага найденного паттерна (.st) — без компенсации отступ
     слева у этого номера был заметно больше, чем у остальных (не "одинаково", как просили).
     Тянем его назад в счёт этого резерва, но НЕ дальше границы .vsplit (та стоит ровно на
     правом крае .pat, без учёта его 28px padding) — иначе номер заезжает НА линию разделителя
     и накладывается на неё. -20px пересекал границу; -6px оставляет небольшой зазор от неё.
     ФИКСИРОВАННЫЕ -10px были верны только для крупного шрифта: ширина самого номера — 2em при
     font-size:.85em, т.е. 1.7 * --chain-fs, и она едет вместе с ползунком "A" (#fs, 6..22px).
     При fs=19 номер шириной ~32px и оттяжка в 10px не мешает, а при fs=6..8 он всего 10-13px
     широкий — те же -10px затаскивали цифры ровно на линию .vsplit (запрос пользователя:
     "линия у левых балансов налезает на номера при определённых размерах шрифта").
     max(-10px, -0.6em) — оттяжка не больше 0.6 собственного кегля (это 30% ширины бокса, цифры
     прижаты вправо и до линии не достают ни при каком размере), при крупном шрифте упирается в
     прежний потолок 10px, так что вид на дефолтных 19px практически не меняется. */
  .num-l2{margin-left:max(-10px, -0.6em)}
  /* Симметрично: номер у ПРАВОГО края поля битов (сосед .pat2, "числа паттернов" в терминах
     пользователя) — та же компенсация зазора от .vsplit2, что у .num-l2 от .vsplit. */
  .num-r2{margin-left:max(-10px, -0.6em)}
  
  /* Подсветка выделенных кликом / Ctrl+Кликом строк — только фон, настраивается отдельно
     (см. #rowBgSel/--rowbg-sel), не трогая невыделенные строки и цвета 0/1. */
  .ln.selected {
    background: var(--rowbg-sel) !important;
    opacity: 1 !important;
  }
  .ln.selected .num {
    color: #ffcf6b !important;
    font-weight: bold;
  }
  .ln.selected .pat, .ln.selected .pat2 { background: var(--rowbg-sel) !important; }

  /* Выравнивание по ЛЕВОМУ краю для исключения сдвигов + небольшой отступ справа 28px под номер шага */
  /* ВОЗВРАЩЕНО overflow:hidden+text-overflow:ellipsis (пробовали убрать по аналогии с .bits —
     сломало раскладку куда сильнее ожидаемого: без обрезки длинный текст паттерна физически
     наезжает на колонку битов/цепочки, а не просто "чуть вылезает", — визуальная каша. Тут
     обрезка длинных паттернов многоточием остаётся, в отличие от .bits. */
  /* background:var(--bg) — под "⊙ Ось"/"Ось 1.2" строка может свободно уезжать далеко ЗА .bits в
     любую сторону (см. axisRowShift() в JS — обрезка через blankRun убрана, вместо неё
     transform:translateX) и наезжать на эту колонку — запрос пользователя: "панели паттернов
     сделай видимыми над цепочками, сами цепочки скрыты за ними" — непрозрачный фон полностью
     перекрывает вылезающий "хвост" строки. z-index:1 — .pat стоит ПЕРЕД .bits в DOM (слева), а
     по умолчанию более поздний элемент (.bits) красился бы ПОВЕРХ него при наложении — z-index
     заставляет .pat/.pat2 рисоваться СВЕРХУ независимо от порядка в DOM (см. .pat2 z-index ниже,
     ей он не был бы нужен по DOM-порядку, но добавлен для симметрии/на будущее).
     .ln.selected переопределяет фон ниже, чтобы не рвать жёлтую подсветку выделения тут. */
  .pat{flex:0 0 var(--pat-w);color:var(--dim);font-family:inherit;font-size:inherit;background:var(--bg);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
       padding-left:4px;padding-right:28px;position:relative;z-index:1}
  .pat2{flex:0 0 var(--pat-w2);color:var(--dim);font-family:inherit;font-size:inherit;background:var(--bg);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
        padding-left:4px;padding-right:28px;position:relative;z-index:1}

  /* Номера шагов отступают от скроллбара */
  .pat .st{position:absolute;right:2px;top:0;width:24px;text-align:right;color:#4b5262;font-weight:normal}
  .pat2 .st{position:absolute;right:8px;top:0;width:24px;text-align:right;color:#4b5262;font-weight:normal}
  .pat.found{color:var(--red)}
  .pat.found.inv{color:var(--purple)}
  .pat.found.rev{color:var(--green)}
  .pat2.found{color:var(--red)}
  .pat2.found.inv{color:var(--purple)}
  .pat2.found.rev{color:var(--green)}

  /* Фоновый поиск (cBgSearch): подсветка ТОЛЬКО ячейки паттерна, без затрагивания самой строки/
     битов. bg-search-target — что ищем прямо сейчас (голубым, пока совпадения ещё нет);
     bg-search-hit — совпадение найдено (жёлтым, поверх target-подсветки). */
  .pat.bg-search-target, .pat2.bg-search-target{background:rgba(77,163,255,.25);color:var(--acc) !important;
    border-radius:2px; box-shadow:0 0 4px rgba(77,163,255,.6)}
  .pat.bg-search-hit, .pat2.bg-search-hit{background:rgba(255,207,107,.35);color:#ffcf6b !important;
    border-radius:2px; box-shadow:0 0 4px rgba(255,207,107,.6)}

  /* То же жёлтое совпадение, но для конкретных найденных бит внутри окошка результата
     фон-поиска (#chainText) — показывает, ГДЕ именно паттерн нашёлся в строке результата.
     .inv/.rev/.invrev — та же версия, но найденная инверсией/реверсом/инверсией+реверсом сразу
     паттерна (⇌ Инв/Рев), цвета те же, что и везде в приложении для kind 1/2
     (фиолетовый/зелёный, см. KIND_CLS), плюс свой розовый для 4-й версии. .skip1 — версия
     нашлась через "⏭ Без 1-го" (без первого символа паттерна) — приглушаем, чтобы было видно,
     что совпал укороченный вариант, а не паттерн целиком. */
  .chain-hit-bits{background:rgba(255,207,107,.35);color:#ffcf6b !important;
    border-radius:2px; box-shadow:0 0 4px rgba(255,207,107,.6)}
  .chain-hit-bits.inv{background:rgba(176,96,255,.3);color:var(--purple) !important;
    border-radius:2px; box-shadow:0 0 4px rgba(176,96,255,.6)}
  .chain-hit-bits.rev{background:rgba(56,193,114,.3);color:var(--green) !important;
    border-radius:2px; box-shadow:0 0 4px rgba(56,193,114,.6)}
  .chain-hit-bits.invrev{background:rgba(255,102,204,.3);color:#ff66cc !important;
    border-radius:2px; box-shadow:0 0 4px rgba(255,102,204,.6)}
  .chain-hit-bits.skip1{opacity:.6; box-shadow:none; border-bottom:1px dashed currentColor}

  /* Продолжение кольца (виртуальный "следующий виток", см. ringNextLap/findPatternKinds),
     дорисованное после реальных бит строки результата — приглушается ТОЛЬКО когда 🔁 Инв. кольцо
     включена (эти символы реально инвертированы относительно оригинала); совместим с
     .chain-hit-bits.* — просто гасит яркость поверх обычной/цветной подсветки находки. */
  .chain-ring-ext{opacity:.5}

  /* Витки кольца в строке результата фон-поиска — каждый своим фоном, чтобы было видно, из
     скольких кусков собрано кольцо и где проходят их границы. При включённой 🔁 Инв. кольцо
     период двойной (прямой виток + инвертированный), а показывается он дважды — итого ЧЕТЫРЕ
     набора бит подряд (запрос пользователя: "цветом обозначить все 4 набора бит, когда кольцо
     из 4 состоит"). Красим именно ФОНОМ, а не цветом текста: цвет символа уже занят под
     значение бита (.b0/.b1) и под подсветку находки (.chain-hit-bits.*), их перебивать нельзя.
     Виток 0 — настоящие биты строки, он без пометки; дальше 1/2/3 по кругу.
     Фон (rgba .16) пробовали — "еле различим" (запрос пользователя), заменён на тонкое пунктирное
     подчёркивание в цвет витка: на тёмном полотне видно куда лучше и при этом не спорит ни с
     цветом символа, ни с фоном подсветки находки. У .chain-hit-bits.skip1 своё пунктирное
     подчёркивание через border-bottom (currentColor) — теперь они не конфликтуют вовсе, тут
     другое свойство.
     ВАЖНО №1: класс вешается на обёртку ВСЕГО витка, а не на каждый символ (см. render()) —
     пунктир на элементе шириной в один знак давал 1-2 штриха, которые при 100% масштаба
     округлялись в ничто и проявлялись только к 175%.
     ВАЖНО №2: это text-decoration, а НЕ border-bottom. Контейнер .chain-result-line-bits имеет
     overflow:hidden (нужен для обрезки многоточием), а .chain-result-line — line-height:1, то
     есть контентный бокс ровно по высоте шрифта. Рамка рисуется ПОД ним и просто срезалась
     клипом — линии не было видно вообще. text-decoration рисуется внутри строки и под обрезку
     не попадает. offset держим маленьким по той же причине. */
  /* Подчёркиваются только ЧЁТНЫЕ наборы из четырёх (2-й и 4-й — это и есть витки-продолжения,
     инвертированные относительно прямых), белым — запрос пользователя. Нечётные (1-й и 3-й,
     прямые) остаются без пометки, так что пунктир сам по себе читается как "тут инверсия".
     .ring-lap-2 (0-based, повтор прямого витка) поэтому пустой и в разметке не вешается. */
  .ring-lap-1,.ring-lap-3{text-decoration-line:underline;text-decoration-style:dashed;
    text-decoration-thickness:1px;text-underline-offset:1px;text-decoration-color:#ffffff}

  /* Пропущенный 1-й символ паттерна подсвечивается тусклым серым */
  .pat-skip{color:var(--dim); opacity:0.5}
  
  /* Левая граница разделителя. Позиция = padding-left у .chain (3px) + ширина .num (2em, но
     .num сам на font-size:.85em, значит фактически 2*.85=1.7em в масштабе .chain) + gap
     .num→.pat (8px) + ширина .pat (var(--pat-w)) + gap .pat→.bits (8px). Раньше тут стояло
     "3.5em+8px+...+2px" — устаревшая формула от прежней разметки .num (не совпадала с текущими
     2em/.85em), из-за чего граница была сдвинута примерно на 1.8em вправо и залезала на биты
     цепочки — особенно заметно при выравнивании влево (⇤), где символы начинаются вплотную к
     границе колонки без запаса. Первое слагаемое (было 6px) синхронизировано с .chain
     padding-left — если то меняется, это тоже надо поменять. */
  .vsplit{position:absolute;top:0;bottom:0;left:calc(3px + 1.7em + var(--pat-w) + 16px);
          width:5px;cursor:col-resize;z-index:2}
  .vsplit::before{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--line)}
  .vsplit:hover::before,.vsplit.drag::before{background:var(--acc);width:2px}

  /* Правая граница разделителя — та же логика зеркально от правого края (var(--pat-w2) +
     gap .bits→.num (8px) + ширина .num (1.7em) + gap .num→.pat2 (8px)); старая формула
     учитывала только var(--pat-w2), вообще не отступая под правую колонку номеров.
     "-12px" — двойная компенсация: .num-l2 (слева от .bits) и .num-r2 (справа от .bits, тот
     же класс зазора от .vsplit2) оба с margin-left:-6px. Отрицательный margin во Flexbox
     уменьшает занятое элементом место при расчёте оставшегося пространства — от каждого из
     них .bits (flex:1 1 auto) становится на 6px шире, чем без компенсации; без сдвига
     .vsplit2 на все 12px суммарно вправо линия разделителя залезала на реальные биты справа
     (заметно при выравнивании вправо, где символы стоят вплотную к правому краю .bits). */
  .vsplit2{position:absolute;top:0;bottom:0;right:calc(var(--pat-w2) + 1.7em + 16px - 16px);
           width:5px;cursor:col-resize;z-index:2}
  .vsplit2::before{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--line)}
  .vsplit2:hover::before,.vsplit2.drag::before{background:var(--acc);width:2px}

  /* Ручка переноса центра оси ("⊙ Ось"/"Ось 1/2") — запрос пользователя: как #vsplit/#vsplit2
     (тонкая перетаскиваемая граница), но НЕ во всю высоту (top:0;bottom:0, наезжая на биты
     строк), а только над линейкой столбцов (top:0, ограниченная height — см.
     updateAxisSplitPosition() в JS, там же считается и left, т.к. позиция оси зависит от
     данных/сдвига и не выражается статичной CSS-формулой, в отличие от .vsplit/.vsplit2).
     display:none по умолчанию — показывается только под "⊙ Ось"/"Ось 1/2" (см. JS). */
  .axis-split{position:absolute;top:0;width:7px;margin-left:-3px;cursor:col-resize;z-index:16;display:none}
  .axis-split.act{display:block}
  .axis-split::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--m-purple2,#8a5da8)}
  .axis-split:hover::before,.axis-split.drag::before{background:#fff;width:2px}

  /* overflow снят совсем (была попытка overflow-x:hidden + overflow-y:visible — обрезать только
     по горизонтали, чтобы при плотном line-height наложенные символы не резались по вертикали —
     но по спеке CSS если одна ось НЕ visible, а другая ИМЕННО visible, браузер молча подменяет
     "visible" на "auto", отсюда и вылезли скроллы на строках; та же ловушка, что уже словили на
     #menuTabs, см. комментарий там же). Раз развести оси нельзя — совсем убрали clipping: ничего
     не обрезается ни по горизонтали, ни по вертикали. Плата — очень длинные строки визуально
     вылезают за правый край .bits (наезжая на колонку паттернов), а не аккуратно обрезаются.

     pointer-events:none у .ln .bits (НЕ у .col-hdr-row .bits — та же .bits-разметка используется
     и линейкой столбцов #colHeader, где клик по .col-cell должен работать как обычно, см. ниже,
     сначала так и сломали выбор столбца, подмешав правило под общий класс .bits без уточнения) —
     ВИДИМОСТЬ (наложение символов при плотном line-height) остаётся как есть, но КЛИК больше не
     должен "цепляться" за визуально наехавший на соседнюю строку текст: .ln-ряды физически не
     перекрываются (каждый ровно --row-h высотой, стоят впритык), только их СОДЕРЖИМОЕ визуально
     вылезает друг на друга — а т.к. более поздняя по DOM строка красится ПОВЕРХ вылезающего
     "хвоста" предыдущей, клик по видимому символу мог попадать в чужую .ln (ту, чей пустой бокс
     просто физически там расположен). С pointer-events:none клик по .bits проваливается сквозь
     текст к .ln — тому, что реально соответствует Y-координате клика, без оглядки на то, чей
     символ там нарисован поверх. Обработчики строк (mousedown/dblclick на #rows) и так ищут
     ближайший .closest(".ln") — работать продолжают как прежде. */
  .bits{flex:1 1 0px; min-width:0}
  .ln .bits{pointer-events:none}
  
  .ln .bits { display: flex; }
  .ln .bits.al-center, .col-hdr-row .bits.al-center { justify-content: center; }
  .ln .bits.al-left, .col-hdr-row .bits.al-left { justify-content: flex-start; }
  .ln .bits.al-right, .col-hdr-row .bits.al-right { justify-content: flex-end; }
  /* "По полубитам" — тот же расчёт отступа, что у центра (alignShift не различает их), плюс
     точечный transform:translateX(0.5ch) на нечётной разнице длин (см. render()). */
  .ln .bits.al-halfcenter, .col-hdr-row .bits.al-halfcenter { justify-content: center; }
  .ln .bits > span { white-space: pre; }
  
  .b1{color:var(--c1)}
  .b0{color:var(--c0)}
  /* Жирность символов 0/1 — см. #bBoldBits в "Виде". Особые подсветки (01/1↕1/1⤡1, инверсия)
     раньше были жирными ВСЕГДА, из-за чего выключенный тумблер выглядел так же жирно, как
     включённый (см. .hl01/.hlv1/.hld1/.inv ниже — там font-weight без body.bold-bits убран,
     он теперь тоже подчиняется этому тумблеру, единообразно со всей остальной сеткой). */
  body.bold-bits .b0, body.bold-bits .b1 { font-weight: bold; }

  /* Инверсные биты в сквозной строке подсвечиваются фиолетовым и розовым с легким свечением;
     жирность — только вместе с общим тумблером #bBoldBits (см. выше). */
  .b1.inv { color: var(--purple) !important; text-shadow: 0 0 3px var(--purple); }
  .b0.inv { color: #ff66cc !important; text-shadow: 0 0 3px #ff66cc; }

  /* Мягкая аккуратная бирюзовая подсветка битов под XOR — только цветом, без сдвига символов */
  .xored-bit {
    color: #00e5ff !important;
  }

  /* Бит, только что перевёрнутый при переходе границы строки — см. "◄/► Круг Инв". Без жёлтого
     фона — только цвет символа, запрос пользователя "убери фон выделения желтый оставь только
     цвет символов". */
  .bit-inv { color: #ff9900 !important; font-weight: 700; }

  .ln.used, .ln.cur { opacity: 1; }

  /* Гориз.XOR активен — строки, не участвующие в поиске сейчас, сильно затемняем (см. render()),
     НО КРОМЕ паттерна (.pat/.pat2) — искомый паттерн должен оставаться читаемым даже в
     затемнённой строке (opacity родителя иначе перемножился бы и с ним) — запрос пользователя
     "подсветить паттерн в паттернах, даже несмотря что затемнена там строка". */
  .ln.horiz-dim > *:not(.pat):not(.pat2) { opacity: .12; }
  /* Разделитель "0 нампад" — тонкая серо-коричневая граница снизу строки (см. rowDividers) */
  .ln.row-divider { border-bottom: 1px solid #8a7a68; }

  .cur .num{color:var(--acc);font-weight:700}
  .cur{background:rgba(120,150,255,.10)}
  .hit{color:var(--red);font-weight:700}
  .hit.inv{color:var(--purple)}
  .hit.rev{color:var(--green)}
  .empty{color:#3a4050}

  /* Линейка номеров столбцов — всегда видна над строками (см. renderColHeader), каждая
     ячейка ровно 1 символ шириной, чтобы совпадать с сеткой битов построчно.
     ВАЖНО: font-size тут был .85em (унаследовано от старой компактной .chain-head с текстовыми
     подписями) — при том же числе символов (maxLen) это делало ленту тиков física УЖЕ ленты
     битов в строках (.ln не уменьшает шрифт), из-за чего при центрировании тики уезжали вправо
     относительно сетки. Числа подтверждены из консоли: обёртка тиков 417px против обёртки битов
     497px — ровно отношение ~0.85. Шрифт линейки должен быть 1:1 с .ln, никакого .85em. */
  /* Прилипает сразу под .chain-head (та занимает 20px, тоже sticky top:0) — линейка больше не
     уезжает вместе со строками при скролле вниз. */
  #colHeader{display:none}
  /* margin-bottom — небольшой отступ от первой строки данных: при плотном line-height (--chain-lh)
     содержимое первой строки визуально наезжает вверх на линейку столбцов (та же природа
     наложения, что и у соседних строк друг с другом, см. .ln .bits/pointer-events выше) —
     отступ отодвигает первую строку вниз, чтобы не сталкивались. */
  #colHeader.act{display:block;position:sticky;top:0;z-index:2;background:var(--cbg);margin-bottom:4px}
  .col-hdr-row{display:flex;gap:8px;align-items:center;color:var(--dim);user-select:none}
  .col-hdr-row .bits{display:flex}
  .col-hdr-row .bits > span{white-space:pre}
  .col-cell{cursor:pointer;color:#4b5262;overflow:hidden;border-radius:2px;
    transition:color .12s,background-color .12s,box-shadow .12s}
  /* Сама палочка "|" — во внутреннем span'е: растягиваем её ТОЛЬКО по X трансформом (не трогая
     раскладку — box .col-cell остаётся ровно 1 символ шириной, как у 0/1 в строках ниже),
     чтобы линия была заметно жирнее, но сетка столбцов не "съезжала". overflow:hidden на
     .col-cell обрезает растянутую палочку по границе её собственной ячейки — иначе жирная
     линия визуально вылезала в соседний столбец и казалось, что подсветка выделения (.sel/
     .col-sel-bit ниже, в строках) и сама линия-полоска стоят не друг над другом. */
  .col-cell-tick{display:inline-block;transform:scaleX(1.6)}
  .col-cell:hover{color:var(--fg);background:rgba(255,255,255,.10)}
  /* Тот же жёлтый, что и подсветка выделенной строки/бита (.ln.selected/.col-sel-bit) —
     единый язык цвета "выделено" по всему приложению, плюс мягкое свечение вместо плоского блока */
  .col-cell.sel{color:#000;background:#ffcf6b;font-weight:700;box-shadow:0 0 6px rgba(255,207,107,.7)}
  .col-cell.col-hover{color:var(--fg);background:rgba(255,255,255,.10)}
  .col-sel-bit{background:rgba(255,207,107,.35) !important;border-radius:2px}
  /* "0 вместо пустот" (st.padZero): те самые нули, которые склейки/XOR подставляют на месте
     пустот, показываются и в самой таблице — сильно приглушённо, чтобы не путать их с
     настоящими битами строки. Чистая ВИДИМОСТЬ, в st.rows ничего не пишется (см. blankRun в
     render()). Цвет берём тот же, что у настоящих нулей (--c0), но полупрозрачным. */
  .pad-zero-bit{color:var(--c0);opacity:.28}
  .col-hover-bit{background:rgba(255,255,255,.15) !important;border-radius:2px}
  /* Особая подсветка "01" (см. #bHighlight01 в "Виде") — ЗАМЕНЯЕТ обычный цвет 0/1 (.b0/.b1)
     одним сплошным цветом (без прозрачности — та была почти не видна на тёмном фоне): и "0", и
     "1" в найденном пробеге красятся одинаково, плюс жирным, чтобы точно бросалось в глаза. */
  .hl01{color:var(--c01-hl) !important}
  /* Особая подсветка "1 под 1" (см. #bHighlightVert1 в "Виде") — та же логика оформления, что
     у .hl01: сплошной цвет + жирный, отдельная переменная/кнопка/цвет. Если позиция подходит
     под ОБЕ подсветки одновременно (01 и 1-под-1) — 1-под-1 идёт вторым классом в render() и
     потому визуально побеждает (см. порядок классов в HTML). */
  .hlv1{color:var(--cv1-hl) !important}
  /* Особая подсветка "1 по диагонали" (см. #bHighlightDiag1) — та же логика оформления, что у
     .hl01/.hlv1. Объявлена ПОСЛЕ них — при совпадении сразу нескольких подсветок на одном
     символе она визуально побеждает (см. порядок классов в render()). */
  .hld1{color:var(--cd1-hl) !important}
  /* Подсветка "диагонали склейки" (см. #bHighlightDiagFold/computeDiagFoldMask) — это не находка
     из единиц, как .hld1, а САМИ линии обхода режимов "⧅ Диаг. ↘/↙": красятся ВСЕ биты на линии,
     и "1", и "0". Объявлена последней — при совпадении с другими подсветками побеждает она
     (см. порядок классов в render()). Соседние диагонали чередуются по яркости (.hldf-alt), иначе
     сплошная заливка читается как одно пятно и не видно, где кончается одна линия и начинается
     следующая. */
  .hldf{color:var(--cdf-hl) !important}
  .hldf.hldf-alt{filter:brightness(0.62)}
  /* Крестик сброса — прямо на месте палочки выбранного столбца (col-cell-clear-glyph заменяет
     col-cell-tick для этой ячейки), не отдельно сбоку. transform:none — иначе scaleX(1.6) от
     .col-cell-tick растягивал "✕" в кривой овал. */
  .col-cell-tick.col-cell-clear-glyph{transform:none;color:#ff6666;font-weight:700}
  .col-cell.sel:hover .col-cell-clear-glyph{color:#fff;text-shadow:0 0 6px #ff6666}

  /* Поле для ручного редактирования строк (двойной клик) */
  .edit-row-input {
    width: 100%;
    min-width: 100px;
    background: #0d1322;
    color: var(--fg);
    border: 1px solid var(--acc);
    border-radius: 3px;
    font-family: inherit;
    font-size: inherit;
    padding: 0 4px;
    outline: none;
    letter-spacing: var(--chain-ls);
    box-shadow: 0 0 8px rgba(77, 163, 255, 0.4);
  }

  /* === МАРКЕР 02.3: CSS_OVERLAYS === */
/* Окошко сквозной строки/результата фон-поиска — закреплённый overlay-бар сразу под верхним
   меню (см. HTML: вынесено в main-layout, sibling у .canvas). Высота минимальна по умолчанию
   и растёт сама под содержимое; клик по шапке сворачивает в одну строку заголовка.
   z-index ВЫШЕ боковых доков (.controls: 90) — иначе закреплённая справа/слева вкладка меню
   перекрывала бар поверх него; так бар всегда виден целиком во всю ширину, а не обрезается. */
/* .overlay-box — общее позиционирование для обоих стековых баров (Результат/Черновик): top
   выставляется в JS (layoutOverlayBoxes, по текущему overlayOrder), left/right — в JS же
   (updateResultBoxInset, отступ от закреплённых боковых панелей). Ширина всегда авто (на всю
   доступную ширину) — двигать можно ТОЛЬКО порядок по вертикали (перетаскиванием за ⋮⋮),
   не X/Y-позицию и не размер. */
.overlay-box {
  position: absolute;
  left: 6px;
  right: 6px;
  z-index: 95;
  padding: 4px 8px;
  white-space: normal;
  transition: top .15s;
}
.overlay-box.drag-target { outline: 2px dashed var(--acc); outline-offset: 2px; }
.overlay-drag { color: var(--dim); font-size: 12px; letter-spacing: 2px; user-select: none; cursor: grab; flex: 0 0 auto; }
.overlay-drag:active { cursor: grabbing; }
.overlay-title { flex: 1 1 auto; min-width: 0; }
/* Общая шапка обоих баров — одинаковый шрифт/отступ/высота у обоих, независимо от собственных
   цветов панели (см. .chain-result-head b / .step-log-head b ниже — там только color). */
.overlay-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--dim);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  user-select: none;
}
.overlay-box.collapsed .overlay-head { margin-bottom: 0; }
.chain-result-box {
  background: rgba(14, 16, 21, 0.97);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
}
.chain-result-head b { color: var(--acc); }
.chain-result-box.collapsed .chain-result-text,
.chain-result-box.collapsed #chainResultResizeHandle { display: none; }
/* ✕ — ПОЛНОСТЬЮ скрывает бар (в отличие от клика по шапке, который просто сворачивает в
   строку-заголовок); вернуть можно только кнопками в верхнем меню (#bToggleResultBox/
   #bToggleStepLog), см. JS МАРКЕР 10.2b OVERLAY_STACK. */
.overlay-box.hidden { display: none; }
.overlay-close { color: var(--dim); font-size: 13px; line-height: 1; padding: 0 2px; cursor: pointer; flex: 0 0 auto; }
.overlay-close:hover { color: var(--red); }

/* Визуализатор наложения Горизонтального XOR — без своей рамки/фона (см. запрос пользователя
   "в окне всё делать без доп рамок"): просто обёртка для отступа снизу, чтобы "Сквозная"/"Цель"
   выравнивались с "Результат" (та рендерится отдельно, вне этой обёртки, тем же .horiz-ride-row,
   без padding — раньше собственный padding .horiz-info сдвигал их относительно "Результат"). */
.horiz-info {
  margin-bottom: 4px;
  font-size: 12px;
  line-height: 1.5;
}
.horiz-info b { color: #ff9900; }
.horiz-active-bit {
  background: #ff9900;
  color: #000000 !important;
  font-weight: bold;
  padding: 0 3px;
  border-radius: 2px;
  box-shadow: 0 0 6px #ff9900;
}

/* Три строки (сквозная / цель / результат) для Гориз.XOR, теперь в "Черновике шага".
   Моноширинный шрифт без padding/bold у отдельных символов — иначе столбцы разъезжаются.
   По умолчанию — одна строка, обрезанная (как .chain-result-line/.step-log-result); клик
   разворачивает целиком (.expanded), тот же приём "▸ ещё" при реальной обрезке. */
.horiz-ride-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: "Roboto Mono", Consolas, monospace;
  font-size: 12px;
  letter-spacing: normal;
  cursor: pointer;
  position: relative;
  padding-right: 3px;
}
.horiz-ride-row + .horiz-ride-row { margin-top: 2px; }
.horiz-ride-row.truncated::after{content:"▸ ещё";position:absolute;right:3px;top:50%;
  transform:translateY(-50%);background:var(--acc);color:#fff;font-size:10px;font-weight:700;
  line-height:1.4;padding:0 4px;border-radius:2px;pointer-events:none;
  box-shadow:0 0 6px rgba(0,0,0,.7), -8px 0 6px -2px rgba(255,153,0,.1)}
.horiz-ride-tag {
  flex: 0 0 64px;
  color: var(--dim);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .5px;
  text-align: right;
}
.horiz-ride-text { color: var(--fg); flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* Позиции СКВОЗНОЙ, куда цепочка ещё/уже не дотягивается (см. computeHorizXorInfo) — тусклая
   точка вместо невидимого пробела, чтобы была видна ВСЯ протяжённость строки (той же длины,
   что ЦЕЛЬ), а не только кусочек с реальными битами — запрос пользователя "покажи всю длину
   сквозной". */
.horiz-chain-gap { color: var(--dim); opacity: .35; }
.horiz-ride-row.expanded { align-items: flex-start; }
.horiz-ride-row.expanded .horiz-ride-text { white-space: pre-wrap; word-break: break-all; overflow: visible; text-overflow: clip; }
/* Активная (только что въехавшая) позиция — только цветом, без сдвига символов */
.horiz-ride-text .horiz-active-bit {
  background: none;
  box-shadow: none;
  padding: 0;
  font-weight: normal;
  color: #ff9900 !important;
}

.chain-result-text {
  font-family: "Roboto Mono", Consolas, monospace;
  font-size: 12px;
  letter-spacing: normal;
  color: var(--fg);
  word-break: break-all;
  white-space: pre-wrap;
  user-select: all;
  background: #050505;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid #1a1d26;
  min-height: 18px;
  height: auto;
  max-height: 40vh;
  overflow-y: auto;
  resize: vertical; /* Можно дотянуть мышью выше max-height, если нужно */
}

/* Строки результата фон-поиска (несколько режимов сразу) — label фиксированной ширины (одна на
   все строки, см. render()) + сами биты. По умолчанию биты обрезаны в одну линию, чтобы длинные
   результаты не распирали окошко; клик по строке (см. JS-обработчик на #chainText) разворачивает
   её целиком построчным переносом. */
/* line-height:1 + нулевой вертикальный padding — запрос пользователя "убери вертикальные
   отступы, пусть символы прикасаются": строки результата идут вплотную друг к другу, как строки
   самой цепочки. Горизонтальный padding (3px) оставлен — он держит фон-полоски/значок "▸ ещё" от
   краёв окна, на вертикальную плотность не влияет. */
.chain-result-line{display:flex;gap:6px;cursor:pointer;line-height:1;padding:0 3px;border-radius:2px;position:relative}
/* Явная метка "тут обрезано, кликни" — ставится по факту (JS меряет scrollWidth/clientWidth,
   см. render()), а не всегда: родной "…" от text-overflow легко потерять среди битов на мелком
   шрифте, поэтому поверх правого края строки — свой заметный цветной значок */
.chain-result-line.truncated::after{content:"▸ ещё";position:absolute;right:3px;top:50%;
  transform:translateY(-50%);background:var(--acc);color:#fff;font-size:10px;font-weight:700;
  line-height:1.4;padding:0 4px;border-radius:2px;pointer-events:none;
  box-shadow:0 0 6px rgba(0,0,0,.7), -8px 0 6px -2px var(--panel)}
/* Чуть разный фон у каждой строки (серо/коричневатые оттенки), чтобы соседние режимы было легче
   различить взглядом — но нарочно близкие тона, не пестрит */
.chain-result-line:nth-child(5n+1){background:rgba(120,120,120,.10)}
.chain-result-line:nth-child(5n+2){background:rgba(140,120,100,.10)}
.chain-result-line:nth-child(5n+3){background:rgba(110,100,90,.12)}
.chain-result-line:nth-child(5n+4){background:rgba(130,115,95,.08)}
.chain-result-line:nth-child(5n+5){background:rgba(100,100,110,.10)}
.chain-result-line:hover{background:rgba(255,255,255,.08)}
/* ВЫБРАННАЯ строка-диагональ (клик по ней — см. st.diagFoldPick): именно она сейчас подсвечена в
   самой таблице, поэтому и помечается тем же цветом, что подсветка "⧅⧄ Диагонали склейки" —
   иначе непонятно, от какой строки идёт раскраска битов. Фон перебивает полосатые nth-child выше. */
.chain-result-line.picked{background:rgba(255,255,255,.10) !important;
  box-shadow:inset 3px 0 0 var(--cdf-hl)}
.chain-result-line.picked .chain-result-line-label{color:var(--cdf-hl);font-weight:700}
.chain-result-line-label{flex:0 0 auto;color:var(--dim);white-space:nowrap;user-select:none}
/* ФИКСИРОВАННАЯ ширина (не min-width) под максимум возможных галочек (4 kind'а — см. KIND_CLS) —
   ВСЕГДА занимает одно и то же место, даже пустая (нет находки) или с 1 галочкой, чтобы
   двоеточие и биты у ВСЕХ строк начинались в одном месте независимо от того, сколько версий
   паттерна (прямая/инверсия/реверс/инверсия+реверс) совпало у конкретной строки. */
.chain-result-line-check{flex:0 0 auto;width:3.4em;text-align:center;display:inline-flex;
  justify-content:center;gap:1px}
.chain-result-line-check-mark{color:#ffcf6b;font-weight:700}
.chain-result-line-check-mark.inv{color:var(--purple)}
.chain-result-line-check-mark.rev{color:var(--green)}
.chain-result-line-check-mark.invrev{color:#ff66cc}
.chain-result-line-check-mark.skip1{opacity:.55}
.chain-result-line-colon{flex:0 0 auto;color:var(--dim)}
.chain-result-line-bits{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chain-result-line.expanded .chain-result-line-bits{white-space:pre-wrap;word-break:break-all;text-overflow:clip}
/* "3+4) 111+10000" — из каких строк (номер+содержимое) считаются режимы фон-поиска ниже, см. render() */
.chain-result-src-row{padding:1px 3px 3px;color:var(--dim);font-size:11px;opacity:.8;cursor:default}
/* Лог находок фон-поиска — своя вкладка "Лог находок" (#findLogList, см. bgFindLog/
   renderFindLogPanel() в JS), последняя находка сверху. Таблица: строка + по столбцу на каждый
   встретившийся в логе режим, "+" там, где режим реально совпал в этой находке. */
.find-log-row{display:flex;font-size:11px;border-bottom:1px solid var(--line)}
.find-log-row:last-child{border-bottom:none}
.find-log-head{color:var(--dim);font-weight:700;border-bottom:1px solid var(--acc)}
.find-log-cell{flex:0 0 auto;width:3.2em;padding:2px 3px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find-log-row-no{width:4.5em;text-align:left;color:var(--dim)}
.find-log-mode{width:4.2em}
.find-log-plus{color:var(--acc);font-weight:700}

/* "🧮 Суммы длин" (см. findLengthSumCombos/renderLengthSumsHtml в JS) — каждая строка-комбинация
   в своём цвете на каждый источник (LSUM_COLORS, циклится), совпавшая с паттерном ниже — рамка. */
.lsum-block{margin-top:3px;padding-top:3px;border-top:1px solid var(--line)}
.lsum-title{padding:0 3px;color:var(--dim);font-size:11px;line-height:1.1;opacity:.8}
.lsum-row{display:flex;gap:6px;padding:0 3px;font-size:11px;line-height:1.1;align-items:baseline}
/* Искомый паттерн — ТОЧНО той же разметкой/шрифтом/размером, что и суммы ниже (.lsum-row/
   .lsum-label/.lsum-bits без переопределения font-size/font-weight — иначе даже в моноширинном
   шрифте разный размер/начертание сдвигает колонки, бит НЕ строго над битом) — запрос
   пользователя "тем же шрифтом биты над битами". Только цвет светлее + рамка снизу, чтобы
   визуально отделяться от списка сумм под ним, не трогая ширину символов. */
.lsum-pattern-bits{color:var(--fg)}
.lsum-pattern-row{padding-bottom:2px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.lsum-row.lsum-matched{background:rgba(255,207,107,.12);border-radius:2px;outline:1px solid var(--acc)}
.lsum-label{flex:0 0 auto;color:var(--dim);min-width:3.5em}
.lsum-bits{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--chain-ff, "Roboto Mono", Consolas, monospace)}
.lsum-c0{color:#4da3ff}
.lsum-c1{color:#ffcf6b}
.lsum-c2{color:var(--green)}
.lsum-c3{color:var(--purple)}
.lsum-c4{color:#ff66cc}
.lsum-c5{color:#00e5ff}

/* Черновик последнего шага — визуальный лог операции: какие строки взяты, что сделано, что найдено.
   Позиционирование (top/left/right) — общее для обоих overlay-баров, см. .overlay-box выше. */
.step-log-box {
  background: rgba(26, 20, 10, 0.85);
  border: 1px solid rgba(255, 191, 92, 0.28);
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
}
.step-log-head b { color: #ffcf6b; }
.step-log-box.collapsed .step-log-body,
.step-log-box.collapsed .step-log-resize-handle { display: none; }
.step-log-body {
  font-size: 12px;
  line-height: 1.4;
  color: var(--fg);
  /* Высота держится в JS через явный style.height (см. stepLogBodyHeight/applyStepLogBodyHeight
     в renderStepLogBox) — растёт, если новому содержимому нужно больше места, но НИКОГДА не
     уменьшается сама только из-за того, что на очередном шаге строк стало меньше; своя ручка
     снизу (.step-log-resize-handle) даёт подвинуть высоту вручную в любую сторону. Без этого
     (просто auto-высота) бар то растягивался без предела при большом содержимом ("Подпаттерны
     сдвига" и т.п.), то сжимался обратно на следующем шаге — оба эффекта мешали.
     display:flex + justify-content:flex-end — раз высота фиксированная и не сжимается, при
     МЕНЬШЕМ содержимом (например, строк-источников стало меньше) пустое место остаётся СВЕРХУ,
     а не снизу: "Итог" всегда у нижнего края блока, на одном и том же месте, а не прыгает вверх
     вместе с уменьшившимся содержимым. */
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
}
.step-log-body::-webkit-scrollbar { width: 6px; }
.step-log-body::-webkit-scrollbar-thumb { background: #2b3040; border-radius: 3px; }
.step-log-body::-webkit-scrollbar-track { background: transparent; }
/* flex-shrink:0 — иначе flex (см. .step-log-body выше) может сжимать строки уже своей высоты,
   когда содержимого больше, чем текущая высота блока, вместо того чтобы честно переполниться
   и дать сработать overflow-y:auto (скролл). */
.step-log-body > * { flex-shrink: 0; }
.step-log-resize-handle {
  height: 7px;
  margin: 2px 0 -4px;
  cursor: ns-resize;
  border-radius: 3px;
  position: relative;
}
.step-log-resize-handle::before {
  content: "";
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 28px; height: 3px; border-radius: 2px;
  background: rgba(255, 191, 92, .25);
}
.step-log-resize-handle:hover::before, .step-log-resize-handle.dragging::before { background: rgba(255, 191, 92, .6); }
.step-log-row {
  display: flex;
  gap: 6px;
  align-items: baseline;
  margin-bottom: 2px;
  flex-wrap: wrap;
}
.step-log-label {
  flex: 0 0 auto;
  color: var(--dim);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .5px;
  min-width: 60px;
}
/* "(Строки N-M) Операция" — дописывается в шапку сразу после номера шага, тем же регистром/
   насыщенностью, что и остальной заголовок (наследует text-transform:uppercase от .overlay-head). */
.step-log-rows-head { font-weight: normal; margin-left: 4px; }

/* Контейнер для участвующих строк друг под другом — без рамки/фона (см. "в окне всё делать
   без доп рамок"), max-height/overflow только чтобы не растягиваться без предела при XOR-всех
   на много строк. */
.step-log-inputs-container {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin: 2px 0;
  max-height: 140px;
  overflow-x: auto;
  overflow-y: auto;
}
.step-log-inputs-container::-webkit-scrollbar { height: 6px; width: 6px; }
.step-log-inputs-container::-webkit-scrollbar-thumb { background: #2b3040; border-radius: 3px; }
.step-log-inputs-container::-webkit-scrollbar-track { background: transparent; }
.step-log-input-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: "Roboto Mono", Consolas, monospace;
  font-size: 11.5px;
  /* 1, а не 1.1 — тот же запрос "пусть символы прикасаются", что и у .chain-result-line. */
  line-height: 1;
  white-space: pre;
}
.step-log-input-name {
  color: var(--dim);
  font-size: 10px;
  min-width: 36px;
  text-align: right;
  user-select: none;
  flex: 0 0 auto;
}
.step-log-input-text {
  color: var(--fg);
}
/* "⧬ Интерлив сквозной" — в "Итог" ВСЕ символы, взятые ИЗ СТРОКИ (не из сквозной), красятся
   синим — так видно, куда легли именно её биты среди переплетения. Фон пробовали — оказалось
   неразборчиво (см. запрос пользователя), заменили на простой цвет текста. */
.interleave-src-row { color: #4da3ff !important; }

/* Строка результата — тем же рядом-лейблом (.step-log-input-name "Итог"), что и строки-
   источники выше, чтобы биты у всех начинались в одном столбце (см. запрос "выровни названия
   строк"). */
.step-log-result-row { display: flex; align-items: baseline; gap: 8px; margin-top: 0; }
/* Тёмно-серый фон — единственное исключение из "без доп рамок" (сам "Итог" — отдельно
   попросили выделить фоном); одна строка по левому краю, тот же интервал (line-height 1),
   что у строк-источников выше; обрезана (text-overflow), клик разворачивает целиком (см. JS:
   bStepLogResultEl click-обработчик), тот же приём "▸ ещё" при реальной обрезке. */
.step-log-result {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  font-family: "Roboto Mono", Consolas, monospace;
  font-size: 12px;
  line-height: 1;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
  padding: 0 4px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .07);
  color: var(--fg);
}
.step-log-result.expanded {
  word-break: break-all;
  white-space: pre-wrap;
  text-overflow: clip;
}
.step-log-result.truncated::after{content:"▸ ещё";position:absolute;right:3px;top:50%;
  transform:translateY(-50%);background:var(--acc);color:#fff;font-size:10px;font-weight:700;
  line-height:1.4;padding:0 4px;border-radius:2px;pointer-events:none;
  box-shadow:0 0 6px rgba(0,0,0,.7), -8px 0 6px -2px rgba(26,20,10,.85)}
.step-log-empty { color: #3a4050; font-style: italic; }
/* Своя прокрутка для списка подпаттернов — при многих режимах/поворотах список сам не тянет
   за собой высоту всего stepLogBody (см. applyStepLogBodyHeight()), а скроллится в себе. */
.step-log-sub-container { max-height: 160px; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.step-log-sub-container::-webkit-scrollbar { width: 6px; }
.step-log-sub-container::-webkit-scrollbar-thumb { background: #2b3040; border-radius: 3px; }
.step-log-sub-container::-webkit-scrollbar-track { background: transparent; }
