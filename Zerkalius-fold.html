/* Функция полной очистки данных текущего активного слота (цепочки).
   Если у вкладки ещё НЕТ своей сохранёнки (пользователь ни разу не жал "Сохранить" вручную) —
   перед стиранием авто-сохраняем состояние КАК ОНО БЫЛО, чтобы "Сброс" потом мог его вернуть.
   Если сохранёнка уже есть — её не трогаем (не затираем осознанное ручное сохранение). */
function clearActiveTab() {
  snapshot();
  if (st.tabs && st.tabs[st.activeTab] && !st.tabs[st.activeTab].savedChain) {
    st.tabs[st.activeTab].savedChain = {
      rows: st.rows.slice(),
      pats: st.pats.map(p => p ? { ...p } : null),
      used: st.used.slice(),
      tplRows: st.tplRows.slice(),
      tplPats: st.tplPats.slice()
    };
  }
  st.tplRows = [];
  st.tplPats = [];
  st.rows = [];
  st.used = [];
  st.pats = [];
  st.step = 0;
  st.passCount = 0;
  st.horizBitIdx = 0;
  st.lastXorBitA = null;
  st.tailText = "";
  st.tailFlags = [];
  st.hit = null;
  st.selectedRows = new Set();
  
  const taR = document.getElementById("taRows");
  const taP = document.getElementById("taPats");
  if (taR) taR.value = "";
  if (taP) taP.value = "";
  
  render();
  saveCache();
  say("Текущая вкладка полностью очищена!");
}

/* Сохранить/очистить/сбросить данные ЛЮБОЙ вкладки по индексу, не обязательно активной (кнопки
   в выпадающем списке цепочек — см. renderTabs()/chainDdListEl). Единственное место, где живёт
   "сохранёнка" цепочки — st.tabs[idx].savedChain (никакого общего на всё приложение поля
   больше нет); настройки вида/поиска сюда не входят — они отдельно, см. captureUiSettings/
   DEFAULT_UI_SETTINGS и кнопки в "Вид".
   Если idx — активная вкладка, читаем/пишем живые st.rows/st.pats и т.д. (полноценно, с
   рендером холста); если нет — работаем НАПРЯМУЮ с объектом st.tabs[idx], не переключаясь на
   неё (без мерцания холста, без временной подмены активной вкладки). */
function tabSaveChainData(idx) {
  if (!st.tabs || !st.tabs[idx]) return;
  const isActive = idx === st.activeTab;
  const src = isActive ? st : st.tabs[idx];
  st.tabs[idx].savedChain = {
    rows: (src.rows || []).slice(),
    pats: (src.pats || []).map(p => p ? { ...p } : null),
    used: (src.used || []).slice(),
    tplRows: (src.tplRows || []).slice(),
    tplPats: (src.tplPats || []).slice()
  };
  // Сохранённое состояние стало новой базой для подсветки "номер изменился" (см. changedBase
  // в render()) — перерисовываем строки сразу, иначе оранжевые номера висят до следующего
  // не связанного действия.
  if (isActive) render();
  renderTabs();
  saveCache();
  say(`✓ «${st.tabs[idx].name}» сохранена!`);
}

function tabClearChainData(idx) {
  if (!st.tabs || !st.tabs[idx]) return;
  if (idx === st.activeTab) { clearActiveTab(); return; }
  const t = st.tabs[idx];
  if (!confirm(`Полностью очистить «${t.name}»? Строки, паттерны и история будут потеряны.`)) return;
  // Та же логика авто-сохранения перед очисткой, что и в clearActiveTab() — если своей
  // сохранёнки у вкладки ещё нет, "Сброс" потом сможет вернуть то, что было.
  if (!t.savedChain) {
    t.savedChain = {
      rows: (t.rows || []).slice(),
      pats: (t.pats || []).map(p => p ? { ...p } : null),
      used: (t.used || []).slice(),
      tplRows: (t.tplRows || []).slice(),
      tplPats: (t.tplPats || []).slice()
    };
  }
  t.tplRows = []; t.tplPats = []; t.rows = []; t.used = []; t.pats = [];
  t.step = 0; t.passCount = 0; t.tailBuffer = ""; t.selectedRows = []; t.undo = [];
  renderTabs();
  saveCache();
  say(`✓ «${t.name}» полностью очищена!`);
}

function tabResetChainData(idx) {
  if (!st.tabs || !st.tabs[idx]) return;
  if (idx === st.activeTab) { resetAll(); saveCache(); say("✓ Сброшена текущая вкладка."); return; }
  const t = st.tabs[idx];
  if (t.savedChain) {
    t.rows = t.savedChain.rows.slice();
    t.pats = t.savedChain.pats.map(p => p ? { ...p } : null);
    t.used = t.savedChain.used.slice();
  } else {
    const limit = (t.tplRows || []).length;
    t.rows = (t.tplRows || []).slice(0, limit);
    t.used = t.rows.map(() => false);
    t.pats = (t.tplPats || []).slice(0, limit).map((text, i) => ({ text, ord: i, found: false, kind: null, step: null }));
  }
  t.step = 0; t.selectedRows = [];
  renderTabs();
  saveCache();
  say(`✓ «${t.name}» сброшена.`);
}
/* === МАРКЕР 10.1: DRAG AND DROP === */
/* Вспомогательная функция для определения зоны броска */
function isOverPatternColumn(e) {
  // Прямое попадание по боковым колонкам или разделителям
  if (e.target.closest('.pat') || e.target.closest('.pat2')) return true;
  if (e.target.closest('.vsplit') || e.target.closest('.vsplit2')) return true;
  
  // Координатный поиск: если мышь левее или правее центральной колонки битсов
  const bitsHead = document.querySelector('.h-bits');
  if (bitsHead) {
    const rect = bitsHead.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right) {
      return true; // Бросок в зону паттернов (левую или правую)
    }
  }
  return false; // Бросок в зону строк
}

/* Умный Drag & Drop файлов с подсветкой целевой колонки */
const canvasEl = document.querySelector(".canvas");
if (canvasEl) {
  canvasEl.addEventListener("dragover", e => {
    e.preventDefault();
    if (isOverPatternColumn(e)) {
      canvasEl.classList.add("drop-pats");
      canvasEl.classList.remove("drop-rows");
    } else {
      canvasEl.classList.add("drop-rows");
      canvasEl.classList.remove("drop-pats");
    }
  });

  canvasEl.addEventListener("dragleave", e => {
    e.preventDefault();
    canvasEl.classList.remove("drop-rows", "drop-pats");
  });

  canvasEl.addEventListener("drop", e => {
    e.preventDefault();
    const isPats = isOverPatternColumn(e);
    canvasEl.classList.remove("drop-rows", "drop-pats");
    
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      const file = e.dataTransfer.files[0];
      const reader = new FileReader();
      reader.onload = ev => {
        const lines = parseLines(ev.target.result);
        if (isPats) {
          st.tplPats = lines;
          say(`Паттерны из файла "${file.name}" загружены в текущую вкладку!`);
        } else {
          st.tplRows = lines;
          syncRowCountToTpl();
          say(`Строки из файла "${file.name}" загружены в текущую вкладку!`);
        }
        resetAll();
        saveCache();
      };
      reader.readAsText(file, "UTF-8");
    }
  });

  /* Ctrl+V над канвасом — тот же приём, что drag&drop файла выше, но из буфера обмена:
     целевая зона (строки в центре / паттерны слева-справа) определяется ПОСЛЕДНЕЙ известной
     позицией мыши над канвасом (у paste-события своих координат нет). Полная замена
     tplRows/tplPats, как при дропе — не точечная вставка по курсору внутри поля. */
  let lastCanvasMouseEvt = null;
  canvasEl.addEventListener("mousemove", e => { lastCanvasMouseEvt = e; });
  canvasEl.addEventListener("mouseleave", () => { lastCanvasMouseEvt = null; });

  document.addEventListener("paste", e => {
    const at = document.activeElement;
    if (at && (at.tagName === "INPUT" || at.tagName === "TEXTAREA" || at.isContentEditable)) return;
    if (!lastCanvasMouseEvt) return;
    const text = e.clipboardData && e.clipboardData.getData("text");
    if (!text) return;
    e.preventDefault();
    const isPats = isOverPatternColumn(lastCanvasMouseEvt);
    const lines = parseLines(text);
    if (isPats) {
      st.tplPats = lines;
      say("Паттерны вставлены из буфера обмена в текущую вкладку!");
    } else {
      st.tplRows = lines;
      syncRowCountToTpl();
      say("Строки вставлены из буфера обмена в текущую вкладку!");
    }
    resetAll();
    saveCache();
  });
}

/* === МАРКЕР 10.2: ВКЛАДКИ === */
/* Управление вкладками-цепочками — свой выпадающий список #chainDd/#chainDdList (см.
   renderTabs()). Тоггл открывает/закрывает список; клик по строке переключает вкладку; клик по
   "✕" в строке закрывает ИМЕННО эту вкладку (не обязательно текущую) — если закрывается НЕ
   активная, живые st.rows/st.pats текущей вкладки не трогаем, просто убираем запись из
   st.tabs и поправляем индекс активной, если она сдвинулась. Если закрывается активная —
   тот же путь, что раньше был у bCloseTab (splice + переход на соседнюю), но с
   loadTabState(idx, true): пропускаем saveActiveTabState(), иначе он попытался бы сохранить
   ЖИВЫЕ (ещё от закрываемой вкладки) st.rows поверх новой активной, испортив её данные. */
const chainDdToggleEl = document.getElementById("chainDdToggle");
const chainDdListEl = document.getElementById("chainDdList");
if (chainDdToggleEl && chainDdListEl) {
  chainDdToggleEl.onclick = (e) => {
    e.stopPropagation();
    chainDdListEl.classList.toggle("open");
  };
  chainDdListEl.addEventListener("click", e => {
    const miniBtn = e.target.closest(".chain-dd-mini");
    if (miniBtn) {
      e.stopPropagation();
      const idx = +miniBtn.dataset.idx;
      const act = miniBtn.dataset.act;
      if (act === "save") tabSaveChainData(idx);
      else if (act === "clear") tabClearChainData(idx);
      else if (act === "reset") tabResetChainData(idx);
      return;
    }
    const closeBtn = e.target.closest(".chain-dd-close");
    if (closeBtn) {
      e.stopPropagation();
      if (!st.tabs || st.tabs.length <= 1) return;
      const idx = +closeBtn.dataset.idx;
      const tabName = (st.tabs[idx] && st.tabs[idx].name) || "эту вкладку";
      if (!confirm(`Закрыть «${tabName}»? Все её строки и история шагов будут потеряны.`)) return;

      if (idx === st.activeTab) {
        st.tabs.splice(idx, 1);
        const newActive = Math.min(idx, st.tabs.length - 1);
        loadTabState(newActive, true);
      } else {
        st.tabs.splice(idx, 1);
        if (idx < st.activeTab) st.activeTab -= 1;
        renderTabs();
        saveCache();
      }
      return;
    }
    const item = e.target.closest(".chain-dd-item");
    if (!item) return;
    chainDdListEl.classList.remove("open");
    const idx = +item.dataset.idx;
    if (idx !== st.activeTab) loadTabState(idx);
  });
  document.addEventListener("click", e => {
    if (!chainDdListEl.classList.contains("open")) return;
    if (e.target.closest("#chainDd")) return;
    chainDdListEl.classList.remove("open");
  });
}

/* Глобальная 💾 в шапке — действует на ТЕКУЩУЮ активную вкладку, через ту же tabSaveChainData(),
   что и мини-кнопки в списке цепочек (единый источник правды — st.tabs[idx].savedChain,
   настройки вида/поиска сюда больше не входят).
   Отдельной кнопки "↩ Восстановить" больше нет — "↺ Сброс" (resetAll) и так уже сначала
   проверяет savedChain активной вкладки и восстанавливает из неё (см. resetAll()), так что
   "Восстановить" был точным дублем части поведения "Сброса", просто без отката к шаблону. */
const bSaveChainEl = document.getElementById("bSaveChain");
if (bSaveChainEl) {
  bSaveChainEl.onclick = () => tabSaveChainData(st.activeTab);
}

const bAddTabEl = document.getElementById("bAddTab");
if (bAddTabEl) {
  bAddTabEl.onclick = () => {
    saveActiveTabState();
    const newIdx = st.tabs.length;
    const newTab = createDefaultTabState("Цепочка " + (newIdx + 1));
    st.tabs.push(newTab);
    loadTabState(newIdx);
  };
}

const bClearTabEl = document.getElementById("bClearTab");
if (bClearTabEl) {
  bClearTabEl.onclick = () => clearActiveTab();
}

if (rowCountEl) {
  rowCountEl.oninput = () => {
    document.getElementById("rowCountVal").textContent = rowCountEl.value;
    resetAll();
    saveCache();
  };
}

/* Клик по шапке окошка сквозной строки/результата фон-поиска — свернуть/развернуть в одну строку */
const chainResultHeadEl = document.querySelector("#chainResultBox .chain-result-head");
if (chainResultHeadEl) {
  chainResultHeadEl.onclick = (e) => {
    if (e.target.closest("button") || e.target.closest(".overlay-drag") || e.target.closest(".overlay-close")) return;
    document.getElementById("chainResultBox").classList.toggle("collapsed");
  };
}

/* Клик по конкретной строке результата фон-поиска (#chainText .chain-result-line) —
   разворачивает именно эту строку целиком (снимает обрезку в одну линию) / сворачивает обратно.
   Не путать с кликом по шапке (chainResultHeadEl выше) — та сворачивает ВСЁ окошко целиком. */
const chainTextEl2 = document.getElementById("chainText");
if (chainTextEl2) {
  chainTextEl2.addEventListener("click", (e) => {
    const line = e.target.closest(".chain-result-line");
    if (!line) return;
    const mode = line.dataset.mode;
    if (bgResultExpanded.has(mode)) bgResultExpanded.delete(mode);
    else bgResultExpanded.add(mode);

  });
}

/* Стек overlay-баров (#chainResultBox/#stepLogBox) — раскладка и драг-обмен местами реализованы
   ниже, после loadLayout() (см. МАРКЕР 10.2b OVERLAY_STACK), т.к. используют overlayOrder,
   объявленную рядом с LAYOUT_KEY. */

/* Кнопка копирования сквозной строки результата */
const bCopyChainEl = document.getElementById("bCopyChain");
if (bCopyChainEl) {
  bCopyChainEl.onclick = () => {
    const fullChainText = (st.tailText || "") + buildChain(st, st.aIdx, st.bIdx).text;
    if (!fullChainText) { say("Сквозная строка пуста"); return; }
    copyTextToClipboard(fullChainText, "Сквозная строка скопирована!");
  };
}

/* Общий помощник копирования в буфер — сначала через Clipboard API, при неудаче/отсутствии
   (напр. страница открыта не по https) — через скрытый textarea + execCommand("copy"). */
function copyTextToClipboard(text, successMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      say(successMsg);
    }).catch(() => {
      copyFallback(text, successMsg);
    });
  } else {
    copyFallback(text, successMsg);
  }
}
function copyFallback(text, successMsg) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    say(successMsg || "Скопировано!");
  } catch(e) {
    say("Не удалось скопировать");
  }
  document.body.removeChild(ta);
}

/* Ctrl/Cmd+C — копирует ВЫДЕЛЕННЫЕ (кликом) строки как текст, каждая своя строка, с ведущими
   пробелами по текущему выравниванию (см. alignShift) — так же, как они стоят в таблице
   относительно самой длинной строки, чтобы при вставке в моноширинный текст биты остались
   визуально выровнены друг под другом. Срабатывает только если нет обычного текстового
   выделения (чтобы не перехватывать копирование текста, который пользователь выделил мышью
   вручную, например в окошке результата) и есть хотя бы одна выделенная строка. */
function copySelectedRows(){
  if (!st.selectedRows || st.selectedRows.size === 0) return;
  let maxLen = 0;
  for (const s of st.rows) if (s.length > maxLen) maxLen = s.length;
  const idxs = Array.from(st.selectedRows).sort((a, b) => a - b);
  const lines = idxs.map(i => {
    const s = getRowBits(st, i) || "";
    const shift = s.length ? alignShift(maxLen, s.length, st.align) : 0;
    return " ".repeat(shift) + s;
  });
  copyTextToClipboard(lines.join("\n"), `Скопировано строк: ${idxs.length}`);
}

/* Переключение режимов работы (выделение рамкой + перемещение кнопки "↩ Назад" слева от активной) */
function getModeParams(mode){
  switch(mode){
    case "step2":    return { pairOnly: true,  forceXor: false, isScan: false, isHorizXor: false, isXorProj: false };
    case "xor1":     return { pairOnly: false, forceXor: true,  isScan: false, isHorizXor: false, isXorProj: false };
    case "xor2":     return { pairOnly: true,  forceXor: true,  isScan: false, isHorizXor: false, isXorProj: false };
    case "scan":     return { pairOnly: false, forceXor: false, isScan: true,  isHorizXor: false, isXorProj: false };
    case "horiz_xor":return { pairOnly: false, forceXor: false, isScan: false, isHorizXor: true,  isXorProj: false };
    case "xor_proj": return { pairOnly: false, forceXor: false, isScan: false, isHorizXor: false, isXorProj: true  };
    default:         return { pairOnly: false, forceXor: false, isScan: false, isHorizXor: false, isXorProj: false };
  }
}

/* Последняя нажатая из 4 кнопок направления (◄ ► ▲ ▼ Спираль, см. st.lastDirMode) — взаимно
   исключающая подсветка (.mode-act) среди этих четырёх, И с обычными режимами-кнопками
   (STEP_MODE_BTN_IDS ниже — Шаг/Шаг2/XOR/XOR2/Гориз.XOR/Проекц.XOR/Скан): "Авто" повторяет
   только ОДНО из двух семейств одновременно (см. autoRun()), поэтому включение любого из них
   должно гасить подсветку другого. Явный выбор обычного режима (setMode() ниже) гасит эту, и
   наоборот — эта гасит подсветку обычных режимов (но не трогает сам st.mode: если потом опять
   нажать Шаг/XOR/и т.п., они возьмут её как есть). */
const DIR_MODE_BTN = { shiftL: "bShiftL", shiftR: "bShiftR", spiralUp: "bSpiralUp", spiralDown: "bSpiralDown" };
const STEP_MODE_BTN_IDS = ["bStep", "bStep2", "bStepXor", "bStep2Xor", "bStepHorizXor", "bStepXorProj", "bStepScan"];
function setLastDirMode(val){
  st.lastDirMode = val || null;
  st.xorSelectedMode = false;
  st.interleaveMode = false;
  Object.entries(DIR_MODE_BTN).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("mode-act", k === val);
  });
  if (val) STEP_MODE_BTN_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove("mode-act");
  });
}

function setMode(modeName){
  st.mode = modeName;
  // "XOR выдел" и "Интерливинг поиск" — одноразовые оверлей-режимы поверх обычного шага,
  // их флаги не сбрасываются автоматически по завершении. Если они остались висеть с
  // прошлого раза, autoRun() проверяет их РАНЬШЕ st.mode и уводит "Авто" в чужую логику
  // (например, ломая Гориз.XOR). При явном переключении режима — всегда гасим их (и заодно
  // "последнюю нажатую из 4 кнопок направления" — см. setLastDirMode()).
  st.xorSelectedMode = false;
  st.interleaveMode = false;
  if (st.lastDirMode) setLastDirMode(null);
  const modes = {
    "step1":     "bStep",
    "step2":     "bStep2",
    "xor1":      "bStepXor",
    "xor2":      "bStep2Xor",
    "horiz_xor": "bStepHorizXor",
    "xor_proj":  "bStepXorProj",
    "scan":      "bStepScan"
  };

  const undoBtn = document.getElementById("bUndo");

  Object.entries(modes).forEach(([m, id]) => {
    const el = document.getElementById(id);
    if (el) {
      if (m === modeName) {
        el.classList.add("mode-act");
        if (undoBtn) {
          undoBtn.style.top = (el.offsetTop + el.offsetHeight + 2) + "px";
          undoBtn.style.left = el.offsetLeft + "px";
        }
      } else {
        el.classList.remove("mode-act");
      }
    }
  });
}

function doModeStep(modeName){
  setMode(modeName);
  const { pairOnly, forceXor, isScan, isHorizXor, isXorProj } = getModeParams(modeName);
  step(pairOnly, forceXor, isScan, isHorizXor, isXorProj);
}

/* === МАРКЕР 10.2: СИСТЕМА ВКЛАДОК/ПАНЕЛЕЙ (перенесено из Zerkalius-gpu.html) ===
   Каждая вкладка — обёртка .menu-panel (panelWrap_<mid>), которая гуляет между тремя
   местами: закреплённая в доке (#leftSlot/#rightSlot), свёрнутая в выпадающее окно
   (.menu-drop с тем же id, что и mid) или плавающая на холсте (.floating-panel в body).
   Раскладка (что где закреплено/висит) сохраняется в localStorage отдельным ключом
   LAYOUT_KEY — не путать с CACHE_KEY (состояние цепочек). */
const MENUS = {
  /* flowGroup (Назад/Авто/Стоп) перенесён сюда же, ПЕРВЫМ в ids — по перечню в ids элементы
     реально appendChild'ятся в этом порядке (см. цикл ниже), так что flowGroup оказывается
     над opsGroup. Раньше жил в отдельной вкладке "Управление" (menuFlow) — вкладку убрали.
     Порядок записей в MENUS (и раскладка по умолчанию для СВЕЖЕЙ сессии, без сохранённого
     layout) — Шаги+Поиск слева, Вид+Правка строк справа, все 4 закреплены: панели одной зоны
     appendChild'ятся в том порядке, в котором идут тут (см. цикл for..in MENUS ниже), поэтому
     порядок пар menuOps/menuSearch и menuView/menuEdit в объекте важен. */
  menuOps:    { title: 'Шаги',         zone: 'leftSlot',  pin: true, ids: ['flowGroup', 'opsGroup'], floatable: true },
  menuSearch: { title: 'Поиск',        zone: 'leftSlot',  pin: true, ids: ['searchGroup'], floatable: true },
  menuView:   { title: 'Вид',          zone: 'rightSlot', pin: true, ids: ['viewGroup'],   floatable: true },
  menuEdit:   { title: 'Правка строк', zone: 'rightSlot', pin: true, ids: ['editGroup'],   floatable: true }
};
const LAYOUT_KEY = 'zerk_fold_layout';
/* Порядок стековых overlay-баров сверху вниз (см. МАРКЕР 10.2b OVERLAY_STACK ниже) —
   меняется только перетаскиванием за ручку ⋮⋮ в шапке, персистится вместе с остальной
   раскладкой (тот же LAYOUT_KEY). */
let overlayOrder = ['chainResultBox', 'stepLogBox'];
/* Полностью скрытые крестиком ✕ overlay-бары (в отличие от collapsed — тот просто сворачивает
   в строку-заголовок, а не убирает бар из вида совсем). Вернуть — только кнопками
   #bToggleResultBox/#bToggleStepLog в верхнем меню, см. МАРКЕР 10.2b OVERLAY_STACK. */
let overlayHidden = { chainResultBox: false, stepLogBox: false };

for (let mid in MENUS) {
  let m = MENUS[mid];
  let wrap = document.createElement('div'); wrap.className = 'menu-panel'; wrap.id = 'panelWrap_' + mid;
  if (m.floatable) wrap.dataset.floatable = '1';
  let head = document.createElement('div'); head.className = 'panel-head';
  head.innerHTML = '<span class="panel-drag" title="Перетащить панель' + (m.floatable ? ' — можно и на холст' : '') + '">⋮⋮</span><span class="panel-title">' + m.title + '</span><span class="panel-close" title="Скрыть панель">✕</span>';
  let closeBtn = head.querySelector('.panel-close');
  closeBtn.addEventListener('mousedown', e => e.stopPropagation());
  closeBtn.addEventListener('click', e => { e.stopPropagation(); hideTab(mid); });
  wrap.appendChild(head);
  m.ids.forEach(id => { let el = document.getElementById(id); if (el) wrap.appendChild(el); });
  m.wrapper = wrap;
}

function saveLayout() {
  let g = {};
  ['leftSlot', 'rightSlot'].forEach(z => Array.from(document.getElementById(z).children).forEach((el, i) => { if (el.id) g[el.id] = { z: z, i: i }; }));
  document.querySelectorAll('body > .floating-panel').forEach(el => { if (el.id) g[el.id] = { z: 'canvas', x: parseInt(el.style.left, 10) || 0, y: parseInt(el.style.top, 10) || 0 }; });
  let pins = {}; for (let m in MENUS) pins[m] = MENUS[m].pin;
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify({ pins: pins, groups: g, overlayOrder: overlayOrder, overlayHidden: overlayHidden })); } catch (e) {}
}

const SLOT_OF = { leftPanel: 'leftSlot', rightPanel: 'rightSlot' };
function pidUnderCursor(x, y, precise) {
  for (let pid in SLOT_OF) {
    let r = document.getElementById(pid).getBoundingClientRect();
    let hit = precise ? (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) : (x >= r.left && x <= r.right);
    if (hit) return pid;
  }
  return null;
}
function highlightDock(pid) {
  for (let p in SLOT_OF) document.getElementById(p).classList.toggle('drag-target', p === pid);
}
function placeInZone(zone, y) {
  let after = Array.from(zone.children).find(ch => { if (ch === draggedEl) return false; let r = ch.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (after) { if (after !== draggedEl.nextSibling) zone.insertBefore(draggedEl, after); }
  else if (zone.lastElementChild !== draggedEl) zone.appendChild(draggedEl);
}

let draggedEl = null, dragOffX = 0, dragOffY = 0;
function makeDraggable(handle, panel) {
  function start(clientX, clientY) {
    draggedEl = panel; panel.classList.add('dragging');
    let r = panel.getBoundingClientRect(); dragOffX = clientX - r.left; dragOffY = clientY - r.top;
    document.body.style.cursor = 'grabbing';
    for (let p in SLOT_OF) document.getElementById(p).classList.add('drop-zone-hint');
  }
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return; e.preventDefault(); e.stopPropagation();
    start(e.clientX, e.clientY);
  });
  handle.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return; e.preventDefault(); e.stopPropagation();
    start(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
}
function dragMove(clientX, clientY) {
  if (!draggedEl) return;
  let floatable = draggedEl.dataset.floatable === '1';
  let pid = pidUnderCursor(clientX, clientY, floatable);
  highlightDock(pid);
  let zone = pid ? document.getElementById(SLOT_OF[pid]) : null;
  if (floatable && !zone) {
    if (!draggedEl.classList.contains('floating-panel')) { draggedEl.classList.add('floating-panel'); document.body.appendChild(draggedEl); }
    draggedEl.style.left = Math.round(clientX - dragOffX) + 'px';
    draggedEl.style.top = Math.round(clientY - dragOffY) + 'px';
    return;
  }
  if (draggedEl.classList.contains('floating-panel')) { draggedEl.classList.remove('floating-panel'); draggedEl.style.left = ''; draggedEl.style.top = ''; }
  if (zone) placeInZone(zone, clientY);
}
function dragEnd() {
  if (!draggedEl) return;
  let mid = draggedEl.id.replace('panelWrap_', '');
  let zoneId = draggedEl.classList.contains('floating-panel') ? 'canvas' : (draggedEl.parentElement && draggedEl.parentElement.id);
  if (MENUS[mid]) {
    MENUS[mid].zone = zoneId;
    if ((zoneId === 'leftSlot' || zoneId === 'rightSlot') && !MENUS[mid].pin) {
      MENUS[mid].pin = true;
      let cb = document.getElementById(mid + 'Pin'); if (cb) cb.checked = true;
      let btn = document.querySelector('.menu-btn[data-menu="' + mid + '"]');
      if (btn) btn.classList.add('pinned');
      closeMenus();
    }
  }
  draggedEl.classList.remove('dragging'); draggedEl = null; saveLayout();
  document.body.style.cursor = '';
  highlightDock(null);
  for (let p in SLOT_OF) document.getElementById(p).classList.remove('drop-zone-hint');
  // Раньше звали только при ПЕРВОМ закреплении (внутри условия выше) — перетаскивание УЖЕ
  // закреплённой вкладки между левым/правым доком меняло занятость доков, но dock-empty (и,
  // следовательно, отступы #chainResultBox от них) не пересчитывались. Зовём всегда.
  updateDockVisibility(); updateToggleAllPinsBtn();
}
window.addEventListener('mousemove', e => dragMove(e.clientX, e.clientY));
window.addEventListener('mouseup', dragEnd);
window.addEventListener('touchmove', e => {
  if (!draggedEl || !e.touches.length) return;
  e.preventDefault();
  dragMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
window.addEventListener('touchend', dragEnd);
window.addEventListener('touchcancel', dragEnd);

for (let mid in MENUS) makeDraggable(MENUS[mid].wrapper.querySelector('.panel-head'), MENUS[mid].wrapper);

function applyMenu(mid) {
  let m = MENUS[mid], drop = document.getElementById(mid);
  let floating = m.wrapper.classList.contains('floating-panel');
  if (m.pin) {
    if (!floating) (document.getElementById(m.zone) || document.getElementById('leftSlot')).appendChild(m.wrapper);
  } else {
    if (floating) { m.wrapper.classList.remove('floating-panel'); m.wrapper.style.left = ''; m.wrapper.style.top = ''; floating = false; }
    drop.appendChild(m.wrapper);
  }
  let btn = document.querySelector('.menu-btn[data-menu="' + mid + '"]');
  if (btn) btn.classList.toggle('pinned', m.pin || floating);
  updateDockVisibility();
}
function hideTab(mid) {
  let m = MENUS[mid]; if (!m) return;
  m.pin = false;
  let cb = document.getElementById(mid + 'Pin'); if (cb) cb.checked = false;
  applyMenu(mid); closeMenus(); saveLayout(); updateToggleAllPinsBtn();
}
function isTabVisible(mid) {
  let m = MENUS[mid];
  return !!(m && (m.pin || m.wrapper.classList.contains('floating-panel')));
}
function updateDockVisibility() {
  ['leftPanel', 'rightPanel'].forEach(pid => {
    let p = document.getElementById(pid);
    p.classList.toggle('dock-empty', !p.querySelector('.menu-panel'));
  });
  updateResultBoxInset();
}

/* Бар #chainResultBox раньше просто перекрывал закреплённые слева/справа вкладки меню
   (высокий z-index). Теперь вместо перекрытия — подвигается: если в доке реально есть
   закреплённая панель (не dock-empty), бар отступает от него на его ширину (--side-w), а не
   рисуется поверх её кнопок.
   +12px было рассчитано на СТАРОЕ положение панелей (left/right:6px от края экрана + 6px
   зазор до бара). После того как у панелей убрали внешний отступ (left/right:0 — панели
   вплотную к краю), формула не пересчиталась и зазор стал вдвое больше нужного — теперь
   просто ширина панели + 6px зазора. */
function updateResultBoxInset() {
  const leftPanel = document.getElementById('leftPanel');
  const rightPanel = document.getElementById('rightPanel');
  if (!leftPanel || !rightPanel) return;
  const left = leftPanel.classList.contains('dock-empty') ? '6px' : 'calc(var(--side-w) + 6px)';
  const right = rightPanel.classList.contains('dock-empty') ? '6px' : 'calc(var(--side-w) + 6px)';
  document.querySelectorAll('.overlay-box').forEach(box => { box.style.left = left; box.style.right = right; });
}

for (let mid in MENUS) {
  let cb = document.getElementById(mid + 'Pin'); cb.checked = MENUS[mid].pin;
  cb.addEventListener('mousedown', e => e.stopPropagation());
  cb.addEventListener('click', e => e.stopPropagation());
  cb.addEventListener('change', () => { MENUS[mid].pin = cb.checked; applyMenu(mid); saveLayout(); updateToggleAllPinsBtn(); });
}

function updateToggleAllPinsBtn() {
  let allOn = Object.keys(MENUS).every(mid => isTabVisible(mid));
  let bar = document.getElementById('toggleAllPinsBtn');
  bar.classList.toggle('all-on', allOn);
  bar.title = allOn ? 'Скрыть все панели' : 'Показать все панели';
}
document.getElementById('toggleAllPinsBtn').addEventListener('click', () => {
  let turnOn = !Object.keys(MENUS).every(mid => isTabVisible(mid));
  for (let mid in MENUS) {
    MENUS[mid].pin = turnOn;
    let cb = document.getElementById(mid + 'Pin'); if (cb) cb.checked = turnOn;
    applyMenu(mid);
  }
  saveLayout();
  updateToggleAllPinsBtn();
});

(function loadLayout() {
  let raw = null; try { raw = localStorage.getItem(LAYOUT_KEY); } catch (e) {}
  let L = null; if (raw) { try { L = JSON.parse(raw); } catch (e) {} }
  if (L && Array.isArray(L.overlayOrder) && L.overlayOrder.length === overlayOrder.length
      && overlayOrder.every(id => L.overlayOrder.includes(id))) {
    overlayOrder = L.overlayOrder;
  }
  if (L && L.overlayHidden) {
    for (let id in overlayHidden) if (L.overlayHidden[id] !== undefined) overlayHidden[id] = !!L.overlayHidden[id];
  }
  if (L && L.pins) for (let m in MENUS) if (L.pins[m] !== undefined) { MENUS[m].pin = !!L.pins[m]; let cb = document.getElementById(m + 'Pin'); if (cb) cb.checked = MENUS[m].pin; }
  if (L && L.groups) for (let m in MENUS) { let wid = 'panelWrap_' + m; if (MENUS[m].pin && L.groups[wid] && L.groups[wid].z !== 'canvas') MENUS[m].zone = L.groups[wid].z; }
  for (let m in MENUS) applyMenu(m);

  if (L && L.groups) {
    let list = Object.keys(L.groups).map(id => ({ id: id, z: L.groups[id].z, i: L.groups[id].i, x: L.groups[id].x, y: L.groups[id].y })).sort((a, b) => (a.i || 0) - (b.i || 0));
    list.forEach(it => {
      let el = document.getElementById(it.id); if (!el) return;
      if (it.z === 'canvas' && el.dataset.floatable === '1') {
        el.classList.add('floating-panel'); document.body.appendChild(el);
        el.style.left = Math.max(0, Math.min(window.innerWidth - 40, it.x || 20)) + 'px';
        el.style.top = Math.max(0, Math.min(window.innerHeight - 40, it.y || 20)) + 'px';
        return;
      }
      let z = document.getElementById(it.z);
      if (z && el.parentElement === z) z.appendChild(el);
    });
  }
  updateToggleAllPinsBtn();
})();

/* === МАРКЕР 10.2b: OVERLAY_STACK === */
/* Стек overlay-баров #chainResultBox/#stepLogBox: раскладывает их друг под другом по текущему
   overlayOrder (top в px, вычисляется от суммы высот предыдущих + зазор), держит --result-box-h
   в актуальном виде (сумма высот обеих + зазор между ними), чтобы .canvas резервировал верхний
   отступ (padding-top: calc(6px + var(--result-box-h))) и строки таблицы не уезжали под бары. */
const OVERLAY_GAP = 6;
function layoutOverlayBoxes(){
  // Скрытые (✕, overlayHidden) полностью выпадают из стопки — ни места, ни зазора после них.
  const visible = overlayOrder.filter(id => !overlayHidden[id]);
  let top = 6, stackH = 0;
  visible.forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.top = top + 'px';
    const h = el.offsetHeight;
    top += h + OVERLAY_GAP;
    stackH += h + (i < visible.length - 1 ? OVERLAY_GAP : 0);
  });
  document.documentElement.style.setProperty('--result-box-h', stackH + 'px');
}
function setOverlayHidden(id, hidden){
  overlayHidden[id] = hidden;
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden', hidden);
  const btnId = id === 'chainResultBox' ? 'bToggleResultBox' : 'bToggleStepLog';
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.toggle('mode-act', hidden);
  layoutOverlayBoxes();
  saveLayout();
}
for (let id in overlayHidden) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden', overlayHidden[id]);

/* === МАРКЕР 10.3: ЛОГИКА СДВИГА И ХОТКЕИ === */
document.getElementById("rows").onclick = e => {
  // Игнорируем клики по текстовым полям редактирования
  if (e.target.tagName === "INPUT" || e.target.closest(".edit-row-input")) return;
  // Протяжка мышью (см. ниже) уже выставила диапазон выделения сама — обычный click,
  // который браузер шлёт следом за mouseup, не должен схлопывать его обратно к одной строке.
  if (rowDragMoved) return;
  // Двойной клик (вход в ручную правку строки, см. dblclick ниже) технически шлёт ДВА click
  // подряд по той же строке — второй (e.detail===2) иначе попадал в ветку "повторный клик по
  // уже выделенной строке -> снять выделение" и стирал выделение ДО открытия поля правки, из-за
  // чего фоновый поиск (завязан на выделенную строку) переставал видеть контекст. Второй и
  // последующие клики серии игнорируем — выделение трогает только одиночный клик.
  if (e.detail > 1) return;

  const ln = e.target.closest(".ln");
  if (!ln) return;

  const idx = +ln.dataset.idx;
  if (isNaN(idx)) return;

  if (!st.selectedRows) st.selectedRows = new Set();

  if (e.ctrlKey || e.metaKey) {
    if (st.selectedRows.has(idx)) st.selectedRows.delete(idx);
    else st.selectedRows.add(idx);
  } else {
    if (st.selectedRows.size === 1 && st.selectedRows.has(idx)) {
      st.selectedRows.clear();
    } else {
      st.selectedRows.clear();
      st.selectedRows.add(idx);
    }
  }
  render();
  saveCache();
};

/* Выделение НЕСКОЛЬКИХ строк протяжкой мыши (зажать и провести по строкам). Обычный клик
   без движения по-прежнему обрабатывается выше (.onclick) — сюда попадает только реальный
   драг: mousedown запоминает строку-якорь, mousemove по другим строкам красит диапазон
   [якорь..курсор] целиком, mouseup фиксирует. Ctrl/Cmd+клик оставлен как раньше — точечное
   добавление/снятие одной строки без протяжки. */
let rowDragAnchor = null, rowDragMoved = false;
document.getElementById("rows").addEventListener("mousedown", e => {
  if (e.target.tagName === "INPUT" || e.target.closest(".edit-row-input")) return;
  if (e.ctrlKey || e.metaKey || e.button !== 0) return;
  const ln = e.target.closest(".ln");
  if (!ln) return;
  const idx = +ln.dataset.idx;
  if (isNaN(idx)) return;
  rowDragAnchor = idx;
  rowDragMoved = false;
});
document.getElementById("rows").addEventListener("mousemove", e => {
  if (rowDragAnchor === null || !(e.buttons & 1)) return;
  const ln = e.target.closest(".ln");
  if (!ln) return;
  const idx = +ln.dataset.idx;
  if (isNaN(idx) || (idx === rowDragAnchor && !rowDragMoved)) return;
  rowDragMoved = true;
  const lo = Math.min(rowDragAnchor, idx), hi = Math.max(rowDragAnchor, idx);
  st.selectedRows = new Set();
  for (let i = lo; i <= hi; i++) st.selectedRows.add(i);
  render();
});
window.addEventListener("mouseup", () => {
  if (rowDragAnchor === null) return;
  if (rowDragMoved) saveCache();
  rowDragAnchor = null;
  setTimeout(() => { rowDragMoved = false; }, 0);
});

/* Режим РУЧНОГО РЕДАКТИРОВАНИЯ строки — вызывается и по двойному клику, и по клавише F2,
   когда выделена ровно одна строка (см. глобальный обработчик хоткеев ниже). */
function startEditRow(idx){
  const ln = document.getElementById("rows").querySelector('.ln[data-idx="' + idx + '"]');
  if (!ln) return;
  if (ln.querySelector(".edit-row-input")) return;

  const bitsContainer = ln.querySelector(".bits");
  if (!bitsContainer) return;

  const currentText = st.rows[idx] || "";
  let alignCls = "center";
  if (st.align === "left") alignCls = "left";
  if (st.align === "right") alignCls = "right";

  // Создаем инпут
  const inp = document.createElement("input");
  inp.type = "text";
  inp.className = "edit-row-input";
  inp.style.textAlign = alignCls;
  inp.value = currentText;

  // Очищаем текущие биты и вставляем поле ввода
  bitsContainer.innerHTML = "";
  bitsContainer.appendChild(inp);

  // ПОЛНАЯ ИЗОЛЯЦИЯ: предотвращаем всплытие кликов по инпуту до контейнера rows
  const stopProp = ev => ev.stopPropagation();
  inp.addEventListener("click", stopProp);
  inp.addEventListener("mousedown", stopProp);
  inp.addEventListener("mouseup", stopProp);
  inp.addEventListener("dblclick", stopProp);

  let isFinished = false;
  const finishEdit = (save) => {
    if (isFinished) return;
    isFinished = true;
    if (save && inp.value !== currentText) {
      snapshot(); // Сохраняем историю для отката (Undo / Ctrl+Z)
      st.rows[idx] = inp.value.trim();
    }
    render();
    saveCache();
  };

  // Потеря фокуса (клик мимо инпута) -> сохранение
  inp.addEventListener("blur", () => finishEdit(true));

  // Перехват Enter и Escape внутри инпута
  inp.addEventListener("keydown", ev => {
    ev.stopPropagation(); // Не пускаем Enter / Esc / Ctrl+Z в глобальные хоткеи!
    if (ev.key === "Enter") {
      ev.preventDefault();
      finishEdit(true);
    } else if (ev.key === "Escape") {
      ev.preventDefault();
      finishEdit(false);
    }
  });

  // Устанавливаем фокус и выделяем весь текст
  setTimeout(() => {
    inp.focus();
    inp.select();
  }, 20);
}

/* Двойной клик по строке — режим РУЧНОГО РЕДАКТИРОВАНИЯ */

/* Фоновый поиск: выделенная строка ФИКСИРОВАНА (не двигается сама, в отличие от doInterleaveStep/
   doXorSelectedStep) — при каждом render() пересчитывает результат (интерлив / XOR пары / XOR
   всех выше+выделенной, где пара всегда — строка над выделенной + сама выделенная) и сверяет
   его с паттерном строки НИЖЕ выделенной. Возвращает { targetIdx, matched } — targetIdx нужен,
   чтобы подсветить ЧТО ищем, ещё до совпадения; matched — найдено ли оно уже. null — если фон
   выключен или выделения/цели нет. Ничего не останавливает и не переключает, только подсветка. */
function computeBgSearchTarget(){
  if (!st.bgSearch) return null;
  if (!st.selectedRows || st.selectedRows.size === 0) return null;
  // Если выделено несколько строк — ориентир самая НИЖНЯЯ (largest index), а не верхняя.
  const selIdx = Math.max(...st.selectedRows);
  if (selIdx <= 0) return null;
  const targetIdx = selIdx + 1;
  if (targetIdx >= st.rows.length) return null;
  const pat = st.pats[targetIdx];
  if (!pat || !pat.text) return null;

  const rowAbove = getRowBits(st, selIdx - 1);
  const rowSel = getRowBits(st, selIdx);
  const modes = (st.bgSearchModes && st.bgSearchModes.length) ? st.bgSearchModes : ["interleave"];
  const results = modes.map(mode => {
    let result;
    if (mode === "xor2") {
      result = xorPair(rowAbove, rowSel, st.align);
    } else if (mode === "xorAll") {
      result = xorRowsDownTo(st.rows, selIdx, st.align, st);
    } else if (mode === "concatR") {
      result = concatRowsDownTo(st, selIdx, "right");
    } else if (mode === "concatL") {
      result = concatRowsDownTo(st, selIdx, "left");
    } else if (mode === "vertR") {
      result = concatVerticalDownTo(st, selIdx, "right");
    } else if (mode === "vertL") {
      result = concatVerticalDownTo(st, selIdx, "left");
    } else if (mode === "snakeR") {
      result = concatSnakeDownTo(st, selIdx, "right");
    } else if (mode === "snakeL") {
      result = concatSnakeDownTo(st, selIdx, "left");
    } else {
      result = interleavePair(rowAbove, rowSel, st.align);
    }
    const kinds = findPatternKinds(result, pat.text);
    return { mode, result, matched: kinds.length > 0, kinds, tried: kinds.tried };
  });
  return { targetIdx, results, matched: results.some(r => r.matched) };
}

/* === "Спираль": строки в диапазоне (см. colSelectRowRange — весь список, либо от начала до
   выделенной строки, либо между двумя крайними выделенными) читаются ОДНОЙ непрерывной лентой
   символов сверху вниз, сдвигаются по кругу на 1 символ (перенос с одного конца ленты на
   другой), затем нарезаются обратно по ИСХОДНЫМ длинам строк — портировано 1:1 из
   manualElkaShift() в Zerkalius-genezis.html (dir=-1 — влево по ленте: первый символ уходит в
   конец; dir=1 — вправо: последний символ встаёт в начало). */
/* silent=true (см. autoRun()/st.lastDirMode) — пропускает свои snapshot()/render()/saveCache(),
   вызывающий код сам берёт snapshot один раз ДО цикла и render/saveCache раз в кадр, а не на
   каждый отдельный шаг. Возвращает true/false — сделан ли реально шаг (буфер меньше 2 символов/
   нет строк — false, стоп). */
function spiralStep(dir, silent){
  const n = st.rows.length;
  if (!n) return false;
  const range = colSelectRowRange();
  const lo = Math.max(0, range.lo);
  const hi = Math.min(n - 1, range.hi === Infinity ? n - 1 : range.hi);
  if (hi < lo) return false;

  const rowLengths = [];
  let buffer = [];
  for (let i = lo; i <= hi; i++) {
    const s = st.rows[i] || "";
    rowLengths.push(s.length);
    buffer = buffer.concat(s.split(""));
  }
  if (buffer.length <= 1) return false;

  if (!silent) snapshot();
  if (dir === 1) {
    const last = buffer.pop();
    buffer.unshift(last);
  } else {
    const first = buffer.shift();
    buffer.push(first);
  }

  let ptr = 0;
  for (let k = 0; k < rowLengths.length; k++) {
    const len = rowLengths[k];
    st.rows[lo + k] = buffer.slice(ptr, ptr + len).join("");
    ptr += len;
  }
  if (!silent) { render(); saveCache(); }
  return true;
}
function spiralMove(vDir, silent){
  // "право" по ленте — это "вверх", если переключатель на "right"; иначе — наоборот.
  const rightIsUp = st.spiralUpDir === "right";
  const dir = (vDir === "up") === rightIsUp ? 1 : -1;
  return spiralStep(dir, silent);
}
const bSpiralUpEl = document.getElementById("bSpiralUp");
if (bSpiralUpEl) bSpiralUpEl.onclick = () => { setLastDirMode("spiralUp"); spiralMove("up"); };
const bSpiralDownEl = document.getElementById("bSpiralDown");
if (bSpiralDownEl) bSpiralDownEl.onclick = () => { setLastDirMode("spiralDown"); spiralMove("down"); };

function step(pairOnly, forceXor = false, isScan = false, isHorizXor = false, isXorProj = false){
  readToggles();
  if (!doStep(pairOnly, forceXor, isScan, isHorizXor, isXorProj)) say("Шаг не выполнен: двигаться некуда.");
  else say("");
  render();
  saveCache();
}

function autoRun(){
  readToggles();
  st.running = true;
  setAutoBtnState(true);

  // Последняя нажатая из 4 кнопок направления (◄ ► ▲ ▼ Спираль, см. st.lastDirMode/
  // setLastDirMode()) — "Авто" повторяет именно её, пока не найдётся стоп-условие (нечего
  // больше сдвигать, ИЛИ фон-поиск нашёл совпадение при включённом "Стоп на находке") или
  // пользователь не нажмёт ⏹ Стоп. snapshot() один раз ДО цикла — Undo одним кликом откатывает
  // весь прогон целиком, а не по шагу.
  if (st.lastDirMode) {
    const isShift = st.lastDirMode === "shiftL" || st.lastDirMode === "shiftR";
    const dirLabel = { shiftL: "◄", shiftR: "►", spiralUp: "▲ Спираль", spiralDown: "▼ Спираль" }[st.lastDirMode];
    snapshot();

    // Общее число вариантов ДО старта: круговой сдвиг строки длины L возвращает её к исходному
    // виду ровно через L сдвигов (берём максимум среди сдвигаемых строк); у спирали — через
    // buffer.length шагов (вся лента диапазона целиком). РАНЬШЕ тут вообще не считалось —
    // ◄/►/▲/▼ крутились БЕСКОНЕЧНО, пока не нажмёшь Стоп, даже если весь цикл вариантов давно
    // пройден без находки.
    let totalTurns = 0;
    if (isShift) {
      const idxs0 = (st.selectedRows && st.selectedRows.size > 0) ? Array.from(st.selectedRows) : st.rows.map((_, i) => i);
      for (const i of idxs0) if (st.rows[i] && st.rows[i].length > totalTurns) totalTurns = st.rows[i].length;
    } else {
      const range = colSelectRowRange();
      const lo = Math.max(0, range.lo);
      const hi = Math.min(st.rows.length - 1, range.hi === Infinity ? st.rows.length - 1 : range.hi);
      for (let i = lo; i <= hi; i++) totalTurns += (st.rows[i] || "").length;
    }
    let turns = 0;

    const tick = () => {
      if (!st.running) return finishAuto();

      const t0 = performance.now();
      let moved = true;
      let bgHit = null;
      let cycleDone = false;
      while (performance.now() - t0 < 12) {
        if (totalTurns > 0 && turns >= totalTurns) { cycleDone = true; break; }
        if (isShift) {
          const idxs = (st.selectedRows && st.selectedRows.size > 0) ? Array.from(st.selectedRows) : st.rows.map((_, i) => i);
          if (idxs.length === 0 || !idxs.some(i => st.rows[i])) { moved = false; break; }
          for (const i of idxs) if (st.rows[i]) st.rows[i] = st.lastDirMode === "shiftL" ? rotateStrLeft(st.rows[i]) : rotateStrRight(st.rows[i]);
        } else {
          moved = spiralMove(st.lastDirMode === "spiralUp" ? "up" : "down", true);
          if (!moved) break;
        }
        turns++;

        const bgInfo = computeBgSearchTarget();
        if (st.stopOnHit && bgInfo && bgInfo.matched) { bgHit = bgInfo; break; }
      }

      say(`Авто (${dirLabel}): вариант ${turns}` + (totalTurns ? ` из ${totalTurns}` : ""));
      render(); saveCache();
      if (bgHit) {
        st.selectedRows.add(bgHit.targetIdx);
        return finishAuto(`🎯 Авто (${dirLabel}): найдено совпадение на строке ${bgHit.targetIdx + 1}!`);
      }
      if (cycleDone) return finishAuto(`Авто (${dirLabel}) остановлен: полный цикл вариантов (${turns} из ${totalTurns}) пройден, совпадений не найдено.`);
      if (!moved) return finishAuto(`Авто (${dirLabel}) остановлен: больше нечего сдвигать.`);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return;
  }

  if (st.xorSelectedMode) {
    const tick = () => {
      if (!st.running) return finishAuto();

      const t0 = performance.now();
      let stepsCount = 0;
      while (performance.now() - t0 < 12) {
        if (!doXorSelectedStep()) {
          return finishAuto(`Режим XOR выдел завершен (выполнено ${stepsCount} сдвигов).`);
        }
        stepsCount++;
      }

      render();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return;
  }

  if (st.interleaveMode) {
    const tick = () => {
      if (!st.running) return finishAuto();

      const t0 = performance.now();
      let stepsCount = 0;
      while (performance.now() - t0 < 12) {
        if (!doInterleaveStep()) {
          return finishAuto(`Режим Интерливинг завершен (выполнено ${stepsCount} шагов).`);
        }
        stepsCount++;
      }

      render();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return;
  }

  const { pairOnly, forceXor, isScan, isHorizXor, isXorProj } = getModeParams(st.mode || "step1");

  const tick = () => {
    if (!st.running) return finishAuto();

    // Оптимизация 4: Time-based батчинг
    const t0 = performance.now();
    let stepsCount = 0;
    while (performance.now() - t0 < 12) {
      if (!doStep(pairOnly, forceXor, isScan, isHorizXor, isXorProj)) {
        return finishAuto(`Прогон завершен: двигаться некуда (выполнено ${stepsCount} ш. в посл. кадре).`);
      }

      // Авто-остановка на находке (не применяется к Гориз.XOR — там находка не прерывает
      // проход, доходить до конца строки/цепочки решает сам doStep)
      if (st.stopOnHit && st.hit && !isHorizXor) {
        return finishAuto(`🎯 Найдено совпадение! Авто-прогон остановлен.`);
      }

      stepsCount++;
    }

    render();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function finishAuto(m){
  st.running = false;
  setAutoBtnState(false);
  render();
  saveCache();
  if (m) say(m);
}

/* Удаление выделенных (кликом) строк — отдельная операция, НЕ связанная с откатом шага.
   Вызывается клавишей Delete (см. глобальные хоткеи ниже). Шаблон (tplRows/tplPats — то,
   что было закинуто дропом изначально) НЕ трогаем: удаление затрагивает только текущую
   рабочую копию, чтобы "Сброс" всегда мог вернуть исходные строки как они были при первой
   загрузке, независимо от последующих ручных удалений/сдвигов/правок. */
function deleteSelectedRows(){
  if (!st.selectedRows || st.selectedRows.size === 0) { say("Выделите строку кликом."); return; }
  snapshot();
  const selected = Array.from(st.selectedRows).sort((a, b) => b - a);
  for (const idx of selected) {
    st.rows.splice(idx, 1);
    st.pats.splice(idx, 1);
    st.used.splice(idx, 1);
  }
  st.selectedRows.clear();
  render(); saveCache();
  say(`Удалено ${selected.length} строк(и).`);
}

/* Очищает содержимое ВСЕХ строк цепочки, оставляя только 1-ю строку = "1" — точка старта
   для генерации Гориз.XOR (см. isHorizXor в doStep: если ниже нет строки, но паттерн там
   есть, строка генерируется автоматически). ТЕКСТ паттернов (st.pats[].text/tplPats) не
   трогаем — они остаются целью, под которую генерация подбирает содержимое. Но флаг
   "найдено" (p.found) ОБЯЗАТЕЛЬНО сбрасываем — иначе генерация видит паттерны уже
   отмеченными найденными с прошлого прогона и просто пропускает их (ничего не вставляя). */
const bClearChainRowsEl = document.getElementById("bClearChainRows");
if (bClearChainRowsEl) {
  bClearChainRowsEl.onclick = () => {
    snapshot();
    // st.rows может быть КОРОЧЕ st.pats (например, вкладка была создана до загрузки строк,
    // а паттерны заданы отдельно) — расширяем rows/tplRows до длины паттернов, иначе
    // цикл ниже по пустому массиву ничего не делает и строка 1 физически не создаётся.
    const targetLen = Math.max(st.rows.length, st.pats.length, 1);
    for (let i = 0; i < targetLen; i++) {
      st.rows[i] = (i === 0) ? "1" : "";
      st.tplRows[i] = st.rows[i];
    }
    st.used = st.rows.map(() => false);
    for (const p of st.pats) {
      if (p) { p.found = false; p.kind = null; p.step = null; }
    }
    // Восстанавливаем исходный порядок паттернов (до всех "подтягиваний" наверх)
    st.pats.sort((a, b) => (a ? a.ord : 0) - (b ? b.ord : 0));
    st.step = 0; st.tailBuffer = ""; st.hit = null;
    st.horizXoredLength = 0; st.horizChainLen = 0; st.lastHorizRow = null;
    st.horizFoundInPass = false;
    st.horizBigChain = ""; st.horizBigOrig = ""; st.horizBigTargetIdx = -1;
    st.aIdx = 0; st.bIdx = 0;
    render(); saveCache();
    say("Цепочка очищена: строка 1 = '1', паттерны разморожены.");
  };
}

/* Генератор фрактала Серпинского по кнопке (тот же generateSierpinski90, что и при пустом
   кэше при первом запуске) — заменяет ТЕКУЩУЮ цепочку и паттерны на N строк из поля рядом. */
const bGenSierpinskiEl = document.getElementById("bGenSierpinski");
const sierpinskiNEl = document.getElementById("sierpinskiN");
if (bGenSierpinskiEl) {
  bGenSierpinskiEl.onclick = () => {
    const n = Math.max(2, Math.min(2048, +(sierpinskiNEl ? sierpinskiNEl.value : 128) || 128));
    snapshot();
    const s90 = generateSierpinski90(n);
    st.tplRows = s90;
    st.tplPats = s90.slice();
    st.rows = s90.slice();
    st.used = st.rows.map(() => false);
    st.pats = st.tplPats.map((t, i) => ({ text: t, ord: i, found: false, kind: null, step: null }));
    st.selectedRows = new Set();
    st.step = 0; st.passCount = 0; st.tailBuffer = "";
    st.aIdx = 0; st.bIdx = 1; st.goingUp = false; st.hit = null;
    const rowCountEl = document.getElementById("rowCount");
    if (rowCountEl) {
      rowCountEl.max = n;
      rowCountEl.value = n;
      const rcVal = document.getElementById("rowCountVal");
      if (rcVal) rcVal.textContent = n;
    }
    render(); saveCache();
    say(`Сгенерирован фрактал Серпинского: ${n} строк.`);
  };
}

    if (!st.selectedRows || st.selectedRows.size === 0) { say("Выделите строку кликом."); return; }
    snapshot();
    // При нескольких выделенных строках цель длины — одна для всех: самая длинная
    // из выделенных (а не каждая своя), иначе более короткая выделенная строка
    // ограничивала бы дополнение строк над ней.
    let len = 0;
    for (const selIdx of st.selectedRows) if (st.rows[selIdx] && st.rows[selIdx].length > len) len = st.rows[selIdx].length;
    for (const selIdx of st.selectedRows) {
      if (!st.rows[selIdx]) continue;
      for (let i = 0; i < selIdx; i++) {
        const rowLen = st.rows[i].length;
        if (rowLen < len) {
          const shift = alignShift(len, rowLen, st.align);
          // Math.max(0, …) — см. комментарий у padToLen() в doStep(): у "лесенки" остаток
          // паддинга справа может уйти в минус.
          st.rows[i] = "0".repeat(shift) + st.rows[i] + "0".repeat(Math.max(0, len - rowLen - shift));
        }
      }
    }
    render(); saveCache();
  };
}

/* Тетрис: 1-биты строки НАД выделенной "падают" в неё — в её 0-пустоты. Каждый клик делает
   РОВНО ОДНО из следующих действий (все — отдельными кликами, ничего не объединяется):
   1) Не влезает как есть — КРУТИТ выделенную строку круговым сдвигом (вправо, как и остальные
      ручные сдвиги ◄/►), перебирая повороты, пока не найдётся подходящий (клик).
   1б) Ни один поворот не подошёл — ИНВЕРТИРУЕТ (0↔1) падающую строку (строку НАД выделенной,
      видно в таблице; сама выделенная НЕ инвертируется), и ТОЛЬКО это — без попытки в этом же
      клике сразу подобрать поворот (клик). Инверсия применяется БЕЗУСЛОВНО, даже если сама по
      себе ещё не даёт fit — клик никогда не "проваливается в никуда". Поворот выделенной (если
      после инверсии он всё же нужен) подбирается уже НА СЛЕДУЮЩЕМ клике — тот заново заходит в
      шаг 1, теперь уже с инвертированной падающей. Если и с инвертированной ни один поворот не
      подошёл — очередной клик в этом тупике снова инвертирует падающую (переключение туда-
      обратно), пока пользователь не подберёт совпадение сам (например, покрутив выделенную
      вручную ◄/► между нажатиями).
   2) Уже влезает как есть (сразу либо после поворота/инверсии на одном из прошлых кликов) —
      ПАДЕНИЕ: выделенная получает 1-биты падающей (в её 0-пустотах), строка сверху гасит ВСЕ
      свои биты, что были 1 (и упали), в 0 (какие были 0 — так и остаются), длина не меняется.
      Переход выделения на строку ниже — НЕ в этом же клике (клик).
   3) Строка только что приняла падение (см. tetrisPendingAdvance) — клик ТОЛЬКО переводит
      выделение на строку НИЖЕ (selIdx+1, если она есть), без изменения битов — чтобы тетрис
      можно было продолжать вниз по таблице, просто повторяя клики.
   Строки НИКОГДА не удаляются и не сдвигаются — ни на каком шаге, ни при каком исходе слияния
   (в т.ч. если выделенная стала целиком из единиц). Кроме tetrisPendingAdvance (нужен именно
   для разделения шагов 2 и 3) функция не хранит своего состояния — она каждый раз проверяет
   текущий факт "влезает ли падающая в выделенную КАК ЕСТЬ", поэтому шаг 1/1б на СЛЕДУЮЩЕМ клике
   сам собой приводит ко входу в шаг 2.
   Падающая строка ДЛИННЕЕ выделенной — сразу не влезает ни при каком повороте (лишним битам
   падающей просто некуда падать) — это отдельная проверка перед циклом поворотов, а не то же
   самое "не нашлось поворота". st.pats и st.used не трогаются вообще — они на строки никак
   не завязаны в этой функции. */
/* Строки в таблице визуально выровнены (⇤/↔/⇥) относительно ОБЩЕЙ самой длинной строки —
   короткая строка не начинается с raw-индекса 0 на экране, если align не "left" (см.
   alignShift()/render()). "1 над 0" на глаз проверяется ИМЕННО по видимым колонкам, а не по
   сырым индексам символов — поэтому падение должно сравнивать falling[i] не с floor[i], а с
   floor[i + offset], где offset — разница их собственных визуальных сдвигов относительно той же
   общей ширины maxLen, что использует render(). При align="left" alignShift всегда 0 для обеих
   строк, offset тоже 0 — поведение не меняется (полностью совместимо со старым). */
function tetrisAlignOffset(fallingLen, floorLen){
  let maxLen = 0;
  for (const s of st.rows) if (s.length > maxLen) maxLen = s.length;
  return alignShift(maxLen, fallingLen, st.align) - alignShift(maxLen, floorLen, st.align);
}
function bitsFitIntoGaps(falling, floor, offset){
  offset = offset || 0;
  for (let i = 0; i < falling.length; i++){
    if (falling[i] !== "1") continue;
    const j = i + offset;
    // 1-бит падающей визуально приходится мимо выделенной строки (левее/правее её видимого
    // диапазона) — падать некуда, это тоже "не влезает", а не молча игнорируется.
    if (j < 0 || j >= floor.length) return false;
    if (floor[j] === "1") return false;
  }
  return true;
}
/* Ищет поворот floor0 (вправо, начиная с "без поворота"), при котором falling помещается в его
   0-пустоты (с учётом visual offset — см. tetrisAlignOffset). Возвращает {floor, rotations}
   первого подходящего, либо null, если ни один. */
function findFitRotation(falling, floor0, offset){
  if (bitsFitIntoGaps(falling, floor0, offset)) return { floor: floor0, rotations: 0 };
  let floor = floor0;
  for (let t = 1; t < floor0.length; t++){
    floor = rotateStrRight(floor);
    if (bitsFitIntoGaps(falling, floor, offset)) return { floor, rotations: t };
  }
  return null;
}
// Строка, в которую только что упало (см. "Шаг 2" ниже) и которая ждёт ОТДЕЛЬНОГО клика,
// переводящего выделение на строку ниже — само падение больше не делает это в том же клике.
// -1 = ничего не ждёт. Сбрасывается, как только клик пришёл на ДРУГУЮ строку (проверка по
// равенству selIdx), так что случайный клик по другой строке не запускает лишний переход.
let tetrisPendingAdvance = -1;
function tetrisDrop(){
  if (!st.selectedRows || st.selectedRows.size !== 1) { say("Выделите ровно одну строку — тетрис роняет строку сверху именно в неё."); return; }
  const selIdx = Array.from(st.selectedRows)[0];

  if (tetrisPendingAdvance === selIdx) {
    // Отдельный шаг: строка уже приняла падение на прошлом клике — этот клик только переводит
    // выделение на строку ниже, без каких-либо изменений битов.
    tetrisPendingAdvance = -1;
    const nextIdx = selIdx + 1;
    if (nextIdx >= st.rows.length) { say("🧱 Тетрис: это последняя строка — переходить некуда."); return; }
    st.selectedRows = new Set([nextIdx]);
    render(); saveCache();
    say(`🧱 Тетрис: выделение перешло на строку №${nextIdx + 1}.`);
    return;
  }

  if (selIdx <= 0) { say("Над выделенной строкой ничего нет — падать нечему."); return; }
  const aboveIdx = selIdx - 1;
  const falling = st.rows[aboveIdx] || "";
  const floor0 = st.rows[selIdx] || "";
  if (!falling.length) { say("Строка сверху пуста — падать нечему."); return; }
  if (!floor0.length) { say("Выделенная строка пуста — падать некуда."); return; }
  if (falling.length > floor0.length) { say("🧱 Тетрис: строка сверху длиннее выделенной — не влезает ни при одном повороте."); return; }

  // Смещение между визуальными колонками falling и floor при текущем выравнивании таблицы
  // (⇤/↔/⇥) — см. tetrisAlignOffset(). При align="left" всегда 0 (как раньше).
  const offset = tetrisAlignOffset(falling.length, floor0.length);

  if (bitsFitIntoGaps(falling, floor0, offset)) {
    // Шаг 2: уже влезает как есть (сразу либо после поворота/инверсии на прошлом клике) — падаем.
    // Переход выделения на строку ниже — ОТДЕЛЬНЫЙ следующий клик (см. tetrisPendingAdvance
    // выше), не сразу вместе с падением.
    snapshot();
    const mergedArr = floor0.split("");
    for (let i = 0; i < falling.length; i++){
      if (falling[i] === "1") mergedArr[i + offset] = "1";
    }
    st.rows[selIdx] = mergedArr.join("");
    st.rows[aboveIdx] = "0".repeat(falling.length);
    tetrisPendingAdvance = selIdx;
    render(); saveCache();
    say(`🧱 Тетрис: строка №${aboveIdx + 1} упала в выделенную №${selIdx + 1} — нажмите ещё раз, чтобы перейти на строку ниже.`);
    return;
  }

  // Шаг 1: не влезает как есть — крутим выделенную строку.
  const rot = findFitRotation(falling, floor0, offset);
  if (rot) {
    snapshot();
    if (rot.rotations > 0) st.rows[selIdx] = rot.floor;
    render(); saveCache();
    say(`🧱 Тетрис: выделенная строка повёрнута (сдвиг на ${rot.rotations}) — нажмите ещё раз, чтобы уронить единицы.`);
    return;
  }

  // Шаг 1б: ни один поворот не подошёл — инвертируем падающую строку (реально, в таблице) как
  // ОТДЕЛЬНЫЙ шаг, без поворота выделенной в этом же клике (инверсия и сдвиг — не сразу вместе).
  // Инверсия применяется БЕЗУСЛОВНО, даже если сама по себе ещё не даёт fit — следующий клик
  // просто зайдёт в обычный шаг 1 заново (уже с инвертированной падающей) и, если нужно,
  // подберёт поворот отдельным кликом. Повторный клик на тупике (снова нет поворота даже с
  // инверсией) инвертирует падающую ЕЩЁ РАЗ (переключение туда-обратно) — можно пробовать
  // вручную, покрутив выделенную ◄/► между нажатиями.
  snapshot();
  st.rows[aboveIdx] = invertBits(falling);
  render(); saveCache();
  say("🧱 Тетрис: строка сверху инвертирована — нажмите ещё раз (подберёт поворот выделенной, если нужен, отдельным кликом).");
}

/* Отслеживает "только что добавленный кликом bAddRightToggle бит", чтобы повторный клик по тем
   же строкам переключал его 1↔0 вместо добавления нового — см. bAddRightToggle ниже. Любая
   другая правка этих строк (в т.ч. bDelLast) сбрасывает состояние. */
let addRightState = null; // {idxs:number[], length:number[], value:'0'|'1'}

/* Удалить последний символ (справа) — прямой аналог bDelFirst, только с другого конца строки. */

      for (const idx of st.selectedRows) {
        if (st.rows[idx] && st.rows[idx].length > 0) {
          st.rows[idx] = st.rows[idx].slice(0, -1);

        }

    } else {

          st.rows[i] = st.rows[i].slice(0, -1);
          deleted++;
        }
      }
    }

    addRightState = null; // длины строк поменялись — предыдущий "добавленный бит" больше не актуален
    render(); saveCache();
    say(`Удалён последний символ из ${deleted} строк.`);
  };
}

/* "1/0→" — добавляет бит СПРАВА к выделенным строкам (или всем, если ничего не выделено).
   Первый клик дописывает '1'. Если следующий клик — снова по тем же самым строкам, и с прошлого
   клика их длина/последний символ не менялись НИКАК (ни другой кнопкой, ни правкой, ни undo —
   проверяется по факту, а не флагом "было ли что-то ещё"), то новый бит НЕ добавляется, а тот же
   самый последний символ переключается 1↔0. Любое постороннее изменение длины/содержимого этих
   строк само по себе "сбрасывает" продолжение — следующий клик снова допишет новый бит. */
const bAddRightToggleEl = document.getElementById("bAddRightToggle");
if (bAddRightToggleEl) {
  bAddRightToggleEl.onclick = () => {
    const idxs = (st.selectedRows && st.selectedRows.size > 0)
      ? Array.from(st.selectedRows).sort((a, b) => a - b)
      : st.rows.map((_, i) => i);
    if (idxs.length === 0) { say("Нечего дополнять — нет строк."); return; }

    const canToggle = !!addRightState
      && addRightState.idxs.length === idxs.length
      && addRightState.idxs.every((v, i) => v === idxs[i])
      && idxs.every((idx, i) => st.rows[idx]
        && st.rows[idx].length === addRightState.length[i]
        && st.rows[idx][st.rows[idx].length - 1] === addRightState.value);

    snapshot();
    if (canToggle) {
      const newVal = addRightState.value === "1" ? "0" : "1";
      for (const idx of idxs) st.rows[idx] = st.rows[idx].slice(0, -1) + newVal;
      addRightState.value = newVal;
      addRightState.length = idxs.map(idx => st.rows[idx].length);
      say(`Добавленный бит переключён на ${newVal} (${idxs.length} строк).`);
    } else {
      for (const idx of idxs) {
        if (st.rows[idx] == null) continue;
        st.rows[idx] = st.rows[idx] + "1";
      }
      addRightState = {
        idxs: idxs.slice(),
        length: idxs.map(idx => st.rows[idx] ? st.rows[idx].length : 0),
        value: "1"
      };
      say(`Добавлена 1 справа (${idxs.length} строк). Повторный клик — переключит на 0.`);
    }
    render(); saveCache();
  };
}

function doInterleaveStep() {
  if (!st.interleaveMode || st.interleavePairIdx < 0) return false;

  const aIdx = st.interleavePairIdx;
  const bIdx = aIdx + 1;

  if (bIdx >= st.rows.length) {
    st.interleaveMode = false;
    say("Конец строк.");
    return false;
  }

  const rowA = getRowBits(st, aIdx);
  const rowB = getRowBits(st, bIdx);
  const intResult = interleavePair(rowA, rowB, st.align);

  let searchResult = intResult;
  const cInterleaveXor = document.getElementById("cInterleaveXor");
  const useXor = cInterleaveXor && cInterleaveXor.checked;

  if (useXor) {
    searchResult = xorPair(intResult, rowB, st.align);
    say(`Интерливинг (${aIdx+1}-${bIdx+1}) + XOR нижней: ${searchResult}`);
  } else {
    say(`Интерливинг (${aIdx+1}-${bIdx+1}): ${searchResult}`);
  }

  const nextPatIdx = bIdx + 1;
  const nextPat = st.pats[nextPatIdx];

  if (!nextPat || !nextPat.text) {
    st.interleaveMode = false;
    say("Нет паттерна для сравнения.");
    return false;
  }

  const patFull = nextPat.text;
  const patSkip = st.skipFirst && patFull.length > 1 ? patFull.slice(1) : patFull;
  const patRev = reverseStr(patFull);
  const patRevSkip = patRev.length > 1 ? patRev.slice(1) : "";

  let matchType = "";
  if (searchResult.indexOf(patFull) >= 0) {
    matchType = "паттерн целиком";
  } else if (patSkip !== patFull && searchResult.indexOf(patSkip) >= 0) {
    matchType = "паттерн без 1-го";
  } else if (searchResult.indexOf(patRev) >= 0) {
    matchType = "реверс целиком";
  } else if (patRevSkip && searchResult.indexOf(patRevSkip) >= 0) {
    matchType = "реверс без 1-го";
  }

  if (matchType) {
    st.interleaveMode = false;
    st.selectedRows.clear();
    st.selectedRows.add(bIdx);
    st.selectedRows.add(nextPatIdx);
    st.aIdx = bIdx;
    st.bIdx = nextPatIdx;
    render(); saveCache();
    say(`✓ Совпадение (${matchType})! Выделение на ${bIdx + 1}-${nextPatIdx + 1}`);
    return false;
  }

  st.interleavePairIdx = bIdx;
  return true;
}

function doXorSelectedStep() {
  if (!st.xorSelectedMode || st.xorSelectedIdx < 0) return false;

  const selIdx = st.xorSelectedIdx;
  const xorResult = xorRowsDownTo(st.rows, selIdx, st.align, st);

  const nextPatIdx = selIdx + 1;
  const nextPat = st.pats[nextPatIdx];

  if (!nextPat || !nextPat.text) {
    st.xorSelectedMode = false;
    say("Нет паттерна для сравнения.");
    return false;
  }

  const aIdx = 0, bIdx = nextPatIdx - 1;
  const chain = buildChain(st, aIdx, bIdx);
  const searchText = chain.text + xorResult;

  if (!searchText.length) {
    snapshot();
    st.rows[selIdx + 1] = rotateStrRight(st.rows[selIdx + 1]);
    render(); saveCache();
    return true;
  }

  const patFull = nextPat.text;
  const patSkip = st.skipFirst && patFull.length > 1 ? patFull.slice(1) : patFull;
  const patRev = reverseStr(patFull);
  const patRevSkip = patRev.length > 1 ? patRev.slice(1) : "";

  let matchType = "";

  if (patFull && searchText.indexOf(patFull) >= 0) {
    matchType = "паттерн целиком";
  } else if (patSkip !== patFull && searchText.indexOf(patSkip) >= 0) {
    matchType = "паттерн без 1-го";
  } else if (patRev && searchText.indexOf(patRev) >= 0) {
    matchType = "реверс целиком";
  } else if (patRevSkip && searchText.indexOf(patRevSkip) >= 0) {
    matchType = "реверс без 1-го";
  }

  if (matchType) {
    st.xorSelectedMode = false;
    st.selectedRows.clear();
    st.selectedRows.add(selIdx + 1);
    st.aIdx = selIdx + 1;
    st.bIdx = Math.min(selIdx + 2, st.rows.length - 1);
    render(); saveCache();
    say(`✓ Совпадение (${matchType})! Перейдено на строку ${selIdx + 2}`);
    return false;
  }

  snapshot();
  st.rows[selIdx + 1] = rotateStrRight(st.rows[selIdx + 1]);
  render(); saveCache();
  return true;
}

// ГЛОБАЛЬНЫЕ ХОТКЕИ (срабатывают, только если мы не вводим текст в инпутах)
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;

  // Ctrl+Z / Cmd+Z — отмена ЛЮБОЙ ручной операции (снапшот берётся тем же
  // общим механизмом, что и у обычного шага: редактирование строки, сдвиг,
  // добавление нулей, удаление первого символа и т.д. — все они уже вызывают snapshot()).
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") {
    e.preventDefault();
    document.getElementById("bUndo").click();
    return;
  }

  // Ctrl+C / Cmd+C — копирует выделенные (кликом) строки текстом, с выравниванием (см.
  // copySelectedRows). Если ничего не выделено кликом ИЛИ есть обычное текстовое выделение
  // мышью (например в окошке результата) — не вмешиваемся, пусть браузер копирует как обычно.
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c") {
    if (st.selectedRows && st.selectedRows.size > 0 && !window.getSelection().toString()) {
      e.preventDefault();
      copySelectedRows();
      return;
    }
  }

  if (e.key === "Enter") {
    e.preventDefault();
    autoRun();
  } else if (e.key === "Escape") {
    e.preventDefault();
    closeMenus();
    document.getElementById("bReset").click();
  } else if (e.key === "Delete") {
    // Delete — удалить выделенные (кликом) строки. НЕ связано с откатом шага.
    e.preventDefault();
    deleteSelectedRows();
  } else if (e.key === "Backspace") {
    e.preventDefault();
    document.getElementById("bUndo").click();
  } else if (e.key === "F2") {
    // Редактирование выделенной строки (если выделена ровно одна)
    e.preventDefault();
    if (st.selectedRows && st.selectedRows.size === 1) {
      startEditRow([...st.selectedRows][0]);
    }
  } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && st.selectedCol >= 0) {
    // Пока выбран столбец, ◄► переключают ВЫБРАННЫЙ СТОЛБЕЦ (не крутят символы строк).
    e.preventDefault();
    let maxLen = 0;
    for (const s of st.rows) if (s.length > maxLen) maxLen = s.length;
    const next = e.key === "ArrowRight" ? Math.min(maxLen - 1, st.selectedCol + 1) : Math.max(0, st.selectedCol - 1);
    selectColumn(next);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (bShiftLEl) bShiftLEl.click();
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    if (bShiftREl) bShiftREl.click();
  } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    // Двигает ВЫДЕЛЕНИЕ строки вверх/вниз (не путать с ◄► — те крутят символы внутри строки).
    e.preventDefault();
    if (!st.selectedRows) st.selectedRows = new Set();
    const n = Math.max(st.rows.length, st.pats.length);
    if (n === 0) return;
    let cur = st.selectedRows.size === 1 ? [...st.selectedRows][0] : st.bIdx;
    if (typeof cur !== "number" || cur < 0) cur = 0;
    const next = e.key === "ArrowDown" ? Math.min(n - 1, cur + 1) : Math.max(0, cur - 1);
    st.selectedRows.clear();
    st.selectedRows.add(next);
    render();
    saveCache();
    const rowEl = document.querySelector('.ln[data-idx="' + next + '"]');
    if (rowEl) rowEl.scrollIntoView({ block: "nearest" });
  }
});

/* Ползунки шрифта, межстрочного и межсимвольного интервала */
const fs = document.getElementById("fs");
const lh = document.getElementById("lh");
const ls = document.getElementById("ls");

/* Высота строки .ln раньше считалась в CSS как calc(--chain-fs * --chain-lh) — при дробном
   произведении (напр. 19 * 0.65 = 12.35px) сама СЕТКА строк остаётся идеально ровной
   (getBoundingClientRect подтверждает), но у каждой строки РАЗНЫЙ дробный остаток накопленной
   Y-позиции (0, 12.35, 24.7, 37.05...) — при рендере текста браузер подгоняет глифы под
   пиксельную сетку (хинтинг), и округление дробного остатка "плавает" от строки к строке.
   Отсюда одинаковые пары символов (напр. "0" над "0") визуально то сливаются, то нет. Считаем
   произведение здесь в JS и ОКРУГЛЯЕМ до целого пикселя (--row-h) — тогда высота каждой строки
   буквально одно и то же целое число, без дробного остатка вообще. */
function updateRowHeight(){
  const px = Math.round((+fs.value) * (+lh.value));
  document.documentElement.style.setProperty("--row-h", px + "px");
}
/* Сразу при разборе скрипта — на случай самой первой загрузки без кэша вообще (там ветка
   loadCache() не зовёт applyFont()/applyLh(), полагаясь на CSS :root по умолчанию); без этого
   --row-h не проставился бы вообще, и .ln откатилась бы на хардкод-заглушку 12px в CSS. */
updateRowHeight();
function applyFont(){
  const v = +fs.value;
  document.documentElement.style.setProperty("--chain-fs", v + "px");
  document.getElementById("fsVal").textContent = v;
  updateRowHeight();
}
fs.oninput = () => { applyFont(); saveCache(); };

function applyLh(){
  const v = +lh.value;
  document.documentElement.style.setProperty("--chain-lh", v);
  document.getElementById("lhVal").textContent = v;
  updateRowHeight();
}
lh.oninput = () => { applyLh(); saveCache(); };

function applyLs(){
  const v = +ls.value;
  document.documentElement.style.setProperty("--chain-ls", v + "px");
  document.getElementById("lsVal").textContent = v;
}
ls.oninput = () => { applyLs(); saveCache(); };

/* Выбор шрифта цифр полотна (см. #chainFontSel/--chain-ff в CSS) */

/* #RRGGBB -> rgba(...) с заданной прозрачностью — цвет <input type="color"> всегда непрозрачный,
   а фон выделенной строки (--rowbg-sel) должен оставаться полупрозрачным, иначе перекроет
   текст строки под собой. */
function hexToRgba(hex, alpha){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
  if (!m) return hex;
  return "rgba(" + parseInt(m[1], 16) + "," + parseInt(m[2], 16) + "," + parseInt(m[3], 16) + "," + alpha + ")";
}

/* Фон ТОЛЬКО для выделенных строк (см. #rowBgSel в HTML, .ln.selected фон в CSS) — просто цвет

/* Снимок текущих цветов — для сохранения их ОТДЕЛЬНО у каждой цепочки (см. createDefaultTabState/
   saveActiveTabState/loadTabState ниже). Объявлена function-декларацией (поднимается целиком),
   поэтому её можно звать из тех функций, хотя они в файле раньше — реально выполнятся они
   только после того, как col1/currentPreset и т.д. уже объявлены (см. порядок вызова loadCache()). */
function captureColors(){
  return {
    c1: col1 ? col1.value : "#ff3333",
    c0: col0 ? col0.value : "#555555",
    cBg: colBg ? colBg.value : "#000000",
    preset: typeof currentPreset !== "undefined" ? currentPreset : "crypto",
    customPreset: st.customPreset || null,
    rowBgSel: rowBgSel ? rowBgSel.value : "#ffcf6b",
    c01: typeof col01El !== "undefined" && col01El ? col01El.value : "#ff9900",
    cv1: typeof colVert1El !== "undefined" && colVert1El ? colVert1El.value : "#00ccff",
    cd1: typeof colDiag1El !== "undefined" && colDiag1El ? colDiag1El.value : "#66ff66"
  };
}

function makeDrag(el, varName, x0fn, min, max){
  el.addEventListener("mousedown", e => {
    e.preventDefault();
    const x0 = x0fn();
    el.classList.add("drag");
    document.body.classList.add("dragging");
    const move = ev => {
      const w = Math.max(min, Math.min(max, ev.clientX - x0));
      document.documentElement.style.setProperty(varName, w + "px");
    };
    const up = () => {
      el.classList.remove("drag");
      document.body.classList.remove("dragging");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      saveCache();
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
}

function makeDragRight(el, varName, min, max){
  el.addEventListener("mousedown", e => {
    e.preventDefault();
    const chainRect = document.getElementById("chain").getBoundingClientRect();
    const rightEdge = chainRect.right;
    
    el.classList.add("drag");
    document.body.classList.add("dragging");
    
    const move = ev => {
      let w = rightEdge - ev.clientX; // Чем левее мышь, тем шире колонка
      w = Math.max(min, Math.min(max, w));
      document.documentElement.style.setProperty(varName, w + "px");
    };
    
    const up = () => {
      el.classList.remove("drag");
      document.body.classList.remove("dragging");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      saveCache();
    };
    
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
}

/* Минимум 40px, а не 20 — .pat/.pat2 сами резервируют padding-left:4px+padding-right:28px
   (=32px) под отступ и под бейдж номера шага (.st), это не место под текст паттерна. При
   старом минимуме 20px место под сам текст уходило в минус (браузер зажимает контент-бокс в 0),
   и при перетаскивании колонки к минимуму текст паттерна визуально утыкался прямо в границу
   .vsplit/.vsplit2 — 40px оставляет от него хотя бы ~8px реального места под текст. */

  const p = document.querySelector(".pat");

const CACHE_KEY = "zerk_fold_v1";
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Генератор фрактала Серпинского 90 (Rule 90 / Pascal mod 2) */
function generateSierpinski90(n) {
  const rows = [];
  let prev = [1];
  rows.push("1");
  for (let r = 1; r < n; r++) {
    const next = [1];
    for (let i = 1; i < prev.length; i++) {
      next.push(prev[i - 1] ^ prev[i]);
    }
    next.push(1);
    rows.push(next.join(""));
    prev = next;
  }
  return rows;
}
