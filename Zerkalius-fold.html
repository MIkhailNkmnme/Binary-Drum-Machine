.step-log-sub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-family: "Roboto Mono", Consolas, monospace; font-size: 11px; margin-bottom: 3px; }
.step-log-sub-mode { flex: 0 0 auto; color: var(--dim); min-width: 72px; }
.step-log-sub-mode.found { color: #ffcf6b; font-weight: 700; }
.step-log-sub-variant { display: inline-block; padding: 0 4px; border-radius: 2px; background: rgba(255,255,255,.05); color: #4b5262; }
.step-log-sub-variant.found { background: rgba(255,207,107,.2); color: #ffcf6b; font-weight: 700; }
.step-log-changes { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 2px; }
.step-log-change-item { display: flex; flex-direction: column; gap: 4px; }
.step-log-diff { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 10px; }
.step-log-diff-col { flex: 1 1 140px; min-width: 0; }
.step-log-diff-tag {
  display: block; font-size: 10px; color: var(--dim); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 2px;
}
.step-log-diff-arrow { color: #ffcf6b; font-size: 16px; font-weight: 700; padding-top: 14px; flex: 0 0 auto; }
.step-log-chg-out { background: rgba(255, 68, 68, 0.25); color: #ffb0b0; border-radius: 2px; padding: 0 1px; }
.step-log-chg-in  { background: rgba(56, 193, 114, 0.25); color: #9cf0bd; border-radius: 2px; padding: 0 1px; font-weight: 700; }
.step-log-unchanged { color: var(--dim); font-style: italic; font-size: 11px; }
.step-log-hit { color: var(--red); font-weight: 700; background: rgba(255, 68, 68, 0.18); border-radius: 2px; padding: 0 1px; }
.step-log-hit.inv { color: var(--purple); background: rgba(176, 96, 255, 0.18); }
.step-log-hit.rev { color: var(--green); background: rgba(56, 193, 114, 0.18); }
.step-log-loc { font-size: 11px; color: var(--dim); margin-top: 4px; line-height: 1.5; }
.step-log-loc b { color: var(--acc); font-weight: 600; }
.step-log-dim { color: #3a4050; }

/* Крупное, яркое плавающее уведомление строго в самом центре поля с данными */
/* Раньше по центру экрана — перекрывало линейку столбцов/строки под ней; сдвинуто вниз */
#msg{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) scale(0.9);
     background:#1e2332; color:#ffe066; border:1.5px solid #ffcc00;
     border-radius:8px; padding:12px 28px; font-size:15px; font-weight:bold; letter-spacing:0.5px;
     box-shadow:0 10px 32px rgba(0,0,0,0.85), 0 0 20px rgba(255, 204, 0, 0.35);
     z-index:1000; pointer-events:none; opacity:0; transition:opacity 0.2s ease, transform 0.2s ease}
#msg.show{opacity:1; transform:translateX(-50%) scale(1)}

/* Базовая мобильная поддержка: крупнее тач-цели у кнопок и ползунков (сама раскладка панелей
   не переверстывается — только это). viewport-тег (см. <head>) отвечает за корректный
   масштаб/зум страницы на телефоне. */
@media (pointer: coarse) {
  button{min-height:34px;padding:6px 10px}
  input[type="range"]{height:28px}
  label.chk{padding:5px 6px}
}
</style>

    <!-- Скрыть/показать колонки паттернов по отдельности (левую/правую) -->

    <!-- П1/П2/Р//Ч/ — объединены в одну рамку (запрос пользователя). Вернуть overlay-бары,
         скрытые крестиком ✕ в их шапке (см. .overlay-close) — сами бары полностью пропадают из
         вида (display:none), других способов их вернуть нет. -->

    <!-- Управление цепочками (вкладками) — вынесено из шапки таблицы строк в верхнее меню.
         Раньше был нативный <select> + отдельная кнопка "✕" (закрывала только ТЕКУЩУЮ
         вкладку) — теперь свой выпадающий список, где у КАЖДОЙ вкладки своя кнопка "✕"

    <span style="width:1px;align-self:stretch;background:var(--line);margin:0 4px;"></span>
    <!-- Цепочка/+/💾/🧹/Сброс/Файл-Файл — объединены в одну рамку (запрос пользователя). -->
    <div style="display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:3px;padding:2px 4px;">

      <button id="bReset" style="font-size:12px;padding:3px 6px;" title="Сбросить к шаблону (Escape)">↺ Сброс</button>

    <div style="display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:3px;padding:2px 4px;">

<div id="opsGroup" class="control-group ops-btn-grid">

       "⧬ Интерлив сквозной"/"⨁ XOR сквозной" — тоже ПОЛНОЦЕННЫЕ режимы для "Авто"
       (взаимоисключающая .mode-act подсветка с Шаг/XOR/.../Круг/Спираль), но живут во вкладке
       "Сквозная" (seqGroup), а не тут и не в flowGroup — см. запрос пользователя, все
       сквозная-режимы теперь в одном месте. -->
  <button id="bInterleaveSearch" title="Интерливинг пары + поиск совпадения в паттерне 3-й строки">⧬ Интерлив</button>

  <!-- Тетрис/Тетрис 2 — общая рамка, один уровень в сетке (grid-column:1/-1) — тот же приём,

  <div style="grid-column:1 / -1; display:flex; gap:6px; border:1px solid var(--m-orange); background:rgba(163,112,61,0.12); border-radius:3px; padding:4px;">
    <!-- Тетрис: каждый клик — один ОТДЕЛЬНЫЙ шаг (см. tetrisDrop() в JS): если 1-биты строки НАД
         выделенной не влезают в её 0-пустоты как есть, клик крутит выделенную строку круговым
         сдвигом (направление/инверсия — та же, что сейчас активна у ◄/►Круг/Круг Инв, см.
         tetrisRotateFns()/st.lastDirMode — запрос пользователя), пока не найдётся подходящий
         поворот; если НИ ОДИН поворот не подошёл — просто сообщаем об этом, ничего не меняем;
         когда уже влезает — клик выполняет падение (выделенная получает эти 1-биты, строка сверху

         только переводит выделение на строку ниже, чтобы продолжать тетрис вниз повторяя клики. -->
    <button id="bTetris" style="color:#ff9900; flex:1;" title="Тетрис (каждый клик — один отдельный шаг): крутит выделенную строку круговым сдвигом (направление/инверсия — та же, что активна у ◄/►Круг/Круг Инв) до подходящего поворота; когда влезает — отдельным кликом роняет 1-биты строки сверху в её 0-пустоты; следующим кликом переводит выделение на строку ниже. Строки никогда не удаляются и не сдвигаются">🧱 Тетрис</button>
    <!-- Тетрис 2 — зеркало обычного Тетриса: падают 1-биты строки ПОД выделенной, ВВЕРХ в неё (см.
         tetris2Drop() в JS). В отличие от обычного Тетриса падающая строка ДЛИННЕЕ выделенной не
         отклоняется сразу — можно, если её "лишний" хвост весь из нулей. -->
    <button id="bTetris2" style="color:#ffb84d; flex:1;" title="Тетрис 2 (каждый клик — один отдельный шаг): 1-биты строки ПОД выделенной падают ВВЕРХ в неё. Двухуровневый поиск поворотом выделенной и (если не помогло) строки снизу — направление то же, что активно у ◄/►Круг/Круг Инв, но БЕЗ инверсии (обычный Круг, даже если сейчас активен Круг Инв); когда влезает — падение (строка снизу гасится в 0); следующим кликом переводит выделение на опустевшую строку. Строка снизу может быть длиннее выделенной, если её лишний хвост весь из нулей">🧱 Тетрис 2</button>
    <!-- Тетрис-Ось — 1-биты ВЫДЕЛЕННОЙ строки (кроме Оси, см. axisCharIdxOf() в JS) двигаются

    <button id="bTetrisAxis" style="color:#ffe066; flex:1;" title="Тетрис-Ось (каждый клик — один отдельный шаг): 1-биты ВЫДЕЛЕННОЙ строки (кроме её оси — первый символ строки при любом выравнивании, кроме «⊙ Ось», где ось — текущий индекс на общем столбце-оси) двигаются ВВЕРХ в 0-пустоты строки над ней. Если не влезает — крутится ТОЛЬКО выделенная (строка над ней неподвижна), направление/инверсия — как у ◄/►Круг/Круг Инв. Когда влезает — перенос (выделенная гасится в 0, ось остаётся «1»); следующим кликом переводит выделение на строку ниже опустевшей">🧱 Тетрис-Ось</button>
  </div>
</div>

<!-- Назад/Авто/Стоп + все кнопки-РЕЖИМЫ (см. setMode() в JS — подсвечиваются .mode-act, именно
     их и повторяет "Авто") — в одной рамке, раз они все связаны с "Авто": сверху Авто/Стоп,
     ниже сетка режимов. Перенесено сюда из бывшей вкладки "Управление" (см. MENUS.menuOps.ids). -->
<div id="flowGroup" class="control-group-flow">
  <div class="flow-top-row">
    <!-- Одна кнопка вместо пары "Авто"/"Стоп" — сама переключает подпись/цвет между "🚀 Авто"
         (клик — запустить) и "⏹ Стоп" (клик — остановить), см. setAutoBtnState() в JS. -->
    <button id="bAuto" title="Автоматический прогон по выбранному режиму (Enter) / повторный клик — остановить">🚀 Авто</button>
    <!-- КОПИЯ кнопки "↺ Сброс" из верхнего меню (запрос пользователя — именно копия, оригинал
         вверху остаётся): под рукой там же, где запускается прогон. Своего обработчика не имеет —
         просто кликает по оригиналу, чтобы логика сброса жила в одном месте. -->
    <button id="bResetFlow" title="Сбросить к шаблону (Escape) — то же, что «↺ Сброс» в верхнем меню">↺ Сброс</button>
  </div>
  <div class="flow-modes-grid">
    <!-- Шаг/Шаг 2 и XOR/XOR 2 — каждая пара в своей рамке, тот же приём, что и у Круг/Круг Инв
         ниже — запрос пользователя "также для... Шаг и XOR XOR2". -->
    <div style="grid-column:1 / -1; display:flex; gap:6px; border:1px solid var(--m-indigo); background:rgba(77,77,138,0.1); border-radius:3px; padding:4px;">
      <button id="bStep" style="flex:1;" title="Один шаг (обычный интерливинг)">▶ Шаг</button>
      <button id="bStep2" style="flex:1;" title="Шаг по 2 (принудительный интерливинг пары)">▶ Шаг 2</button>
    </div>
    <div style="grid-column:1 / -1; display:flex; gap:6px; border:1px solid var(--m-cyan); background:rgba(61,122,133,0.1); border-radius:3px; padding:4px;">
      <button id="bStepXor" style="color:var(--purple); flex:1;" title="Накопительный XOR всех строк до текущей">⨁ XOR</button>
      <button id="bStep2Xor" style="color:var(--acc); flex:1;" title="Принудительный XOR пары строк">⨁ XOR 2</button>
    </div>
    <!-- ◄/► Гориз.XOR — сквозная цепочка ВСЕГДА равна самой целевой строке (само-сравнение, см.
         horizSelfChain() в JS, запрос пользователя "сквозная = цель сделай"), заезжает с двух
         разных краёв: ► въезжает справа (крутит строку по кругу до находки), ◄ — заходит слева.
         Общая рамка, один уровень в сетке (grid-column:1/-1) — запрос пользователя "расположи на
         одном уровне и объедини рамкой", тот же приём, что и у блока Спирали ниже. -->
    <div style="grid-column:1 / -1; display:flex; flex-direction:column; gap:4px; border:1px solid var(--m-orange2); background:rgba(138,107,61,0.12); border-radius:3px; padding:4px;">
      <div style="display:flex; gap:6px;">
        <button id="bStepHorizXorLeft" style="color:#ff9900; flex:1;" title="Горизонтальный XOR (вход слева): сквозная цепочка = сама целевая строка, заходит в неё с ЛЕВОГО края, крутит строку по кругу до находки">◄ Гориз.XOR</button>
        <button id="bStepHorizXor" style="color:#ff9900; flex:1;" title="Горизонтальный XOR (вход справа): сквозная цепочка = сама целевая строка, копия строки по одному биту заходит в неё саму, ксорит и крутит по кругу до находки">► Гориз.XOR</button>
      </div>
      <!-- 3 независимых переключателя (2×2×2 = 8 вариантов) — запрос пользователя. Сторона
           входа (◄/►) выбирается самими кнопками выше, эти три — ЧТО происходит при неудаче
           полного прохода. -->
      <div style="display:flex; flex-wrap:wrap; gap:2px 10px; font-size:11px;">
        <label class="chk" title="После полного прохода без находки — крутить целевую строку по кругу и заходить заново (пока не найдётся или не переберётся весь круг). Выключено — как совсем раньше: один проход, без находки — стоп. Игнорируется, если включена «↕ Развернуть цепочку» (баунс её полностью заменяет)"><input type="checkbox" id="cHorizRotateOnFail" checked>🔁 Крутить по кругу</label>
        <label class="chk" title="При каждом повороте (см. «Крутить по кругу») ещё и переключать сторону входа — справа, потом слева, потом снова справа..."><input type="checkbox" id="cHorizAlternateSide">⇄ Менять сторону</label>
        <label class="chk" title="Баунс: когда сквозная (копия строки) проходит через всю цель без находки — вместо остановки или поворота строки (см. «Крутить по кругу», её при этом полностью заменяет) просто разворачивает НАПРАВЛЕНИЕ и заходит заново с той стороны, откуда только что вышла, обратным ходом — туда-сюда, пока не найдётся"><input type="checkbox" id="cHorizReverseChain">↕ Развернуть цепочку</label>
        <label class="chk" title="Пока идёт поиск — РЕАЛЬНО менять биты САМОЙ СТРОКИ на каждом шаге на текущий промежуточный XOR (то же значение, что и в «Черновике шага» → Результат), а не только показывать — дальнейшие шаги ксорят уже с этими изменёнными битами. Если весь поиск в итоге провалится без находки — строка вернётся к исходному виду. Выключено — строка не меняется до самой находки (только подсветка в «Черновике шага»)"><input type="checkbox" id="cHorizShowLiveXor" checked>👁 XOR на строке</label>
      </div>
    </div>
    <!-- Круговой сдвиг и Спираль — тоже "режимы для Авто" (см. st.lastDirMode/DIR_MODE_BTN
         в JS), поэтому перенесены сюда же, из "Правки строк". Взаимоисключающая подсветка
         .mode-act — общая с Шаг/XOR/Гориз.XOR/Скан ниже (см. setLastDirMode()/setMode() в JS).
         Каждая пара (◄/►Круг, ◄/►Круг Инв) — в СВОЕЙ рамке (запрос пользователя "Круг и Круг Инв

    <!-- Круг / Круг Инв / галка "снап" оси — ВСЕ в ОДНОЙ рамке (запрос пользователя, было 3

         запрос пользователя "эта кнопка должна влиять на все режимы выравнивания"): включена —
         "⊙ Ось" останавливается только на «1», "Ось 1.2" — только в зазоре между «1» и «0»
         (именно в этом порядке, не «0» и «1»), любое ДРУГОЕ выравнивание крутит саму строку по
         кругу, пока на её "оси" не окажется «1» (ось — первый бит строки, кроме "По правому
         краю"/"Лесенки правой", там последний, см. nonAxisSnapCharIdx в JS); выключена — "⊙ Ось"
         сдвигается на любой символ (в т.ч. «0»), "Ось 1.2" — в зазор между ЛЮБЫМИ соседними
         символами (полсимвол всё равно остаётся, просто без требования «1»→«0»), строки без
         «1»→«0» тоже не заморожены, остальные выравнивания — обычный одиночный поворот. См.
         st.axisSnap/shiftOneRowAxisAware в JS. -->
    <div style="grid-column:1 / -1; display:flex; flex-direction:column; gap:6px; border:1px solid var(--m-blue); background:rgba(61,90,120,0.12); border-radius:3px; padding:4px;">
      <!-- Каждая пара — своя строка (display:flex БЕЗ wrap), а не общий flex-wrap на все 4 —
           запрос пользователя: flex-wrap мог разбить пары по разным строкам вперемешку
           (напр. Круг/Круг/Круг Инв на одной, Круг Инв одна на другой) в зависимости от ширины. -->
      <div style="display:flex; gap:6px;">
        <button id="bShiftL" style="flex:1;" title="Круговой сдвиг влево выбранных строк (◄ или Ctrl+Клик)">◄ Круг</button>
        <button id="bShiftR" style="flex:1;" title="Круговой сдвиг вправо выбранных строк (► или Ctrl+Клик)">► Круг</button>
      </div>
      <div style="display:flex; gap:6px;">
        <button id="bShiftLInv" style="flex:1;" title="Круговой сдвиг влево с инверсией бита при переходе границы строки">◄ Круг Инв</button>
        <button id="bShiftRInv" style="flex:1;" title="Круговой сдвиг вправо с инверсией бита при переходе границы строки">► Круг Инв</button>
      </div>
      <label class="chk" title="Для «⊙ Ось»: вкл — на оси только «1», «0» перепрыгивается; выкл — сдвиг на любой символ. Для «Ось 1.2»: вкл — зазор только между «1» и «0» (строки без такой пары заморожены); выкл — зазор между любыми соседними символами, заморозки нет. Для ВСЕХ остальных выравниваний: вкл — Круг/Круг Инв крутят строку, пока на её оси (первый бит, у «По правому краю»/«Лесенки правой» — последний) не встанет «1»; выкл — обычный одиночный поворот"><input type="checkbox" id="cAxisSnap" checked> ⊙ Сдвиг только на «1» / «1-0»</label>
      <!-- Что делать, когда Круг довёл строку до края: по умолчанию перескок на противоположный
           край (кольцо), с галкой — разворот и ход обратно до упора, потом снова вперёд.
           Работает и в "ОсьБит"/"ОсьБит ½" (край допустимого диапазона положений), и в остальных
           выравниваниях (край собственного кольца поворотов строки). См. axisBitNextSh()/
           rowRotOffMap в JS. -->
      <label class="chk" title="Дойдя до края, Круг не перескакивает через границу дальше по кругу, а разворачивается и идёт обратно до упора, потом снова вперёд. В «ОсьБит»/«ОсьБит ½» край — это предел допустимых положений относительно строки выше; в остальных выравниваниях — край собственного кольца поворотов строки (когда первый символ дошёл до другого конца)"><input type="checkbox" id="cAxisBitBounce"> ↩ От края назад, не по кольцу</label>
    </div>
    <!-- ▲/▼ Спираль + переключатель "какая сторона ленты — вверх" (st.spiralUpDir) — в ОДНОЙ
         рамке (см. запрос пользователя — переключатель влияет только на Спираль, значит и жить

         сквозная-related). grid-column:1/-1 — та же двухколоночная сетка flow-modes-grid, растягиваем
         рамку на всю ширину, как блок Серпинского в editGroup ниже. -->
    <div style="grid-column:1 / -1; display:flex; gap:6px; align-items:center; border:1px solid var(--m-red); background:rgba(138,77,77,0.12); border-radius:3px; padding:4px;">
      <button id="bSpiralUp" style="color:#ff3333; flex:1;" title="Спираль вверх: строки (все, либо выделенный диапазон) читаются одной лентой и сдвигаются по кругу на 1 символ в сторону, заданную переключателем ◄/► справа">▲ Спираль</button>
      <button id="bSpiralDown" style="color:#ff3333; flex:1;" title="Спираль вниз: строки (все, либо выделенный диапазон) читаются одной лентой и сдвигаются по кругу на 1 символ в сторону, противоположную переключателю ◄/► справа">▼ Спираль</button>
      <div class="align-grp" id="spiralDirGrp" title="Какая сторона ленты считается «вверх» для ▲/▼ Спираль">
        <button data-val="left" title="Влево по ленте = вверх">◄</button>
        <button class="act" data-val="right" title="Вправо по ленте = вверх">►</button>
      </div>
    </div>
    <!-- Проекц.XOR и Скан — перенесены сюда, друг напротив друга (2-колоночная сетка) — запрос
         пользователя "перенесу вниз справа от Скан". -->
    <button id="bStepXorProj" style="color:#ff66cc;" title="Проекция XOR: Вычисляет XOR всех строк ВЫШЕ текущей и полностью перезаписывает им текущую строку.">⏬ Проекц.XOR</button>
    <button id="bStepScan" style="color:var(--green);" title="Сканировать строки на паттерны без изменения символов">👁 Скан</button>
  </div>
</div>

<div id="editGroup" class="control-group control-group-player">

       и положение по X всегда авто на всю доступную ширину, как раньше только у #chainResultBox),
       см. overlayOrder/layoutOverlayBoxes() в JS (МАРКЕР 10.2b OVERLAY_STACK). Клик по заголовку
       результата (не по ручке) по-прежнему сворачивает его в шапку. -->
  <div class="chain-result-box overlay-box" id="chainResultBox">
    <div class="chain-result-head overlay-head">
      <span class="overlay-drag" title="Перетащить — поменять местами с «Черновиком»">⋮⋮</span>

      <span class="counter row-balance" id="selBalanceWrap" style="display:none;" title="⚖ Суммарный баланс единиц/нулей по ВСЕМ выделенным строкам вместе (виден, пока включено «⚖ Показать балансы») — подсвечивается акцентным, если единиц и нулей поровну">Σ: <b id="selBalance1">0</b>-<b id="selBalance0">0</b></span>
      <button id="bLockResultHeight" title="Закрепить высоту панели на текущем размере — дальше не растёт/не сжимается сама при смене содержимого (списка режимов/находок), просто скроллится внутри">📌</button>
