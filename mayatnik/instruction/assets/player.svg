<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="675" viewBox="0 0 1120 675" role="img" aria-label="Плеер: шаг, кадр и пауза"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73e4a5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif} .mono{font-family:Consolas,monospace}</style><rect width="1120" height="675" fill="#0c1119"/><text x="40" y="53" font-size="32" fill="#edf3ff" text-anchor="start">Плеер: шаг, кадр и пауза</text><text x="40" y="88" font-size="18" fill="#a4b4cc" text-anchor="start">Поясняющая схема · учебный пример</text><rect x="40" y="130" width="1040" height="360" rx="10" fill="#141e2b" stroke="#34465f"/><rect x="65" y="155" width="135" height="48" rx="10" fill="#141e2b" stroke="#73e4a5"/><text x="132.5" y="187" font-size="23" fill="#edf3ff" text-anchor="middle">x4</text><rect x="900" y="155" width="150" height="48" rx="10" fill="#141e2b" stroke="#73e4a5"/><text x="975.0" y="187" font-size="23" fill="#edf3ff" text-anchor="middle">t0,1</text><text x="245" y="185" font-size="23" fill="#a4b4cc" text-anchor="start">Маятник · 512 строк · ширина 1023</text><rect x="65" y="255" width="115" height="48" rx="10" fill="#141e2b" stroke="#73e4a5"/><text x="122.5" y="287" font-size="23" fill="#edf3ff" text-anchor="middle">−4</text><rect x="940" y="255" width="110" height="48" rx="10" fill="#141e2b" stroke="#73e4a5"/><text x="995.0" y="287" font-size="23" fill="#edf3ff" text-anchor="middle">+4</text><path d="M205 279 L915 279" fill="none" stroke="#60718e" stroke-width="5"/><rect x="470" y="254" width="70" height="50" rx="10" fill="#274f42" stroke="#73e4a5"/><text x="505" y="287" font-size="26" fill="#edf3ff" text-anchor="middle">▶</text><text x="552" y="292" font-size="29" fill="#73e4a5" text-anchor="start">128</text><text x="215" y="365" font-size="23" fill="#edf3ff" text-anchor="start">Щелчок по полю плеера: пуск / пауза</text><path d="M390 338 L390 294" fill="none" stroke="#73e4a5" stroke-width="3"/><text x="215" y="415" font-size="23" fill="#edf3ff" text-anchor="start">Тянуть бегунок: выбрать кадр</text><path d="M505 392 L505 307" fill="none" stroke="#73e4a5" stroke-width="3"/><text x="45" y="545" font-size="24" fill="#edf3ff" text-anchor="start">x4: за один экранный кадр — четыре шага построения.</text><text x="45" y="585" font-size="23" fill="#a4b4cc" text-anchor="start">t0,1: пауза 0,1 с. Число кадра следует рядом с бегунком.</text><text x="45" y="622" font-size="23" fill="#a4b4cc" text-anchor="start">Стрелки −4 / +4 шагают на x. Сведения о поле стоят отдельно.</text></svg>