<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="RGB-соседи: три бита дают один цвет"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73e4a5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif} .mono{font-family:Consolas,monospace}</style><rect width="1120" height="650" fill="#0c1119"/><text x="40" y="53" font-size="32" fill="#edf3ff" text-anchor="start">RGB-соседи: три бита дают один цвет</text><text x="40" y="88" font-size="18" fill="#a4b4cc" text-anchor="start">Поясняющая схема · учебный пример</text><text x="230" y="160" font-size="26" fill="#00cc66" text-anchor="middle">СЛЕВА · G</text><rect x="130" y="190" width="200" height="140" rx="10" fill="#182538" stroke="#00cc66"/><text x="230" y="280" font-size="64" fill="#edf3ff" text-anchor="middle">1</text><text x="230" y="375" font-size="22" fill="#a4b4cc" text-anchor="middle">Вес канала: 2</text><text x="550" y="160" font-size="26" fill="#ff5555" text-anchor="middle">ТЕКУЩИЙ · R</text><rect x="450" y="190" width="200" height="140" rx="10" fill="#182538" stroke="#ff5555"/><text x="550" y="280" font-size="64" fill="#edf3ff" text-anchor="middle">0</text><text x="550" y="375" font-size="22" fill="#a4b4cc" text-anchor="middle">Вес канала: 4</text><text x="870" y="160" font-size="26" fill="#557dff" text-anchor="middle">СПРАВА · B</text><rect x="770" y="190" width="200" height="140" rx="10" fill="#182538" stroke="#557dff"/><text x="870" y="280" font-size="64" fill="#edf3ff" text-anchor="middle">1</text><text x="870" y="375" font-size="22" fill="#a4b4cc" text-anchor="middle">Вес канала: 1</text><path d="M320 260 L430 260" fill="none" stroke="#73e4a5" stroke-width="3"/><path d="M770 260 L660 260" fill="none" stroke="#73e4a5" stroke-width="3"/><text x="560" y="440" font-size="26" fill="#edf3ff" text-anchor="middle">Слева / текущий / справа: 1 / 0 / 1</text><rect x="230" y="475" width="660" height="75" rx="10" fill="#00ffff" stroke="#7bffff"/><text x="560" y="523" font-size="28" fill="#002b32" text-anchor="middle">RGB = R0 G1 B1 = 011 = голубой</text><text x="560" y="601" font-size="22" fill="#a4b4cc" text-anchor="middle">Код: 4 × текущий + 2 × левый + правый. За краем сосед равен 0.</text></svg>