<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="Правило 90: от одной вершины"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73e4a5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif} .mono{font-family:Consolas,monospace}</style><rect width="1120" height="650" fill="#0c1119"/><text x="40" y="53" font-size="32" fill="#edf3ff" text-anchor="start">Правило 90: от одной вершины</text><text x="40" y="88" font-size="18" fill="#a4b4cc" text-anchor="start">Поясняющая схема · учебный пример</text><text x="45" y="164" font-size="22" fill="#a4b4cc" text-anchor="start">Строка 1</text><rect x="285" y="130" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="314" y="169" font-size="29" fill="#111722" text-anchor="middle">1</text><text x="45" y="247" font-size="22" fill="#a4b4cc" text-anchor="start">Строка 2</text><rect x="250" y="213" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="279" y="252" font-size="29" fill="#111722" text-anchor="middle">1</text><rect x="320" y="213" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="349" y="252" font-size="29" fill="#111722" text-anchor="middle">1</text><text x="45" y="330" font-size="22" fill="#a4b4cc" text-anchor="start">Строка 3</text><rect x="215" y="296" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="244" y="335" font-size="29" fill="#111722" text-anchor="middle">1</text><rect x="285" y="296" width="58" height="58" rx="4" fill="#263348" stroke="#34465f"/><text x="314" y="335" font-size="29" fill="#edf3ff" text-anchor="middle">0</text><rect x="355" y="296" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="384" y="335" font-size="29" fill="#111722" text-anchor="middle">1</text><text x="45" y="413" font-size="22" fill="#a4b4cc" text-anchor="start">Строка 4</text><rect x="180" y="379" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="209" y="418" font-size="29" fill="#111722" text-anchor="middle">1</text><rect x="250" y="379" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="279" y="418" font-size="29" fill="#111722" text-anchor="middle">1</text><rect x="320" y="379" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="349" y="418" font-size="29" fill="#111722" text-anchor="middle">1</text><rect x="390" y="379" width="58" height="58" rx="4" fill="#e9eff9" stroke="#34465f"/><text x="419" y="418" font-size="29" fill="#111722" text-anchor="middle">1</text><text x="635" y="151" font-size="24" fill="#edf3ff" text-anchor="start">Бит снизу = левый XOR правый</text><rect x="635" y="185" width="425" height="53" rx="10" fill="#141e2b" stroke="#34465f"/><text x="660" y="220" font-size="26" fill="#edf3ff" text-anchor="start">0  XOR  0  =  0</text><rect x="635" y="249" width="425" height="53" rx="10" fill="#141e2b" stroke="#34465f"/><text x="660" y="284" font-size="26" fill="#edf3ff" text-anchor="start">0  XOR  1  =  1</text><rect x="635" y="313" width="425" height="53" rx="10" fill="#141e2b" stroke="#34465f"/><text x="660" y="348" font-size="26" fill="#edf3ff" text-anchor="start">1  XOR  0  =  1</text><rect x="635" y="377" width="425" height="53" rx="10" fill="#141e2b" stroke="#34465f"/><text x="660" y="412" font-size="26" fill="#edf3ff" text-anchor="start">1  XOR  1  =  0</text><text x="45" y="515" font-size="28" fill="#73e4a5" text-anchor="start">1 → 11 → 101 → 1111</text><text x="45" y="558" font-size="22" fill="#edf3ff" text-anchor="start">Каждый новый ряд строится из двух диагональных соседей сверху.</text><text x="45" y="593" font-size="21" fill="#a4b4cc" text-anchor="start">За краем этой учебной фигуры — нули. XOR: разные → 1, одинаковые → 0.</text></svg>