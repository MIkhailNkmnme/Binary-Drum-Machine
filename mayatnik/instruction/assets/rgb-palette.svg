or="start">Зелёный</text><text x="600" y="322" font-size="18" fill="#a4b4cc" text-anchor="start">Тек 0 · Лев 1 · Прав 0</text><rect x="850" y="165" width="250" height="185" rx="10" fill="#141e2b" stroke="#34465f"/><path d="M874 250 L933 185 L992 250 Z" fill="#00ffff" stroke="#8d9bb3" stroke-width="2"/><text x="1013" y="225" font-size="28" fill="#edf3ff" text-anchor="middle">011</text><text x="870" y="288" font-size="23" fill="#edf3ff" text-anchor="start">Голубой</text><text x="870" y="322" font-size="18" fill="#a4b4cc" text-anchor="start">Тек 0 · Лев 1 · Прав 1</text><rect x="40" y="370" width="250" height="185" rx="10" fill="#141e2b" stroke="#34465f"/><path d="M64 455 L123 390 L182 455 Z" fill="#ff0000" stroke="#8d9bb3" stroke-width="2"/><text x="203" y="430" font-size="28" fill="#edf3ff" text-anchor="middle">100</text><text x="60" y="493" font-size="23" fill="#edf3ff" text-anchor="start">Красный</text><text x="60" y="527" font-size="18" fill="#a4b4cc" text-anchor="start">Тек 1 · Лев 0 · Прав 0</text><rect x="310" y="370" width="250" height="185" rx="10" fill="#141e2b" stroke="#34465f"/><path d="M334 455 L393 390 L452 455 Z" fill="#ff00ff" stroke="#8d9bb3" stroke-width="2"/><text x="473" y="430" font-size="28" fill="#edf3ff" text-anchor="middle">101</text><text x="330" y="493" font-size="23" fill="#edf3ff" text-anchor="start">Пурпурный</text><text x="330" y="527" font-size="18" fill="#a4b4cc" text-anchor="start">Тек 1 · Лев 0 · Прав 1</text><rect x="580" y="370" width="250" height="185" rx="10" fill="#141e2b" stroke="#34465f"/><path d="M604 455 L663 390 L722 455 Z" fill="#ffff00" stroke="#8d9bb3" stroke-width="2"/><text x="743" y="430" font-size="28" fill="#edf3ff" text-anchor="middle">110</text><text x="600" y="493" font-size="23" fill="#edf3ff" text-anchor="start">Жёлтый</text><text x="600" y="527" font-size="18" fill="#a4b4cc" text-anchor="start">Тек 1 · Лев 1 · Прав 0</text><rect x="850" y="370" width="250" height="185" rx="10" fill="#141e2b" stroke="#34465f"/>