<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040" role="img" aria-labelledby="title desc">
<title id="title">Ромбо: все 16 сборок</title>
<desc id="desc">Верхний треугольник C сохраняется. Для каждого нижнего слота независимо выбирается L, R, L с горизонтальным отражением или R с горизонтальным отражением. Повторы L L и R R разрешены. Номер варианта равен ID плюс один.</desc>
<style>text{font-family:Arial,sans-serif;fill:#dfe6f5}.title{font-size:26px;font-weight:700}.note{font-size:15px}.card{fill:#10151d;stroke:#40516b}.head{font-size:17px;font-weight:700}.part{font-size:18px;font-weight:700;fill:#10151d}.axis{stroke:#dfe6f5;stroke-width:1;stroke-dasharray:4 3}.arrow{fill:none;stroke:#f9fcff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.notch{fill:#ffe486;stroke:#10151d;stroke-width:.7}</style>
<rect width="1040" height="1040" fill="#080b10"/>
<text class="title" x="20" y="38">Ромбо · 16 сборок</text>
<text class="note" x="20" y="67">C — исходный верх; L — левая часть; R — правая часть; ↔ — горизонтальное отражение.</text>
<text class="note" x="20" y="90">Стрелка и угловая метка показывают ориентацию. Ось и поворот задаются отдельно.</text>
