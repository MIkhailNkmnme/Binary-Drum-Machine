<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-label="Край: что означает ширина 2N / 4N / 6N / 8N"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73e4a5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif} .mono{font-family:Consolas,monospace}</style><rect width="1120" height="700" fill="#0c1119"/><text x="40" y="53" font-size="32" fill="#edf3ff" text-anchor="start">Край: что означает ширина 2N / 4N / 6N / 8N</text><text x="40" y="88" font-size="18" fill="#a4b4cc" text-anchor="start">Поясняющая схема · учебный пример</text><text x="40" y="132" font-size="24" fill="#a4b4cc" text-anchor="start">Высота N = 512 строк. Ширина W = kN − 1; центр — посередине.</text><text x="40" y="205" font-size="24" fill="#edf3ff" text-anchor="start">2N: 1023 клеток</text><rect x="600.0" y="175" width="180.0" height="48" rx="3" fill="#20364d" stroke="#7cbcff"/><path d="M690 166 L690 232" fill="none" stroke="#73e4a5" stroke-width="2" stroke-dasharray="7 6"/><text x="1040" y="205" font-size="22" fill="#a4b4cc" text-anchor="end">1024 шагов</text><text x="40" y="300" font-size="24" fill="#edf3ff" text-anchor="start">4N: 2047 клеток</text><rect x="510.0" y="270" width="360.0" height="48" rx="3" fill="#20364d" stroke="#7cbcff"/><path d="M690 261 L690 327" fill="none" stroke="#73e4a5" stroke-width="2" stroke-dasharray="7 6"/><text x="1040" y="300" font-size="22" fill="#a4b4cc" text-anchor="end">2048 шагов</text><text x="40" y="395" font-size="24" fill="#edf3ff" text-anchor="start">6N: 3071 клеток</text><rect x="420.0" y="365" width="540.0" height="48" rx="3" fill="#20364d" stroke="#7cbcff"/><path d="M690 356 L690 422" fill="none" stroke="#73e4a5" stroke-width="2" stroke-dasharray="7 6"/><text x="1040" y="395" font-size="22" fill="#a4b4cc" text-anchor="end">3072 шагов</text><text x="40" y="490" font-size="24" fill="#edf3ff" text-anchor="start">8N: 4095 клеток</text><rect x="330.0" y="460" width="720.0" height="48" rx="3" fill="#20364d" stroke="#7cbcff"/><path d="M690 451 L690 517" fill="none" stroke="#73e4a5" stroke-width="2" stroke-dasharray="7 6"/><text x="1040" y="490" font-size="22" fill="#a4b4cc" text-anchor="end">4096 шагов</text><text x="560" y="610" font-size="24" fill="#73e4a5" text-anchor="middle">Центр: столбец (W − 1) / 2 в нумерации с 0.</text><text x="560" y="649" font-size="21" fill="#a4b4cc" text-anchor="middle">Для W = 1023 / 2047 / 3071 / 4095: 511 / 1023 / 1535 / 2047.</text></svg>