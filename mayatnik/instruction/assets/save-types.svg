<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-label="Разные виды сохранения"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73e4a5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif} .mono{font-family:Consolas,monospace}</style><rect width="1120" height="690" fill="#0c1119"/><text x="40" y="53" font-size="32" fill="#edf3ff" text-anchor="start">Разные виды сохранения</text><text x="40" y="88" font-size="18" fill="#a4b4cc" text-anchor="start">Поясняющая схема · назначение типов сохранения</text><rect x="40" y="125" width="1040" height="78" rx="10" fill="#141e2b" stroke="#34465f"/><text x="65" y="173" font-size="27" fill="#73e4a5" text-anchor="start">Шаблон</text><text x="350" y="173" font-size="22" fill="#edf3ff" text-anchor="start">Отдельная фигура для повторного использования.</text><rect x="40" y="220" width="1040" height="78" rx="10" fill="#141e2b" stroke="#34465f"/><text x="65" y="268" font-size="27" fill="#73e4a5" text-anchor="start">Кадр</text><text x="350" y="268" font-size="22" fill="#edf3ff" text-anchor="start">Текущее состояние поля в библиотеке кадров.</text><rect x="40" y="315" width="1040" height="78" rx="10" fill="#141e2b" stroke="#34465f"/><text x="65" y="363" font-size="27" fill="#73e4a5" text-anchor="start">Настройки</text><text x="350" y="363" font-size="22" fill="#edf3ff" text-anchor="start">Параметры работы и представления.</text><rect x="40" y="410" width="1040" height="78" rx="10" fill="#141e2b" stroke="#34465f"/><text x="65" y="458" font-size="27" fill="#73e4a5" text-anchor="start">Ссылка</text><text x="350" y="458" font-size="22" fill="#edf3ff" text-anchor="start">Передача сцены через ссылку.</text><rect x="40" y="505" width="1040" height="78" rx="10" fill="#141e2b" stroke="#34465f"/><text x="65" y="553" font-size="27" fill="#73e4a5" text-anchor="start">Резервная копия</text><text x="350" y="553" font-size="22" fill="#edf3ff" text-anchor="start">Перенос и восстановление библиотек / данных.</text><text x="40" y="646" font-size="23" fill="#a4b4cc" text-anchor="start">Выбирайте тип сохранения по тому, что хотите вернуть позднее.</text></svg>