<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-label="Чётность и вложенные уровни"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73e4a5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif} .mono{font-family:Consolas,monospace}</style><rect width="1120" height="700" fill="#0c1119"/><text x="40" y="53" font-size="32" fill="#edf3ff" text-anchor="start">Чётность и вложенные уровни</text><text x="40" y="88" font-size="18" fill="#a4b4cc" text-anchor="start">Поясняющая схема · учебный пример</text><text x="40" y="137" font-size="25" fill="#edf3ff" text-anchor="start">Первый фильтр: оставить нечётные строки</text><text x="40" y="177" font-size="23" fill="#a4b4cc" text-anchor="start">Второй: заново считать только оставшиеся строки.</text><rect x="40" y="220" width="100" height="70" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="90" y="266" font-size="29" fill="#edf3ff" text-anchor="middle">1</text><text x="90" y="332" font-size="25" fill="#73e4a5" text-anchor="middle">1</text><rect x="40" y="365" width="100" height="60" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="90" y="405" font-size="26" fill="#edf3ff" text-anchor="middle">1</text><rect x="156" y="220" width="100" height="70" rx="10" fill="#17202c" stroke="#34465f"/><text x="206" y="266" font-size="29" fill="#a4b4cc" text-anchor="middle">2</text><rect x="272" y="220" width="100" height="70" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="322" y="266" font-size="29" fill="#edf3ff" text-anchor="middle">3</text><text x="322" y="332" font-size="25" fill="#73e4a5" text-anchor="middle">2</text><rect x="388" y="220" width="100" height="70" rx="10" fill="#17202c" stroke="#34465f"/><text x="438" y="266" font-size="29" fill="#a4b4cc" text-anchor="middle">4</text><rect x="504" y="220" width="100" height="70" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="554" y="266" font-size="29" fill="#edf3ff" text-anchor="middle">5</text><text x="554" y="332" font-size="25" fill="#73e4a5" text-anchor="middle">3</text><rect x="504" y="365" width="100" height="60" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="554" y="405" font-size="26" fill="#edf3ff" text-anchor="middle">5</text><rect x="620" y="220" width="100" height="70" rx="10" fill="#17202c" stroke="#34465f"/><text x="670" y="266" font-size="29" fill="#a4b4cc" text-anchor="middle">6</text><rect x="736" y="220" width="100" height="70" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="786" y="266" font-size="29" fill="#edf3ff" text-anchor="middle">7</text><text x="786" y="332" font-size="25" fill="#73e4a5" text-anchor="middle">4</text><rect x="852" y="220" width="100" height="70" rx="10" fill="#17202c" stroke="#34465f"/><text x="902" y="266" font-size="29" fill="#a4b4cc" text-anchor="middle">8</text><rect x="968" y="220" width="100" height="70" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="1018" y="266" font-size="29" fill="#edf3ff" text-anchor="middle">9</text><text x="1018" y="332" font-size="25" fill="#73e4a5" text-anchor="middle">5</text><rect x="968" y="365" width="100" height="60" rx="10" fill="#254c3e" stroke="#73e4a5"/><text x="1018" y="405" font-size="26" fill="#edf3ff" text-anchor="middle">9</text><text x="40" y="468" font-size="29" fill="#73e4a5" text-anchor="start">1, 3, 5, 7, 9…  →  1, 5, 9…</text><text x="40" y="520" font-size="23" fill="#edf3ff" text-anchor="start">«Заполнить пустоты»: показать копию ближайшей видимой строки.</text><rect x="40" y="550" width="250" height="55" rx="10" fill="#233249" stroke="#34465f"/><text x="165" y="586" font-size="21" fill="#edf3ff" text-anchor="middle">Стр. 1: A</text><rect x="308" y="550" width="250" height="55" rx="10" fill="#233249" stroke="#34465f"/><text x="433" y="586" font-size="21" fill="#edf3ff" text-anchor="middle">Стр. 2: копия A</text><rect x="576" y="550" width="250" height="55" rx="10" fill="#233249" stroke="#34465f"/><text x="701" y="586" font-size="21" fill="#edf3ff" text-anchor="middle">Стр. 3: B</text><rect x="844" y="550" width="250" height="55" rx="10" fill="#233249" stroke="#34465f"/><text x="969" y="586" font-size="21" fill="#edf3ff" text-anchor="middle">Стр. 4: копия B</text><text x="40" y="650" font-size="23" fill="#a4b4cc" text-anchor="start">Это преобразование показа. Исходное поле сохраняется.</text></svg>