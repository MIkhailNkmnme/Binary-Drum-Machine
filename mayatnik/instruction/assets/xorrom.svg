<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240"><rect width="640" height="240" fill="#0b1118"/><g fill="#e4eaf4" font-family="system-ui,sans-serif" font-size="15"><text x="20" y="26">Строка: биты и RGB-соседи</text><text x="356" y="26">Один шаг музыки</text></g><g font-family="monospace" font-size="24" text-anchor="middle"><g fill="#1b2430" stroke="#8895aa"><rect x="35" y="50" width="60" height="45"/><rect x="95" y="50" width="60" height="45"/><rect x="155" y="50" width="60" height="45"/></g><g fill="#fff"><text x="65" y="80">0</text><text x="125" y="80">1</text><text x="185" y="80">0</text></g><g stroke="#c9d5e2"><rect x="35" y="105" width="60" height="38" fill="#0000ff"/><rect x="95" y="105" width="60" height="38" fill="#ff0000"/><rect x="155" y="105" width="60" height="38" fill="#00ff00"/></g><g fill="#fff" font-size="16"><text x="65" y="130">1</text><text x="125" y="130">4</text><text x="185" y="130" fill="#000">2</text></g></g><path d="M246 98H325m-10-9 10 9-10 9" stroke="#c29bff" stroke-width="2" fill="none"/><g fill="#e4eaf4" font-family="system-ui,sans-serif" font-size="18"><text x="356" y="77">Аккорд 3 → До + Ре + Фа</text><text x="356" y="112">Аккорд 1 → До</text><text x="356" y="147" font-size="13">При равенстве частот — меньший код.</text><text x="20" y="184" font-size="14">Следующий шаг читает следующую строку; код 0 — пауза.</text><text x="20" y="213" font-size="14">120 BPM + 1/8 = 4 строки в секунду.</text></g></svg>