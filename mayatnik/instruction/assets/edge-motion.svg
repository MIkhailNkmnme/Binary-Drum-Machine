<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1350" viewBox="0 0 1120 1350" role="img" aria-label="Перескок при маятниковом порядке вершин"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73e4a5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif}</style><rect width="1120" height="1350" fill="#0c1119"/><text x="40" y="53" font-size="30" fill="#edf3ff" text-anchor="start">Перескок: повтор цикла или продолжение без сброса</text><text x="40" y="89" font-size="22" fill="#a4b4cc" text-anchor="start">Без пары · ЛевПрав · N = 8 · W = 15 · центр — столбец 8 (нумерация 1…15).</text><text x="40" y="140" font-size="25" fill="#73e4a5" text-anchor="start">Сначала одинаково: от центра к краям, затем перескок</text><rect x="190" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="215" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">1</text><rect x="246" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="271" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">2</text><rect x="302" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="327" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">3</text><rect x="358" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="383" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">4</text><rect x="414" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="439" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">5</text><rect x="470" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="495" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">6</text><rect x="526" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="551" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">7</text><rect x="582" y="165" width="51" height="48" rx="5" fill="#2d5344" stroke="#52647e"/><text x="607" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">8</text><rect x="638" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="663" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">9</text><rect x="694" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="719" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">10</text><rect x="750" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="775" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">11</text><rect x="806" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="831" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">12</text><rect x="862" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="887" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">13</text><rect x="918" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="943" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">14</text><rect x="974" y="165" width="51" height="48" rx="5" fill="#182436" stroke="#52647e"/><text x="999" y="197" font-size="22" fill="#edf3ff" text-anchor="middle">15</text><path d="M600 235 L217 235" fill="none" stroke="#73e4a5" stroke-width="3" marker-end="url(#a)"/><path d="M617 235 L996 235" fill="none" stroke="#73e4a5" stroke-width="3" marker-end="url(#a)"/><text x="608" y="278" font-size="25" fill="#edf3ff" text-anchor="middle">8, 7, 9, 6, 10, …, 1, 15, 15</text><text x="40" y="335" font-size="25" fill="#73e4a5" text-anchor="start">Ход 16: смещение −8 переносится на другой край</text><rect x="300" y="360" width="210" height="110" rx="5" fill="#182436" stroke="#52647e"/><text x="405" y="391" font-size="24" fill="#edf3ff" text-anchor="middle">−7</text><text x="405" y="434" font-size="30" fill="#73e4a5" text-anchor="middle">1</text><text x="405" y="459" font-size="16" fill="#a4b4cc" text-anchor="middle">ход 14</text><rect x="535" y="360" width="210" height="110" rx="5" fill="#182436" stroke="#52647e"/><text x="640" y="391" font-size="24" fill="#edf3ff" text-anchor="middle">+7</text><text x="640" y="434" font-size="30" fill="#73e4a5" text-anchor="middle">15</text><text x="640" y="459" font-size="16" fill="#a4b4cc" text-anchor="middle">ход 15</text><rect x="770" y="360" width="210" height="110" rx="5" fill="#3a2847" stroke="#52647e"/><text x="875" y="391" font-size="24" fill="#edf3ff" text-anchor="middle">−8</text><text x="875" y="434" font-size="30" fill="#73e4a5" text-anchor="middle">15</text><text x="875" y="459" font-size="16" fill="#a4b4cc" text-anchor="middle">ход 16: перескок</text><text x="40" y="391" font-size="20" fill="#a4b4cc" text-anchor="start">Смещение</text><text x="40" y="434" font-size="20" fill="#a4b4cc" text-anchor="start">Столбец</text><text x="40" y="505" font-size="22" fill="#edf3ff" text-anchor="start">Ход 16: −8 переносится в столбец 15. Дальше всё зависит от «Без сброса».</text><text x="40" y="555" font-size="25" fill="#ffbd5b" text-anchor="start">«Без сброса» выключено — прежний режим по умолчанию</text><rect x="190" y="580" width="840" height="64" rx="5" fill="#2b3043" stroke="#52647e"/><text x="610" y="622" font-size="25" fill="#ffbd5b" text-anchor="middle">…1, 15, 15 | новый цикл: 8, 7, 9…</text><text x="40" y="681" font-size="22" fill="#a4b4cc" text-anchor="start">Счётчик хода снова 0, поле сохраняется; первый новый конус — в центре.</text><text x="40" y="733" font-size="25" fill="#73e4a5" text-anchor="start">«Без сброса» включено — номер хода продолжает расти</text><rect x="270" y="756" width="220" height="95" rx="5" fill="#234137" stroke="#52647e"/><text x="380" y="786" font-size="22" fill="#edf3ff" text-anchor="middle">Ход 17 · +8</text><text x="380" y="830" font-size="25" fill="#73e4a5" text-anchor="middle">Столбец 1</text><rect x="510" y="756" width="220" height="95" rx="5" fill="#234137" stroke="#52647e"/><text x="620" y="786" font-size="22" fill="#edf3ff" text-anchor="middle">Ход 18 · −9</text><text x="620" y="830" font-size="25" fill="#73e4a5" text-anchor="middle">Столбец 14</text><rect x="750" y="756" width="220" height="95" rx="5" fill="#234137" stroke="#52647e"/><text x="860" y="786" font-size="22" fill="#edf3ff" text-anchor="middle">Ход 19 · +9</text><text x="860" y="830" font-size="25" fill="#73e4a5" text-anchor="middle">Столбец 2</text><text x="40" y="895" font-size="23" fill="#edf3ff" text-anchor="start">…1, 15, 15, 1, 14, 2, 13, 3… — диапазон плеера расширяется.</text><text x="40" y="935" font-size="22" fill="#a4b4cc" text-anchor="start">Позже −15 и +15 попадут в центр 8 по модулю; это НЕ сброс счётчика.</text><text x="40" y="977" font-size="23" fill="#ffbd5b" text-anchor="start">Переключение режима начинает новый опыт с кадра 0.</text><text x="40" y="1014" font-size="22" fill="#a4b4cc" text-anchor="start">Предел: 1 048 576 кадров → пауза и сообщение, без автоматического сброса.</text><g transform="translate(0 280)"><text x="40" y="765" font-size="25" fill="#edf3ff" text-anchor="start">Отскок: отдельное текущее правило размещения</text><text x="40" y="805" font-size="21" fill="#a4b4cc" text-anchor="start">Сначала столбец берётся по модулю W; затем правая половина отражается в левую.</text><text x="40" y="840" font-size="21" fill="#a4b4cc" text-anchor="start">При W = 15 вершины попадают в столбцы 1…8. Это не обычный симметричный обход.</text><text x="40" y="900" font-size="25" fill="#edf3ff" text-anchor="start">«Концы»: показать два края рядом через шов</text><rect x="170" y="925" width="390" height="60" rx="5" fill="#3c3155" stroke="#52647e"/><rect x="560" y="925" width="390" height="60" rx="5" fill="#243f4e" stroke="#52647e"/><text x="365" y="963" font-size="23" fill="#edf3ff" text-anchor="middle">Правый край поля</text><text x="755" y="963" font-size="23" fill="#edf3ff" text-anchor="middle">Левый край поля</text><path d="M560 915V995" stroke="#ff87cf" stroke-width="4"/><text x="560" y="1030" font-size="21" fill="#a4b4cc" text-anchor="middle">Шов: справа в поле → через границу → слева в поле</text></g></svg>