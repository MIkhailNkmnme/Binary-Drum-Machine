="295" width="43" height="43" rx="5" fill="#73e4a5" stroke="#34465f"/><rect x="900" y="340" width="43" height="43" rx="5" fill="#26384f" stroke="#34465f"/><rect x="945" y="340" width="43" height="43" rx="5" fill="#26384f" stroke="#34465f"/><rect x="990" y="340" width="43" height="43" rx="5" fill="#73e4a5" stroke="#34465f"/><text x="965" y="421" fill="#a4b4cc" font-size="18" text-anchor="middle">Сохранить опору</text><text x="40" y="535" fill="#73e4a5" font-size="28" text-anchor="start">МЕРИТЬ → Наложение</text><text x="40" y="580" fill="#edf3ff" font-size="24" text-anchor="start">×2 и ×3 показывают увеличение одного исходного снимка.</text><text x="40" y="622" fill="#a4b4cc" font-size="23" text-anchor="start">«Оригинал»: совместить сетки оригинала и закреплённой копии бит в бит.</text><text x="40" y="664" fill="#a4b4cc" font-size="22" text-anchor="start">Здесь показан принцип. Размеры и расположение панелей условные.</text></svg>