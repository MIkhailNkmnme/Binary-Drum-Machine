<!-- Zerkalius Маятник — v0.023. XOR-маятник из Excel (_pzl.xlsm, модуль ТРЕУГСЖАТИЯ, листы «Лист19…»): конусы правила 90 от вершин якорь, −1, +1, −2, +2… -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerkalius Маятник — v0.023</title>
<!--
  ═══ МАЯТНИК (заведён 2026-10-11) ═════════════════════════════════════
  Перенос макросов ТРЕУГСЖАТИЯ из _pzl.xlsm (кнопки «Вниз», «вправо», «лево», «лево-право», «Анимация»
  на листах «Лист19 (3…6)»). Слово пользователя: «нужно маятника на 512 строк в зеркалиус проект куда
  нибудь, выбери где не будет тормозить строки, там генерировать». Поэтому отдельная страница: поле —
  типизированные массивы, рисунок — один ImageData на холсте (пиксель = бит), без DOM-клеток.

  Правило клетки конуса (CoreBuilder, «СТРОИМ ВНИЗ»), перенесено дословно:
    новое = старое ⊕ левый родитель ⊕ правый родитель; родитель, совпавший с вершиной, всегда 1;
    пустая вершина становится 1; родители читаются из строки выше уже пересчитанными.
  Цвет («мерцание»): клетка была пустой — чёрная (здесь: светлая); была красной или синей — чёрная;
    была чёрной — синяя, если стала 1, красная, если стала 0.
  Маятник (MacroSequencePendulumStepByStep): вершины якорь, −1, +1, −2, +2, … в одной строке.
  v0.002: при «Построить» поле перерисовывается раз в секунду, ползунок «кадр» (опорные кадры), масштаб колесом / пальцами.
  v0.003: обводка «шумной» зоны (ступенчатая, по данным); готовые кнопки «хорр» 256 / 512 / 1024 / 2024 / 4096; предел строк 2048 → 4096.
  v0.004: обрезка на N/3 — кнопка «N/3» и галочка «до N/3» для кнопок «хорр» (до гибели последней дыры).
  v0.005: кнопка «4N» — до застывания картинки (к 4N вершинам новые конусы уже не достают до конуса якоря); вершин до 16384.
  v0.006: цвет не хранится, а считается по формуле — чётность числа конусов над клеткой (сверено с прежним хранимым цветом на 15,3 млн клеток):
    поле 5 байт на клетку вместо 6, расчёт на ~20 % быстрее, опорные кадры вдвое меньше.
  v0.007: флажок «симметрия» — вертикали зеркальной симметрии и края их зон по строкам (расширение «маятником»).
  v0.008: общее ядро с зеркальным маятником Зеркалиуса; математическое правило сохранено.
  v0.011: выбранная ось → Соляриус; размер, точный счёт 0/1, цифры при приближении, угловатые кнопки Синхрофазотрона.
  v0.012: переключатель «по очереди / пара сразу»: пара вершин ±m одним проходом (MAYATNIK.conePair), кадр = пара, кадр 0 — только якорь;
    цвет перекрытий для пар — MAYATNIK.tintPair. Пара сразу даёт зеркальный на 100 % Хоррориус без шума.
  v0.013: вид «ромбы · чётная / нечётная» — одна из двух независимых решёток ромбами впритык (раздел 24 «Исследования»);
    холст — RK пикселей на клетку, при приближении — чёткие ромбы поверх, с 14 px — с цифрами.
  v0.014: при построении (и сбросе, «хорр», переключении пары) поле прокручивается к оси якоря посередине, сверху — вершина.
  v0.015: кнопка «кратный ×2» (по умолчанию вкл) — масштаб только 2^k пикселей монитора на бит: без муара двух решёток при уменьшении.
  v0.016: вид «ромбы · обе рядом» — два Хоррориуса на одном холсте: слева чётная решётка, справа нечётная, между ними вертикаль.
  v0.017: уменьшенную картинку строит страница (present), холст пиксель в пиксель и по пикселям монитора — ничего не «плывёт» под курсором.
  v0.018: «показ строк» и окно показа: верхние N строк, по ширине — до куда к этому кадру достали конусы; «обе рядом» при малом N — крупно.
  v0.019: «Диагонали .txt» — ромбы построчно: правые ↘ и левые ↙ диагонали чётной и нечётной решёток, окно показа текущего кадра.
  v0.020: галка «без полос» — в виде только зона шума (от крайнего «0» до крайнего «0» в строке), окно обрезается по ней.
  v0.021: кнопка «👓 Очки» — сверху вниз ищет строки начальной последовательности в рядах решёток; найденное — жёлтым, список под панелью.
  v0.022: «Очки» по диагоналям ромбов (↘ ↙, по умолчанию) или по рядам — выбор рядом с кнопкой; галки «инверс» и «реверс» — искать и варианты.
  v0.023: «без полос» на ромбах — срезанные ромбы у края зоны (справа, слева, у вершины) контуром со своей цифрой, окно на ромб шире;
    «Очки» при загрузке всегда выключены.
  Сверено с Excel 2026-10-11: 9 шагов маятника, конусы по 128 строк — 35 968 значений и 2 440 цветов совпали клетка в клетку.
  ═════════════════════════════════════════════════════════════════════
-->
<style>

  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.02em}

.lg i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}

/* v0.011: controls in the angular language of Synchrophasotron. */
.bar button,.bar a{--key:#7cbcff;--t:9.24px;position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 calc(var(--t) + 8px);border:0;border-radius:0;clip-path:polygon(var(--t) 0,calc(100% - var(--t)) 0,100% 50%,calc(100% - var(--t)) 100%,var(--t) 100%,0 50%);background:color-mix(in srgb,var(--key) 70%,var(--panel));color:var(--key);font:12px var(--mono);text-decoration:none;white-space:nowrap;touch-action:manipulation}

#pairSw{gap:0}#pairSw.off{opacity:.45}

#ochkiBox[hidden]{display:none}#ochkiBox summary{cursor:pointer;color:#ffb347}#ochkiList{max-height:180px;overflow:auto;white-space:pre;color:var(--mute)}

</style>

<body>
<header>
  <h1 id="appTitle">Маятник</h1><span class="ver">v0.023</span>
  <p class="sub">XOR-маятник из Excel (ТРЕУГСЖАТИЯ): каждая вершина пускает вниз конус правила 90, клетка = старое ⊕ левый ⊕ правый родитель. Вершины идут якорь, −1, +1, −2, +2…</p>
</header>
<div class="bar">
  <div class="grp">
    <label>строк <input id="rows" type="number" min="8" max="4096" step="1" value="512"></label>
    <label>вершин <input id="steps" type="number" min="1" max="16384" step="1" value="512"></label>
    <button id="bThird" title="Вершин = N/3 с запасом: ровно до гибели последней дыры (раздел 14¾ «Исследования»)">N/3</button><button id="bFour" title="Вершин = 4N: дальше новые конусы не достают до конуса якоря, картинка застывает (раздел 14⅞)">4N</button>
    <span class="grp" title="Сразу построить маятник: строк = N, вершин = N (или N/3, если отмечено «до N/3»)">хорр <button class="pre" data-n="256">256</button><button class="pre" data-n="512">512</button><button class="pre go" data-n="1024">1024</button><button class="pre go" data-n="2024">2024</button><button class="pre" data-n="4096" title="~10 минут, ~0,5 ГБ памяти">4096</button>
      <label title="Кнопки «хорр» строят не N вершин, а N/3 с запасом — до гибели последней дыры; дальше кадры почти одинаковый шум"><input id="third" type="checkbox"> до N/3</label></span>
    <label>ход <select id="mode">
      <option value="pend">лево-право (маятник)</option>
      <option value="right">вправо</option>
      <option value="left">влево</option>
      <option value="one">одна вершина</option>
    </select></label>
    <span class="grp" id="pairSw" title="Как ставить пару вершин −m, +m. «По очереди» — сперва влево, потом вправо (кадр = одна вершина). «Пара сразу» — оба конуса одним проходом (кадр = пара, кадр 0 — только якорь, чистый Серпинский); пара m — вершины ±m, «вершин N» — маятник до ±N/2. Только для хода «лево-право»."><button id="bSeq" aria-pressed="true">по очереди</button><button id="bPair" aria-pressed="false">пара сразу</button></span>
    <label>поле <select id="bg">
      <option value="empty">пустое</option>
      <option value="1">все 1</option>
      <option value="0">все 0</option>
    </select></label>
  </div>
  <div class="grp">
    <button id="bBuild" class="go" title="Посчитать сразу все вершины">Построить</button>
    <button id="bPlay" aria-pressed="false" title="Анимация: вершина за вершиной (пробел)">▶ Анимация</button>
    <button id="bStep" title="Одна вершина (→)">+1 вершина</button>
    <button id="bReset" title="Очистить поле">Очистить</button>
    <label>скорость <input id="speed" type="range" min="1" max="32" value="4"></label>
  </div>
  <div class="grp">
    <label>вид <select id="view">
      <option value="col">цвета перекрытий</option>
      <option value="bits">только биты</option>
      <option value="digits">цифры 0/1</option>
      <option value="romb0" title="Чётная решётка (столбец − строка от якоря чётное): её пишут вершины 0, ±2, ±4… Ромбы впритык">ромбы · чётная (якорь)</option>
      <option value="romb1" title="Нечётная решётка: её пишут вершины ±1, ±3… Ромбы впритык">ромбы · нечётная</option>
      <option value="romb2" title="Два Хоррориуса рядом: слева чётная решётка (вершины 0, ±2…), справа нечётная (±1, ±3…), между ними — вертикаль">ромбы · обе рядом</option>
    </select></label>
    <label title="Сколько верхних строк показывать (пусто — все). По ширине показ всегда обрезан до того, куда к этому кадру достали конусы, — при малом числе строк картинка (и обе половины «обе рядом») помещается крупно">показ строк <input id="vrows" type="number" min="0" max="4096" step="1" placeholder="все" style="width:64px"></label>
    <label title="Только в виде: в каждой строке — зона шума от крайнего левого до крайнего правого «0» (та же граница, что у «обводки»); сплошные единицы полос по бокам не рисуются, окно показа обрезается по зоне — картинка крупнее. Поле не меняется"><input id="noband" type="checkbox"> без полос</label>
    <button id="bOchki" aria-pressed="false" title="Очки: сверху вниз ищут в кадре строки начальной последовательности (1, 1, 11, 111, 1000…) — в рядах решёток, клетки через одну, как строки треугольника. Найденная строка больше ниже не ищется; так до последней. Найденное — жёлтым (1) и коричневым (0), список — под панелью. Только видимое: окно показа и, при «без полос», зона шума">👓 Очки</button>
    <select id="ochkiMode" title="Где «Очки» ищут строки последовательности: по диагоналям ромбов (↘ и ↙ каждой решётки, сверху вниз — как в «Диагонали .txt») или по рядам решёток (клетки через одну, как строки треугольника)"><option value="diag">по диагоналям</option><option value="row">по рядам</option></select>
    <label title="«Очки» ищут ещё и инверсию строки последовательности (0 ↔ 1)"><input id="ochkiInv" type="checkbox"> инверс</label>
    <label title="«Очки» ищут ещё и строку задом наперёд; с «инверсом» — и инверсию задом наперёд"><input id="ochkiRev" type="checkbox"> реверс</label>
    <label title="Жёлтая ступенчатая линия по краю «шумной» зоны: в каждой строке — крайний левый и крайний правый бит, отличный от фона полос"><input id="outline" type="checkbox"> обводка</label>
    <label title="Линии зеркальной симметрии: оранжевые — вертикальные оси (узор зеркален ≥ 6 клеток в обе стороны ≥ 8 строк подряд), голубые — края зеркальной зоны по строкам (расширение «маятником»: смена бита справа, слева; не сошлось — шаг влево, шаг вправо, иначе стоп). Считаются, когда кадр стоит."><input id="sym" type="checkbox"> симметрия</label>
    <span class="grp" title="Колесо — масштаб к курсору, тянуть мышью — сдвиг, двойной щелчок или 0 — по ширине; на телефоне — двумя пальцами">
      <button id="zOut" aria-label="Отдалить">−</button><output id="zoomV" class="ver" style="min-width:52px;text-align:center">100%</output><button id="zIn" aria-label="Приблизить">+</button>
      <button id="zFit">по ширине</button><button id="zSnap" aria-pressed="true" title="Масштаб только кратный двум: 2ⁿ пикселей монитора на бит (… 25 %, 50 %, 100 %, 2×, 4× …). При уменьшении экран берёт бит под серединой пикселя; при шаге ровно 2, 4… бита выборка не соскальзывает между двумя решётками кадра — без муара (крупной шахматки). Растяжение экрана Windows учтено. Выкл — плавный масштаб">кратный ×2</button>
    </span>
    <label title="Любой кадр: состояние поля после N вершин (← → — на кадр назад / вперёд)">кадр <input id="frame" type="range" min="0" max="512" value="0" style="width:180px"> <output id="frameV" class="ver">0</output></label>
    <button id="bTxt" title="Строки поля текстом: 0 и 1, пустые клетки — точка">Строки .txt</button>
    <button id="bDiag" title="Ромбы построчно: у каждой решётки (чётная — вершины 0, ±2…, нечётная — ±1, ±3…) ромбы стоят рядами по диагоналям. В файле — правые диагонали ↘ и левые ↙ обеих решёток; строка — одна диагональ сверху вниз, диагонали слева направо. Текущий кадр, окно показа">Диагонали .txt</button>
    <a href="../zazerkalius/Zerkalius-zazerkalius.html?mayatnik=1#zerkalius" style="color:var(--acc)">Зеркальный маятник</a>
    <button id="bPng" title="Картинка поля, пиксель = бит">PNG</button>
    <button id="bAxisPick" aria-pressed="false" title="Остановить кадр, показать оси симметрии и выбрать ось щелчком или касанием">Выбрать ось</button>
    <button id="bKonus" disabled title="Сначала выбери ось на поле">◯ в Соляриус</button>

    wrap.scrollLeft += n.left + fx * n.width - x; wrap.scrollTop += n.top + fy * n.height - y;
  }
  function fit() { st.zoom = 'fit'; save(); layout(); thick(); wrap.scrollLeft = 0; wrap.scrollTop = 0; }
  let lastT = 0;   // толщина обводки зависит от масштаба — перерисовать, только когда она поменялась
  function thick() { const t = Math.max(1, Math.ceil(1.5 / scale())); if ((st.outline || st.sym) && f && t !== lastT && !playing) { lastT = t; draw(); } }
  // «Построить» — те же вершины, порциями по ~40 мс на кадр: страница не замирает, виден прогресс.
  // v0.002: при «Построить» большое поле (2024 × 6070 = 12 млн пикселей) перерисовывается не каждый кадр, а раз в секунду —
  // прежде перерисовка съедала почти всё время, и 2024 вершины шли ~8 минут. Считается при этом каждая вершина;
  // «▶ Анимация» по-прежнему показывает каждый кадр (скорость 1 = вершина на кадр).
  let fast = false, t0 = 0, lastDraw = 0;
  function build() {
    reset(); fast = true; t0 = performance.now(); play();
  }
  const more = () => k < target && addOne();
  function tick() {

    if (fast) { const t = performance.now(), budget = document.hidden ? 400 : 40; while (performance.now() - t < budget) if (!more()) { stop(); break; } }
    else for (let n = 0; n < st.speed; n++) if (!more()) { stop(); break; }
    if (k >= target) stop();
    const now = performance.now(), big = f.val.length > 2e6;
    if (!playing || !fast || !big || now - lastDraw > 1000) { draw(); lastDraw = now; }   // «▶ Анимация» рисует каждый кадр
    else status();

    if (playing) next();
  }
  function play() {
    if (playing) { stop(); return; }
    if (!f) reset();
    else if (k >= total()) { clearKonus(); const o = snaps.get(0); f.val.set(o.val); k = 0; }   // повтор с кадра 0
    target = total();
    playing = true; $('bPlay').setAttribute('aria-pressed', 'true'); $('bPlay').textContent = 'Ⅱ Пауза';
    next();
  }
  // v0.003: быстрое построение — на таймере, а не на кадрах: в скрытой вкладке кадры не идут, и расчёт стоял;
  // таймер в фоне браузер замедляет до раза в секунду, поэтому там порция больше (400 мс)
  let timer = 0;
  function next() { if (fast) timer = setTimeout(tick, 0); else raf = requestAnimationFrame(tick); }
  function stop() {
    playing = false; fast = false; cancelAnimationFrame(raf); raf = 0; clearTimeout(timer); timer = 0;
    $('bPlay').setAttribute('aria-pressed', 'false'); $('bPlay').textContent = '▶ Анимация';
  }

  function rowsText() {
    const { W, H, val } = f, out = [];
    for (let r = 0; r < H; r++) {
      let s = '';
      for (let c = 0; c < W; c++) { const v = val[r * W + c]; s += v < 0 ? '.' : v; }
      out.push(s.replace(/\.+$/, ''));
    }
    return out.join('\n') + '\n';
  }
  function download(name, blob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  const fname = ext => `mayatnik-${st.mode}${pairOn() ? '-para' : ''}-${st.rows}x${total()}-${st.bg}.${ext}`;

  $('bBuild').onclick = build;
  // v0.003: готовые кнопки — строк = вершин = N, ход «лево-право», сразу «Построить»
  document.querySelectorAll('button.pre').forEach(b => b.onclick = () => {
    const N = +b.dataset.n; $('rows').value = N; $('steps').value = st.third ? thirdOf(N) : N; $('mode').value = 'pend'; build();
  });
  // v0.004: обрезка на N/3 — центральная дыра гибнет при n = N/3 (верх N/2 + n/2 встречает кончик N − n); запас N/64 — чтобы увидеть, как она закрылась
  function thirdOf(N) { return Math.ceil(N / 3) + Math.ceil(N / 64); }
  $('bThird').onclick = () => { $('steps').value = thirdOf(clampInt($('rows').value, 8, 4096, 512)); $('mode').value = 'pend'; build(); };
  // v0.005: 4N — конец ленты: вершина a трогает конус якоря только при |a| ≤ 2(N − 1), крайняя стоит на ±n/2
  $('bFour').onclick = () => { $('steps').value = 4 * clampInt($('rows').value, 8, 4096, 512); $('mode').value = 'pend'; build(); };
  $('third').addEventListener('change', () => { st.third = $('third').checked; save(); });
  $('noband').addEventListener('change', () => { st.noband = $('noband').checked; save(); if (f) draw(); });   // v0.020: «без полос»
  $('ochkiMode').addEventListener('change', () => { st.ochkiMode = $('ochkiMode').value; save(); ochki = null; if (f) draw(); });   // v0.022
  for (const id of ['ochkiInv', 'ochkiRev']) $(id).addEventListener('change', () => { st[id] = $(id).checked; save(); ochki = null; if (f) draw(); });
  $('bOchki').onclick = () => { st.ochki = !st.ochki; save(); $('bOchki').setAttribute('aria-pressed', String(st.ochki)); if (f) draw(); };   // v0.021
  $('vrows').addEventListener('change', () => {   // v0.018: «показ строк» — только показ, поле не пересчитывается
    st.vrows = clampInt($('vrows').value || 0, 0, 4096, 0); $('vrows').value = st.vrows || ''; save(); if (f) draw();
  });
  // v0.012: переключатель «по очереди / пара сразу». Пересчёт с того же места: k вершин ↔ (k − 1)/2 пар.
  function pairSync() {
    const on = pairOn();
    $('bSeq').setAttribute('aria-pressed', String(!on)); $('bPair').setAttribute('aria-pressed', String(on));
    $('pairSw').classList.toggle('off', st.mode !== 'pend');
    $('bStep').textContent = on ? '+1 пара' : '+1 вершина';
    $('bStep').title = on ? 'Одна пара: вершины −m и +m сразу (→)' : 'Одна вершина (→)';
    $('bPlay').title = on ? 'Анимация: пара за парой (пробел)' : 'Анимация: вершина за вершиной (пробел)';
    $('frame').parentElement.title = on ? 'Любой кадр: поле после N пар, 0 — только якорь (← → — на кадр назад / вперёд)'
      : 'Любой кадр: состояние поля после N вершин (← → — на кадр назад / вперёд)';
  }
  function pairSet(on) {
    if (f && st.mode === 'pend' && !!st.pair === on) return;
    const was = f ? pairOn() : false, kk = k;
    st.pair = on; $('mode').value = 'pend'; save();
    reset();
    const now = pairOn();
    goTo(was === now ? kk : now ? Math.max(0, (kk - 1) >> 1) : 2 * kk + 1);
  }
  $('bSeq').onclick = () => pairSet(false);
  $('bPair').onclick = () => pairSet(true);
  $('bPlay').onclick = () => { fast = false; t0 = 0; play(); };
  $('bStep').onclick = () => goTo(k + 1);
  // Ползунок кадра: на небольшом поле — сразу при движении, на большом — когда отпустили
  $('frame').addEventListener('input', () => { const t = +$('frame').value; $('frameV').textContent = t; if (f && f.val.length <= 2e6) goTo(t); });
  $('frame').addEventListener('change', () => goTo(+$('frame').value));
  $('bReset').onclick = reset;
  $('bTxt').onclick = () => { if (f) download(fname('txt'), new Blob([rowsText()], { type: 'text/plain' })); };
  // v0.019: «выгрузить построчно как ромбы — левые и правые диагонали, у обеих сеток», «txt». Ромб касается соседей сторонами
  // вдоль двух диагоналей: правая ↘ — столбец − строка постоянно, левая ↙ — столбец + строка постоянно. Клетки решётки p —
  // (столбец − якорь − строка) той же чётности, что p. Строка файла — одна диагональ сверху вниз (непустые клетки идут подряд),
  // диагонали — слева направо по месту в верхней строке; берётся окно показа текущего кадра.
  function diagText() {
    const { W, val } = f, A = geo.anchor, out = [];
    out.push(`# Маятник: ${st.rows} строк, кадр ${k}${pairOn() ? ' (пара сразу)' : ''}, показ ${VH} строк, столбцы ${VX - A} … ${VX + VW - 1 - A} от якоря`);
    out.push('# Ромбы построчно: строка — одна диагональ сверху вниз (1 / 0), диагонали — слева направо');
    for (const p of [0, 1]) for (const [name, dir] of [['правые диагонали ↘ (столбец − строка постоянно)', 1], ['левые диагонали ↙ (столбец + строка постоянно)', -1]]) {
      out.push('', `# ${p ? 'нечётная решётка (вершины ±1, ±3…)' : 'чётная решётка (вершины 0, ±2…)'} — ${name}`);
      const lines = new Map();
      for (let r = 0; r < VH; r++) for (let c = VX; c < VX + VW; c++) {
        if (((c - A - r - p) % 2 + 2) % 2) continue;
        const v = val[r * W + c]; if (v < 0) continue;
        const key = dir > 0 ? c - r : c + r, a = lines.get(key);
        if (a) a.push(v); else lines.set(key, [v]);

      for (const key of [...lines.keys()].sort((x, y) => x - y)) out.push(lines.get(key).join(''));
    }
    return out.join('\n') + '\n';
  }
  $('bDiag').onclick = () => { if (f) download(fname('txt').replace(/\.txt$/, `-diagonali-kadr${k}.txt`), new Blob([diagText()], { type: 'text/plain' })); };
  $('bPng').onclick = () => {   // v0.017: полная картинка «пиксель = бит», а не уменьшенная с экрана
    if (!f) return; const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    c.getContext('2d').putImageData(img, 0, 0); c.toBlob(b => b && download(fname('png'), b));
  };
  for (const id of ['rows', 'steps', 'mode', 'bg']) $(id).addEventListener('change', reset);
  // v0.010, «не включается» (щёлкали по легенде): легенда — тоже переключатель вида; погашенные цвета видны в ней
  const lgSync = () => $('lg').classList.toggle('bits', st.view !== 'col');
  $('view').addEventListener('change', () => { readUI(); lgSync(); if (f) { canvasSize(); layout(); } if (st.view === 'digits' && scale() < 4) zoomTo(8); if (f) draw(); });   // v0.013: у ромбов свой размер холста
  const lgToggle = () => { $('view').value = st.view === 'bits' ? 'col' : 'bits'; readUI(); lgSync(); if (f) { canvasSize(); layout(); draw(); } };
  $('lg').addEventListener('click', lgToggle);
  $('lg').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lgToggle(); } });
  lgSync();
  $('outline').addEventListener('change', () => { st.outline = $('outline').checked; save(); if (f) draw(); });
  $('sym').addEventListener('change', () => { st.sym = $('sym').checked; save(); if (f) draw(); });
  $('speed').addEventListener('input', readUI);
  // v0.015: шаг кнопок и клавиш: при «кратном» — ×2, иначе ×1,5; колесо копит желаемый масштаб zWant, показ — ближайший 2^k
  let zWant = 0;
  const zoomStep = (dir, x, y) => { zWant = 0; zoomTo(scale() * (st.zsnap ? 2 : 1.5) ** dir, x, y); };
  $('zIn').onclick = () => zoomStep(1);
  $('zOut').onclick = () => zoomStep(-1);
  $('zFit').onclick = () => { zWant = 0; fit(); };
  const zSnapSync = () => $('zSnap').setAttribute('aria-pressed', String(!!st.zsnap));
  $('zSnap').onclick = () => { st.zsnap = !st.zsnap; zWant = 0; save(); zSnapSync(); if (!geo) return; if (st.zoom === 'fit') { layout(); thick(); } else zoomTo(st.zoom); };
  zSnapSync();
  addEventListener('resize', () => { if (geo) layout(); });
  wrap.addEventListener('scroll', () => { queueDigits(); queueAlign(); }, {passive:true});
  // Колесо — масштаб к курсору (плавно, тачпад тоже)
  wrap.addEventListener('wheel', e => {
    if (!geo) return; e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    const want = (st.zsnap && zWant ? zWant : scale()) * Math.exp(-Math.max(-300, Math.min(300, d)) * 0.0025);
    zoomTo(want, e.clientX, e.clientY);
    zWant = st.zsnap ? Math.min(Math.max(want, scale() / 1.42), scale() * 1.42) : 0;   // у предела масштаба не копить дальше
  }, { passive: false });
  // Тянуть — сдвиг; два пальца — масштаб; двойной щелчок — по ширине
  const pts = new Map(); let pan = null, pinch = null;
  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.button !== 1) return;
    if (e.target === wrap && (e.offsetX >= wrap.clientWidth || e.offsetY >= wrap.clientHeight)) return;   // полоса прокрутки
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); wrap.setPointerCapture(e.pointerId);
    if (pts.size === 1) { pan = { x: e.clientX, y: e.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop, moved: false }; wrap.classList.add('drag'); }
    if (pts.size === 2) { zWant = 0; const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: scale() }; pan = null; }
  });
  wrap.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pinch.d > 0) zoomTo(pinch.s * d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); }
    else if (pan) { if (Math.hypot(e.clientX - pan.x, e.clientY - pan.y) > 5) pan.moved = true; if (!pan.moved) return; wrap.scrollLeft = pan.sl - (e.clientX - pan.x); wrap.scrollTop = pan.st - (e.clientY - pan.y); }
  });
  const up = e => {
    const tap = e.type === 'pointerup' && e.button === 0 && pan && !pan.moved && !pinch && pts.size === 1;
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { pan = null; wrap.classList.remove('drag'); }
    if (wrap.hasPointerCapture(e.pointerId)) wrap.releasePointerCapture(e.pointerId);
    if (!tap || !f || !(e.shiftKey || axisPicking || st.sym) || rombP() === 2) return;
    const r = cv.getBoundingClientRect(), x = VX + Math.floor((e.clientX - r.left) / r.width * VW), y = Math.floor((e.clientY - r.top) / r.height * VH);
    if (x >= VX && y >= 0 && x < VX + VW && y < VH) { stop(); target = k; konusPick(x, y, !e.shiftKey); }
  };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
  wrap.addEventListener('dblclick', fit);
  addEventListener('keydown', e => {
    if (e.target.closest('input,select')) return;
    if (e.key === '+' || e.key === '=') { zoomStep(1); return; }
    if (e.key === '-' || e.key === '_') { zoomStep(-1); return; }
    if (e.key === '0') { fit(); return; }
    if (e.code === 'Space') { e.preventDefault(); play(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(k + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(k - 1); }
  });
  cv.addEventListener('pointermove', e => {
    if (!f) return;
    const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * dispW(), fy = (e.clientY - r.top) / r.height * VH;
    let x = VX + Math.floor(fx), y = Math.floor(fy), lat = '';
    if (rombP() >= 0) {   // v0.013: на ромбах — ромб под курсором; v0.016: и в какой он решётке
      const h = halfOf(fx); if (!h) { tip.style.display = 'none'; return; }
      [x, y] = rombCell(h[1], fy, h[0]); lat = h[0] ? 'нечётная · ' : 'чётная · ';
    }
    if (x < 0 || y < 0 || x >= f.W || y >= VH) { tip.style.display = 'none'; return; }
    const v = f.val[y * f.W + x], c = v < 0 ? '' : ['чёрн', 'син', 'красн'][tintAt(y, x - geo.anchor, v)];
    tip.textContent = `${lat}строка ${y + 1} · столбец ${x - geo.anchor >= 0 ? '+' : ''}${x - geo.anchor} · ${v < 0 ? 'пусто' : v + ' ' + c}`;
    tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; tip.style.display = 'block';
  });
  cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  $('bAxisPick').onclick = () => {
    stop(); target = k; axisPicking = !axisPicking;
    if (axisPicking) { st.sym = true; $('sym').checked = true; save(); }
    $('bAxisPick').setAttribute('aria-pressed', String(axisPicking));
    $('konusInfo').textContent = axisPicking ? 'Нажми на оранжевую ось симметрии' : konus ? $('konusInfo').textContent : 'Ось не выбрана'; draw();
  };
  $('bKonus').onclick = () => {
    const data = konusData(); if (!data) { clearKonus(); return; }
    try { localStorage.setItem('zerk_mayatnik_solarius', JSON.stringify(data)); }
    catch (_) { $('konusInfo').textContent = 'Не удалось сохранить конус для перехода'; return; }
    location.href = '../sinhrofazotron/Zerkalius-sinhrofazotron.html?mayatnik=axis&bg=0';
  };


  if (st.zsnap && st.zoom !== 'fit') st.zoom = snap2(st.zoom);   // v0.015: сохранённый прежде плавный масштаб — к ближайшему 2^k
  writeUI(); build();
})();
