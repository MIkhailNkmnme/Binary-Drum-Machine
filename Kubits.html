// === Итеративное XOR-наложение ===
// Первый клик: поле = биты модели ⊕ их зеркало/поворот (1⊕1=0, 1⊕0=1).
// Каждый следующий клик: то же наложение применяется к УЖЕ полученному результату.
function xorWorldPos(c){
    var a=aC(c), b=c[1], k=c[2];
    if (G.kind === "iso") return [(a-b)*u, (a+b+1)*v-(k+1)*hh];
    if (G.kind === "top") return [a*TS+TS/2, b*TS+TS/2];
    return [rhX(c), -k*DD/2];
}
function xorApplyStep(kind){
    if (!G || !G.list.length) return false;
    // Всегда берём ТЕКУЩИЕ реальные значения — XOR по-настоящему записывает 0/1 в модель,
    // поэтому лазеры, баланс и все подсчёты пересчитываются сами
    var cur = G.list.map(function(c){ return c[3] === 1 ? 1 : 0; });
    var posMap = {};
    var pts = [];
    for (var i=0; i<G.list.length; i++) {
        var p = xorWorldPos(G.list[i]);
        pts.push(p);
        posMap[Math.round(p[0]) + "_" + Math.round(p[1])] = i;
    }
    var lookup = function(x, y){
        var kx = Math.round(x), ky = Math.round(y);
        for (var ox=-2; ox<=2; ox++) for (var oy=-2; oy<=2; oy++) {
            var idx = posMap[(kx+ox) + "_" + (ky+oy)];
            if (idx !== undefined) return idx;
        }
        return -1;
    };
    var useX = flipMatchX || flipX, useY = flipMatchY || flipY;
    if (!useX && !useY) useX = true; // ось не выбрана — по умолчанию лево/право
    var stepDeg = (typeof getRotStepDeg === "function" ? getRotStepDeg() : 90);
    var rad = stepDeg * Math.PI / 180, cosR = Math.cos(rad), sinR = Math.sin(rad);
    var next = new Array(G.list.length);
    for (var i2=0; i2<G.list.length; i2++) {
        var p2 = pts[i2], j;
        if (kind === 'flip') {
            j = lookup(useX ? (2*G.cx - p2[0]) : p2[0], useY ? (2*G.cy - p2[1]) : p2[1]);
        } else {
            var dx = p2[0]-G.cx, dy = p2[1]-G.cy;
            j = lookup(dx*cosR - dy*sinR + G.cx, dx*sinR + dy*cosR + G.cy);
        }
        var other = (j === -1) ? 0 : cur[j];
        next[i2] = cur[i2] ^ other;
    }
    // Записываем результат в саму модель: 1⊕1 реально становится нулём
    for (var wi=0; wi<G.list.length; wi++) G.list[wi][3] = next[wi];
    if (kind === 'flip') { flipXorState = next; flipXorIter++; }
    else { rotXorState = next; rotXorIter++; }
    return true;
}
function resetXorOverlays(){
    flipXor = false; rotXor = false;
    flipXorState = null; rotXorState = null;
    flipXorIter = 0; rotXorIter = 0;
    btnFlipXor.classList.remove("active-view");
    btnRotXor.classList.remove("active-view");
    btnFlipXor.textContent = "⊕ XOR";
    btnRotXor.textContent = "⊕ XOR";
}
btnFlipXor.addEventListener("click", function(){
    if (!xorApplyStep('flip')) return;
    flipXor = true;
    btnFlipXor.classList.add("active-view");
    btnFlipXor.textContent = "⊕ XOR " + flipXorIter;

    rotXor = true;
    btnRotXor.classList.add("active-view");
    btnRotXor.textContent = "⊕ XOR " + rotXorIter;

});

// «🔺 Генерировать Серпинского»: N строк треугольника Паскаля mod 2 (классический фрактал
// Серпинского) — строка 0 = "1", строка i+1 получается из строки i по тождеству Паскаля mod 2
// (XOR соседних бит), края строки всегда "1". Строка i имеет i+1 бит.
function generateSierpinskiRows(n){
    var rows = [];
    var prev = [1];
    rows.push(prev.join(""));
    for (var i = 1; i < n; i++){
        var cur = new Array(i + 1);
        cur[0] = 1; cur[i] = 1;
        for (var j = 1; j < i; j++) cur[j] = prev[j - 1] ^ prev[j];
        rows.push(cur.join(""));
        prev = cur;
    }
    return rows;
}

    if (n > MAXF) n = MAXF;
    var acbReset = $("autoCaptureBelow");

    srcClearBackup = { src: src.value, lineLimit: lineLimit, lineLimitTop: lineLimitTop }; // откат через «⏹ Сброс»
    src.value = generateSierpinskiRows(n).join("\n");
    lineLimit = defaultLineLimit();
    lineLimitTop = 0;
    rebuild();
});

// Занятые клетки сетки: мировая позиция куба -> целочисленная клетка (центр = 0,0)
function squaresOccupied(){
    var cellPx = SQUARE_TEST_CELL;
    var occ = {};
    for (var i = 0; i < squareTestCells.length; i++) {
        var c = squareTestCells[i];
        occ[Math.round((c.x + cellPx/2) / cellPx) + "," + Math.round((c.y + cellPx/2) / cellPx)] = true;
    }
    return occ;
}

// Первые n СВОБОДНЫХ клеток при обходе колец от центра наружу
// (порядок пути тот же, что у построения кольца: верх слева направо, право, низ, лево)
function squaresFreeCells(n){
    var occ = squaresOccupied();
    var out = [];
    for (var k = 0; out.length < n && k < 1000; k++) {
        var ring = [];
        if (k === 0) ring.push([0, 0]);
        else {
            var side = 2 * k + 1;
            for (var x = 0; x < side; x++) ring.push([x - k, -k]);
            for (var y = 1; y < side; y++) ring.push([k, y - k]);
            for (var x2 = side - 2; x2 >= 0; x2--) ring.push([x2 - k, k]);
            for (var y2 = side - 2; y2 >= 1; y2--) ring.push([-k, y2 - k]);
        }
        for (var t = 0; t < ring.length && out.length < n; t++) {
            if (!occ[ring[t][0] + "," + ring[t][1]]) out.push(ring[t]);
        }
    }
    return out;
}

function squareTestAddRow(rowIdx1){
    var rows = getSquareTestRows();
    var text = rows[rowIdx1 - 1] || "";
    var L = text.length;
    if (L === 0) return;

    var k = rowIdx1 - 1;
    var col = pc(k);
    var cellPx = SQUARE_TEST_CELL;
    var doLoop = loopBits.checked;

    var mid = Math.floor((L - 1) / 2);

    // Значения кубов этажа — как раньше: углы = 0-добор, строка идёт от верхнего центра
    var vals = [];
    if (k === 0) {
        vals.push((text[0] === '1') ? 1 : 0);
    } else {
        var side = 2 * k + 1;
        var coords = [];
        for (var x = 0; x < side; x++) coords.push([x, 0]);
        for (var y = 1; y < side; y++) coords.push([side - 1, y]);
        for (var x2 = side - 2; x2 >= 0; x2--) coords.push([x2, side - 1]);
        for (var y2 = side - 2; y2 >= 1; y2--) coords.push([0, y2]);

        var cap = coords.length - 4;
        var topCenter = k - 1;
        var startSlot = ((topCenter - mid) % cap + cap) % cap;

        var tCount = 0;
        for (var t = 0; t < coords.length; t++) {
            var cx = coords[t][0], cy = coords[t][1];
            var isCorner = (cx === 0 || cx === side - 1) && (cy === 0 || cy === side - 1);
            var val = 0;
            if (!isCorner) {
                var q = (tCount - startSlot + cap) % cap;
                if (doLoop) {
                    val = (text[q % L] === '1') ? 1 : 0;
                } else if (q < L) {
                    val = (text[q] === '1') ? 1 : 0;
                }
                tCount++;
            }
            vals.push(val);
        }
    }

    // Полуавтомат: кубы кладутся на свободные клетки от центра наружу.
    // Если между шагами что-то освободили руками — новые кубы сначала займут это место.
    var free = squaresFreeCells(vals.length);
    for (var fi = 0; fi < free.length; fi++) {
        squareTestCells.push({
            x: free[fi][0] * cellPx - cellPx/2,
            y: free[fi][1] * cellPx - cellPx/2,
            val: vals[fi], col: col
        });
    }
}

    if (!w || !h) { zoom = 1; panX = 0; panY = 0; return; }
    zoom = Math.max(0.05, Math.min(3, Math.min(w, h) * 0.86 / side));

        syncSnakeUI();

});

// Автошаг змейки: строит строки до конца, потом убавляет обратно до первой — и по кругу
var snakeAnimOn = false, snakeAnimTimer = null, snakeAnimDir = 1;
function snakeAnimTick(){
    var totalValid = src.value.split('\n').filter(function(r){return r.trim();}).length;
    if (totalValid < 2) return;
    if (snakeVisibleRows >= totalValid) snakeAnimDir = -1;
    else if (snakeVisibleRows <= 1) snakeAnimDir = 1;
    snakeVisibleRows = Math.max(1, Math.min(totalValid, snakeVisibleRows + snakeAnimDir));
    if (suppressDrawDuringPlayActive()) {

function findSquareTestCellAt(wx, wy){
    var cellPx = SQUARE_TEST_CELL;
    for (var i = squareTestCells.length - 1; i >= 0; i--) {
        var c = squareTestCells[i];
        if (wx >= c.x && wx <= c.x + cellPx && wy >= c.y && wy <= c.y + cellPx) return i;
    }
    return -1;
}

function drawSquareTestFrame(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w === 0 || h === 0) return;
    if (cv.width !== Math.floor(w * dpr) || cv.height !== Math.floor(h * dpr)) {
        cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var isDark = (document.documentElement.dataset.theme === "dark");
    var emptyFill = isDark ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.04)";
    var muted = isDark ? "#93A69F" : "#6E6D66";

    if (!squareTestCells.length) {
        ctx.fillStyle = muted;
        ctx.font = "13px 'Roboto Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText((currentLang === 'ru' ? "Пустой редактор: добавьте строки — или стройте по этажам кнопкой «▶ Этаж»" : "Editor is empty: add strings — or build floor by floor with “▶ Floor”"), w / 2, h / 2);
        return;
    }

    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    var cellPx = SQUARE_TEST_CELL;
    squareTestCells.forEach(function(c){
        ctx.fillStyle = c.val ? c.col[1] : emptyFill;
        ctx.fillRect(c.x + 1, c.y + 1, cellPx - 2, cellPx - 2);
        ctx.strokeStyle = c.col[2];
        ctx.lineWidth = 1 / zoom;
        ctx.strokeRect(c.x + 0.5, c.y + 0.5, cellPx - 1, cellPx - 1);
    });

    // Баланс 1 и 0 — показываем всегда, как в основных режимах
    var n1 = 0, n0 = 0;
    squareTestCells.forEach(function(c){ if (c.val) n1++; else n0++; });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var eqB = (n1 === n0 && n1 > 0);
    var textColB = isDark ? "#FFFFFF" : "#111111";
    ctx.font = "bold 58px 'Roboto Mono', monospace";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    if (eqB) { ctx.shadowBlur = 25; ctx.shadowColor = isDark ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.6)"; }
    ctx.fillStyle = eqB ? textColB : "#F39C12";
    ctx.fillText(String(n1), 24, h - 70);
    ctx.fillStyle = eqB ? textColB : "#E74C3C";
    var m0B = String(n0);
    ctx.fillText(m0B, w - 24 - ctx.measureText(m0B).width, h - 70);
    ctx.shadowBlur = 0;
}

/* === МАРКЕР 16: СОБЫТИЯ ХОЛСТА (ЗУМ/ПАН/КЛИК), СКРЫТИЕ/РЕСАЙЗ ПАНЕЛЕЙ, ESCAPE, ИНИЦИАЛИЗАЦИЯ === */
cv.addEventListener("wheel", function(e){
  if (isSquaresMode() && squareEditMode) {
    e.preventDefault();
    var rq = cv.getBoundingClientRect();
    var mxq = e.clientX - rq.left, myq = e.clientY - rq.top;
    var zoomSpeedQ = 0.15;
    var newScale = zoom * ((e.deltaY < 0) ? (1 + zoomSpeedQ) : 1 / (1 + zoomSpeedQ));
    newScale = Math.max(0.05, Math.min(50, newScale));
    var ratioQ = newScale / zoom;
    panX = mxq - (mxq - panX) * ratioQ;
    panY = myq - (myq - panY) * ratioQ;
    zoom = newScale;
    requestDraw();
    return;
  }
  if (!G) return;
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  var mx = e.clientX - r.left, my = e.clientY - r.top;
  var w = screenToWorld(mx, my);
  var zoomSpeed = 0.15;
  if (e.deltaY < 0) zoom *= (1 + zoomSpeed); else zoom /= (1 + zoomSpeed);
  if (zoom < 0.05) zoom = 0.05; if (zoom > 50) zoom = 50;
  var off = worldOffsetToScreen(w.wx, w.wy);
  panX = mx - off.dx; panY = my - off.dy;
  requestDraw();
}, {passive: false});

cv.addEventListener("mousedown", function(e){
  if (isSquaresMode() && squareEditMode) {
    if (e.button !== 0 && e.button !== 1) return;
    var rq = cv.getBoundingClientRect();
    var qx = e.clientX - rq.left, qy = e.clientY - rq.top;
    if (e.button === 0) {
      var qwx = (qx - panX) / zoom, qwy = (qy - panY) / zoom;
      var idx = findSquareTestCellAt(qwx, qwy);
      if (idx !== -1) {
        var c0 = squareTestCells[idx];
        squareTestDrag = { idx: idx, offX: qwx - c0.x, offY: qwy - c0.y };
        return;
      }
    }
    isDragging = true;
    dragStartX = e.clientX - panX; dragStartY = e.clientY - panY;
    clickDragDist = 0; dragLastX = e.clientX; dragLastY = e.clientY;
    return;
  }
  if (!G) return;
  var r = cv.getBoundingClientRect();
  if (e.button === 2) {
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var scx = panX + selOffX * zoom, scy = panY + selOffY * zoom;
    var selPx = selRadius * zoom;
    // Готовая рамка: захват у ГРАНИЦЫ (±EDGE_TOL px по метрике рамки) — растяжение от её центра,
    // захват глубже внутри — перемещение, снаружи — рисование новой рамки (как раньше).
    var insideSel = false;
    if (selActive && selPx > 0) {
      var edgeNorm = selFrameRadius(mx - scx, my - scy); // «радиус» точки в метрике формы рамки, px
      var EDGE_TOL = 14;
      if (Math.abs(edgeNorm - selPx) <= EDGE_TOL) {
        isResizingSel = true;
      } else if (edgeNorm < selPx) {
        insideSel = true;
      }
    }
    if (isResizingSel) {
      // центр (selOffX/Y) не трогаем — тянется только полудиагональ
    } else if (insideSel) {
      isMovingSel = true;
      selMoveStart = { mx: mx, my: my, offX: selOffX, offY: selOffY };
    } else {
      isSelecting = true; selActive = true;
      selOffX = 0; selOffY = 0;
      selRadius = selFrameRadius(mx - panX, my - panY) / zoom;
    }
    draw();
  } else if (e.button === 0 || e.button === 1) {
    isDragging = true;
    dragStartX = e.clientX - panX; dragStartY = e.clientY - panY;
    clickDragDist = 0; dragLastX = e.clientX; dragLastY = e.clientY;
  }
});

window.addEventListener("mousemove", function(e){
  if (isSquaresMode() && squareEditMode) {
    if (squareTestDrag) {
      var rq2 = cv.getBoundingClientRect();
      var qx2 = e.clientX - rq2.left, qy2 = e.clientY - rq2.top;
      var c2 = squareTestCells[squareTestDrag.idx];
      c2.x = (qx2 - panX) / zoom - squareTestDrag.offX;
      c2.y = (qy2 - panY) / zoom - squareTestDrag.offY;
      requestDraw();
    } else if (isDragging) {
      panX = e.clientX - dragStartX; panY = e.clientY - dragStartY;
      clickDragDist += Math.abs(e.clientX - dragLastX) + Math.abs(e.clientY - dragLastY);
      dragLastX = e.clientX; dragLastY = e.clientY;
      requestDraw();
    }
    return;
  }
  var r = cv.getBoundingClientRect();
  mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
  if (isResizingSel) {
    // Растяжение за границу: радиус — расстояние от ЦЕНТРА РАМКИ (с учётом её смещения selOffX/Y)
    selRadius = selFrameRadius(e.clientX - r.left - (panX + selOffX * zoom),
                               e.clientY - r.top  - (panY + selOffY * zoom)) / zoom;
    requestDraw();
  } else if (isMovingSel && selMoveStart) {
    selOffX = selMoveStart.offX + (e.clientX - r.left - selMoveStart.mx) / zoom;
    selOffY = selMoveStart.offY + (e.clientY - r.top - selMoveStart.my) / zoom;
    requestDraw();
  } else if (isSelecting) {
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    selRadius = selFrameRadius(mx - panX, my - panY) / zoom;
    requestDraw();
  } else if (isDragging) {
    panX = e.clientX - dragStartX; panY = e.clientY - dragStartY;
    clickDragDist += Math.abs(e.clientX - dragLastX) + Math.abs(e.clientY - dragLastY);
    dragLastX = e.clientX; dragLastY = e.clientY;
    requestDraw();
  } else if (skewerMode.checked && laserModeOk() && !suppressDrawDuringPlayActive()) requestDraw();
});

window.addEventListener("mouseup", function(e){
  if (isSquaresMode() && squareEditMode) {
    if (squareTestDrag) {
      // Прилипание к сетке при отпускании — чтобы следующий шаг видел клетку занятой/свободной
      var cUp = squareTestCells[squareTestDrag.idx];
      var cellPxUp = SQUARE_TEST_CELL;
      cUp.x = Math.round((cUp.x + cellPxUp/2) / cellPxUp) * cellPxUp - cellPxUp/2;
      cUp.y = Math.round((cUp.y + cellPxUp/2) / cellPxUp) * cellPxUp - cellPxUp/2;
      requestDraw();
    }
    squareTestDrag = null; isDragging = false; return;
  }
  if (isResizingSel) { isResizingSel = false; if (selRadius * zoom < 5) { selActive = false; draw(); } return; }
  if (isMovingSel) { isMovingSel = false; selMoveStart = null; return; }
  if (isSelecting) { isSelecting = false; if (selRadius * zoom < 5) { selActive = false; draw(); } }
  else if (isDragging) isDragging = false;
});

cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

// === ТАЧ-УПРАВЛЕНИЕ (мобильные/планшеты): один палец = мышь (пан/перетаскивание/тап-клик),
// два пальца = пинч-зум. Тач-события транслируются в обычные мышиные, вся логика общая.
var touchPinchDist = null, touchTapStart = null;
function touchMouse(type, t){
    cv.dispatchEvent(new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window,
        clientX: t.clientX, clientY: t.clientY, button: 0, buttons: (type === "mouseup" ? 0 : 1)
    }));
}

/* === МАРКЕР 22: ТАЧПАД-КУРСОР (как в AnyDesk) ===
   Палец двигает виртуальный курсор ОТНОСИТЕЛЬНО (а не абсолютно), тап = левый клик,
   двойной тап с удержанием = перетаскивание (пан/выделение/перенос куба),
   два пальца = пинч-зум. Включается кнопкой 🖱 (видна только на узком экране). */
var btnPad = $("btnPad"), padCursorEl = $("padCursor");
var padMode = false;
var padCursor = { x: 0, y: 0 };   // координаты виртуального курсора (clientX/clientY)
var padLastTouch = null;          // предыдущая позиция пальца — для относительного сдвига
var padTouchStart = null;         // позиция пальца в начале касания — для распознавания тапа
var padMoved = false;             // был ли заметный сдвиг за текущее касание (тап vs. движение)
var PAD_TAP_TOL = 12;             // допуск дрожания пальца, при котором касание всё ещё считается тапом
var padDragging = false;          // идёт перетаскивание (левая кнопка удержана)
var padLastTapTime = 0;           // время предыдущего тапа — для распознавания двойного
var PAD_SENS = 1.4;               // ускорение перемещения курсора относительно пальца
var padTwoFingerInfo = null;      // {dist0, moved} — идёт гест двумя пальцами; если палец не
                                   // двигали (не зумили) и оба подняли — это ПРАВЫЙ клик (как
                                   // тап двумя пальцами на трекпаде), см. touchend.
var PAD_PINCH_MOVE_TOL = 10;      // на сколько px должно измениться расстояние между пальцами,
                                   // чтобы считать это зумом, а не тапом двумя пальцами

function padClampCursor(){
    var r = cv.getBoundingClientRect();
    padCursor.x = Math.max(r.left, Math.min(r.right, padCursor.x));
    padCursor.y = Math.max(r.top, Math.min(r.bottom, padCursor.y));
}
function padUpdateCursorEl(){
    if (!padCursorEl) return;
    var r = cv.getBoundingClientRect();
    padCursorEl.style.left = (padCursor.x - r.left) + "px";
    padCursorEl.style.top  = (padCursor.y - r.top) + "px";
}
function padMouse(type, buttons, button){
    cv.dispatchEvent(new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window,
        clientX: padCursor.x, clientY: padCursor.y, button: (button === undefined ? 0 : button), buttons: buttons
    }));
}
function setPadMode(on){
    padMode = on;
    document.body.classList.toggle("pad-mode", on);
    if (btnPad) btnPad.classList.toggle("active-view", on);
    if (on){
        var r = cv.getBoundingClientRect();
        if (padCursor.x < r.left || padCursor.x > r.right || padCursor.y < r.top || padCursor.y > r.bottom){
            padCursor.x = r.left + r.width / 2;
            padCursor.y = r.top + r.height / 2;
        }
        padUpdateCursorEl();
    } else {
        if (padDragging){ padMouse("mouseup", 0); }
        padDragging = false; padLastTouch = null;
        document.body.classList.remove("pad-dragging");
    }
}
if (btnPad) btnPad.addEventListener("click", function(){ setPadMode(!padMode); });
// Тач-устройство? Тогда кнопку 🖱 показываем и в широкой раскладке (телефон в «версии для ПК»)
if (("ontouchstart" in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0)) {
    document.body.classList.add("has-touch");
}
cv.addEventListener("touchstart", function(e){
    e.preventDefault();
    if (padMode) {
        if (e.touches.length >= 2) {
            if (padDragging){ padMouse("mouseup", 0); padDragging = false; document.body.classList.remove("pad-dragging"); }
            padLastTouch = null; padMoved = false;
            var pdx0 = e.touches[0].clientX - e.touches[1].clientX;
            var pdy0 = e.touches[0].clientY - e.touches[1].clientY;
            touchPinchDist = Math.sqrt(pdx0*pdx0 + pdy0*pdy0);
            // Начало геста двумя пальцами: если палец так и не подвинут (не зумили) и оба
            // поднимутся — засчитаем это как ПРАВЫЙ клик по текущей позиции курсора (см. touchend).
            if (!padTwoFingerInfo) padTwoFingerInfo = { dist0: touchPinchDist, moved: false };
            return;
        }
        var pt = e.touches[0];
        padLastTouch = { x: pt.clientX, y: pt.clientY };
        padTouchStart = { x: pt.clientX, y: pt.clientY };
        padMoved = false;
        if (Date.now() - padLastTapTime < 300) {
            // двойной тап с удержанием → перетаскивание от текущей позиции курсора
            padDragging = true;
            document.body.classList.add("pad-dragging");
            padMouse("mousedown", 1);
        }
        return;
    }
    if (e.touches.length === 1) {
        var t = e.touches[0];
        touchTapStart = { x: t.clientX, y: t.clientY, time: Date.now() };
        touchMouse("mousedown", t);
    } else if (e.touches.length === 2) {
        touchMouse("mouseup", e.touches[0]); // отменяем начатый пан — начинается пинч
        touchTapStart = null;
        var dx0 = e.touches[0].clientX - e.touches[1].clientX;
        var dy0 = e.touches[0].clientY - e.touches[1].clientY;
        touchPinchDist = Math.sqrt(dx0*dx0 + dy0*dy0);
    }
}, {passive: false});
cv.addEventListener("touchmove", function(e){
    e.preventDefault();
    if (padMode) {
        if (e.touches.length >= 2) {
            var qdx = e.touches[0].clientX - e.touches[1].clientX;
            var qdy = e.touches[0].clientY - e.touches[1].clientY;
            var qdist = Math.sqrt(qdx*qdx + qdy*qdy);
            if (touchPinchDist) {
                var qr = cv.getBoundingClientRect();
                var qmx = (e.touches[0].clientX + e.touches[1].clientX)/2 - qr.left;
                var qmy = (e.touches[0].clientY + e.touches[1].clientY)/2 - qr.top;
                var qf = qdist / touchPinchDist;
                var qnz = Math.max(0.05, Math.min(50, zoom * qf));
                qf = qnz / zoom;
                panX = qmx - (qmx - panX) * qf;
                panY = qmy - (qmy - panY) * qf;
                zoom = qnz;
                requestDraw();
            }
            // Реально зумили (палец разошлись/сблизились заметно) — это не тап, правого клика не будет.
            if (padTwoFingerInfo && Math.abs(qdist - padTwoFingerInfo.dist0) > PAD_PINCH_MOVE_TOL) padTwoFingerInfo.moved = true;
            touchPinchDist = qdist;
            return;
        }
        if (!padLastTouch) return;
        var mt = e.touches[0];
        var rawdx = mt.clientX - padLastTouch.x, rawdy = mt.clientY - padLastTouch.y;
        padLastTouch = { x: mt.clientX, y: mt.clientY };
        padCursor.x += rawdx * PAD_SENS;
        padCursor.y += rawdy * PAD_SENS;
        padClampCursor();
        padUpdateCursorEl();
        // тап vs. движение — по СУММАРНОМУ сдвигу пальца от старта, а не по дрожанию за кадр
        // (иначе неподвижный тап на сенсоре из-за дрожания в 1–2px не срабатывает как клик)
        if (padTouchStart && (Math.abs(mt.clientX - padTouchStart.x) > PAD_TAP_TOL ||
                              Math.abs(mt.clientY - padTouchStart.y) > PAD_TAP_TOL)) {
            padMoved = true;
            if (padTwoFingerInfo) padTwoFingerInfo.moved = true; // палец после снятия пары продолжил тащить — это не тап
        }
        padMouse("mousemove", padDragging ? 1 : 0);
        return;
    }
    if (e.touches.length === 1 && touchPinchDist === null) {
        touchMouse("mousemove", e.touches[0]);
    } else if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (touchPinchDist) {
            var r = cv.getBoundingClientRect();
            var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
            var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
            var factor = dist / touchPinchDist;
            var newZoom = Math.max(0.05, Math.min(50, zoom * factor));
            factor = newZoom / zoom;
            panX = mx - (mx - panX) * factor;
            panY = my - (my - panY) * factor;
            zoom = newZoom;
            requestDraw();
        }
        touchPinchDist = dist;
    }
}, {passive: false});
cv.addEventListener("touchend", function(e){
    e.preventDefault();
    if (padMode) {
        if (e.touches.length === 0) {
            if (padTwoFingerInfo) {
                // Гест двумя пальцами закончился без реального зума — тап двумя пальцами =
                // ПРАВЫЙ клик по текущей позиции курсора (как на трекпаде ноутбука).
                if (!padTwoFingerInfo.moved) {
                    padMouse("mousedown", 2, 2);
                    padMouse("mouseup", 0, 2);
                }
                padTwoFingerInfo = null;
            } else if (padDragging) {
                padMouse("mouseup", 0);
                padDragging = false;
                document.body.classList.remove("pad-dragging");
            } else if (!padMoved) {
                // тап без сдвига = левый клик по позиции курсора
                padMouse("mousedown", 1);
                padMouse("mouseup", 0);
                padMouse("click", 0);
                padLastTapTime = Date.now();
            }
            padLastTouch = null; padTouchStart = null; touchPinchDist = null; padMoved = false;
        } else if (e.touches.length === 1) {
            // подняли один палец с пинча — оставшийся продолжает водить курсор (гест двумя
            // пальцами больше не может закончиться тапом — он уже точно не завершился сразу)
            touchPinchDist = null; padMoved = false;
            padLastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            padTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return;
    }
    if (e.touches.length === 0) {
        var tEnd = e.changedTouches[0];
        touchMouse("mouseup", tEnd);
        // короткое касание без сдвига = клик (лазерные узлы, выбор этажа и т.д.)
        if (touchTapStart && Math.abs(tEnd.clientX - touchTapStart.x) < 8 &&
            Math.abs(tEnd.clientY - touchTapStart.y) < 8 && Date.now() - touchTapStart.time < 500) {
            touchMouse("click", tEnd);
        }
        touchTapStart = null;
        touchPinchDist = null;
    } else if (e.touches.length === 1) {
        // один палец подняли с пинча — оставшийся продолжает пан
        touchPinchDist = null;
        touchTapStart = null;
        touchMouse("mousedown", e.touches[0]);
    }
}, {passive: false});
cv.addEventListener("touchcancel", function(e){
    if (padMode) {
        if (padDragging){ padMouse("mouseup", 0); padDragging = false; document.body.classList.remove("pad-dragging"); }
        padLastTouch = null; touchPinchDist = null; padMoved = false; padTwoFingerInfo = null;
        return;
    }
    touchPinchDist = null; touchTapStart = null;
    if (e.changedTouches.length) touchMouse("mouseup", e.changedTouches[0]);
}, {passive: false});

cv.addEventListener("click", function(e){
  if (isSquaresMode() && squareEditMode) return;
  if (!G) return;
  if (clickDragDist > 5) return;
  if (selActive) { selActive = false; selRadius = 0; selOffX = 0; selOffY = 0; draw(); syncSelUI(); return; }
  var r = cv.getBoundingClientRect();
  var mx = e.clientX - r.left, my = e.clientY - r.top;
  var wp = screenToWorld(mx, my);
  var wx = wp.wx, wy = wp.wy;

  if (skewerMode.checked && laserModeOk()) {
      var lctx = buildLaserNodes(), clickedNode = null, hitRadius = 12;
      var clkFixed = laserStationaryOK();
      var clkRot = currentRotRad(), clkCos = Math.cos(clkRot), clkSin = Math.sin(clkRot);

      // «Петли»-переключатели целых осей (в начале каждой оси, перед узлом №1) — проверяем первыми
      var axisAnchors = computeAxisToggleAnchors(lctx);
      var clickedAxisKey = null, hitRadiusAT = 12;
      Object.keys(axisAnchors).forEach(function(key){
          var pos = axisAnchors[key];
          var sx, sy;
          if (clkFixed) {
              sx = panX + (pos.x - G.cx) * zoom; sy = panY + (pos.y - G.cy) * zoom;
          } else {
              var ndx = (flipX ? -1 : 1) * (pos.x - G.cx) * zoom, ndy = (flipY ? -1 : 1) * (pos.y - G.cy) * zoom;
              sx = panX + ndx * clkCos - ndy * clkSin; sy = panY + ndx * clkSin + ndy * clkCos;
          }
          var dist = Math.sqrt((mx - sx)*(mx - sx) + (my - sy)*(my - sy));
          if (dist < hitRadiusAT) { hitRadiusAT = dist; clickedAxisKey = key; }
      });
      if (clickedAxisKey) {
          var axisNodesC = lctx.groups[clickedAxisKey] || [];
          var allOnC = axisNodesC.length > 0 && axisNodesC.every(function(n){
              return skewers.some(function(sk){ return sk.type === clickedAxisKey && sk.d === n.d; });
          });
          if (allOnC) {
              removeAllLasersOfAxis(clickedAxisKey);
          } else {
              axisNodesC.forEach(function(n){
                  if (!skewers.some(function(sk){ return sk.type === clickedAxisKey && sk.d === n.d; })) {
                      skewers.push({ type: clickedAxisKey, d: n.d, color: laserColors[skewers.length % laserColors.length] });
                  }
              });
              laserVis[clickedAxisKey] = true;
          }
          draw(); syncSelUI();
          return;
      }

      lctx.nodes.forEach(function(node) {
          var sx, sy;
          if (clkFixed) {
              sx = panX + (node.pos.x - G.cx) * zoom; sy = panY + (node.pos.y - G.cy) * zoom;
          } else {
              var ndx = (flipX ? -1 : 1) * (node.pos.x - G.cx) * zoom, ndy = (flipY ? -1 : 1) * (node.pos.y - G.cy) * zoom;
              sx = panX + ndx * clkCos - ndy * clkSin; sy = panY + ndx * clkSin + ndy * clkCos;
          }
          var dist = Math.sqrt((mx - sx)*(mx - sx) + (my - sy)*(my - sy));
          if (dist < hitRadius) { hitRadius = dist; clickedNode = node; }
      });
      if (clickedNode) {
          var existsIdx = skewers.findIndex(function(s) { return s.type === clickedNode.type && s.d === clickedNode.d; });
          if (existsIdx >= 0) {
              skewers.splice(existsIdx, 1);
              // Убираем выделение снятого лазера и сдвигаем skIdx оставшихся выбранных вниз на 1
              // (индексы после existsIdx сместились из-за splice)
              selectedLaserRows = selectedLaserRows
                  .filter(function(r){ return r.skIdx !== existsIdx; })
                  .map(function(r){ return r.skIdx > existsIdx ? { skIdx: r.skIdx - 1, kind: r.kind } : r; });
          } else {
              skewers.push({ type: clickedNode.type, d: clickedNode.d, color: laserColors[skewers.length % laserColors.length] });
              selectedLaserRows.push({ skIdx: skewers.length - 1, kind: 'normal' }); // добавляем к уже выбранным — сразу подсветить и его результат
          }
          draw(); syncSelUI();
          return;
      }
  }

  var f = hitFloor(wx,wy);
  if(f===null){ if(sel.size > 0){ sel.clear(); draw(); syncSelUI(); } } 
  else {
      if (e.ctrlKey || e.metaKey) { if (sel.has(f)) sel.delete(f); else sel.add(f); }
      else { if (sel.size === 1 && sel.has(f)) sel.clear(); else { sel.clear(); sel.add(f); } }
      draw(); syncSelUI();
  }
});

const safeDraw = () => { if (G) draw(); };

window.addEventListener("resize", function(){
    if (isSquaresMode() && squareEditMode) { squaresAutoFit(); draw(); }
    else if (G) { autoFit(); draw(); }
    if (padMode){ padClampCursor(); padUpdateCursorEl(); }
});

var leftPanel = $("leftPanel"), rightPanel = $("rightPanel");
var btnL = $("toggleLeft"), btnR = $("toggleRight");

btnL.addEventListener("click", function(){
    var hid = leftPanel.classList.toggle("collapsed");
    $("divLeft").style.display = hid ? "none" : "";
    btnL.textContent = hid ? "➡ ⚙" : "⬅ ⚙";
    setTimeout(function(){ if (G) { autoFit(); draw(); } }, 10);
});

btnR.addEventListener("click", function(){
    var hid = rightPanel.classList.toggle("collapsed");
    $("divRight").style.display = hid ? "none" : "";
    btnR.textContent = hid ? "⬅ ✎" : "✎ ➡";
    setTimeout(function(){ if (G) { autoFit(); draw(); } }, 10);
});

// Мобильный старт: на узком экране обе панели свёрнуты — холст занимает всё,
// открываются кнопками ⚙/✎ и ложатся поверх холста (см. media-query в CSS)
if (window.innerWidth < 900) {
    if (!leftPanel.classList.contains("collapsed")) btnL.click();
    if (!rightPanel.classList.contains("collapsed")) btnR.click();
}

function makeResizer(divEl, panelEl, sign){
    divEl.addEventListener("mousedown", function(e){
        e.preventDefault();
        var startX = e.clientX;
        var startW = panelEl.getBoundingClientRect().width;
        var maxW = Math.round(window.innerWidth * 0.45);
        divEl.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        var onMove = function(ev){
            var w = startW + sign * (ev.clientX - startX);
            w = Math.max(150, Math.min(maxW, w));
            panelEl.style.width = w + "px";
            if (G) { autoFit(); requestDraw(); }
        };
        var onUp = function(){
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            divEl.classList.remove("dragging");
            document.body.style.cursor = "";
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
    });
}
makeResizer($("divLeft"), leftPanel, 1);
makeResizer($("divRight"), rightPanel, -1);

$("divLaser").addEventListener("mousedown", function(e){
    e.preventDefault();
    var grip = this;
    var startY = e.clientY;
    var startH = skewerWrap.getBoundingClientRect().height;
    var colH = skewerWrap.parentNode.getBoundingClientRect().height;
    var maxH = Math.round(colH * 0.7);
    grip.classList.add("dragging");
    document.body.style.cursor = "row-resize";
    var onMove = function(ev){
        var h = startH - (ev.clientY - startY); 
        h = Math.max(54, Math.min(maxH, h));
        skewerWrap.style.height = h + "px";
        if (G) { autoFit(); requestDraw(); }
    };
    var onUp = function(){
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
        grip.classList.remove("dragging");
        document.body.style.cursor = "";
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
});

window.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (zenMode) {
        toggleZenMode();
    } else if (skewers.length > 0) {
        skewers = [];
        selectedLaserRows = [];
        draw(); syncSelUI();
    } else if (G) {
        autoFit(); draw();
    }
});

var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
setTheme(prefersDark ? "dark" : "light");

function fullInit() {
    restoreSrcFromCache(); // подтянуть сохранённые «Данные» из localStorage (если есть)
    rebuild();
    applyI18n();
}

const resizeObs = new ResizeObserver(entries => {
    for (let entry of entries) {
        if (entry.contentRect.width > 10 && entry.contentRect.height > 10) {
            if (!G) fullInit();
            else safeDraw();
        }
    }
});
resizeObs.observe(stage);

window.addEventListener('load', () => {
    if (!G) fullInit();
});

})();
</script>
</body></html>
