              // Один столбик-«доска» для одного варианта стога h: вертикальная ось посередине,
              // куски пар — строками друг под другом (сверху пара 0+1, ниже 1+2, и т.д., «склейка
              // вниз»), каждый прижат к оси со своей стороны (право/лево).
              function ilBuildStogBoard(h){
                  var board = document.createElement("div");
                  board.style.cssText = "position:relative; flex:1 1 0; min-width:0; padding:1px 0;";
                  var axis = document.createElement("div");
                  axis.style.cssText = "position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--accent2); opacity:0.5; pointer-events:none;";
                  board.appendChild(axis);
                  if (!h.str.length) {
                      var ilEmpty = document.createElement("div");
                      ilEmpty.style.cssText = "text-align:center; color:var(--muted);";
                      ilEmpty.textContent = i18n[currentLang].empty;
                      board.appendChild(ilEmpty);
                      return board;
                  }
                  // Подсветка совпадений должна отражать реальный режим поиска (см. belowRowMatchDetail):
                  // при выключенном «Сквозной поиск» (по умолчанию) каждый кусок ищется САМ ПО СЕБЕ —
                  // findMatches по всей h.str нашёл бы совпадение, тянущееся через границу пар, которое
                  // при обычном захвате не считается найденным.
                  var throughOnNow = !!($("ilThroughSearch") && $("ilThroughSearch").checked);
                  var ilSegsFull = throughOnNow ? findMatches(h.str, null) : null;
                  var numPieces = h.bounds.length - 1;
                  for (var pb = 0; pb < numPieces; pb++){
                      var pairKey = ilIsSingle ? "single" : pb;
                      var isPendingPiece = (ilHaystacks.length > 1) && (pairKey === ilPendingKey) && (pb === numPieces - 1);
                      // Пока пара «нерешённая» и сравниваются 2 доски — реальная сторона ЭТОЙ доски
                      // берётся из h.tag (ilEffectiveSide() для неё вернула бы «право» на обеих досках).
                      var curRight = isPendingPiece ? (h.tag.charAt(h.tag.length - 1) === "→") : ilEffectiveSide(pairKey);

                      var row = document.createElement("div");
                      row.style.cssText = "position:relative; display:flex; min-height:20px; align-items:center;" +
                          (curRight ? " justify-content:flex-start;" : " justify-content:flex-end;");

                      var piece = document.createElement("span");
                      piece.style.cssText = "cursor:grab; border-radius:2px; padding:1px 5px; max-width:46%; overflow-wrap:anywhere;" +
                          (curRight ? " margin-left:3px;" : " margin-right:3px;");
                      piece.title = (currentLang === "ru")
                          ? "Перетащите через ось (или кликните) — переключить сторону добора этой пары (сейчас: " + (curRight ? "→" : "←") + ")"
                          : "Drag across the axis (or click) — toggle this pair's pad side (now: " + (curRight ? "→" : "←") + ")";
                      piece.innerHTML = formatMatchSegments(throughOnNow
                          ? sliceSegments(ilSegsFull, h.bounds[pb], h.bounds[pb + 1])
                          : findMatches(h.str.slice(h.bounds[pb], h.bounds[pb + 1]), null));
                      ilAttachDrag(piece, row, pairKey);
                      row.appendChild(piece);
                      board.appendChild(row);
                  }
                  return board;
              }
              if (ilHaystacks.length) {
                  var ilBoardsWrap = document.createElement("div");
                  ilBoardsWrap.style.cssText = "display:flex; gap:12px; width:100%;";
                  ilHaystacks.forEach(function(h){
                      if (ilHaystacks.length > 1) {
                          var ilOuter = document.createElement("div");
                          ilOuter.style.cssText = "flex:1 1 0; min-width:0;";
                          var ilBoardTitle = document.createElement("div");
                          ilBoardTitle.style.cssText = "text-align:center; color:var(--muted); font-size:10px; margin-bottom:2px;";
                          ilBoardTitle.textContent = h.tag;
                          ilOuter.appendChild(ilBoardTitle);
                          ilOuter.appendChild(ilBuildStogBoard(h));
                          ilBoardsWrap.appendChild(ilOuter);
                      } else {
                          ilBoardsWrap.appendChild(ilBuildStogBoard(h));
                      }
                  });
                  asmWrap.appendChild(ilBoardsWrap);
              } else {
                  var ilDash = document.createElement("div");
                  ilDash.className = "sub";
                  ilDash.style.margin = "0";
                  ilDash.textContent = "—";
                  asmWrap.appendChild(ilDash);
              }
              skewerRes.appendChild(asmWrap);
          } else {
          asmTitle.textContent = (currentLang === "ru") ? "Сборка:" : "Assembly:";
          asmHead.appendChild(asmTitle);

          LASER_ASSEMBLY_PRESETS.forEach(function(preset){
              var pb = document.createElement("button");
              pb.textContent = preset.label;
              pb.style.cssText = "height:17px; padding:0 6px; font-size:0.92em; border-radius:5px; border:1px solid var(--border); background:var(--panel); color:var(--muted); cursor:pointer;";
              if (preset.key === laserAssemblyVariant) { pb.style.background = "var(--accent)"; pb.style.color = "#fff"; pb.style.borderColor = "var(--accent)"; }
              pb.onclick = function(){ laserAssemblyVariant = preset.key; draw(); };
              asmHead.appendChild(pb);
          });
          asmWrap.appendChild(asmHead);

          if (assemblyRows.length) {
              // Одна общая строка сборки (Лево1+Право1+Лево2+Право2+...), разделитель — только «+».
              // Только значения — без подписи оси/индекса; пропущенная на оси точка просто не входит.
              assemblyRows.forEach(function(row){
                  var asmLine = document.createElement("div");
                  asmLine.className = "skew-line";
                  asmLine.style.cursor = "default";
                  asmLine.style.flexWrap = "wrap";

                  row.pts.forEach(function(p, i){
                      var color = skewerData[p.skIdx] ? skewerData[p.skIdx].color : "var(--muted)";

                      if (i > 0) {
                          var plus = document.createElement("span");
                          plus.style.color = "var(--muted)";
                          plus.textContent = " + ";
                          asmLine.appendChild(plus);
                      }

                      var part = document.createElement("span");
                      part.style.cssText = "border-radius:3px; padding:0 2px; margin:0 -2px; transition:background .12s, box-shadow .12s;";
                      var segs = axisPointSegments[p.skIdx] || [{ text: p.str, type: 'none' }];
                      part.innerHTML = formatMatchSegments(segs);

                      part.addEventListener("mouseenter", function(){
                          part.style.background = hexA(color, 0.30);
                          part.style.boxShadow = "inset 0 0 0 1.5px " + color;
                          var rowEl = skewerRowEls[p.skIdx];
                          if (rowEl) rowEl.classList.add("skew-line-hover");
                      });
                      part.addEventListener("mouseleave", function(){
                          part.style.background = "";
                          part.style.boxShadow = "";
                          var rowEl = skewerRowEls[p.skIdx];
                          if (rowEl) rowEl.classList.remove("skew-line-hover");
                      });

                      asmLine.appendChild(part);
                  });

                  asmWrap.appendChild(asmLine);
              });
          } else {
              var asmDash = document.createElement("div");
              asmDash.className = "sub";
              asmDash.style.margin = "0";
              asmDash.textContent = "—";
              asmWrap.appendChild(asmDash);
          }
          skewerRes.appendChild(asmWrap);
          }
      }

      { // колонки показываем всегда (даже без лазеров) — в заголовке каждой живёт её «⚡ Все»
          var colsWrap = document.createElement("div");
          colsWrap.style.display = "flex";
          colsWrap.style.gap = "16px";
          colsWrap.style.width = "100%";
          skewerRes.appendChild(colsWrap);

          colDefs.forEach(function(cd){
              if (!laserVis[cd.key]) return;
              var col = document.createElement("div");
              col.className = "laser-col";
              var h = document.createElement("div");
              h.className = "laser-col-h";
              h.style.display = "flex";
              h.style.alignItems = "center";
              h.style.justifyContent = "space-between";
              h.style.gap = "8px";
              var hLab = document.createElement("span");
              hLab.textContent = cd.label;
              h.appendChild(hLab);

              // «⚡ Все» своей оси — прямо в заголовке колонки
              var axisNodes = laserCtx.groups[cd.key] || [];
              var allActive = axisNodes.length > 0 && axisNodes.every(function(n){
                  return skewers.some(function(sk){ return sk.type === cd.key && sk.d === n.d; });
              });
              var allBtn = document.createElement("button");
              allBtn.textContent = "⚡ " + ((currentLang === "ru") ? "Все" : "All");
              allBtn.title = (currentLang === "ru") ? "Включить/выключить все точки этой оси разом" : "Toggle all emitter points on this axis at once";
              allBtn.style.cssText = "height:18px; padding:0 6px; font-size:10px; border-radius:5px; border:1px solid var(--border); background:var(--panel); color:var(--muted); cursor:pointer;";
              if (allActive) { allBtn.style.background = "var(--accent)"; allBtn.style.color = "#fff"; allBtn.style.borderColor = "var(--accent)"; }
              allBtn.onclick = function(){
                  if (allActive) {
                      removeAllLasersOfAxis(cd.key);
                  } else {
                      axisNodes.forEach(function(n){
                          if (!skewers.some(function(sk){ return sk.type === cd.key && sk.d === n.d; })) {
                              skewers.push({ type: cd.key, d: n.d, color: laserColors[skewers.length % laserColors.length] });
                          }
                      });
                      laserVis[cd.key] = true;
                  }
                  draw(); syncSelUI();
              };
              h.appendChild(allBtn);
              col.appendChild(h);

              var items = laserGroups[cd.key];
              if (items.length) {
                  items.sort(function(a,b){return a.index - b.index;}); 
                  items.forEach(function(it){ col.appendChild(it.el); });
              } else {
                  var dash = document.createElement("div");
                  dash.className = "sub";
                  dash.style.margin = "0";
                  dash.textContent = "—";
                  col.appendChild(dash);
              }
              colsWrap.appendChild(col);
          });

          if (laserOverlapEnabled) {
              var ovWrap = document.createElement("div");
              ovWrap.style.marginTop = "6px";
              ovWrap.style.width = "100%";

              var ovHead = document.createElement("div");
              ovHead.className = "laser-col-h";
              ovHead.textContent = ((currentLang === "ru") ? "Пересечения" : "Overlaps");
              ovWrap.appendChild(ovHead);

              var hasOverlaps = false;

              skewers.forEach(function(sk, skIdx) {
                  var sd = skewerData[skIdx];
                  if (!sd) return;

                  var activeN = (laserCtx.groups[sk.type] || []).find(function(n){return n.d === sk.d});
                  var nIdx = activeN ? activeN.index : "?";
                  var primaryName = String(nIdx);

                  var overlapStr = "";
                  var intersectingBeams = [];

                  sd.hitList.forEach(function(hit) {
                      var c = hit.c;
                      var hitsForCube = cellLaserHits[c._i];
                      if (hitsForCube && hitsForCube.length > 1) {
                          overlapStr += c[3];
                          hitsForCube.forEach(function(otherSkIdx) {
                              if (otherSkIdx !== skIdx) {
                                  var otherSk = skewers[otherSkIdx];
                                  var otherGrp = laserCtx.groups[otherSk.type] || [];
                                  var otherNode = otherGrp.find(function(n){ return n.d === otherSk.d; });
                                  var otherName = String(otherNode ? otherNode.index : "?");
                                  if (intersectingBeams.indexOf(otherName) === -1) {
                                      intersectingBeams.push(otherName);
                                  }
                              }
                          });
                      }
                  });

                  if (overlapStr.length > 0) {
                      hasOverlaps = true;
                      var line = document.createElement("div");
                      line.className = "skew-line";

                      var dot = document.createElement("span");
                      dot.className = "skew-dot";
                      dot.style.background = LASER_OVERLAP_COLOR;
                      line.appendChild(dot);

                      var isOvSel = isLaserRowSelected(skIdx, 'overlap');
                      var ovSelEntry = isOvSel ? findSelBeamHl(skIdx, 'overlap') : null;

                      var txt = document.createElement("span");
                      // Тот же принцип, что и у «Сборки»: при активном «По строкам» лазерный поиск
                      // не подсвечивает пересечения — не путаем с подсветкой стога.
                      var segments = rowsModeActive ? [{ text: overlapStr, type: 'none' }] : findMatches(overlapStr, ovSelEntry ? ovSelEntry.map : null);
                      var dispOvStr = formatMatchSegments(segments);
                      txt.innerHTML = '<span class="skew-num">' + primaryName + ':</span>' + dispOvStr + ' <span style="color:var(--muted)">(' + intersectingBeams.join(", ") + ')</span>';
                      line.appendChild(txt);

                      if (isOvSel) {
                          line.classList.add("skew-line-selected");
                          line.style.background = hexA(LASER_OVERLAP_COLOR, 0.18);
                          line.style.boxShadow = "inset 0 0 0 1.5px " + LASER_OVERLAP_COLOR;
                      }
                      line.addEventListener("click", function(){ toggleLaserRowSelection(skIdx, 'overlap'); });

                      ovWrap.appendChild(line);
                  }
              });

              if (!hasOverlaps) {
                  var ovDash = document.createElement("div");
                  ovDash.className = "sub";
                  ovDash.style.margin = "0";
                  ovDash.textContent = "—";
                  ovWrap.appendChild(ovDash);
              }
              
              var overlapCount = ovWrap.querySelectorAll('.skew-line').length;
              ovHead.textContent = ((currentLang === "ru") ? "Пересечения" : "Overlaps") + " (" + overlapCount + ")";

              skewerRes.appendChild(ovWrap);
          }
      }
  } else {
      skewerWrap.style.display = "none";
      $("divLaser").style.display = "none";
      $("laserTogglesBar").style.display = "none";
      lastAssemblyHaystack = "";
  }
/* === МАРКЕР 11: DRAW — КОЛЬЦА-НАПРАВЛЯЮЩИЕ, РАМКА ВЫДЕЛЕНИЯ, ЦИФРЫ БАЛАНСА (КОНЕЦ DRAW) === */
  if (!hasSelection && highlightEqual) {
      for(var i=0; i<G.list.length; i++) {
         if (selectedBeamCellSet && !selectedBeamCellSet.has(i)) continue; // выбран лазер — подсвечиваем баланс только по его клеткам
         if (G.list[i][6] !== -1) {
             if (!textHlMap[G.list[i][5]]) textHlMap[G.list[i][5]] = {};
             textHlMap[G.list[i][5]][G.list[i][6]] = G.list[i][2];
         }
      }
  }
  // Автозахват: та же проверка, что у кнопки «По лазерам»/«По строкам» (см. belowRowMatchDetail),
  // а не только попадание в canvas-подсветку лазеров — иначе строки вроде «1000», найденные лишь
  // как инверсия в данных, не подхватывались.
  // Отложенно через микротаск (не setTimeout!), чтобы не рекурсировать из draw(). Микротаск гарантированно
  // выполняется РАНЬШЕ следующего тика любого setInterval (Плей этажей, автосдвиг символов и т.п.) —
  // иначе при быстром автоплее следующий тик успевал стартовать раньше отложенного захвата, тот видел
  // «pendingBelowCapture» ещё не сброшенным и молча пропускал проверку — автозахват «проскакивал» мимо
  // совпадения. Монотонный рост lineLimit гарантирует завершение (строка, ушедшая выше границы,
  // перестаёт быть целью).
  (function(){
      var acb = $("autoCaptureBelow");
      if (!acb || !acb.checked || lineLimit < 0 || pendingBelowCapture) return;
      // Пока «Без отрисовки при Плее» активно и играет любой Плей — эту же проверку уже делает
      // сам тик Плея напрямую (runAutoCaptureCheckOnce), один раз за такт. Если разрешить ЕЩЁ и
      // этому встроенному механизму сработать (а он срабатывает на КАЖДОМ реальном draw(), в т.ч.
      // на том, который вызвал rebuild() после захвата в тике) — получается каскад: один такт
      // Плея утягивает сразу МНОГО строк одну за другой через микрозадачи, холст рисуется на
      // каждой — и создаётся впечатление, что автозахват «никогда не останавливается».
      if (suppressDrawDuringPlayActive()) return;
      var row = belowRowBits();
      if (!row) return;
      var m = belowRowMatchDetail();
      if (!m) return;
      console.log("[Kubits] Автозахват: строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втягиваем в рамку");
      pendingBelowCapture = true;
      Promise.resolve().then(function(){
          pendingBelowCapture = false;
          var acb2 = $("autoCaptureBelow");
          if (acb2 && acb2.checked && lineLimit >= 0 && lineLimit < src.value.split('\n').length) { lineLimit++; rebuild(); }
      });
  })();

  updateEditorHighlight(textHlMap, isMinus, highlightEqual, targetHighlights, selectedBeamHlList);
  renderLineGutter();

  ctx.globalAlpha=1;
  if(G.gd.length){
    ctx.font="11px 'Roboto Mono',monospace";
    ctx.textAlign="left";
    for(var i=0;i<G.gd.length;i++){
      var g=G.gd[i]; col=pc(g.k);
      var isSelG = isSelected(g.k);
      
      var isRingActive = true;
      if (hasSelection) {
          isRingActive = isMinus ? !isSelG : isSelG;
      }

      ctx.globalAlpha = isRingActive ? 0.7 : 0.05;
      if(g.rx>0){
        ctx.strokeStyle=col[2]; ctx.lineWidth=1.5/zoom; ctx.setLineDash([8/zoom,6/zoom]);
        ctx.beginPath();
        ctx.ellipse(g.cx, g.cy, g.rx, g.ry, 0, 0, Math.PI*2);
        ctx.stroke(); ctx.setLineDash([]);
      }
      if(g.lab){
        ctx.globalAlpha = isRingActive ? 1 : 0.1;
        ctx.fillStyle=col[2];
        ctx.fillText(g.lab, g.lx, g.ly);
      }
    }
    ctx.globalAlpha=1;
  }

  if(G.snakeGuide && G.snakeGuide.length > 1){
    ctx.lineWidth = 1.5 / zoom;
    ctx.setLineDash([6 / zoom, 5 / zoom]);
    for(var si = 1; si < G.snakeGuide.length; si++){
      var sp0 = G.snakeGuide[si - 1], sp1 = G.snakeGuide[si];
      if (sp0.k !== sp1.k) continue; // разрыв между концом одной строки и началом следующей
      ctx.strokeStyle = pc(sp0.k)[2];
      ctx.beginPath();
      ctx.moveTo(sp0.x, sp0.y);
      ctx.lineTo(sp1.x, sp1.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (selActive || isSelecting) {
    ctx.lineWidth = 2.5;
    if (highlightEqual && !isMinus) {
      ctx.strokeStyle = "#F1C40F"; 
      ctx.fillStyle = "rgba(241, 196, 15, 0.15)";
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = isMinus ? "#E74C3C" : "#F39C12"; 
      ctx.fillStyle = isMinus ? "rgba(231, 76, 60, 0.1)" : "rgba(243, 156, 18, 0.1)";
      ctx.setLineDash(isMinus ? [4, 4] : [8, 6]);
    }
    
    var selCX = rectX + rectW / 2, selCY = rectY + rectH / 2;
    var aspF = selFrameAspect();
    if (aspF) {
      var rhHalf = rectW / 2, rhHalfV = rhHalf * aspF;
      ctx.beginPath();
      ctx.moveTo(selCX, selCY - rhHalfV);
      ctx.lineTo(selCX + rhHalf, selCY);
      ctx.lineTo(selCX, selCY + rhHalfV);
      ctx.lineTo(selCX - rhHalf, selCY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillRect(rectX, rectY, rectW, rectH);
      ctx.strokeRect(rectX, rectY, rectW, rectH);
    }
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(selCX, selCY, 4, 0, Math.PI*2);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
  }

  if (balanceHl.checked) { // Баланс 1 и 0: показ включается галочкой «Баланс [1 и 0]»
    var curTheme = document.documentElement.dataset.theme;
    var balanceTextCol = (curTheme === "dark") ? "#FFFFFF" : "#111111";
    var balanceGlowCol = (curTheme === "dark") ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.6)";

    var color1 = highlightEqual ? balanceTextCol : "#F39C12";
    var color0 = highlightEqual ? balanceTextCol : "#E74C3C";

    ctx.font = "bold 90px 'Roboto Mono', monospace";
    ctx.textBaseline = "middle";

    if (highlightEqual) {
      ctx.shadowBlur = 25;
      ctx.shadowColor = balanceGlowCol;
    } else {
      ctx.shadowBlur = 0;
    }

    // Баланс — в нижних углах холста, мелким шрифтом, чтобы ничего не перекрывать
    var bay = stage.clientHeight - 70;
    var W = stage.clientWidth;

    var mainFont = "bold 58px 'Roboto Mono', monospace";
    var tailFont = "bold 28px 'Roboto Mono', monospace";
    var showT1 = dimPadded.checked && dispT1 > 0;
    var showT0 = dimPadded.checked && dispT0 > 0;
    var tailEqual = showT1 && showT0 && dispT1 === dispT0;
    ctx.textAlign = "left";

    ctx.fillStyle = color1;
    ctx.font = mainFont;
    var m1 = String(disp1);
    var w1 = ctx.measureText(m1).width;
    var tw1 = 0;
    if (showT1) { ctx.font = tailFont; tw1 = ctx.measureText("(" + dispT1 + ")").width; ctx.font = mainFont; }
    var lx0 = 24;
    ctx.fillText(m1, lx0, bay);
    if (showT1) {
        ctx.font = tailFont;
        if (tailEqual) {
            ctx.fillStyle = balanceTextCol;
            ctx.shadowBlur = 25;
            ctx.shadowColor = balanceGlowCol;
        } else {
            ctx.globalAlpha = 0.45;
        }
        ctx.fillText("(" + dispT1 + ")", lx0 + w1, bay);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = highlightEqual ? 25 : 0;
    }

    ctx.fillStyle = color0;
    ctx.font = mainFont;
    var m0 = String(disp0);
    var w0 = ctx.measureText(m0).width;
    var tw0 = 0;
    if (showT0) { ctx.font = tailFont; tw0 = ctx.measureText("(" + dispT0 + ")").width; ctx.font = mainFont; }
    var rx0 = W - 24 - w0 - tw0;
    ctx.fillText(m0, rx0, bay);
    if (showT0) {
        ctx.font = tailFont;
        if (tailEqual) {
            ctx.fillStyle = balanceTextCol;
            ctx.shadowBlur = 25;
            ctx.shadowColor = balanceGlowCol;
        } else {
            ctx.globalAlpha = 0.45;
        }
        ctx.fillText("(" + dispT0 + ")", rx0 + w0, bay);
        ctx.globalAlpha = 1;
    }

    ctx.shadowBlur = 0;
  }
}
/* === МАРКЕР 12: КЛИК ПО ЭТАЖУ, ПОСТРОЕНИЕ СЕЛЕКТОРА, ПОВОРОТ СТРОК === */
function hitFloor(wx,wy){
  if(G.kind==="iso"){
    var hf = getClickedFace(wx, wy);
    return hf ? hf.c[2] : null;
  }
  var L=G.list;
  for(var i=L.length-1;i>=0;i--){
    var c=L[i];
    var isRealGhost = (c[3]===0 && !c[4]);
    var isPadGhost = (c[3]===0 && c[4]);
    var forceGhost = (ghosts.checked && isRealGhost) || (ghostsAll.checked && isPadGhost);
    if(c[3] === 0 && !forceGhost && (!selActive)) continue;
    
    if(G.kind==="top"){
      if(wx>=aC(c)*TS && wx<=aC(c)*TS+TS && wy>=c[1]*TS && wy<=c[1]*TS+TS) return c[2];
    } else {
      var dx=Math.abs(wx-rhX(c)), dy=Math.abs(wy-(-c[2]*DD/2));
      if(dx/(DD/2)+dy/(DD/2)<=1) return c[2];
    }
  }
  return null;
}

// Фильтр строк по ВИДИМОСТИ при активной рамке выделения на холсте: без «Вычитать выделенное»
// видимые клетки — внутри рамки, с «Вычитанием» — снаружи. Строка считается видимой, если у неё
// есть хотя бы одна видимая клетка. Оба сдвига (символьный и визуальный) двигают только такие
// строки — то, что реально видно, независимо от способа получения видимости.
// lastFrameElements заполняется в draw() и остаётся валидным между отрисовками (рамка и сетка
// не двигаются между тактами), поэтому работает и из Сдвиг-Плея с подавлением отрисовки.
function visibleLinesUnderFrame(lines, silent){
    if (!((selActive || isSelecting) && lastFrameElements && lastFrameElements.size)) return lines;
    var inFrame = new Set(), outFrame = new Set();
    G.list.forEach(function(c, i){
        if (!c || c[5] === -1) return;
        if (lastFrameElements.has(i)) inFrame.add(c[5]); else outFrame.add(c[5]);
    });
    var visible = minusMode.checked ? outFrame : inFrame;
    var res = new Set();
    lines.forEach(function(absL){ if (visible.has(absL)) res.add(absL); });
    if (!silent && res.size < lines.size) {
        var skipped = Array.from(lines).filter(function(l){ return !res.has(l); });
        console.log("[Kubits] Сдвиг: невидимые строки (" + (minusMode.checked ? "вычтены рамкой" : "вне рамки") +
            ") не двигаются — " + skipped.map(function(l){ return "№" + (l + 1); }).join(", "));
    }
    return res;
}

function rotateSelected(dir, skipDraw, silent) {
    var rawLines = src.value.split("\n");
    var linesToShift = new Set();
    var shiftAll = (sel.size === 0); // без выделения сдвигаем ВСЕ строки

    G.list.forEach(function(c) {
        if ((shiftAll || sel.has(c[2])) && c[5] !== -1) {
            linesToShift.add(c[5]);
        }
    });
    linesToShift = visibleLinesUnderFrame(linesToShift, silent); // рамка: крутим только видимые строки

    var changed = false;
    linesToShift.forEach(function(absL) {
        var line = rawLines[absL];
        var match = line.match(/^(\s*)(.*?)(\s*)$/);
        if(match) {
            var pre = match[1], core = match[2], post = match[3];
            // Крутим ТОЛЬКО саму строку: добор в редактор не записываем,
            // он пересчитается от сдвинутой строки и останется прозрачным
            if (core.length > 1) {
                if (dir === 'CW') {
                    core = core.slice(-1) + core.slice(0, -1);
                } else {
                    core = core.slice(1) + core.slice(0, 1);
                }
                rawLines[absL] = pre + core + post;
                changed = true;
            }
        }
    });

    if (changed) {
        var selBackup = Array.from(sel); 
        src.value = rawLines.join("\n");
        parse();
        var onesCount = D.cells.filter(function(c){return c[3]===1}).length;
        stF.textContent=D.floors; stC.textContent=onesCount;
        warn.style.display=D.truncated?"block":"none";
        buildSelector();
        geometry();
        
        selBackup.forEach(function(k) { sel.add(k); });
        if (!skipDraw) draw(); // skipDraw=true — вызывающий (shiftAnimTick) сам решает, рисовать ли холст
        syncSelUI();
    }
}

// Визуальный сдвиг по кругу («👁 Визуальный сдвиг»): в отличие от rotateSelected, НЕ трогает
// src.value — крутит только то, какая клетка кольца какой бит показывает (ringVisualShift).
// Работает только там, где реально используется добор по кругу (ring.doLoop) — на выбранных
// этажах (или на всех, если ничего не выбрано).
// silent=true (передаёт непрерывный «▶ Плей», см. shiftAnimTick) — без console.log: на каждом
// такте сдвигаются и находятся ОДНИ И ТЕ ЖЕ строки, лог этого не показывает ничего нового, зато
// на скорости Плея быстро копит тысячи записей в консоли и тратит время на них зря. Разовый
// сдвиг по клику кнопки логируется как раньше.
function shiftRingVisual(dir, skipDraw, silent) {
    var linesToShift = new Set();
    var shiftAll = (sel.size === 0);
    G.list.forEach(function(c) {
        if ((shiftAll || sel.has(c[2])) && c[5] !== -1) linesToShift.add(c[5]);
    });
    // Рамка выделения на холсте: крутятся только ВИДИМЫЕ строки — без «Вычитания» это строки
    // в рамке, с «Вычитать выделенное» — строки вне её (см. visibleLinesUnderFrame).
    linesToShift = visibleLinesUnderFrame(linesToShift, silent);
    if (!linesToShift.size) {
        if (!silent) console.log("[Kubits] Визуальный сдвиг: нет ни одной подходящей строки (пусто на этаже/строке?), ничего не сдвинуто.");
        return;
    }
    var rawLinesForLog = silent ? null : src.value.split("\n");
    linesToShift.forEach(function(absL) {
        var cur = ringVisualShift[absL] || 0;
        ringVisualShift[absL] = cur + (dir === 'CW' ? 1 : -1);
    });
    if (!silent) {
        console.log("[Kubits] Визуальный сдвиг (" + dir + "), sel=" + JSON.stringify(Array.from(sel)) + ": " +
            Array.from(linesToShift).map(function(absL){
                return "строка №" + (absL + 1) + " \"" + rawLinesForLog[absL].trim() + "\" → сдвиг=" + ringVisualShift[absL];
            }).join("; "));
    }
    parse();
    geometry();
    updateShiftVariantsInfo(); // «текущий вариант» зависит от ringVisualShift — держим в курсе
    if (!skipDraw) draw(); // skipDraw=true — вызывающий (shiftAnimTick) сам решает, рисовать ли холст
}
function resetRingVisualShift() {
    var shiftAll = (sel.size === 0);
    if (shiftAll) {
        ringVisualShift = {};
    } else {
        G.list.forEach(function(c) {
            if (sel.has(c[2]) && c[5] !== -1) delete ringVisualShift[c[5]];
        });
    }
    parse();
    geometry();
    updateShiftVariantsInfo();
    draw();
}

/* === МАРКЕР 12a: ИТОГОВЫЕ СТРОКИ ЛАЗЕРОВ ДЛЯ ВЫГРУЗКИ В EXCEL === */
// Собирает текущие лазеры в строки {axis, axisLabel, index, str} — тем же способом, что и панель результатов
function laserResultRowsForExport() {
    if (!(skewerMode.checked && laserModeOk()) || !skewers.length) return [];
    var lctx = buildLaserNodes();
    var axisLabel = {
        top:   (currentLang==='ru' ? 'Верх'  : 'Top'),
        right: (currentLang==='ru' ? 'Право' : 'Right'),
        left:  (currentLang==='ru' ? 'Лево'  : 'Left'),
        horiz: (currentLang==='ru' ? 'Гориз' : 'Horiz'),
        db:    (currentLang==='ru' ? 'Диаг \\' : 'Diag \\'),
        da:    (currentLang==='ru' ? 'Диаг /'  : 'Diag /')
    };
    var rows = [];
    skewers.forEach(function(sk){
        var hitList = beamCells(sk.type, sk.d);
        var str = "";
        hitList.forEach(function(hit){ str += hit.c[3]; });
        var node = (lctx.groups[sk.type] || []).find(function(n){ return n.d === sk.d; });
        rows.push({ axis: sk.type, axisLabel: axisLabel[sk.type] || sk.type, index: node ? node.index : 0, str: str });
    });
    var order = { top:0, right:1, left:2 };
    rows.sort(function(a,b){ return (order[a.axis]-order[b.axis]) || (a.index-b.index); });
    return rows;
}
// Все ВОЗМОЖНЫЕ лазерные строки — по каждой точке каждой оси (не только по уже добавленным
// пользователем лазерам). Используется, когда лазеров ещё нет ни одного: тогда «По лазерам» ищет
// совпадение сразу по всем осям, а не только там, где явно стоит лазер.
function allPossibleLaserRows() {
    if (!(skewerMode.checked && laserModeOk()) || !G || !G.list) return [];
    var lctx = buildLaserNodes();
    var axisLabel = {
        top:   (currentLang==='ru' ? 'Верх'  : 'Top'),
        right: (currentLang==='ru' ? 'Право' : 'Right'),
        left:  (currentLang==='ru' ? 'Лево'  : 'Left'),
        horiz: (currentLang==='ru' ? 'Гориз' : 'Horiz'),
        db:    (currentLang==='ru' ? 'Диаг \\' : 'Diag \\'),
        da:    (currentLang==='ru' ? 'Диаг /'  : 'Diag /')
    };
    var rows = [];
    lctx.nodes.forEach(function(node){
        var hitList = beamCells(node.type, node.d);
        var str = "";
        hitList.forEach(function(hit){ str += hit.c[3]; });
        rows.push({ axis: node.type, axisLabel: axisLabel[node.type] || node.type, index: node.index, str: str });
    });
    var order = { top:0, right:1, left:2 };
    rows.sort(function(a,b){ return (order[a.axis]-order[b.axis]) || (a.index-b.index); });
    return rows;
}
// Строки для проверок «По лазерам»/автозахвата: если у пользователя стоит хоть один лазер —
// смотрим только на них (его явный выбор), иначе — сразу по всем возможным осям.
function laserRowsForCapture() {
    return skewers.length ? laserResultRowsForExport() : allPossibleLaserRows();
}
// Стили для листа «Лазеры» (заголовок + ячейки, всё выровнено по левому краю)
function laserExcelStyleDefs(isDark) {
    var head = isDark ? "#5DCAA5" : "#1D9E75";
    return '<Style ss:ID="lz_h"><Alignment ss:Horizontal="Left" ss:Vertical="Center"/><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="'+head+'" ss:Pattern="Solid"/></Style>'
         + '<Style ss:ID="lz_c"><Alignment ss:Horizontal="Left" ss:Vertical="Center"/></Style>';
}
// Отдельный лист «Лазеры» с итоговыми строками; пусто, если лазеров нет
function laserWorksheetXml() {
    var rows = laserResultRowsForExport();
    if (!rows.length) return "";
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    var head = (currentLang==='ru') ? ['Ось','№','Итог (строка лазера)'] : ['Axis','#','Result (laser string)'];
    var body = '<Row>'
        + '<Cell ss:StyleID="lz_h"><Data ss:Type="String">'+head[0]+'</Data></Cell>'
        + '<Cell ss:StyleID="lz_h"><Data ss:Type="String">'+head[1]+'</Data></Cell>'
        + '<Cell ss:StyleID="lz_h"><Data ss:Type="String">'+head[2]+'</Data></Cell>'
        + '</Row>';
    rows.forEach(function(r){
        body += '<Row>'
            + '<Cell ss:StyleID="lz_c"><Data ss:Type="String">'+esc(r.axisLabel)+'</Data></Cell>'
            + '<Cell ss:StyleID="lz_c"><Data ss:Type="Number">'+r.index+'</Data></Cell>'
            + '<Cell ss:StyleID="lz_c"><Data ss:Type="String">'+esc(r.str)+'</Data></Cell>'

    });
    var name = (currentLang==='ru') ? 'Лазеры' : 'Lasers';
    return '<Worksheet ss:Name="'+name+'"><Table ss:DefaultColumnWidth="90" ss:DefaultRowHeight="20">'
        + '<Column ss:Width="60"/><Column ss:Width="40"/><Column ss:Width="420"/>'
        + body + '</Table></Worksheet>';
}

/* === МАРКЕР 13: ЭКСПОРТ В EXCEL — ВАРИАНТ «СЕТКА» (с центрированием) === */
function exportExcel() {
    if(currentView !== "top" && mode.value !== "rhomb") {
        alert(currentLang === 'ru' 
            ? "Экспорт в Excel доступен только в режиме 'Вид сверху' или 'Ромбы'!\nПожалуйста, переключитесь на вид сверху, чтобы выгрузить таблицу." 
            : "Excel export is only available in 'Top view' or 'Rhombuses' mode!\nPlease switch to Top View to download the spreadsheet.");
        return;
    }
    
    var isDark = (document.documentElement.dataset.theme === "dark");
    var emptyBg = isDark ? "#1C2724" : "#FFFFFF";
    var inactiveBg = isDark ? "#3A3F3D" : "#D0D0D0";
    var inactiveFg = isDark ? "#8A8F8D" : "#777777";

    function blend(hex1, hex2, alpha) {
        var r1 = parseInt(hex1.slice(1, 3), 16);
        var g1 = parseInt(hex1.slice(3, 5), 16);
        var b1 = parseInt(hex1.slice(5, 7), 16);
        var r2 = parseInt(hex2.slice(1, 3), 16);
        var g2 = parseInt(hex2.slice(3, 5), 16);
        var b2 = parseInt(hex2.slice(5, 7), 16);
        var r = Math.round(r1 * alpha + r2 * (1 - alpha));
        var g = Math.round(g1 * alpha + g2 * (1 - alpha));
        var b = Math.round(b1 * alpha + b2 * (1 - alpha));
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }
    
    function getLuma(hex) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return 0.299 * r + 0.587 * g + 0.114 * b;
    }

    if (mode.value === "rhomb") {
        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        var exportList = [];
        
        G.list.forEach(function(c) {
            var val = c[3];
            var isGhost = (val === 0);
            var isPadded = c[4];
            var isActive = true;
            if (sel.size > 0) isActive = minusMode.checked ? !sel.has(c[2]) : sel.has(c[2]);
            
            var floor = c[2];
            var rRow = D.floors - 1 - floor;
            
            var halfShift = (D.half && D.half[floor]) !== undefined ? D.half[floor] : 0;
            var excel_x = Math.round((c[0] + halfShift) * 2);
            var excel_y = rRow;
            
            if (excel_x < minX) minX = excel_x;
            if (excel_x + 1 > maxX) maxX = excel_x + 1;
            if (excel_y < minY) minY = excel_y;
            if (excel_y > maxY) maxY = excel_y;
            
            exportList.push({
                c: c, excel_x: excel_x, excel_y: excel_y, 
                isActive: isActive, isPadded: isPadded
            });
        });
        
        if (minX > maxX) { alert("Нет данных"); return; }
        
        var matrix = {};
        for(var y = minY; y <= maxY; y++) {
            matrix[y] = {};
            for(var x = minX; x <= maxX; x++) matrix[y][x] = null;
        }
        
        exportList.forEach(function(item) {
            var c = item.c;
            var floor = c[2];
            var col = pc(floor);
            var bg = col[0], borderCol = col[3], fg;
            var isDimmed = c[4];

            if (isDimmed) {
                bg = blend(col[0], emptyBg, 0.15);
                borderCol = isDark ? "#FFFFFF" : "#777777";
                fg = blend(col[3], emptyBg, 0.35);
            } else if (c[3] === 0) {
                bg = emptyBg; borderCol = isDark ? col[1] : col[3]; fg = borderCol;
            } else if (!item.isActive) {
                bg = inactiveBg; borderCol = inactiveFg; fg = inactiveFg;
            } else {
                bg = col[0]; borderCol = col[3];
                fg = getLuma(bg) < 120 ? "#FFFFFF" : "#111111";
            }
            
            var ex = item.excel_x, ey = item.excel_y;
            var valL = (c[3] === 1) ? 1 : 0;
            var valR = (c[3] === 1) ? 0 : 1;
            var isEvenFloor = (floor % 2 === 0);
            var diagL = isEvenFloor ? 'Slash' : 'Backslash';
            var diagR = isEvenFloor ? 'Backslash' : 'Slash';
            
            matrix[ey][ex]   = { val: valL, bg: bg, fg: fg, borderCol: borderCol, type: 'L', diag: diagL };
            matrix[ey][ex+1] = { val: valR, bg: bg, fg: fg, borderCol: borderCol, type: 'R', diag: diagR };
        });
        
        var styleMap = {}, styleDefs = "", styleCount = 0;
        function getRhombStyleId(bg, fg, borderCol, type, diag) {
            var key = bg + "|" + fg + "|" + borderCol + "|" + type + "|" + diag;
            if (!styleMap[key]) {
                styleCount++;
                var id = "rs" + styleCount;
                styleMap[key] = id;
                var diagPos = (diag === 'Slash') ? "DiagonalRight" : "DiagonalLeft";
                var align = (type === 'L') ? "Right" : "Left";
                styleDefs += '<Style ss:ID="' + id + '">'
                    + '<Alignment ss:Horizontal="' + align + '" ss:Vertical="Center"/>'
                    + '<Borders>'
                    + '<Border ss:Position="' + diagPos + '" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="' + borderCol + '"/>'
                    + '</Borders>'
                    + '<Font ss:Color="' + fg + '" ss:Bold="1" ss:Size="10"/>'
                    + '<Interior ss:Color="' + bg + '" ss:Pattern="Solid"/>'
                    + '</Style>';
            }
            return styleMap[key];
        }
        styleDefs += '<Style ss:ID="empty_cell_style"><Interior ss:Color="' + emptyBg + '" ss:Pattern="Solid"/></Style>';
        
        var rowsXml = "";
        for(var y2 = minY; y2 <= maxY; y2++) {
            rowsXml += '<Row ss:AutoFitHeight="0" ss:Height="30">';
            for(var x2 = minX; x2 <= maxX; x2++) {
                var cell = matrix[y2][x2];
                if (cell) {
                    rowsXml += '<Cell ss:StyleID="' + getRhombStyleId(cell.bg, cell.fg, cell.borderCol, cell.type, cell.diag) + '">'
                        + '<Data ss:Type="Number">' + cell.val + '</Data></Cell>';
                } else {
                    rowsXml += '<Cell ss:StyleID="empty_cell_style"/>';
                }
            }
            rowsXml += '</Row>';
        }
        
        var xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'
            + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
            + '<Styles>' + styleDefs + laserExcelStyleDefs(isDark) + '</Styles>'
            + '<Worksheet ss:Name="Rhombuses"><Table ss:DefaultColumnWidth="30" ss:DefaultRowHeight="30">' + rowsXml + '</Table></Worksheet>'
            + laserWorksheetXml() + '</Workbook>';

        saveBlob(xml, 'rhombuses_grid.xml');
        return;
    } else {
        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        var exportList = [];
        G.list.forEach(function(c) {
            var isActive = (sel.size === 0 || (minusMode.checked ? !sel.has(c[2]) : sel.has(c[2])));

            if (c[3] === 0 && !((ghosts.checked && !c[4]) || (ghostsAll.checked && c[4]))) return;
            if (c[0] < minX) minX = c[0]; if (c[0] > maxX) maxX = c[0];
            if (c[1] < minY) minY = c[1]; if (c[1] > maxY) maxY = c[1];
            exportList.push({c: c, isActive: isActive});
        });
        if (minX > maxX) return;
        var matrix = {};
        for(var y = minY; y <= maxY; y++) { matrix[y] = {}; for(var x = minX; x <= maxX; x++) matrix[y][x] = null; }
        exportList.forEach(function(item) {
            var c = item.c, col = pc(c[2]), bg = col[0], isDim = dimPadded.checked && c[4];
            var fg;
            if (c[3] === 0) {
                bg = emptyBg; var gfg = isDark ? col[1] : col[3];

        var bcol = isDark ? "#31423C" : "#DCDAD1", styleMap = {}, styleDefs = "", sc = 0;
        function getSid(bg, fg) {

                    + '<Font ss:Color="' + fg + '" ss:Bold="1"/><Interior ss:Color="' + bg + '" ss:Pattern="Solid"/></Style>';
            } return styleMap[k];
        }
        var rowsXml = "";
        for(var y2 = minY; y2 <= maxY; y2++) {
            rowsXml += '<Row ss:AutoFitHeight="0" ss:Height="30">';
            for(var x2 = minX; x2 <= maxX; x2++) {

                if (cell) rowsXml += '<Cell ss:StyleID="' + getSid(cell.bg, cell.fg) + '"><Data ss:Type="Number">' + cell.val + '</Data></Cell>';
                else rowsXml += '<Cell ss:StyleID="' + getSid(emptyBg, emptyBg) + '"/>';
            } rowsXml += '</Row>';
        }

/* === МАРКЕР 14: ЭКСПОРТ В EXCEL — ВАРИАНТ «ПРЯМОЙ» (без сдвигов) === */
function exportExcelAlt() {
    if(currentView !== "top" && mode.value !== "rhomb") {
        alert(currentLang === 'ru' 
            ? "Экспорт в Excel доступен только в режиме 'Вид сверху' или 'Ромбы'!\nПожалуйста, переключитесь на вид сверху, чтобы выгрузить таблицу." 
            : "Excel export is only available in 'Top view' or 'Rhombuses' mode!\nPlease switch to Top View to download the spreadsheet.");
        return;
    }
    
    var isDark = (document.documentElement.dataset.theme === "dark");
    var emptyBg = isDark ? "#1C2724" : "#FFFFFF";
    var inactiveBg = isDark ? "#3A3F3D" : "#D0D0D0";
    var inactiveFg = isDark ? "#8A8F8D" : "#777777";

    function blend(hex1, hex2, alpha) {
        var r1 = parseInt(hex1.slice(1, 3), 16);
        var g1 = parseInt(hex1.slice(3, 5), 16);
        var b1 = parseInt(hex1.slice(5, 7), 16);
        var r2 = parseInt(hex2.slice(1, 3), 16);
        var g2 = parseInt(hex2.slice(3, 5), 16);
        var b2 = parseInt(hex2.slice(5, 7), 16);
        var r = Math.round(r1 * alpha + r2 * (1 - alpha));
        var g = Math.round(g1 * alpha + g2 * (1 - alpha));
        var b = Math.round(b1 * alpha + b2 * (1 - alpha));
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }
    
    function getLuma(hex) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return 0.299 * r + 0.587 * g + 0.114 * b;
    }

    if (mode.value === "rhomb") {
        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        var exportList = [];
        
        G.list.forEach(function(c) {
            var val = c[3];
            var isGhost = (val === 0);
            var isPadded = c[4];
            var isActive = true;
            if (sel.size > 0) isActive = minusMode.checked ? !sel.has(c[2]) : sel.has(c[2]);
            
            var floor = c[2];
            var rRow = D.floors - 1 - floor;
            
            var excel_x = c[0] * 2;
            var excel_y = rRow;
            
            if (excel_x < minX) minX = excel_x;
            if (excel_x + 1 > maxX) maxX = excel_x + 1;
            if (excel_y < minY) minY = excel_y;
            if (excel_y > maxY) maxY = excel_y;
            
            exportList.push({
                c: c, excel_x: excel_x, excel_y: excel_y, 
                isActive: isActive, isPadded: isPadded
            });
        });
        
        if (minX > maxX) { alert("Нет данных"); return; }
        
        var matrix = {};
        for(var y = minY; y <= maxY; y++) {
            matrix[y] = {};
            for(var x = minX; x <= maxX; x++) matrix[y][x] = null;
        }
        
        exportList.forEach(function(item) {
            var c = item.c;
            var floor = c[2];
            var col = pc(floor);
            var bg = col[0], borderCol = col[3], fg;
            var isDimmed = c[4];

            if (isDimmed) {
                bg = blend(col[0], emptyBg, 0.15);
                borderCol = isDark ? "#FFFFFF" : "#777777";
                fg = blend(col[3], emptyBg, 0.35);
            } else if (c[3] === 0) {
                bg = emptyBg; borderCol = isDark ? col[1] : col[3]; fg = borderCol;
            } else if (!item.isActive) {
                bg = inactiveBg; borderCol = inactiveFg; fg = inactiveFg;
            } else {
                bg = col[0]; borderCol = col[3];
                fg = getLuma(bg) < 120 ? "#FFFFFF" : "#111111";
            }
            
            var ex = item.excel_x, ey = item.excel_y;
            var valL = (c[3] === 1) ? 1 : 0;
            var valR = (c[3] === 1) ? 0 : 1;
            var isEvenFloor = (floor % 2 === 0);
            var diagL = isEvenFloor ? 'Slash' : 'Backslash';
            var diagR = isEvenFloor ? 'Backslash' : 'Slash';
            
            matrix[ey][ex]   = { val: valL, bg: bg, fg: fg, borderCol: borderCol, type: 'L', diag: diagL };
            matrix[ey][ex+1] = { val: valR, bg: bg, fg: fg, borderCol: borderCol, type: 'R', diag: diagR };
        });
        
        var styleMap = {}, styleDefs = "", styleCount = 0;
        function getRhombStyleId(bg, fg, borderCol, type, diag) {
            var key = bg + "|" + fg + "|" + borderCol + "|" + type + "|" + diag;
            if (!styleMap[key]) {

                    + '</Style>';
            }
            return styleMap[key];
        }
        styleDefs += '<Style ss:ID="empty_cell_style"><Interior ss:Color="' + emptyBg + '" ss:Pattern="Solid"/></Style>';
        
        var rowsXml = "";
        for(var y2 = minY; y2 <= maxY; y2++) {

        var xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'

            + laserWorksheetXml() + '</Workbook>';

        saveBlob(xml, 'rhombuses_grid_direct.xml');
        return;
    } else {
        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        var exportList = [];
        G.list.forEach(function(c) {
            var isActive = (sel.size === 0 || (minusMode.checked ? !sel.has(c[2]) : sel.has(c[2])));
            if (!isActive && c[3] === 0) return;

            if (c[0] < minX) minX = c[0]; if (c[0] > maxX) maxX = c[0];

            exportList.push({c: c, isActive: isActive});

        if (minX > maxX) return;
        var matrix = {};
        for(var y = minY; y <= maxY; y++) { matrix[y] = {}; for(var x = minX; x <= maxX; x++) matrix[y][x] = null; }
        exportList.forEach(function(item) {

        var rowsXml = "";

function saveBlob(xml, name) {
    var blob = new Blob([xml], {type: 'text/xml'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* === Кеш «Данных (Строки)» в localStorage браузера (ручной, кнопкой) === */
// Автозаписи НЕТ (v0.258 сбивала данные — откачено): кеш пишется только кнопкой «💾 Запомнить»
// над редактором. Вместе с текстом запоминается и положение верхней/нижней границы «Данных».
// Запомненное: 1) автоматически подтягивается при загрузке/F5 ЛЮБОЙ версии файла в том же
// браузере тем же способом (file:// и http://127.0.0.1 — разные хранилища); 2) возвращается
// кнопкой «⏹ Сброс» над редактором (если кеша нет — сброс к шаблону из кода). Пустой кеш игнорируется.
var SRC_CACHE_KEY = "kubits_src";
function saveSrcToCache(){
  try {
    localStorage.setItem(SRC_CACHE_KEY, JSON.stringify({ src: src.value, lineLimit: lineLimit, lineLimitTop: lineLimitTop }));
    return true;
  } catch(e){ return false; }
}
function getSrcCache(){
  try {
    var s = localStorage.getItem(SRC_CACHE_KEY);
    if (!s) return null;
    var parsed = null;
    try { parsed = JSON.parse(s); } catch(e){ parsed = null; }
    if (parsed && typeof parsed === "object" && typeof parsed.src === "string") {
      return parsed.src.trim() ? parsed : null;
    }
    // кеш старого формата (просто текст, до появления границ в кеше) — границы не сохранены
    return s.trim() ? { src: s, lineLimit: -1, lineLimitTop: 0 } : null;
  } catch(e){ return null; }
}
function restoreSrcFromCache(){
  var saved = getSrcCache();
  if (saved !== null) {
    src.value = saved.src;
    lineLimit = saved.lineLimit;
    lineLimitTop = saved.lineLimitTop;
  }
}

/* === Сквозной автозахват нижней строки (граница lineLimit) === */
// Биты строки сразу под границей (первая не участвующая строка). Пусто = нечего искать.
function belowRowBits(){
  var lines = src.value.split("\n");
  if (lineLimit < 0 || lineLimit >= lines.length) return "";
  return lines[lineLimit].trim().replace(/\s+/g, "");
}
// Искомый паттерн нижней строки: при включённом «Без 1-го символа» отбрасываем первый бит
// (искать со 2-го). Строку из одного символа не укорачиваем.
function belowRowSearchPat(){
  var pat = belowRowBits();
  var sf = $("skipFirstCharCheck");
  if (sf && sf.checked && pat.length > 1) pat = pat.slice(1);
  return pat;
}
// Найдена ли нижняя строка в «сквозной» строке haystack, и КАКИМ вариантом — как в лазерной
// подсветке: прямой / инверсия / реверс + все циклические повороты паттерна.
function belowRowFoundInDetail(haystack){
  var pat = belowRowSearchPat();
  if (!pat || !haystack) return null;
  for (var k = 0; k < pat.length; k++){
    var rot = pat.slice(k) + pat.slice(0, k);
    var inv = "", rev = "";
    for (var i = 0; i < rot.length; i++) inv += (rot[i] === '1' ? '0' : '1');
    for (var i = rot.length - 1; i >= 0; i--) rev += rot[i];
    var vs = [{ s: rot, kind: 'прямой' }, { s: inv, kind: 'инверсия' }, { s: rev, kind: 'реверс' }];
    for (var vi = 0; vi < vs.length; vi++){
      if (vs[vi].s && haystack.indexOf(vs[vi].s) !== -1) return { kind: vs[vi].kind, pat: vs[vi].s, rot: k, total: pat.length };
    }
  }
  return null;
}
// В каком именно лазере найдена нижняя строка (или null) — для лога «какой лазер дал строку».
// Проверяет строки-результаты каждого лазера отдельно: прямой/инверсия/реверс + повороты.
// Если у пользователя нет ни одного лазера — проверяет сразу все возможные оси (laserRowsForCapture).
function belowRowFoundLaser(){
  var pat = belowRowSearchPat();
  if (!pat) return null;
  var rows = laserRowsForCapture();
  for (var k = 0; k < pat.length; k++){
    var rot = pat.slice(k) + pat.slice(0, k);
    var inv = "", rev = "";
    for (var i = 0; i < rot.length; i++) inv += (rot[i] === '1' ? '0' : '1');
    for (var i = rot.length - 1; i >= 0; i--) rev += rot[i];
    var vs = [{ s: rot, kind: 'прямой' }, { s: inv, kind: 'инверсия' }, { s: rev, kind: 'реверс' }];
    for (var r = 0; r < rows.length; r++){
      for (var vi = 0; vi < vs.length; vi++){
        if (vs[vi].s && rows[r].str.indexOf(vs[vi].s) !== -1){
          return { axisLabel: rows[r].axisLabel, index: rows[r].index, kind: vs[vi].kind, rot: k, pat: vs[vi].s, total: pat.length };
        }
      }
    }
  }
  return null;
}
// «Сквозная» склейка всех участвующих строк (0..lineLimit-1) с их добором подряд одной строкой.
function throughRowsHaystack(){
  var lines = src.value.split("\n");
  var lim = (lineLimit < 0) ? lines.length : Math.min(lineLimit, lines.length);
  var s = "";
  for (var i = 0; i < lim; i++){
    var t = lines[i].trim().replace(/\s+/g, "");
    if (!t) continue;
    var pad = (D && D.padTails && D.padTails[i]) ? D.padTails[i] : "";
    s += t + pad;
  }
  return s;
}
// Склейка всех строк-результатов лазеров подряд (или всех возможных осей, если лазеров ещё нет).
function throughLasersHaystack(){
  var rows = laserRowsForCapture();
  var s = "";
  rows.forEach(function(r){ s += r.str; });
  return s;
}
// Побитовое чередование двух строк: b1[0],b2[0],b1[1],b2[1],... (до длины более длинной из двух).
function interleave(a, b){
  var maxLen = Math.max(a.length, b.length), out = "";
  for (var i = 0; i < maxLen; i++){
    if (i < a.length) out += a[i];
    if (i < b.length) out += b[i];
  }
  return out;
}
// «Стог» для интерливинга: ВСЕ уже включённые строки над границей (не под ней!) разбиваются на
// пары СКОЛЬЗЯЩИМ ОКНОМ — 1+2, 2+3, 3+4, 4+5, ... (каждая соседняя пара, с перекрытием, а не
// только 1+2 / 3+4 без повтора строк), каждая пара чередуется побитово, и результаты всех пар
// склеиваются подряд в ОДНУ сквозную строку-стог.
//   А/Б (кнопки btnIlVarA/btnIlVarB, взаимоисключающие) — общий для ВСЕГО стога способ сборки:
//     А) в каждой паре сначала чередуем сами биты (b1[0],b2[0],b1[1],b2[1]...), потом отдельно
//        хвосты добора, и склеиваем результаты;
//     Б) в каждой паре сначала каждая строка целиком (биты+хвост добора), потом чередуем эти две
//        целые строки.
//   →/← — сторона добора (после бит / перед битами) теперь СВОЯ У КАЖДОЙ ПАРЫ (ilPairSide[i]),
//     а не одна на весь стог: клик по кнопкам →/← в панели задаёт лишь ОБЩИЙ ДЕФОЛТ и сбрасывает
//     точечные правки; клик по конкретному куску пары в панели «Стог» меняет сторону ТОЛЬКО этой
//     пары. «?» ничего не решает сама — под ней самая новая (ещё не решённая) пара показывается
//     ОБЕИМИ сторонами для сравнения, а кнопки →/← в подсказке ниже пишут решение в ту же
//     ilPairSide. Захват НИКОГДА не ждёт ответа: нерешённые пары всегда «право» по умолчанию.
// Если над границей только одна строка — чередовать не с чем (А/Б неприменимы), стог — она сама
// (ключ "single" в ilPairSide), только сторона добора (→/←) имеет смысл.
// Эффективная сторона добора конкретного ключа (индекс пары или "single"): точечная правка
// (клик по куску в панели / ответ в подсказке «?», хранится в ilPairSide) важнее общего дефолта;
// если сейчас активна «?» и правки для этого ключа нет — дефолт «право» (захват не должен ждать
// ответа). true=право, false=лево. Общая функция — используется и при сборке стога, и при
// клике по куску (чтобы понять, на какую сторону переключать).
function ilEffectiveSide(key){
  if (ilPairSide[key] === "right") return true;
  if (ilPairSide[key] === "left") return false;
  var askEl = $("btnIlSideAsk"), elR = $("btnIlSideRight");
  var askMode = !!(askEl && askEl.classList.contains("active"));
  if (askMode) return true;
  return !elR || elR.classList.contains("active");
}
function aboveRowsInterleavedHaystacks(){
  var lines = src.value.split("\n");
  var lim = (lineLimit < 0) ? lines.length : Math.min(lineLimit, lines.length);
  if (lim <= 0) return [];
  var bitsOf = function(i){ return lines[i].trim().replace(/\s+/g, ""); };
  var padOf = function(i){ return (D && D.padTails && D.padTails[i]) ? D.padTails[i] : ""; };

  var elA = $("btnIlVarA");
  var useA = !elA || elA.classList.contains("active");
  var askEl = $("btnIlSideAsk");
  var askMode = !!(askEl && askEl.classList.contains("active"));

  if (lim === 1) {
    var bits0 = bitsOf(0), pad0 = padOf(0);
    var pending0 = askMode && ilPairSide.single === undefined;
    var opts0 = pending0 ? [true, false] : [ilEffectiveSide("single")];
    return opts0.map(function(right){
      return right ? { str: bits0 + pad0, tag: "→", bounds: [0, bits0.length + pad0.length] }
                    : { str: pad0 + bits0, tag: "←", bounds: [0, pad0.length + bits0.length] };
    });
  }

  var lastPairIdx = lim - 2; // индекс самой новой пары — только она может быть «ещё не решённой»
  var pendingLast = askMode && ilPairSide[lastPairIdx] === undefined;
  var lastSideOpts = pendingLast ? [true, false] : [ilEffectiveSide(lastPairIdx)];

  var candidates = [];
  lastSideOpts.forEach(function(lastRight){
    var h = "", bounds = [0];
    for (var i = 0; i + 1 < lim; i++){
      var right = (i === lastPairIdx) ? lastRight : ilEffectiveSide(i);
      var b1 = bitsOf(i), b2 = bitsOf(i + 1), p1 = padOf(i), p2 = padOf(i + 1);
      if (useA) h += right ? (interleave(b1, b2) + interleave(p1, p2)) : (interleave(p1, p2) + interleave(b1, b2));
      else h += right ? interleave(b1 + p1, b2 + p2) : interleave(p1 + b1, p2 + b2);
      bounds.push(h.length);
    }
    var tag = (useA ? "А" : "Б") + (pendingLast ? (lastRight ? "→" : "←") : "");
    candidates.push({ str: h, tag: tag, bounds: bounds });
  });

  var seen = {}, res = [];
  candidates.forEach(function(c){
    if (seen[c.str] !== undefined) return; // дедуп: одинаковые строки (напр. без добора) не дублируем
    seen[c.str] = true;
    res.push(c);
  });
  return res;
}
// Счётчик «попытка N из total» для поисковых циклов автозахвата (см. ниже) — просто текст,
// без перерисовки холста; total = максимум попыток (сколько строк вообще может быть втянуто).
function setCaptureProgress(n, total){
  var el = $("captureProgress");
  if (el) el.textContent = n > 0 ? ("попытка " + n + " из " + total) : "";
}
function clearCaptureProgress(){ setCaptureProgress(0, 0); }

// «Быстрый» пересчёт модели для поисковых циклов: то же, что нужно belowRowMatchDetail/лазерам
// (parse — новый D/добор под сдвинутой границей, geometry — новые координаты G.list для
// beamCells), но БЕЗ отрисовки холста и обвязки правой панели (autoFit/buildSelector/syncSelUI/
// updateLineLimitBar/laserReapplyAll) — они не влияют на сам поиск, только на то, что видно
// пользователю. Полноценный rebuild() (со всем этим и отрисовкой) делается один раз в конце
// цикла — см. captureBelowThroughLasers.
function fastModelRecompute(){
  resetXorOverlays();
  parse();
  geometry();
}

// «🚫 Без отрисовки при Плее» (чекбокс, по умолчанию ВЫКЛЮЧЕН): пока играет любая из 6 анимаций
// (Флип/Поворот/Сдвиг/Этажи/Змейка) И включён непрерывный «Автозахват» — не гоняем полный
// draw() на КАЖДОМ такте (дорого: холст + вся обвязка), а только проверяем автозахват (ВСЕГДА
// полная проверка, все 4 уровня — см. belowRowMatchDetail/computeAssemblyHaystackFresh, ей draw()
// для этого не нужен). Рисуем полноценно только когда реально что-то захвачено — тогда видно,
// что граница сдвинулась. Если чекбокс выключен (по умолчанию) — обычный draw() на каждом такте,
// как и было всегда; анимация видна вживую.
// Активно ли сейчас «Без отрисовки при Плее» (чекбокс включён И играет любой из 5 Плеев) — общая
// проверка для playTickRender/шифт-тика И для встроенного в draw() автозахвата (тот должен
// промолчать в этом случае, чтобы не дублировать работу тика, см. MARKER 11).
function suppressDrawDuringPlayActive(){
  var suppressEl = $("suppressDrawDuringPlay");
  var acbEl = $("autoCaptureBelow");
  var anyPlayOn = shiftAnimOn || flipAnimOn || rotAnimOn || floorAnimOn || snakeAnimOn;
  return !!(suppressEl && suppressEl.checked && acbEl && acbEl.checked && anyPlayOn);
}
// При включении галки все 5 ползунков скоростей Плеев автоматически ставятся на максимум
// скорости (минимальное значение ползунка = самый короткий период) — реальный прирост темпа
// поиска подавление даёт именно там, где отрисовка была узким местом (замер v0.258: 252
// такта/с против 104 на максимуме Сдвига). Прежние значения запоминаются и возвращаются при
// выключении. dispatchEvent("input") — чтобы уже играющий плеер перезапустил таймер с новым
// периодом (makePlayer слушает "input"), а fastZone-подсветка ползунка обновилась.
(function(){
  var supEl = $("suppressDrawDuringPlay");
  if (!supEl) return;
  var ids = ["shiftAnimSpeed","flipAnimSpeed","rotAnimSpeed","floorAnimSpeed","snakeAnimSpeed"];
  var savedSpeeds = null;
  supEl.addEventListener("change", function(){
    if (supEl.checked) {
      savedSpeeds = {};
      ids.forEach(function(id){
        var el = $(id); if (!el) return;
        savedSpeeds[id] = el.value;
        el.value = el.min;
        el.dispatchEvent(new Event("input", { bubbles: true }));
      });
    } else if (savedSpeeds) {
      ids.forEach(function(id){
        var el = $(id); if (!el || !(id in savedSpeeds)) return;
        el.value = savedSpeeds[id];
        el.dispatchEvent(new Event("input", { bubbles: true }));
      });
      savedSpeeds = null;
    }
  });
})();
function runAutoCaptureCheckOnce(){
  var acb = $("autoCaptureBelow");
  if (!acb || !acb.checked || lineLimit < 0) return false;
  var row = belowRowBits();
  if (!row) return false;
  var m = belowRowMatchDetail();
  if (!m) return false;
  console.log("[Kubits] Автозахват (без отрисовки при Плее): строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втянута в рамку");
  lineLimit++;
  return true;
}
function playTickRender(){
  if (suppressDrawDuringPlayActive()) {
    if (runAutoCaptureCheckOnce()) rebuild();
    return;
  }
  draw();
}

// Режим A («По строкам»): обычная строка под границей (без чередования её самой, как раньше)
// ищется в интерливинг-стоге из двух последних включённых строк над границей — проверяются
// оба варианта добора (см. aboveRowsInterleavedHaystacks/belowRowMatchDetail). Если найдена —
// втягиваем внутрь эту ОДНУ строку (граница +1), и так по кругу; на каждом шаге стог
// пересчитывается заново от новых последних двух строк над (уже сдвинутой) границей.
// Использует ту же belowRowMatchDetail(), что и «Шаг»/непрерывный автозахват (чекбокс) — поэтому
// они ведут себя одинаково, пока активно «По строкам» (см. rowsModeActive). Уже не рисует холст
// на каждом шаге (только parse) — счётчик прогресса добавлен для единообразия с «По лазерам».
function autoCaptureBelowThroughRows(){
  var guard = 0, total = src.value.split("\n").length, changed = false;
  while (guard++ < total){
    var row = belowRowBits();
    if (!row) break;
    var m = belowRowMatchDetail();
    if (!m) break;
    console.log("[Kubits] Строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втянута в рамку");
    lineLimit++;
    changed = true;
    setCaptureProgress(guard, total);
    parse(); // обновить D/добор под новой границей
  }
  clearCaptureProgress();
  return changed;
}
// Общая проверка «найдена ли строка под границей». Используется кнопкой «По лазерам», кнопкой
// «По строкам», непрерывным автозахватом (чекбокс) и одношаговой кнопкой «Шаг» — все четыре
// подряд смотрят на ОДИН и тот же текущий режим (rowsModeActive), поэтому ведут себя одинаково.
// Пока активно «По строкам» — ищем только в интерливинг-стоге (над границей). Иначе — три уровня
// проверки лазеров: конкретный лазер → склейка всех лазеров → сборка лазеров → сквозная строка данных.
// fast=true (быстрый цикл captureBelowThroughLasers, без draw() на каждом шаге) пропускает уровень
// «Сборка лазеров» — она берёт lastAssemblyHaystack, который иначе обновляется только внутри
// draw() и был бы устаревшим/неверным посреди быстрого цикла. lz/fdL/fdR всегда пересчитываются
// заново из G.list — им draw() не нужен, поэтому они одинаково надёжны и в быстром, и в обычном режиме.
function belowRowMatchDetail(){
  if (rowsModeActive) {
    var rowI = belowRowBits();
    if (!rowI) return null;
    // Захват никогда не ждёт ответа на «куда лепить добор»: нерешённые пары в стоге всегда
    // считаются «право» (см. aboveRowsInterleavedHaystacks/ilEffectiveSide). «?» + ещё не решённая
    // самая новая пара дают ДВА варианта стога (право и лево для сравнения) — оба проверяются.
    var haystacks = aboveRowsInterleavedHaystacks();
    var throughEl = $("ilThroughSearch");
    var throughMode = !!(throughEl && throughEl.checked);
    for (var hi = 0; hi < haystacks.length; hi++){
      var h = haystacks[hi];
      var tagSuffix = haystacks.length > 1 ? " (" + h.tag + ")" : "";
      if (throughMode) {
        // Сквозной поиск: вся склеенная строка разом — совпадение может тянуться через границу пар.
        var fdI = belowRowFoundInDetail(h.str);
        if (fdI) {
          return { desc: "интерливинг строк над границей (сквозной)" + tagSuffix +
              ", " + fdI.kind + ", поворот " + fdI.rot + " из " + fdI.total + ", совпало \"" + fdI.pat + "\"" };
        }
      } else {
        // По умолчанию: каждый кусок-пара — своя ОТДЕЛЬНАЯ строка поиска, совпадение не может
        // захватывать сразу две пары.
        for (var pb = 0; pb + 1 < h.bounds.length; pb++){
          var fdP = belowRowFoundInDetail(h.str.slice(h.bounds[pb], h.bounds[pb + 1]));
          if (fdP) {
            return { desc: "интерливинг пары №" + (pb + 1) + tagSuffix +
                ", " + fdP.kind + ", поворот " + fdP.rot + " из " + fdP.total + ", совпало \"" + fdP.pat + "\"" };
          }
        }
      }
    }
    return null;
  }
  var lz = belowRowFoundLaser();
  var fdL = lz ? null : belowRowFoundInDetail(throughLasersHaystack());
  // Сборка лазеров (панель результатов, выбранный пользователем вариант) — то же, что подсвечено
  // ему на холсте/в панели, проверяем ДО сквозной склейки строк данных. Считается ЗАНОВО из G.list
  // (computeAssemblyHaystackFresh), а не берётся из lastAssemblyHaystack — та обновляется только
  // внутри draw() и была бы устаревшей, если draw() в этом такте не вызывался (см. «Без отрисовки
  // при Плее»). Так проверка полная и надёжная всегда, независимо от того, рисуется холст или нет.
  var fdA = (lz || fdL) ? null : belowRowFoundInDetail(computeAssemblyHaystackFresh());
  var fdR = (lz || fdL || fdA) ? null : belowRowFoundInDetail(throughRowsHaystack());
  if (!lz && !fdL && !fdA && !fdR) return null;
  var desc = lz ? ("лазер «" + lz.axisLabel + " №" + lz.index + "», " + lz.kind + ", поворот " + lz.rot + " из " + lz.total + ", совпало \"" + lz.pat + "\"")
      : fdL ? ("сквозной по нескольким лазерам, " + fdL.kind + ", поворот " + fdL.rot + " из " + fdL.total + ", совпало \"" + fdL.pat + "\"")
      : fdA ? ("сборка лазеров, " + fdA.kind + ", поворот " + fdA.rot + " из " + fdA.total + ", совпало \"" + fdA.pat + "\"")
      : ("сквозной по строкам данных, " + fdR.kind + ", поворот " + fdR.rot + " из " + fdR.total + ", совпало \"" + fdR.pat + "\"");
  return { desc: desc };
}
// Режим B (кнопка «По лазерам»): непрерывно, пока строка под границей находится (любым из четырёх
// уровней проверки, ВСЕГДА полностью — см. belowRowMatchDetail/computeAssemblyHaystackFresh).
// Чекбокс «⚡ Быстрый поиск» влияет ТОЛЬКО на перерисовку, не на корректность поиска: выключен
// (по умолчанию) — полный rebuild()/draw() на каждом шаге, как раньше; включён — полную
// перерисовку делаем один раз в конце (см. fastModelRecompute), быстрее на длинных поисках.
function captureBelowThroughLasers(){
  if (lineLimit < 0) return false;
  var fastEl = $("fastCaptureSearch");
  var fast = !!(fastEl && fastEl.checked);
  var guard = 0, total = src.value.split("\n").length, changed = false;
  while (guard++ < total){
    var row = belowRowBits();
    if (!row) break;
    var m = belowRowMatchDetail(); // всегда полная проверка (см. computeAssemblyHaystackFresh) — «fast» теперь влияет только на перерисовку, не на поиск
    if (!m) break;
    console.log("[Kubits] Строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втянута в рамку");
    lineLimit++;
    changed = true;
    if (fast) { setCaptureProgress(guard, total); fastModelRecompute(); }
    else rebuild();
  }
  if (fast) { clearCaptureProgress(); if (changed) rebuild(); }
  return changed;
}
// Кнопка «▶ Шаг»: та же проверка, но только ОДИН шаг — без непрерывного повтора.
function captureBelowStepOnce(){
  if (lineLimit < 0) return false;
  var row = belowRowBits();
  if (!row) return false;
  var m = belowRowMatchDetail();
  if (!m) return false;
  console.log("[Kubits] Шаг: строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втянута в рамку");
  lineLimit++;
  rebuild();
  return true;
}
var _acbEl = $("autoCaptureBelow");
if (_acbEl) _acbEl.addEventListener("change", rebuild); // включили галку — сразу применить
var _btnCapStep = $("btnCaptureStep");
if (_btnCapStep) _btnCapStep.addEventListener("click", function(){
    if (_acbEl && _acbEl.checked) _acbEl.checked = false; // ручной шаг — выключаем непрерывный автозахват
    captureBelowStepOnce();
});

var _btnCapLasers = $("btnCaptureLasers");
var _btnCapRows = $("btnCaptureRows");
// Ряд «Стог: А/Б, Добор →/←» и подсказка «?» относятся только к интерливингу «По строкам» —
// видны, только когда этот режим активен (иначе они просто нерелевантны и путают в «По лазерам»).
function syncIlVariantsUI(){
    var row = $("ilVariantsRow");
    if (row) row.style.display = rowsModeActive ? "flex" : "none";
    var promptRow = $("ilAskPrompt");
    if (promptRow) promptRow.style.display = rowsModeActive ? "flex" : "none";
    syncIlAskButtons();
}
// Ключ (индекс самой новой пары строк над границей, или "single" — когда над границей всего
// одна строка) для подсказки «?»: null, если сейчас нечего решать (не «По строкам», нет строк
// над границей и т.п.).
function currentAskKey(){
    if (!rowsModeActive) return null;
    var lines = src.value.split("\n");
    var lim = (lineLimit < 0) ? lines.length : Math.min(lineLimit, lines.length);
    if (lim <= 0) return null;
    return (lim === 1) ? "single" : (lim - 2);
}
// Подсказка «?» больше НЕ появляется/исчезает по ходу поиска (это дёргало вёрстку) — она видна
// постоянно, пока активно «По строкам» (см. syncIlVariantsUI), а кнопки →/← внутри неё просто
// становятся неактивными (disabled), когда отвечать пока не на что: «?» не выбран, нет строк
// над границей, или самая новая пара уже решена (кликом по куску в панели или раньше здесь же).
function syncIlAskButtons(){
    var askEl = $("btnIlSideAsk");
    var askActive = !!(askEl && askEl.classList.contains("active"));
    var key = currentAskKey();
    var enabled = askActive && key !== null && ilPairSide[key] === undefined;
    var r = $("btnIlAskRight"), l = $("btnIlAskLeft");
    if (r) r.disabled = !enabled;
    if (l) l.disabled = !enabled;
}
if (_btnCapLasers) _btnCapLasers.addEventListener("click", function(){
    _btnCapLasers.classList.add("active");
    if (_btnCapRows) _btnCapRows.classList.remove("active");
    rowsModeActive = false;
    syncIlVariantsUI();
    captureBelowThroughLasers();
    draw();
});
if (_btnCapRows) _btnCapRows.addEventListener("click", function(){
    _btnCapRows.classList.add("active");
    if (_btnCapLasers) _btnCapLasers.classList.remove("active");
    rowsModeActive = true;
    syncIlVariantsUI();
    if (autoCaptureBelowThroughRows()) rebuild(); // по строкам+добор, затем обновить вид
    else draw(); // даже без захвата — переключить панель на интерливинг
});
var _btnHlAllBelow = $("btnHlAllBelow");
if (_btnHlAllBelow) _btnHlAllBelow.addEventListener("click", function(){
    highlightAllBelow = !highlightAllBelow;
    _btnHlAllBelow.classList.toggle("active", highlightAllBelow);
    draw();
});

// Кнопка «Инверсия»: 1) выделены и рамка/строка(и), и лазер(ы) → инвертирует только
// пересечение (клетки, которые попадают и в рамку/строку, и под лучом хотя бы одного лазера);
// 2) есть только рамка-выделение/строка(и) → инвертирует биты в ней (объединение всех строк,
// если их несколько); 3) есть только активный лазер(ы) → инвертирует только клетки под ними
// (объединение, если лазеров несколько); 4) иначе (совсем ничего не выбрано) → инвертирует
// все биты текущей модели (что видно, строки за границей lineLimit не трогает). Дедуп по
// (li,ci): Добор/повтор могут ссылаться на один и тот же исходный бит несколькими клетками
// кольца — без дедупа такой бит инвертировался бы дважды подряд и в итоге оставался как был.
function invertParticipatingBits(){
    if (!G || !G.list) return;
    var hasLaser = lastSkeweredElements && lastSkeweredElements.size;
    var idxSet;
    if (lastHasSelection && hasLaser) {
        idxSet = new Set();
        lastFrameElements.forEach(function(i){ if (lastSkeweredElements.has(i)) idxSet.add(i); });
    } else if (lastHasSelection) {
        idxSet = lastFrameElements;
    } else if (hasLaser) {
        idxSet = lastSkeweredElements;
    } else {
        idxSet = new Set();
        for (var gi = 0; gi < G.list.length; gi++) if (G.list[gi]) idxSet.add(gi);
    }
    if (!idxSet || !idxSet.size) return;

    var lines = src.value.split("\n");
    var seen = new Set();
    var changed = false;
    idxSet.forEach(function(i){
        var c = G.list[i];
        if (!c) return;
        // Рамка на холсте: добор-клетки пропускаем — их cIdx алиасит РЕАЛЬНЫЙ бит, который живёт
        // в другой клетке (обычно вне рамки), и его инверсия меняла бы картинку за пределами рамки.
        // Инвертируем только реальные клетки, попавшие в рамку; их серые добор-копии обновятся сами.
        if (selActive && c[4]) return;
        var li = c[5], ci = c[6];
        if (li === undefined || ci === undefined || ci < 0 || li < 0 || li >= lines.length) return;
        var key = li + "," + ci;
        if (seen.has(key)) return;
        seen.add(key);
        var line = lines[li];
        if (ci >= line.length) return;
        var ch = line[ci];
        if (ch === '0') lines[li] = line.slice(0, ci) + '1' + line.slice(ci + 1);
        else if (ch === '1') lines[li] = line.slice(0, ci) + '0' + line.slice(ci + 1);
        else return;
        changed = true;
    });
    if (changed) {
        src.value = lines.join("\n");
        rebuild();
    }
}

/* === МАРКЕР 15.15: ОБЩАЯ ОБВЯЗКА «▶ ПЛЕЙ» ДЛЯ ВСЕХ АВТОАНИМАЦИЙ ===
   Кнопка-подсветка/текст, таймер start/stop, слайдер скорости перезапускает таймер на лету —
   одна и та же механика для 6 плееров (Сдвиг символов+Визуальный сдвиг, Флип, Поворот, Этажи,
   Змейка), раньше скопированная в каждый по отдельности. Что крутить на тике и с каким периодом —
   решает сам плеер (tick/computeTiming), особый «сброс» — тоже свой (onStop). Имена существующих
   глобальных переменных/функций (rotAnimOn, stopFloorAnim и т.п.) не меняются — на них завязан код
   в других местах файла; get/set просто читают/пишут те же переменные. */
function makePlayer(opts){
    function timing(){
        if (opts.computeTiming) return opts.computeTiming();
        var ms = parseFloat(opts.speedEl.value) * (opts.speedScale || 400);
        if (opts.minPeriodMs) ms = Math.max(opts.minPeriodMs, ms);
        return { periodMs: ms, tick: opts.tick };
    }
    function start(){
        opts.setOn(true);
        if (opts.btn) { opts.btn.classList.add("active-view"); opts.btn.textContent = i18n[currentLang].btnFlipAnimStop; }
        if (opts.getTimer()) clearInterval(opts.getTimer());
        var tm = timing();
        opts.setTimer(setInterval(tm.tick, tm.periodMs));
    }
    function stop(reset){
        var wasOn = opts.getOn(); // до сброса: рисовать финальный кадр только если плеер РЕАЛЬНО играл
        if (opts.getTimer()) { clearInterval(opts.getTimer()); opts.setTimer(null); }
        opts.setOn(false);
        if (opts.btn) { opts.btn.classList.remove("active-view"); opts.btn.textContent = i18n[currentLang].btnFlipAnimPlay; }
        if (opts.onStop) opts.onStop(reset);
        // На случай, если во время Плея холст не рисовался (см. «🚫 Без отрисовки при Плее») —
        // финальный кадр синхронизируется при остановке. ТОЛЬКО если плеер играл: stop() дёргают
        // и защитно (syncSelUI → stopRotAnim на каждом такте чужого Плея!) — безусловный draw()
        // здесь ломал всё подавление, рисуя холст каждый такт (баг v0.244–0.248).
        if (wasOn) draw();
    }
    if (opts.btn) opts.btn.addEventListener("click", function(){ opts.getOn() ? stop(false) : start(); });
    if (opts.resetBtn) opts.resetBtn.addEventListener("click", function(){ stop(true); });
    if (opts.speedEl) {
        opts.speedEl.addEventListener("input", function(){ if (opts.getOn()) start(); });
        if (opts.fastZone != null) markFastZone(opts.speedEl, opts.fastZone);
    }
    return { start: start, stop: stop };
}
