function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pointInPoly(pt, vs) {
    var MathInside = false;
    for (var i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        var xi = vs[i][0], yi = vs[i][1];
        var xj = vs[j][0], yj = vs[j][1];
        var intersect = ((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi);
        if (intersect) MathInside = !MathInside;
    }
    return MathInside;
}

function getClickedFace(wx, wy) {
    if (G.kind !== "iso") return null;
    for (var i = G.list.length - 1; i >= 0; i--) {
        var c = G.list[i];
        var isRealGhost = (c[3]===0 && !c[4]);
        var isPadGhost = (c[3]===0 && c[4]);
        var forceGhost = (ghosts.checked && isRealGhost) || (ghostsAll.checked && isPadGhost);

        if (c[3] === 0 && !forceGhost && (!selActive)) continue;

        var a = aC(c), b = c[1], k = c[2];
        var xT=(a-b)*u,   yT=(a+b)*v-(k+1)*hh;
        var xR=(a-b+1)*u, yR=(a+b+1)*v-(k+1)*hh;
        var xF=(a-b)*u,   yF=(a+b+2)*v-(k+1)*hh;
        var xL=(a-b-1)*u, yL=(a+b+1)*v-(k+1)*hh;
        var yRb=yR+hh, yFb=yF+hh, yLb=yL+hh;

        var polyTop = [[xL,yL], [xF,yF], [xR,yR], [xT,yT]];
        var polyLeft = [[xL,yL], [xF,yF], [xF,yFb], [xL,yLb]];
        var polyRight = [[xF,yF], [xR,yR], [xR,yRb], [xF,yFb]];

        if (pointInPoly([wx, wy], polyTop)) return {c: c, face: 'top'};
        if (pointInPoly([wx, wy], polyLeft)) return {c: c, face: 'left'};
        if (pointInPoly([wx, wy], polyRight)) return {c: c, face: 'right'};
    }
    return null;
}
/* === МАРКЕР 06: ЛАЗЕР — УЗЛЫ-ИЗЛУЧАТЕЛИ И ПОПАДАНИЯ ЛУЧА (buildLaserNodes/beamCells) === */
function getLeftBeamPos(S, d) { return { x: S * u, y: (-S + 2*d) * v }; }
function getRightBeamPos(S, d) { return { x: S * u, y: (S + 2*d) * v }; }
function getTopBeamPos(Sv, d) { return { x: d * u, y: Sv * v }; }
function getHorizBeamPos(S, d) { return { x: S * u, y: d * v }; } // горизонтальный луч: постоянный y (по Sv=d), скан по S

function laserModeOk(){ return G && (!isSquaresMode() || !squareEditMode); }

// Позиция точки в «пространстве вида» лазеров: зеркало/поворот вида применяются к фигуре,
// а лазерные оси стоят на месте — поэтому клетки для лазеров берём УЖЕ повёрнутыми/отражёнными.
// Действует для плоских видов (сверху/ромбы); в изометрии всё как раньше.
// Лазеры неподвижны только когда поворот кратен 90° (сетка ложится на сетку) или активны лишь зеркала.
// На «косых» углах (1°/30°/45°/120°/L) лазеры двигаются вместе с кубами, как раньше.
function laserStationaryOK(){
    if (!G) return false;
    // Плоские виды (сверху/ромбы): оси стоят, пока поворот вида кратен 90° — сетка ложится на
    // сетку. На «косых» углах (1°/30°/45°/120°/L) оси едут вместе с кубами, как и раньше.
    if (G.kind === "top" || G.kind === "rhomb") return (viewRotDeg % 90 === 0);
    // Изометрия: поворота вида здесь нет вообще (rotApplies=false), из трансформаций действуют
    // только зеркала ↔/↕. Раньше оси и их подписи отражались вместе с фигурой и «прыгали» при
    // каждом зеркале — теперь держим их на месте, фигура отражается под ними.
    return true;
}
function laserViewApplies(){ return laserStationaryOK() && (flipX || flipY || viewRotDeg !== 0); }
function laserViewPos(x, y){
    if (!laserViewApplies()) return [x, y];
    var fx = flipX ? -1 : 1, fy = flipY ? -1 : 1;
    var r = viewRotDeg * Math.PI / 180;
    var cs = Math.cos(r), sn = Math.sin(r);
    var vx = (x - G.cx) * fx, vy = (y - G.cy) * fy;
    return [G.cx + vx * cs - vy * sn, G.cy + vx * sn + vy * cs];
}
// То же для целочисленной сетки вида сверху (через мировые координаты, с округлением назад в сетку)
function laserGridPosTop(c){
    if (!laserViewApplies()) return [aC(c), c[1]];
    var vp = laserViewPos(aC(c) * TS + TS / 2, c[1] * TS + TS / 2);
    return [Math.round((vp[0] - TS / 2) / TS), Math.round((vp[1] - TS / 2) / TS)];
}

function laserIcon(type){
    if (type === 'top') return "↓";
    if (type === 'horiz') return "→";
    if (type === 'db') return "↘"; // «\» x−y=const
    if (type === 'da') return "↗"; // «/» x+y=const
    if (G && G.kind === "top") return (type === 'left') ? "→" : "←";
    if (G && G.kind === "rhomb") return (type === 'left') ? "↘" : "↙";
    return (type === 'left') ? "↗" : "↖";
}

function buildLaserNodesTop() {
    var res = { nodes: [], groups: { left: [], right: [], top: [], da: [], db: [] } };
    var ax = { top: {}, left: {}, da: {}, db: {} }; // da: «/» (x+y=const), db: «\» (x−y=const)
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;

    G.list.forEach(function(c) {
        var gp = laserGridPosTop(c);
        var x = gp[0], y = gp[1];
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;

        if (!ax.top[x]) ax.top[x] = { minY: 1e9, maxY: -1e9 };
        if (y < ax.top[x].minY) ax.top[x].minY = y;
        if (y > ax.top[x].maxY) ax.top[x].maxY = y;

        if (!ax.left[y]) ax.left[y] = { minX: 1e9, maxX: -1e9 };
        if (x < ax.left[y].minX) ax.left[y].minX = x;
        if (x > ax.left[y].maxX) ax.left[y].maxX = x;

        var kA = x + y, kB = x - y;
        if (!ax.da[kA]) ax.da[kA] = { minX: 1e9, maxX: -1e9 };
        if (x < ax.da[kA].minX) ax.da[kA].minX = x;
        if (x > ax.da[kA].maxX) ax.da[kA].maxX = x;
        if (!ax.db[kB]) ax.db[kB] = { minX: 1e9, maxX: -1e9 };
        if (x < ax.db[kB].minX) ax.db[kB].minX = x;
        if (x > ax.db[kB].maxX) ax.db[kB].maxX = x;
    });

    if (minX === 1e9) return res;

    // Оси касаются внешнего контура крайних кубов и замыкаются уголком (сама направляющая линия —
    // рамка res.frame — идёт вплотную, как и раньше)
    var topY = minY * TS;
    var leftX = minX * TS;
    res.frame = [
        [leftX, topY, (maxX + 1) * TS, topY],
        [leftX, topY, leftX, (maxY + 1) * TS]
    ];
    // Сами узлы-точки (кружки с номером) отодвигаем чуть дальше от рамки — иначе они ложатся прямо
    // на крайние кубы и сливаются с ними (особенно заметно в «Этажах из блоков»).
    var nodeMargin = 0.5 * TS;
    var topNodeY = topY - nodeMargin;
    var leftNodeX = leftX - nodeMargin;

    Object.keys(ax.top).map(Number).sort(function(a,b){return a-b;}).forEach(function(d, i){
        var t = ax.top[d];
        var node = { type: 'top', d: d, pos: { x: d * TS + TS/2, y: topNodeY }, end: (t.maxY + 1.2)*TS, index: i+1 };
        res.nodes.push(node); res.groups.top.push(node);
    });

    Object.keys(ax.left).map(Number).sort(function(a,b){return a-b;}).forEach(function(d, i){
        var l = ax.left[d];
        var node = { type: 'left', d: d, pos: { x: leftNodeX, y: d * TS + TS/2 }, end: (l.maxX + 1.2)*TS, index: i+1 };
        res.nodes.push(node); res.groups.left.push(node);
    });

    // Диагональные оси через центр кручения: нумерация ЭКСПЕРИМЕНТАЛЬНАЯ — от центральной оси (0)
    // в обе стороны (+ и −). Центр — середина сетки, округлённая до ближайшего ключа диагонали.
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    var centerKA = Math.round(cx + cy), centerKB = Math.round(cx - cy);
    // У фигур с «дырявым»/кольцевым силуэтом (кольца, квадраты, змейка) локальный minX соседних
    // диагоналей может почти совпадать — старый якорь «по своей диагонали» слеплял узлы в кучу,
    // а «\» и «/» вдобавок садились рядом друг с другом (тот же левый край). Поэтому для «\»/«/»
    // всегда используем ОБЩУЮ раскладку в разные стороны: «\» — общей строкой НАД фигурой (свой x
    // на узел, как у оси «Сверху», но ещё выше неё), «/» — общей строкой ПОД фигурой (свободное
    // место). Внутри своей строки узлы не накладываются (x у каждого свой, зависит от d), а строки
    // друг с другом не пересекаются (одна выше фигуры, другая ниже).
    var dbRowY = topY - 1.6 * TS; // выше «Сверху»-оси (топ-строки), чтобы не накладываться на неё
    var daRowY = (maxY + 1) * TS + 1.6 * TS; // ниже всей фигуры — там свободно
    // «\» (db): x−y=const, луч сверху-слева вниз-вправо (наклон +1). Узел — сверху-слева.
    Object.keys(ax.db).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){
        var e = ax.db[d];
        var node = { type: 'db', d: d, pos: { x: dbRowY + d*TS, y: dbRowY }, end: e.maxX*TS + TS/2 + 1.2*TS, index: d - centerKB };
        res.nodes.push(node); res.groups.db.push(node);
    });
    // «/» (da): x+y=const, луч снизу-слева вверх-вправо (наклон −1). Узел — снизу-слева.
    Object.keys(ax.da).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){
        var e = ax.da[d];
        var node = { type: 'da', d: d, pos: { x: (d+1)*TS - daRowY, y: daRowY }, end: e.maxX*TS + TS/2 + 1.2*TS, index: d - centerKA };
        res.nodes.push(node); res.groups.da.push(node);
    });

    return res;
}

function beamCellsTop(type, d) {
    var bySlot = {};
    G.list.forEach(function(c) {
        if (c[4] && (!loopBits.checked || (c[3] === 0 && !ghostsAll.checked))) return;
        var gp = laserGridPosTop(c);
        var x = gp[0], y = gp[1];
        var match = false, slot = 0, inside = [];
        if (type === 'top' && x === d) {
            match = true; slot = y; inside = [y*TS, y*TS + TS];
        } else if (type === 'left' && y === d) {
            match = true; slot = x; inside = [x*TS, x*TS + TS];
        } else if (type === 'db' && (x - y) === d) {
            match = true; slot = x; inside = [x*TS, x*TS + TS];
        } else if (type === 'da' && (x + y) === d) {
            match = true; slot = x; inside = [x*TS, x*TS + TS];
        }
        if (match) {
            if (!bySlot[slot] || c[2] > bySlot[slot].depth) {
                bySlot[slot] = { c: c, depth: c[2], slot: slot, inside: inside };
            }
        }
    });
    var out = Object.keys(bySlot).map(function(k) { return bySlot[k]; });
    out.sort(function(p, q) { return p.slot - q.slot; });
    return out;
}

function buildLaserNodesRhomb() {
    var h = DD / 2;
    var res = { nodes: [], groups: { left: [], right: [], top: [], horiz: [] } };
    var ax = { top: {}, left: {}, right: {}, horiz: {} };
    var minY = 1e9, maxSum = -1e9, minDif = 1e9, minXc = 1e9;

    G.list.forEach(function(c) {
        var vp = laserViewPos(rhX(c), -c[2] * DD / 2);
        var x = vp[0], y = vp[1];
        if (y < minY) minY = y;
        if (x < minXc) minXc = x;
        if (x + y > maxSum) maxSum = x + y;
        if (x - y < minDif) minDif = x - y;
        var kT = Math.round(x / h), kL = Math.round((x - y) / h), kR = Math.round((x + y) / h);
        var t = ax.top[kT] || (ax.top[kT] = { x: x, maxY: -1e9 });
        if (y > t.maxY) t.maxY = y;
        var l = ax.left[kL] || (ax.left[kL] = { minX: 1e9 });
        if (x < l.minX) l.minX = x;
        var rr = ax.right[kR] || (ax.right[kR] = { maxX: -1e9 });
        if (x > rr.maxX) rr.maxX = x;
        // Горизонтальная ось (↔): луч по строке-этажу (постоянный y), группировка по уровню.
        var kH = Math.round(y / h);
        var hz = ax.horiz[kH] || (ax.horiz[kH] = { y: y, maxX: -1e9 });
        if (x > hz.maxX) hz.maxX = x;
    });

    if (minY === 1e9) return res;

    // Все оси отстоят на ПОЛКУБА от граней крайних ромбов (грань = 0.5·DD от центра,
    // плюс полкуба зазора = 1.0·DD от центра). Замыкаются друг с другом в треугольную рамку.
    var topY = minY - DD; // верхняя ось — на полкуба выше верхних вершин ромбов
    // «Левый» пучок (x−y=const) бьёт из нижне-правой грани вверх-влево,
    // «правый» (x+y=const) — из нижне-левой вверх-вправо. №1 — у первой строки.
    var cRR = maxSum + DD; // линия узлов на полкуба за нижне-правой гранью
    var cLL = minDif - DD; // линия узлов на полкуба за нижне-левой гранью
    var horizX = minXc - DD; // колонка узлов горизонтальной оси — на полкуба слева от граней крайних ромбов
    res.frame = [
        [cLL + topY, topY, cRR - topY, topY],                                   // верхняя ось
        [cLL + topY, topY, (cLL + cRR) / 2, (cRR - cLL) / 2],                   // нижне-левая
        [cRR - topY, topY, (cLL + cRR) / 2, (cRR - cLL) / 2]                    // нижне-правая
    ];

    Object.keys(ax.top).map(Number).sort(function(a, b){ return a - b; }).forEach(function(d, i) {
        var t = ax.top[d];
        var node = { type: 'top', d: d, pos: { x: t.x, y: topY }, end: t.maxY + 1.2 * DD, index: i + 1 };
        res.nodes.push(node); res.groups.top.push(node);
    });
    Object.keys(ax.left).map(Number).sort(function(a, b){ return a - b; }).forEach(function(d, i) {
        var l = ax.left[d];
        var node = { type: 'left', d: d, pos: { x: (cRR + d * h) / 2, y: (cRR - d * h) / 2 }, end: l.minX - 1.2 * DD, index: i + 1 };
        res.nodes.push(node); res.groups.left.push(node);
    });
    Object.keys(ax.right).map(Number).sort(function(a, b){ return b - a; }).forEach(function(d, i) {
        var rr = ax.right[d];
        var node = { type: 'right', d: d, pos: { x: (cLL + d * h) / 2, y: (d * h - cLL) / 2 }, end: rr.maxX + 1.2 * DD, index: i + 1 };
        res.nodes.push(node); res.groups.right.push(node);
    });
    // Горизонтальная ось: узлы слева, луч идёт вправо по строке-этажу (постоянный y).
    var hyMin = 1e9, hyMax = -1e9;
    Object.keys(ax.horiz).map(Number).sort(function(a, b){ return a - b; }).forEach(function(d, i) {
        var hz = ax.horiz[d];
        var node = { type: 'horiz', d: d, pos: { x: horizX, y: hz.y }, end: hz.maxX + 1.2 * DD, index: i + 1 };
        res.nodes.push(node); res.groups.horiz.push(node);
        if (hz.y < hyMin) hyMin = hz.y;
        if (hz.y > hyMax) hyMax = hz.y;
    });
    if (hyMin !== 1e9) res.frame.push([horizX, hyMin, horizX, hyMax]); // вертикальная линия горизонтальной оси слева
    return res;
}

function beamCellsRhomb(type, d) {
    var h = DD / 2, out = [];
    G.list.forEach(function(c) {
        if (c[4] && (!loopBits.checked || (c[3] === 0 && !ghostsAll.checked))) return;
        var vp = laserViewPos(rhX(c), -c[2] * DD / 2);
        var x = vp[0], y = vp[1];
        var key = (type === 'top') ? Math.round(x / h) : (type === 'horiz') ? Math.round(y / h) : (type === 'left') ? Math.round((x - y) / h) : Math.round((x + y) / h);
        if (key !== d) return;
        if (type === 'top') out.push({ c: c, slot: y, inside: [y - DD / 2, y + DD / 2] });
        else if (type === 'horiz') out.push({ c: c, slot: x, inside: [x - DD / 2, x + DD / 2] });
        else if (type === 'left') out.push({ c: c, slot: -x, inside: [x + DD / 4, x - DD / 4] });
        else out.push({ c: c, slot: x, inside: [x - DD / 4, x + DD / 4] });
    });
    out.sort(function(p, q) { return p.slot - q.slot; });
    return out;
}

function buildLaserNodes() {
    if (G.kind === "rhomb") return buildLaserNodesRhomb();
    if (G.kind === "top") return buildLaserNodesTop();
    var minS_L = 1e9, maxS_L = -1e9;
    var minS_R = 1e9, maxS_R = -1e9;
    var minSv_T = 1e9, maxSv_T = -1e9;
    var minTopY = 1e9;

    var axL = {}, axR = {}, axH = {}; // dL/dR -> {minS,maxS}; Sv -> {minS,maxS} (для «к краям» и горизонтали)
    var seenTop = {};
    var lists = { left: [], right: [], top: [], horiz: [] };

    G.list.forEach(function(c) {
        var a = aC(c), b = c[1], k = c[2];
        var dL = a - k;
        var dR = b - k;
        var dT = a - b;

        var S = a - b;
        var Sv = a + b - 2*k;

        var ty = (a + b + 1) * v - (k + 1) * hh;
        if (ty < minTopY) minTopY = ty;

        if (S < minS_L) minS_L = S; if (S > maxS_L) maxS_L = S;
        if (S < minS_R) minS_R = S; if (S > maxS_R) maxS_R = S;
        if (Sv < minSv_T) minSv_T = Sv; if (Sv > maxSv_T) maxSv_T = Sv;

        if (!axL[dL]) { axL[dL] = { minS: 1e9, maxS: -1e9 }; lists.left.push(dL); }
        if (S < axL[dL].minS) axL[dL].minS = S; if (S > axL[dL].maxS) axL[dL].maxS = S;
        if (!axR[dR]) { axR[dR] = { minS: 1e9, maxS: -1e9 }; lists.right.push(dR); }
        if (S < axR[dR].minS) axR[dR].minS = S; if (S > axR[dR].maxS) axR[dR].maxS = S;
        if (!seenTop[dT]) { seenTop[dT] = 1; lists.top.push(dT); }
        if (!axH[Sv]) { axH[Sv] = { minS: 1e9, maxS: -1e9 }; lists.horiz.push(Sv); }
        if (S < axH[Sv].minS) axH[Sv].minS = S; if (S > axH[Sv].maxS) axH[Sv].maxS = S;
    });

    var res = { nodes: [], groups: { left: [], right: [], top: [], horiz: [] },
                startS_L: 0, endS_L: 0, startS_R: 0, endS_R: 0, startSv_T: 0, endSv_T: 0 };

    if (minS_L === 1e9) return res;

    res.endS_L = maxS_L + 2;
    res.endS_R = minS_R - 2;
    res.endSv_T = maxSv_T + 4;
    res.startSv_T = Math.floor((minTopY - hh) / v) - 1;

    lists.left.sort(function(x, y) { return y - x; });
    lists.right.sort(function(x, y) { return y - x; });
    lists.top.sort(function(x, y) { return x - y; });
    lists.horiz.sort(function(x, y) { return x - y; });

    // Боковые оси — к краям: старт луча у ОБЩЕЙ границы всех данных (не у локального края
    // конкретной диагонали) — иначе на этажах разной длины точки-эмиттеры съезжают с линии.
    lists.left.forEach(function(d, i) {
        var startS = minS_L - 2;
        var node = { type: 'left', d: d, pos: getLeftBeamPos(startS, d), startS: startS, index: i + 1 };
        res.nodes.push(node); res.groups.left.push(node);
    });

    lists.right.forEach(function(d, i) {
        var startS = maxS_R + 2;
        var node = { type: 'right', d: d, pos: getRightBeamPos(startS, d), startS: startS, index: i + 1 };
        res.nodes.push(node); res.groups.right.push(node);
    });

    lists.top.forEach(function(d, i) {
        var node = { type: 'top', d: d, pos: getTopBeamPos(res.startSv_T, d), index: i + 1 };
        res.nodes.push(node); res.groups.top.push(node);
    });

    // Горизонтальная ось (↔): постоянный экранный y (по Sv), луч сканирует S слева направо.
    // Старт/конец — по общей границе всех строк (эмиттеры в один ряд), но с ДОПОЛНИТЕЛЬНЫМ
    // отступом от оси «Лево» (у той тот же x = minS_L), чтобы столбцы точек не накладывались.
    lists.horiz.forEach(function(d, i) {
        var startS = minS_L - 6, endS = maxS_R + 2;
        var node = { type: 'horiz', d: d, pos: getHorizBeamPos(startS, d), startS: startS, endS: endS, index: i + 1 };
        res.nodes.push(node); res.groups.horiz.push(node);
    });

    return res;
}

// Точка-«петля» в начале каждой оси (перед узлом №1) — клик по ней включает/выключает разом
// все лазеры этой оси. Позиция получается экстраполяцией от первых двух узлов оси (тот же шаг,
// но в обратную сторону) — работает одинаково для всех видов (изометрия/сверху/ромбы), без
// знания конкретных формул позиционирования каждого типа оси.
// На фигурах, где разные оси сходятся у одного и того же угла (ромбы — треугольная рамка,
// компактные змейка/квадраты), один шаг экстраполяции может увести петли РАЗНЫХ осей в одну и ту
// же точку. Поэтому у каждого типа оси — свой множитель шага (по порядку в groups), так что даже
// сходящиеся у общего угла оси расходятся вдоль своих направлений на разное расстояние.
// Кольцо-«все» каждой оси: стоит НАПРОТИВ СЕРЕДИНЫ своего ряда точек и отнесено от него в
// сторону — перпендикулярно направлению оси, наружу от модели. Рисуется потом «вилкой»: от
// кольца идёт черенок к оси, а от него — по веточке к каждой точке (см. МАРКЕР 09).
// Раньше кольцо экстраполировалось за первую точку вдоль оси и висело в стороне от ряда: было
// неясно, к какому именно ряду оно относится, и на разных осях они налезали друг на друга.
// Возвращает и сам якорь, и единичные векторы оси (ux,uy) и отступа (nx,ny) — они нужны отрисовке.
function computeAxisToggleAnchors(ctxObj) {
    var out = {};
    if (!ctxObj || !ctxObj.groups) return out;
    var cx = G ? G.cx : 0, cy = G ? G.cy : 0;
    Object.keys(ctxObj.groups).forEach(function(key){
        var g = ctxObj.groups[key];
        if (g.length < 2) return; // одна точка — направление оси не определить, пропускаем
        var first = g[0].pos, last = g[g.length - 1].pos;
        var ax = last.x - first.x, ay = last.y - first.y;
        var alen = Math.sqrt(ax * ax + ay * ay);
        if (!alen) return;
        var ux = ax / alen, uy = ay / alen;          // вдоль оси
        var nx = -uy, ny = ux;                        // перпендикуляр к оси
        var mid = { x: (first.x + last.x) / 2, y: (first.y + last.y) / 2 };
        // Отступ — в ту сторону от оси, где НЕТ модели, чтобы кольцо не легло на кубы
        if ((mid.x - cx) * nx + (mid.y - cy) * ny < 0) { nx = -nx; ny = -ny; }
        var off = Math.max(26, alen * 0.10);
        out[key] = {
            x: mid.x + nx * off, y: mid.y + ny * off,
            ux: ux, uy: uy, nx: nx, ny: ny, off: off,
            mx: mid.x, my: mid.y
        };
    });
    return out;
}
// Убрать все лазеры данного типа оси разом, поправив индексы у оставшихся выбранных строк
// (selectedLaserRows), — иначе после удаления «из середины» выбор съезжает на чужие лазеры.
function removeAllLasersOfAxis(axisType) {
    var mapping = {};
    var kept = [];
    skewers.forEach(function(sk, oldIdx){
        if (sk.type === axisType) return;
        mapping[oldIdx] = kept.length;
        kept.push(sk);
    });
    skewers = kept;
    selectedLaserRows = selectedLaserRows
        .filter(function(r){ return mapping.hasOwnProperty(r.skIdx); })
        .map(function(r){ return { skIdx: mapping[r.skIdx], kind: r.kind }; });
}

function beamCells(type, d) {
    if (G.kind === "rhomb") return beamCellsRhomb(type, d);
    if (G.kind === "top") return beamCellsTop(type, d);
    var bySlot = {};
    G.list.forEach(function(c) {
        if (c[4] && (!loopBits.checked || (c[3] === 0 && !ghostsAll.checked))) return;

        var a = aC(c), b = c[1], k = c[2];
        var S = a - b;
        var Sv = a + b - 2*k;
        var depth = a + b + k;

        var match = false, slot = 0, inside = [];
        
        if (type === 'left' && (a - k) === d) { match = true; slot = S; inside = [S - 0.5, S + 0.5]; }
        else if (type === 'right' && (b - k) === d) { match = true; slot = S; inside = [S + 0.5, S - 0.5]; }
        else if (type === 'top' && (a - b) === d) { match = true; slot = Sv; inside = [Sv - 1, Sv + 1]; }
        else if (type === 'horiz' && Sv === d) { match = true; slot = S; inside = [S - 1, S + 1]; }

        if (match) {
            if (!bySlot[slot] || depth > bySlot[slot].depth) {
                bySlot[slot] = { c: c, depth: depth, slot: slot, inside: inside };
            }
        }
    });

    var out = Object.keys(bySlot).map(function(k) { return bySlot[k]; });
    
    if (type === 'left') out.sort(function(p, q) { return p.slot - q.slot; });
    else if (type === 'right') out.sort(function(p, q) { return q.slot - p.slot; });
    else if (type === 'top') out.sort(function(p, q) { return p.slot - q.slot; });
    else if (type === 'horiz') out.sort(function(p, q) { return p.slot - q.slot; });

    return out; 
}
/* === МАРКЕР 07: DRAW — ОТРИСОВКА КАДРА, НАЧАЛО (счётчики, лазер-контекст) === */
function draw(){
  if (isSquaresMode() && squareEditMode) { drawSquareTestFrame(); return; }
  if (!G || !G.list) return;
  var dpr=Math.min(window.devicePixelRatio||1, 2);
  var w = stage.clientWidth;
  var h = stage.clientHeight;
  if(w === 0 || h === 0) return;

  if (cv.width !== Math.floor(w * dpr) || cv.height !== Math.floor(h * dpr)) {
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  
  var rectX=0, rectY=0, rectW=0, rectH=0;
  var total1 = 0, total0 = 0;
  var sel1 = 0, sel0 = 0;
  var tail1 = 0, tail0 = 0, selTail1 = 0, selTail0 = 0; 
  var frameElements = new Set();
  var balanceElements = new Set(); // клетки, реально участвующие в подсчёте баланса 1/0 (для кнопки «Инверсия»)
  var skeweredElements = new Set(); 
  
  var hasSelection = (selActive || isSelecting || sel.size > 0);
  var isMinus = minusMode.checked;
  var isDark = (document.documentElement.dataset.theme === "dark");
  var fsx = flipX ? -1 : 1, fsy = flipY ? -1 : 1;

  if (selActive || isSelecting) {
    var selPx = selRadius * zoom;
    rectX = panX + selOffX * zoom - selPx;
    rectY = panY + selOffY * zoom - selPx;
    rectW = selPx * 2;
    rectH = selPx * 2;
  }

  var laserCtx = null;
  var activeHoveredNode = null;
  var axisToggleAnchors = {};
  var activeHoveredAxisToggle = null;
  if (skewerMode.checked && laserModeOk()) {
      laserCtx = buildLaserNodes();
      axisToggleAnchors = computeAxisToggleAnchors(laserCtx);
      var minDist = 12;
      var hovFixed = laserStationaryOK();
      var hovRot = currentRotRad(), hovCos = Math.cos(hovRot), hovSin = Math.sin(hovRot);
      laserCtx.nodes.forEach(function(node) {
          var sx, sy;
          if (hovFixed) { // неподвижное пространство лазеров
              sx = panX + (node.pos.x - G.cx) * zoom;
              sy = panY + (node.pos.y - G.cy) * zoom;
          } else { // косой угол — узлы едут вместе с фигурой
              var ndx = fsx * (node.pos.x - G.cx) * zoom;
              var ndy = fsy * (node.pos.y - G.cy) * zoom;
              sx = panX + ndx * hovCos - ndy * hovSin;
              sy = panY + ndx * hovSin + ndy * hovCos;
          }
          var dist = Math.sqrt((mouseX - sx)*(mouseX - sx) + (mouseY - sy)*(mouseY - sy));
          if (dist < minDist) {
              minDist = dist;
              activeHoveredNode = node;
          }
      });
      var minDistAT = 12;
      Object.keys(axisToggleAnchors).forEach(function(key){
          var pos = axisToggleAnchors[key];
          var sx, sy;
          if (hovFixed) {
              sx = panX + (pos.x - G.cx) * zoom;
              sy = panY + (pos.y - G.cy) * zoom;
          } else {
              var ndx = fsx * (pos.x - G.cx) * zoom;
              var ndy = fsy * (pos.y - G.cy) * zoom;
              sx = panX + ndx * hovCos - ndy * hovSin;
              sy = panY + ndx * hovSin + ndy * hovCos;
          }
          var distAT = Math.sqrt((mouseX - sx)*(mouseX - sx) + (mouseY - sy)*(mouseY - sy));
          if (distAT < minDistAT) {
              minDistAT = distAT;
              activeHoveredAxisToggle = key;
          }
      });
  }

  var skewerData = [];
  var cellLaserColor = {};
  var cellLaserHits = {}; 
  var overlapList = [];
  if (skewerMode.checked && laserModeOk()) {
      skewers.forEach(function(sk, skIdx) {
          var hitList = beamCells(sk.type, sk.d);
          var str = "";
          hitList.forEach(function(hit) {
              var c = hit.c;
              str += c[3];
              skeweredElements.add(c._i);
              cellLaserColor[c._i] = sk.color;
              if (!cellLaserHits[c._i]) cellLaserHits[c._i] = [];
              cellLaserHits[c._i].push(skIdx);
          });
          var icon = laserIcon(sk.type);
          skewerData.push({ color: sk.color, str: str, icon: icon, hitList: hitList });
      });
      if (laserOverlapEnabled) {
          Object.keys(cellLaserHits).forEach(function(idxStr){
              var hits = cellLaserHits[idxStr];
              if (hits.length < 2) return;
              var c = G.list[+idxStr];
              var parts = hits.map(function(skIdx){
                  var sk = skewers[skIdx];

          if (group && group.length > 1) {
              var firstN = group[0].pos;
              var lastN = group[group.length - 1].pos;
              ctx.beginPath();
              ctx.moveTo(firstN.x, firstN.y); ctx.lineTo(lastN.x, lastN.y);
              ctx.stroke();
          }
      });

      laserCtx.nodes.forEach(function(node) {
          var p = node.pos;

          var activeLaser = skewers.find(function(s) {
              return s.type === node.type && s.d === node.d;
          });

          var isHovered = activeHoveredNode &&
                          activeHoveredNode.type === node.type &&
                          activeHoveredNode.d === node.d;

          ctx.beginPath();
          if (activeLaser) {
              ctx.arc(p.x, p.y, (isHovered ? 7.5 : 5.5) / zoom, 0, Math.PI * 2);
              ctx.fillStyle = activeLaser.color;
              ctx.globalAlpha = 1.0;
              ctx.fill();
              
              ctx.beginPath();
              ctx.arc(p.x, p.y, (isHovered ? 12 : 9) / zoom, 0, Math.PI * 2);
              ctx.strokeStyle = activeLaser.color;
              ctx.lineWidth = 1.5 / zoom;
              ctx.globalAlpha = 0.5;
              ctx.stroke();
          } else {
              ctx.arc(p.x, p.y, (isHovered ? 5.5 : 3.5) / zoom, 0, Math.PI * 2);
              ctx.fillStyle = isHovered ? "rgba(93, 202, 165, 0.9)" : "rgba(147, 166, 159, 0.4)";
              ctx.globalAlpha = 1.0;
              ctx.fill();
          }

          var tx = p.x, ty = p.y, off = 13 / zoom;
          var rhFlip = (G.kind === "rhomb"); // у ромбов диагональные оси снизу — подписи наружу
          if (node.type === 'top') { ty -= off; }
          else if (node.type === 'horiz') { tx -= off; }
          else if (node.type === 'db') { tx -= off * 0.7; ty -= off * 0.7; }
          else if (node.type === 'da') { tx -= off * 0.7; ty += off * 0.7; }
          else if (node.type === 'left') { tx += rhFlip ? off : -off; ty += rhFlip ? off * 0.2 : -off * 0.2; }
          else if (node.type === 'right') { tx += rhFlip ? -off : off; ty += rhFlip ? off * 0.2 : -off * 0.2; }

          ctx.font = "bold " + (10 / zoom) + "px 'Roboto Mono', monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = activeLaser ? activeLaser.color : (isDark ? "rgba(255,255,255,0.4)" : "rgba(0,0,0,0.4)");
          // Диагональные оси нумеруются от центра (±): у положительных показываем «+».
          var nodeLbl = ((node.type === 'da' || node.type === 'db') && node.index > 0) ? ("+" + node.index) : node.index;
          ctx.fillText(nodeLbl, tx, ty);
      });

      // Кольцо-«все» напротив середины каждой оси — клик включает/выключает разом все её лазеры
      var axisToggleOnColor = isDark ? "#5DCAA5" : "#1D9E75"; // == var(--accent) — в canvas CSS-переменные не резолвятся
      Object.keys(axisToggleAnchors).forEach(function(key){
          var anchor = axisToggleAnchors[key];
          var nodesOfAxis = laserCtx.groups[key] || [];
          var allOn = nodesOfAxis.length > 0 && nodesOfAxis.every(function(n){
              return skewers.some(function(sk){ return sk.type === key && sk.d === n.d; });
          });
          var anyOn = nodesOfAxis.some(function(n){
              return skewers.some(function(sk){ return sk.type === key && sk.d === n.d; });
          });
          var isHoveredAT = activeHoveredAxisToggle === key;
          var rOuter = (isHoveredAT ? 8.5 : 6.5) / zoom;

          // «Вилка»: черенок от кольца к оси + хребет вдоль ряда + по веточке к каждой точке.
          // Так сразу видно, какие именно точки включает это кольцо.
          if (nodesOfAxis.length > 1 && anchor.nx !== undefined) {
              var spineOff = (6 / zoom);            // хребет чуть отступает от самих точек
              var sx0 = anchor.nx * spineOff, sy0 = anchor.ny * spineOff;
              var pFirst = nodesOfAxis[0].pos, pLast = nodesOfAxis[nodesOfAxis.length - 1].pos;
              ctx.lineWidth = 1 / zoom;
              ctx.strokeStyle = allOn ? axisToggleOnColor : (isDark ? "rgba(147, 166, 159, 0.38)" : "rgba(110, 109, 102, 0.42)");
              ctx.globalAlpha = allOn ? 0.75 : 1.0;

              ctx.beginPath();
              // черенок: от края кольца до хребта
              ctx.moveTo(anchor.x - anchor.nx * rOuter, anchor.y - anchor.ny * rOuter);
              ctx.lineTo(anchor.mx + sx0, anchor.my + sy0);
              // хребет вдоль всего ряда точек
              ctx.moveTo(pFirst.x + sx0, pFirst.y + sy0);
              ctx.lineTo(pLast.x + sx0, pLast.y + sy0);
              // зубцы к каждой точке
              nodesOfAxis.forEach(function(n){
                  ctx.moveTo(n.pos.x + sx0, n.pos.y + sy0);
                  ctx.lineTo(n.pos.x + anchor.nx * (2.5 / zoom), n.pos.y + anchor.ny * (2.5 / zoom));
              });
              ctx.stroke();
              ctx.globalAlpha = 1.0;
          }

          ctx.beginPath();
          ctx.arc(anchor.x, anchor.y, rOuter, 0, Math.PI * 2);
          ctx.lineWidth = (isHoveredAT ? 2.5 : 2) / zoom;
          ctx.strokeStyle = allOn ? axisToggleOnColor : (anyOn ? (isDark ? "rgba(147, 166, 159, 0.9)" : "rgba(110, 109, 102, 0.9)") : (isDark ? "rgba(255,255,255,0.35)" : "rgba(0,0,0,0.35)"));
          ctx.globalAlpha = 1.0;
          ctx.fillStyle = allOn ? axisToggleOnColor : "rgba(0,0,0,0)";
          if (allOn) ctx.fill();
          ctx.stroke();

          if (anyOn && !allOn) {
              // Частично включено — маленькая точка внутри кольца
              ctx.beginPath();
              ctx.arc(anchor.x, anchor.y, rOuter * 0.4, 0, Math.PI * 2);
              ctx.fillStyle = isDark ? "rgba(147, 166, 159, 0.9)" : "rgba(110, 109, 102, 0.9)";
              ctx.fill();
          }
      });
      ctx.globalAlpha = 1.0;
      applyAmbientTransform();
  }

  function drawLaserLine(startParam, endParam, step, getPointFn, checkCubeFn, color) {
      var points = [];
      if (step > 0) {
          for (var p = startParam; p <= endParam; p += step) points.push(p);
      } else {
          for (var p = startParam; p >= endParam; p += step) points.push(p);
      }

      var firstCubeHitIndex = -1;
      for (var j = 0; j < points.length; j++) {
          if (checkCubeFn(points[j])) {
              firstCubeHitIndex = j;
              break;
          }
      }

      for (var j = 0; j < points.length - 1; j++) {
          var p1 = getPointFn(points[j]);
          var p2 = getPointFn(points[j+1]);
          var mid = (points[j] + points[j+1]) / 2;
          var isInside = checkCubeFn(mid);

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);

          if (isInside) {
              ctx.lineWidth = 0.5 / zoom;
              ctx.strokeStyle = color;
              ctx.globalAlpha = 0.22;
              ctx.setLineDash([4/zoom, 4/zoom]);
          } else {
              ctx.lineWidth = 1 / zoom;
              ctx.strokeStyle = color;
              ctx.globalAlpha = 0.95;
              ctx.setLineDash([]);
          }
          ctx.stroke();
      }
      ctx.setLineDash([]);

      if (firstCubeHitIndex !== -1) {
          var pEntrance = getPointFn(points[firstCubeHitIndex]);
          
          ctx.globalAlpha = 1.0;
          ctx.beginPath();
          ctx.arc(pEntrance.x, pEntrance.y, 6 / zoom, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(pEntrance.x, pEntrance.y, 11 / zoom, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
          ctx.fill();
      }
  }

  /* === МАРКЕР 10: DRAW — ПАНЕЛЬ РЕЗУЛЬТАТОВ ЛАЗЕРА (DOM: колонки/переключатели) === */
  var targetHighlights = {};
  var patHighlights = {};   // совпадения, найденные для строк поля «Паттерны» (подсветка в нём же)

  if (skewerMode.checked && laserModeOk()) {
      skewerRes.innerHTML = "";
      skewerWrap.style.display = "block";
      $("divLaser").style.display = "block";
      var laserGroups = { top: [], right: [], left: [], horiz: [], da: [], db: [] };

      var targetStrings = [];
      // Пока в поле «Паттерны» есть хоть один паттерн — подсветка ищет ИХ (и подсвечивает
      // найденное в самом поле «Паттерны», см. patHighlights/updatePatHighlight), а строки
      // «Данных» под границей в поиске не участвуют вовсе — ровно как и реальный захват
      // (см. searchPatternsList).
      var patTargets = openPatternRows(); // закрытые уже отработали — в поиске/подсветке их нет
      if (patternsActive()) {
          // inv/rev больше не храним в цели: все варианты берутся из общего кеша patVariants
          patTargets.forEach(function(p){
              targetStrings.push({ text: p.text, lineIdx: p.lineIdx, offset: p.offset, fromPat: true, lineNo: p.lineNo });
          });
      } else if (lineLimit >= 0) {
          var allLines = src.value.split('\n');
          // «Без 1-го символа» должен так же действовать и здесь — иначе подсветка ищет ПОЛНУЮ
          // строку (с 1-м битом), а реальный захват (belowRowSearchPat) — уже без него: подсветка
          // могла загораться на повороте, недостижимом после урезания текста, и захват не срабатывал.
          var sfChk = $("skipFirstCharCheck");
          var skipFirstForTargets = sfChk && sfChk.checked;
          for (var tl = lineLimit; tl < allLines.length; tl++) {
              var trm = allLines[tl].trim();
              if (trm.length > 0) {
                  var baseOffset = allLines[tl].indexOf(trm);
                  var searchText = trm, extraOffset = 0;
                  if (skipFirstForTargets && trm.length > 1) { searchText = trm.slice(1); extraOffset = 1; }
                  targetStrings.push({ text: searchText, lineIdx: tl, offset: baseOffset + extraOffset });
              }
          }
      }

      // Строго: только полное совпадение паттерна целиком — раньше здесь ещё пробовался паттерн
      // без 1-го символа, из-за чего подсветка загоралась там, где реальный захват (который требует
      // совпадения целиком) потом не срабатывал.

      function rotatedRangeToOriginal(type, k, tIdx, len, L) {
          var idxs = [];
          for (var j=0; j<len; j++) {
              var patIdx = (tIdx + j + k) % L;
              idxs.push(type === 'rev' ? (L - 1 - patIdx) : patIdx);
          }
          idxs.sort(function(a,b){ return a-b; });
          var ranges = [];
          var rs = idxs[0], prev = idxs[0];
          for (var i=1; i<idxs.length; i++) {
              if (idxs[i] === prev + 1) { prev = idxs[i]; continue; }
              ranges.push({ start: rs, end: prev + 1 });
              rs = idxs[i]; prev = idxs[i];
          }
          ranges.push({ start: rs, end: prev + 1 });
          return ranges;
      }

      // minPatLineNo — только для «🔒 Строго»: в этот кусок строк данных имеют право заглядывать
      // лишь паттерны с номером НЕ МЕНЬШЕ него (их номер строго больше номеров всех строк куска).
      // Так подсветка показывает ровно то, что реально засчитывает захват, и не врёт.
      function findMatches(laserStr, selMap, minPatLineNo) {
          if (laserStr.length < 1) return [{ text: laserStr, type: 'none' }];
          var best = null, H = laserStr.length;
          // Приоритет цели. Для ПАТТЕРНОВ — строго по номеру: побеждает первый подошедший
          // (они лежат по возрастанию номера строки), ровно как и в захвате — иначе подсветка
          // загоралась на самом ДЛИННОМ паттерне, а захват брал самый ранний, и они спорили.
          // Для строк «Данных» (когда поле паттернов пустое) приоритет прежний — самое длинное
          // совпадение, это старое поведение лазерной подсветки, его не трогаем.
          var patOrderMode = targetStrings.length > 0 && targetStrings[0].fromPat;
          // Индекс строки считаем один раз на вызов, дальше цели только опрашивают его
          var hIdx = makeHayIndex(laserStr);
          for (var i=0; i<targetStrings.length; i++) {
              var t = targetStrings[i];
              if (typeof minPatLineNo === "number" && t.fromPat && t.lineNo < minPatLineNo) continue;
              var L = t.text.length;
              if (L > H) continue;                 // не влезает — даже не пробуем
              if (!patOrderMode && best && best.len >= L) continue; // длиннее уже найденного не даст

              var m = hayFindPattern(hIdx, patVariants(t.text));
              if (m) {
                  best = { len: m.total, lIdx: m.lIdx, tIdx: 0, k: m.rot, target: t, type: m.type };
                  if (patOrderMode) break; // первый по номеру — он и нужен
              }
          }

          if (!best) return [{ text: laserStr, type: 'none' }];

          var origRanges = rotatedRangeToOriginal(best.type, best.k, best.tIdx, best.len, best.target.text.length);
          // Совпадение паттерна подсвечиваем в поле «Паттерны», совпадение строки данных — в редакторе.
          var hlBucket = best.target.fromPat ? patHighlights : targetHighlights;
          origRanges.forEach(function(r){
              if (!hlBucket[best.target.lineIdx]) hlBucket[best.target.lineIdx] = [];
              hlBucket[best.target.lineIdx].push({
                  start: r.start + best.target.offset,
                  end: r.end + best.target.offset,
                  type: best.type
              });

              if (selMap && !best.target.fromPat) {
                  var sLine = best.target.lineIdx;
                  if (!selMap[sLine]) selMap[sLine] = [];
                  selMap[sLine].push({ start: r.start + best.target.offset, end: r.end + best.target.offset });
              }
          });

          var leftStr = laserStr.substring(0, best.lIdx);
          var matchStr = laserStr.substring(best.lIdx, best.lIdx + best.len);
          var rightStr = laserStr.substring(best.lIdx + best.len);

          var res = [];
          if (leftStr.length > 0) res = res.concat(findMatches(leftStr, selMap));
          res.push({ text: matchStr, type: best.type });
          if (rightStr.length > 0) res = res.concat(findMatches(rightStr, selMap));
          return res;
      }

      function formatMatchSegments(segments) {
          return segments.map(function(s) {
              if (s.type === 'normal') return '<span style="background:#F1C40F; color:#000; border-radius:3px; padding:0 2px;">' + s.text + '</span>';
              if (s.type === 'inv') return '<span style="background:#3498DB; color:#FFF; border-radius:3px; padding:0 2px;">' + s.text + '</span>';
              if (s.type === 'rev') return '<span style="background:#9B59B6; color:#FFF; border-radius:3px; padding:0 2px;">' + s.text + '</span>';
              return s.text;
          }).join('');
      }

      function sliceSegments(segments, start, end) {
          var res = [], pos = 0;
          for (var i=0; i<segments.length; i++) {
              var s = segments[i];
              var segStart = pos, segEnd = pos + s.text.length;
              pos = segEnd;
              if (segEnd <= start || segStart >= end) continue;
              var cutStart = Math.max(start, segStart) - segStart;
              var cutEnd = Math.min(end, segEnd) - segStart;
              res.push({ text: s.text.slice(cutStart, cutEnd), type: s.type });
          }
          return res;
      }

      // Сборка лазеров — см. getLaserAssemblyPresets() (общая функция, чтобы её же мог использовать
      // computeAssemblyPointsFresh для поиска без draw()). Все группы идут подряд в одну строку —
      // и поиск (findMatches), и отображение (разделитель между значениями — только «+»).
      var LASER_ASSEMBLY_PRESETS = getLaserAssemblyPresets();
      var activeAssemblyPreset = LASER_ASSEMBLY_PRESETS.find(function(p){ return p.key === laserAssemblyVariant; }) || LASER_ASSEMBLY_PRESETS[0];

      var axisPointSegments = {};
      var assemblyRows = []; // [{ pts: [{skIdx,str}], combinedStr, combinedSegments }] — всегда 1 элемент
      {
          var pts = [];
          if (!activeAssemblyPreset.axes) {
              pts = skewers
                  .map(function(sk, skIdx){ return { skIdx: skIdx }; })
                  .filter(function(p){ return skewerData[p.skIdx]; })
                  .map(function(p){ return { skIdx: p.skIdx, str: skewerData[p.skIdx].str }; });
          } else {
              var byIndex = {}; // nIdx -> { axisType: {skIdx,str} }
              activeAssemblyPreset.axes.forEach(function(axisType){
                  var grp = laserCtx.groups[axisType] || [];
                  skewers.forEach(function(sk, skIdx){
                      if (sk.type !== axisType || !skewerData[skIdx]) return;
                      var node = grp.find(function(n){ return n.d === sk.d; });
                      if (!node) return;
                      if (!byIndex[node.index]) byIndex[node.index] = {};
                      byIndex[node.index][axisType] = { skIdx: skIdx, str: skewerData[skIdx].str };
                  });
              });
              Object.keys(byIndex).map(Number).sort(function(a,b){ return a - b; }).forEach(function(nIdx){
                  activeAssemblyPreset.axes.forEach(function(axisType){
                      var e = byIndex[nIdx][axisType];
                      if (e) pts.push(e);
                  });
              });
          }

          if (pts.length) {
              var combinedStr = pts.map(function(p){ return p.str; }).join('');
              // Все выбранные обычные лазеры, чьи точки входят в эту сборку — каждый подсвечивается своей картой/цветом
              var combinedSelEntries = selectedBeamHlList.filter(function(e){
                  return e.kind === 'normal' && pts.some(function(p){ return p.skIdx === e.skIdx; });
              });

              // Пока активно «По строкам» — лазерный поиск (findMatches по строкам лазеров) не
              // подсвечивает: targetHighlights должен показывать только совпадения интерливинг-
              // стога (см. ветку rowsModeActive ниже), иначе два разных источника подсветки
              // смешивались бы в редакторе и путали, какая строка реально найдена для захвата.
              var combinedSegments = [];
              if (combinedStr.length > 0 && !rowsModeActive) {
                  if (combinedSelEntries.length) {
                      combinedSelEntries.forEach(function(e){ combinedSegments = findMatches(combinedStr, e.map); });
                  } else {
                      combinedSegments = findMatches(combinedStr, null);
                  }
              }

              // Не трогаем axisPointSegments при «По строкам» (оставляем undefined на skIdx) — иначе
              // sliceSegments([], ...) даёт ПУСТОЙ (но truthy) массив, и `axisPointSegments[skIdx] ||
              // [{text: sd.str, ...}]` ниже перестаёт срабатывать: текст лазера исчезает вовсе.
              if (!rowsModeActive) {
                  var pos = 0;
                  pts.forEach(function(p){
                      var start = pos, end = pos + p.str.length;
                      pos = end;
                      axisPointSegments[p.skIdx] = sliceSegments(combinedSegments, start, end);
                  });
              }

              assemblyRows.push({ pts: pts, combinedStr: combinedStr, combinedSegments: combinedSegments });
          }
      }
      // Снимок строки текущей «Сборки лазеров» — чтобы автозахват находил то же, что подсвечено
      // пользователю в результатах (независимо от порядка laserResultRowsForExport()).
      lastAssemblyHaystack = assemblyRows.map(function(r){ return r.combinedStr; }).join('');

      var skewerRowEls = {}; // skIdx -> DOM-строка результата (для подсветки при наведении на сборку)

      if (laserStationaryOK()) applyLaserTransform(); else applyAmbientTransform(); // лучи — в том же пространстве, что и оси
      skewers.forEach(function(sk, skIdx) {
          var sd = skewerData[skIdx];
          var checkFn = function(val) {
              if (!sd) return false;
              for (var i = 0; i < sd.hitList.length; i++) {
                  var hit = sd.hitList[i];
                  var min = Math.min(hit.inside[0], hit.inside[1]);
                  var max = Math.max(hit.inside[0], hit.inside[1]);
                  if (hit.c[3] === 1 && val >= min && val <= max) return true;
              }
              return false;
          };

          if (G.kind === "rhomb") {
              var ndRh = laserCtx.groups[sk.type].find(function(n){ return n.d === sk.d; });
              if (ndRh) {
                  if (sk.type === 'top') {
                      drawLaserLine(ndRh.pos.y, ndRh.end, DD / 4,
                          function(t) { return { x: ndRh.pos.x, y: t }; }, checkFn, sk.color);
                  } else if (sk.type === 'horiz') {
                      drawLaserLine(ndRh.pos.x, ndRh.end, DD / 4,
                          function(t) { return { x: t, y: ndRh.pos.y }; }, checkFn, sk.color);
                  } else if (sk.type === 'left') {
                      drawLaserLine(ndRh.pos.x, ndRh.end, -DD / 4,
                          function(t) { return { x: t, y: ndRh.pos.y + (t - ndRh.pos.x) }; }, checkFn, sk.color);
                  } else {
                      drawLaserLine(ndRh.pos.x, ndRh.end, DD / 4,
                          function(t) { return { x: t, y: ndRh.pos.y + (ndRh.pos.x - t) }; }, checkFn, sk.color);
                  }
              }
          } else if (G.kind === "top") {
              var ndTop = (laserCtx.groups[sk.type] || []).find(function(n){ return n.d === sk.d; });
              if (ndTop) {
                  if (sk.type === 'top') {
                      drawLaserLine(ndTop.pos.y, ndTop.end, TS / 4,
                          function(t) { return { x: ndTop.pos.x, y: t }; }, checkFn, sk.color);
                  } else if (sk.type === 'left') {
                      drawLaserLine(ndTop.pos.x, ndTop.end, TS / 4,
                          function(t) { return { x: t, y: ndTop.pos.y }; }, checkFn, sk.color);
                  } else if (sk.type === 'db') { // «\»: x−y=const
                      drawLaserLine(ndTop.pos.x, ndTop.end, TS / 4,
                          function(t) { return { x: t, y: t - sk.d * TS }; }, checkFn, sk.color);
                  } else if (sk.type === 'da') { // «/»: x+y=const
                      drawLaserLine(ndTop.pos.x, ndTop.end, TS / 4,
                          function(t) { return { x: t, y: (sk.d + 1) * TS - t }; }, checkFn, sk.color);
                  }
              }
          } else if (sk.type === 'top') {
              drawLaserLine(laserCtx.startSv_T, laserCtx.endSv_T, 0.5,
                  function(Sv) { return getTopBeamPos(Sv, sk.d); }, checkFn, sk.color);
          } else if (sk.type === 'left') {

      { // Сборка лазеров (или, пока активен режим «По строкам», — стог(и) интерливинга вместо неё)
          var asmWrap = document.createElement("div");

              asmTitle.textContent = (currentLang === "ru") ? "Интерливинг (сквозной, над границей):" : "Interleaving (through, above boundary):";
              asmHead.appendChild(asmTitle);
              asmWrap.appendChild(asmHead);

              // При активной «?»: пока сторона ни разу не выбрана — показываются ОБЕ (А→/А←/Б→/Б←,
              // для сравнения); как только выбрана (клик →/← в подсказке ниже) — aboveRowsInterleavedHaystacks()
              // сама отдаёт только её вариант(ы), панель переключается напрямую, без доп. затемнения.
              var ilHaystacks = aboveRowsInterleavedHaystacks();
              var ilPendingKey = currentAskKey(); // какую пару/строку сейчас можно решить через «?»-сравнение (или null)
              var ilLinesNow = src.value.split("\n");
              var ilLimNow = (lineLimit < 0) ? ilLinesNow.length : Math.min(lineLimit, ilLinesNow.length);
              var ilIsSingle = (ilLimNow === 1);
              // Кусок конкретной пары в столбике «Стог»: слева от оси — сторона «лево», справа —
              // «право». Перетаскивание через ось меняет сторону ЭТОЙ пары (см. ниже); простой
              // клик без сдвига мыши — тоже переключает, как раньше, для удобства.
              function ilAttachDrag(piece, row, pairKey){
                  piece.addEventListener("mousedown", function(e){
                      e.preventDefault(); e.stopPropagation();
                      var startX = e.clientX, moved = false;
                      piece.style.zIndex = "5"; piece.style.opacity = "0.7";
                      function onMove(ev){
                          moved = true;
                          piece.style.transform = "translateX(" + (ev.clientX - startX) + "px)";
                      }
                      function onUp(ev){
                          window.removeEventListener("mousemove", onMove);
                          window.removeEventListener("mouseup", onUp);
                          piece.style.transform = ""; piece.style.opacity = "";
                          var wantRight;
                          if (moved) {
                              var r = row.getBoundingClientRect();
                              wantRight = ev.clientX > (r.left + r.width / 2);
                          } else {
                              wantRight = !ilEffectiveSide(pairKey); // клик без сдвига — обычный тоггл
                          }
                          ilPairSide[pairKey] = wantRight ? "right" : "left";
                          syncIlAskButtons();
                          draw();
                      }
                      window.addEventListener("mousemove", onMove);
                      window.addEventListener("mouseup", onUp);
                  });
              }
              // Один столбик-«доска» для одного варианта стога h: вертикальная ось посередине,
              // куски пар — строками друг под другом (сверху пара 0+1, ниже 1+2, и т.д., «склейка
              // вниз»), каждый прижат к оси со своей стороны (право/лево).
              function ilBuildStogBoard(h){
                  var board = document.createElement("div");
                  board.style.cssText = "position:relative; flex:1 1 0; min-width:0; padding:1px 0;";
                  var axis = document.createElement("div");
                  axis.style.cssText = "position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--accent2); opacity:0.5; pointer-events:none;";
                  board.appendChild(axis);
                  if (!h.str.length) {
                      var ilEmpty = document.createElement("div");
                      ilEmpty.style.cssText = "text-align:center; color:var(--muted);";
                      ilEmpty.textContent = i18n[currentLang].empty;
                      board.appendChild(ilEmpty);
                      return board;
                  }
                  // Подсветка совпадений должна отражать реальный режим поиска (см. belowRowMatchDetail):
                  // при выключенном «Сквозной поиск» (по умолчанию) каждый кусок ищется САМ ПО СЕБЕ —
                  // findMatches по всей h.str нашёл бы совпадение, тянущееся через границу пар, которое
                  // при обычном захвате не считается найденным.
                  var throughOnNow = !!($("ilThroughSearch") && $("ilThroughSearch").checked);
                  var numPieces = h.bounds.length - 1;
                  // «🔒 Строго»: кусок-пара №pb собран из строк данных pb+1 и pb+2 — значит в него
                  // вправе смотреть только паттерны с номером ≥ pb+3 (у одиночной строки — ≥ 2).
                  // Сквозной кусок — это все строки стога разом, туда пускаем только паттерны с
                  // номером больше их всех.
                  var ilStrict = strictModeOn();
                  var ilPieceMin = function(pb){
                      if (!ilStrict) return undefined;
                      return ilIsSingle ? 2 : (pb + 3);
                  };
                  var ilSegsFull = throughOnNow
                      ? findMatches(h.str, null, ilStrict ? (ilIsSingle ? 2 : numPieces + 2) : undefined)
                      : null;
                  for (var pb = 0; pb < numPieces; pb++){
                      var pairKey = ilIsSingle ? "single" : pb;
                      var isPendingPiece = (ilHaystacks.length > 1) && (pairKey === ilPendingKey) && (pb === numPieces - 1);
                      // Пока пара «нерешённая» и сравниваются 2 доски — реальная сторона ЭТОЙ доски
                      // берётся из h.tag (ilEffectiveSide() для неё вернула бы «право» на обеих досках).
                      var curRight = isPendingPiece ? (h.tag.charAt(h.tag.length - 1) === "→") : ilEffectiveSide(pairKey);

                      var row = document.createElement("div");
                      row.style.cssText = "position:relative; display:flex; min-height:20px; align-items:center;" +
                          (curRight ? " justify-content:flex-start;" : " justify-content:flex-end;");

                      var piece = document.createElement("span");
                      piece.style.cssText = "cursor:grab; border-radius:2px; padding:1px 5px; max-width:46%; overflow-wrap:anywhere;" +
                          (curRight ? " margin-left:3px;" : " margin-right:3px;");
                      piece.title = (currentLang === "ru")
                          ? "Перетащите через ось (или кликните) — переключить сторону добора этой пары (сейчас: " + (curRight ? "→" : "←") + ")"
                          : "Drag across the axis (or click) — toggle this pair's pad side (now: " + (curRight ? "→" : "←") + ")";
                      piece.innerHTML = formatMatchSegments(throughOnNow
                          ? sliceSegments(ilSegsFull, h.bounds[pb], h.bounds[pb + 1])
                          : findMatches(h.str.slice(h.bounds[pb], h.bounds[pb + 1]), null, ilPieceMin(pb)));
                      ilAttachDrag(piece, row, pairKey);
                      row.appendChild(piece);
                      board.appendChild(row);
                  }
                  return board;
              }
              if (ilHaystacks.length) {
                  var ilBoardsWrap = document.createElement("div");
                  ilBoardsWrap.style.cssText = "display:flex; gap:12px; width:100%;";
                  ilHaystacks.forEach(function(h){
                      if (ilHaystacks.length > 1) {
                          var ilOuter = document.createElement("div");
                          ilOuter.style.cssText = "flex:1 1 0; min-width:0;";

                          ilBoardTitle.style.cssText = "text-align:center; color:var(--muted); font-size:10px; margin-bottom:2px;";

              if (preset.key === laserAssemblyVariant) { pb.style.background = "var(--accent)"; pb.style.color = "#fff"; pb.style.borderColor = "var(--accent)"; }

      { // колонки показываем всегда (даже без лазеров) — в заголовке каждой живёт её «⚡ Все»

/* === МАРКЕР 11: DRAW — КОЛЬЦА-НАПРАВЛЯЮЩИЕ, РАМКА ВЫДЕЛЕНИЯ, ЦИФРЫ БАЛАНСА (КОНЕЦ DRAW) === */
  if (!hasSelection && highlightEqual) {
      for(var i=0; i<G.list.length; i++) {
         if (selectedBeamCellSet && !selectedBeamCellSet.has(i)) continue; // выбран лазер — подсвечиваем баланс только по его клеткам
         if (G.list[i][6] !== -1) {
             if (!textHlMap[G.list[i][5]]) textHlMap[G.list[i][5]] = {};
             textHlMap[G.list[i][5]][G.list[i][6]] = G.list[i][2];
         }
      }
  }
  // Автозахват: та же проверка, что у кнопки «По лазерам»/«По строкам» (см. belowRowMatchDetail),
  // а не только попадание в canvas-подсветку лазеров — иначе строки вроде «1000», найденные лишь
  // как инверсия в данных, не подхватывались.
  // Отложенно через микротаск (не setTimeout!), чтобы не рекурсировать из draw(). Микротаск гарантированно
  // выполняется РАНЬШЕ следующего тика любого setInterval (Плей этажей, автосдвиг символов и т.п.) —
  // иначе при быстром автоплее следующий тик успевал стартовать раньше отложенного захвата, тот видел
  // «pendingBelowCapture» ещё не сброшенным и молча пропускал проверку — автозахват «проскакивал» мимо
  // совпадения. Монотонный рост lineLimit гарантирует завершение (строка, ушедшая выше границы,
  // перестаёт быть целью).
  (function(){
      var acb = $("autoCaptureBelow");
      if (!acb || !acb.checked || lineLimit < 0 || pendingBelowCapture) return;
      // Пока «Без отрисовки при Плее» активно и играет любой Плей — эту же проверку уже делает
      // сам тик Плея напрямую (runAutoCaptureCheckOnce), один раз за такт. Если разрешить ЕЩЁ и
      // этому встроенному механизму сработать (а он срабатывает на КАЖДОМ реальном draw(), в т.ч.
      // на том, который вызвал rebuild() после захвата в тике) — получается каскад: один такт
      // Плея утягивает сразу МНОГО строк одну за другой через микрозадачи, холст рисуется на
      // каждой — и создаётся впечатление, что автозахват «никогда не останавливается».
      if (suppressDrawDuringPlayActive()) return;
      var row = belowRowBits();
      if (!row) return;
      var m = belowRowMatchDetail();
      if (!m) return;
      console.log("[Kubits] Автозахват: строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втягиваем в рамку");
      markPatternClosedByNeedle(m.needle);
      pendingBelowCapture = true;
      Promise.resolve().then(function(){
          pendingBelowCapture = false;
          var acb2 = $("autoCaptureBelow");
          if (acb2 && acb2.checked && lineLimit >= 0 && lineLimit < src.value.split('\n').length) { lineLimit++; rebuild(); }
      });
  })();

  updateEditorHighlight(textHlMap, isMinus, highlightEqual, targetHighlights, selectedBeamHlList);
  updatePatHighlight(patHighlights);
  autoFollowScroll();
  renderLineGutter();

  ctx.globalAlpha=1;
  if(G.gd.length){
    ctx.font="11px 'Roboto Mono',monospace";
    ctx.textAlign="left";
    for(var i=0;i<G.gd.length;i++){
      var g=G.gd[i]; col=pc(g.k);
      var isSelG = isSelected(g.k);
      
      var isRingActive = true;
      if (hasSelection) {
          isRingActive = isMinus ? !isSelG : isSelG;
      }

      ctx.globalAlpha = isRingActive ? 0.7 : 0.05;
      if(g.rx>0){
        ctx.strokeStyle=col[2]; ctx.lineWidth=1.5/zoom; ctx.setLineDash([8/zoom,6/zoom]);
        ctx.beginPath();
        ctx.ellipse(g.cx, g.cy, g.rx, g.ry, 0, 0, Math.PI*2);
        ctx.stroke(); ctx.setLineDash([]);
      }
      if(g.lab){
        ctx.globalAlpha = isRingActive ? 1 : 0.1;
        ctx.fillStyle=col[2];
        ctx.fillText(g.lab, g.lx, g.ly);
      }
    }
    ctx.globalAlpha=1;
  }

  if(G.snakeGuide && G.snakeGuide.length > 1){
    ctx.lineWidth = 1.5 / zoom;
    ctx.setLineDash([6 / zoom, 5 / zoom]);
    for(var si = 1; si < G.snakeGuide.length; si++){
      var sp0 = G.snakeGuide[si - 1], sp1 = G.snakeGuide[si];
      if (sp0.k !== sp1.k) continue; // разрыв между концом одной строки и началом следующей
      ctx.strokeStyle = pc(sp0.k)[2];
      ctx.beginPath();
      ctx.moveTo(sp0.x, sp0.y);
      ctx.lineTo(sp1.x, sp1.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (selActive || isSelecting) {
    ctx.lineWidth = 2.5;
    if (highlightEqual && !isMinus) {
      ctx.strokeStyle = "#F1C40F"; 
      ctx.fillStyle = "rgba(241, 196, 15, 0.15)";
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = isMinus ? "#E74C3C" : "#F39C12"; 
      ctx.fillStyle = isMinus ? "rgba(231, 76, 60, 0.1)" : "rgba(243, 156, 18, 0.1)";
      ctx.setLineDash(isMinus ? [4, 4] : [8, 6]);
    }
    
    var selCX = rectX + rectW / 2, selCY = rectY + rectH / 2;
    var aspF = selFrameAspect();
    if (aspF) {
      var rhHalf = rectW / 2, rhHalfV = rhHalf * aspF;
      ctx.beginPath();
      ctx.moveTo(selCX, selCY - rhHalfV);
      ctx.lineTo(selCX + rhHalf, selCY);
      ctx.lineTo(selCX, selCY + rhHalfV);
      ctx.lineTo(selCX - rhHalf, selCY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillRect(rectX, rectY, rectW, rectH);
      ctx.strokeRect(rectX, rectY, rectW, rectH);
    }
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(selCX, selCY, 4, 0, Math.PI*2);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
  }

  if (balanceHl.checked) { // Баланс 1 и 0: показ включается галочкой «Баланс [1 и 0]»
    var curTheme = document.documentElement.dataset.theme;
    var balanceTextCol = (curTheme === "dark") ? "#FFFFFF" : "#111111";
    var balanceGlowCol = (curTheme === "dark") ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.6)";

    var color1 = highlightEqual ? balanceTextCol : "#F39C12";
    var color0 = highlightEqual ? balanceTextCol : "#E74C3C";

    ctx.font = "bold 90px 'Roboto Mono', monospace";
    ctx.textBaseline = "middle";

    if (highlightEqual) {
      ctx.shadowBlur = 25;
      ctx.shadowColor = balanceGlowCol;
    } else {
      ctx.shadowBlur = 0;
    }

    // Баланс — в нижних углах холста, мелким шрифтом, чтобы ничего не перекрывать
    var bay = stage.clientHeight - 70;
    var W = stage.clientWidth;

    var mainFont = "bold 58px 'Roboto Mono', monospace";
    var tailFont = "bold 28px 'Roboto Mono', monospace";
    var showT1 = dimPadded.checked && dispT1 > 0;
    var showT0 = dimPadded.checked && dispT0 > 0;
    var tailEqual = showT1 && showT0 && dispT1 === dispT0;
    ctx.textAlign = "left";

    ctx.fillStyle = color1;
    ctx.font = mainFont;
    var m1 = String(disp1);
    var w1 = ctx.measureText(m1).width;
    var tw1 = 0;
    if (showT1) { ctx.font = tailFont; tw1 = ctx.measureText("(" + dispT1 + ")").width; ctx.font = mainFont; }
    var lx0 = 24;
    ctx.fillText(m1, lx0, bay);
    if (showT1) {
        ctx.font = tailFont;
        if (tailEqual) {
            ctx.fillStyle = balanceTextCol;
            ctx.shadowBlur = 25;
            ctx.shadowColor = balanceGlowCol;
        } else {
            ctx.globalAlpha = 0.45;
        }
        ctx.fillText("(" + dispT1 + ")", lx0 + w1, bay);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = highlightEqual ? 25 : 0;
    }

    ctx.fillStyle = color0;
    ctx.font = mainFont;
    var m0 = String(disp0);
    var w0 = ctx.measureText(m0).width;
    var tw0 = 0;
    if (showT0) { ctx.font = tailFont; tw0 = ctx.measureText("(" + dispT0 + ")").width; ctx.font = mainFont; }
    var rx0 = W - 24 - w0 - tw0;
    ctx.fillText(m0, rx0, bay);
    if (showT0) {
        ctx.font = tailFont;
        if (tailEqual) {
            ctx.fillStyle = balanceTextCol;
            ctx.shadowBlur = 25;
            ctx.shadowColor = balanceGlowCol;
        } else {
            ctx.globalAlpha = 0.45;
        }
        ctx.fillText("(" + dispT0 + ")", rx0 + w0, bay);
        ctx.globalAlpha = 1;
    }

    ctx.shadowBlur = 0;
  }
}
/* === МАРКЕР 12: КЛИК ПО ЭТАЖУ, ПОСТРОЕНИЕ СЕЛЕКТОРА, ПОВОРОТ СТРОК === */
function hitFloor(wx,wy){
  if(G.kind==="iso"){
    var hf = getClickedFace(wx, wy);
    return hf ? hf.c[2] : null;
  }
  var L=G.list;
  for(var i=L.length-1;i>=0;i--){
    var c=L[i];
    var isRealGhost = (c[3]===0 && !c[4]);
    var isPadGhost = (c[3]===0 && c[4]);
    var forceGhost = (ghosts.checked && isRealGhost) || (ghostsAll.checked && isPadGhost);
    if(c[3] === 0 && !forceGhost && (!selActive)) continue;
    
    if(G.kind==="top"){
      if(wx>=aC(c)*TS && wx<=aC(c)*TS+TS && wy>=c[1]*TS && wy<=c[1]*TS+TS) return c[2];
    } else {
      var dx=Math.abs(wx-rhX(c)), dy=Math.abs(wy-(-c[2]*DD/2));
      if(dx/(DD/2)+dy/(DD/2)<=1) return c[2];
    }
  }
  return null;
}

// Фильтр строк по ВИДИМОСТИ при активной рамке выделения на холсте: без «Вычитать выделенное»
// видимые клетки — внутри рамки, с «Вычитанием» — снаружи. Строка считается видимой, если у неё
// есть хотя бы одна видимая клетка. Оба сдвига (символьный и визуальный) двигают только такие
// строки — то, что реально видно, независимо от способа получения видимости.
// lastFrameElements заполняется в draw() и остаётся валидным между отрисовками (рамка и сетка
// не двигаются между тактами), поэтому работает и из Сдвиг-Плея с подавлением отрисовки.
function visibleLinesUnderFrame(lines, silent){
    if (!((selActive || isSelecting) && lastFrameElements && lastFrameElements.size)) return lines;
    var inFrame = new Set(), outFrame = new Set();
    G.list.forEach(function(c, i){
        if (!c || c[5] === -1) return;
        if (lastFrameElements.has(i)) inFrame.add(c[5]); else outFrame.add(c[5]);
    });
    var visible = minusMode.checked ? outFrame : inFrame;
    var res = new Set();
    lines.forEach(function(absL){ if (visible.has(absL)) res.add(absL); });
    if (!silent && res.size < lines.size) {
        var skipped = Array.from(lines).filter(function(l){ return !res.has(l); });
        console.log("[Kubits] Сдвиг: невидимые строки (" + (minusMode.checked ? "вычтены рамкой" : "вне рамки") +
            ") не двигаются — " + skipped.map(function(l){ return "№" + (l + 1); }).join(", "));
    }
    return res;
}

function rotateSelected(dir, skipDraw, silent) {
    var rawLines = src.value.split("\n");
    var linesToShift = new Set();
    var shiftAll = (sel.size === 0); // без выделения сдвигаем ВСЕ строки

    G.list.forEach(function(c) {
        if ((shiftAll || sel.has(c[2])) && c[5] !== -1) {
            linesToShift.add(c[5]);
        }
    });
    linesToShift = visibleLinesUnderFrame(linesToShift, silent); // рамка: крутим только видимые строки

    var changed = false;
    linesToShift.forEach(function(absL) {
        var line = rawLines[absL];
        var match = line.match(/^(\s*)(.*?)(\s*)$/);
        if(match) {
            var pre = match[1], core = match[2], post = match[3];
            // Крутим ТОЛЬКО саму строку: добор в редактор не записываем,
            // он пересчитается от сдвинутой строки и останется прозрачным
            if (core.length > 1) {
                if (dir === 'CW') {
                    core = core.slice(-1) + core.slice(0, -1);
                } else {
                    core = core.slice(1) + core.slice(0, 1);
                }
                rawLines[absL] = pre + core + post;
                changed = true;
            }
        }
    });

    if (changed) {
        var selBackup = Array.from(sel); 
        src.value = rawLines.join("\n");
        parse();
        var onesCount = D.cells.filter(function(c){return c[3]===1}).length;
        stF.textContent=D.floors; stC.textContent=onesCount;
        warn.style.display=D.truncated?"block":"none";
        buildSelector();
        geometry();
        
        selBackup.forEach(function(k) { sel.add(k); });
        if (!skipDraw) draw(); // skipDraw=true — вызывающий (shiftAnimTick) сам решает, рисовать ли холст
        syncSelUI();
    }
}

// Визуальный сдвиг по кругу («👁 Визуальный сдвиг»): в отличие от rotateSelected, НЕ трогает
// src.value — крутит только то, какая клетка кольца какой бит показывает (ringVisualShift).
// Работает только там, где реально используется добор по кругу (ring.doLoop) — на выбранных
// этажах (или на всех, если ничего не выбрано).
// silent=true (передаёт непрерывный «▶ Плей», см. shiftAnimTick) — без console.log: на каждом
// такте сдвигаются и находятся ОДНИ И ТЕ ЖЕ строки, лог этого не показывает ничего нового, зато
// на скорости Плея быстро копит тысячи записей в консоли и тратит время на них зря. Разовый
// сдвиг по клику кнопки логируется как раньше.
function shiftRingVisual(dir, skipDraw, silent) {
    var linesToShift = new Set();
    var shiftAll = (sel.size === 0);
    G.list.forEach(function(c) {
        if ((shiftAll || sel.has(c[2])) && c[5] !== -1) linesToShift.add(c[5]);
    });
    // Рамка выделения на холсте: крутятся только ВИДИМЫЕ строки — без «Вычитания» это строки
    // в рамке, с «Вычитать выделенное» — строки вне её (см. visibleLinesUnderFrame).
    linesToShift = visibleLinesUnderFrame(linesToShift, silent);
    if (!linesToShift.size) {
        if (!silent) console.log("[Kubits] Визуальный сдвиг: нет ни одной подходящей строки (пусто на этаже/строке?), ничего не сдвинуто.");
        return;
    }
    var rawLinesForLog = silent ? null : src.value.split("\n");
    linesToShift.forEach(function(absL) {
        var cur = ringVisualShift[absL] || 0;
        ringVisualShift[absL] = cur + (dir === 'CW' ? 1 : -1);
    });
    if (!silent) {
        console.log("[Kubits] Визуальный сдвиг (" + dir + "), sel=" + JSON.stringify(Array.from(sel)) + ": " +
            Array.from(linesToShift).map(function(absL){
                return "строка №" + (absL + 1) + " \"" + rawLinesForLog[absL].trim() + "\" → сдвиг=" + ringVisualShift[absL];
            }).join("; "));
    }
    parse();
    geometry();
    if (!skipDraw) draw(); // skipDraw=true — вызывающий (shiftAnimTick) сам решает, рисовать ли холст
}
function resetRingVisualShift() {
    var shiftAll = (sel.size === 0);
    if (shiftAll) {
        ringVisualShift = {};
    } else {
        G.list.forEach(function(c) {
            if (sel.has(c[2]) && c[5] !== -1) delete ringVisualShift[c[5]];
        });
    }
    parse();
    geometry();
    draw();
}

/* === МАРКЕР 12a: ИТОГОВЫЕ СТРОКИ ЛАЗЕРОВ ДЛЯ ВЫГРУЗКИ В EXCEL === */
// Собирает текущие лазеры в строки {axis, axisLabel, index, str} — тем же способом, что и панель результатов
function laserResultRowsForExport() {
    if (!(skewerMode.checked && laserModeOk()) || !skewers.length) return [];
    var lctx = buildLaserNodes();
    var axisLabel = {
        top:   (currentLang==='ru' ? 'Верх'  : 'Top'),
        right: (currentLang==='ru' ? 'Право' : 'Right'),
        left:  (currentLang==='ru' ? 'Лево'  : 'Left'),
        horiz: (currentLang==='ru' ? 'Гориз' : 'Horiz'),
        db:    (currentLang==='ru' ? 'Диаг \\' : 'Diag \\'),
        da:    (currentLang==='ru' ? 'Диаг /'  : 'Diag /')
    };
    var rows = [];
    skewers.forEach(function(sk){
        var hitList = beamCells(sk.type, sk.d);
        var str = "";
        hitList.forEach(function(hit){ str += hit.c[3]; });
        var node = (lctx.groups[sk.type] || []).find(function(n){ return n.d === sk.d; });
        rows.push({ axis: sk.type, axisLabel: axisLabel[sk.type] || sk.type, index: node ? node.index : 0, str: str });
    });
    var order = { top:0, right:1, left:2 };
    rows.sort(function(a,b){ return (order[a.axis]-order[b.axis]) || (a.index-b.index); });
    return rows;
}
// Все ВОЗМОЖНЫЕ лазерные строки — по каждой точке каждой оси (не только по уже добавленным
// пользователем лазерам). Используется, когда лазеров ещё нет ни одного: тогда «По лазерам» ищет
// совпадение сразу по всем осям, а не только там, где явно стоит лазер.
function allPossibleLaserRows() {
    if (!(skewerMode.checked && laserModeOk()) || !G || !G.list) return [];
    var lctx = buildLaserNodes();
    var axisLabel = {
        top:   (currentLang==='ru' ? 'Верх'  : 'Top'),
        right: (currentLang==='ru' ? 'Право' : 'Right'),
        left:  (currentLang==='ru' ? 'Лево'  : 'Left'),
        horiz: (currentLang==='ru' ? 'Гориз' : 'Horiz'),
        db:    (currentLang==='ru' ? 'Диаг \\' : 'Diag \\'),
        da:    (currentLang==='ru' ? 'Диаг /'  : 'Diag /')
    };
    var rows = [];
    lctx.nodes.forEach(function(node){
        var hitList = beamCells(node.type, node.d);
        var str = "";
        hitList.forEach(function(hit){ str += hit.c[3]; });
        rows.push({ axis: node.type, axisLabel: axisLabel[node.type] || node.type, index: node.index, str: str });
    });
    var order = { top:0, right:1, left:2 };
    rows.sort(function(a,b){ return (order[a.axis]-order[b.axis]) || (a.index-b.index); });
    return rows;
}
// Строки для проверок «По лазерам»/автозахвата: если у пользователя стоит хоть один лазер —
// смотрим только на них (его явный выбор), иначе — сразу по всем возможным осям.
function laserRowsForCapture() {
    return skewers.length ? laserResultRowsForExport() : allPossibleLaserRows();
}

// Отдельный лист «Лазеры» с итоговыми строками; пусто, если лазеров нет
function laserWorksheetXml() {
    var rows = laserResultRowsForExport();

        var r1 = parseInt(hex1.slice(1, 3), 16);
        var g1 = parseInt(hex1.slice(3, 5), 16);
        var b1 = parseInt(hex1.slice(5, 7), 16);
        var r2 = parseInt(hex2.slice(1, 3), 16);

/* === МАРКЕР 15: SAVEBLOB, SYNCSELUI, REBUILD И СЛУШАТЕЛИ НАСТРОЕК === */
function saveBlob(xml, name) {
    var blob = new Blob([xml], {type: 'text/xml'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
}

function syncSelUI(){
  var bs=chips.querySelectorAll("[data-chip]");
  for(var i=0;i<bs.length;i++){
    var k = +bs[i].dataset.chip;
    var isSelC = (sel.size === 0 || sel.has(k));
    bs[i].style.opacity = isSelC ? "1" : "0.25";
    bs[i].style.transform = sel.has(k) ? "scale(1.08)" : "scale(1)";
  }
  
  if(sliderRow.style.display!=="none"){
    if (sel.size === 1) {
        fr.value = Array.from(sel)[0] + 1;
        frLabel.textContent = fr.value;
    } else if (sel.size === 0) {
        fr.value = 0;
        frLabel.textContent = i18n[currentLang].floorAll;
    } else {
        fr.value = 0;
        frLabel.textContent = i18n[currentLang].floorMulti;
    }
  }

  // Панель «Сдвиг символов» видна всегда: без выделения сдвиг крутит ВСЕ строки
  rotWrap.style.display = "flex";
  if (sel.size === 0) {
      if (info) info.innerHTML = i18n[currentLang].info1;
  } else {
      var arr = Array.from(sel).sort(function(a,b){return a-b;});
      if (arr.length === 1) {
          var r = D.rows[arr[0]] || "";
          if (r.length > 55) r = r.slice(0,55) + "…";
          var flText = (currentLang==='ru') ? "Этаж " : "Floor ";
          if (info) info.innerHTML = flText + (arr[0]+1) + ": " + r;
      } else {
          var selText = (currentLang==='ru') ? "Выбраны этажи: <b>" : "Selected floors: <b>";
          if (info) info.innerHTML = selText + arr.map(function(x){return x+1;}).join(", ") + "</b>";
      }
      rotWrap.style.display = "flex";
  }

  // Кнопки «👁 Визуальный сдвиг» видны только там, где реально есть добор по кругу (иначе крутить
  // нечего). Если их скрыли, а общий плеер в этот момент крутил именно визуальный сдвиг — остановить.
  var _visRotBtns = $("visRotBtns");

  $("alignGroup").style.display = (mode.value === "funnel" || mode.value === "rhomb" || mode.value === "blocks") ? "flex" : "none";

// fitView=true — заново подогнать вид под фигуру (центр + масштаб). По умолчанию НЕ подгоняем:
// раньше autoFit() стоял здесь безусловно, и холст дёргался на КАЖДОМ пересчёте — на каждом шаге
// захвата, на «Стоп», на паузе, на каждом такте Плея. Вид теперь пересобирается только когда его
// явно просят: Escape, смена вида/режима, генерация данных, загрузка файла, «⏹ Сброс», первый
// показ (viewFitted). Зум/панораму пользователя больше ничто не сбрасывает само.
var viewFitted = false;
function rebuild(fitView){
  var _axesAll = (typeof laserAxesAllActive === 'function') ? laserAxesAllActive() : null; // оси со «Все» — чтобы не сбрасывались при пересчёте
  resetXorOverlays(); // данные/режим изменились — накопленное XOR-поле больше не актуально
  parse();

  // updateEditorHighlight): когда строка под границей полностью найдена в лучах, граница едет вниз.
  var onesCount = D.cells.filter(function(c){return c[3]===1}).length;

  if (isSquaresMode() && squareEditMode) squaresRebuildAll();
  draw();
  syncSelUI();
