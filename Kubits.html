/* === Кеш «Данных (Строки)» в localStorage браузера (ручной, кнопкой) === */
// Автозаписи НЕТ (v0.258 сбивала данные — откачено): кеш пишется только кнопкой «💾 Запомнить»
// над редактором. Вместе с текстом запоминается и положение верхней/нижней границы «Данных».
// Запомненное: 1) автоматически подтягивается при загрузке/F5 ЛЮБОЙ версии файла в том же
// браузере тем же способом (file:// и http://127.0.0.1 — разные хранилища); 2) возвращается
// кнопкой «⏹ Сброс» над редактором (если кеша нет — сброс к шаблону из кода). Пустой кеш игнорируется.
var SRC_CACHE_KEY = "kubits_src";
function saveSrcToCache(){
  try {
    var ptaEl = $("patSrc");
    localStorage.setItem(SRC_CACHE_KEY, JSON.stringify({ src: src.value, lineLimit: lineLimit, lineLimitTop: lineLimitTop,
      pat: ptaEl ? ptaEl.value : "", patSkip: patSkipFirstOn(), patStrict: patStrictOn() }));
    return true;
  } catch(e){ return false; }
}
function getSrcCache(){
  try {
    var s = localStorage.getItem(SRC_CACHE_KEY);
    if (!s) return null;
    var parsed = null;
    try { parsed = JSON.parse(s); } catch(e){ parsed = null; }
    if (parsed && typeof parsed === "object" && typeof parsed.src === "string") {
      return parsed.src.trim() ? parsed : null;
    }
    // кеш старого формата (просто текст, до появления границ в кеше) — границы не сохранены
    return s.trim() ? { src: s, lineLimit: -1, lineLimitTop: 0 } : null;
  } catch(e){ return null; }
}
function restoreSrcFromCache(){
  var saved = getSrcCache();
  if (saved !== null) {
    src.value = saved.src;
    lineLimit = saved.lineLimit;
    lineLimitTop = saved.lineLimitTop;
    var ptaEl = $("patSrc");
    if (ptaEl && typeof saved.pat === "string") { ptaEl.value = saved.pat; lastPatBgHtml = null; lastPatGutterHtml = null; }
    var psfEl = $("patSkipFirstCheck");
    if (psfEl && typeof saved.patSkip === "boolean") psfEl.checked = saved.patSkip;
    var pstEl = $("btnPatStrict");
    if (pstEl && typeof saved.patStrict === "boolean") pstEl.classList.toggle("active", saved.patStrict);
  }
}

/* === Сквозной автозахват нижней строки (граница lineLimit) === */
// Биты строки сразу под границей (первая не участвующая строка). Пусто = нечего искать.
function belowRowBits(){
  var lines = src.value.split("\n");
  if (lineLimit < 0 || lineLimit >= lines.length) return "";
  return lines[lineLimit].trim().replace(/\s+/g, "");
}
// Искомый паттерн нижней строки: при включённом «Без 1-го символа» отбрасываем первый бит
// (искать со 2-го). Строку из одного символа не укорачиваем.
function belowRowSearchPat(){
  var pat = belowRowBits();
  var sf = $("skipFirstCharCheck");
  if (sf && sf.checked && pat.length > 1) pat = pat.slice(1);
  return pat;
}
// Найдена ли нижняя строка в «сквозной» строке haystack, и КАКИМ вариантом — как в лазерной
// подсветке: прямой / инверсия / реверс + все циклические повороты паттерна.
// Ищет ЛЮБОЙ из искомых паттернов (см. searchPatternsList: либо поле «Паттерны», либо строка
// под границей) — первый найденный и возвращается.
function belowRowFoundInDetail(haystack, onlyPats){
  if (!haystack) return null;
  var pats = onlyPats || searchPatternsList();
  if (!pats.length) return null;
  var idx = makeHayIndex(haystack);
  for (var pi = 0; pi < pats.length; pi++){
    var pat = pats[pi];
    if (!pat) continue;
    var hit = hayFindPattern(idx, patVariants(pat));
    if (hit) return { kind: hit.kind, pat: hit.pat, rot: hit.rot, total: hit.total, needle: pat };
  }
  return null;
}
// В каком именно лазере найдена нижняя строка (или null) — для лога «какой лазер дал строку».
// Проверяет строки-результаты каждого лазера отдельно: прямой/инверсия/реверс + повороты.
// Если у пользователя нет ни одного лазера — проверяет сразу все возможные оси (laserRowsForCapture).
function belowRowFoundLaser(){
  var pats = searchPatternsList();
  if (!pats.length) return null;
  var rows = laserRowsForCapture();
  // Индексы строк-лазеров считаем один раз, до цикла по паттернам
  var idxs = [];
  for (var r0 = 0; r0 < rows.length; r0++) idxs.push(makeHayIndex(rows[r0].str));
  for (var pi = 0; pi < pats.length; pi++){
    var pat = pats[pi];
    if (!pat) continue;
    var v = patVariants(pat);
    for (var r = 0; r < rows.length; r++){
      var hit = hayFindPattern(idxs[r], v);
      if (hit) return { axisLabel: rows[r].axisLabel, index: rows[r].index, kind: hit.kind, rot: hit.rot, pat: hit.pat, total: hit.total, needle: pat };
    }
  }
  return null;
}
// «Сквозная» склейка всех участвующих строк (0..lineLimit-1) с их добором подряд одной строкой.
// maxRows (для «🔒 Строго») — брать не больше стольких первых строк, поверх обычной границы.
function throughRowsHaystack(maxRows){
  var lines = src.value.split("\n");
  var lim = (lineLimit < 0) ? lines.length : Math.min(lineLimit, lines.length);
  if (typeof maxRows === "number") lim = Math.min(lim, Math.max(0, maxRows));
  var s = "";
  for (var i = 0; i < lim; i++){
    var t = lines[i].trim().replace(/\s+/g, "");
    if (!t) continue;
    var pad = (D && D.padTails && D.padTails[i]) ? D.padTails[i] : "";
    s += t + pad;
  }
  return s;
}
// Склейка всех строк-результатов лазеров подряд (или всех возможных осей, если лазеров ещё нет).
function throughLasersHaystack(){
  var rows = laserRowsForCapture();
  var s = "";
  rows.forEach(function(r){ s += r.str; });
  return s;
}
// Побитовое чередование двух строк: b1[0],b2[0],b1[1],b2[1],...
// Если строки РАЗНОЙ длины, шаг задаёт длинная, а короткая вставляется в неё со сдвигом —
// «Совмещение» (ilAlignMode): ⭰ с начала (как было раньше), ⭤ по середине (по умолчанию),
// ⭲ в конец. Пример для 00000 и 11: ⭰ → 0101000, ⭤ → 0010100, ⭲ → 0001010.
// Порядок символов внутри пары сохранён прежний: сначала символ ПЕРВОЙ строки, потом второй.
var ilAlignMode = "center";
function interleave(a, b){
  var la = a.length, lb = b.length;
  if (!la) return b;
  if (!lb) return a;
  var d = Math.abs(la - lb);
  var off = (ilAlignMode === "left") ? 0 : (ilAlignMode === "right") ? d : Math.floor(d / 2);
  var aIsLong = (la >= lb);
  var longer = aIsLong ? a : b, shorter = aIsLong ? b : a;
  var out = "";
  for (var i = 0; i < longer.length; i++){
    var j = i - off;
    var s = (j >= 0 && j < shorter.length) ? shorter[j] : null;
    if (aIsLong) { out += longer[i]; if (s !== null) out += s; }
    else         { if (s !== null) out += s; out += longer[i]; }
  }
  return out;
}
// «Стог» для интерливинга: ВСЕ уже включённые строки над границей (не под ней!) разбиваются на
// пары СКОЛЬЗЯЩИМ ОКНОМ — 1+2, 2+3, 3+4, 4+5, ... (каждая соседняя пара, с перекрытием, а не
// только 1+2 / 3+4 без повтора строк), каждая пара чередуется побитово, и результаты всех пар
// склеиваются подряд в ОДНУ сквозную строку-стог.
//   А/Б (кнопки btnIlVarA/btnIlVarB, взаимоисключающие) — общий для ВСЕГО стога способ сборки:
//     А) в каждой паре сначала чередуем сами биты (b1[0],b2[0],b1[1],b2[1]...), потом отдельно
//        хвосты добора, и склеиваем результаты;
//     Б) в каждой паре сначала каждая строка целиком (биты+хвост добора), потом чередуем эти две
//        целые строки.
//   →/← — сторона добора (после бит / перед битами) теперь СВОЯ У КАЖДОЙ ПАРЫ (ilPairSide[i]),
//     а не одна на весь стог: клик по кнопкам →/← в панели задаёт лишь ОБЩИЙ ДЕФОЛТ и сбрасывает
//     точечные правки; клик по конкретному куску пары в панели «Стог» меняет сторону ТОЛЬКО этой
//     пары. «?» ничего не решает сама — под ней самая новая (ещё не решённая) пара показывается
//     ОБЕИМИ сторонами для сравнения, а кнопки →/← в подсказке ниже пишут решение в ту же
//     ilPairSide. Захват НИКОГДА не ждёт ответа: нерешённые пары всегда «право» по умолчанию.
// Если над границей только одна строка — чередовать не с чем (А/Б неприменимы), стог — она сама
// (ключ "single" в ilPairSide), только сторона добора (→/←) имеет смысл.
// Эффективная сторона добора конкретного ключа (индекс пары или "single"): точечная правка
// (клик по куску в панели / ответ в подсказке «?», хранится в ilPairSide) важнее общего дефолта;
// если сейчас активна «?» и правки для этого ключа нет — дефолт «право» (захват не должен ждать
// ответа). true=право, false=лево. Общая функция — используется и при сборке стога, и при
// клике по куску (чтобы понять, на какую сторону переключать).
function ilEffectiveSide(key){
  if (ilPairSide[key] === "right") return true;
  if (ilPairSide[key] === "left") return false;
  var askEl = $("btnIlSideAsk"), elR = $("btnIlSideRight");
  var askMode = !!(askEl && askEl.classList.contains("active"));
  if (askMode) return true;
  return !elR || elR.classList.contains("active");
}
// maxRows (для «🔒 Строго») — брать не больше стольких первых строк, поверх обычной границы.
// Панель «Стог» зовёт без аргумента, так что показывает полный стог, как и раньше.
function aboveRowsInterleavedHaystacks(maxRows){
  var lines = src.value.split("\n");
  var lim = (lineLimit < 0) ? lines.length : Math.min(lineLimit, lines.length);
  if (typeof maxRows === "number") lim = Math.min(lim, Math.max(0, maxRows));
  if (lim <= 0) return [];
  var bitsOf = function(i){ return lines[i].trim().replace(/\s+/g, ""); };
  var padOf = function(i){ return (D && D.padTails && D.padTails[i]) ? D.padTails[i] : ""; };

  var elA = $("btnIlVarA");
  var useA = !elA || elA.classList.contains("active");
  var askEl = $("btnIlSideAsk");
  var askMode = !!(askEl && askEl.classList.contains("active"));

  if (lim === 1) {
    var bits0 = bitsOf(0), pad0 = padOf(0);
    var pending0 = askMode && ilPairSide.single === undefined;
    var opts0 = pending0 ? [true, false] : [ilEffectiveSide("single")];
    return opts0.map(function(right){
      return right ? { str: bits0 + pad0, tag: "→", bounds: [0, bits0.length + pad0.length] }
                    : { str: pad0 + bits0, tag: "←", bounds: [0, pad0.length + bits0.length] };
    });
  }

  var lastPairIdx = lim - 2; // индекс самой новой пары — только она может быть «ещё не решённой»
  var pendingLast = askMode && ilPairSide[lastPairIdx] === undefined;
  var lastSideOpts = pendingLast ? [true, false] : [ilEffectiveSide(lastPairIdx)];

  var candidates = [];
  lastSideOpts.forEach(function(lastRight){
    var h = "", bounds = [0];
    for (var i = 0; i + 1 < lim; i++){
      var right = (i === lastPairIdx) ? lastRight : ilEffectiveSide(i);
      var b1 = bitsOf(i), b2 = bitsOf(i + 1), p1 = padOf(i), p2 = padOf(i + 1);
      if (useA) h += right ? (interleave(b1, b2) + interleave(p1, p2)) : (interleave(p1, p2) + interleave(b1, b2));
      else h += right ? interleave(b1 + p1, b2 + p2) : interleave(p1 + b1, p2 + b2);
      bounds.push(h.length);
    }
    var tag = (useA ? "А" : "Б") + (pendingLast ? (lastRight ? "→" : "←") : "");
    candidates.push({ str: h, tag: tag, bounds: bounds });
  });

  var seen = {}, res = [];
  candidates.forEach(function(c){
    if (seen[c.str] !== undefined) return; // дедуп: одинаковые строки (напр. без добора) не дублируем
    seen[c.str] = true;
    res.push(c);
  });
  return res;
}
// Обрезать готовые варианты стога до первых takePieces кусков — для «🔒 Строго», чтобы не
// пересобирать стог заново под каждый паттерн. Куски идут подряд, поэтому «стог из первых N
// строк» — это ровно префикс общего стога по его же bounds.
function prefixHaystacks(hs, takePieces){
  var out = [];
  for (var i = 0; i < hs.length; i++){
    var h = hs[i], n = h.bounds.length - 1;
    var take = Math.min(n, takePieces);
    if (take <= 0) continue;
    if (take === n) { out.push(h); continue; }
    out.push({ str: h.str.slice(0, h.bounds[take]), tag: h.tag, bounds: h.bounds.slice(0, take + 1) });
  }
  return out;
}
// Счётчик «попытка N из total» для поисковых циклов автозахвата (см. ниже) — просто текст,
// без перерисовки холста; total = максимум попыток (сколько строк вообще может быть втянуто).
function setCaptureProgress(n, total){
  var el = $("captureProgress");
  if (el) el.textContent = n > 0 ? ("попытка " + n + " из " + total) : "";
}
function clearCaptureProgress(){ setCaptureProgress(0, 0); }

// «Быстрый» пересчёт модели для поисковых циклов: то же, что нужно belowRowMatchDetail/лазерам
// (parse — новый D/добор под сдвинутой границей, geometry — новые координаты G.list для
// beamCells), но БЕЗ отрисовки холста и обвязки правой панели (autoFit/buildSelector/syncSelUI/
// updateLineLimitBar/laserReapplyAll) — они не влияют на сам поиск, только на то, что видно
// пользователю. Полноценный rebuild() (со всем этим и отрисовкой) делается один раз в конце
// цикла — см. captureBelowThroughLasers.
function fastModelRecompute(){
  resetXorOverlays();
  parse();
  geometry();
}

// «🚫 Без отрисовки при Плее» (чекбокс, по умолчанию ВЫКЛЮЧЕН): пока играет любая из 6 анимаций
// (Флип/Поворот/Сдвиг/Этажи/Змейка) И включён непрерывный «Автозахват» — не гоняем полный
// draw() на КАЖДОМ такте (дорого: холст + вся обвязка), а только проверяем автозахват (ВСЕГДА
// полная проверка, все 4 уровня — см. belowRowMatchDetail/computeAssemblyHaystackFresh, ей draw()
// для этого не нужен). Рисуем полноценно только когда реально что-то захвачено — тогда видно,
// что граница сдвинулась. Если чекбокс выключен (по умолчанию) — обычный draw() на каждом такте,
// как и было всегда; анимация видна вживую.
// Активно ли сейчас «Без отрисовки при Плее» (чекбокс включён И играет любой из 5 Плеев) — общая
// проверка для playTickRender/шифт-тика И для встроенного в draw() автозахвата (тот должен
// промолчать в этом случае, чтобы не дублировать работу тика, см. MARKER 11).
function suppressDrawDuringPlayActive(){
  var suppressEl = $("suppressDrawDuringPlay");
  var acbEl = $("autoCaptureBelow");
  var anyPlayOn = shiftAnimOn || flipAnimOn || rotAnimOn || floorAnimOn || snakeAnimOn;
  return !!(suppressEl && suppressEl.checked && acbEl && acbEl.checked && anyPlayOn);
}
// При включении галки все 5 ползунков скоростей Плеев автоматически ставятся на максимум
// скорости (минимальное значение ползунка = самый короткий период) — реальный прирост темпа
// поиска подавление даёт именно там, где отрисовка была узким местом (замер v0.258: 252
// такта/с против 104 на максимуме Сдвига). Прежние значения запоминаются и возвращаются при
// выключении. dispatchEvent("input") — чтобы уже играющий плеер перезапустил таймер с новым
// периодом (makePlayer слушает "input"), а fastZone-подсветка ползунка обновилась.
(function(){
  var supEl = $("suppressDrawDuringPlay");
  if (!supEl) return;
  var ids = ["shiftAnimSpeed","flipAnimSpeed","rotAnimSpeed","floorAnimSpeed","snakeAnimSpeed"];
  var savedSpeeds = null;
  supEl.addEventListener("change", function(){
    if (supEl.checked) {
      savedSpeeds = {};
      ids.forEach(function(id){
        var el = $(id); if (!el) return;
        savedSpeeds[id] = el.value;
        el.value = el.min;
        el.dispatchEvent(new Event("input", { bubbles: true }));
      });
    } else if (savedSpeeds) {
      ids.forEach(function(id){
        var el = $(id); if (!el || !(id in savedSpeeds)) return;
        el.value = savedSpeeds[id];
        el.dispatchEvent(new Event("input", { bubbles: true }));
      });
      savedSpeeds = null;
    }
  });
})();
function runAutoCaptureCheckOnce(){

  markPatternClosedByNeedle(m.needle);

}

// Режим A («По строкам»): обычная строка под границей (без чередования её самой, как раньше)
// ищется в интерливинг-стоге из двух последних включённых строк над границей — проверяются
// оба варианта добора (см. aboveRowsInterleavedHaystacks/belowRowMatchDetail). Если найдена —
// втягиваем внутрь эту ОДНУ строку (граница +1), и так по кругу; на каждом шаге стог
// пересчитывается заново от новых последних двух строк над (уже сдвинутой) границей.
// Использует ту же belowRowMatchDetail(), что и «Шаг»/непрерывный автозахват (чекбокс) — поэтому
// они ведут себя одинаково, пока активно «По строкам» (см. rowsModeActive). Уже не рисует холст
// на каждом шаге (только parse) — счётчик прогресса добавлен для единообразия с «По лазерам».
function autoCaptureBelowThroughRows(){
  var guard = 0, total = src.value.split("\n").length, changed = false;
  while (guard++ < total){
    var row = belowRowBits();
    if (!row) break;
    var m = belowRowMatchDetail();
    if (!m) break;
    console.log("[Kubits] Строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втянута в рамку");
    markPatternClosedByNeedle(m.needle);
    lineLimit++;
    changed = true;
    setCaptureProgress(guard, total);
    parse(); // обновить D/добор под новой границей
  }
  clearCaptureProgress();
  return changed;
}
// Общая проверка «найдена ли строка под границей». Используется кнопкой «По лазерам», кнопкой
// «По строкам», непрерывным автозахватом (чекбокс) и одношаговой кнопкой «Шаг» — все четыре
// подряд смотрят на ОДИН и тот же текущий режим (rowsModeActive), поэтому ведут себя одинаково.
// Пока активно «По строкам» — ищем только в интерливинг-стоге (над границей). Иначе — три уровня
// проверки лазеров: конкретный лазер → склейка всех лазеров → сборка лазеров → сквозная строка данных.
// fast=true (быстрый цикл captureBelowThroughLasers, без draw() на каждом шаге) пропускает уровень
// «Сборка лазеров» — она берёт lastAssemblyHaystack, который иначе обновляется только внутри
// draw() и был бы устаревшим/неверным посреди быстрого цикла. lz/fdL/fdR всегда пересчитываются
// заново из G.list — им draw() не нужен, поэтому они одинаково надёжны и в быстром, и в обычном режиме.
// Поиск по готовым вариантам стога (общий кусок для обычного и строгого режимов).
// onlyPats — искать только эти паттерны (строгий режим), null — все текущие искомые строки.
function ilSearchInHaystacks(haystacks, onlyPats, note){
  var throughEl = $("ilThroughSearch");
  var throughMode = !!(throughEl && throughEl.checked);
  // Паттерны перебираем ВНЕШНИМ циклом: побеждает меньший НОМЕР паттерна, а не то, в каком
  // куске стога раньше попалось совпадение. Раньше внешним был кусок, и паттерн №7, совпавший
  // в первой паре, обходил паттерн №2, совпадавший во второй — подсветка и захват расходились.
  // Куски нарезаем ОДИН раз, до цикла по паттернам: иначе на каждый паттерн шла бы своя нарезка,
  // а это на 70 паттернах снова тысячи лишних подстрок за кадр.
  var parts = [];
  for (var hi = 0; hi < haystacks.length; hi++){
    var h = haystacks[hi];
    var tagSuffix = haystacks.length > 1 ? " (" + h.tag + ")" : "";
    if (throughMode) {
      // Сквозной поиск: вся склеенная строка разом — совпадение может тянуться через границу пар.
      parts.push({ idx: makeHayIndex(h.str), label: "интерливинг строк над границей (сквозной)" + tagSuffix });
    } else {
      // По умолчанию: каждый кусок-пара — своя ОТДЕЛЬНАЯ строка поиска, совпадение не может
      // захватывать сразу две пары.
      for (var pb = 0; pb + 1 < h.bounds.length; pb++){
        parts.push({ idx: makeHayIndex(h.str.slice(h.bounds[pb], h.bounds[pb + 1])), label: "интерливинг пары №" + (pb + 1) + tagSuffix });
      }
    }
  }
  // Индексы кусков посчитаны выше по одному разу — цикл по паттернам их только опрашивает.
  var pats = onlyPats || searchPatternsList();
  for (var pi = 0; pi < pats.length; pi++){
    if (!pats[pi]) continue;
    var v = patVariants(pats[pi]);
    for (var qi = 0; qi < parts.length; qi++){
      var fd = hayFindPattern(parts[qi].idx, v);
      if (fd) {
        return { needle: pats[pi], desc: parts[qi].label + note +
            ", " + fd.kind + ", поворот " + fd.rot + " из " + fd.total + ", совпало \"" + fd.pat + "\"" };
      }
    }
  }
  return null;
}
// «🔒 Строго» активно только когда есть сами паттерны — иначе номеров, по которым резать, нет.
function strictModeOn(){ return patStrictOn() && patternsActive(); }
function belowRowMatchDetail(){
  var strict = strictModeOn();
  if (rowsModeActive) {
    var rowI = belowRowBits();
    if (!rowI) return null;
    // Захват никогда не ждёт ответа на «куда лепить добор»: нерешённые пары в стоге всегда
    // считаются «право» (см. aboveRowsInterleavedHaystacks/ilEffectiveSide). «?» + ещё не решённая
    // самая новая пара дают ДВА варианта стога (право и лево для сравнения) — оба проверяются.
    if (strict) {
      // Каждый паттерн — со СВОИМ стогом: только строки с номерами строго меньше его номера.
      // Стог при этом собирается ОДИН раз, а «свой» получается обрезкой готового по границам
      // кусков (кусок №pb склеен из строк pb+1 и pb+2, значит паттерну №N доступны первые N-2
      // куска) — раньше здесь был полный пересбор стога на каждый паттерн, и на 70 паттернах
      // это и вешало вкладку. Исключение — allow==1: там стог не парный, а «одна строка», его
      // приходится просить отдельно.
      var prs = openPatternRows();
      var hsFull = null;
      for (var si = 0; si < prs.length; si++){
        var allow = prs[si].lineNo - 1; // сколько первых строк данных доступно этому паттерну
        if (allow <= 0) continue;       // выше первой строки данных ничего нет
        var hsS;
        if (allow === 1) hsS = aboveRowsInterleavedHaystacks(1);
        else {
          if (!hsFull) hsFull = aboveRowsInterleavedHaystacks();
          hsS = prefixHaystacks(hsFull, allow - 1);
        }
        var rS = ilSearchInHaystacks(hsS, [prs[si].text], " [строго, паттерн №" + prs[si].lineNo + "]");
        if (rS) return rS;
      }
      return null;
    }
    return ilSearchInHaystacks(aboveRowsInterleavedHaystacks(), null, "");
  }
  var lz = belowRowFoundLaser();
  var fdL = lz ? null : belowRowFoundInDetail(throughLasersHaystack());
  // Сборка лазеров (панель результатов, выбранный пользователем вариант) — то же, что подсвечено
  // ему на холсте/в панели, проверяем ДО сквозной склейки строк данных. Считается ЗАНОВО из G.list
  // (computeAssemblyHaystackFresh), а не берётся из lastAssemblyHaystack — та обновляется только
  // внутри draw() и была бы устаревшей, если draw() в этом такте не вызывался (см. «Без отрисовки
  // при Плее»). Так проверка полная и надёжная всегда, независимо от того, рисуется холст или нет.
  var fdA = (lz || fdL) ? null : belowRowFoundInDetail(computeAssemblyHaystackFresh());
  // Сквозная склейка строк ДАННЫХ — единственный уровень с номерами строк, поэтому «Строго»
  // режет именно её (у лазеров номеров строк нет, там ограничивать нечего).
  var fdR = null, fdRNo = 0;
  if (!lz && !fdL && !fdA) {
    if (strict) {
      var prsR = openPatternRows();
      for (var ri = 0; ri < prsR.length && !fdR; ri++){
        if (prsR[ri].lineNo <= 1) continue;
        fdR = belowRowFoundInDetail(throughRowsHaystack(prsR[ri].lineNo - 1), [prsR[ri].text]);
        if (fdR) fdRNo = prsR[ri].lineNo;
      }
    } else {
      fdR = belowRowFoundInDetail(throughRowsHaystack());
    }
  }
  if (!lz && !fdL && !fdA && !fdR) return null;
  var desc = lz ? ("лазер «" + lz.axisLabel + " №" + lz.index + "», " + lz.kind + ", поворот " + lz.rot + " из " + lz.total + ", совпало \"" + lz.pat + "\"")
      : fdL ? ("сквозной по нескольким лазерам, " + fdL.kind + ", поворот " + fdL.rot + " из " + fdL.total + ", совпало \"" + fdL.pat + "\"")
      : fdA ? ("сборка лазеров, " + fdA.kind + ", поворот " + fdA.rot + " из " + fdA.total + ", совпало \"" + fdA.pat + "\"")
      : ("сквозной по строкам данных" + (fdRNo ? " [строго, паттерн №" + fdRNo + "]" : "") + ", " + fdR.kind + ", поворот " + fdR.rot + " из " + fdR.total + ", совпало \"" + fdR.pat + "\"");
  return { needle: (lz || fdL || fdA || fdR).needle, desc: desc };
}
// Режим B (кнопка «По лазерам»): непрерывно, пока строка под границей находится (любым из четырёх
// уровней проверки, ВСЕГДА полностью — см. belowRowMatchDetail/computeAssemblyHaystackFresh).
// Чекбокс «⚡ Быстрый поиск» влияет ТОЛЬКО на перерисовку, не на корректность поиска: выключен
// (по умолчанию) — полный rebuild()/draw() на каждом шаге, как раньше; включён — полную
// перерисовку делаем один раз в конце (см. fastModelRecompute), быстрее на длинных поисках.
function captureBelowThroughLasers(){
  if (lineLimit < 0) return false;
  var fastEl = $("fastCaptureSearch");
  var fast = !!(fastEl && fastEl.checked);
  var guard = 0, total = src.value.split("\n").length, changed = false;
  while (guard++ < total){
    var row = belowRowBits();
    if (!row) break;
    var m = belowRowMatchDetail(); // всегда полная проверка (см. computeAssemblyHaystackFresh) — «fast» теперь влияет только на перерисовку, не на поиск
    if (!m) break;
    console.log("[Kubits] Строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втянута в рамку");
    markPatternClosedByNeedle(m.needle);
    lineLimit++;
    changed = true;
    if (fast) { setCaptureProgress(guard, total); fastModelRecompute(); }
    else rebuild();
  }
  if (fast) { clearCaptureProgress(); if (changed) rebuild(); }
  return changed;
}
// Кнопка «▶ Шаг»: та же проверка, но только ОДИН шаг — без непрерывного повтора.
function captureBelowStepOnce(){
  if (lineLimit < 0) return false;
  var row = belowRowBits();
  if (!row) return false;
  var m = belowRowMatchDetail();
  if (!m) return false;

  markPatternClosedByNeedle(m.needle);
  lineLimit++;
  rebuild();
  return true;
}

// Ряд «Стог: А/Б, Добор →/←» и подсказка «?» относятся только к интерливингу «По строкам» —

// Ключ (индекс самой новой пары строк над границей, или "single" — когда над границей всего
// одна строка) для подсказки «?»: null, если сейчас нечего решать (не «По строкам», нет строк
// над границей и т.п.).
function currentAskKey(){
    if (!rowsModeActive) return null;
    var lines = src.value.split("\n");
    var lim = (lineLimit < 0) ? lines.length : Math.min(lineLimit, lines.length);
    if (lim <= 0) return null;
    return (lim === 1) ? "single" : (lim - 2);
}

// Кнопка «Инверсия»: 1) выделены и рамка/строка(и), и лазер(ы) → инвертирует только
// пересечение (клетки, которые попадают и в рамку/строку, и под лучом хотя бы одного лазера);
// 2) есть только рамка-выделение/строка(и) → инвертирует биты в ней (объединение всех строк,
// если их несколько); 3) есть только активный лазер(ы) → инвертирует только клетки под ними
// (объединение, если лазеров несколько); 4) иначе (совсем ничего не выбрано) → инвертирует
// все биты текущей модели (что видно, строки за границей lineLimit не трогает). Дедуп по
// (li,ci): Добор/повтор могут ссылаться на один и тот же исходный бит несколькими клетками
// кольца — без дедупа такой бит инвертировался бы дважды подряд и в итоге оставался как был.
function invertParticipatingBits(){
    if (!G || !G.list) return;
    var hasLaser = lastSkeweredElements && lastSkeweredElements.size;
    var idxSet;
    if (lastHasSelection && hasLaser) {
        idxSet = new Set();
        lastFrameElements.forEach(function(i){ if (lastSkeweredElements.has(i)) idxSet.add(i); });
    } else if (lastHasSelection) {
        idxSet = lastFrameElements;
    } else if (hasLaser) {
        idxSet = lastSkeweredElements;
    } else {
        idxSet = new Set();
        for (var gi = 0; gi < G.list.length; gi++) if (G.list[gi]) idxSet.add(gi);
    }
    if (!idxSet || !idxSet.size) return;

    var lines = src.value.split("\n");
    var seen = new Set();
    var changed = false;
    idxSet.forEach(function(i){
        var c = G.list[i];
        if (!c) return;
        // Рамка на холсте: добор-клетки пропускаем — их cIdx алиасит РЕАЛЬНЫЙ бит, который живёт
        // в другой клетке (обычно вне рамки), и его инверсия меняла бы картинку за пределами рамки.
        // Инвертируем только реальные клетки, попавшие в рамку; их серые добор-копии обновятся сами.
        if (selActive && c[4]) return;
        var li = c[5], ci = c[6];
        if (li === undefined || ci === undefined || ci < 0 || li < 0 || li >= lines.length) return;
        var key = li + "," + ci;
        if (seen.has(key)) return;
        seen.add(key);
        var line = lines[li];
        if (ci >= line.length) return;
        var ch = line[ci];
        if (ch === '0') lines[li] = line.slice(0, ci) + '1' + line.slice(ci + 1);
        else if (ch === '1') lines[li] = line.slice(0, ci) + '0' + line.slice(ci + 1);
        else return;
        changed = true;
    });
    if (changed) {
        src.value = lines.join("\n");
        rebuild();
    }
}

/* === МАРКЕР 15.15: ОБЩАЯ ОБВЯЗКА «▶ ПЛЕЙ» ДЛЯ ВСЕХ АВТОАНИМАЦИЙ ===
   Кнопка-подсветка/текст, таймер start/stop, слайдер скорости перезапускает таймер на лету —
   одна и та же механика для 6 плееров (Сдвиг символов+Визуальный сдвиг, Флип, Поворот, Этажи,
   Змейка), раньше скопированная в каждый по отдельности. Что крутить на тике и с каким периодом —
   решает сам плеер (tick/computeTiming), особый «сброс» — тоже свой (onStop). Имена существующих
   глобальных переменных/функций (rotAnimOn, stopFloorAnim и т.п.) не меняются — на них завязан код
   в других местах файла; get/set просто читают/пишут те же переменные. */
// «Сначала выбрать всё, что уже видно, и только потом двигать Плей».
// На каждом такте ЛЮБОГО «▶ Плей» сперва смотрим, не находится ли прямо сейчас — в состоянии,
// до которого довёл предыдущий шаг, — ещё не закрытый паттерн. Если находится: помечаем его
// закрытым и втягиваем строку, а сам Плей на этом такте НЕ двигаем. Данные не должны уехать,
// пока в них ещё есть что забрать: раньше такт делал сдвиг И захват разом, и уже видимое
// совпадение засчитывалось уже по СДВИНУТЫМ данным (а в режиме «🚫 Без отрисовки при Плее»,
// где за такт брался ровно один захват, второе видимое совпадение и вовсе успевало уехать).
// Когда забирать нечего — такт целиком уходит плееру, как и раньше.
function capturePendingBeforePlayTick(){
    var acb = $("autoCaptureBelow");
    if (!acb || !acb.checked || lineLimit < 0) return false;
    var row = belowRowBits();
    if (!row) return false; // втягивать нечего — плей идёт дальше
    var m = belowRowMatchDetail();
    if (!m) return false;
    console.log("[Kubits] Плей пропускает такт: строка №" + (lineLimit + 1) + " \"" + row + "\" найдена → " + m.desc + " → втянута в рамку");
    markPatternClosedByNeedle(m.needle);
    lineLimit++;
    rebuild();
    return true;
}
function makePlayer(opts){
    function timing(){
        if (opts.computeTiming) return opts.computeTiming();
        var ms = parseFloat(opts.speedEl.value) * (opts.speedScale || 400);
        if (opts.minPeriodMs) ms = Math.max(opts.minPeriodMs, ms);
        return { periodMs: ms, tick: opts.tick };
    }
    function start(){
        opts.setOn(true);
        if (opts.btn) { opts.btn.classList.add("active-view"); opts.btn.textContent = i18n[currentLang].btnFlipAnimStop; }
        if (opts.getTimer()) clearInterval(opts.getTimer());
        var tm = timing();
        opts.setTimer(setInterval(function(){
            if (capturePendingBeforePlayTick()) return; // такт ушёл на захват — анимацию не двигаем
            tm.tick();
        }, tm.periodMs));
    }
    function stop(reset){
        var wasOn = opts.getOn(); // до сброса: рисовать финальный кадр только если плеер РЕАЛЬНО играл
        if (opts.getTimer()) { clearInterval(opts.getTimer()); opts.setTimer(null); }
        opts.setOn(false);
        if (opts.btn) { opts.btn.classList.remove("active-view"); opts.btn.textContent = i18n[currentLang].btnFlipAnimPlay; }
        if (opts.onStop) opts.onStop(reset);
        // На случай, если во время Плея холст не рисовался (см. «🚫 Без отрисовки при Плее») —
        // финальный кадр синхронизируется при остановке. ТОЛЬКО если плеер играл: stop() дёргают
        // и защитно (syncSelUI → stopRotAnim на каждом такте чужого Плея!) — безусловный draw()
        // здесь ломал всё подавление, рисуя холст каждый такт (баг v0.244–0.248).
        if (wasOn) draw();
    }
    if (opts.btn) opts.btn.addEventListener("click", function(){ opts.getOn() ? stop(false) : start(); });
    if (opts.resetBtn) opts.resetBtn.addEventListener("click", function(){ stop(true); });
    if (opts.speedEl) {
        opts.speedEl.addEventListener("input", function(){ if (opts.getOn()) start(); });
        if (opts.fastZone != null) markFastZone(opts.speedEl, opts.fastZone);
    }
    return { start: start, stop: stop };
}

// === Итеративное XOR-наложение ===
// Первый клик: поле = биты модели ⊕ их зеркало/поворот (1⊕1=0, 1⊕0=1).
// Каждый следующий клик: то же наложение применяется к УЖЕ полученному результату.
function xorWorldPos(c){
    var a=aC(c), b=c[1], k=c[2];
    if (G.kind === "iso") return [(a-b)*u, (a+b+1)*v-(k+1)*hh];
    if (G.kind === "top") return [a*TS+TS/2, b*TS+TS/2];
    return [rhX(c), -k*DD/2];
}
function xorApplyStep(kind){
    if (!G || !G.list.length) return false;
    // Всегда берём ТЕКУЩИЕ реальные значения — XOR по-настоящему записывает 0/1 в модель,
    // поэтому лазеры, баланс и все подсчёты пересчитываются сами
    var cur = G.list.map(function(c){ return c[3] === 1 ? 1 : 0; });
    var posMap = {};
    var pts = [];
    for (var i=0; i<G.list.length; i++) {
        var p = xorWorldPos(G.list[i]);
        pts.push(p);
        posMap[Math.round(p[0]) + "_" + Math.round(p[1])] = i;
    }
    var lookup = function(x, y){
        var kx = Math.round(x), ky = Math.round(y);
        for (var ox=-2; ox<=2; ox++) for (var oy=-2; oy<=2; oy++) {
            var idx = posMap[(kx+ox) + "_" + (ky+oy)];
            if (idx !== undefined) return idx;
        }
        return -1;
    };
    var useX = flipMatchX || flipX, useY = flipMatchY || flipY;
    if (!useX && !useY) useX = true; // ось не выбрана — по умолчанию лево/право
    var stepDeg = (typeof getRotStepDeg === "function" ? getRotStepDeg() : 90);
    var rad = stepDeg * Math.PI / 180, cosR = Math.cos(rad), sinR = Math.sin(rad);
    var next = new Array(G.list.length);
    for (var i2=0; i2<G.list.length; i2++) {
        var p2 = pts[i2], j;
        if (kind === 'flip') {
            j = lookup(useX ? (2*G.cx - p2[0]) : p2[0], useY ? (2*G.cy - p2[1]) : p2[1]);
        } else {
            var dx = p2[0]-G.cx, dy = p2[1]-G.cy;
            j = lookup(dx*cosR - dy*sinR + G.cx, dx*sinR + dy*cosR + G.cy);
        }
        var other = (j === -1) ? 0 : cur[j];
        next[i2] = cur[i2] ^ other;
    }
    // Записываем результат в саму модель: 1⊕1 реально становится нулём
    for (var wi=0; wi<G.list.length; wi++) G.list[wi][3] = next[wi];
    if (kind === 'flip') { flipXorState = next; flipXorIter++; }
    else { rotXorState = next; rotXorIter++; }
    return true;
}

        lineLimitTop = srcClearBackup.lineLimitTop;
        srcClearBackup = null;

        // (или шаблон, если кеша нет) вместе с ИХ границами (или дефолтными, если кеша нет).
        srcClearBackup = { src: src.value, lineLimit: lineLimit, lineLimitTop: lineLimitTop };

    // общий сброс всегда начинает с одного и того же состояния.

// «🔺 Генерировать Серпинского»: N строк треугольника Паскаля mod 2 (классический фрактал
// Серпинского) — строка 0 = "1", строка i+1 получается из строки i по тождеству Паскаля mod 2
// (XOR соседних бит), края строки всегда "1". Строка i имеет i+1 бит.
function generateSierpinskiRows(n){
    var rows = [];
    var prev = [1];
    rows.push(prev.join(""));
    for (var i = 1; i < n; i++){
        var cur = new Array(i + 1);
        cur[0] = 1; cur[i] = 1;
        for (var j = 1; j < i; j++) cur[j] = prev[j - 1] ^ prev[j];
        rows.push(cur.join(""));
        prev = cur;
    }
    return rows;
}

    src.value = generateSierpinskiRows(n).join("\n");

// Строки берём напрямую из редактора
function getSquareTestRows(){
    var lines = src.value.split('\n');
    var rows = [];
    for (var i=0; i<lines.length; i++) {

        if (t.length > 0) rows.push({ text: t, absL: i });

}

// Занятые клетки сетки: мировая позиция куба -> целочисленная клетка (центр = 0,0)
function squaresOccupied(){
    var cellPx = SQUARE_TEST_CELL;
    var occ = {};
    for (var i = 0; i < squareTestCells.length; i++) {
        var c = squareTestCells[i];
        occ[Math.round((c.x + cellPx/2) / cellPx) + "," + Math.round((c.y + cellPx/2) / cellPx)] = true;
    }
    return occ;
}

// Первые n СВОБОДНЫХ клеток при обходе колец от центра наружу
// (порядок пути тот же, что у построения кольца: верх слева направо, право, низ, лево)
function squaresFreeCells(n){
    var occ = squaresOccupied();
    var out = [];
    for (var k = 0; out.length < n && k < 1000; k++) {
        var ring = [];
        if (k === 0) ring.push([0, 0]);
        else {
            var side = 2 * k + 1;
            for (var x = 0; x < side; x++) ring.push([x - k, -k]);
            for (var y = 1; y < side; y++) ring.push([k, y - k]);
            for (var x2 = side - 2; x2 >= 0; x2--) ring.push([x2 - k, k]);
            for (var y2 = side - 2; y2 >= 1; y2--) ring.push([-k, y2 - k]);
        }
        for (var t = 0; t < ring.length && out.length < n; t++) {
            if (!occ[ring[t][0] + "," + ring[t][1]]) out.push(ring[t]);
        }
    }
    return out;
}

function squareTestAddRow(rowIdx1){
    var rows = getSquareTestRows();
    var row = rows[rowIdx1 - 1];
    var text = row ? row.text : "";
    var absL = row ? row.absL : -1;
    var L = text.length;
    if (L === 0) return;

    var k = rowIdx1 - 1;
    var col = pc(k);
    var cellPx = SQUARE_TEST_CELL;
    var doLoop = loopBits.checked;
    var doInvert = doLoop && loopBitsInvert && loopBitsInvert.checked;
    var doDynamic = doLoop && loopDynamic && loopDynamic.checked;

    var mid = Math.floor((L - 1) / 2);

    // Значения кубов этажа — как раньше: углы = 0-добор, строка идёт от верхнего центра
    var vals = [];
    if (k === 0) {
        vals.push((text[0] === '1') ? 1 : 0);
    } else {
        var side = 2 * k + 1;
        var coords = [];
        for (var x = 0; x < side; x++) coords.push([x, 0]);
        for (var y = 1; y < side; y++) coords.push([side - 1, y]);
        for (var x2 = side - 2; x2 >= 0; x2--) coords.push([x2, side - 1]);
        for (var y2 = side - 2; y2 >= 1; y2--) coords.push([0, y2]);

        var cap = coords.length - 4;
        var topCenter = k - 1;
        var startSlot = ((topCenter - mid) % cap + cap) % cap;

        // Хвост добора — та же getPadStr/frozenPad система, что и в обычных «Квадратах» (parse()),
        // так «Добор Динам.»/«Инверс.» одинаково работают что в обычном показе, что в «✋ Правке».
        var padStr = "";
        if (doLoop && cap > L) {
            padStr = getPadStr(absL, cap, L, doInvert, doDynamic, function(idx){ return text[idx]; });
        }

        var tCount = 0;
        for (var t = 0; t < coords.length; t++) {
            var cx = coords[t][0], cy = coords[t][1];
            var isCorner = (cx === 0 || cx === side - 1) && (cy === 0 || cy === side - 1);
            var val = 0;
            if (!isCorner) {
                var q = (tCount - startSlot + cap) % cap;
                if (doLoop) {
                    val = (q < L) ? ((text[q] === '1') ? 1 : 0) : ((padStr[q - L] === '1') ? 1 : 0);
                } else if (q < L) {
                    val = (text[q] === '1') ? 1 : 0;
                }
                tCount++;
            }
            vals.push(val);
        }
    }

    // Полуавтомат: кубы кладутся на свободные клетки от центра наружу.
    // Если между шагами что-то освободили руками — новые кубы сначала займут это место.
    var free = squaresFreeCells(vals.length);
    for (var fi = 0; fi < free.length; fi++) {
        squareTestCells.push({
            x: free[fi][0] * cellPx - cellPx/2,
            y: free[fi][1] * cellPx - cellPx/2,
            val: vals[fi], col: col
        });
    }
}

function squaresAutoFit(){
    var rows = getSquareTestRows();
    var side = Math.max(1, 2 * rows.length - 1) * SQUARE_TEST_CELL;
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) { zoom = 1; panX = 0; panY = 0; return; }
    zoom = Math.max(0.05, Math.min(3, Math.min(w, h) * 0.86 / side));
    panX = w / 2; panY = h / 2;
}

function squaresRebuildAll(){
    squareTestCells = [];
    squareTestNextRow = 1;
    squareTestDrag = null;
    var rows = getSquareTestRows();
    while (squareTestNextRow <= rows.length) {
        squareTestAddRow(squareTestNextRow);
        squareTestNextRow++;
    }
    squareTestNextLabel.textContent = squareTestNextRow;
    squaresAutoFit();
}

function squareTestNext(){
    var rows = getSquareTestRows();
    if (squareTestNextRow > rows.length) return;
    squareTestAddRow(squareTestNextRow);
    squareTestNextRow++;
    squareTestNextLabel.textContent = squareTestNextRow;
    requestDraw();
}

function squareTestBuildAll(){
    var rows = getSquareTestRows();
    while (squareTestNextRow <= rows.length) {
        squareTestAddRow(squareTestNextRow);

function findSquareTestCellAt(wx, wy){
    var cellPx = SQUARE_TEST_CELL;
    for (var i = squareTestCells.length - 1; i >= 0; i--) {
        var c = squareTestCells[i];
        if (wx >= c.x && wx <= c.x + cellPx && wy >= c.y && wy <= c.y + cellPx) return i;
    }
    return -1;
}

function drawSquareTestFrame(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w === 0 || h === 0) return;
    if (cv.width !== Math.floor(w * dpr) || cv.height !== Math.floor(h * dpr)) {
        cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var isDark = (document.documentElement.dataset.theme === "dark");
    var emptyFill = isDark ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.04)";
    var muted = isDark ? "#93A69F" : "#6E6D66";

    if (!squareTestCells.length) {
        ctx.fillStyle = muted;
        ctx.font = "13px 'Roboto Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText((currentLang === 'ru' ? "Пустой редактор: добавьте строки — или стройте по этажам кнопкой «▶ Этаж»" : "Editor is empty: add strings — or build floor by floor with “▶ Floor”"), w / 2, h / 2);
        return;
    }

    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    var cellPx = SQUARE_TEST_CELL;
    squareTestCells.forEach(function(c){
        ctx.fillStyle = c.val ? c.col[1] : emptyFill;
        ctx.fillRect(c.x + 1, c.y + 1, cellPx - 2, cellPx - 2);
        ctx.strokeStyle = c.col[2];
        ctx.lineWidth = 1 / zoom;
        ctx.strokeRect(c.x + 0.5, c.y + 0.5, cellPx - 1, cellPx - 1);
    });

    // Баланс 1 и 0 — показываем всегда, как в основных режимах
    var n1 = 0, n0 = 0;
    squareTestCells.forEach(function(c){ if (c.val) n1++; else n0++; });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var eqB = (n1 === n0 && n1 > 0);
    var textColB = isDark ? "#FFFFFF" : "#111111";
    ctx.font = "bold 58px 'Roboto Mono', monospace";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    if (eqB) { ctx.shadowBlur = 25; ctx.shadowColor = isDark ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.6)"; }
    ctx.fillStyle = eqB ? textColB : "#F39C12";
    ctx.fillText(String(n1), 24, h - 70);
    ctx.fillStyle = eqB ? textColB : "#E74C3C";
    var m0B = String(n0);
    ctx.fillText(m0B, w - 24 - ctx.measureText(m0B).width, h - 70);
    ctx.shadowBlur = 0;
}

/* === МАРКЕР 16: СОБЫТИЯ ХОЛСТА (ЗУМ/ПАН/КЛИК), СКРЫТИЕ/РЕСАЙЗ ПАНЕЛЕЙ, ESCAPE, ИНИЦИАЛИЗАЦИЯ === */
cv.addEventListener("wheel", function(e){
  if (isSquaresMode() && squareEditMode) {
    e.preventDefault();
    var rq = cv.getBoundingClientRect();
    var mxq = e.clientX - rq.left, myq = e.clientY - rq.top;
    var zoomSpeedQ = 0.15;
    var newScale = zoom * ((e.deltaY < 0) ? (1 + zoomSpeedQ) : 1 / (1 + zoomSpeedQ));
    newScale = Math.max(0.05, Math.min(50, newScale));
    var ratioQ = newScale / zoom;
    panX = mxq - (mxq - panX) * ratioQ;
    panY = myq - (myq - panY) * ratioQ;
    zoom = newScale;
    requestDraw();
    return;
  }
  if (!G) return;
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  var mx = e.clientX - r.left, my = e.clientY - r.top;
  var w = screenToWorld(mx, my);
  var zoomSpeed = 0.15;
  if (e.deltaY < 0) zoom *= (1 + zoomSpeed); else zoom /= (1 + zoomSpeed);
  if (zoom < 0.05) zoom = 0.05; if (zoom > 50) zoom = 50;
  var off = worldOffsetToScreen(w.wx, w.wy);
  panX = mx - off.dx; panY = my - off.dy;
  requestDraw();
}, {passive: false});

cv.addEventListener("mousedown", function(e){
  if (isSquaresMode() && squareEditMode) {
    if (e.button !== 0 && e.button !== 1) return;
    var rq = cv.getBoundingClientRect();
    var qx = e.clientX - rq.left, qy = e.clientY - rq.top;
    if (e.button === 0) {
      var qwx = (qx - panX) / zoom, qwy = (qy - panY) / zoom;
      var idx = findSquareTestCellAt(qwx, qwy);
      if (idx !== -1) {
        var c0 = squareTestCells[idx];
        squareTestDrag = { idx: idx, offX: qwx - c0.x, offY: qwy - c0.y };
        return;
      }
    }
    isDragging = true;
    dragStartX = e.clientX - panX; dragStartY = e.clientY - panY;
    clickDragDist = 0; dragLastX = e.clientX; dragLastY = e.clientY;
    return;
  }
  if (!G) return;
  var r = cv.getBoundingClientRect();
  if (e.button === 2) {
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var scx = panX + selOffX * zoom, scy = panY + selOffY * zoom;
    var selPx = selRadius * zoom;
    // Готовая рамка: захват у ГРАНИЦЫ (±EDGE_TOL px по метрике рамки) — растяжение от её центра,
    // захват глубже внутри — перемещение, снаружи — рисование новой рамки (как раньше).
    var insideSel = false;
    if (selActive && selPx > 0) {
      var edgeNorm = selFrameRadius(mx - scx, my - scy); // «радиус» точки в метрике формы рамки, px
      var EDGE_TOL = 14;
      if (Math.abs(edgeNorm - selPx) <= EDGE_TOL) {
        isResizingSel = true;
      } else if (edgeNorm < selPx) {
        insideSel = true;
      }
    }
    if (isResizingSel) {
      // центр (selOffX/Y) не трогаем — тянется только полудиагональ
    } else if (insideSel) {
      isMovingSel = true;
      selMoveStart = { mx: mx, my: my, offX: selOffX, offY: selOffY };
    } else {
      isSelecting = true; selActive = true;
      selOffX = 0; selOffY = 0;
      selRadius = selFrameRadius(mx - panX, my - panY) / zoom;
    }
    draw();
  } else if (e.button === 0 || e.button === 1) {
    isDragging = true;
    dragStartX = e.clientX - panX; dragStartY = e.clientY - panY;
    clickDragDist = 0; dragLastX = e.clientX; dragLastY = e.clientY;
  }
});

window.addEventListener("mousemove", function(e){
  if (isSquaresMode() && squareEditMode) {
    if (squareTestDrag) {
      var rq2 = cv.getBoundingClientRect();
      var qx2 = e.clientX - rq2.left, qy2 = e.clientY - rq2.top;
      var c2 = squareTestCells[squareTestDrag.idx];
      c2.x = (qx2 - panX) / zoom - squareTestDrag.offX;
      c2.y = (qy2 - panY) / zoom - squareTestDrag.offY;
      requestDraw();
    } else if (isDragging) {
      panX = e.clientX - dragStartX; panY = e.clientY - dragStartY;
      clickDragDist += Math.abs(e.clientX - dragLastX) + Math.abs(e.clientY - dragLastY);
      dragLastX = e.clientX; dragLastY = e.clientY;
      requestDraw();
    }
    return;
  }
  var r = cv.getBoundingClientRect();
  mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
  if (isResizingSel) {
    // Растяжение за границу: радиус — расстояние от ЦЕНТРА РАМКИ (с учётом её смещения selOffX/Y)
    selRadius = selFrameRadius(e.clientX - r.left - (panX + selOffX * zoom),
                               e.clientY - r.top  - (panY + selOffY * zoom)) / zoom;
    requestDraw();
  } else if (isMovingSel && selMoveStart) {
    selOffX = selMoveStart.offX + (e.clientX - r.left - selMoveStart.mx) / zoom;
    selOffY = selMoveStart.offY + (e.clientY - r.top - selMoveStart.my) / zoom;
    requestDraw();
  } else if (isSelecting) {
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    selRadius = selFrameRadius(mx - panX, my - panY) / zoom;
    requestDraw();
  } else if (isDragging) {
    panX = e.clientX - dragStartX; panY = e.clientY - dragStartY;
    clickDragDist += Math.abs(e.clientX - dragLastX) + Math.abs(e.clientY - dragLastY);
    dragLastX = e.clientX; dragLastY = e.clientY;
    requestDraw();
  } else if (skewerMode.checked && laserModeOk() && !suppressDrawDuringPlayActive()) requestDraw();
});

window.addEventListener("mouseup", function(e){
  if (isSquaresMode() && squareEditMode) {
    if (squareTestDrag) {
      // Прилипание к сетке при отпускании — чтобы следующий шаг видел клетку занятой/свободной
      var cUp = squareTestCells[squareTestDrag.idx];
      var cellPxUp = SQUARE_TEST_CELL;
      cUp.x = Math.round((cUp.x + cellPxUp/2) / cellPxUp) * cellPxUp - cellPxUp/2;
      cUp.y = Math.round((cUp.y + cellPxUp/2) / cellPxUp) * cellPxUp - cellPxUp/2;
      requestDraw();
    }
    squareTestDrag = null; isDragging = false; return;
  }
  if (isResizingSel) { isResizingSel = false; if (selRadius * zoom < 5) { selActive = false; draw(); } return; }
  if (isMovingSel) { isMovingSel = false; selMoveStart = null; return; }
  if (isSelecting) { isSelecting = false; if (selRadius * zoom < 5) { selActive = false; draw(); } }
  else if (isDragging) isDragging = false;
});

cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

// === ТАЧ-УПРАВЛЕНИЕ (мобильные/планшеты): один палец = мышь (пан/перетаскивание/тап-клик),
// два пальца = пинч-зум. Тач-события транслируются в обычные мышиные, вся логика общая.
var touchPinchDist = null, touchTapStart = null;
function touchMouse(type, t){
    cv.dispatchEvent(new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window,

    }));

/* === МАРКЕР 22: ТАЧПАД-КУРСОР (как в AnyDesk) ===
   Палец двигает виртуальный курсор ОТНОСИТЕЛЬНО (а не абсолютно), тап = левый клик,
   двойной тап с удержанием = перетаскивание (пан/выделение/перенос куба),
   два пальца = пинч-зум. Включается кнопкой 🖱 (видна только на узком экране). */
var btnPad = $("btnPad"), padCursorEl = $("padCursor");
var padMode = false;
var padCursor = { x: 0, y: 0 };   // координаты виртуального курсора (clientX/clientY)
var padLastTouch = null;          // предыдущая позиция пальца — для относительного сдвига
var padTouchStart = null;         // позиция пальца в начале касания — для распознавания тапа
var padMoved = false;             // был ли заметный сдвиг за текущее касание (тап vs. движение)
var PAD_TAP_TOL = 12;             // допуск дрожания пальца, при котором касание всё ещё считается тапом
var padDragging = false;          // идёт перетаскивание (левая кнопка удержана)
var padLastTapTime = 0;           // время предыдущего тапа — для распознавания двойного
var PAD_SENS = 1.4;               // ускорение перемещения курсора относительно пальца
var padTwoFingerInfo = null;      // {dist0, moved} — идёт гест двумя пальцами; если палец не
                                   // двигали (не зумили) и оба подняли — это ПРАВЫЙ клик (как
                                   // тап двумя пальцами на трекпаде), см. touchend.
var PAD_PINCH_MOVE_TOL = 10;      // на сколько px должно измениться расстояние между пальцами,
                                   // чтобы считать это зумом, а не тапом двумя пальцами

function padClampCursor(){
    var r = cv.getBoundingClientRect();
    padCursor.x = Math.max(r.left, Math.min(r.right, padCursor.x));
    padCursor.y = Math.max(r.top, Math.min(r.bottom, padCursor.y));
}
function padUpdateCursorEl(){
    if (!padCursorEl) return;
    var r = cv.getBoundingClientRect();
    padCursorEl.style.left = (padCursor.x - r.left) + "px";
    padCursorEl.style.top  = (padCursor.y - r.top) + "px";
}
// ВРЕМЕННО (диагностика): пишем сырые числа на холст, чтобы увидеть на телефоне, доходят ли
// touchmove до кода и что именно они считают — без этого пришлось бы гадать вслепую.
var padDebugEl = $("padDebug");
function padDebugLog(s){ if (padDebugEl) padDebugEl.textContent = s; }
function padMouse(type, buttons, button){
    cv.dispatchEvent(new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window,
        clientX: padCursor.x, clientY: padCursor.y, button: (button === undefined ? 0 : button), buttons: buttons
    }));
}
function setPadMode(on){
    padMode = on;
    document.body.classList.toggle("pad-mode", on);
    if (btnPad) btnPad.classList.toggle("active-view", on);
    if (on){
        var r = cv.getBoundingClientRect();
        if (padCursor.x < r.left || padCursor.x > r.right || padCursor.y < r.top || padCursor.y > r.bottom){
            padCursor.x = r.left + r.width / 2;
            padCursor.y = r.top + r.height / 2;
        }
        padUpdateCursorEl();
    } else {
        if (padDragging){ padMouse("mouseup", 0); }
        padDragging = false; padLastTouch = null;
        document.body.classList.remove("pad-dragging");
    }
}
if (btnPad) btnPad.addEventListener("click", function(){ setPadMode(!padMode); });
// Тач-устройство? Тогда кнопку 🖱 показываем и в широкой раскладке (телефон в «версии для ПК»)
if (("ontouchstart" in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0)) {
    document.body.classList.add("has-touch");
}
cv.addEventListener("touchstart", function(e){
    // В режиме тачпад-курсора весь жест обрабатывается на уровне .stage (см. ниже) — там же,
    // где и тулбары поверх холста, чтобы палец вёл курсор и с них, а не только с голого холста.
    if (padMode) return;
    e.preventDefault();
    if (e.touches.length === 1) {
        var t = e.touches[0];
        touchTapStart = { x: t.clientX, y: t.clientY, time: Date.now() };
        touchMouse("mousedown", t);
    } else if (e.touches.length === 2) {
        touchMouse("mouseup", e.touches[0]); // отменяем начатый пан — начинается пинч
        touchTapStart = null;
        var dx0 = e.touches[0].clientX - e.touches[1].clientX;
        var dy0 = e.touches[0].clientY - e.touches[1].clientY;
        touchPinchDist = Math.sqrt(dx0*dx0 + dy0*dy0);
    }
}, {passive: false});
cv.addEventListener("touchmove", function(e){
    if (padMode) return;
    e.preventDefault();
    if (e.touches.length === 1 && touchPinchDist === null) {
        touchMouse("mousemove", e.touches[0]);
    } else if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (touchPinchDist) {
            var r = cv.getBoundingClientRect();
            var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
            var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
            var factor = dist / touchPinchDist;
            var newZoom = Math.max(0.05, Math.min(50, zoom * factor));
            factor = newZoom / zoom;
            panX = mx - (mx - panX) * factor;
            panY = my - (my - panY) * factor;
            zoom = newZoom;
            requestDraw();
        }
        touchPinchDist = dist;
    }
}, {passive: false});
cv.addEventListener("touchend", function(e){
    if (padMode) return;
    e.preventDefault();
    if (e.touches.length === 0) {
        var tEnd = e.changedTouches[0];
        touchMouse("mouseup", tEnd);
        // короткое касание без сдвига = клик (лазерные узлы, выбор этажа и т.д.)
        if (touchTapStart && Math.abs(tEnd.clientX - touchTapStart.x) < 8 &&
            Math.abs(tEnd.clientY - touchTapStart.y) < 8 && Date.now() - touchTapStart.time < 500) {
            touchMouse("click", tEnd);
        }
        touchTapStart = null;
        touchPinchDist = null;
    } else if (e.touches.length === 1) {
        // один палец подняли с пинча — оставшийся продолжает пан
        touchPinchDist = null;
        touchTapStart = null;
        touchMouse("mousedown", e.touches[0]);
    }
}, {passive: false});
cv.addEventListener("touchcancel", function(e){
    if (padMode) return;
    touchPinchDist = null; touchTapStart = null;
    if (e.changedTouches.length) touchMouse("mouseup", e.changedTouches[0]);
}, {passive: false});

// === Тачпад-курсор — жест на уровне ВСЕЙ .stage (холст + тулбары поверх него), не только
// #cv: раньше слушатели висели только на канвасе, и палец, начавший движение над пустым
// местом тулбара (зеркало/поворот/⚙✎ и т.д. — визуально «панели» над холстом), вообще не
// двигал курсор — жест до кода не долетал. Теперь пузырится с любого дочернего элемента
// .stage. Настоящие элементы управления (кнопки/слайдеры/чекбоксы, включая саму кнопку 🖱)
// из этого исключены — им отдаётся целиком НЕТРОНУТЫЙ нативный жест (тап→клик, драг
// ползунка), а не только touchstart: раньше touchmove/touchend всё равно звали
// preventDefault() безусловно для ЛЮБОГО пальца в pad-режиме, что глушило и синтетический
// клик по кнопке (браузер не рождает click после preventDefault на touchend), и нативное
// перетаскивание ползунка (его двигает сам браузер по touchmove, а не наш JS) — от этого
// в pad-режиме не нажимались кнопки и не двигались слайдеры. Флаг фиксируется на touchstart
// и живёт до конца ИМЕННО этого касания (см. touchend/touchcancel), а не перевычисляется —
// e.target на move/end у тача и так остаётся тем же элементом, но так надёжнее и явнее.
// Двупальцевый жест (зум) всегда обрабатывается нами независимо от того, что под пальцами —
// иначе зум ломался, стоило хоть одному пальцу пинча попасть на кнопку тулбара.
function padTargetIsControl(t){ return !!(t && t.closest && t.closest("button,input,select,a,textarea")); }
var padTouchIsControl = false;
stage.addEventListener("touchstart", function(e){
    if (!padMode) return;
    if (e.touches.length >= 2) {
        e.preventDefault();
        padTouchIsControl = false;
        if (padDragging){ padMouse("mouseup", 0); padDragging = false; document.body.classList.remove("pad-dragging"); }
        padLastTouch = null; padMoved = false;
        var pdx0 = e.touches[0].clientX - e.touches[1].clientX;
        var pdy0 = e.touches[0].clientY - e.touches[1].clientY;
        touchPinchDist = Math.sqrt(pdx0*pdx0 + pdy0*pdy0);
        // Начало геста двумя пальцами: если палец так и не подвинут (не зумили) и оба
        // поднимутся — засчитаем это как ПРАВЫЙ клик по текущей позиции курсора (см. touchend).
        if (!padTwoFingerInfo) padTwoFingerInfo = { dist0: touchPinchDist, moved: false };
        return;
    }
    padTouchIsControl = padTargetIsControl(e.target);
    if (padTouchIsControl) return; // отдаём тап/драг настоящему элементу управления как есть
    e.preventDefault();
    var pt = e.touches[0];
    padLastTouch = { x: pt.clientX, y: pt.clientY };
    padTouchStart = { x: pt.clientX, y: pt.clientY };
    padMoved = false;
    padDebugLog("start x=" + pt.clientX.toFixed(0) + " y=" + pt.clientY.toFixed(0) + " touches=" + e.touches.length);
    if (Date.now() - padLastTapTime < 300) {
        // двойной тап с удержанием → перетаскивание от текущей позиции курсора
        padDragging = true;
        document.body.classList.add("pad-dragging");
        padMouse("mousedown", 1);
    }
}, {passive: false});
stage.addEventListener("touchmove", function(e){
    if (!padMode) return;
    if (e.touches.length >= 2) {
        e.preventDefault();
        var qdx = e.touches[0].clientX - e.touches[1].clientX;
        var qdy = e.touches[0].clientY - e.touches[1].clientY;
        var qdist = Math.sqrt(qdx*qdx + qdy*qdy);
        if (touchPinchDist) {
            var qr = cv.getBoundingClientRect();
            var qmx = (e.touches[0].clientX + e.touches[1].clientX)/2 - qr.left;
            var qmy = (e.touches[0].clientY + e.touches[1].clientY)/2 - qr.top;
            var qf = qdist / touchPinchDist;
            var qnz = Math.max(0.05, Math.min(50, zoom * qf));
            qf = qnz / zoom;
            panX = qmx - (qmx - panX) * qf;
            panY = qmy - (qmy - panY) * qf;
            zoom = qnz;
            requestDraw();
        }
        // Реально зумили (палец разошлись/сблизились заметно) — это не тап, правого клика не будет.
        if (padTwoFingerInfo && Math.abs(qdist - padTwoFingerInfo.dist0) > PAD_PINCH_MOVE_TOL) padTwoFingerInfo.moved = true;
        touchPinchDist = qdist;
        return;
    }
    if (padTouchIsControl) return; // палец изначально на кнопке/ползунке — не мешаем нативному драгу
    e.preventDefault();
    if (!padLastTouch) { padDebugLog("move: NET padLastTouch! touches=" + e.touches.length); return; }
    var mt = e.touches[0];
    var rawdx = mt.clientX - padLastTouch.x, rawdy = mt.clientY - padLastTouch.y;
    padDebugLog("move dx=" + rawdx.toFixed(1) + " dy=" + rawdy.toFixed(1) +
        " cur=" + padCursor.x.toFixed(0) + "," + padCursor.y.toFixed(0) +
        " rect=" + cv.getBoundingClientRect().left.toFixed(0) + "," + cv.getBoundingClientRect().top.toFixed(0));
    padLastTouch = { x: mt.clientX, y: mt.clientY };
    padCursor.x += rawdx * PAD_SENS;
    padCursor.y += rawdy * PAD_SENS;
    padClampCursor();
    padUpdateCursorEl();
    // тап vs. движение — по СУММАРНОМУ сдвигу пальца от старта, а не по дрожанию за кадр
    // (иначе неподвижный тап на сенсоре из-за дрожания в 1–2px не срабатывает как клик)
    if (padTouchStart && (Math.abs(mt.clientX - padTouchStart.x) > PAD_TAP_TOL ||
                          Math.abs(mt.clientY - padTouchStart.y) > PAD_TAP_TOL)) {
        padMoved = true;
        if (padTwoFingerInfo) padTwoFingerInfo.moved = true; // палец после снятия пары продолжил тащить — это не тап
    }
    padMouse("mousemove", padDragging ? 1 : 0);
}, {passive: false});
stage.addEventListener("touchend", function(e){
    if (!padMode) return;
    if (padTouchIsControl) {
        // Тач с самого начала шёл на кнопку/ползунок (см. touchstart) — не мешаем браузеру
        // родить нативный click/довести драг ползунка; preventDefault() здесь как раз и глушил
        // это (click после preventDefault на touchend не рождается вообще).
        if (e.touches.length === 0) padTouchIsControl = false;
        return;
    }
    e.preventDefault();
    if (e.touches.length === 0) {
        if (padTwoFingerInfo) {
            // Гест двумя пальцами закончился без реального зума — тап двумя пальцами =
            // ПРАВЫЙ клик по текущей позиции курсора (как на трекпаде ноутбука).
            if (!padTwoFingerInfo.moved) {
                padMouse("mousedown", 2, 2);
                padMouse("mouseup", 0, 2);
            }
            padTwoFingerInfo = null;
        } else if (padDragging) {
            padMouse("mouseup", 0);
            padDragging = false;
            document.body.classList.remove("pad-dragging");
        } else if (!padMoved) {
            // тап без сдвига = левый клик по позиции курсора
            padMouse("mousedown", 1);
            padMouse("mouseup", 0);
            padMouse("click", 0);
            padLastTapTime = Date.now();
        }
        padLastTouch = null; padTouchStart = null; touchPinchDist = null; padMoved = false;
    } else if (e.touches.length === 1) {
        // подняли один палец с пинча — оставшийся продолжает водить курсор (гест двумя
        // пальцами больше не может закончиться тапом — он уже точно не завершился сразу)
        touchPinchDist = null; padMoved = false; padTouchIsControl = false;
        padLastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        padTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
}, {passive: false});
stage.addEventListener("touchcancel", function(e){
    if (!padMode) return;
    padTouchIsControl = false;
    if (padDragging){ padMouse("mouseup", 0); padDragging = false; document.body.classList.remove("pad-dragging"); }
    padLastTouch = null; touchPinchDist = null; padMoved = false; padTwoFingerInfo = null;
}, {passive: false});

cv.addEventListener("click", function(e){
  if (isSquaresMode() && squareEditMode) return;
  if (!G) return;
  if (clickDragDist > 5) return;
  if (selActive) { selActive = false; selRadius = 0; selOffX = 0; selOffY = 0; draw(); syncSelUI(); return; }
  var r = cv.getBoundingClientRect();
  var mx = e.clientX - r.left, my = e.clientY - r.top;
  var wp = screenToWorld(mx, my);
  var wx = wp.wx, wy = wp.wy;

  if (skewerMode.checked && laserModeOk()) {
      var lctx = buildLaserNodes(), clickedNode = null, hitRadius = 12;
      var clkFixed = laserStationaryOK();
      var clkRot = currentRotRad(), clkCos = Math.cos(clkRot), clkSin = Math.sin(clkRot);

      // Кольца-переключатели целых осей (напротив середины ряда точек) — проверяем первыми
      var axisAnchors = computeAxisToggleAnchors(lctx);
      var clickedAxisKey = null, hitRadiusAT = 12;
      Object.keys(axisAnchors).forEach(function(key){
          var pos = axisAnchors[key];
          var sx, sy;
          if (clkFixed) {
              sx = panX + (pos.x - G.cx) * zoom; sy = panY + (pos.y - G.cy) * zoom;
          } else {
              var ndx = (flipX ? -1 : 1) * (pos.x - G.cx) * zoom, ndy = (flipY ? -1 : 1) * (pos.y - G.cy) * zoom;
              sx = panX + ndx * clkCos - ndy * clkSin; sy = panY + ndx * clkSin + ndy * clkCos;
          }
          var dist = Math.sqrt((mx - sx)*(mx - sx) + (my - sy)*(my - sy));
          if (dist < hitRadiusAT) { hitRadiusAT = dist; clickedAxisKey = key; }
      });
      if (clickedAxisKey) {
          var axisNodesC = lctx.groups[clickedAxisKey] || [];
          var allOnC = axisNodesC.length > 0 && axisNodesC.every(function(n){
              return skewers.some(function(sk){ return sk.type === clickedAxisKey && sk.d === n.d; });
          });
          if (allOnC) {
              removeAllLasersOfAxis(clickedAxisKey);
          } else {
              axisNodesC.forEach(function(n){
                  if (!skewers.some(function(sk){ return sk.type === clickedAxisKey && sk.d === n.d; })) {
                      skewers.push({ type: clickedAxisKey, d: n.d, color: laserColors[skewers.length % laserColors.length] });
                  }
              });
              laserVis[clickedAxisKey] = true;
          }
          draw(); syncSelUI();
          return;
      }

      lctx.nodes.forEach(function(node) {
          var sx, sy;
          if (clkFixed) {
              sx = panX + (node.pos.x - G.cx) * zoom; sy = panY + (node.pos.y - G.cy) * zoom;
          } else {
              var ndx = (flipX ? -1 : 1) * (node.pos.x - G.cx) * zoom, ndy = (flipY ? -1 : 1) * (node.pos.y - G.cy) * zoom;
              sx = panX + ndx * clkCos - ndy * clkSin; sy = panY + ndx * clkSin + ndy * clkCos;
          }
          var dist = Math.sqrt((mx - sx)*(mx - sx) + (my - sy)*(my - sy));
          if (dist < hitRadius) { hitRadius = dist; clickedNode = node; }
      });
      if (clickedNode) {
          var existsIdx = skewers.findIndex(function(s) { return s.type === clickedNode.type && s.d === clickedNode.d; });
          if (existsIdx >= 0) {
              skewers.splice(existsIdx, 1);
              // Убираем выделение снятого лазера и сдвигаем skIdx оставшихся выбранных вниз на 1
              // (индексы после existsIdx сместились из-за splice)
              selectedLaserRows = selectedLaserRows
                  .filter(function(r){ return r.skIdx !== existsIdx; })
                  .map(function(r){ return r.skIdx > existsIdx ? { skIdx: r.skIdx - 1, kind: r.kind } : r; });
          } else {
              skewers.push({ type: clickedNode.type, d: clickedNode.d, color: laserColors[skewers.length % laserColors.length] });
              selectedLaserRows.push({ skIdx: skewers.length - 1, kind: 'normal' }); // добавляем к уже выбранным — сразу подсветить и его результат
          }
          draw(); syncSelUI();
          return;
      }
  }

  var f = hitFloor(wx,wy);
  if(f===null){ if(sel.size > 0){ sel.clear(); draw(); syncSelUI(); } } 
  else {
      if (e.ctrlKey || e.metaKey) { if (sel.has(f)) sel.delete(f); else sel.add(f); }
      else { if (sel.size === 1 && sel.has(f)) sel.clear(); else { sel.clear(); sel.add(f); } }
      draw(); syncSelUI();
  }
});

const safeDraw = () => { if (G) draw(); };

window.addEventListener("resize", function(){
    applyEditLayout(); // ширина панели могла перейти порог «вкладки ↔ рядом»
    if (isSquaresMode() && squareEditMode) { squaresAutoFit(); draw(); }
    else if (G) { autoFit(); draw(); }
    if (padMode){ padClampCursor(); padUpdateCursorEl(); }
});

var leftPanel = $("leftPanel"), rightPanel = $("rightPanel");
var btnL = $("toggleLeft"), btnR = $("toggleRight");
var stubL = $("stubLeft"), stubR = $("stubRight");

// Кнопки скрытия живут ВНУТРИ панелей (в строке заголовка), поэтому со свёрнутой панелью они
// исчезают — вернуть её можно только заглушкой у края экрана. Заглушка показывается ровно тогда,
// когда её панель свёрнута.
function syncPanelStubs(){
    if (stubL) stubL.classList.toggle("on", leftPanel.classList.contains("collapsed"));
    if (stubR) stubR.classList.toggle("on", rightPanel.classList.contains("collapsed"));
}
function toggleLeftPanel(){
    var hid = leftPanel.classList.toggle("collapsed");
    $("divLeft").style.display = hid ? "none" : "";
    syncPanelStubs();
    setTimeout(function(){ if (G) { autoFit(); draw(); } }, 10);
}
function toggleRightPanel(){
    var hid = rightPanel.classList.toggle("collapsed");
    $("divRight").style.display = hid ? "none" : "";
    syncPanelStubs();
    setTimeout(function(){ applyEditLayout(); if (G) { autoFit(); draw(); } }, 10);
}
if (btnL) btnL.addEventListener("click", toggleLeftPanel);
if (btnR) btnR.addEventListener("click", toggleRightPanel);
if (stubL) stubL.addEventListener("click", toggleLeftPanel);
if (stubR) stubR.addEventListener("click", toggleRightPanel);

// Мобильный старт: на узком экране обе панели свёрнуты — холст занимает всё,
// открываются заглушками ⚙/✎ у краёв и ложатся поверх холста (см. media-query в CSS)
if (window.innerWidth < 900) {
    if (!leftPanel.classList.contains("collapsed")) toggleLeftPanel();
    if (!rightPanel.classList.contains("collapsed")) toggleRightPanel();
}
syncPanelStubs();

function makeResizer(divEl, panelEl, sign){
    divEl.addEventListener("mousedown", function(e){
        e.preventDefault();
        var startX = e.clientX;
        var startW = panelEl.getBoundingClientRect().width;
        // 0.45 не давало растянуть правую панель настолько, чтобы «Паттерны» и «Данные» встали
        // рядом (порог EDIT_WIDE_MIN) на экранах уже ~1150px — потолок поднят.
        var maxW = Math.round(window.innerWidth * 0.62);
        divEl.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        var onMove = function(ev){
            var w = startW + sign * (ev.clientX - startX);
            w = Math.max(150, Math.min(maxW, w));
            panelEl.style.width = w + "px";
            applyEditLayout(); // тянем разделитель — раскладка «вкладки ↔ рядом» переключается на лету
            if (G) { autoFit(); requestDraw(); }
        };
        var onUp = function(){
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            divEl.classList.remove("dragging");
            document.body.style.cursor = "";
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
    });
}
makeResizer($("divLeft"), leftPanel, 1);
makeResizer($("divRight"), rightPanel, -1);

$("divLaser").addEventListener("mousedown", function(e){
    e.preventDefault();
    var grip = this;
    var startY = e.clientY;
    var startH = skewerWrap.getBoundingClientRect().height;
    var colH = skewerWrap.parentNode.getBoundingClientRect().height;
    var maxH = Math.round(colH * 0.7);
    grip.classList.add("dragging");
    document.body.style.cursor = "row-resize";
    var onMove = function(ev){
        var h = startH - (ev.clientY - startY); 
        h = Math.max(54, Math.min(maxH, h));
        skewerWrap.style.height = h + "px";
        if (G) { autoFit(); requestDraw(); }
    };
    var onUp = function(){
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
        grip.classList.remove("dragging");
        document.body.style.cursor = "";
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
});
// Тач-версия того же ресайза (мышиные обработчики выше на телефоне не срабатывают вообще —
// touchstart/mousedown это разные события) + тап по ручке без сдвига сворачивает/разворачивает
// панель одним касанием (тянуть 5px-полоску пальцем ненадёжно, а без этого панель на мобильном
// было почти невозможно убрать — до этой правки вообще не реагировала на палец).
$("divLaser").addEventListener("touchstart", function(e){
    e.preventDefault();
    var grip = this;
    var t = e.touches[0];
    var startY = t.clientY;
    var startH = skewerWrap.getBoundingClientRect().height;
    var colH = skewerWrap.parentNode.getBoundingClientRect().height;
    var maxH = Math.round(colH * 0.7);
    var moved = false;
    grip.classList.add("dragging");
    var onMove = function(ev){
        var mt = ev.touches[0];
        if (Math.abs(mt.clientY - startY) > 6) moved = true;
        var h = Math.max(54, Math.min(maxH, startH - (mt.clientY - startY)));
        skewerWrap.style.height = h + "px";
        if (G) { autoFit(); requestDraw(); }
        ev.preventDefault();
    };
    var onEnd = function(){
        window.removeEventListener("touchmove", onMove);
        window.removeEventListener("touchend", onEnd);
        window.removeEventListener("touchcancel", onEnd);
        grip.classList.remove("dragging");
        if (!moved) {
            var curH = skewerWrap.getBoundingClientRect().height;
            if (curH > 60) {
                grip.dataset.prevH = curH;
                skewerWrap.style.height = "54px";
            } else {
                skewerWrap.style.height = (grip.dataset.prevH || maxH) + "px";
            }
            if (G) { autoFit(); requestDraw(); }
        }
    };
    window.addEventListener("touchmove", onMove, {passive: false});
    window.addEventListener("touchend", onEnd);
    window.addEventListener("touchcancel", onEnd);
}, {passive: false});

window.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (zenMode) {
        toggleZenMode();
        return;
    }
    // Escape — единственное, что теперь возвращает вид на место (центр + масштаб): сам по себе
    // он больше никогда не сбрасывается, см. rebuild(fitView). Лазеры, если были, тем же
    // нажатием снимаются — как и раньше.
    if (skewers.length > 0) {
        skewers = [];
        selectedLaserRows = [];
        syncSelUI();
    }
    if (G) autoFit();
    draw();
});

var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
setTheme(prefersDark ? "dark" : "light");

function fullInit() {
    restoreSrcFromCache(); // подтянуть сохранённые «Данные» из localStorage (если есть)
    applyEditLayout();     // вкладки или обе группы рядом — по текущей ширине панели
    rebuild();
    applyI18n();
}

const resizeObs = new ResizeObserver(entries => {
    for (let entry of entries) {
        if (entry.contentRect.width > 10 && entry.contentRect.height > 10) {
            if (!G) fullInit();
            else safeDraw();
        }
    }
});
resizeObs.observe(stage);

window.addEventListener('load', () => {
    if (!G) fullInit();
});

})();
</script>
</body></html>
