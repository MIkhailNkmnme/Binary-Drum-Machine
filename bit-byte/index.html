<!-- Bit-Byte v0.007 · четыре независимые вкладки: 8, 4, 2 и 1 бит. -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit-Byte v0.007 — Зеркалиус</title>
  <link rel="stylesheet" href="../_js/grozd.css">
  <link rel="stylesheet" href="style.css?v=007">

  <script defer src="app.js?v=007"></script>
  <script defer src="../_js/hub-link.js?v=7"></script>
</head>
<body>
  <main>
    <header class="page-head">
      <h1>Bit-Byte <small style="font-size:11px;font-weight:normal">v0.007</small></h1>
      <p>Щёлкните по ячейке, чтобы исключить или вернуть её. Стрелки перемещают фокус, Enter и пробел меняют состояние.</p>
    </header>

    <div class="commands editor-tabs" role="tablist" aria-label="Размер слова">
      <button id="tab-byte" class="gz-hx" role="tab" type="button" aria-selected="true" aria-controls="byte-editor" data-mode="byte"><span class="gz-ic" aria-hidden="true">8</span><span class="gz-nm">Байт</span></button>
      <button id="tab-nibble" class="gz-hx" role="tab" type="button" aria-selected="false" aria-controls="nibble-editor" data-mode="nibble" tabindex="-1"><span class="gz-ic" aria-hidden="true">4</span><span class="gz-nm">Полубайт</span></button>
      <button id="tab-dibit" class="gz-hx" role="tab" type="button" aria-selected="false" aria-controls="dibit-editor" data-mode="dibit" tabindex="-1" title="Четверть байта — 2 бита; техническое название: дибит"><span class="gz-ic" aria-hidden="true">2</span><span class="gz-nm">Четвертьбайт</span></button>
      <button id="tab-bit" class="gz-hx" role="tab" type="button" aria-selected="false" aria-controls="bit-editor" data-mode="bit" tabindex="-1" title="Бит — одно двоичное значение: 0 или 1; одна восьмая байта"><span class="gz-ic" aria-hidden="true">1</span><span class="gz-nm">Бит</span></button>
    </div>
    <section id="byte-editor" class="editor-panel" data-unit="byte" role="tabpanel" aria-labelledby="tab-byte"></section>
    <section id="nibble-editor" class="editor-panel" data-unit="nibble" role="tabpanel" aria-labelledby="tab-nibble" hidden></section>
    <section id="dibit-editor" class="editor-panel" data-unit="dibit" role="tabpanel" aria-labelledby="tab-dibit" hidden></section>
    <section id="bit-editor" class="editor-panel" data-unit="bit" role="tabpanel" aria-labelledby="tab-bit" hidden></section>

    <template id="editor-template">
    <div class="workspace">
      <aside class="sidebar sidebar-left" aria-label="Ручное исключение">
        <section class="panel">
          <h2>Ручное исключение</h2>
          <div class="commands">
            <button id="restore" class="gz-hx" type="button" title="Вернуть все байты" aria-label="Вернуть все байты"><span class="gz-ic" aria-hidden="true">↺</span><span class="gz-nm">Вернть все</span></button>
            <button id="invert" class="gz-hx" type="button" title="Инвертировать выбор" aria-label="Инвертировать выбор"><span class="gz-ic" aria-hidden="true">⇄</span><span class="gz-nm">Инверсия</span></button>
            <button id="undo" class="gz-hx" type="button" title="Отменить последнее изменение" aria-label="Отменить последнее изменение"><span class="gz-ic" aria-hidden="true">↶</span><span class="gz-nm">Отмена</span></button>
          </div>
          <form id="exclude-form">
            <label id="list-label" for="exclude-list">Список 8-битных слов</label>
            <textarea id="exclude-list" rows="3" spellcheck="false" autocapitalize="off" aria-describedby="list-hint"></textarea>
            <p id="list-hint" class="hint">Например, 00000001 11110000</p>
            <div class="commands">
              <button id="exclude" class="gz-hx" type="submit" title="Исключить байты из списка" aria-label="Исключить байты из списка"><span class="gz-ic" aria-hidden="true">−</span><span class="gz-nm">Исклчть</span></button>
            </div>
            <p id="list-result" class="hint" role="status"></p>
          </form>
          <p class="hint auto-note">Правило автоматического исключения ещё не определено.</p>
        </section>
      </aside>

      <section class="field" aria-label="Поле байтов">
        <div class="field-scroll">
          <table id="byte-field" aria-label="Все 256 байтов. Строка задаёт старшие четыре бита, столбец — младшие четыре бита."></table>
        </div>
        <p class="hint legend"><span id="unit-description">Строки — старшие 4 бита; столбцы — младшие 4 бита.</span> <span aria-hidden="true">╱</span> <span id="unit-legend">Исключённый байт.</span></p>
        <section class="panel sequence-panel" aria-label="Сквозная строка оставшихся битов">
          <div class="sequence-head">
            <h2><label for="remaining-sequence">Сквозная</label></h2>
            <p id="sequence-count" class="hint"></p>
            <div class="commands">
              <button id="cyclic-sequence" class="gz-hx" type="button" aria-pressed="true" title="Кольцевать сквозную: соединять последний бит с первым для всех её расчётов" aria-label="Кольцевать сквозную"><span class="gz-ic" aria-hidden="true">⟳</span><span class="gz-nm">Кольцевать</span></button>
              <button id="copy-sequence" class="gz-hx" type="button" title="Скопировать сквозную строку оставшихся битов" aria-label="Скопировать сквозную строку"><span class="gz-ic" aria-hidden="true">⧉</span><span class="gz-nm">Копировать</span></button>
            </div>
          </div>
          <textarea id="remaining-sequence" rows="3" readonly spellcheck="false" wrap="soft" placeholder="Все байты исключены" aria-describedby="sequence-hint sequence-count"></textarea>
          <p id="sequence-hint" class="hint">Слева направо, сверху вниз; без добавления битов. Для расчётов строка замкнута в кольцо: последний бит → первый.</p>
          <p id="copy-result" class="hint" role="status"></p>
          <div class="ring-statistics">
            <div>
              <table class="stats run-stats">
                <caption id="run-caption">Серии подряд · кольцо</caption>
                <thead><tr><th scope="col">Длина серии</th><th scope="col">Серий из 1</th><th scope="col">Серий из 0</th></tr></thead>
                <tbody id="ring-runs"></tbody>
                <tfoot>
                  <tr><th scope="row">Всего серий</th><td id="run-total-ones"></td><td id="run-total-zeros"></td></tr>
                  <tr><th scope="row">Битов в сериях</th><td id="run-bits-ones"></td><td id="run-bits-zeros"></td></tr>
                </tfoot>
              </table>
              <p class="hint">Точные длины: 111 — одна серия длины 3, а не три одиночных 1.</p>
            </div>
            <div>
              <table class="stats transition-stats">
                <caption id="transition-caption">Переходы · кольцо</caption>
                <thead><tr><th scope="col">Переход</th><th scope="col">Количество</th></tr></thead>
                <tbody>
                  <tr><th scope="row">1 → 0</th><td id="transition-10"></td></tr>
                  <tr><th scope="row">0 → 1</th><td id="transition-01"></td></tr>
                </tbody>
                <tfoot><tr><th scope="row">Всего смен</th><td id="transition-total"></td></tr></tfoot>
              </table>
              <p id="ring-boundary" class="hint"></p>
            </div>
          </div>
          <div class="sequence-bytes-head">
            <h3 id="byte-windows-title">Байты в сквозной</h3>
            <p id="byte-windows-count" class="hint"></p>
          </div>
          <p id="byte-windows-hint" class="hint"></p>
          <div class="sequence-bytes-scroll" tabindex="0" role="region" aria-labelledby="byte-windows-title">
            <table class="stats sequence-bytes">
              <caption id="byte-windows-caption">Число вхождений по сдвигам</caption>
              <thead id="byte-windows-head"></thead>
              <tbody id="byte-occurrences"></tbody>
              <tfoot id="byte-window-totals"></tfoot>
            </table>
          </div>
        </section>
        <section class="panel summary-panel" aria-label="Итоги выбора">
          <h2>Итоги</h2>
          <table class="stats totals">
            <thead>
              <tr><th scope="col">Показатель</th><th scope="col">Осталось</th><th scope="col">Исключено</th></tr>
            </thead>
            <tbody id="totals"></tbody>
          </table>
          <p id="announcement" class="visually-hidden" role="status"></p>
        </section>
      </section>

      <aside class="sidebar sidebar-right" aria-label="Расположение таблицы">
        <section class="panel">
          <h2>Расположение</h2>
          <div class="commands">
            <div class="gz-hx gz-pair gz-split axis-pair" role="group" aria-label="Разворот столбцов и строк">
              <button id="flip-horizontal" class="gz-half gz-h0" type="button" aria-pressed="false" title="Развернуть порядок столбцов: 0 → F или F → 0" aria-label="Развернуть порядок столбцов"><span class="gz-ic" aria-hidden="true">↔</span><span>Стлб</span></button>
              <button id="flip-vertical" class="gz-half gz-h1" type="button" aria-pressed="false" title="Развернуть порядок строк: 0 → F или F → 0" aria-label="Развернуть порядок строк"><span class="gz-ic" aria-hidden="true">↕</span><span>Стр</span></button>
            </div>
            <button id="reset-layout" class="gz-hx" type="button" title="Исходное расположение: обе оси от 0 к F. Исключённые байты сохраняются." aria-label="Вернуть исходное расположение"><span class="gz-ic" aria-hidden="true">↺</span><span class="gz-nm">Исходно</span></button>
          </div>
          <p id="layout-status" class="hint layout-status" role="status"></p>
        </section>
      </aside>
    </div>

    <section class="breakdown" aria-label="Подробная статистика">
      <div class="panel">
        <table class="stats"><caption>По строкам</caption><thead></thead><tbody id="rows"></tbody></table>
      </div>
      <div class="panel">
        <table class="stats"><caption>По столбцам</caption><thead></thead><tbody id="columns"></tbody></table>
      </div>
      <div class="panel">
        <table class="stats"><caption id="popcount-caption">По числу единиц в байте</caption><thead><tr><th scope="col">Единиц</th><th scope="col">Осталось</th><th scope="col">Исключено</th></tr></thead><tbody id="popcounts"></tbody></table>
      </div>
      <div class="panel">
        <table class="stats"><caption>По разрядам</caption><thead></thead><tbody id="positions"></tbody></table>
      </div>
    </section>
    </template>
  </main>
</body>
</html>
