<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Одна четверть белого: разные способы — разные результаты"><rect width="900" height="360" fill="#101722"/><style>text{font:18px sans-serif;fill:#e2e8f0}.s{font-size:14px}</style><text x="24" y="34">Одна четверть белого: разные способы — разные результаты</text><rect x="50" y="80" width="100" height="100" fill="rgb(0,0,0)" stroke="#64748b"/><rect x="150" y="80" width="100" height="100" fill="rgb(0,0,0)" stroke="#64748b"/><rect x="50" y="180" width="100" height="100" fill="rgb(0,0,0)" stroke="#64748b"/><rect x="150" y="180" width="100" height="100" fill="rgb(255,255,255)" stroke="#64748b"/><rect x="150" y="180" width="100" height="100" fill="none" stroke="#fbbf24" stroke-width="5"/><text x="50" y="320">Исходник 2×2: три чёрных, один белый</text><text x="320" y="100">Как на холсте</text><rect x="345" y="125" width="120" height="120" fill="rgb(255,255,255)" stroke="#64748b"/><text x="320" y="280" class="s">выбран (1,1) → RGB255</text><text x="570" y="100">Средний цвет</text><rect x="600" y="125" width="120" height="120" fill="rgb(64,64,64)" stroke="#64748b"/><text x="545" y="280" class="s">(0+0+0+255)/4=63,75 →64</text></svg>