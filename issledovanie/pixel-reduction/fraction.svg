<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Дробное уменьшение: 3 исходных ячейки →2 новых"><rect width="900" height="360" fill="#101722"/><style>text{font:18px sans-serif;fill:#e2e8f0}.s{font-size:14px}</style><text x="24" y="34">Дробное уменьшение: 3 исходных ячейки →2 новых</text><rect x="70" y="80" width="270" height="85" fill="rgb(0,0,0)" stroke="#64748b"/><rect x="340" y="80" width="270" height="85" fill="rgb(255,255,255)" stroke="#64748b"/><rect x="610" y="80" width="270" height="85" fill="rgb(0,0,0)" stroke="#64748b"/><rect x="70" y="75" width="405" height="95" fill="none" stroke="#67e8f9" stroke-width="5"/><path d="M475 60V190" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4"/><text x="120" y="200">чёрный: площадь1</text><text x="350" y="230">белый: площадь½</text><text x="70" y="270">Первая новая ячейка занимает [0;1,5]: (0×1 +255×½)/(1+½)=85</text><rect x="70" y="290" width="405" height="45" fill="rgb(85,85,85)" stroke="#64748b"/><rect x="475" y="290" width="405" height="45" fill="rgb(85,85,85)" stroke="#64748b"/></svg>