<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#10151f"/><g font-family="Arial,sans-serif" fill="#e1e7f0"><text x="30" y="40" font-size="28" fill="#e1e7f0">Пунктир 1–0–1–0: диагональ тоже один шаг</text><text x="30" y="73" font-size="18" fill="#e1e7f0">Белое = 1. Пустой квадрат = 0. Фаза сохраняется при поворотах и переключается после каждого шага.</text><text x="30" y="137" font-size="20" fill="#e1e7f0">Фаза A</text><rect x="280" y="112" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="323" y="112" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="366" y="112" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="409" y="112" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="452" y="112" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="495" y="112" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="538" y="112" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="581" y="112" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="30" y="185" font-size="20" fill="#e1e7f0">Фаза B</text><rect x="280" y="160" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="323" y="160" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="366" y="160" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="409" y="160" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="452" y="160" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="495" y="160" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="538" y="160" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="581" y="160" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="30" y="233" font-size="20" fill="#e1e7f0">A OR B / A XOR B</text><rect x="280" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="323" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="366" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="409" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="452" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="495" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="538" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><rect x="581" y="208" width="35" height="35" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="30" y="281" font-size="20" fill="#e1e7f0">A AND B</text><rect x="280" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="323" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="366" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="409" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="452" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="495" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="538" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><rect x="581" y="256" width="35" height="35" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="690" y="137" font-size="19" fill="#e1e7f0">На одном простом ряду два сдвинутых</text><text x="690" y="166" font-size="19" fill="#e1e7f0">пунктира заполняют пробелы друг друга.</text><text x="690" y="215" font-size="19" fill="#e1e7f0">0 не стирает накопленную 1:</text><text x="690" y="244" font-size="19" fill="#ffdf98">1 OR 0 = 1; 1 XOR 0 = 1.</text><text x="30" y="342" font-size="23" fill="#e1e7f0">Петля: вправо → диагональ → вверх → диагональ → диагональ</text><text x="30" y="372" font-size="17" fill="#e1e7f0">5 клеток; 5 переходов за круг; 3 диагонали. Направления H → D → V → D → D → H.</text><text x="45" y="410" font-size="21" fill="#e1e7f0">1 круг · XOR</text><rect x="98" y="509" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="113" y="536" font-size="17" fill="#10151f">0</text><rect x="141" y="509" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="156" y="536" font-size="17" fill="#a4b0c1">1</text><rect x="98" y="466" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="113" y="493" font-size="17" fill="#10151f">2</text><rect x="98" y="423" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="113" y="450" font-size="17" fill="#a4b0c1">3</text><rect x="55" y="466" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="70" y="493" font-size="17" fill="#10151f">4</text><text x="45" y="586" font-size="19" fill="#e1e7f0">Белых: 3 из 5</text><text x="45" y="615" font-size="17" fill="#a9d9ff">OR: 3 из 5</text><text x="355" y="410" font-size="21" fill="#e1e7f0">2 круг · XOR</text><rect x="408" y="509" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="423" y="536" font-size="17" fill="#10151f">0</text><rect x="451" y="509" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="466" y="536" font-size="17" fill="#10151f">1</text><rect x="408" y="466" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="423" y="493" font-size="17" fill="#10151f">2</text><rect x="408" y="423" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="423" y="450" font-size="17" fill="#10151f">3</text><rect x="365" y="466" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="380" y="493" font-size="17" fill="#10151f">4</text><text x="355" y="586" font-size="19" fill="#e1e7f0">Белых: 5 из 5</text><text x="355" y="615" font-size="17" fill="#a9d9ff">OR: 5 из 5</text><text x="665" y="410" font-size="21" fill="#e1e7f0">3 круг · XOR</text><rect x="718" y="509" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="733" y="536" font-size="17" fill="#a4b0c1">0</text><rect x="761" y="509" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="776" y="536" font-size="17" fill="#10151f">1</text><rect x="718" y="466" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="733" y="493" font-size="17" fill="#a4b0c1">2</text><rect x="718" y="423" width="42" height="42" fill="#fff" stroke="#4b586e" stroke-width="1"/><text x="733" y="450" font-size="17" fill="#10151f">3</text><rect x="675" y="466" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="690" y="493" font-size="17" fill="#a4b0c1">4</text><text x="665" y="586" font-size="19" fill="#e1e7f0">Белых: 2 из 5</text><text x="665" y="615" font-size="17" fill="#a9d9ff">OR: 5 из 5</text><text x="975" y="410" font-size="21" fill="#e1e7f0">4 круг · XOR</text><rect x="1028" y="509" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="1043" y="536" font-size="17" fill="#a4b0c1">0</text><rect x="1071" y="509" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="1086" y="536" font-size="17" fill="#a4b0c1">1</text><rect x="1028" y="466" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="1043" y="493" font-size="17" fill="#a4b0c1">2</text><rect x="1028" y="423" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="1043" y="450" font-size="17" fill="#a4b0c1">3</text><rect x="985" y="466" width="42" height="42" fill="#10151f" stroke="#4b586e" stroke-width="1"/><text x="1000" y="493" font-size="17" fill="#a4b0c1">4</text><text x="975" y="586" font-size="19" fill="#e1e7f0">Белых: 0 из 5</text><text x="975" y="615" font-size="17" fill="#a9d9ff">OR: 5 из 5</text><text x="30" y="663" font-size="17" fill="#e1e7f0">Номера 0–4 показывают порядок обхода; после 4 — снова 0. Серые рамки обозначают места клеток.</text><text x="30" y="695" font-size="19" fill="#ffbb71">Это пример механизма. Маршрут для исходного глифа ещё не найден.</text></g></svg>