<text x="60" y="944.0" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" fill="#e8edf5">3. ЧТО ОЗНАЧАЮТ ТЁМНЫЕ ЩЕЛИ</text>
<text x="60" y="995.4" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#e8edf5">Это промежутки между светящимися областями, а не ещё один «междупиксель».</text>
<text x="60" y="1035.0" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#b4c1d3">Щели здесь увеличены для ясности. У реальных экранов форма и порядок RGB различаются.</text>
<text x="60" y="1077.0" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#b4c1d3">Обычное увеличение PNG увеличивает его пиксели; субпиксели панели оно не фотографирует.</text>
