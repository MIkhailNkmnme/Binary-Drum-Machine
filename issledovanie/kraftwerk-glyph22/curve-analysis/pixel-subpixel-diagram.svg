<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150">
<title>Пиксель, RGB-субпиксели и промежутки — условная схема LCD</title>
<rect width="1500" height="1150" fill="#111722"/>
<text x="55" y="68.6" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" fill="#e8edf5">ПИКСЕЛЬ → СУБПИКСЕЛИ → ГРАНИЦА</text>
<text x="55" y="114.0" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#b4c1d3">Условная RGB-полоса LCD. Это схема, а не микрофотография вашего экрана.</text>
