<svg xmlns="http://www.w3.org/2000/svg" width="960" height="395" viewBox="0 0 960 395" role="img" aria-labelledby="title desc"><title id="title">Отскок: исходник и кадр 2</title><desc id="desc">Копия идёт по полосе и отражается, повторяя крайние клетки. Две копии строки. Синий — вперёд; красный — после разворота. Прошлая копия становится чёрной.</desc><rect width="960" height="395" rx="12" fill="#0c131d"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#e4edf8" >Отскок</text><text x="24" y="61" font-size="17" fill="#a9bdd4" >Копия идёт по полосе и отражается, повторяя крайние клетки.</text><rect x="20" y="80" width="440" height="220" rx="8" fill="#17212e" stroke="#314155"/><text x="36" y="108" font-size="15" fill="#e4edf8" >Исходник · кадр 0</text><text x="32" y="149.82" font-size="12" fill="#a9bdd4" >1</text><rect x="128.5" y="132" width="26.4" height="26.4" rx="1.5" fill="#edf2f8"/><text x="141.7" y="151.44" font-size="18" fill="#000000" text-anchor="middle" font-family="Consolas, monospace" font-weight="400">1</text><rect x="182.5" y="132" width="26.4" height="26.4" rx="1.5" fill="#b9c7d5"/><text x="195.7" y="151.44" font-size="18" fill="#000000" text-anchor="middle" font-family="Consolas, monospace" font-weight="400">0</text><rect x="236.5" y="132" width="26.4" height="26.4" rx="1.5" fill="#edf2f8"/><text x="249.7" y="151.44" font-size="18" fill="#000000" text-anchor="middle" font-family="Consolas, monospace" font-weight="400">1</text><rect x="290.5" y="132" width="26.4" height="26.4" rx="1.5" fill="#edf2f8"/><text x="303.7" y="151.44" font-size="18" fill="#000000" text-anchor="middle" font-family="Consolas, monospace" font-weight="400">1</text><rect x="344.5" y="132" width="26.4" height="26.4" rx="1.5" fill="#b9c7d5"/><text x="357.7" y="151.44" font-size="18" fill="#000000" text-anchor="middle" font-family="Consolas, monospace" font-weight="400">0</text><text x="32" y="176.82" font-size="12" fill="#a9bdd4" >2</text><rect x="155.5" y=