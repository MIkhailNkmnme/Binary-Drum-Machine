<title>Zerkalius АзъБукъ v0.047</title>
<!-- АзъБукъ — v0.047. Символы выровнены по вертикали: у минуса, плюса, равно, тильды, каретки, звёздочки, двоеточия, кавычек, решётки, процента, косых черт и «» появилась полная высота 7 строк; минус теперь на середине строки, а не внизу. v0.046. Переключатель «моно / по буквам»: моно — клетка 8 у всех, буква центрируется, зазор между клетками; по буквам — шаг по ширине рисунка, зазор между буквами, 0 — буквы касаются. v0.045. Моноширинный набор: каждая буква в клетке 8, буквы центрируются, общая базовая линия строчных, выносные уходят вниз; зазор одинаковый у всех, включая узкие i, j и l. У р, у, ф, g, p, q и y тело строчной дотянуто до пяти клеток, как у остальных. v0.044. Толстое начертание удалено: осталась только тонкая гарнитура, выбор толщины снят. v0.043. Прямоугольные кнопки кратны ячейке, ссылка в хаб.  Палитры квадратами цвета букв внутри цвета фона, без подписей. v0.042. Палитра и свои цвета справа в редакторе буквы. v0.041. Чёрный контур выбранной буквы, полосы прокрутки скрыты. v0.040. Настройки слева от сетки в поле, выбранная буква жёлтая. v0.039. Обводка версии трапецией по рисунку пользователя. v0.038. Нулевой зазор до касания клеток; сетка в правом верхнем углу поля. v0.037. Набор текста с изображением и JSON, цвет сетки, точный шаг зазора, выделение размера. v0.036. Буквы и промежутки на общей сетке; кнопка сетки внутри поля справа. v0.035. Действия справа от заголовка, выбор размера по образцам буквы. v0.034. Переключатель фоновой сетки поля букв. v0.033. Заголовки разделов алфавита сняты. v0.032. Редактор от 4×4, форма сетки, подсчёт битов и замкнутых пустот, все размеры справа. v0.031. Буквы разделены при любом зазоре, включая нулевой. v0.030. Знаки изменения строк и столбцов над сеткой, действия редактора сверху. v0.029. Выбранная буква выделяется цветом и свечением. v0.028. Число внутри X только при значении по умолчанию 1, иначе сбоку. v0.027. Число зазора зелёное, в покое между половинами X. v0.026. Число сбоку появляется сразу при первом нажатии стрелки. v0.025. Выбор буквы для правки прямо из алфавита. v0.024. Зазор до стрелок 2 px, левая и правая части разного цвета. v0.023. Составные кнопки сетки и ромбы Зазеркалиуса влево/вправо. v0.022. Барабан сворачивается при уходе мыши; стрелки и захват X разделены. v0.021. Клик по заголовку палитры вращает барабан. v0.020. Раздвижной X-бегунок с числом внутри и сбоку при наведении. v0.019. Неоновые, монохромные и радужная палитры; кнопка правки буквы. v0.018. Битовый номер версии высотой 8 px. v0.017. Заголовок АЗЪ-БУКЪ в общей рамке, рабочие кнопки с ячейкой 1 px. v0.016. Зазор шагает по клеткам, в кнопках всегда одна клетка. v0.015. Рабочие кнопки набраны выбранным битовым шрифтом. v0.014. Клетки непрерывных штрихов соприкасаются и при наклоне. v0.013. Межбуквенный зазор считается по закрашенным клеткам на обеих сетках. v0.012. Зазор задаётся в долях ширины буквы от 0 до 1. v0.011: Ползунок «зазор» — расстояние между буквами от 0 до одной ширины буквы. v0.010: исправлены исходные тонкие буквы и знаки. v0.009: В образцах кнопок добавлена ячейка 1 px, уточнено название тонкого начертания. v0.008: раздел «В кнопках» — битовые подписи внутри кнопок-ромбоидов разной высоты. v0.007: v0.007: пресеты цветов — кнопка «цвет» переключает фиолетовый, золото, бирюзу, алый и день; выбор запоминается.
     v0.006: ромбосетка из треугольников (строки сдвинуты на полклетки) и один общий блок знаков.
     v0.005: в редакторе работает протяжка. v0.004: размеры ячейки 1 и 16 px.
     v0.003: два веса — обычный и «в одну клетку»; отдельные правки для каждого веса, выгрузка JSON.
     v0.002: ручной редактор глифов. Шрифт: буквы на треугольной решётке, как в шапке «Зазеркалиус». -->

<style>
  :root{ --bg:#040b12; --ink:#39f8ff; --dim:#87bacb; --line:#27afcd; --btn:#071824; --btnh:#0b2637; --btnon:#103c50; --card:#06121c; }
  *{box-sizing:border-box;scrollbar-width:none}
  *::-webkit-scrollbar{display:none}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}

  #head svg{max-width:100%;height:auto}
  .pbtn.ver{flex:none;height:20px;padding:0 12px;color:var(--dim);clip-path:polygon(10px 0,calc(100% - 2px) 0,100% 100%,0 100%)}
  .pbtn.ver::before{clip-path:polygon(9.6px 0,calc(100% - 1.8px) 0,100% 100%,0 100%)}
  .bar{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bar button,.tools button,#editLabel{display:inline-flex;align-items:center;justify-content:center;max-width:100%}

  button{background:var(--btn);color:var(--ink);border:1px solid var(--line);height:26px;min-width:34px;
    font:11px/1 "Segoe UI";cursor:pointer;padding:0 10px;
    clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
  button:hover{background:var(--btnh);border-color:var(--line)}
  button.on{background:var(--btnon);border-color:var(--line)}
  main{width:calc(100% - 52px);max-width:1500px;margin:20px auto 60px;border:1px solid var(--line);background:var(--card)}

  .pbtn{position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0 16px;

  #fieldGridColor{flex:0 0 28px;width:28px;height:26px;border:1px solid var(--line);padding:2px;background:var(--btn);cursor:pointer}

  .text-actions button{width:130px;flex:none}
  .text-preview{min-width:0;max-height:600px;overflow:auto}
  #textImage{display:block;max-width:100%;height:auto}
  .text-result{min-width:0}
  #textJsonDetails{margin-top:10px;color:var(--dim)}
  #textJsonDetails summary{cursor:pointer}
  #textJson{max-height:180px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.4 monospace;color:var(--ink)}
  #textNotice{margin-top:6px;color:var(--dim);font-size:11px}
  @media(max-width:700px){.text-composer{grid-template-columns:minmax(0,1fr)}}
  #sheet .glyph-outline{display:none;fill:none;stroke:#000;stroke-width:.65px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  #sheet .editing .glyph-outline,#sheet [data-edit-char]:focus-visible .glyph-outline{display:block}
  #sheet [data-edit-char]{cursor:pointer}
  #sheet [data-edit-char]:hover{opacity:.7}
  #sheet [data-edit-char]:focus-visible,#sheet [data-edit-char].editing{outline:none;color:var(--edit-ink);opacity:1;filter:drop-shadow(0 0 2px var(--edit-glow)) drop-shadow(0 0 4px var(--edit-glow))}
  .work{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}

  .grid-tools > span{display:inline-flex;align-items:center;gap:2px}
  .grid-tools button{padding:0;width:24px;min-width:24px;height:24px;border:0;clip-path:none;background:none;color:var(--ink);font:20px/24px monospace}
  .grid-tools button:hover{color:var(--edit-ink);background:none}
  .grid-tools button:focus-visible{outline:1px solid var(--ink)}
  .grid{display:block;background:var(--bg);padding:0;border:0;user-select:none;touch-action:none;overflow:visible}

  .cell:hover{stroke:var(--ink)}
  .cell.on{fill:var(--ink);stroke:var(--ink)}
  .grid-tools button:disabled{opacity:.3;cursor:default}
  .grid-panel{flex:none}
  .side{display:flex;flex-direction:column;gap:14px;flex:1 1 538px;min-width:0;max-width:100%}

  .editor-head .tools{display:flex;flex:none;flex-wrap:nowrap;gap:6px;margin-left:auto;max-width:100%;overflow-x:auto}
  .editor-palette{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-left:auto;max-width:100%;padding:3px}

  .palette-swatch[aria-pressed="true"],.palette-swatch[data-selected="true"],.palette-swatch:focus-visible,.palette-swatch:focus-within{outline:2px solid var(--ink);outline-offset:2px}
  #customPalette input{position:absolute;inset:0;width:100%;height:100%;padding:0;margin:0;opacity:0;cursor:pointer}
  #customPalette #customInk{inset:6px;width:12px;height:12px;z-index:1}
  .editor-head .tools button{flex:0 0 130px}
  .prev figure[role="button"]{cursor:pointer}
  .prev figure[role="button"]:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  .prev figure[aria-pressed="true"] figcaption{color:var(--range-value);text-decoration:underline;text-underline-offset:3px}
  .prev{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .prev figure{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0}
  .prev figcaption{color:var(--dim);font-size:10px}
  .glyph-stats{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--dim);font-size:11px;line-height:1.6}
  .glyph-stats strong{font-weight:400;color:var(--ink)}


  .bar button:not(.gap-step){flex:none;width:82px;min-width:0}
  .bar button[data-cell]{width:34px}
  .tools button{width:130px;min-width:0;flex:none}
  #editLabel{width:248px;min-width:0}

  .bar .grid-pair{--gz-w:164px;--gz-h:26px;--gz-n:13px;--gz-bg:var(--btn);--gz-k:var(--ink);--c:var(--ink);--gz-r0:var(--line);--gz-r1:var(--line);width:164px;flex:none}
  .bar .grid-pair:has(.gz-h0.on){--gz-r0:var(--ink)}
  .bar .grid-pair:has(.gz-h1.on){--gz-r1:var(--ink)}
  .bar .grid-pair button.gz-half{position:relative;height:26px;border:0;color:var(--ink);text-shadow:none;min-width:0}
  .bar .grid-pair button.gz-h0{width:calc(50% + 4px)}
  .bar .grid-pair button.gz-h1{width:calc(50% + 3px)}
  .bar .grid-pair button svg{position:relative;z-index:1}


  .gap-slider{position:relative;display:inline-block;flex:0 0 180px;height:26px;user-select:none;touch-action:none;cursor:pointer;--position:0%;--fraction:0;--thumb-pad:33px;--range-left:var(--dim);--range-right:var(--ink);--divider:calc(var(--thumb-pad) + (100% - var(--thumb-pad) - var(--thumb-pad)) * var(--fraction))}
  .gap-slider::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--range-left) 18%,var(--bg)) var(--divider),color-mix(in srgb,var(--range-right) 18%,var(--bg)) var(--divider));clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%)}
  .gap-rail{position:absolute;inset:12px 16px auto;border-top:1px dashed var(--line)}
  .bar .gap-step{position:absolute;top:0;bottom:0;min-width:0;width:14px;height:26px;padding:0;border:0;background:transparent;clip-path:none}
  .gap-slider.over-prev,.gap-slider.over-next{cursor:pointer}
  .gap-slider.over-thumb{cursor:grab}
  .gap-slider.dragging{cursor:grabbing}
  .gap-step::before{opacity:.55}
  .gap-slider.over-prev .prev::before,.gap-slider.over-next .next::before{opacity:1}
  .gap-step.prev{left:0}
  .gap-step::before{content:"";position:absolute;inset:0;background:var(--ink);pointer-events:none}
  .gap-step.prev::before{background:var(--range-left);clip-path:polygon(13px 0,0 50%,13px 100%,13px 76%,6px 50%,13px 24%)}
  .gap-step.next{right:0}
  .gap-step.next::before{background:var(--range-right);clip-path:polygon(1px 0,14px 50%,1px 100%,1px 76%,8px 50%,1px 24%)}
  #track{position:absolute;left:var(--thumb-pad);top:0;width:calc(100% - var(--thumb-pad) - var(--thumb-pad));height:26px;margin:0;opacity:0;pointer-events:none;appearance:none}
  #track::-webkit-slider-thumb{appearance:none;width:1px;height:26px}
  #track::-moz-range-thumb{width:1px;height:26px;border:0}
  .gap-travel{position:absolute;inset:0 var(--thumb-pad);pointer-events:none;transition:inset 140ms}
  .gap-thumb{position:absolute;left:var(--position);top:0;height:26px;width:0}
  .gap-thumb i{position:absolute;top:0;width:8px;height:26px;background:var(--ink);transition:transform 140ms}
  .gap-thumb i:first-child{right:0;background:var(--range-left);clip-path:polygon(0 0,8px 50%,0 100%,0 72%,4px 50%,0 28%);transform:translateX(-10px)}
  .gap-thumb i:last-child{left:0;background:var(--range-right);clip-path:polygon(8px 0,0 50%,8px 100%,8px 72%,4px 50%,8px 28%);transform:translateX(10px)}
  .gap-thumb output{position:absolute;top:5px;left:0;min-width:16px;padding:1px 3px;text-align:center;font:12px/14px monospace;background:var(--btnon);color:var(--range-value,#39f88a);transform:translateX(-50%);transition:transform 140ms,left 140ms}
  .gap-slider:not(.default-value){--thumb-pad:23px}
  .gap-slider:not(.default-value) .gap-thumb i{transform:translateX(0)}
  .gap-slider:not(.default-value) output{left:14px;transform:translateX(0)}
  .gap-slider.value-left:not(.default-value) output{left:-14px;transform:translateX(-100%)}
  .gap-slider:active :is(.gap-thumb i,.gap-thumb output,.gap-travel){transition:none}
  .gap-slider:has(:focus-visible){outline:1px solid var(--ink);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.gap-thumb i,.gap-thumb output,.gap-travel{transition:none}}

.spacing-switch{display:flex;height:26px}.spacing-switch button{height:26px;min-height:0;padding:0 8px;font-size:11px;border:1px solid var(--line);background:var(--btn);border-radius:0}.spacing-switch button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .gap-slider{flex-basis:var(--slider-w);height:var(--control-h)}

  const slope = lattice === 'sq' ? 0 : lattice === 'rmbr' ? -0.5 : 0.5;
  const offset = h * Math.max(0, slope);
  // Один наклон для всей буквы сохраняет общие вершины соседних клеток.
  const transform = 'matrix(1 0 ' + -slope + ' 1 ' + offset + ' 0)';
  const edges = [];
  let cells = '', joints = '', cellLines = '', contour = '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!rows[y] || rows[y][x] !== '1') continue;
    const left = x + offset - (y + 1) * slope;
    if (!edges[y]) edges[y] = { left, right: left + 1 };
    else edges[y].right = left + 1;
    // Закрепляем касание углами, чтобы сглаживание не разорвало диагональ.
    const above = rows[y - 1];
    if (above && above[x] !== '1') {
      for (const dx of [-1, 1]) {
        if (above[x + dx] === '1' && rows[y][x + dx] !== '1') {
          joints += 'M' + (dx < 0 ? x : x + 1) + ',' + y + 'h0';
        }
      }
    }
    if (rows[y - 1]?.[x] !== '1') contour += 'M' + x + ',' + y + 'h1';
    if (rows[y + 1]?.[x] !== '1') contour += 'M' + x + ',' + (y + 1) + 'h1';
    if (rows[y][x - 1] !== '1') contour += 'M' + x + ',' + y + 'v1';
    if (rows[y][x + 1] !== '1') contour += 'M' + (x + 1) + ',' + y + 'v1';
    cells += 'M' + x + ',' + y + 'h1v1h-1z';
    cellLines += 'M' + (x + .08) + ',' + (y + .08) + 'h.84v.84h-.84z';
  }
  let grid = '';
  for (let y = 0; y <= h; y++) grid += 'M0,' + y + 'H' + w;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      grid += 'M' + x + ',' + y + 'l1,1';
      grid += 'M' + (x + 1) + ',' + y + 'l-1,1';
    }
  }
  if (lattice === 'rmbl' || lattice === 'rmbr') grid = cellLines;
  const id = 'g' + (uid++);
  const sw = 0.16;
  const paths = '<defs><clipPath id="' + id + '"><path d="' + cells + '"/></clipPath></defs>' +
    '<g transform="' + transform + '"><g clip-path="url(#' + id + ')"><rect width="' + w + '" height="' + h + '" fill="currentColor"/>' +
    '<path d="' + grid + '" stroke="var(--bg)" stroke-width="' + sw + '" fill="none"/>' +
    '<path d="' + cells + '" stroke="currentColor" stroke-width="' + sw + '" fill="none"/></g>' +
    '<path d="' + joints + '" stroke="currentColor" stroke-width="0.24" stroke-linecap="round"/></g>';
  const occupied = edges.filter(Boolean);
  // Круглые стыки диагоналей немного выходят за границу клеток.
  const jointPad = joints ? 0.12 * Math.hypot(1, slope) : 0;
  const left = occupied.length ? Math.min(...occupied.map(e => e.left)) + Math.min(0, slope) - jointPad : 0;
  const right = occupied.length ? Math.max(...occupied.map(e => e.right)) + Math.max(0, slope) + jointPad : w;
  return { h, w, left, right, paths, slope, offset, rows, outline: '<path class="glyph-outline" transform="' + transform + '" d="' + contour + '"/>' };
}

const DESCEND = {'р': 2, 'у': 2, 'ф': 2, 'ц': 1, 'щ': 1, 'д': 1, 'g': 2, 'j': 1, 'p': 2, 'q': 2, 'y': 2};
function lettering(text, cell, gapCells = 1, maxWidth = Infinity, masks = G[activeSet], editable = false, options = {}) {
  const aspect = lattice === 'rmbl' || lattice === 'rmbr' ? 2 / Math.sqrt(3) : AR;
  const lines = [];
  const setText = editable || options.snap;
  const mono = setText && spacing === 'mono';
  const minHeight = options.lineHeight || 0;
  // «моно» — одна клетка 8 у всех, буква центрируется; «по буквам» — шаг по ширине рисунка.
  const box = 8;
  const pitch = box + gapCells;
  const depth = ch => DESCEND[ch] || 0;
  let placed = [], width = 0, asc = 0, below = 0, cursor = 0, gap = 0;
  function finishLine() {
    const height = Math.max(minHeight, asc + below, 1);
    if (options.collect) options.collect.push({width, height, items: placed.map(({shape, x, ch, desc}) => ({ch, x, y: asc - (shape.h - desc), paths: shape.paths}))});
    const groups = placed.map(({ shape, x, ch, desc }) =>
      '<g' + (editable ? ' data-edit-char="' + encodeURIComponent(ch) + '" role="button" tabindex="0"' : '') + ' transform="translate(' + x + ' ' + (asc - (shape.h - desc)) + ')">' + shape.paths + (editable ? shape.outline : '') + '</g>').join('');
    lines.push('<svg width="' + width * aspect * cell + '" height="' + height * cell +
      '" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none">' + groups + '</svg>');
    placed = []; width = 0; asc = 0; below = 0; cursor = 0; gap = 0;
  }
  for (const ch of text) {
    const shape = glyphShape(ch, masks[ch]);
    const desc = depth(ch);
    let x;
    if (mono) {
      x = cursor + Math.floor((box - shape.w) / 2);
      if (placed.length && (cursor + pitch) * aspect * cell > maxWidth) {
        finishLine();
        x = Math.floor((box - shape.w) / 2);
      }
      cursor += pitch;
      width = Math.max(width, cursor);
    } else {
      x = width + gap - shape.left;
      if (placed.length && Math.max(width, x + shape.right) * aspect * cell > maxWidth) {
        finishLine();
        x = -shape.left;
      }
      width = Math.max(width, x + shape.right);
      gap = Math.max(1 / (aspect * cell), setText ? gapCells : Math.min(gapCells, shape.w));
    }
    placed.push({ shape, x, ch, desc });
    asc = Math.max(asc, shape.h - desc);
    below = Math.max(below, desc);
  }
  if (placed.length) finishLine();
  return lines.join('');
}

const row = text => '<div class="row">' + text.replaceAll('&', '&amp;').replaceAll('<', '&lt;') + '</div>';
function renderHeading() {
  const masks = G[activeSet];
  const dash = masks['-'];
  const first = dash.findIndex(row => row.includes('1'));
  let centered = dash;
  if (first >= 0) {
    centered = dash.slice(first, dash.findLastIndex(row => row.includes('1')) + 1);
    const below = Math.max(0, Math.floor((masks['Б'].length - centered.length) / 2));
    centered = centered.concat(Array(below).fill(''));
  }
  document.getElementById('head').innerHTML = lettering('АЗЪ-БУКЪ', 4, 1, Infinity, { ...masks, '-': centered });
  const version = document.querySelector('.ver');
  const label = version.getAttribute('aria-label');
  const versionMasks = Object.fromEntries([...label].map(ch => {
    const rows = masks[ch];
    const firstInk = rows.findIndex(row => row.includes('1'));
    return [ch, rows.slice(Math.max(0, firstInk))];
  }));
  const height = Math.max(...Object.values(versionMasks).map(rows => rows.length));
  version.innerHTML = lettering(label, 8 / height, 1, Infinity, versionMasks);
}

function renderButtonLabel(button, label) {
  button.setAttribute('aria-label', label);
  button.innerHTML = lettering(label.replaceAll('−', '-'), 1);
}

function sizeControls(cell) {
  const round = value => Math.ceil(value / cell) * cell;
  const sizes = {'control-h': round(26), 'tool-w': round(130),
    'half-w': round(82), 'label-w': round(248), 'grid-w': round(110), 'swatch-size': round(26),
    'tiny-size': round(24), 'step-w': round(14), 'slider-w': round(180)};
  for (const [key, value] of Object.entries(sizes)) document.documentElement.style.setProperty('--' + key, value + 'px');
}

function renderSheet(cell) {
  sizeControls(cell);
  document.querySelectorAll('[data-lat]').forEach(button => {
    const selected = button.dataset.lat === lattice;
    button.classList.toggle('on', selected);
    button.classList.toggle('gz-on', selected);
    button.setAttribute('aria-pressed', String(selected));
    button.closest('.grid-pair').classList.toggle('gz-bs', button.closest('.grid-pair').querySelector('.gz-h1').dataset.lat === lattice);
  });
  const letterWidths = [...(UPPER + LOWER + LATU + LATL)].map(ch =>
    Math.max(...G[activeSet][ch].map(row => row.length)));
  trk.max = Math.max(1, ...letterWidths);
  trk.value = track;
  updateTrackDisplay();
  renderHeading();

  document.querySelectorAll('.bar button:not(.gap-step), .tools button, #editLabel, #fieldGridToggle, #hubLink').forEach(button => {
    const label = button.getAttribute('aria-label') || button.textContent;

function fieldGrid(cell, patternId = 'alphabet-field-grid') {
  if (!fieldGridVisible) return '';
  const slope = lattice === 'sq' ? 0 : lattice === 'rmbr' ? -.5 : .5;
  const aspect = lattice === 'rmbl' || lattice === 'rmbr' ? 2 / Math.sqrt(3) : AR;
  const w = aspect * cell, h = cell;
  let lines = 'M0,0H' + w + 'M0,' + h + 'H' + w;
  for (let i = -1; i <= 2; i++) lines += 'M' + (i * w) + ',0l' + (-2 * slope * w) + ',' + (2 * h);
  return '<svg class="field-grid" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>' +
    '<pattern id="' + patternId + '" width="' + w + '" height="' + (2 * h) + '" patternUnits="userSpaceOnUse">' +
    '<path d="' + lines + '" fill="none" stroke="var(--field-grid-color,var(--line))" stroke-width=".65"/></pattern></defs>' +
    '<rect width="100%" height="100%" fill="url(#' + patternId + ')"/></svg>';
}

function renderAlphabet(cell) {
  const gridButton = document.getElementById('fieldGridToggle');
  gridButton.classList.toggle('on', fieldGridVisible);
  gridButton.setAttribute('aria-pressed', String(fieldGridVisible));
  gridButton.title = (fieldGridVisible ? 'Скрыть' : 'Показать') + ' сетку поля с буквами';
  const alphabet = document.getElementById('alphabet');
  const aspect = lattice === 'rmbl' || lattice === 'rmbr' ? 2 / Math.sqrt(3) : AR;
  const pitch = cell * aspect;
  alphabet.style.setProperty('--field-pad-x', Math.ceil(18 / pitch) * pitch + 'px');
  alphabet.style.setProperty('--field-gap', Math.ceil(14 / (2 * cell)) * 2 * cell + 'px');
  alphabet.innerHTML = fieldGrid(cell) + [
    '<section aria-label="Кириллица">' + row(UPPER) + row(LOWER) + '</section>',
    '<section aria-label="Латиница">' + row(LATU) + row(LATL) + '</section>',
    '<section aria-label="Цифры и знаки">' + row(DIGIT) + row(SYM) + '</section>',
  ].join('');
  const rows = document.querySelectorAll('#sheet .row');
  const maxWidth = rows[0].getBoundingClientRect().width;
  rows.forEach(el => { el.innerHTML = lettering(el.textContent, cell, trk.valueAsNumber, maxWidth, G[activeSet], true); });
  updateSelectedGlyph();
  renderTextPreview();
}


function downloadTextBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = name; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function renderTextPreview() {
  const raw = textInput.value;
  const image = document.getElementById('textImage');
  const notice = document.getElementById('textNotice');
  const empty = raw.length === 0;
  image.hidden = empty;
  ['textPng', 'textSvg', 'textDownloadJson'].forEach(id => document.getElementById(id).disabled = empty);
  if (empty) { image.removeAttribute('src'); textArtwork = null; document.getElementById('textJson').textContent = ''; notice.textContent = ''; return; }
  const masks = G[activeSet], unsupported = new Set();
  const text = [...raw.replace(/\r\n?/g, '\n').replace(/\t/g, '    ')].map(ch => {
    if (ch === '\n' || ch === ' ' || Object.hasOwn(masks, ch)) return ch;
    unsupported.add(ch); return '?';
  }).join('');
  const aspect = lattice === 'rmbl' || lattice === 'rmbr' ? 2 / Math.sqrt(3) : AR;
  const pitch = aspect * cellSize, lineGap = 2, padX = 1, padY = 2;
  const available = Math.max(pitch * 12, document.getElementById('textPreview').clientWidth - padX * 2 * pitch);
  const lineHeight = Math.max(4, masks['А'].length);
  const layouts = [];
  for (const line of text.split('\n')) {
    if (!line) {
      layouts.push({width: 0, height: lattice === 'sq' ? lineHeight : Math.ceil(lineHeight / 2) * 2, items: []});
    } else {
      lettering(line, cellSize, track, available, masks, false, {snap: true, lineHeight, collect: layouts});
    }
  }
  let y = padY, width = 1;
  const groups = [], lines = [], glyphs = {};
  const rainbow = ['#ff647c','#ffac55','#ffe66d','#78f59a','#56e5ff','#899bff','#d78aff'];
  const style = getComputedStyle(document.documentElement);
  const ink = style.getPropertyValue('--ink').trim(), bg = style.getPropertyValue('--bg').trim();
  const gridColor = fieldGridColor || style.getPropertyValue('--line').trim();
  for (const line of layouts) {
    const items = line.items.map((item, index) => {
      const color = document.documentElement.classList.contains('rainbow') ? rainbow[index % rainbow.length] : ink;
      groups.push('<g transform="translate(' + (padX + item.x) + ' ' + (y + item.y) + ')" color="' + color + '">' + item.paths + '</g>');
      glyphs[item.ch] = item.ch === ' ' ? ['000'] : masks[item.ch];
      return {char: item.ch, x: padX + item.x, y: y + item.y};
    });
    lines.push({y, width: line.width, height: line.height, glyphs: items});
    width = Math.max(width, line.width);
    y += line.height + lineGap;
  }
  const widthCells = Math.ceil(width) + 2 * padX, heightCells = y - lineGap + padY;
  const widthPx = Math.ceil(widthCells * pitch), heightPx = heightCells * cellSize;
  let backgroundGrid = '';
  if (fieldGridVisible) {
    const slope = lattice === 'sq' ? 0 : lattice === 'rmbr' ? -.5 : .5;
    let d = 'M0,0H1M0,1H1';
    for (let i = -1; i <= 2; i++) d += 'M' + i + ',0l' + (-2 * slope) + ',2';
    backgroundGrid = '<defs><pattern id="text-field-grid" width="1" height="2" patternUnits="userSpaceOnUse"><path d="' + d + '" stroke="' + gridColor + '" stroke-width="' + (.65 / cellSize) + '" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(#text-field-grid)" opacity=".7"/>';
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + widthPx + '" height="' + heightPx + '" viewBox="0 0 ' + (widthPx / pitch) + ' ' + heightCells + '" preserveAspectRatio="none">' +
    '<rect width="100%" height="100%" fill="' + bg + '"/>' + backgroundGrid + groups.join('').replaceAll('var(--bg)', bg) + '</svg>';
  const data = {format: 'azbuk-text', version: 1, text: raw, renderedText: text, unsupported: [...unsupported], font: activeSet, lattice, spacing,
    cellPixels: {width: pitch, height: cellSize}, gapCells: track, minimumClearancePixels: 0, lineGapCells: lineGap,
    widthCells, heightCells, widthPixels: widthPx, heightPixels: heightPx, colors: {ink, background: bg, rainbow: document.documentElement.classList.contains('rainbow')},
    grid: {visible: fieldGridVisible, color: gridColor}, glyphs, lines};
  textArtwork = {svg, data};
  image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  document.getElementById('textJson').textContent = JSON.stringify(data, null, 2);
  notice.textContent = unsupported.size ? 'Нет знаков в алфавите: ' + [...unsupported].join(' ') + ' — показаны как ?' : '';
}

document.getElementById('fieldGridColor').addEventListener('input', event => {

document.getElementById('textSvg').addEventListener('click', () => {

document.getElementById('textDownloadJson').addEventListener('click', () => {

document.getElementById('textPng').addEventListener('click', async () => {
  if (!textArtwork) return;
  const snapshot = textArtwork;
  try {
    const image = new Image();
    image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(snapshot.svg);
    await image.decode();
    const canvas = document.createElement('canvas');
    canvas.width = snapshot.data.widthPixels; canvas.height = snapshot.data.heightPixels;
    canvas.getContext('2d').drawImage(image, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

    downloadTextBlob(blob, 'azbuk-text.png');

    document.getElementById('textNotice').textContent = 'Не удалось создать PNG этого размера. Сохраните SVG — он содержит всё изображение.';

new ResizeObserver(([entry]) => {

function normalize(rows) {
  const w = Math.max(4, ...rows.map(r => r.length));
  return Array.from({length: Math.max(4, rows.length)}, (_, y) => (rows[y] || '').padEnd(w, '0'));
}

function glyphCounts(rows) {
  const h = rows.length, w = rows[0].length;
  const outside = new Set(), queue = [];
  let ones = 0, minX = w, maxX = -1, minY = h, maxY = -1;
  const visit = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h || rows[y][x] === '1') return;
    const index = y * w + x;
    if (!outside.has(index)) { outside.add(index); queue.push([x, y]); }
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (rows[y][x] === '1') {
      ones++; minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    } else if (x === 0 || y === 0 || x === w - 1 || y === h - 1) visit(x, y);
  }
  // Diagonally touching ink cells close the contour: zeros escape only across an edge.
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    visit(x - 1, y); visit(x + 1, y); visit(x, y - 1); visit(x, y + 1);
  }
  const zeros = w * h - ones;
  return {w, h, ones, zeros, inside: zeros - outside.size, outside: outside.size,
    inkW: ones ? maxX - minX + 1 : 0, inkH: ones ? maxY - minY + 1 : 0};
}

function renderEditorDetails() {
  const counts = glyphCounts(normalize(G[activeSet][editChar] || ['0']));
  const {w, h, ones, zeros, inside, outside, inkW, inkH} = counts;
  document.getElementById('prev').innerHTML = [1, 2, 3, 4, 6, 8, 16].map(size =>
    '<figure role="button" tabindex="0" data-size="' + size + '" aria-label="Размер ячейки ' + size + '" aria-pressed="' + (size === cellSize) + '">' + lettering(editChar, size) + '<figcaption>' + size + '</figcaption></figure>').join('');
  document.getElementById('glyphStats').innerHTML =
    '<span>Поле <strong>' + w + ' × ' + h + ' = ' + (w * h) + '</strong> клеток<br>Буква <strong>' + inkW + ' × ' + inkH + '</strong> клеток</span>' +
    '<span>На всём поле: <strong>1 — ' + ones + ' · 0 — ' + zeros + '</strong><br>1 — клетки линии буквы</span>' +
    '<span>Внутри замкнутых контуров: <strong>0 — ' + inside + '</strong><br>Снаружи: <strong>0 — ' + outside + '</strong></span>';
}

let editorEvents;
function renderEditor() {
  editorEvents?.abort();
  editorEvents = new AbortController();
  updateSelectedGlyph();
  renderButtonLabel(document.getElementById('editLabel'), 'Правка буквы ' + editChar);
  const rows = normalize(G[activeSet][editChar] || ['000']);
  const h = rows.length, w = rows[0].length;
  const grid = document.getElementById('grid');
  const slope = lattice === 'sq' ? 0 : lattice === 'rmbr' ? -0.5 : 0.5;
  const aspect = lattice === 'sq' ? 1 : lattice === 'tri' ? AR : 2 / Math.sqrt(3);
  const pitchY = 24, pitchX = pitchY * aspect, offset = h * Math.max(0, slope);
  const width = (w + h * Math.abs(slope)) * pitchX, height = h * pitchY;
  grid.setAttribute('width', width);
  grid.setAttribute('height', height);
  grid.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
  grid.innerHTML = rows.map((r, y) => [...r].map((v, x) => {
    const point = (dx, dy) => ((x + dx + offset - (y + dy) * slope) * pitchX) + ',' + ((y + dy) * pitchY);
    return '<polygon class="cell' + (v === '1' ? ' on' : '') + '" data-x="' + x + '" data-y="' + y +
      '" points="' + [point(.045, .045), point(.955, .045), point(.955, .955), point(.045, .955)].join(' ') + '"/>';
  }).join('')).join('');
  document.getElementById('delCol').disabled = w <= 4;
  document.getElementById('delRow').disabled = h <= 4;
  // протяжка: тянем мышь — все клетки под курсором меняются в одну сторону
  let drag = null;
  const setBit = (x, y, val) => {
    const r = (G[activeSet][editChar] || ['0']).slice();
    while (r.length <= y) r.push('');
    const line = (r[y] || '').padEnd(x + 1, '0');
    if (line[x] === val) return;
    r[y] = line.slice(0, x) + val + line.slice(x + 1);
    G[activeSet][editChar] = normalize(r);
  };
  const cellAt = (el) => el && el.classList && el.classList.contains('cell') ? el : null;

  grid.addEventListener('pointerdown', (e) => {
    const el = cellAt(e.target);
    if (!el) return;
    e.preventDefault();
    const on = el.classList.contains('on');
    drag = { val: on ? '0' : '1' };
    el.setPointerCapture(e.pointerId);
    setBit(+el.dataset.x, +el.dataset.y, drag.val);
    el.classList.toggle('on', drag.val === '1');
    renderEditorDetails();
  }, { signal: editorEvents.signal });

  grid.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const el = cellAt(document.elementFromPoint(e.clientX, e.clientY));
    if (!el) return;
    setBit(+el.dataset.x, +el.dataset.y, drag.val);
    el.classList.toggle('on', drag.val === '1');
    renderEditorDetails();
  }, { signal: editorEvents.signal });

  const endDrag = () => {
    if (!drag) return;
    drag = null;
    commit();
    renderEditorDetails();
    renderSheet(cellSize);
  };
  grid.addEventListener('pointerup', endDrag, { signal: editorEvents.signal });
  grid.addEventListener('pointercancel', endDrag, { signal: editorEvents.signal });
  window.addEventListener('pointerup', endDrag, { signal: editorEvents.signal });
  renderEditorDetails();
}

function commit() {
  EDITS[activeSet][editChar] = G[activeSet][editChar];
  localStorage.setItem(KEY, JSON.stringify(EDITS));
}

const mod = (fn) => () => { G[activeSet][editChar] = fn(normalize(G[activeSet][editChar] || ['0'])); commit(); renderEditor(); renderSheet(cellSize); };
document.getElementById('addCol').onclick = mod(r => normalize(r.map(x => x + '0')));
document.getElementById('delCol').onclick = mod(r => normalize(r.map(x => x.slice(0, Math.max(4, x.length - 1)))));
document.getElementById('addRow').onclick = mod(r => normalize([...r, '0'.repeat(r[0].length)]));
document.getElementById('delRow').onclick = mod(r => normalize(r.length > 4 ? r.slice(0, -1) : r));
document.getElementById('resetChar').onclick = () => { if (BASE[activeSet][editChar]) { G[activeSet][editChar] = BASE[activeSet][editChar].slice(); delete EDITS[activeSet][editChar]; localStorage.setItem(KEY, JSON.stringify(EDITS)); } renderEditor(); renderSheet(cellSize); };
document.getElementById('resetAll').onclick = () => { EDITS = { thin: {} }; localStorage.removeItem(KEY); for (const s of ['thin']) for (const [ch, rows] of Object.entries(BASE[s])) G[s][ch] = rows.slice(); renderEditor(); renderSheet(cellSize); };
document.getElementById('save').onclick = () => { commit(); const b = document.getElementById('save'); renderButtonLabel(b, 'Сохранено'); setTimeout(() => renderButtonLabel(b, 'Сохранить'), 1200); };
document.getElementById('download').onclick = () => {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ thin: G.thin }));
  a.download = 'azbuk-glyphs.json';
  a.click();
};

document.getElementById('editLabel').addEventListener('click', () => {
  [...document.querySelectorAll('#sheet [data-edit-char]')].find(glyph =>
    decodeURIComponent(glyph.dataset.editChar) === editChar)?.focus();
});




document.querySelectorAll('.bar [data-lat]').forEach(b => b.addEventListener('click', () => {
  lattice = b.dataset.lat;
  localStorage.setItem('azbuk-lattice', lattice);
  renderSheet(cellSize);
  if (!document.getElementById('editor').hidden) renderEditor();
}));

document.getElementById('fieldGridToggle').addEventListener('click', () => {
  fieldGridVisible = !fieldGridVisible;
  localStorage.setItem('azbuk-field-grid', fieldGridVisible ? '1' : '0');
  renderAlphabet(cellSize);
});

function selectPreviewSize(event) {
  const sample = event.target.closest('[data-size]');
  if (!sample) return;
  if (event.type === 'keydown') {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
  }
  cellSize = Number(sample.dataset.size);
  sizeControls(cellSize);
  renderAlphabet(cellSize);
  document.querySelectorAll('#prev [data-size]').forEach(figure => {
    figure.setAttribute('aria-pressed', String(Number(figure.dataset.size) === cellSize));
  });
}
document.getElementById('prev').addEventListener('click', selectPreviewSize);
document.getElementById('prev').addEventListener('keydown', selectPreviewSize);

const THEMES = [
  { name: 'кибер', v: { '--bg': '#040b12', '--ink': '#39f8ff', '--dim': '#87bacb', '--line': '#27afcd', '--btn': '#071824', '--btnh': '#0b2637', '--btnon': '#103c50', '--card': '#06121c' } },
  { name: 'плазма', v: { '--bg': '#0c0516', '--ink': '#c38aff', '--dim': '#af92c9', '--line': '#8c42e8', '--btn': '#1a0a2c', '--btnh': '#27123f', '--btnon': '#39175b', '--card': '#12091f' } },
  { name: 'фуксия', v: { '--bg': '#130511', '--ink': '#ff63dc', '--dim': '#c991bb', '--line': '#d52ca9', '--btn': '#240c20', '--btnh': '#37112f', '--btnon': '#501641', '--card': '#1c0918' } },
  { name: 'лайм', v: { '--bg': '#080e04', '--ink': '#b6ff46', '--dim': '#a5be80', '--line': '#72ba24', '--btn': '#14210b', '--btnh': '#213311', '--btnon': '#304b17', '--card': '#0e1807' } },
  { name: 'импульс', v: { '--bg': '#140906', '--ink': '#ff9a47', '--dim': '#d0a183', '--line': '#d46527', '--btn': '#28120b', '--btnh': '#3d1d11', '--btnon': '#562a17', '--card': '#1e0e08' } },
  { name: 'ЧБ', v: { '--bg': '#ffffff', '--ink': '#000000', '--dim': '#444444', '--line': '#777777', '--btn': '#ffffff', '--btnh': '#eeeeee', '--btnon': '#dddddd', '--card': '#ffffff' } },
  { name: 'БЧ', v: { '--bg': '#000000', '--ink': '#ffffff', '--dim': '#bbbbbb', '--line': '#888888', '--btn': '#080808', '--btnh': '#181818', '--btnon': '#303030', '--card': '#000000' } },
  { name: 'радуга', v: { '--bg': '#070913', '--ink': '#dbe5ff', '--dim': '#9ba9d0', '--line': '#6572b9', '--btn': '#11162a', '--btnh': '#1c2440', '--btnon': '#2c3657', '--card': '#0c1020' } }
];
let customColors = {ink: '#ffffff', background: '#000000'};
try {
  const saved = JSON.parse(localStorage.getItem('azbuk-custom-colors') || 'null');
  if (saved && /^#[0-9a-f]{6}$/i.test(saved.ink) && /^#[0-9a-f]{6}$/i.test(saved.background)) customColors = saved;
} catch {}
function customThemeValues() {
  return {'--ink': customColors.ink, '--bg': customColors.background, '--dim': customColors.ink,
    '--line': customColors.ink, '--btn': customColors.background, '--btnh': customColors.background,
    '--btnon': customColors.background, '--card': customColors.background};
}
const customThemeIndex = THEMES.length;
THEMES.push({name: 'свои', v: customThemeValues()});
document.getElementById('customInk').value = customColors.ink;
document.getElementById('customBackground').value = customColors.background;
for (const id of ['customInk', 'customBackground']) document.getElementById(id).addEventListener('input', () => {
  customColors = {ink: document.getElementById('customInk').value, background: document.getElementById('customBackground').value};
  localStorage.setItem('azbuk-custom-colors', JSON.stringify(customColors));
  THEMES[customThemeIndex].v = customThemeValues();
  applyTheme(customThemeIndex);
});
const savedTheme = Number(localStorage.getItem('azbuk-theme') || 0);
let themeIdx = Number.isSafeInteger(savedTheme) ? savedTheme : 0;
function applyTheme(i) {
  themeIdx = ((i % THEMES.length) + THEMES.length) % THEMES.length;
  const t = THEMES[themeIdx];
  document.documentElement.style.setProperty('--range-value', t.name === 'ЧБ' ? '#007a28' : '#39f88a');
  const background = t.v['--bg'];
  const brightness = .2126 * parseInt(background.slice(1, 3), 16) + .7152 * parseInt(background.slice(3, 5), 16) + .0722 * parseInt(background.slice(5, 7), 16);
  document.documentElement.style.setProperty('--edit-ink', brightness > 160 ? '#b88700' : '#ffe600');
  document.documentElement.style.setProperty('--edit-glow', brightness > 160 ? '#936600' : '#ffe600');
  document.documentElement.classList.toggle('rainbow', t.name === 'радуга');
  for (const k of Object.keys(t.v)) document.documentElement.style.setProperty(k, t.v[k]);
  localStorage.setItem('azbuk-theme', String(themeIdx));
  renderPaletteSwatches();
  document.getElementById('fieldGridColor').value = fieldGridColor || t.v['--line'];
  renderTextPreview();
}
const paletteSwatches = document.getElementById('paletteSwatches');
const customPalette = document.getElementById('customPalette');
THEMES.slice(0, customThemeIndex).forEach((theme, i) => {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'palette-swatch'; button.dataset.theme = i;
  button.setAttribute('aria-label', theme.name); button.title = theme.name;
  button.innerHTML = '<span class="swatch-ink" aria-hidden="true"></span>';
  button.addEventListener('click', () => applyTheme(i));
  paletteSwatches.insertBefore(button, customPalette);
});
function renderPaletteSwatches() {
  paletteSwatches.querySelectorAll('[data-theme]').forEach(button => {
    const i = Number(button.dataset.theme), theme = THEMES[i];
    button.style.setProperty('--swatch-bg', theme.v['--bg']);
    button.style.setProperty('--swatch-ink', theme.v['--ink']);
    button.setAttribute('aria-pressed', String(i === themeIdx));
  });
  customPalette.style.setProperty('--swatch-bg', customColors.background);
  customPalette.style.setProperty('--swatch-ink', customColors.ink);
  customPalette.dataset.selected = String(themeIdx === customThemeIndex);
}
customPalette.addEventListener('focusin', () => {if (themeIdx !== customThemeIndex) applyTheme(customThemeIndex);});
customPalette.addEventListener('click', () => {if (themeIdx !== customThemeIndex) applyTheme(customThemeIndex);});
if (typeof applyTheme === 'function') applyTheme(themeIdx);

renderSheet(cellSize);
let sheetWidth = document.getElementById('sheet').clientWidth;
new ResizeObserver(([entry]) => {
  const width = entry.target.clientWidth;
  if (width !== sheetWidth) {
    sheetWidth = width;
    renderSheet(cellSize);
  }
}).observe(document.getElementById('sheet'));

trk.addEventListener('input', () => {
  track = trk.valueAsNumber;
  updateTrackDisplay();
  localStorage.setItem(trackKey, trk.value);
  renderAlphabet(cellSize);
});

function stepTrack(direction) {
  if (direction < 0) trk.stepDown();
  else trk.stepUp();
  trk.dispatchEvent(new Event('input', { bubbles: true }));
}
function trackZone(clientX) {
  const center = trackControl.querySelector('.gap-thumb').getBoundingClientRect().left;
  if (Math.abs(clientX - center) <= 10) return 0;
  return clientX < center ? -1 : 1;
}
function hoverTrack(clientX) {
  const zone = trackZone(clientX);
  trackControl.classList.toggle('over-prev', zone < 0);
  trackControl.classList.toggle('over-next', zone > 0);
  trackControl.classList.toggle('over-thumb', zone === 0);
}
let trackGesture = null;
let trackRepeat;
function stopTrackGesture() {
  clearTimeout(trackRepeat);
  trackGesture = null;
  trackControl.classList.remove('dragging');
}
trackControl.addEventListener('pointerdown', e => {
  if (e.button !== 0 || trackGesture) return;
  e.preventDefault();
  const direction = trackZone(e.clientX);
  trackGesture = { pointerId: e.pointerId, direction, startX: e.clientX, startValue: trk.valueAsNumber, travel: trackControl.querySelector('.gap-travel').getBoundingClientRect().width };
  trackControl.setPointerCapture(e.pointerId);
  trk.focus({ preventScroll: true });
  if (direction === 0) {
    trackControl.classList.add('dragging');
  } else {
    const repeat = () => { stepTrack(direction); trackRepeat = setTimeout(repeat, 90); };
    stepTrack(direction);
    trackRepeat = setTimeout(repeat, 400);
  }
});
trackControl.addEventListener('pointermove', e => {
  hoverTrack(e.clientX);
  if (!trackGesture || trackGesture.pointerId !== e.pointerId) return;
  if (trackGesture.direction === 0) {
    const span = Number(trk.max) - Number(trk.min);
    const travel = trackGesture.travel;
    trk.value = trackGesture.startValue + Math.round((e.clientX - trackGesture.startX) * span / travel);
    trk.dispatchEvent(new Event('input', { bubbles: true }));
  } else {
    const bounds = trackControl.getBoundingClientRect();
    if (trackZone(e.clientX) !== trackGesture.direction || e.clientY < bounds.top || e.clientY > bounds.bottom) {
      clearTimeout(trackRepeat);
    }
  }
});
trackControl.addEventListener('pointerup', e => {
  if (trackGesture?.pointerId !== e.pointerId) return;
  stopTrackGesture();
  if (trackControl.hasPointerCapture(e.pointerId)) trackControl.releasePointerCapture(e.pointerId);
});
trackControl.addEventListener('pointercancel', stopTrackGesture);
trackControl.addEventListener('lostpointercapture', stopTrackGesture);
trackControl.addEventListener('pointerleave', () => {
  trackControl.classList.remove('over-prev', 'over-next', 'over-thumb');
});
window.addEventListener('blur', stopTrackGesture);
document.querySelectorAll('.gap-step').forEach(button => {
  button.addEventListener('click', e => {
    if (e.detail === 0) stepTrack(button.classList.contains('prev') ? -1 : 1);
  });
});

renderEditor();

</script>
</html>
