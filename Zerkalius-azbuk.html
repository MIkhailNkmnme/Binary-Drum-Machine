<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Zerkalius АзъБукъ v0.014</title>
<!-- АзъБукъ — v0.014. Клетки непрерывных штрихов соприкасаются и при наклоне. v0.013. Межбуквенный зазор считается по закрашенным клеткам на обеих сетках. v0.012. Зазор задаётся в долях ширины буквы от 0 до 1. v0.011: Ползунок «зазор» — расстояние между буквами от 0 до одной ширины буквы. v0.010: исправлены исходные тонкие буквы и знаки. v0.009: В образцах кнопок добавлена ячейка 1 px, уточнено название тонкого начертания. v0.008: раздел «В кнопках» — битовые подписи внутри кнопок-ромбоидов разной высоты. v0.007: v0.007: пресеты цветов — кнопка «цвет» переключает фиолетовый, золото, бирюзу, алый и день; выбор запоминается.
     v0.006: ромбосетка из треугольников (строки сдвинуты на полклетки) и один общий блок знаков.
     v0.005: в редакторе работает протяжка. v0.004: размеры ячейки 1 и 16 px.
     v0.003: два веса — обычный и «в одну клетку»; отдельные правки для каждого веса, выгрузка JSON.
     v0.002: ручной редактор глифов. Шрифт: буквы на треугольной решётке, как в шапке «Зазеркалиус». -->
<style>
  :root{ --bg:#07060b; --ink:#e6dff7; --dim:#8e84a8; --line:rgba(176,108,255,.18); --grid:rgba(176,108,255,.06); --btn:#0c0a14; --btnh:#171029; --btnon:#241a3b; --card:rgba(10,8,19,.6); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,sans-serif;
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 26px)}
  header{display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .title,#head{display:flex;align-items:center;gap:10px;min-width:0}
  .title{max-width:100%}
  #head .pbtn{min-width:0}
  #head svg{max-width:100%;height:auto}
  .ver{flex:none;font-size:10px;color:var(--dim);letter-spacing:.08em}
  .bar{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bar .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 2px 0 8px}
  button{background:var(--btn);color:var(--ink);border:1px solid var(--line);height:26px;min-width:34px;
    font:11px/1 "Segoe UI";cursor:pointer;padding:0 10px;
    clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
  button:hover{background:var(--btnh);border-color:var(--line)}
  button.on{background:var(--btnon);border-color:var(--line)}
  main{padding:20px 26px 60px;max-width:1500px;margin:0 auto}
  section{margin:0 0 26px;padding:14px 18px;border:1px solid var(--line);background:var(--card)}
  h2{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .row{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin:0 0 12px}
  .row:last-child{margin-bottom:0}
  svg{display:block;flex:0 0 auto;color:var(--ink)}

  .btns{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px;align-items:center}
  .btns.col{flex-direction:column;align-items:flex-start}
  .pbtn{position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0 16px;
    background:var(--line);
    clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
  .pbtn::before{content:"";position:absolute;inset:1px;z-index:0;background:var(--btn);
    clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
  .pbtn > svg{position:relative;z-index:1}
  .pbtn:hover{background:var(--btnon)}
  #editor .chars{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px;max-height:150px;overflow:auto}
  #editor .chars button{width:34px;padding:0;font-size:12px}
  .work{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .grid{display:grid;gap:2px;background:#0b0813;padding:6px;border:1px solid var(--line);user-select:none;touch-action:none}
  .cell{width:22px;height:22px;background:#12101c;border:1px solid #1d1930;cursor:pointer}
  .cell:hover{border-color:rgba(176,108,255,.6)}
  .cell.on{background:#cfc0ff;border-color:#e6dbff}
  .side{display:flex;flex-direction:column;gap:10px}
  .side .tools{display:flex;flex-wrap:wrap;gap:6px;max-width:420px}
  .prev{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .note{color:var(--dim);font-size:11px;max-width:420px;line-height:1.5}
</style>

<header>
  <div class="title">
    <div id="head" role="heading" aria-level="1" aria-label="АзъБукъ"></div>
    <span class="ver">v0.014</span>
  </div>
  <div class="bar">
    <button id="editToggle">Редактировать</button><button id="theme">цвет: фиолет</button>
    <span class="lbl">толщина</span>
    <button data-set="bold" class="on">обычная</button>
    <button data-set="thin" title="Тонкое начертание букв">тонкая</button>
    <label class="lbl" for="track" title="Зазор в долях ширины буквы">зазор</label><input id="track" type="range" title="Зазор в долях ширины буквы" min="0" max="1" step="0.01" value="0.12"><span id="trackVal" style="font-size:11px;color:var(--dim);min-width:34px">0,12</span><span class="lbl">сетка</span><button data-lat="tri" class="on">ромбы</button><button data-lat="sq">квадрат</button><span class="lbl">ячейка</span>
    <button data-cell="1">1</button><button data-cell="2">2</button><button data-cell="3">3</button><button data-cell="4" class="on">4</button><button data-cell="6">6</button><button data-cell="8">8</button><button data-cell="16">16</button>
  </div>
</header>

<main>
  <section id="editor" hidden>
    <h2>Правка буквы <span id="editCharName" style="color:#cfc0ff"></span> <span id="editSetName" style="color:#8e84a8"></span></h2>
    <div class="chars" id="chars"></div>
    <div class="work">
      <div class="grid" id="grid"></div>
      <div class="side">
        <div class="prev" id="prev"></div>
        <div class="tools">
          <button id="addCol">+ столбец</button>
          <button id="delCol">− столбец</button>
          <button id="addRow">+ строка</button>
          <button id="delRow">− строка</button>
          <button id="resetChar">Сбросить букву</button>
          <button id="save">Сохранить</button>
          <button id="download">Скачать JSON</button>
          <button id="resetAll">Сбросить всё</button>
        </div>
        <div class="note">Щелчок по клетке включает и выключает точку. Правки хранятся в браузере (localStorage) отдельно для каждого веса и сразу видны в алфавите. «Скачать JSON» отдаёт файл с обоими наборами.</div>
      </div>
    </div>
  </section>

  <div id="sheet"></div>
</main>

for (const set of ['bold', 'thin']) {
  for (const [ch, rows] of Object.entries(BASE[set])) {
    G[set][ch] = (EDITS[set] && EDITS[set][ch]) ? EDITS[set][ch].slice() : rows.slice();
  }
}

const AR = 1.156;
const UPPER = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';

function glyphShape(ch) {
  const rows = G[activeSet][ch];
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const slope = lattice === 'tri' ? 0.5 : 0;
  // Один наклон для всей буквы сохраняет общие вершины соседних клеток.
  const transform = 'matrix(1 0 ' + -slope + ' 1 ' + h * slope + ' 0)';
  const edges = [];
  let cells = '', joints = '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!rows[y] || rows[y][x] !== '1') continue;
    const left = x + (h - 1 - y) * slope;
    if (!edges[y]) edges[y] = { left, right: left + 1 };
    else edges[y].right = left + 1;
    // Закрепляем касание углами, чтобы сглаживание не разорвало диагональ.
    const above = rows[y - 1];
    if (above && above[x] !== '1') {
      for (const dx of [-1, 1]) {
        if (above[x + dx] === '1' && rows[y][x + dx] !== '1') {
          joints += 'M' + (dx < 0 ? x : x + 1) + ',' + y + 'h0';
        }
      }
    }
    cells += 'M' + x + ',' + y + 'h1v1h-1z';
  }
  let grid = '';
  for (let y = 0; y <= h; y++) grid += 'M0,' + y + 'H' + w;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      grid += 'M' + x + ',' + y + 'l1,1';
      grid += 'M' + (x + 1) + ',' + y + 'l-1,1';
    }
  }
  const id = 'g' + (uid++);
  const sw = activeSet === 'thin' ? 0.16 : 0.12;
  const paths = '<defs><clipPath id="' + id + '"><path d="' + cells + '"/></clipPath></defs>' +
    '<g transform="' + transform + '"><g clip-path="url(#' + id + ')"><rect width="' + w + '" height="' + h + '" fill="currentColor"/>' +
    '<path d="' + grid + '" stroke="var(--bg)" stroke-width="' + sw + '" fill="none"/>' +
    '<path d="' + cells + '" stroke="currentColor" stroke-width="' + sw + '" fill="none"/></g>' +
    '<path d="' + joints + '" stroke="currentColor" stroke-width="0.24" stroke-linecap="round"/></g>';
  const occupied = edges.filter(Boolean);
  const left = occupied.length ? Math.min(...occupied.map(e => e.left)) : 0;
  const right = occupied.length ? Math.max(...occupied.map(e => e.right)) + slope : w;
  return { h, edges, left, right, paths };
}

function lettering(text, cell, maxWidth = Infinity) {
  const lines = [];
  let placed = [], frontier = new Map(), width = 0, height = 0, gap = 0;
  function finishLine() {
    const groups = placed.map(({ shape, x }) =>
      '<g transform="translate(' + x + ' ' + (height - shape.h) + ')">' + shape.paths + '</g>').join('');
    lines.push('<svg width="' + width * AR * cell + '" height="' + height * cell +
      '" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none">' + groups + '</svg>');
    placed = [];
    frontier.clear();
    width = height = gap = 0;
  }
  for (const ch of text) {
    const shape = glyphShape(ch);
    // Для каждой занятой строки совмещаем края битов с учётом общей нижней линии.
    const previous = placed.at(-1)?.shape;
    let sharedRow = false;
    let x = -Infinity;
    shape.edges.forEach((edge, y) => {
      const level = y - shape.h;
      if (previous?.edges[level + previous.h]) sharedRow = true;
      const end = frontier.get(level);
      if (end !== undefined) x = Math.max(x, end - edge.left);
    });
    if (!sharedRow) x = width - shape.left;
    x = Math.max(x + gap, -shape.left);
    if (placed.length && Math.max(width, x + shape.right) * AR * cell > maxWidth) {
      finishLine();
      x = -shape.left;
    }
    placed.push({ shape, x });
    shape.edges.forEach((edge, y) => frontier.set(y - shape.h, x + edge.right));
    height = Math.max(height, shape.h);
    width = Math.max(width, x + shape.right);
    gap = (shape.right - shape.left) * track;
    if (!shape.edges.length) {
      // Пустой знак из редактора сохраняет собственное место.
      frontier.clear();
    }
  }
  if (placed.length) finishLine();
  return lines.join('');
}

const row = text => '<div class="row">' + text.replaceAll('&', '&amp;').replaceAll('<', '&lt;') + '</div>';

function renderSheet(cell) {
  document.getElementById('head').innerHTML = btn('АЗЪ', 4, 'height:38px') + btn('БУКЪ', 4, 'height:38px');
  document.getElementById('sheet').innerHTML = [
    renderButtons(),
    '<section><h2>Кириллица</h2>' + row(UPPER) + row(LOWER) + '</section>',
    '<section><h2>Латиница</h2>' + row(LATU) + row(LATL) + '</section>',
    '<section><h2>Цифры и знаки</h2>' + row(DIGIT) + row(SYM) + '</section>',
    '<section><h2>Слова</h2>' + row('ЗЕРКАЛИУС') + row('СИНХРОМБ') + row('ТРЕУГОЛЬНИК') + '</section>',
  ].join('');
  const rows = document.querySelectorAll('#sheet .row');
  const maxWidth = rows[0].getBoundingClientRect().width;
  rows.forEach(el => { el.innerHTML = lettering(el.textContent, cell, maxWidth); });
}

function renderChars() {
  document.getElementById('chars').innerHTML = [...ALL].map(c =>
    '<button data-ch="' + c + '"' + (c === editChar ? ' class="on"' : '') + '>' + c + '</button>').join('');
  document.querySelectorAll('#chars button').forEach(b => b.addEventListener('click', () => {
    editChar = b.dataset.ch; renderChars(); renderEditor();
  }));
}

function normalize(rows) {
  const w = Math.max(1, ...rows.map(r => r.length));
  return rows.map(r => r.padEnd(w, '0'));
}

function renderEditor() {
  document.getElementById('editCharName').textContent = editChar;
  document.getElementById('editSetName').textContent = activeSet === 'thin' ? '· тонкая' : '· обычная';
  const rows = normalize(G[activeSet][editChar] || ['000']);
  const h = rows.length, w = rows[0].length;
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = 'repeat(' + w + ', 22px)';
  grid.innerHTML = rows.map((r, y) => [...r].map((v, x) =>
    '<div class="cell' + (v === '1' ? ' on' : '') + '" data-x="' + x + '" data-y="' + y + '"></div>').join('')).join('');
  // протяжка: тянем мышь — все клетки под курсором меняются в одну сторону
  let drag = null;
  const setBit = (x, y, val) => {
    const r = (G[activeSet][editChar] || ['0']).slice();
    while (r.length <= y) r.push('');
    const line = (r[y] || '').padEnd(x + 1, '0');
    if (line[x] === val) return;
    r[y] = line.slice(0, x) + val + line.slice(x + 1);
    G[activeSet][editChar] = normalize(r);
  };
  const cellAt = (el) => el && el.classList && el.classList.contains('cell') ? el : null;

  grid.addEventListener('pointerdown', (e) => {
    const el = cellAt(e.target);
    if (!el) return;
    e.preventDefault();
    const on = el.classList.contains('on');
    drag = { val: on ? '0' : '1' };
    el.setPointerCapture(e.pointerId);
    setBit(+el.dataset.x, +el.dataset.y, drag.val);
    el.classList.toggle('on', drag.val === '1');
    document.getElementById('prev').innerHTML = [3, 4, 6].map(s => lettering(editChar, s)).join('');
  });

  grid.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const el = cellAt(document.elementFromPoint(e.clientX, e.clientY));
    if (!el) return;
    setBit(+el.dataset.x, +el.dataset.y, drag.val);
    el.classList.toggle('on', drag.val === '1');
  })

  const endDrag = () => {
    if (!drag) return;
    drag = null;
    commit();
    document.getElementById('prev').innerHTML = [3, 4, 6].map(s => lettering(editChar, s)).join('');
    renderSheet(cellSize);
  };
  grid.addEventListener('pointerup', endDrag);
  grid.addEventListener('pointercancel', endDrag);
  window.addEventListener('pointerup', endDrag);
  document.getElementById('prev').innerHTML = [3, 4, 6].map(s => lettering(editChar, s)).join('');
}

function commit() {
  EDITS[activeSet][editChar] = G[activeSet][editChar];
  localStorage.setItem(KEY, JSON.stringify(EDITS));
}

const mod = (fn) => () => { G[activeSet][editChar] = fn(G[activeSet][editChar] || ['0']); commit(); renderEditor(); renderSheet(cellSize); };
document.getElementById('addCol').onclick = mod(r => normalize(r.map(x => x + '0')));
document.getElementById('delCol').onclick = mod(r => normalize(r.map(x => x.slice(0, Math.max(1, x.length - 1)))));
document.getElementById('addRow').onclick = mod(r => normalize([...r, '0'.repeat(r[0].length)]));
document.getElementById('delRow').onclick = mod(r => normalize(r.length > 1 ? r.slice(0, -1) : r));
document.getElementById('resetChar').onclick = () => { if (BASE[activeSet][editChar]) { G[activeSet][editChar] = BASE[activeSet][editChar].slice(); delete EDITS[activeSet][editChar]; localStorage.setItem(KEY, JSON.stringify(EDITS)); } renderEditor(); renderSheet(cellSize); };
document.getElementById('resetAll').onclick = () => { EDITS = { bold: {}, thin: {} }; localStorage.removeItem(KEY); for (const s of ['bold','thin']) for (const [ch, rows] of Object.entries(BASE[s])) G[s][ch] = rows.slice(); renderEditor(); renderSheet(cellSize); };
document.getElementById('save').onclick = () => { commit(); const b = document.getElementById('save'); b.textContent = 'Сохранено'; setTimeout(() => b.textContent = 'Сохранить', 1200); };
document.getElementById('download').onclick = () => {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ bold: G.bold, thin: G.thin }));
  a.download = 'azbuk-glyphs.json';
  a.click();
};

document.getElementById('editToggle').addEventListener('click', (e) => {
  const ed = document.getElementById('editor');
  ed.hidden = !ed.hidden;
  e.target.classList.toggle('on', !ed.hidden);
  if (!ed.hidden) { renderChars(); renderEditor(); }
});

document.querySelectorAll('.bar [data-set]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.bar [data-set]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  activeSet = b.dataset.set;
  renderSheet(cellSize);
  if (!document.getElementById('editor').hidden) { renderChars(); renderEditor(); }
}));

document.querySelectorAll('.bar [data-lat]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.bar [data-lat]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  lattice = b.dataset.lat;
  renderSheet(cellSize);
}));

document.querySelectorAll('.bar [data-cell]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.bar [data-cell]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  cellSize = Number(b.dataset.cell);
  renderSheet(cellSize);
}));

const THEMES = [
  { name: 'фиолет', v: { '--bg': '#07060b', '--ink': '#e6dff7', '--dim': '#8e84a8', '--line': 'rgba(176,108,255,.18)', '--grid': 'rgba(176,108,255,.06)', '--btn': '#0c0a14', '--btnh': '#171029', '--btnon': '#241a3b', '--card': 'rgba(10,8,19,.6)' } },
  { name: 'золото', v: { '--bg': '#0b0906', '--ink': '#f4e6bd', '--dim': '#a08d63', '--line': 'rgba(217,178,90,.22)', '--grid': 'rgba(217,178,90,.07)', '--btn': '#141008', '--btnh': '#20180a', '--btnon': '#2e2410', '--card': 'rgba(20,15,6,.7)' } },
  { name: 'бирюза', v: { '--bg': '#050b0b', '--ink': '#d8f6ef', '--dim': '#6f9c96', '--line': 'rgba(79,216,192,.22)', '--grid': 'rgba(79,216,192,.07)', '--btn': '#071413', '--btnh': '#0c2220', '--btnon': '#123029', '--card': 'rgba(6,18,17,.7)' } },
  { name: 'алый', v: { '--bg': '#0b0506', '--ink': '#f7dcdd', '--dim': '#a07579', '--line': 'rgba(224,85,95,.22)', '--grid': 'rgba(224,85,95,.07)', '--btn': '#14070a', '--btnh': '#200c11', '--btnon': '#2e1218', '--card': 'rgba(20,7,9,.7)' } },
  { name: 'день', v: { '--bg': '#ecebf3', '--ink': '#181224', '--dim': '#6b6280', '--line': 'rgba(90,60,150,.25)', '--grid': 'rgba(90,60,150,.10)', '--btn': '#ffffff', '--btnh': '#e6e3f2', '--btnon': '#d8d2ee', '--card': 'rgba(255,255,255,.75)' } },
];
let themeIdx = Number(localStorage.getItem('azbuk-theme') || 0) % THEMES.length;
function applyTheme(i) {
  themeIdx = ((i % THEMES.length) + THEMES.length) % THEMES.length;
  const t = THEMES[themeIdx];
  for (const k of Object.keys(t.v)) document.documentElement.style.setProperty(k, t.v[k]);
  localStorage.setItem('azbuk-theme', String(themeIdx));
  const btn = document.getElementById('theme');
  if (btn) btn.textContent = 'цвет: ' + t.name;
}
document.getElementById('theme').addEventListener('click', () => applyTheme(themeIdx + 1));
if (typeof applyTheme === 'function') applyTheme(themeIdx);

renderSheet(cellSize);
let sheetWidth = document.getElementById('sheet').clientWidth;
new ResizeObserver(([entry]) => {
  const width = entry.target.clientWidth;
  if (width !== sheetWidth) {
    sheetWidth = width;
    renderSheet(cellSize);
  }
}).observe(document.getElementById('sheet'));

trackVal.textContent = track.toLocaleString('ru-RU');
trk.addEventListener('input', () => {
  track = trk.valueAsNumber;
  trackVal.textContent = track.toLocaleString('ru-RU');
  localStorage.setItem('azbuk-track', String(track));
  renderSheet(cellSize);
});

if (location.search.includes('edit')) {
  document.getElementById('editor').hidden = false;
  document.getElementById('editToggle').classList.add('on');
  renderChars(); renderEditor();
}
</script>
</html>
