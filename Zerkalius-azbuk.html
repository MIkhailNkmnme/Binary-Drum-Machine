<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Zerkalius АзъБукъ v0.003</title>
<!-- АзъБукъ — v0.003. Битовый шрифт проекта: буквы на треугольной решётке, как в шапке «Зазеркалиус».
     v0.003: два веса — обычный и «в одну клетку» (утоньшение Чжана–Суэня); переключатель веса,
     отдельные правки для каждого веса, выгрузка JSON с обоими наборами.
     v0.002: ручной редактор глифов. -->
<style>
  :root{ --bg:#07060b; --ink:#e6dff7; --dim:#8e84a8; --line:rgba(176,108,255,.18); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,sans-serif;
    background-image:
      repeating-linear-gradient(0deg, rgba(176,108,255,.06) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(176,108,255,.06) 0 1px, transparent 1px 26px)}
  header{display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .title{color:var(--ink);display:flex;align-items:center;gap:6px}
  .ver{font-size:11px;color:var(--dim);letter-spacing:.08em}
  .bar{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bar .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 2px 0 8px}
  button{background:#0c0a14;color:var(--ink);border:1px solid var(--line);height:26px;min-width:34px;
    font:11px/1 "Segoe UI";cursor:pointer;padding:0 10px;
    clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
  button:hover{background:#171029;border-color:rgba(176,108,255,.5)}
  button.on{background:#241a3b;border-color:rgba(176,108,255,.75)}
  main{padding:20px 26px 60px;max-width:1500px;margin:0 auto}
  section{margin:0 0 26px;padding:14px 18px;border:1px solid var(--line);background:rgba(10,8,19,.6)}
  h2{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .row{display:flex;align-items:flex-end;flex-wrap:wrap;row-gap:14px;margin:0 0 12px}
  .row:last-child{margin-bottom:0}
  svg{display:block;flex:0 0 auto;color:var(--ink)}

  #editor .chars{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px;max-height:150px;overflow:auto}
  #editor .chars button{width:34px;padding:0;font-size:12px}
  .work{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .grid{display:grid;gap:2px;background:#0b0813;padding:6px;border:1px solid var(--line)}
  .cell{width:22px;height:22px;background:#12101c;border:1px solid #1d1930;cursor:pointer}
  .cell:hover{border-color:rgba(176,108,255,.6)}
  .cell.on{background:#cfc0ff;border-color:#e6dbff}
  .side{display:flex;flex-direction:column;gap:10px}
  .side .tools{display:flex;flex-wrap:wrap;gap:6px;max-width:420px}
  .prev{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .note{color:var(--dim);font-size:11px;max-width:420px;line-height:1.5}
</style>

<header>
  <div class="title" id="head"></div>
  <div class="ver">v0.003</div>
  <div class="bar">
    <button id="editToggle">Редактировать</button>
    <span class="lbl">толщина</span>
    <button data-set="bold" class="on">обычная</button>
    <button data-set="thin">в клетку</button>
    <span class="lbl">ячейка</span>
    <button data-cell="2">2</button><button data-cell="3">3</button><button data-cell="4" class="on">4</button><button data-cell="6">6</button><button data-cell="8">8</button>
  </div>
</header>

<main>
  <section id="editor" hidden>
    <h2>Правка буквы <span id="editCharName" style="color:#cfc0ff"></span> <span id="editSetName" style="color:#8e84a8"></span></h2>
    <div class="chars" id="chars"></div>
    <div class="work">
      <div class="grid" id="grid"></div>
      <div class="side">
        <div class="prev" id="prev"></div>
        <div class="tools">
          <button id="addCol">+ столбец</button>
          <button id="delCol">− столбец</button>
          <button id="addRow">+ строка</button>
          <button id="delRow">− строка</button>
          <button id="resetChar">Сбросить букву</button>
          <button id="save">Сохранить</button>
          <button id="download">Скачать JSON</button>
          <button id="resetAll">Сбросить всё</button>
        </div>
        <div class="note">Щелчок по клетке включает и выключает точку. Правки хранятся в браузере (localStorage) отдельно для каждого веса и сразу видны в алфавите. «Скачать JSON» отдаёт файл с обоими наборами.</div>
      </div>
    </div>
  </section>

  <div id="sheet"></div>
</main>

,"010101","011011"],"x":["111"],"y":["100001","010001","011111","000001","011111"],"z":["1111000","0001000","0001000","0011000","0101111"],".":["00","00","00","00","00","00","11","11"],",":["1","1"],":":["00","00","00","11","11","00","11","11"],";":["1","1"],"!":["01","10","00","00","00","11"],"?":["01110","10001","00001","00011","01110","00000","01110"],"-":["111111"],"+":["111111"],"=":["1111111","0000000","1111111"],"/":["0000001","0000010","0000100","0001000","0010000","0100000","1000000"],"\\":["1000000","0100000","0010000","0001000","0000100","0000010","0000001"],"%":["0110001","1010010","1100100","0001000","0010011","0100101","1000110"],"(":["01","01","10","01","01"],")":["1","1","1","1","1"],"[":["0111","1000","1000","1000","1000","1000","0111"],"]":["111","001","001","001","001","001","111"],"{":["01","01","10","10","10","01","01"],"}":["10","10","01","01","01","10","10"],"<":["1","1","1"],">":["1","1","1"],"«":["0110","1101","1011","1101","0110"],"»":["0110","1011","1101","1011","0110"],"\"":["1001"],"'":["1"],"№":["1100010","1010101","1010101","1010101","1010010","1010000","1010111"],"#":["1111","1001","1001","1001","1111"],"@":["0111110","1000001","1011101","1010101","1011111","1000000","0111110"],"&":["111000","101000","101000","111000","101101","100110","111100"],"*":["1111111"],"_":["1111111"],"|":["1","1","1","1","1"],"~":["0110000","1001001","0000110"],"^":["111"],"$":["011111","010100","011111","000101","111111"]} };
const KEY = 'azbuk-edits-v2';
let EDITS = { bold: {}, thin: {} };
try { EDITS = Object.assign(EDITS, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const G = { bold: {}, thin: {} };
for (const set of ['bold', 'thin']) {
  for (const [ch, rows] of Object.entries(BASE[set])) {
    G[set][ch] = (EDITS[set] && EDITS[set][ch]) ? EDITS[set][ch].slice() : rows.slice();
  }
}

const AR = 1.156;
const UPPER = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
const LOWER = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя';
const LATU = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LATL = 'abcdefghijklmnopqrstuvwxyz';
const DIGIT = '0123456789';
const SYM = '.,:;!?-+=/\\%()[]{}<>«»"\'№#@&*_|~^$';
const ALL = UPPER + LOWER + LATU + LATL + DIGIT + SYM;
let uid = 0;
let cellSize = 4;
let activeSet = 'bold';
let editChar = 'А';

function glyph(ch, cell, gap, set) {
  const rows = G[set || activeSet][ch];
  if (!rows) return '';
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  let cells = '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!rows[y] || rows[y][x] !== '1') continue;
    cells += 'M' + x + ',' + y + 'h1v1h-1z';
  }
  let grid = '';
  for (let y = 0; y <= h; y++) grid += 'M0,' + y + 'H' + w;
  for (let y = 0; y < h; y++) for (let x = -1; x <= w; x++) {
    grid += 'M' + x + ',' + y + 'l1,1';
    grid += 'M' + (x + 1) + ',' + y + 'l-1,1';
  }
  const id = 'g' + (uid++);
  const style = 'margin-right:' + (gap * cell) + 'px;color:var(--ink)';
  const sw = (set || activeSet) === 'thin' ? 0.16 : 0.12;
  return '<svg style="' + style + '" width="' + (w * AR * cell) + '" height="' + (h * cell) + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<defs><clipPath id="' + id + '"><path d="' + cells + '"/></clipPath></defs>' +
    '<g clip-path="url(#' + id + ')"><rect width="' + w + '" height="' + h + '" fill="currentColor"/>' +
    '<path d="' + grid + '" stroke="#07060b" stroke-width="' + sw + '" fill="none"/></g></svg>';
}
const row = (text, cell, gap) => '<div class="row">' + [...text].map(c => glyph(c, cell, gap)).join('') + '</div>';

function renderSheet(cell) {
  document.getElementById('head').innerHTML = [...'АзъБукъ'].map(c => glyph(c, Math.max(3, cell), 1)).join('');
  document.getElementById('sheet').innerHTML = [
    '<section><h2>Заглавные</h2>' + row(UPPER, cell, 1) + '</section>',
    '<section><h2>Строчные</h2>' + row(LOWER, cell, 1) + '</section>',
    '<section><h2>Латиница</h2>' + row(LATU, cell, 1) + row(LATL, cell, 1) + '</section>',
    '<section><h2>Цифры и знаки</h2>' + row(DIGIT, cell, 1) + row(SYM, cell, 1) + '</section>',
    '<section><h2>Слова</h2>' + row('ЗЕРКАЛИУС', cell, 2) + row('СИНХРОМБ', cell, 2) + row('ТРЕУГОЛЬНИК', cell, 2) + '</section>',
  ].join('');
}

function renderChars() {
  document.getElementById('chars').innerHTML = [...ALL].map(c =>
    '<button data-ch="' + c + '"' + (c === editChar ? ' class="on"' : '') + '>' + c + '</button>').join('');
  document.querySelectorAll('#chars button').forEach(b => b.addEventListener('click', () => {
    editChar = b.dataset.ch; renderChars(); renderEditor();
  }));
}

function normalize(rows) {
  const w = Math.max(1, ...rows.map(r => r.length));
  return rows.map(r => r.padEnd(w, '0'));
}

function renderEditor() {
  document.getElementById('editCharName').textContent = editChar;
  document.getElementById('editSetName').textContent = activeSet === 'thin' ? '· тонкая' : '· обычная';
  const rows = normalize(G[activeSet][editChar] || ['000']);
  const h = rows.length, w = rows[0].length;
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = 'repeat(' + w + ', 22px)';
  grid.innerHTML = rows.map((r, y) => [...r].map((v, x) =>
    '<div class="cell' + (v === '1' ? ' on' : '') + '" data-x="' + x + '" data-y="' + y + '"></div>').join('')).join('');
  grid.querySelectorAll('.cell').forEach(el => el.addEventListener('click', () => {
    const x = +el.dataset.x, y = +el.dataset.y;
    const r = (G[activeSet][editChar] || ['0']).slice();
    while (r.length <= y) r.push('');
    const line = (r[y] || '').padEnd(x + 1, '0');
    r[y] = line.slice(0, x) + (line[x] === '1' ? '0' : '1') + line.slice(x + 1);
    G[activeSet][editChar] = normalize(r);
    commit(); renderEditor(); renderSheet(cellSize);
  }));
  document.getElementById('prev').innerHTML = [3, 4, 6].map(s => glyph(editChar, s, 1)).join('');
}

function commit() {
  EDITS[activeSet][editChar] = G[activeSet][editChar];
  localStorage.setItem(KEY, JSON.stringify(EDITS));
}

const mod = (fn) => () => { G[activeSet][editChar] = fn(G[activeSet][editChar] || ['0']); commit(); renderEditor(); renderSheet(cellSize); };
document.getElementById('addCol').onclick = mod(r => normalize(r.map(x => x + '0')));
document.getElementById('delCol').onclick = mod(r => normalize(r.map(x => x.slice(0, Math.max(1, x.length - 1)))));
document.getElementById('addRow').onclick = mod(r => normalize([...r, '0'.repeat(r[0].length)]));
document.getElementById('delRow').onclick = mod(r => normalize(r.length > 1 ? r.slice(0, -1) : r));
document.getElementById('resetChar').onclick = () => { if (BASE[activeSet][editChar]) { G[activeSet][editChar] = BASE[activeSet][editChar].slice(); delete EDITS[activeSet][editChar]; localStorage.setItem(KEY, JSON.stringify(EDITS)); } renderEditor(); renderSheet(cellSize); };
document.getElementById('resetAll').onclick = () => { EDITS = { bold: {}, thin: {} }; localStorage.removeItem(KEY); for (const s of ['bold','thin']) for (const [ch, rows] of Object.entries(BASE[s])) G[s][ch] = rows.slice(); renderEditor(); renderSheet(cellSize); };
document.getElementById('save').onclick = () => { commit(); const b = document.getElementById('save'); b.textContent = 'Сохранено'; setTimeout(() => b.textContent = 'Сохранить', 1200); };
document.getElementById('download').onclick = () => {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ bold: G.bold, thin: G.thin }));
  a.download = 'azbuk-glyphs.json';
  a.click();
};

document.getElementById('editToggle').addEventListener('click', (e) => {
  const ed = document.getElementById('editor');
  ed.hidden = !ed.hidden;
  e.target.classList.toggle('on', !ed.hidden);
  if (!ed.hidden) { renderChars(); renderEditor(); }
});

document.querySelectorAll('.bar [data-set]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.bar [data-set]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  activeSet = b.dataset.set;
  renderSheet(cellSize);
  if (!document.getElementById('editor').hidden) { renderChars(); renderEditor(); }
}));

document.querySelectorAll('.bar [data-cell]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.bar [data-cell]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  cellSize = Number(b.dataset.cell);
  renderSheet(cellSize);
}));

renderSheet(cellSize);
if (location.search.includes('edit')) {
  document.getElementById('editor').hidden = false;
  document.getElementById('editToggle').classList.add('on');
  renderChars(); renderEditor();
}
</script>
