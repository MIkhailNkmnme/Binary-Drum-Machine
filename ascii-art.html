<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ASCII-арт студия</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=Source+Code+Pro:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=VT323&family=Share+Tech+Mono&family=Press+Start+2P&family=Major+Mono+Display&family=Orbitron:wght@400;700&display=swap">
<style>
  /* Локальные шрифты из соседней папки fonts/ — работают офлайн.
     Если есть интернет, Google Fonts (ссылка выше) подменяет их своими версиями. */
  @font-face { font-family:"JetBrains Mono"; src:url("fonts/JetBrainsMono[wght].ttf"); font-weight:100 900 }
  @font-face { font-family:"Fira Code"; src:url("fonts/FiraCode[wght].ttf"); font-weight:100 900 }
  @font-face { font-family:"Source Code Pro"; src:url("fonts/SourceCodePro[wght].ttf"); font-weight:100 900 }
  @font-face { font-family:"Orbitron"; src:url("fonts/Orbitron[wght].ttf"); font-weight:100 900 }
  @font-face { font-family:"IBM Plex Mono"; src:url("fonts/IBMPlexMono-Regular.ttf"); font-weight:400 }
  @font-face { font-family:"IBM Plex Mono"; src:url("fonts/IBMPlexMono-Bold.ttf"); font-weight:700 }
  @font-face { font-family:"Space Mono"; src:url("fonts/SpaceMono-Regular.ttf"); font-weight:400 }
  @font-face { font-family:"Space Mono"; src:url("fonts/SpaceMono-Bold.ttf"); font-weight:700 }
  @font-face { font-family:"VT323"; src:url("fonts/VT323-Regular.ttf") }
  @font-face { font-family:"Share Tech Mono"; src:url("fonts/ShareTechMono-Regular.ttf") }
  @font-face { font-family:"Press Start 2P"; src:url("fonts/PressStart2P-Regular.ttf") }
  @font-face { font-family:"Major Mono Display"; src:url("fonts/MajorMonoDisplay-Regular.ttf") }
  :root { --bg:#111214; --panel:#1b1d21; --line:#2c2f35; --text:#d7d9de; --dim:#8a8f99; --acc:#5fd88a; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:12px/1.3 system-ui, Segoe UI, sans-serif; height:100vh; display:flex; overflow:hidden }
  aside { width:290px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0 }
  .panel { flex:1; overflow-y:auto; padding:8px 12px 10px; scrollbar-width:thin }
  main { flex:1; display:flex; flex-direction:column; min-width:0 }
  h1 { font-size:13px; margin:0 0 4px; font-weight:600 }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:9px 0 2px; border-top:1px solid var(--line); padding-top:6px }
  label { display:flex; align-items:center; justify-content:space-between; gap:6px; margin:2px 0; min-height:22px }
  label span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  label output { width:34px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums }
  input[type=range] { width:110px; accent-color:var(--acc); margin:0; height:18px }
  select, input[type=text], input[type=number], input[type=color] { background:#0f1012; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:2px 6px; font:inherit; width:148px; height:22px }
  input[type=color] { padding:1px; width:148px }
  input[type=checkbox] { margin:0 4px; accent-color:var(--acc) }
  .hidden { display:none !important }
  .zerk-range-wrap { width:148px !important; flex:none !important }   /* стрелки ◂ ▸ из slider-arrows.js */
  .row { display:flex; gap:5px; flex-wrap:wrap }
  .save { flex:none; padding:8px 12px; border-top:1px solid var(--line); background:var(--panel) }
  .save .row + .row { margin-top:5px }
  .save button { flex:1; padding:6px 4px; white-space:nowrap }
  button { background:#2a2d33; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 10px; font:inherit; cursor:pointer }
  button:hover { background:#33373f }
  button.primary { background:var(--acc); color:#0b1a10; border-color:var(--acc); font-weight:600 }
  button.primary:hover { filter:brightness(1.08) }
  .drop { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; position:relative }
  .drop.over::after { content:"Отпустите файлы"; position:absolute; inset:12px; border:2px dashed var(--acc); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--acc); background:rgba(0,0,0,.5) }
  canvas#out { max-width:100%; max-height:100%; box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6); background:#050507 }
  /* оригинал поверх предпросмотра, пока курсор на картинке в списке */
  #peek { position:absolute; inset:16px; object-fit:contain; background:var(--bg); z-index:5; pointer-events:none }
  .hint { color:var(--dim); text-align:center; line-height:1.7 }
  .hint kbd { background:#2a2d33; border-radius:4px; padding:1px 6px; border:1px solid var(--line) }
  .hint button.big { display:block; margin:0 auto 18px; padding:22px 40px; font-size:22px; font-weight:600; border-radius:14px;
    background:var(--acc); color:#0b1a10; border:none; box-shadow:0 8px 30px rgba(95,216,138,.25) }
  .hint button.big:hover { filter:brightness(1.08); transform:translateY(-1px) }
  .hint-sub { margin-bottom:14px }
  .hint-err { color:#f0a060; margin-top:12px; min-height:1.4em }
  .bar { flex:none; padding:6px 16px; border-top:1px solid var(--line); background:var(--panel) }
  .status { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .right { width:200px; flex:none; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0 }
  .right h2 { margin:8px 10px 4px; border:none; padding:0 }
  .folder { padding:0 6px 6px }
  .folder button { width:100%; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .folder .note { color:var(--dim); font-size:11px; padding:3px 4px 0 }
  .src { padding:0 10px 8px; border-bottom:1px solid var(--line) }
  .src img { display:block; width:100%; border-radius:5px; background:#000; box-shadow:0 0 0 1px var(--line) }
  .src .none { color:var(--dim); text-align:center; padding:18px 0; border:1px dashed var(--line); border-radius:5px }
  .list { flex:1; overflow-y:auto; padding:4px 6px 8px; scrollbar-width:thin }
  .item { display:flex; align-items:center; gap:6px; padding:3px 4px; border-radius:6px; cursor:pointer; border:1px solid transparent }
  .item:hover { background:#24272d }
  .item.active { background:#24272d; border-color:var(--acc) }
  .item img { width:54px; height:34px; object-fit:cover; border-radius:4px; background:#000; flex:none }
  .item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .item .rm { color:var(--dim); padding:0 3px; border-radius:4px; flex:none }
  .item .rm:hover { color:#f77; background:#33262a }
  small { color:var(--dim) }
</style>
</head>
<body>
<aside>
<div class="panel">
  <h1>ASCII-арт студия</h1>

  <h2>Режим</h2>
  <label><span>Символы</span>
    <select id="mode">
      <option value="code">Дамп кода</option>
      <option value="01">Только 0 и 1</option>
      <option value="custom">Свой набор →</option>
    </select></label>
  <label id="charsRow" class="hidden"><span>Свой набор</span><input type="text" id="chars" value="01" placeholder="например #@$"></label>

  <h2>Шрифт</h2>
  <label><span>Шрифт</span>
    <select id="font">
      <option value="Consolas">Consolas</option>
      <option value="Roboto Mono">Roboto Mono</option>
      <option value="JetBrains Mono">JetBrains Mono</option>
      <option value="Fira Code">Fira Code</option>
      <option value="Source Code Pro">Source Code Pro</option>
      <option value="IBM Plex Mono">IBM Plex Mono</option>
      <option value="Space Mono">Space Mono</option>
      <option value="VT323">VT323 (старый терминал)</option>
      <option value="Share Tech Mono">Share Tech Mono</option>
      <option value="Press Start 2P">Press Start 2P (пиксели)</option>
      <option value="Major Mono Display">Major Mono Display</option>
      <option value="Orbitron">Orbitron (sci-fi)</option>
      <option value="Courier New">Courier New</option>
      <option value="Lucida Console">Lucida Console</option>
    </select></label>
  <label><span>Свой .ttf / .otf</span><input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" style="width:148px;font-size:11px"></label>
  <label><span>Размер, px</span><input type="range" id="size" min="6" max="40" value="14"><output>14</output></label>
  <label><span>Жирный объект</span><input type="checkbox" id="bold" checked></label>

  <h2>Сетка</h2>
  <label><span>Колонок</span><input type="range" id="cols" min="40" max="600" value="240"><output>240</output></label>
  <label title="1 = обычный, 0.5 = наложение на 50 %, 1.5 = разрежено"><span>Межсимвольный</span><input type="range" id="sx" min="0.3" max="3" step="0.05" value="1"><output>1</output></label>
  <label title="1 = обычный, 0.5 = наложение на 50 %, 1.5 = разрежено"><span>Межстрочный</span><input type="range" id="sy" min="0.3" max="3" step="0.05" value="1"><output>1</output></label>

  <h2>Картинка</h2>
  <label title="Поля вокруг объекта в долях его размера"><span>Обрезка, поля</span><input type="range" id="crop" min="0" max="1" step="0.05" value="0.25"><output>0.25</output></label>
  <label><span>Пропорции</span>
    <select id="aspect">
      <option value="16:9">16:9</option>
      <option value="4:3">4:3</option>
      <option value="1:1">1:1</option>
      <option value="9:16">9:16</option>
      <option value="src">как у объекта</option>
      <option value="none">без обрезки</option>
    </select></label>
  <label><span>Инвертировать</span><input type="checkbox" id="invert"></label>
  <label><span>Контраст</span><input type="range" id="gamma" min="0.5" max="3" step="0.05" value="1.3"><output>1.3</output></label>
  <label><span>Яркость фона</span><input type="range" id="noise" min="0" max="0.5" step="0.01" value="0.12"><output>0.12</output></label>
  <label><span>Случайность</span><input type="number" id="seed" value="5" style="width:60px"></label>

  <h2>Цвет</h2>
  <label><span>Оттенок</span>
    <select id="tint">
      <option value="255,255,255">Серый</option>
      <option value="90,255,130">Зелёный</option>
      <option value="90,190,255">Голубой</option>
      <option value="255,160,60">Янтарный</option>
      <option value="custom">Свой →</option>
    </select></label>
  <label id="tintRow" class="hidden"><span>Свой цвет</span><input type="color" id="tintCustom" value="#5aff82"></label>
</div>
<div class="save">
  <div class="row">
    <button class="primary" id="savePng">PNG</button>
    <button id="saveHtml">HTML</button>
    <button id="saveTxt">TXT</button>
  </div>
  <div class="row">
    <button id="saveAll" title="Все загруженные картинки с текущими настройками">Все → PNG</button>
    <button id="saveBoth" title="Все картинки, серый и зелёный">Серый+зелёный</button>
    <button id="clearAll" title="Очистить список картинок">✕</button>
  </div>
</div>
</aside>

<main>
  <div class="drop" id="drop">
    <div class="hint" id="hint">
      <button class="big" id="pasteBtn">📋 Вставить из буфера</button>
      <div class="hint-sub">или <kbd>Ctrl+V</kbd>, или перетащите сюда один или несколько файлов</div>
      <button id="pickBtn">Выбрать файлы…</button>
      <div class="hint-err" id="pasteErr"></div>
    </div>
    <canvas id="out" hidden></canvas>
    <img id="peek" alt="" hidden>
  </div>
  <div class="bar"><div class="status" id="status"></div></div>
</main>

<aside class="right">
  <h2>Исходник</h2>
  <div class="src"><img id="srcImg" alt="" hidden><div class="none" id="srcNone">пусто</div></div>
  <h2>Картинки (<span id="count">0</span>)</h2>
  <div class="folder">
    <button id="folderBtn" title="Выбрать папку с картинками; страница её запомнит">📁 Открыть папку…</button>
    <div class="note" id="folderNote"></div>
  </div>
  <div class="list" id="list"></div>
</aside>

<script>
'use strict';
// ---------- наборы символов (те же, что в ascii_art.py) ----------
const LEVELS = [
  "        " + ".,:;-_=+~^'\"!|/\\()[]{}<>?*" + "abcdefghijklmnopqrstuvwxyz" + "0123456789",
  "!|/\\()[]{}<>=+*ilrjt",
  "1234567890?cvxzsuno",
  "abdefghkpqyLTYJIFCZ",
  "ABDEGHKNOPQRSUVXW#%&$@MW",
];
const BRIGHT = 0.6;

// ---------- утилиты ----------
const $ = id => document.getElementById(id);
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function percentile(sorted, p) { return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))]; }
function clipNum(n) { return n.toString().replace(/\.0+$/, ''); }

// ---------- состояние ----------
const sources = [];     // {name, img, thumb}
let current = -1;
let clipCounter = 0;
let lastCells = null, lastMeta = null;

function settings() {
  const mode = $('mode').value;
  const chars = mode === '01' ? '01' : mode === 'custom' ? ($('chars').value || '01') : null;
  const tintSel = $('tint').value;
  let tint;
  if (tintSel === 'custom') { const h = $('tintCustom').value; tint = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); }
  else tint = tintSel.split(',').map(Number);
  return {
    mode, chars, font: $('font').value, size: +$('size').value, bold: $('bold').checked,
    cols: +$('cols').value, sx: +$('sx').value, sy: +$('sy').value,
    crop: +$('crop').value, aspect: $('aspect').value, invert: $('invert').checked,
    gamma: +$('gamma').value, noise: +$('noise').value, seed: +$('seed').value || 0,
    tint, tintName: tintSel === '255,255,255' ? 'серый' : tintSel === '90,255,130' ? 'зелёный' : 'цвет',
  };
}

// ---------- обрезка по объекту ----------
function cropRect(img, s) {
  if (s.aspect === 'none') return { x: 0, y: 0, w: img.width, h: img.height };
  const scale = Math.min(1, 400 / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
  const c = new OffscreenCanvas(w, h), g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  let mn = 1, mx = 0; const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) { let v = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255; if (s.invert) v = 1 - v; lum[i] = v; if (v < mn) mn = v; if (v > mx) mx = v; }
  const thr = mn + (mx - mn) * 0.5;
  let x0 = w, x1 = -1, y0 = h, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (lum[y * w + x] > thr) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return { x: 0, y: 0, w: img.width, h: img.height };
  const bw = (x1 - x0) / scale, bh = (y1 - y0) / scale;
  let cw = bw * (1 + 2 * s.crop), ch = bh * (1 + 2 * s.crop);
  if (s.aspect !== 'src') { const [aw, ah] = s.aspect.split(':').map(Number); if (cw / ch < aw / ah) cw = ch * aw / ah; else ch = cw * ah / aw; }
  const cx = (x0 + x1) / 2 / scale, cy = (y0 + y1) / 2 / scale;
  return { x: cx - cw / 2, y: cy - ch / 2, w: cw, h: ch };
}

// ---------- картинка -> сетка яркостей ----------
function imageToGrid(img, s, charAspect) {
  const r = cropRect(img, s);
  const cols = s.cols, rows = Math.max(1, Math.round(r.h / r.w * cols * charAspect));
  const c = new OffscreenCanvas(cols, rows), g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = s.invert ? '#fff' : '#000'; g.fillRect(0, 0, cols, rows);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, cols, rows);
  const d = g.getImageData(0, 0, cols, rows).data;
  const arr = new Float32Array(cols * rows);
  for (let i = 0; i < cols * rows; i++) { let v = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255; arr[i] = s.invert ? 1 - v : v; }
  const sorted = Float32Array.from(arr).sort();
  const lo = percentile(sorted, 0.02), hi = percentile(sorted, 0.98);
  for (let i = 0; i < arr.length; i++) { let v = hi > lo ? Math.min(1, Math.max(0, (arr[i] - lo) / (hi - lo))) : arr[i]; arr[i] = Math.pow(v, s.gamma); }
  return { arr, cols, rows };
}

function gridToCells({ arr, cols, rows }, s) {
  const rng = mulberry32(s.seed);
  const cells = [];
  for (let y = 0; y < rows; y++) {
    const row = [];
    for (let x = 0; x < cols; x++) {
      const v = arr[y * cols + x];
      let ch;
      if (s.chars) ch = s.chars[Math.floor(rng() * s.chars.length)];
      else { const lv = Math.min(LEVELS.length - 1, Math.floor(v * LEVELS.length)); const set = LEVELS[lv]; ch = set[Math.floor(rng() * set.length)]; }
      const b = Math.min(1, Math.max(s.noise * (0.6 + rng() * 0.8), v));
      row.push([ch, b]);
    }
    cells.push(row);
  }
  return cells;
}

function cellRgb(b, tint) { const g = 30 + 225 * b; return `rgb(${Math.round(g * tint[0] / 255)},${Math.round(g * tint[1] / 255)},${Math.round(g * tint[2] / 255)})`; }

// ---------- рендер ----------
function fontSpec(s, bold) { return `${bold ? 'bold ' : ''}${s.size}px "${s.font}", monospace`; }

function measureCell(s) {
  const c = new OffscreenCanvas(10, 10), g = c.getContext('2d');
  g.font = fontSpec(s, false);
  const sample = (s.chars || 'M').replace(/ /g, '') || 'M';
  let cw = 0; for (const ch of sample) cw = Math.max(cw, g.measureText(ch).width);
  return { cw: cw * s.sx, ch: s.size * 1.15 * s.sy, cw0: cw };
}

function renderCanvas(canvas, cells, s, tint) {
  const { cw, ch } = measureCell(s);
  const rows = cells.length, cols = cells[0].length;
  canvas.width = Math.round(cols * cw + 2 * cw); canvas.height = Math.round(rows * ch + 2 * ch);
  const g = canvas.getContext('2d');
  g.fillStyle = '#050507'; g.fillRect(0, 0, canvas.width, canvas.height);
  g.textBaseline = 'top';
  const fReg = fontSpec(s, false), fBold = fontSpec(s, s.bold);
  // сначала фон, потом объект — меньше переключений шрифта
  for (const pass of [0, 1]) {
    g.font = pass ? fBold : fReg;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const [c, b] = cells[y][x];
      if ((b > BRIGHT) !== !!pass) continue;
      g.fillStyle = cellRgb(b, tint);
      g.fillText(c, cw + x * cw, ch + y * ch);
    }
  }
}

async function ensureFont(s) {
  try { await document.fonts.load(fontSpec(s, false)); await document.fonts.load(fontSpec(s, true)); } catch (e) { /* локальный или отсутствующий шрифт — рисуем чем есть */ }
}

let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 60); }

async function render() {
  if (current < 0) return;
  const s = settings(), src = sources[current];
  await ensureFont(s);
  const { cw0 } = measureCell(s);
  const grid = imageToGrid(src.img, s, (cw0 * s.sx) / (s.size * 1.15 * s.sy));
  const cells = gridToCells(grid, s);
  renderCanvas($('out'), cells, s, s.tint);
  lastCells = cells; lastMeta = { s, name: src.name };
  $('out').hidden = false; $('hint').hidden = true;
  $('status').textContent = `${src.name} — ${grid.cols}×${grid.rows} символов, ${$('out').width}×${$('out').height} px`;
}

// ---------- источники ----------
function renderList() {
  const list = $('list'); list.innerHTML = '';
  sources.forEach((src, i) => {
    const it = document.createElement('div'); it.className = 'item' + (i === current ? ' active' : ''); it.title = src.name;
    const im = document.createElement('img'); im.src = src.img.src;
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = src.name;
    const rm = document.createElement('span'); rm.className = 'rm'; rm.textContent = '✕'; rm.title = 'Убрать из списка';
    rm.onclick = e => { e.stopPropagation(); removeSource(i); };
    it.append(im, nm, rm); it.onclick = () => select(i);
    it.onmouseenter = () => peek(src); it.onmouseleave = () => peek(null);
    list.appendChild(it);
  });
  $('count').textContent = sources.length;
  const cur = sources[current];
  $('srcImg').hidden = !cur; $('srcNone').hidden = !!cur;
  if (cur) $('srcImg').src = cur.img.src;
}
function peek(src) { const pk = $('peek'); if (src) pk.src = src.img.src; pk.hidden = !src; }
$('srcImg').onmouseenter = () => { if (current >= 0) peek(sources[current]); };
$('srcImg').onmouseleave = () => peek(null);
function addSource(name, img) { sources.push({ name, img }); select(sources.length - 1); }
function select(i) { current = i; renderList(); scheduleRender(); }
function removeSource(i) {
  sources.splice(i, 1);
  if (!sources.length) { current = -1; renderList(); $('out').hidden = true; $('hint').hidden = false; $('status').textContent = ''; return; }
  select(Math.min(i, sources.length - 1));
}
function loadFile(file, name) {
  return new Promise(res => { const img = new Image(); img.onload = () => { addSource(name, img); res(); }; img.src = URL.createObjectURL(file); });
}
async function handleFiles(files) {
  for (const f of files) if (f.type.startsWith('image/')) await loadFile(f, f.name.replace(/\.[^.]+$/, ''));
}

document.addEventListener('paste', async e => {
  const items = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/'));
  if (!items.length) return;
  e.preventDefault();
  for (const it of items) await loadFile(it.getAsFile(), `Буферобмена№${++clipCounter}`);
});
const drop = $('drop');
document.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
document.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); handleFiles(e.dataTransfer.files); });
function pickFiles() { const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.accept = 'image/*'; i.onchange = () => handleFiles(i.files); i.click(); }
$('pickBtn').onclick = e => { e.stopPropagation(); pickFiles(); };

// Кнопка «Вставить из буфера»: читает буфер через Clipboard API (нужно разрешение браузера);
// если браузер не даёт — подсказываем Ctrl+V, он работает всегда.
$('pasteBtn').onclick = async e => {
  e.stopPropagation();
  const err = $('pasteErr'); err.textContent = '';
  try {
    if (!navigator.clipboard?.read) throw new Error('noapi');
    const items = await navigator.clipboard.read();
    let found = 0;
    for (const it of items) {
      const type = it.types.find(t => t.startsWith('image/'));
      if (!type) continue;
      const blob = await it.getType(type);
      await loadFile(new File([blob], 'clip.png', { type }), `Буферобмена№${++clipCounter}`);
      found++;
    }
    if (!found) err.textContent = 'В буфере нет картинки — сделайте скриншот или «Копировать изображение»';
  } catch (ex) {
    err.textContent = ex.name === 'NotAllowedError'
      ? 'Браузер не дал доступ к буферу — разрешите в адресной строке или нажмите Ctrl+V'
      : 'Этот браузер не умеет читать буфер кнопкой — нажмите Ctrl+V';
  }
};

// ---------- папка с картинками (File System Access API, Chrome/Edge) ----------
// Выбранная папка запоминается в IndexedDB; при следующем открытии страницы
// браузер спросит разрешение одним кликом (или даст сразу, если разрешили «всегда»).
const idb = {
  open: () => new Promise((res, rej) => { const r = indexedDB.open('ascii-studio', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  get: async k => { const db = await idb.open(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  set: async (k, v) => { const db = await idb.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
};
let dirHandle = null;
const IMG_EXT = /\.(png|jpe?g|gif|bmp|webp)$/i;

async function loadFolder(h) {
  dirHandle = h;
  const have = new Set(sources.map(s => s.name));
  const files = [];
  for await (const [name, entry] of h.entries()) if (entry.kind === 'file' && IMG_EXT.test(name)) files.push(entry);
  files.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  let added = 0;
  for (const entry of files) {
    const stem = entry.name.replace(/\.[^.]+$/, '');
    if (have.has(stem)) continue;
    await loadFile(await entry.getFile(), stem); added++;
  }
  $('folderBtn').textContent = `📁 ${h.name} — обновить`;
  $('folderNote').textContent = added ? `загружено: ${added}` : files.length ? 'новых картинок нет' : 'в папке нет картинок';
}

async function pickFolder() {
  try {
    const h = await window.showDirectoryPicker({ id: 'kartiny', mode: 'read' });
    await idb.set('dir', h).catch(() => {});
    await loadFolder(h);
  } catch (e) { if (e.name !== 'AbortError') $('folderNote').textContent = 'Не удалось открыть папку'; }
}

async function restoreFolder() {
  if (!window.showDirectoryPicker) { $('folderBtn').disabled = true; $('folderNote').textContent = 'Нужен Chrome или Edge'; return; }
  let h = null;
  try { h = await idb.get('dir'); } catch (e) { /* нет сохранённой папки */ }
  if (!h) return;
  $('folderBtn').textContent = `📁 ${h.name} — загрузить`;
  const perm = await h.queryPermission({ mode: 'read' });
  if (perm === 'granted') await loadFolder(h);
  else $('folderNote').textContent = 'нажмите, чтобы разрешить доступ';
}

$('folderBtn').onclick = async () => {
  let h = dirHandle;
  if (!h) { try { h = await idb.get('dir'); } catch (e) {} }
  if (h && (await h.requestPermission({ mode: 'read' })) === 'granted') await loadFolder(h);
  else await pickFolder();
};
restoreFolder();

// ---------- шрифт из файла ----------
$('fontFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const fam = f.name.replace(/\.[^.]+$/, '');
  const face = new FontFace(fam, await f.arrayBuffer()); await face.load(); document.fonts.add(face);
  const o = document.createElement('option'); o.value = fam; o.textContent = fam + ' (файл)'; $('font').appendChild(o); $('font').value = fam;
  scheduleRender();
});

// ---------- контролы ----------
function syncRows() {
  $('charsRow').classList.toggle('hidden', $('mode').value !== 'custom');
  $('tintRow').classList.toggle('hidden', $('tint').value !== 'custom');
}
document.querySelectorAll('aside input, aside select').forEach(el => {
  if (el.id === 'fontFile') return;
  el.addEventListener('input', () => { const o = el.parentElement.querySelector('output'); if (o) o.value = el.value; syncRows(); scheduleRender(); });
});
syncRows();

// ---------- сохранение ----------
function suffix(s) {
  let p = s.chars === '01' ? '01' : s.chars ? 'символы' : 'код';
  if (s.font !== 'Consolas') p += ' ' + s.font;
  if (s.sx !== 1 || s.sy !== 1) p += ` x${clipNum(s.sx)} y${clipNum(s.sy)}`;
  return p;
}
function download(blob, filename) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
function baseName(meta, tintName) { return `${meta.name} ${suffix(meta.s)} - ${tintName}`; }

$('savePng').onclick = () => { if (!lastMeta) return; $('out').toBlob(b => download(b, baseName(lastMeta, lastMeta.s.tintName) + '.png')); };
$('saveTxt').onclick = () => { if (!lastCells) return; download(new Blob([lastCells.map(r => r.map(c => c[0]).join('')).join('\n')], { type: 'text/plain' }), baseName(lastMeta, lastMeta.s.tintName) + '.txt'); };
$('saveHtml').onclick = () => {
  if (!lastCells) return; const s = lastMeta.s;
  const esc = c => c.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;');
  const lines = lastCells.map(r => r.map(([c, b]) => `<span style="color:${cellRgb(b, s.tint)}">${esc(c)}</span>`).join(''));
  const html = `<!doctype html><meta charset="utf-8"><title>ascii art</title><body style="margin:0;background:#050507"><pre style="margin:0;padding:16px;font:${s.size}px/${(1.15 * s.sy).toFixed(2)} '${s.font}',monospace;letter-spacing:${((s.sx - 1) * 0.6).toFixed(2)}em;white-space:pre;color:#ccc">${lines.join('\n')}</pre></body>`;
  download(new Blob([html], { type: 'text/html' }), baseName(lastMeta, s.tintName) + '.html');
};

async function renderAll(tints) {
  const s = settings(); await ensureFont(s);
  const { cw0 } = measureCell(s);
  const off = document.createElement('canvas');
  for (const src of sources) {
    const grid = imageToGrid(src.img, s, (cw0 * s.sx) / (s.size * 1.15 * s.sy));
    const cells = gridToCells(grid, s);
    for (const [tint, tintName] of tints) {
      renderCanvas(off, cells, s, tint);
      const blob = await new Promise(r => off.toBlob(r));
      download(blob, `${src.name} ${suffix(s)} - ${tintName}.png`);
      await new Promise(r => setTimeout(r, 300)); // браузеру нужна пауза между скачиваниями
    }
  }
  $('status').textContent = `Сохранено: ${sources.length * tints.length} файлов`;
}
$('saveAll').onclick = () => { const s = settings(); renderAll([[s.tint, s.tintName]]); };
$('saveBoth').onclick = () => renderAll([[[255, 255, 255], 'серый'], [[90, 255, 130], 'зелёный']]);
$('clearAll').onclick = () => { sources.length = 0; removeSource(0); };
</script>
