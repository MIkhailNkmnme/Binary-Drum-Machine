<!DOCTYPE html>
<!--
===========================================================================
PROJECT: Binary Drum Machine (Zerkalius: Cyber-Genesis 38.0)
PROD: Pure WebGL Shader + Web Audio Synth Engine
===========================================================================
-->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zerkalius GPU v0.55 (Core + Synth)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
        body { background: #050505; color: #00ff66; font-family: 'Roboto Mono', monospace; margin: 8px; overflow: hidden; height: calc(100vh - 16px); transition: background 0.3s; }
        .main-layout { display: flex; gap: 12px; height: 100%; align-items: stretch; flex-direction: row; position: relative; }
        .controls { width: 310px; min-width: 310px; display: flex; flex-direction: column; background: rgba(16, 16, 16, 0.95); padding: 6px; border-radius: 4px; border: 1px solid #222; box-sizing: border-box; height: 100%; z-index: 100; transition: left 0.1s, top 0.1s; }
        .controls.floating { position: absolute; top: 10px; left: 50px; height: 90vh; box-shadow: 0 0 20px rgba(0,255,102,0.2); border: 1px solid #00ff66; cursor: grab; }
        .controls.floating:active { cursor: grabbing; } .controls.floating .scrollable-settings, .controls.floating .fixed-player { cursor: default; }
        .fixed-top { flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; border-bottom: 2px solid #222; padding-bottom: 6px; margin-bottom: 4px; }
        .scrollable-settings { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
        .scrollable-settings::-webkit-scrollbar { width: 6px; } .scrollable-settings::-webkit-scrollbar-track { background: #111; } .scrollable-settings::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .fixed-player { flex-shrink: 0; background: #141414; border: 1px solid #222; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; border-top: 2px solid #00ff66; }
        h3 { margin: 0 0 3px 0; color: #ffffff; text-shadow: 0 0 10px rgba(0,255,102,0.3); font-size: 14px; text-align: center; }
        .player-buttons { display: flex; gap: 4px; width: 100%; } .player-buttons button { font-size: 14px; font-family: inherit; border: none; cursor: pointer; border-radius: 3px; padding: 5px 2px; display:flex; align-items:center; justify-content:center;}
        #playBtn { flex: 2; background: #00ff66; color: #000; font-weight:bold; } #playBtn:hover { background: #00cc52; }
        #stopBtn { flex: 1; background: #ff3333; color: #fff; font-weight:bold; } #stopBtn:hover { background: #cc0000; }
        .btn-zerkalius { background: #ffcc00; color: #000; font-size: 11px; font-weight: bold; padding: 6px; border: none; border-radius: 3px; cursor: pointer; margin-top: 2px; width: 100%; }
        .btn-vacuum { background: #00ccff; color: #000; border: none; font-size: 11px; font-weight: bold; padding: 4px; border-radius: 3px; cursor: pointer; width: 100%; margin-top: 2px;}
        .btn-clear-canvas { background: #330000; color: #ff6666; border: 1px solid #ff6666; font-size: 11px; font-weight: bold; padding: 5px; border-radius: 3px; cursor: pointer; width: 100%; margin-bottom: 4px;} .btn-clear-canvas:hover { background: #ff6666; color: #000; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; flex: 1; } .btn-file { display: block; text-align: center; background: #252525; color: #fff; border: 1px solid #3c3c3c; padding: 5px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; } .btn-audio { background: #9900ff; color: #fff; border: 1px solid #cc66ff; } .btn-mic { background: #ff3366; color: #fff; border: 1px solid #ff6699; padding: 5px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; flex: 1; text-align: center;}
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .control-group { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 6px; } .control-group-highlight { background: #141414; padding: 6px; border-radius: 3px; border: 1px solid #222; } .control-group-gold { background: #1a1a00; padding: 6px; border-radius: 3px; border: 1px solid #ffcc00; }
        label { font-size: 11px; display: flex; justify-content: space-between; align-items: center; user-select: none; color: #888; } .compact-row { display: flex; gap: 4px; justify-content: space-between; align-items: center; } .checkbox-row { display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 2px; cursor: pointer; } .checkbox-row span { color: #aaa; font-size: 11px; } .checkbox-row:hover span { color: #fff; }
        input[type="range"] { width: 100%; cursor: pointer; margin-top: 1px; } input[type="text"], input[type="number"], textarea { background: #151515; color: #fff; border: 1px solid #333; padding: 4px; border-radius: 3px; font-family: inherit; font-size: 11px; outline: none; width: 100%; box-sizing: border-box; } input[type="color"] { border: none; width: 28px; height: 16px; padding: 0; background: none; cursor: pointer; } select { background: #222; color: #fff; border: 1px solid #444; padding: 3px; border-radius: 3px; width: 100%; font-family: inherit; font-size: 11px; outline: none; cursor: pointer;}
        #statusInfo { font-size: 10px; color: #ffcc00; text-align: center; margin-top: 1px; min-height: 11px; }
        #screenContainer { flex-grow: 1; background: #000000; border: 2px solid #111; border-radius: 5px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; width: 100%; height: 100%; cursor: grab; } canvas:active { cursor: grabbing; }
        .float-btn { position: absolute; z-index: 10; border: none; cursor: pointer; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: opacity 0.3s; left: 8px;}
        #toggleFloatPanelBtn { top: 12px; background: #0088ff; color: #fff; box-shadow: 0 0 8px rgba(0, 136, 255, 0.5); border-radius: 3px; height: 26px; width: 34px;}
        #toggleRadarBtn { top: 44px; background: #cc33ff; color: #fff; box-shadow: 0 0 10px rgba(204, 51, 255, 0.6); border-radius: 8px; }
        .color-palette { display: flex; flex-direction: column; gap: 2px; background: #1a1a1a; padding: 4px; border-radius: 3px; margin-top: 2px; } .palette-row { display: flex; gap: 4px; align-items: center; justify-content: space-between; } .palette-row span { font-size: 9px; color: #ccc; width: 45px; }
        #fpsCounter { position: absolute; top: 10px; right: 10px; color: #cc00ff; font-size: 12px; z-index: 50; background: rgba(0,0,0,0.7); padding: 3px 7px; border-radius: 3px; pointer-events: none; font-weight:bold; border: 1px solid #cc00ff;}
        /* Светлая панель приборов — включается вместе со светлым фоном холста */
        body.light-ui { background: #e8e8e8; color: #222; }
        body.light-ui .controls { background: rgba(245,245,245,0.97); border-color: #bbb; }
        body.light-ui .fixed-top { border-bottom-color: #ccc; }
        body.light-ui .fixed-player { background: #ededed; border-color: #ccc; border-top-color: #0aa; }
        body.light-ui h3 { color: #111; text-shadow: none; }
        body.light-ui label { color: #555; }
        body.light-ui .checkbox-row span { color: #333; }
        body.light-ui .checkbox-row:hover span { color: #000; }
        body.light-ui .control-group { border-bottom-color: #ddd; }
        body.light-ui .control-group-highlight { background: #f0f0f0; border-color: #ccc; }
        body.light-ui .control-group-gold { background: #fffbe6; }
        body.light-ui select, body.light-ui input[type="text"], body.light-ui input[type="number"], body.light-ui textarea { background: #fff; color: #111; border-color: #bbb; }
        body.light-ui .color-palette { background: #e4e4e4; } body.light-ui .palette-row span { color: #444; }
        body.light-ui .btn-file { background: #dcdcdc; color: #111; border-color: #bbb; }
        body.light-ui #screenContainer { border-color: #bbb; }
        body.light-ui #fpsCounter { background: rgba(255,255,255,0.8); color: #a000c0; }
        body.light-ui .scrollable-settings::-webkit-scrollbar-track { background: #ddd; } body.light-ui .scrollable-settings::-webkit-scrollbar-thumb { background: #aaa; }
        body.zen-mode .controls { display: none !important; } body.zen-mode .float-btn, body.zen-mode #fpsCounter { opacity: 0 !important; pointer-events: none; } body.zen-mode { margin: 0; height: 100vh; }
        /* Общая тактильность кнопок: подсветка при наведении, вдавливание при нажатии */
        button { transition: filter .15s, box-shadow .15s, transform .05s; }
        button:hover { filter: brightness(1.25); }
        button:active { transform: translateY(1px); }
        .btn-step { background: #334455; color: #fff; flex: 0 0 32px; font-size: 13px; }
        .btn-step:hover { box-shadow: 0 0 10px rgba(120, 180, 255, 0.55); }
        #playBtn:hover { box-shadow: 0 0 12px rgba(0, 255, 102, 0.6); }
        #stopBtn:hover { box-shadow: 0 0 12px rgba(255, 51, 51, 0.6); }
        .btn-zerkalius:hover { box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .btn-vacuum:hover { box-shadow: 0 0 10px rgba(0, 204, 255, 0.5); }
        .btn-file, .btn-mic { transition: filter .15s, box-shadow .15s; }
        .btn-file:hover, .btn-mic:hover { filter: brightness(1.3); box-shadow: 0 0 8px rgba(255, 255, 255, 0.2); }
        .float-btn:hover { filter: brightness(1.35); }
        select:focus, textarea:focus, input[type="text"]:focus, input[type="number"]:focus { border-color: #00ff66; box-shadow: 0 0 6px rgba(0, 255, 102, 0.35); }
        /* Поле поиска: под текстом лежит слой полос — найденные строки подсвечиваются золотом */
        #searchWrap { position: relative; height: 80px; background: #151515; border: 1px solid #333; border-radius: 3px; overflow: hidden; }
        #searchHL { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 4px; margin: 0; overflow: hidden; pointer-events: none; }
        #searchHL div { height: 14px; border-radius: 2px; }
        #searchHL span { display: inline-block; width: 20px; text-align: right; margin-right: 4px; color: #777; font-size: 9px; line-height: 14px; }
        #searchInput { position: absolute; left: 0; top: 0; width: 100%; height: 100%; padding: 4px 4px 4px 30px; margin: 0; box-sizing: border-box; background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: 10px; line-height: 14px; resize: none; }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="controls" id="leftPanel">
            <div class="fixed-top">
                <h3>GPU Core + Synth — v0.55</h3>
                <button id="clearCanvasBtn" class="btn-clear-canvas">🧽 Сбросить GPU Холст</button>
                <div class="control-group-gold" style="padding: 4px;">
                    <div class="compact-row">
                        <select id="sceneSelect" style="font-weight:bold; color:#ffcc00; flex: 2;"><option value="">📍 Пресеты Сцен</option></select>
                        <button id="saveSceneBtn" class="btn-zerkalius" style="background:#ff9900; margin: 0; flex: 1; padding: 3px;">💾 Сохр</button>
                    </div>
                    <div class="compact-row" style="margin-top:2px;">
                        <button id="exportScenesBtn" class="btn-zerkalius" style="background:#886600; color:#fff; margin:0; flex:1; padding:3px;">⬇ Экспорт</button>
                        <div class="file-input-wrapper" style="flex:1;"><span class="btn-file" style="background:#664400; color:#ffcc00;">⬆ Импорт</span><input type="file" id="importScenes" accept=".json,application/json"></div>
                    </div>
                    <button id="cacheSaveBtn" class="btn-vacuum" style="background:#0077aa; color:#fff; margin-top:3px;">🧠 Запомнить всё (кеш)</button>
                    <button id="cacheClearBtn" class="btn-vacuum" style="background:#553300; color:#ffaa66; margin-top:3px;">🧹 Заводские настройки</button>
                </div>
                <div class="compact-row" style="margin-top: 4px;">
                    <div class="file-input-wrapper"><span class="btn-file btn-audio" id="audioBtnText">🎵 Трек</span><input type="file" id="audioLoader" accept="audio/*"></div>
                    <button id="micBtn" class="btn-mic">🎤 Звук ПК</button>
                </div>
                <audio id="bgAudio" loop style="display:none;"></audio>
                <div id="statusInfo">Ctrl+V — вставить фигуру | 2×клик — Дзен</div>
            </div>

            <div class="scrollable-settings">
                <!-- ЗВУКОВОЙ СИНТЕЗАТОР (ЭТАП 1) -->
                <div class="control-group" style="background: #112211; border: 1px solid #00ff66; padding: 4px; border-radius: 3px;">
                    <label class="checkbox-row"><input type="checkbox" id="binarySynthCheck"><span style="color:#00ff66; font-weight:bold;">🎹 Бинарный Драм-Синтезатор</span></label>
                    <div class="compact-row">
                        <label style="color:#aaa;">Громкость:</label>
                        <input type="range" id="synthVolRange" min="0" max="100" value="40" style="width: 120px;">
                    </div>
                </div>

                <!-- ШЕЙДЕРНЫЕ ЭФФЕКТЫ (ЭТАП 3) -->
                <div class="control-group" style="background: #221100; border: 1px solid #ff9900; padding: 4px; border-radius: 3px;">
                    <label class="checkbox-row"><input type="checkbox" id="crtEffectCheck"><span style="color:#ff9900; font-weight:bold;">📺 ЭЛТ Экран (CRT FX + Bloom)</span></label>
                </div>

                <div class="control-group">
                    <label class="checkbox-row" style="background: #2a0044; padding: 4px; border-radius: 3px;"><input type="checkbox" id="audioReactCheck"><span style="color:#cc66ff; font-weight:bold;">Аудио-Реактивность</span></label>
                    <label class="checkbox-row" style="background: #00331a; padding: 4px; border-radius: 3px;"><input type="checkbox" id="autoPilotCheck"><span style="color:#00ff88; font-weight:bold;">🤖 AI Авто-Пилот</span></label>
                    <label class="checkbox-row" style="background: #2a0000; padding: 4px; border-radius: 3px;"><input type="checkbox" id="echoModeCheck"><span style="color:#ff6666; font-weight:bold;">Каскадное Эхо (GPU)</span></label>
                    <input type="range" id="echoRate" min="0" max="300" value="100">
                </div>

                <div class="control-group control-group-highlight" style="border-color: #00ccff;">
                    <label style="color:#00ccff; text-align:center; font-weight:bold;">Генератор Фракталов</label>
                    <select id="zerkRuleSelect" style="margin: 4px 0;">
                        <option value="90">Правило 90 (Классика)</option>
                        <option value="30">Правило 30 (Хаос)</option>
                        <option value="110">Правило 110</option>
                        <option value="150">Правило 150 (Вязь)</option>
                        <option value="vortex" style="color:#00ccff;">🌌 Воронка 3D</option>
                        <option value="ziggurat" style="color:#ff9900;">🛕 Зиккурат</option>
                        <option value="orbital" style="color:#00ffcc;">🎯 Орбита (1-0-1)</option>
                        <option value="diagonal" style="color:#ff3333;">🕸️ Изометрия</option>
                    </select>
                    <div class="compact-row">
                        <label>Сид:<input type="text" id="zerkSeedInput" value="1" style="width: 50px; text-align:center;"></label>
                        <label>Строк:<input type="number" id="zerkCountInput" value="250" style="width: 50px; text-align:center;"></label>
                    </div>
                    <label class="checkbox-row" style="margin-top: 4px;"><input type="checkbox" id="trimZerosCheck" checked><span>Обрезать фон</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="mirrorFoldCheck"><span style="color:#00ffcc;">🔷 Сложить в квадрат (зеркально)</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="keepGridCheck"><span style="color:#ff66ff;">🧱 Не стирать сетку (наложить сверху)</span></label>
                    <button id="zerkaliusBtn" class="btn-zerkalius" style="background:#00ccff;">Создать Фигуру</button>
                    <div class="compact-row" style="margin-top:2px;">
                        <label>Шаг сетки:<input type="number" id="gridStepInput" value="8" min="2" max="100" style="width: 50px; text-align:center;"></label>
                    </div>
                    <button id="generateVacuumBtn" class="btn-vacuum" style="background:#330033; color:#cc00ff;">Генерировать Сетку</button>
                    <label class="checkbox-row" style="margin-top:4px;"><input type="checkbox" id="noWrapXCheck" checked><span style="color:#ff9900;">⇆ Разомкнуть по X (без повтора)</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="noWrapYCheck" checked><span style="color:#ff9900;">⇅ Разомкнуть по Y (без повтора)</span></label>
                </div>

                <div class="control-group control-group-highlight" style="border-color: #ffd700;">
                    <label style="color:#ffd700; text-align:center; font-weight:bold;">🔎 Поиск паттернов</label>
                    <label class="checkbox-row"><input type="checkbox" id="searchOffCheck"><span style="color:#ffaa00; font-weight:bold;">⏸ Отключить поиск</span></label>
                    <div id="searchWrap">
                        <div id="searchHL"></div>
                        <textarea id="searchInput" spellcheck="false" placeholder="паттерны, по одному на строку:&#10;1&#10;10&#10;101…"></textarea>
                    </div>
                    <label class="checkbox-row"><input type="checkbox" id="searchSeqCheck"><span>По очереди (2-й после 1-го)</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="searchSkipFirstCheck" checked><span>Без первого символа (зачёт по остатку)</span></label>
                    <select id="searchDirSelect" style="margin-top:2px;">
                        <option value="all">Направление: все</option>
                        <option value="h">→ Только по горизонтали</option>
                        <option value="v">↓ Только по вертикали</option>
                        <option value="d">↘ Только по диагоналям</option>
                    </select>
                    <label style="font-size:10px;">Частота поиска: <span id="searchRateLabel">0.4с</span></label>
                    <input type="range" id="searchRateRange" min="0" max="5000" step="100" value="400">
                    <div class="compact-row" style="gap:4px; margin-top:2px;">
                        <button id="gotoFoundBtn" class="btn-vacuum" style="background:#443300; color:#ffd700; margin:0; flex:1;">🎯 К находке</button>
                        <button id="resetSearchBtn" class="btn-vacuum" style="background:#332200; color:#ffaa00; margin:0; flex:1;">✖ Сброс</button>
                    </div>
                    <div id="searchStatus" style="font-size:10px; color:#ffd700; text-align:center; min-height:11px;"></div>
                </div>

                <div class="control-group control-group-highlight" style="border-color: #ff00ff;">
                    <label style="color:#ff00ff; text-align:center; width: 100%;">Dual Core (Наложение)</label>
                    <label class="checkbox-row"><input type="checkbox" id="dualCoreCheck"><span>Включить Наложение</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="dualMaskCheck"><span>Проникающая Маска (XOR)</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="freezeLayer1Check" checked><span style="color:#ffcc00; font-weight:bold;">⚓ Заморозить Слой 1</span></label>
                    <div class="compact-row" style="margin-top:2px;">
                        <label>Множитель Слой 2:</label>
                        <input type="number" id="dualCoreSpeedInput" value="2" min="1" max="10" style="width: 40px; text-align:center;">
                    </div>
                    <div class="compact-row" style="margin-top:2px;">
                        <label>Слоёв: <span id="layersLabel">2</span></label>
                        <input type="range" id="layersRange" min="2" max="10" value="2" style="flex:1; margin-left:8px;">
                    </div>
                </div>

                <div class="control-group">
                    <label>Алгоритм Y-сдвига:</label>
                    <input type="text" id="algorithmInput" value="1" style="text-align: center;">
                    <label>Скорость Y-сдвига:</label>
                    <input type="range" id="yShiftRate" min="0" max="300" value="100">
                    <label class="checkbox-row" style="background: #003300; padding: 2px;"><input type="checkbox" id="freezeScrollCheck"><span style="color:#00ff66; font-weight:bold;">Заморозить Y-Скролл</span></label>
                    <label class="checkbox-row" style="background: #330033; padding: 2px;"><input type="checkbox" id="spin3dCheck"><span style="color:#cc33ff; font-weight:bold;">3D Вращение (Орбита)</span></label>
                    <label class="checkbox-row" style="background: #331100; padding: 2px;"><input type="checkbox" id="breathingZoomCheck"><span style="color:#ff9933; font-weight:bold;">🫁 Дыхание (Зум)</span></label>
                </div>

                <div class="control-group">
                    <label class="checkbox-row"><input type="checkbox" id="zerkaliusAnimCheck"><span><b style="color:#ff3333">Аниматрица (Сверху-Вниз)</b></span></label>
                    <input type="range" id="animRate" min="0" max="300" value="100">
                    <label class="checkbox-row"><input type="checkbox" id="elkaCheck"><span><b style="color:#00ccff">Круговой сдвиг (Ёлка X)</b></span></label>
                    <input type="range" id="elkaRate" min="0" max="300" value="100">
                    <label class="checkbox-row"><input type="checkbox" id="hideStaticCheck"><span><b style="color:#ffcc00">Скрыть статику</b></span></label>
                </div>
            </div>

            <div class="fixed-player">
                <div class="player-buttons">
                    <button id="stepBackBtn" class="btn-step" title="Шаг назад">◀</button>
                    <button id="playBtn">▶ ПУСК GPU</button>
                    <button id="stepFwdBtn" class="btn-step" title="Шаг вперёд">▶|</button>
                    <button id="stopBtn">■ СТОП</button>
                </div>
                
                <div class="control-group" style="border: none; padding: 0; margin-top:4px;">
                    <div class="compact-row">
                        <label style="flex:1;">Скорость:</label>
                        <label style="color:#cc00ff; font-weight:bold;">x<span id="speedMultLabel">383</span></label><input type="hidden" id="speedMultInput" value="383">
                    </div>
                    <input type="range" id="speedRange" min="1" max="1000" value="1000">
                    <input type="range" id="speedMultRange" min="1" max="1000" value="383" style="margin-top:2px;">
                </div>

                <div class="control-group" style="border: none; padding: 0;">
                    <div class="compact-row">
                        <label>Масштаб:</label>
                        <input type="range" id="fontSizeRange" min="2" max="100" value="12" style="flex:1; margin-left: 8px;">
                    </div>
                    <label class="checkbox-row"><input type="checkbox" id="zoomClampCheck" checked><span style="color:#00ff66;">🔒 Отсечка зума (клетка ≥ 1 пикс.)</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="pixelPerfectCheck" checked><span style="color:#00ff66;">📐 Пиксель-перфект (ровные клетки)</span></label>
                    <select id="radarModeSelect" style="margin-top:2px;">
                        <option value="0">🛰️ Радар: круговой</option>
                        <option value="1">🛰️ Радар: тоннель</option>
                        <option value="2">🛰️ Радар: спираль</option>
                        <option value="3">🛰️ Радар: сфера</option>

    <script id="v-shader" type="x-shader/x-vertex">
        attribute vec2 a_position; varying vec2 v_uv;
        void main() { v_uv = a_position * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_position, 0.0, 1.0); }

    <script id="f-shader" type="x-shader/x-fragment">
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        varying vec2 v_uv;
        
        uniform sampler2D u_fontMap;    
        uniform sampler2D u_dataMap;    
        uniform vec2 u_resolution;      
        uniform vec2 u_gridSize;        
        uniform vec2 u_offset;          
        uniform vec2 u_layerOffset;     
        uniform vec3 u_colorAct;        
        uniform vec3 u_colorStat;       
        uniform float u_hideStatic;     
        uniform float u_glowIntensity;  
        uniform float u_isRadar;        
        uniform float u_angleOffset;    
        uniform float u_layerCount;
        uniform float u_dualMask;
        uniform vec2 u_dataSize;
        uniform float u_rainbow;
        uniform float u_rbDir;
        uniform float u_fillMode;
        uniform float u_echo;
        uniform float u_echoOff;
        uniform vec2 u_wrap;            // 1 — матрица зациклена по оси, 0 — разомкнута (за краем пусто)
        uniform float u_bgLight;        // 1 — включён свой цвет фона холста
        uniform vec3 u_bgColor;         // сам цвет фона
        uniform float u_charZoom;       // растяжка символа внутри клетки: >1 — символ вылезает за клетку (обрезается по её границе)
        uniform float u_radarMode;      // тип радарной проекции

        #define PI 3.14159265359

        vec3 hsv2rgb(vec3 c) { vec3 p = abs(fract(c.xxx + vec3(0.0, 0.6666667, 0.3333333)) * 6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }

        vec4 getCellInfo(vec2 cellPos, sampler2D tex, vec2 grid) {
            // Целимся в ЦЕНТР тексела: выборка по краю (k/N) при NEAREST от малейшей ошибки округления
            // соскакивает на соседний тексел — отсюда были дубли столбцов и «лишние» единицы у края фигуры
            vec2 uv = (floor(mod(cellPos, grid)) + 0.5) / grid;
            return texture2D(tex, uv);
        }

        // Чернила одной клетки: rgb — цвет, a — покрытие пикселя символом (0 — клетка сюда не достаёт).
        // luv — позиция пикселя относительно этой клетки (0..1 внутри неё, за пределами — если тянемся к соседу).
        vec4 inkAt(vec2 c, vec2 luv, float rAngle, float radius) {
            vec2 cuv = (luv - 0.5) / u_charZoom + 0.5;
            if (cuv.x < 0.0 || cuv.x > 1.0 || cuv.y < 0.0 || cuv.y > 1.0) return vec4(0.0);
            if (u_isRadar < 0.5) {
                if (u_wrap.x < 0.5 && (c.x < 0.0 || c.x >= u_dataSize.x)) return vec4(0.0);
                if (u_wrap.y < 0.5 && (c.y < 0.0 || c.y >= u_dataSize.y)) return vec4(0.0);
            }

            vec4 data1 = getCellInfo(c, u_dataMap, u_dataSize);
            float isAct = data1.g; float isCollision = 0.0; float finalChar = data1.r;
            if (data1.b > 0.5) isAct = 1.0;

            // До 10 слоёв: копии матрицы со ступенчатым сдвигом, XOR-наложение
            for (int k = 1; k < 10; k++) {
                if (float(k) >= u_layerCount) break;
                vec2 cellK = c;
                if (u_isRadar > 0.5) { float colIdxK = (((rAngle - u_angleOffset * 1.5 * float(k)) / (2.0 * PI)) + 0.5) * u_dataSize.x; cellK = floor(vec2(colIdxK, radius * u_gridSize.y)); }
                cellK.y += u_layerOffset.y * float(k) - u_offset.y;
                float ck = getCellInfo(cellK, u_dataMap, u_dataSize).r;
                bool hasA = abs(finalChar - 0.5) > 0.1; bool hasB = abs(ck - 0.5) > 0.1;
                if (hasA && hasB) { isCollision = 1.0; isAct = 1.0; if (u_dualMask > 0.5 && abs(finalChar - ck) < 0.1) finalChar = 0.5; }
                else if (hasB) { finalChar = ck; }
            }

            // Каскадное Эхо (GPU, недеструктивно): XOR со сдвинутой копией матрицы
            if(u_echo > 0.5) {
                float ce = getCellInfo(vec2(c.x, c.y - u_echoOff), u_dataMap, u_dataSize).r;
                bool hasA = abs(finalChar - 0.5) > 0.1; bool hasB = abs(ce - 0.5) > 0.1;
                if(hasA && hasB) { if(abs(finalChar - ce) < 0.1) finalChar = 0.5; else isAct = 1.0; }
                else if(hasB) { finalChar = ce; isAct = 1.0; }
            }

            if (abs(finalChar - 0.5) < 0.1) return vec4(0.0);
            if (u_hideStatic > 0.5 && isAct < 0.5 && isCollision < 0.5) return vec4(0.0);

            vec3 finalColor = mix(u_colorStat, u_colorAct, isAct);
            if (u_rainbow > 0.5) {
                float hue;
                if (u_rbDir < 0.5) hue = fract(c.y / u_dataSize.y + c.x / u_dataSize.x * 0.25);      // диагональ
                else if (u_rbDir < 1.5) hue = fract(c.y / u_dataSize.y);                             // по строкам
                else hue = fract(c.x / u_dataSize.x);                                                // по колонкам
                finalColor = hsv2rgb(vec3(hue, 1.0, mix(0.55, 1.0, isAct)));
            }
            if (data1.b > 0.5) finalColor = vec3(1.0, 0.85, 0.2); // найденный паттерн — золото

            float charIndex = step(0.5, finalChar);
            vec2 fontUV = vec2(clamp(cuv.x, 0.002, 0.998) * 0.5 + charIndex * 0.5, clamp(cuv.y, 0.002, 0.998));
            float lvl = texture2D(u_fontMap, fontUV).r;
            // Вид клетки: 0 — авто (символы, при уменьшении заливка), 1 — символ на заливке, 2 — литая заливка
            float cellPx = u_resolution.x / u_gridSize.x;
            float solidMix = clamp((8.0 - cellPx) / 4.0, 0.0, 1.0);
            float solidLevel = mix(0.35, 1.0, charIndex);
            if (u_fillMode > 1.5) lvl = solidLevel;
            else if (u_fillMode > 0.5) lvl = solidLevel * mix(0.55, 1.0, mix(lvl, 1.0, solidMix));
            else lvl = mix(lvl, solidLevel, solidMix);

            bool hot = (isAct > 0.5 || isCollision > 0.5);
            // На светлом фоне клетка — чернила, на тёмном — свечение. Решаем по яркости самого фона, а не по факту его включения.
            bool lightBg = (u_bgLight > 0.5 && dot(u_bgColor, vec3(0.299, 0.587, 0.114)) > 0.5);
            if (lightBg) finalColor *= (hot ? 0.55 : 0.8);
            else finalColor *= hot ? (1.3 + u_glowIntensity * 2.0) : 0.9;
            return vec4(finalColor, lvl);
        }

        void main() {
            vec2 pos = v_uv; vec2 cell; vec2 uvWithinCell;
            float rAngle = 0.0; float radius = 0.0;
            vec4 bg = vec4(u_bgLight > 0.5 ? u_bgColor : vec3(0.0), 1.0);   // цвет «пустоты»

            if (u_isRadar > 0.5) {
                vec2 center = vec2(0.5) - (u_offset.x / u_resolution);
                vec2 delta = pos - center; delta.x *= u_resolution.x / u_resolution.y;
                radius = length(delta) * 2.0; rAngle = atan(delta.y, delta.x);
                // Проекции: 0 — круговой радар, 1 — тоннель (перспектива 1/r), 2 — спираль, 3 — сфера, 4 — веер (сектор)
                float rowIdx;
                float ang = rAngle;
                if (u_radarMode < 0.5) rowIdx = radius * u_gridSize.y;
                else if (u_radarMode < 1.5) rowIdx = (1.0 / max(radius, 0.02)) * u_gridSize.y * 0.08;
                else if (u_radarMode < 2.5) rowIdx = radius * u_gridSize.y + ((rAngle / (2.0 * PI)) + 0.5) * u_dataSize.y * 0.15;
                else if (u_radarMode < 3.5) { if (radius > 1.0) { gl_FragColor = bg; return; } rowIdx = (asin(clamp(radius, 0.0, 1.0)) / (PI * 0.5)) * u_gridSize.y; }
                else { if (abs(rAngle) > PI * 0.25) { gl_FragColor = bg; return; } ang = rAngle * 4.0; rowIdx = radius * u_gridSize.y; }
                float colIdx = (((ang + u_angleOffset) / (2.0 * PI)) + 0.5) * u_dataSize.x;
                cell = floor(vec2(colIdx, rowIdx)); cell.y += u_offset.y; uvWithinCell = fract(vec2(colIdx, rowIdx));
                if (radius < 0.05) { gl_FragColor = bg; return; }
            } else {
                float aspect = u_resolution.x / u_resolution.y;
                vec2 rc = pos - 0.5; rc.x *= aspect;
                float ca = cos(u_angleOffset); float sa = sin(u_angleOffset);
                rc = vec2(rc.x * ca - rc.y * sa, rc.x * sa + rc.y * ca);
                rc.x /= aspect; pos = rc + 0.5;
                vec2 panOffset = u_offset.x / u_resolution; pos.x -= panOffset.x;
                cell = floor(pos * u_gridSize); cell.x -= floor((u_gridSize.x - u_dataSize.x) * 0.5); cell.y += u_offset.y; uvWithinCell = fract(pos * u_gridSize);
            }

            vec4 ink = inkAt(cell, uvWithinCell, rAngle, radius);
            // Растяжка больше 100%: символ вылезает за свою клетку, поэтому пиксель может накрыть и сосед.
            // Обходим 8 соседей, но каждый отсекается арифметикой до всяких выборок — платим только там, где перекрытие реально есть.
            if (u_charZoom > 1.0) {
                for (int i = 0; i < 25; i++) {
                    if (i == 12) continue;
                    vec2 d = vec2(float(i - (i / 5) * 5) - 2.0, float(i / 5) - 2.0);
                    vec4 s = inkAt(cell + d, uvWithinCell - d, rAngle, radius);
                    if (s.a > ink.a) ink = s;
                }
            }

            if (ink.a <= 0.0) { gl_FragColor = bg; return; }
            vec3 renderColor = mix(bg.rgb, ink.rgb, ink.a);   // на чёрном фоне это ровно прежнее «цвет × покрытие»
            gl_FragColor = vec4(renderColor, 1.0);
        }
    </script>

    <!-- ПОСТ-ПРОХОД: BLOOM + CRT -->
    <script id="v-shader-post" type="x-shader/x-vertex">
        attribute vec2 a_position; varying vec2 v_uv;
        void main() { v_uv = a_position * 0.5 + 0.5; gl_Position = vec4(a_position, 0.0, 1.0); }
    </script>
    <script id="f-shader-post" type="x-shader/x-fragment">
        precision mediump float; varying vec2 v_uv;
        uniform sampler2D u_scene; uniform vec2 u_resolution; uniform float u_crtEffect; uniform float u_glow;
        void main() {
            vec3 col = texture2D(u_scene, v_uv).rgb;
            if (u_crtEffect > 0.5) {
                vec2 px = 1.0 / u_resolution; vec3 blur = vec3(0.0);
                blur += texture2D(u_scene, v_uv + vec2( 2.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-2.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0,  2.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0, -2.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 1.5,  1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-1.5,  1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 1.5, -1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-1.5, -1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 4.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-4.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0,  4.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0, -4.0) * px).rgb;
                blur /= 12.0;
                col += max(blur - 0.35, vec3(0.0)) * (1.2 + u_glow * 0.15); // Bloom
                col -= sin(v_uv.y * u_resolution.y * 1.2) * 0.08;           // Scanlines
                col *= (1.0 - length(v_uv - vec2(0.5)) * 0.35);             // Виньетка
            }
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

            r.readAsText(f); e.target.value = '';
        });

        // При смене ширины холста (Дзен, разворот панели) матрица центруется заново и картинка прыгает вбок.
        // Компенсируем панорамой: считаем сдвиг центровки до и после и гасим разницу в offsetX.
        window.addEventListener('resize', () => {
            const dpr = window.devicePixelRatio || 1;
            let effX = STATE.effX || 0;
            let cOld = (effX > 0 && UI.canvas.width > 0) ? Math.floor((UI.canvas.width / effX - STATE.COLS) * 0.5) : null;
            UI.canvas.width = Math.round(UI.canvas.parentElement.clientWidth * dpr); UI.canvas.height = Math.round(UI.canvas.parentElement.clientHeight * dpr);
            if(cOld !== null && UI.canvas.width > 0) { let cNew = Math.floor((UI.canvas.width / effX - STATE.COLS) * 0.5); STATE.offsetX += (cOld - cNew) * effX; }
            setupFBO();
        });
        UI.zerkaliusBtn.addEventListener('click', generateMatrix); 
        function togglePlay() {
            STATE.isPlaying = !STATE.isPlaying; UI.playBtn.innerHTML = STATE.isPlaying ? '⏸ ПАУЗА' : '▶ ПУСК GPU';
            if(STATE.isPlaying) SYNTH.init();
            if(AUDIO.init && document.getElementById('bgAudio').src) STATE.isPlaying ? document.getElementById('bgAudio').play() : document.getElementById('bgAudio').pause();
        }
        UI.playBtn.addEventListener('click', togglePlay);
        // СТОП: полный сброс движения + фигура заново вписывается в экран (fitView), иначе после сброса смещений холст казался пустым
        UI.stopBtn.addEventListener('click', () => {
            STATE.isPlaying=false; UI.playBtn.innerHTML='▶ ПУСК GPU';
            STATE.dragY=0; STATE.globalAngle=0; STATE.elkaShift=0; STATE.algoPointer=0; STATE.echoOff=0; STATE.accAnim=0; STATE.accElka=0; STATE.animatrixRow=0;
            fitView(); updateDataTexture();
            if(AUDIO.init) { document.getElementById('bgAudio').pause(); document.getElementById('bgAudio').currentTime=0; }
        });
        // Покадровый шаг: тот же тик, что и при воспроизведении, но один и по кнопке
        function manualStep(dir) {
            let m = parseInt(UI.speedMultInput.value, 10) || 1; let step = dir * m;
            if(UI.zerkaliusAnimCheck.checked && STATE.lines.length > 0 && dir > 0) {
                let reps = Math.max(1, Math.round(((parseInt(UI.animRate.value, 10) || 0) / 100) * m));
                for(let s=0; s<reps; s++) {
                    if(STATE.animatrixRow >= STATE.ROWS - 1) STATE.animatrixRow = 0; let r1 = STATE.animatrixRow, r2 = r1 + 1;
                    for(let x=0; x<STATE.COLS; x++) { let c1 = STATE.lines[r1][x].c, c2 = STATE.lines[r2][x].c; if(c1 !== ' ') { STATE.lines[r2][x].c = (c1===c2) ? ' ' : c1; STATE.lines[r2][x].a = 1; } } STATE.animatrixRow++;
                }
            }
            if(UI.echoModeCheck.checked) STATE.echoOff += ((parseInt(UI.echoRate.value, 10) || 0) / 100) * step;
            if(UI.elkaCheck.checked) STATE.elkaShift += Math.round(((parseInt(UI.elkaRate.value, 10) || 0) / 100) * step);
            let algDigits = UI.algorithmInput.value.match(/\d/g) || ['1'];
            let alg = parseInt(algDigits[STATE.algoPointer % algDigits.length], 10); STATE.algoPointer++;
            if(UI.freezeScrollCheck.checked) alg = 0;
            let yr = (parseInt(UI.yShiftRate.value, 10) || 0) / 100;
            STATE.offsetMatY -= (alg / STATE.ROWS) * step * yr;
            if(UI.dualCoreCheck.checked) { let dSpd = parseInt(UI.dualCoreSpeedInput.value,10)||2; STATE.layer2Y -= (alg * (UI.freezeLayer1Check.checked ? 1 : dSpd) / STATE.ROWS) * step * yr; }
            let rowIdx = Math.floor(Math.abs(STATE.offsetMatY * STATE.ROWS)) % STATE.ROWS;
            SYNTH.playRow(STATE.lines[rowIdx]);
            updateDataTexture();
        }
        document.getElementById('stepFwdBtn').addEventListener('click', () => manualStep(1));
        document.getElementById('stepBackBtn').addEventListener('click', () => manualStep(-1));

        UI.toggleRadarBtn.addEventListener('click', () => { STATE.isRadar = !STATE.isRadar; UI.toggleRadarBtn.style.background = STATE.isRadar ? '#ffcc00' : '#cc33ff'; }); 
        UI.micBtn.addEventListener('click', () => AUDIO.setupMic()); UI.audioLoader.addEventListener('change', (e) => AUDIO.setupFile(e.target.files[0]));
        UI.clearCanvasBtn.addEventListener('click', () => { STATE.lines = createEmptyMatrix(STATE.COLS, STATE.ROWS); updateDataTexture(); });
        // Настоящая сетка: линии из 1 каждые N клеток, фон 0. При сдвиге на строку не инвертируется (в отличие от шахматки) — не мигает.
        UI.generateVacuumBtn.addEventListener('click', () => {
            let n = Math.max(2, Math.min(100, parseInt(document.getElementById('gridStepInput').value, 10) || 8));
            // размеры округляем до кратных шагу — матрица заворачивается по mod(COLS/ROWS), иначе на стыке линии сбиваются
            STATE.COLS=Math.max(n*2, Math.round(150/n)*n); STATE.ROWS=Math.max(n*2, Math.round(250/n)*n); let m=[];
            for(let y=0;y<STATE.ROWS;y++){ let r=[]; let rowLine = (y % n === 0); for(let x=0;x<STATE.COLS;x++) r.push({c:(rowLine || x % n === 0)?'1':'0',a:0}); m.push(r); }
            STATE.lines=m; updateDataTexture();
        });
        UI.charZoomRange.addEventListener('input', () => { document.getElementById('charZoomLabel').textContent = UI.charZoomRange.value + '%'; });

        // Светлый фон холста
        function applyLightBg() {
            let b = document.getElementById('lightBgBtn');
            let col = document.getElementById('bgColorPicker').value;
            // Панель светлеет только под светлый фон: на тёмном пользовательском цвете тёмная тема остаётся
            let lum = (parseInt(col.substr(1,2),16)*0.299 + parseInt(col.substr(3,2),16)*0.587 + parseInt(col.substr(5,2),16)*0.114) / 255;
            b.textContent = STATE.lightBg ? '🌙 Тёмный фон' : '☀ Светлый фон';
            b.style.background = STATE.lightBg ? '#eee' : '#222'; b.style.color = STATE.lightBg ? '#111' : '#eee';
            UI.canvas.style.background = STATE.lightBg ? col : '#000';
            document.body.classList.toggle('light-ui', STATE.lightBg && lum > 0.5);
        }
        document.getElementById('bgColorPicker').addEventListener('input', () => { if(!STATE.lightBg) STATE.lightBg = true; applyLightBg(); });
        document.getElementById('lightBgBtn').addEventListener('click', () => { STATE.lightBg = !STATE.lightBg; applyLightBg(); });

        // Связка размыкания по Y и заморозки слоя: без повтора и без якоря фигура при ПУСКе просто уезжает в пустоту навсегда
        UI.noWrapYCheck.addEventListener('change', (e) => { if(e.target.checked) UI.freezeLayer1Check.checked = true; });
        UI.freezeLayer1Check.addEventListener('change', (e) => { if(!e.target.checked) UI.noWrapYCheck.checked = false; });

        // Отключение поиска: снимаем золотую подсветку, чтобы холст не остался в найденных метках
        document.getElementById('searchOffCheck').addEventListener('change', (e) => {
            if(e.target.checked) { SEARCH.marks.clear(); updateDataTexture(); document.getElementById('searchStatus').textContent = 'поиск выключен'; }
            else { SEARCH.lastScan = 0; document.getElementById('searchStatus').textContent = SEARCH.prefixes.length ? ('Найдено: ' + SEARCH.found.filter(Boolean).length + '/' + SEARCH.prefixes.length) : ''; }
        });

        UI.synthVolRange.addEventListener('input', () => SYNTH.updateVol());
        
        UI.fontSizeRange.addEventListener('input', () => { STATE.fSize = parseInt(UI.fontSizeRange.value, 10) || 12; });
        // Отсечка: минимальный масштаб, при котором клетка ещё занимает целый пиксель экрана
        function minScale() {
            if(!UI.zoomClampCheck.checked) return 0.5;
            let spX = (parseInt(UI.spacingXRange.value, 10) || 100) / 100, spY = (parseInt(UI.spacingYRange.value, 10) || 100) / 100;
            return 1 / Math.max(0.01, Math.min(spX, spY));
        }
        function applyZoomClamp() { let m = minScale(); if(STATE.fSize < m) { STATE.fSize = m; UI.fontSizeRange.value = Math.round(m); } }
        UI.zoomClampCheck.addEventListener('change', applyZoomClamp);
        UI.spacingXRange.addEventListener('input', applyZoomClamp);
        UI.spacingYRange.addEventListener('input', applyZoomClamp);
        UI.layersRange.addEventListener('input', () => document.getElementById('layersLabel').textContent = UI.layersRange.value);
        const speedMultRange = document.getElementById('speedMultRange');
        speedMultRange.addEventListener('input', () => { UI.speedMultInput.value = speedMultRange.value; document.getElementById('speedMultLabel').textContent = speedMultRange.value; });
        // Зум колесиком — точка под курсором остаётся на месте
        UI.canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const W = UI.canvas.width, H = UI.canvas.height;
            const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
            const newF = Math.min(160, Math.max(minScale(), STATE.fSize * factor));
            if(newF === STATE.fSize) return;
            // И старый, и новый размер клетки считаем одной формулой — той же, что в кадре, вместе с
            // округлением пиксель-перфекта. Брать STATE.effX нельзя: при быстрой прокрутке колеса
            // несколько событий приходят до отрисовки, и там лежит устаревший размер — отсюда и уползание.
            const zoomB = UI.breathingZoomCheck.checked ? (1 + Math.sin(STATE.breathTime) * 0.4) : 1;
            const spX = (parseInt(UI.spacingXRange.value, 10) || 100) / 100, spY = (parseInt(UI.spacingYRange.value, 10) || 100) / 100;
            const pp = UI.pixelPerfectCheck.checked;
            const cellSize = (f, sp) => { let v = f * STATE.audioScale * zoomB * sp; return pp ? Math.max(1, Math.round(v)) : v; };
            const effXo = cellSize(STATE.fSize, spX), effYo = cellSize(STATE.fSize, spY);
            const effXn = cellSize(newF, spX), effYn = cellSize(newF, spY);
            // Якорь — центр холста: точка в середине экрана остаётся на месте при любом масштабе
            const gxo = W / effXo, gxn = W / effXn, gyo = H / effYo, gyn = H / effYn;
            const Co = Math.floor((gxo - STATE.COLS) / 2), Cn = Math.floor((gxn - STATE.COLS) / 2);
            const k = (0.5 - STATE.offsetX / W) * gxo - Co;
            STATE.offsetX = (0.5 - (k + Cn) / gxn) * W;
            // В пиксель-перфекте кадр рисует округлённую панораму — держим то же значение в состоянии,
            // иначе полпикселя расхождения копятся от щелчка к щелчку
            if(pp) STATE.offsetX = Math.round(STATE.offsetX);
            const frozen = UI.freezeLayer1Check.checked;
            const offY = frozen ? STATE.dragY : STATE.offsetMatY;
            const newOffY = (0.5 * gyo + offY) - 0.5 * gyn;
            if(frozen) STATE.dragY = newOffY; else STATE.offsetMatY = newOffY;
            STATE.fSize = newF; UI.fontSizeRange.value = Math.round(newF);
        }, { passive: false });
        // Мышь: тянем по X всегда, по Y — либо общий скролл, либо ручной сдвиг замороженного слоя
        UI.canvas.addEventListener('mousedown', (e) => { e.preventDefault(); if(e.button === 1) { toggleZen(); return; } if(e.button !== 0) return; if(STATE.isPlaying) { STATE.wasPlaying = true; STATE.isPlaying = false; UI.playBtn.innerHTML = '▶ ПУСК GPU'; } STATE.isDragging=true; STATE.dragStartX=e.clientX; STATE.dragStartY=e.clientY; STATE.startOffsetX=STATE.offsetX; STATE.startOffsetMatY = UI.freezeLayer1Check.checked ? STATE.dragY : STATE.offsetMatY; });
        window.addEventListener('mousemove', (e) => { if(STATE.isDragging) { const dpr = window.devicePixelRatio || 1; STATE.offsetX = STATE.startOffsetX + (e.clientX - STATE.dragStartX) * dpr; let ny = STATE.startOffsetMatY - (e.clientY - STATE.dragStartY) * dpr / (STATE.effY || 1); if(UI.freezeLayer1Check.checked) STATE.dragY = ny; else STATE.offsetMatY = ny; } });
        // Отпустили мышь: сперва возвращаем движение, снятое на время протяжки, потом — клик без сдвига переключает паузу.
        // Порядок важен: для одиночного клика по идущей сцене это даёт ровно одну паузу, а не две подряд.
        window.addEventListener('mouseup', (e) => {
            if(STATE.wasPlaying) { STATE.wasPlaying = false; STATE.isPlaying = true; STATE.lastTickTime = performance.now(); UI.playBtn.innerHTML = '⏸ ПАУЗА'; }
            if(STATE.isDragging && e.target === UI.canvas && Math.abs(e.clientX - STATE.dragStartX) < 4 && Math.abs(e.clientY - STATE.dragStartY) < 4) togglePlay();
            STATE.isDragging=false;
        });
        // В Дзене холст не только меняет размер, но и переезжает по экрану (панель уходит, поля пропадают).
        // Меряем прямоугольник холста до и после и гасим сдвиг панорамой — картинка остаётся на том же месте экрана.
        function toggleZen() {
            const dpr = window.devicePixelRatio || 1;
            let r0 = UI.canvas.getBoundingClientRect();
            document.body.classList.toggle('zen-mode');
            window.dispatchEvent(new Event('resize'));
            let r1 = UI.canvas.getBoundingClientRect();
            STATE.offsetX += (r0.left - r1.left) * dpr;
            if(STATE.effY > 0) {
                let dy = (r1.bottom - r0.bottom) * dpr / STATE.effY;
                if(UI.freezeLayer1Check.checked) STATE.dragY += dy; else STATE.offsetMatY += dy;
            }
        }
        UI.canvas.addEventListener('dblclick', toggleZen);
        // Средняя кнопка (колесо) — тоже Дзен; auxclick гасим, чтобы не включалась автопрокрутка браузера
        UI.canvas.addEventListener('auxclick', (e) => { if(e.button === 1) e.preventDefault(); });
        UI.themeSelect.addEventListener('change', function() { const t = THEMES[this.value]; if(t) { UI.activeColorPicker.value = t.act; UI.staticColorPicker.value = t.stat; }});
        
        const panel = document.getElementById('leftPanel'); let startX, startY, startLeft, startTop;
        UI.toggleFloatPanelBtn.addEventListener('click', function() { STATE.isPanelFloating = !STATE.isPanelFloating; if(STATE.isPanelFloating) { panel.classList.add('floating'); this.style.background = '#00ff66'; this.style.color = '#000'; panel.style.left = '50px'; panel.style.top = '10px'; } else { panel.classList.remove('floating'); this.style.background = '#0088ff'; this.style.color = '#fff'; panel.style.left = ''; panel.style.top = ''; } });
        panel.addEventListener('mousedown', function(e) { if(!STATE.isPanelFloating) return; if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.closest('.scrollable-settings') || e.target.closest('.fixed-player')) return; STATE.isDraggingPanel = true; startX = e.clientX; startY = e.clientY; startLeft = panel.offsetLeft; startTop = panel.offsetTop; }); window.addEventListener('mousemove', function(e) { if(STATE.isDraggingPanel) { panel.style.left = (startLeft + e.clientX - startX) + 'px'; panel.style.top = (startTop + e.clientY - startY) + 'px'; } }); window.addEventListener('mouseup', function() { STATE.isDraggingPanel = false; });

        // Кеш: всё состояние целиком в памяти браузера, восстанавливается при открытии
        function saveCache() {
            let s = sceneSnapshot();
            try { localStorage.setItem('zerk_gpu_cache', JSON.stringify(s)); document.getElementById('statusInfo').textContent = '🧠 Настройки и паттерны запомнены'; }
            catch(e) {
                delete s.snap;
                try { localStorage.setItem('zerk_gpu_cache', JSON.stringify(s)); document.getElementById('statusInfo').textContent = '🧠 Запомнено без слепка узора — тесно в хранилище'; }
                catch(e2) { alert('Хранилище браузера переполнено'); }
            }
        }
        // Сброс памяти: стираем только снимок состояния. Пользовательские пресеты (zerk_custom_scenes) не трогаем.
        // Текущий холст остаётся как есть — «чистым» кеш станет, если после сброса нажать «Запомнить всё».
        // Заводские умолчания прямо на живой странице: у каждого элемента берём его исходное значение из разметки.
        // В память ничего не пишем — закрепится это или нет, решает пользователь кнопкой «Запомнить всё».
        document.getElementById('cacheClearBtn').addEventListener('click', () => {
            document.querySelectorAll('#leftPanel input, #leftPanel select, #leftPanel textarea').forEach(el => {
                if(el.type === 'file' || el.type === 'button') return;
                if(el.type === 'checkbox' || el.type === 'radio') el.checked = el.defaultChecked;
                else if(el.tagName === 'SELECT') { for(let i=0; i<el.options.length; i++) el.options[i].selected = el.options[i].defaultSelected; if(el.selectedIndex < 0) el.selectedIndex = 0; }
                else el.value = el.defaultValue;
            });
            STATE.lightBg = false; STATE.isRadar = false; UI.toggleRadarBtn.style.background = '#cc33ff';
            STATE.isPlaying = false; UI.playBtn.innerHTML = '▶ ПУСК GPU';
            STATE.dragY = 0; STATE.globalAngle = 0; STATE.elkaShift = 0; STATE.algoPointer = 0; STATE.echoOff = 0; STATE.accAnim = 0; STATE.accElka = 0; STATE.animatrixRow = 0;
            document.getElementById('charZoomLabel').textContent = UI.charZoomRange.value + '%';
            document.getElementById('layersLabel').textContent = UI.layersRange.value;
            document.getElementById('speedMultLabel').textContent = UI.speedMultInput.value;
            applyLightBg(); buildFontAtlas(); setSearchPattern(); generateMatrix();
            document.getElementById('statusInfo').textContent = '🧹 Заводские настройки — нажми «Запомнить всё», чтобы закрепить';
        });
        function loadCache() {
            let c = localStorage.getItem('zerk_gpu_cache'); if(!c) return false;
            try {
                PREBUILT_SCENES['__cache__'] = JSON.parse(c); loadScene('__cache__'); delete PREBUILT_SCENES['__cache__'];
                document.getElementById('statusInfo').textContent = '🧠 Восстановлено из памяти';
                return true;
            } catch(e) { delete PREBUILT_SCENES['__cache__']; return false; }
        }
        document.getElementById('cacheSaveBtn').addEventListener('click', saveCache);

        window.onload = () => { window.dispatchEvent(new Event('resize')); if(!loadCache()) generateMatrix(); requestAnimationFrame(renderLoop); };
    </script>
</body>
</html>
