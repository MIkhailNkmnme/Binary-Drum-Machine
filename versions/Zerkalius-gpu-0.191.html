    <!-- ШЕЙДЕРЫ WEBGL (ЭТАП 3: ДОБАВЛЕНЫ SCANLINES, АБЕРРАЦИЯ И ВИНИЕТКА) -->
    <script id="v-shader" type="x-shader/x-vertex">
        attribute vec2 a_position; varying vec2 v_uv;
        void main() { v_uv = a_position * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_position, 0.0, 1.0); }
    </script>

    <script id="f-shader" type="x-shader/x-fragment">
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        varying vec2 v_uv;
        
        uniform sampler2D u_fontMap;    
        uniform sampler2D u_dataMap;    
        uniform vec2 u_resolution;      
        uniform vec2 u_gridSize;        
        uniform vec2 u_offset;          
        uniform vec2 u_layerOffset;     
        uniform vec3 u_colorAct;        
        uniform vec3 u_colorStat;       
        uniform float u_hideStatic;     
        uniform float u_glowIntensity;  
        uniform float u_isRadar;        
        uniform float u_angleOffset;    
        uniform float u_layerCount;
        uniform float u_dualMask;
        uniform vec2 u_dataSize;
        uniform float u_rainbow;
        uniform float u_rbDir;
        uniform float u_fillMode;
        uniform float u_echo;
        uniform float u_echoOff;
        uniform vec2 u_wrap;            // 1 — матрица зациклена по оси, 0 — разомкнута (за краем пусто)
        uniform float u_bgLight;        // 1 — включён свой цвет фона холста
        uniform vec3 u_bgColor;         // сам цвет фона
        uniform float u_charZoom;       // растяжка символа внутри клетки: >1 — символ вылезает за клетку (обрезается по её границе)
        uniform float u_radarMode;      // тип радарной проекции
        uniform sampler2D u_rowBoundsMap; // границы реального контента (без пустых полей) по строкам — для «Круговой 2»
        uniform float u_panY;           // вертикальный сдвиг центра радара, в пикселях
        uniform float u_hole;           // радиус «дыры» в центре радара
        uniform float u_sphereRadius;   // масштаб радиуса проекции «Сфера» (1.0 — как раньше, больше — крупнее глобус)
        uniform float u_loopRows;       // свой период зацикливания фигуры по Y, в строках; 0 — выключено (как раньше, решает галка «Кольцевать по Y»)
        uniform float u_gridSep;        // 1 — сетка движется отдельно от фигуры
        uniform float u_gridOff;        // собственное смещение сетки
        uniform float u_gridShow;       // 0 — подложку-сетку не рисуем
        uniform float u_dimOthers;      // 1 — «К находке»: притушить всё, кроме текущей находки

        #define PI 3.14159265359

        vec3 hsv2rgb(vec3 c) { vec3 p = abs(fract(c.xxx + vec3(0.0, 0.6666667, 0.3333333)) * 6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }

        vec4 getCellInfo(vec2 cellPos, sampler2D tex, vec2 grid) {
            // Целимся в ЦЕНТР тексела: выборка по краю (k/N) при NEAREST от малейшей ошибки округления
            // соскакивает на соседний тексел — отсюда были дубли столбцов и «лишние» единицы у края фигуры
            vec2 uv = (floor(mod(cellPos, grid)) + 0.5) / grid;
            return texture2D(tex, uv);
        }

        // Чернила одной клетки: rgb — цвет, a — покрытие пикселя символом (0 — клетка сюда не достаёт).
        // luv — позиция пикселя относительно этой клетки (0..1 внутри неё, за пределами — если тянемся к соседу).
        // want: 0 — только фигура, 1 — только подложка-сетка, 2 — всё подряд (когда сетка не отделена)
        vec4 inkAt(vec2 c, vec2 luv, float rAngle, float radius, float want) {
            vec2 cuv = (luv - 0.5) / u_charZoom + 0.5;
            if (cuv.x < 0.0 || cuv.x > 1.0 || cuv.y < 0.0 || cuv.y > 1.0) return vec4(0.0);
            // Размыкание: за краем матрицы рисуем только подложку-сетку (у неё альфа 0.5), фигуру — нет
            if (u_isRadar < 0.5) {
                bool outX = (u_wrap.x < 0.5 && (c.x < 0.0 || c.x >= u_dataSize.x));
                bool outY = (u_wrap.y < 0.5 && (c.y < 0.0 || c.y >= u_dataSize.y));
                if (outX || outY) { if (getCellInfo(c, u_dataMap, u_dataSize).a > 0.75) return vec4(0.0); }
            }

            vec4 data1 = getCellInfo(c, u_dataMap, u_dataSize);
            // Подложка помечена альфой 0.5 — при раздельном движении каждый проход берёт только своё
            bool isBack = (data1.a < 0.75);
            if (isBack && u_gridShow < 0.5) return vec4(0.0);
            if (want < 1.5) { if ((want > 0.5) != isBack) return vec4(0.0); }
            float isAct = data1.g; float isCollision = 0.0; float finalChar = data1.r;
            if (data1.b > 0.5) isAct = 1.0;

            // До 10 слоёв: копии матрицы со ступенчатым сдвигом, XOR-наложение
            for (int k = 1; k < 10; k++) {
                if (float(k) >= u_layerCount) break;
                vec2 cellK = c;
                if (u_isRadar > 0.5) { float colIdxK = (((rAngle - u_angleOffset * 1.5 * float(k)) / (2.0 * PI)) + 0.5) * u_dataSize.x; cellK = floor(vec2(colIdxK, radius * u_gridSize.y)); }
                cellK.y += u_layerOffset.y * float(k) - u_offset.y;
                float ck = getCellInfo(cellK, u_dataMap, u_dataSize).r;
                bool hasA = abs(finalChar - 0.5) > 0.1; bool hasB = abs(ck - 0.5) > 0.1;
                if (hasA && hasB) { isCollision = 1.0; isAct = 1.0; if (u_dualMask > 0.5 && abs(finalChar - ck) < 0.1) finalChar = 0.5; }
                else if (hasB) { finalChar = ck; }
            }

            // Каскадное Эхо (GPU, недеструктивно): XOR со сдвинутой копией матрицы
            if(u_echo > 0.5) {
                float ce = getCellInfo(vec2(c.x, c.y - u_echoOff), u_dataMap, u_dataSize).r;
                bool hasA = abs(finalChar - 0.5) > 0.1; bool hasB = abs(ce - 0.5) > 0.1;
                if(hasA && hasB) { if(abs(finalChar - ce) < 0.1) finalChar = 0.5; else isAct = 1.0; }
                else if(hasB) { finalChar = ce; isAct = 1.0; }
            }

            if (abs(finalChar - 0.5) < 0.1) return vec4(0.0);
            if (u_hideStatic > 0.5 && isAct < 0.5 && isCollision < 0.5) return vec4(0.0);

            vec3 finalColor = mix(u_colorStat, u_colorAct, isAct);
            if (u_rainbow > 0.5) {
                float hue;
                if (u_rbDir < 0.5) hue = fract(c.y / u_dataSize.y + c.x / u_dataSize.x * 0.25);      // диагональ
                else if (u_rbDir < 1.5) hue = fract(c.y / u_dataSize.y);                             // по строкам
                else hue = fract(c.x / u_dataSize.x);                                                // по колонкам
                finalColor = hsv2rgb(vec3(hue, 1.0, mix(0.55, 1.0, isAct)));
            }
            if (data1.b > 0.9) finalColor = vec3(0.3, 0.95, 1.0);      // текущая находка («К находке») — голубым, временно
            else if (data1.b > 0.5) finalColor = vec3(1.0, 0.85, 0.2); // найденный паттерн — золото

            float charIndex = step(0.5, finalChar);
            vec2 fontUV = vec2(clamp(cuv.x, 0.002, 0.998) * 0.5 + charIndex * 0.5, clamp(cuv.y, 0.002, 0.998));
            float lvl = texture2D(u_fontMap, fontUV).r;
            // Вид клетки: 0 — авто (символы, при уменьшении заливка), 1 — символ на заливке, 2 — литая заливка
            float cellPx = u_resolution.x / u_gridSize.x;
            float solidMix = clamp((8.0 - cellPx) / 4.0, 0.0, 1.0);
            float solidLevel = mix(0.35, 1.0, charIndex);
            if (u_fillMode > 1.5) lvl = solidLevel;
            else if (u_fillMode > 0.5) lvl = solidLevel * mix(0.55, 1.0, mix(lvl, 1.0, solidMix));
            else lvl = mix(lvl, solidLevel, solidMix);

            bool hot = (isAct > 0.5 || isCollision > 0.5 || data1.b > 0.9);
            // На светлом фоне клетка — чернила, на тёмном — свечение. Решаем по яркости самого фона, а не по факту его включения.
            bool lightBg = (u_bgLight > 0.5 && dot(u_bgColor, vec3(0.299, 0.587, 0.114)) > 0.5);
            if (lightBg) finalColor *= (hot ? 0.55 : 0.8);
            else finalColor *= hot ? (1.3 + u_glowIntensity * 2.0) : 0.9;
            // «К находке»: пока активно, всё, кроме самой находки, притушено — так её видно
            // без мигания, просто за счёт контраста с остальным узором.
            if (u_dimOthers > 0.5 && data1.b <= 0.9) finalColor *= 0.12;
            return vec4(finalColor, lvl);
        }

        // Один слой целиком: своя клетка плюс соседи, если символ растянут за её границы
        vec4 inkPass(vec2 c0, vec2 luv, float rAngle, float radius, float want) {
            vec4 ink = inkAt(c0, luv, rAngle, radius, want);
            if (u_charZoom > 1.0) {
                for (int i = 0; i < 25; i++) {
                    if (i == 12) continue;
                    vec2 d = vec2(float(i - (i / 5) * 5) - 2.0, float(i / 5) - 2.0);
                    vec4 s = inkAt(c0 + d, luv - d, rAngle, radius, want);
                    if (s.a > ink.a) ink = s;
                }
            }
            return ink;
        }

        void main() {
            vec2 pos = v_uv; vec2 cell; vec2 uvWithinCell;
            float rAngle = 0.0; float radius = 0.0;
            vec4 bg = vec4(u_bgLight > 0.5 ? u_bgColor : vec3(0.0), 1.0);   // цвет «пустоты»

            if (u_isRadar > 0.5) {
                // Центр радара: по X — общая панорама, по Y — свой сдвиг. Раньше здесь float делился на vec2,
                // из-за чего одна горизонтальная протяжка уводила центр по диагонали.
                vec2 center = vec2(0.5 + u_offset.x / u_resolution.x, 0.5 + u_panY / u_resolution.y);
                vec2 delta = pos - center; delta.x *= u_resolution.x / u_resolution.y;
                radius = length(delta) * 2.0; rAngle = atan(delta.y, delta.x);
                // Проекции: 0 — круговой радар, 1 — тоннель (перспектива 1/r), 2 — спираль, 3 — сфера, 4 — веер (сектор),
                // 5 — круговой 2 (каждое кольцо-строка заполняет полный круг по своей реальной ширине, как в Zerkalius-code.html)
                float rowIdx;
                float ang = rAngle;
                if (u_radarMode < 0.5) rowIdx = radius * u_gridSize.y;
                else if (u_radarMode < 1.5) rowIdx = (1.0 / max(radius, 0.02)) * u_gridSize.y * 0.08;
                else if (u_radarMode < 2.5) rowIdx = radius * u_gridSize.y + ((rAngle / (2.0 * PI)) + 0.5) * u_dataSize.y * 0.15;
                else if (u_radarMode < 3.5) { float sphereR = radius / max(0.05, u_sphereRadius); if (sphereR > 1.0) { gl_FragColor = bg; return; } rowIdx = (asin(clamp(sphereR, 0.0, 1.0)) / (PI * 0.5)) * u_gridSize.y; }
                else if (u_radarMode < 4.5) { if (abs(rAngle) > PI * 0.25) { gl_FragColor = bg; return; } ang = rAngle * 4.0; rowIdx = radius * u_gridSize.y; }
                else rowIdx = radius * u_gridSize.y;
                float colIdx;
                if (u_radarMode > 4.5) {
                    float rbRow = floor(mod(rowIdx, u_dataSize.y));
                    vec4 rb = texture2D(u_rowBoundsMap, vec2(0.5, (rbRow + 0.5) / u_dataSize.y));
                    float rowStart = (rb.r * 255.0 * 256.0 + rb.g * 255.0) / 65535.0 * u_dataSize.x;
                    float rowEnd = (rb.b * 255.0 * 256.0 + rb.a * 255.0) / 65535.0 * u_dataSize.x;
                    float angFrac = fract((ang + u_angleOffset) / (2.0 * PI) + 0.5);
                    colIdx = rowStart + angFrac * max(rowEnd - rowStart, 1.0);
                } else {
                    colIdx = (((ang + u_angleOffset) / (2.0 * PI)) + 0.5) * u_dataSize.x;
                }
                cell = floor(vec2(colIdx, rowIdx)); uvWithinCell = fract(vec2(colIdx, rowIdx));
                if (radius < u_hole) { gl_FragColor = bg; return; }
            } else {
                float aspect = u_resolution.x / u_resolution.y;
                vec2 rc = pos - 0.5; rc.x *= aspect;
                float ca = cos(u_angleOffset); float sa = sin(u_angleOffset);
                rc = vec2(rc.x * ca - rc.y * sa, rc.x * sa + rc.y * ca);
                rc.x /= aspect; pos = rc + 0.5;
                vec2 panOffset = u_offset.x / u_resolution; pos.x -= panOffset.x;
                cell = floor(pos * u_gridSize); cell.x -= floor((u_gridSize.x - u_dataSize.x) * 0.5); uvWithinCell = fract(pos * u_gridSize);
            }

            // Слой фигуры едет со своим смещением, подложка-сетка — со своим, поэтому проходов два.
            // Когда раздельное движение выключено, проход один и берёт всё сразу — как раньше.
            vec2 cellFig = cell + vec2(0.0, u_offset.y);
            // Свой период зацикливания (u_loopRows > 0). ВАЖНО: это НЕ тайлинг по всему холсту —
            // фигура должна остаться ОДНА, а не размножиться плитками (mod от экранной cell.y без
            // ограничения окна заворачивал в один и тот же кусок данных КАЖДУЮ полосу из loopRows
            // экранных строк — отсюда штабель одинаковых треугольников по всей высоте холста).
            // Поэтому: (1) считаем, попадает ли ЭКРАННАЯ (до сдвига) cell.y в первое окно
            // [0, loopRows) сверху холста — вне его фигуры просто нет, там фон; (2) внутри окна
            // содержимое всё равно крутится/зацикливается через mod от смещения — эффект конвейера.
            bool inLoopWindow = true;
            if (u_loopRows > 0.5) {
                inLoopWindow = (cell.y >= 0.0 && cell.y < u_loopRows);
                cellFig.y = mod(cell.y + u_offset.y, u_loopRows);
            }
            if (u_gridSep < 0.5) {
                if (!inLoopWindow) { gl_FragColor = bg; return; }
                vec4 ink = inkPass(cellFig, uvWithinCell, rAngle, radius, 2.0);
                if (ink.a <= 0.0) { gl_FragColor = bg; return; }
                gl_FragColor = vec4(mix(bg.rgb, ink.rgb, ink.a), 1.0);   // на чёрном фоне это ровно прежнее «цвет × покрытие»
                return;
            }
            vec4 inkG = inkPass(cell + vec2(0.0, u_gridOff), uvWithinCell, rAngle, radius, 1.0);
            vec4 inkF = inLoopWindow ? inkPass(cellFig, uvWithinCell, rAngle, radius, 0.0) : vec4(0.0);
            if (inkG.a <= 0.0 && inkF.a <= 0.0) { gl_FragColor = bg; return; }
            vec3 col = mix(bg.rgb, inkG.rgb, inkG.a);
            col = mix(col, inkF.rgb, inkF.a);
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <!-- ПОСТ-ПРОХОД: BLOOM + CRT -->
    <script id="v-shader-post" type="x-shader/x-vertex">
        attribute vec2 a_position; varying vec2 v_uv;
        void main() { v_uv = a_position * 0.5 + 0.5; gl_Position = vec4(a_position, 0.0, 1.0); }
    </script>
    <script id="f-shader-post" type="x-shader/x-fragment">
        precision mediump float; varying vec2 v_uv;
        uniform sampler2D u_scene; uniform vec2 u_resolution; uniform float u_crtEffect; uniform float u_glow;
        void main() {
            vec3 col = texture2D(u_scene, v_uv).rgb;
            if (u_crtEffect > 0.5) {
                vec2 px = 1.0 / u_resolution; vec3 blur = vec3(0.0);
                blur += texture2D(u_scene, v_uv + vec2( 2.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-2.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0,  2.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0, -2.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 1.5,  1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-1.5,  1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 1.5, -1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-1.5, -1.5) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 4.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2(-4.0,  0.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0,  4.0) * px).rgb;
                blur += texture2D(u_scene, v_uv + vec2( 0.0, -4.0) * px).rgb;
                blur /= 12.0;
                col += max(blur - 0.35, vec3(0.0)) * (1.2 + u_glow * 0.15); // Bloom
                col -= sin(v_uv.y * u_resolution.y * 1.2) * 0.08;           // Scanlines
                col *= (1.0 - length(v_uv - vec2(0.5)) * 0.35);             // Виньетка
            }
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script>
        // ИНТЕРФЕЙС И ЭЛЕМЕНТЫ (ЭТАП 2: ПОЧИЩЕНЫ БИТЫЕ ССЫЛКИ)
        const UI = {
            canvas: document.getElementById('glcanvas'), fps: document.getElementById('fpsCounter'),
            playBtn: document.getElementById('playBtn'), stopBtn: document.getElementById('stopBtn'),
            audioLoader: document.getElementById('audioLoader'), micBtn: document.getElementById('micBtn'),
            audioReactCheck: document.getElementById('audioReactCheck'), autoPilotCheck: document.getElementById('autoPilotCheck'),
            zerkRuleSelect: document.getElementById('zerkRuleSelect'), zerkSeedInput: document.getElementById('zerkSeedInput'),
            zerkCountInput: document.getElementById('zerkCountInput'), trimZerosCheck: document.getElementById('trimZerosCheck'),
            mirrorFoldCheck: document.getElementById('mirrorFoldCheck'),
            zerkaliusBtn: document.getElementById('zerkaliusBtn'),
            speedRange: document.getElementById('speedRange'), speedMultInput: document.getElementById('speedMultInput'),
            fontSizeRange: document.getElementById('fontSizeRange'), algorithmInput: document.getElementById('algorithmInput'), 
            spin3dCheck: document.getElementById('spin3dCheck'), breathingZoomCheck: document.getElementById('breathingZoomCheck'), 
            hideStaticCheck: document.getElementById('hideStaticCheck'), activeColorPicker: document.getElementById('activeColorPicker'),

            clearCanvasBtn: document.getElementById('clearCanvasBtn'), generateVacuumBtn: document.getElementById('generateVacuumBtn'), clearGridBtn: document.getElementById('clearGridBtn'),
            dualCoreCheck: document.getElementById('dualCoreCheck'), dualMaskCheck: document.getElementById('dualMaskCheck'), 
            freezeLayer1Check: document.getElementById('freezeLayer1Check'), dualCoreSpeedInput: document.getElementById('dualCoreSpeedInput'), 
            themeSelect: document.getElementById('themeSelect'), sceneSelect: document.getElementById('sceneSelect'), saveSceneBtn: document.getElementById('saveSceneBtn'),
            echoModeCheck: document.getElementById('echoModeCheck'), zerkaliusAnimCheck: document.getElementById('zerkaliusAnimCheck'), 
            elkaCheck: document.getElementById('elkaCheck'), freezeScrollCheck: document.getElementById('freezeScrollCheck'),
            crtEffectCheck: document.getElementById('crtEffectCheck'),
            binarySynthCheck: document.getElementById('binarySynthCheck'), synthVolRange: document.getElementById('synthVolRange'),
            cellSelectCheck: document.getElementById('cellSelectCheck'), cellSynthCheck: document.getElementById('cellSynthCheck'), cellRecordCheck: document.getElementById('cellRecordCheck'),
            cellWaveSelect: document.getElementById('cellWaveSelect'), cellOctaveInput: document.getElementById('cellOctaveInput'),
            cellVolRange: document.getElementById('cellVolRange'), cellMarkers: document.getElementById('cellMarkers'),
            cellAnchorSelect: document.getElementById('cellAnchorSelect'), cellModeSelect: document.getElementById('cellModeSelect'),
            cellStepRange: document.getElementById('cellStepRange'),
            yShiftRate: document.getElementById('yShiftRate'), elkaRate: document.getElementById('elkaRate'),
            animRate: document.getElementById('animRate'), echoRate: document.getElementById('echoRate'),
            spacingXRange: document.getElementById('spacingXRange'), spacingYRange: document.getElementById('spacingYRange'),
            layersRange: document.getElementById('layersRange'), searchRateRange: document.getElementById('searchRateRange'),
            charZoomRange: document.getElementById('charZoomRange'), pixelPerfectCheck: document.getElementById('pixelPerfectCheck'),
            zoomClampCheck: document.getElementById('zoomClampCheck'),
            wrapXCheck: document.getElementById('wrapXCheck'), wrapYCheck: document.getElementById('wrapYCheck')
        };

        // ===== МЕНЮ И РАСКЛАДКА ПАНЕЛЕЙ =====
        // Каждая вкладка меню — ЦЕЛЬНАЯ панель со своими блоками внутри в фиксированном порядке;
        // блоки внутри панели местами не меняются. Галка «Показывать в панели» переносит панель
        // целиком из выпадающего окна в левую или правую зону; там панель таскается за шапку
        // целиком, в любое место любой из двух зон, но её содержимое не переставляется.
        const MENUS = {
            menuPlayer: { title: 'Плеер',    zone: 'leftSlot',  pin: true,  ids: ['playerGroup'], floatable: true },
            menuScene:  { title: 'Сцена',    zone: 'leftSlot',  pin: false, ids: ['clearCanvasBtn', 'sceneGroup'], floatable: true },
            menuAudio:  { title: 'Звук',     zone: 'leftSlot',  pin: false, ids: ['audioRow', 'audioReactRow', 'statusInfo', 'synthGroup', 'cellSynthGroup'], floatable: true },
            menuScale:  { title: 'Масштаб',  zone: 'rightSlot', pin: true,  ids: ['scaleGroup'], floatable: true },
            menuView:   { title: 'Вид',      zone: 'rightSlot', pin: true,  ids: ['viewGroup', 'paletteGroup', 'fxGroup'], floatable: true },
            menuRadar:  { title: 'Радар',    zone: 'rightSlot', pin: false, ids: ['radarGroup'], floatable: true },
            menuMove:   { title: 'Движение', zone: 'leftSlot',  pin: true,  ids: ['motionGroup', 'animGroup', 'reactGroup', 'dualGroup'], floatable: true },
            menuGen:    { title: 'Генератор', zone: 'leftSlot', pin: true,  ids: ['genGroup', 'pasteAlignGroup'], floatable: true },
            menuGrid:   { title: 'Сетка',    zone: 'leftSlot',  pin: true,  ids: ['gridGroup'], floatable: true },
            menuSearch: { title: 'Поиск',    zone: 'rightSlot', pin: true,  ids: ['searchGroup'], floatable: true }
        };
        const LAYOUT_KEY = 'zerk_layout';

        // Один контейнер на вкладку: шапка с названием и ручкой, дальше — все блоки вкладки в исходном порядке.
        // Все вкладки floatable — любую можно бросить прямо на холст плавающим окном.
        for(let mid in MENUS) {
            let m = MENUS[mid];
            let wrap = document.createElement('div'); wrap.className = 'menu-panel'; wrap.id = 'panelWrap_' + mid;
            if(m.floatable) wrap.dataset.floatable = '1';
            let head = document.createElement('div'); head.className = 'panel-head';
            head.innerHTML = '<span class="panel-drag" title="Перетащить панель' + (m.floatable ? ' — можно и на холст' : '') + '">⋮⋮</span><span class="panel-title">' + m.title + '</span><span class="panel-close" title="Скрыть панель">✕</span>';
            let closeBtn = head.querySelector('.panel-close');
            closeBtn.addEventListener('mousedown', (e) => e.stopPropagation());
            closeBtn.addEventListener('click', (e) => { e.stopPropagation(); hideTab(mid); });
            wrap.appendChild(head);
            m.ids.forEach(id => { let el = document.getElementById(id); if(el) wrap.appendChild(el); });
            m.wrapper = wrap;
        }

        function saveLayout() {
            let g = {};
            ['leftSlot', 'rightSlot'].forEach(z => Array.from(document.getElementById(z).children).forEach((el, i) => { if(el.id) g[el.id] = { z: z, i: i }; }));
            document.querySelectorAll('body > .floating-panel').forEach(el => { if(el.id) g[el.id] = { z: 'canvas', x: parseInt(el.style.left, 10) || 0, y: parseInt(el.style.top, 10) || 0 }; });
            let pins = {}; for(let m in MENUS) pins[m] = MENUS[m].pin;
            try { localStorage.setItem(LAYOUT_KEY, JSON.stringify({ pins: pins, groups: g })); } catch(e) {}
        }

        // Перетаскивание — на mousedown/mousemove/mouseup, а не на нативном HTML5 drag-and-drop:
        // тот конфликтует с уже существующими window-обработчиками dragover/drop, которые ловят
        // перетаскивание текстового файла с фигурой на страницу.
        // Панели с data-floatable можно бросить и на сам холст — тогда они становятся плавающим
        // окном поверх картинки (position:fixed), а не элементом списка в одной из боковых панелей.
        let draggedEl = null, dragOffX = 0, dragOffY = 0;
        function makeDraggable(handle, panel) {
            function start(clientX, clientY) {
                draggedEl = panel; panel.classList.add('dragging');
                let r = panel.getBoundingClientRect(); dragOffX = clientX - r.left; dragOffY = clientY - r.top;
                // Курсор берётся от элемента ПОД указателем, а не от ручки, за которую схватились —
                // без этого стоило увести мышь с ручки на холст, и хватающая рука сменялась обычной стрелкой
                document.body.style.cursor = 'grabbing';
                // Обе зоны-доки помечаем пунктиром сразу, как только начали тащить —
                // не нужно доводить курсор до зоны, чтобы понять, что туда вообще можно бросить.
                for(let p in SLOT_OF) document.getElementById(p).classList.add('drop-zone-hint');
            }
            handle.addEventListener('mousedown', (e) => {
                if(e.button !== 0) return; e.preventDefault(); e.stopPropagation();
                start(e.clientX, e.clientY);
            });
            // Тач: то же самое одним пальцем за заголовок. passive:false обязателен — иначе
            // preventDefault не подействует и страница будет скроллиться вместе с драгом панели.
            handle.addEventListener('touchstart', (e) => {
                if(e.touches.length !== 1) return; e.preventDefault(); e.stopPropagation();
                start(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });
        }
        // Доки теперь растут по высоте содержимого (не на весь экран), поэтому у их «зоны попадания»
        // два режима: широкая полоса по X на всю высоту (удобно бросать обычные панели даже ниже
        // короткого дока) и точный прямоугольник самого дока (для floatable — иначе не получится
        // отпустить плеер на пустом холсте под коротким доком, он засосётся в зону докa по X).
        const SLOT_OF = { leftPanel: 'leftSlot', rightPanel: 'rightSlot' };
        function pidUnderCursor(x, y, precise) {
            for(let pid in SLOT_OF) {
                let r = document.getElementById(pid).getBoundingClientRect();
                let hit = precise ? (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) : (x >= r.left && x <= r.right);
                if(hit) return pid;
            }
            return null;
        }
        // Подсветка дока-«магнита»: пока панель тащат над левой/правой зоной, эта зона
        // светится рамкой — видно, что при отпускании она туда примагнитится.
        function highlightDock(pid) {
            for(let p in SLOT_OF) document.getElementById(p).classList.toggle('drag-target', p === pid);
        }
        function placeInZone(zone, y) {
            let after = Array.from(zone.children).find(ch => { if(ch === draggedEl) return false; let r = ch.getBoundingClientRect(); return y < r.top + r.height / 2; });
            if(after) { if(after !== draggedEl.nextSibling) zone.insertBefore(draggedEl, after); }
            else if(zone.lastElementChild !== draggedEl) zone.appendChild(draggedEl);
        }
        function dragMove(clientX, clientY) {
            if(!draggedEl) return;
            let floatable = draggedEl.dataset.floatable === '1';
            let pid = pidUnderCursor(clientX, clientY, floatable);
            highlightDock(pid);
            let zone = pid ? document.getElementById(SLOT_OF[pid]) : null;
            if(floatable && !zone) {
                if(!draggedEl.classList.contains('floating-panel')) { draggedEl.classList.add('floating-panel'); document.body.appendChild(draggedEl); }
                draggedEl.style.left = Math.round(clientX - dragOffX) + 'px';
                draggedEl.style.top = Math.round(clientY - dragOffY) + 'px';
                return;
            }
            if(draggedEl.classList.contains('floating-panel')) { draggedEl.classList.remove('floating-panel'); draggedEl.style.left = ''; draggedEl.style.top = ''; }
            if(zone) placeInZone(zone, clientY);
        }
        function dragEnd() {
            if(!draggedEl) return;
            let mid = draggedEl.id.replace('panelWrap_', '');
            let zoneId = draggedEl.classList.contains('floating-panel') ? 'canvas' : (draggedEl.parentElement && draggedEl.parentElement.id);
            if(MENUS[mid]) {
                MENUS[mid].zone = zoneId;   // запоминаем, куда перетащили — чтобы снятие/возврат галки не отбрасывал панель на старое место
                // Перетаскивание незакреплённой вкладки прямо в левую/правую панель закрепляет её —
                // иначе кнопка вкладки оставалась незакрашенной и не реагировала на клик.
                if((zoneId === 'leftSlot' || zoneId === 'rightSlot') && !MENUS[mid].pin) {
                    MENUS[mid].pin = true;
                    let cb = document.getElementById(mid + 'Pin'); if(cb) cb.checked = true;
                    let btn = document.querySelector('.menu-btn[data-menu="' + mid + '"]');
                    if(btn) btn.classList.add('pinned');
                    closeMenus(); updateDockVisibility(); updateToggleAllPinsBtn();
                }
            }
            draggedEl.classList.remove('dragging'); draggedEl = null; saveLayout();
            document.body.style.cursor = '';
            highlightDock(null);
            for(let p in SLOT_OF) document.getElementById(p).classList.remove('drop-zone-hint');
        }
        window.addEventListener('mousemove', (e) => dragMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', dragEnd);
        // Тач-версии того же самого. touchmove должен глушить скролл страницы ТОЛЬКО пока
        // реально идёт драг панели (draggedEl не пуст) — иначе обычный скролл списка настроек
        // пальцем сломается.
        window.addEventListener('touchmove', (e) => {
            if(!draggedEl || !e.touches.length) return;
            e.preventDefault();
            dragMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        window.addEventListener('touchend', dragEnd);
        window.addEventListener('touchcancel', dragEnd);

        for(let mid in MENUS) makeDraggable(MENUS[mid].wrapper.querySelector('.panel-head'), MENUS[mid].wrapper);

        function applyMenu(mid) {
            let m = MENUS[mid], drop = document.getElementById(mid);
            let floating = m.wrapper.classList.contains('floating-panel');
            if(m.pin) {
                // zone может быть 'canvas' (панель раньше плавала на холсте) — тогда её не трогаем,
                // а не пытаемся деться в несуществующий элемент #canvas.
                if(!floating) (document.getElementById(m.zone) || document.getElementById('leftSlot')).appendChild(m.wrapper);
            } else {
                if(floating) { m.wrapper.classList.remove('floating-panel'); m.wrapper.style.left = ''; m.wrapper.style.top = ''; floating = false; }
                drop.appendChild(m.wrapper);
            }
            let btn = document.querySelector('.menu-btn[data-menu="' + mid + '"]');
            if(btn) btn.classList.toggle('pinned', m.pin || floating);
            updateDockVisibility();
        }
        // Скрыть вкладку — открепить, если она в панели, или снять с холста, если плавает;
        // используется и крестиком в шапке панели, и кликом по уже видимой кнопке вкладки.
        function hideTab(mid) {
            let m = MENUS[mid]; if(!m) return;
            m.pin = false;
            let cb = document.getElementById(mid + 'Pin'); if(cb) cb.checked = false;
            applyMenu(mid); closeMenus(); saveLayout(); updateToggleAllPinsBtn();
        }
        // Вкладка видна где-то (закреплена в панели ИЛИ плавает на холсте отдельным окном)
        function isTabVisible(mid) {
            let m = MENUS[mid];
            return !!(m && (m.pin || m.wrapper.classList.contains('floating-panel')));
        }
        // Особое поведение «Плеера» — не докуется в лево/право, а плавающим окном на холст,
        // вниз-влево, сразу под левым доком (чтобы не перекрывать его содержимое).
        function floatPlayerPanel() {
            let m = MENUS.menuPlayer; if(!m) return;
            m.pin = false;
            let cb = document.getElementById('menuPlayerPin'); if(cb) cb.checked = false;
            if(!m.wrapper.classList.contains('floating-panel')) { m.wrapper.classList.add('floating-panel'); document.body.appendChild(m.wrapper); }
            // Ставим плеер ПРАВЕЕ левого дока (чтобы он его не перекрывал) и внизу экрана,
            // но с отступом от нижней границы окна. Размеры читаем уже после добавления класса
            // floating-panel — иначе ширина/высота будут от закреплённого состояния.
            let lp = document.getElementById('leftPanel');
            let leftRight = lp.querySelector('.menu-panel') ? lp.getBoundingClientRect().right : 0;
            let pw = m.wrapper.offsetWidth || 300, ph = m.wrapper.offsetHeight || 120;
            let x = Math.round(leftRight + 12);
            x = Math.max(8, Math.min(x, window.innerWidth - pw - 8));
            let y = window.innerHeight - ph - 28;
            m.wrapper.style.left = x + 'px';
            m.wrapper.style.top = Math.max(40, Math.min(window.innerHeight - 40, Math.round(y))) + 'px';
            m.zone = 'canvas';
            let btnEl = document.querySelector('.menu-btn[data-menu="menuPlayer"]'); if(btnEl) btnEl.classList.add('pinned');
        }
        // Пустой док (ни одной закреплённой вкладки) не должен рисовать фон/тень —
        // иначе на холсте остаётся заметный пустой прямоугольник без единой вкладки внутри.
        function updateDockVisibility() {
            ['leftPanel', 'rightPanel'].forEach(pid => {
                let p = document.getElementById(pid);
                p.classList.toggle('dock-empty', !p.querySelector('.menu-panel'));
            });
        }

        // Галка закрепления — прямо на кнопке вкладки, рядом с названием
        for(let mid in MENUS) {
            let cb = document.getElementById(mid + 'Pin'); cb.checked = MENUS[mid].pin;
            cb.addEventListener('mousedown', (e) => e.stopPropagation());
            cb.addEventListener('click', (e) => e.stopPropagation());
            cb.addEventListener('change', () => { MENUS[mid].pin = cb.checked; applyMenu(mid); saveLayout(); updateToggleAllPinsBtn(); });
        }

        // Линия-подчёркивание под вкладками — закрепляет/скрывает все разом, цвет отражает состояние
        document.getElementById('appTitle').addEventListener('click', () => location.reload());

        // Клик по подписи ползунка сбрасывает его к значению по умолчанию (defaultValue — то, что было
        // в атрибуте value в разметке). Один делегированный обработчик на всё приложение вместо
        // навешивания на каждый слайдер отдельно; querySelector(input) в guard'е отсекает подписи-обёртки
        // чекбоксов (у них input лежит ВНУТРИ label, а не следующим соседом).
        document.addEventListener('click', (e) => {
            let lbl = e.target.closest('label'); if(!lbl || lbl.querySelector('input')) return;
            let el = lbl.nextElementSibling;
            if(el && el.tagName === 'INPUT' && el.type === 'range') { el.value = el.defaultValue; el.dispatchEvent(new Event('input', { bubbles: true })); }
        });
        document.querySelectorAll('label').forEach(lbl => {
            if(lbl.querySelector('input')) return;
            let el = lbl.nextElementSibling;
            if(el && el.tagName === 'INPUT' && el.type === 'range') lbl.title = 'Клик — сбросить к умолчанию';
        });
        function updateToggleAllPinsBtn() {
            let allOn = Object.keys(MENUS).every(mid => isTabVisible(mid));
            let bar = document.getElementById('toggleAllPinsBtn');
            bar.classList.toggle('all-on', allOn);
            bar.title = allOn ? 'Скрыть все панели' : 'Показать все панели';
        }
        document.getElementById('toggleAllPinsBtn').addEventListener('click', () => {
            let turnOn = !Object.keys(MENUS).every(mid => isTabVisible(mid));
            for(let mid in MENUS) {
                if(mid === 'menuPlayer') {
                    if(turnOn) floatPlayerPanel(); else hideTab(mid);
                    continue;
                }
                MENUS[mid].pin = turnOn;
                let cb = document.getElementById(mid + 'Pin'); if(cb) cb.checked = turnOn;
                applyMenu(mid);
            }
            saveLayout();
            updateToggleAllPinsBtn();
        });

        // Восстановление раскладки: сперва закрепления и в какой зоне лежала панель, потом порядок внутри зоны.
        (function loadLayout() {
            let raw = null; try { raw = localStorage.getItem(LAYOUT_KEY); } catch(e) {}
            let L = null; if(raw) { try { L = JSON.parse(raw); } catch(e) {} }
            if(L && L.pins) for(let m in MENUS) if(L.pins[m] !== undefined) { MENUS[m].pin = !!L.pins[m]; let cb = document.getElementById(m + 'Pin'); if(cb) cb.checked = MENUS[m].pin; }
            if(L && L.groups) for(let m in MENUS) { let wid = 'panelWrap_' + m; if(MENUS[m].pin && L.groups[wid] && L.groups[wid].z !== 'canvas') MENUS[m].zone = L.groups[wid].z; }
            for(let m in MENUS) applyMenu(m);

            if(L && L.groups) {
                let list = Object.keys(L.groups).map(id => ({ id: id, z: L.groups[id].z, i: L.groups[id].i, x: L.groups[id].x, y: L.groups[id].y })).sort((a, b) => (a.i || 0) - (b.i || 0));
                list.forEach(it => {
                    let el = document.getElementById(it.id); if(!el) return;
                    if(it.z === 'canvas' && el.dataset.floatable === '1') {
                        el.classList.add('floating-panel'); document.body.appendChild(el);
                        el.style.left = Math.max(0, Math.min(window.innerWidth - 40, it.x || 20)) + 'px';
                        el.style.top = Math.max(0, Math.min(window.innerHeight - 40, it.y || 20)) + 'px';
                        return;
                    }
                    let z = document.getElementById(it.z);
                    if(z && el.parentElement === z) z.appendChild(el);
                });
            }
            updateToggleAllPinsBtn();
        })();

        // Меню: клик по НЕзакреплённой (и не плавающей) вкладке открывает её выпадающим окном
        // (закрывается кликом мимо или Esc, без закрепления); клик по уже ВИДИМОЙ вкладке — закреплена
        // ли она в панели или плавает отдельным окном на холсте — прячет её обратно.
        // Двойной клик — перебрасывает панель между левой и правой панелями (и закрепляет её); он
        // выставляет АБСОЛЮТНОЕ конечное состояние, а не переключает относительно текущего — поэтому
        // не важно, что перед ним успевают пройти два обычных click (они могут мигнуть промежуточным
        // состоянием, но dblclick всегда доводит результат до «закреплена, не на холсте»).
        document.querySelectorAll('.menu-btn').forEach(btn => {
            let mid = btn.dataset.menu;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if(e.detail > 1) return; // второй click двойного клика — им займётся dblclick, не дёргаем состояние по пути

        function cellAtPoint(px, py) {
            const W = UI.canvas.width, H = UI.canvas.height;
            const gx = STATE.gCols || 1, gy = STATE.gRows || 1;
            let pos = { x: px / W, y: py / H };
            if(STATE.isRadar) {
                let cxr = 0.5 + STATE.uOffX / W, cyr = 0.5 + STATE.panY / H;
                let dx = (pos.x - cxr) * (W / H), dy = pos.y - cyr;
                let radius = Math.sqrt(dx * dx + dy * dy) * 2, rAng = Math.atan2(dy, dx);
                let mode = parseFloat(document.getElementById('radarModeSelect').value) || 0;
                let ang = rAng, rowIdx;
                if(mode < 0.5) rowIdx = radius * gy;
                else if(mode < 1.5) rowIdx = (1 / Math.max(radius, 0.02)) * gy * 0.08;
                else if(mode < 2.5) rowIdx = radius * gy + ((rAng / (2 * Math.PI)) + 0.5) * STATE.ROWS * 0.15;
                else if(mode < 3.5) { if(radius > 1) return null; rowIdx = (Math.asin(Math.min(1, Math.max(0, radius))) / (Math.PI * 0.5)) * gy; }
                else { if(Math.abs(rAng) > Math.PI * 0.25) return null; ang = rAng * 4; rowIdx = radius * gy; }
                if(radius < ((parseInt(document.getElementById('centerHoleRange').value, 10) || 0) / 1000)) return null;
                let colIdx = (((ang + STATE.globalAngle) / (2 * Math.PI)) + 0.5) * STATE.COLS;
                return { x: Math.floor(colIdx), y: Math.floor(rowIdx), ang: rAng, radius: radius };
            }
            let aspect = W / H;
            let rx = (pos.x - 0.5) * aspect, ry = pos.y - 0.5;
            let ca = Math.cos(STATE.globalAngle), sa = Math.sin(STATE.globalAngle);
            let nx = rx * ca - ry * sa, ny = rx * sa + ry * ca;
            let qx = nx / aspect + 0.5 - STATE.uOffX / W, qy = ny + 0.5;
            return { x: Math.floor(qx * gx) - Math.floor((gx - STATE.COLS) * 0.5), y: Math.floor(qy * gy), ang: 0, radius: 0 };
        }

        // Клетка ФИГУРЫ (cy уже с учётом прокрутки) → её значение с наложением подложки-сетки.
        function bitAtFigCell(cx, cy, rInfo) {
            let sepGrid = document.getElementById('gridSepCheck').checked;
            // «Строк для холста» (см. main() шейдера): фигура видна только в первом окне [0, loopRows)
            // экранных строк сверху, внутри окна крутится через mod. Раньше это было только в GPU —
            // CPU-читалка клетки (используется выделением/записью ячеек) считала по старой формуле
            // без окна, из-за чего метка могла показывать не то, что реально нарисовано на холсте.
            let figBlocked = false, figCy = cy;
            if(!rInfo && !STATE.isRadar) {
                let loopRows = UI.wrapYCheck.checked ? 0 : Math.min(parseInt(document.getElementById('loopRowsRange').value, 10) || 1, STATE.ROWS);
                if(loopRows > 0) {
                    let rawCellY = cy - STATE.uOffY;   // cell.y ДО добавления смещения — так же, как в шейдере
                    if(rawCellY < 0 || rawCellY >= loopRows) figBlocked = true;
                    else figCy = ((cy % loopRows) + loopRows) % loopRows;
                }
            }
            if(!sepGrid) return figBlocked ? null : bitAtCell(cx, figCy, 2, rInfo);
            let f = figBlocked ? null : bitAtCell(cx, figCy, 0, rInfo);   // фигура рисуется поверх сетки
            return f !== null ? f : bitAtCell(cx, cy - STATE.uOffY + STATE.gridOffY, 1, rInfo);
        }

        // Что реально нарисовано в точке холста: 1, 0 или null (пусто).
        function bitAtScreen(px, py) {
            let c = cellAtPoint(px, py); if(!c) return null;
            return bitAtFigCell(c.x, c.y + STATE.uOffY, STATE.isRadar ? c : null);
        }

        // Обратный ход: клетка экранной сетки → точка холста (центр клетки).
        // Матрица повторяется по кругу, поэтому одна и та же клетка видна во многих местах —
        // wrapX/wrapY подтягивают ближайшую копию к центру экрана, иначе метка уезжает за край.
        function gridCellToScreen(sx, sy, wrapX, wrapY) {
            const W = UI.canvas.width, H = UI.canvas.height, gx = STATE.gCols || 1, gy = STATE.gRows || 1;
            if(wrapX && UI.wrapXCheck.checked && STATE.COLS) sx += STATE.COLS * Math.round((gx * 0.5 - sx) / STATE.COLS);
            if(wrapY && UI.wrapYCheck.checked && STATE.ROWS) sy += STATE.ROWS * Math.round((gy * 0.5 - sy) / STATE.ROWS);
            let qx = (sx + 0.5) / gx + STATE.uOffX / W, qy = (sy + 0.5) / gy;
            let aspect = W / H;
            let rx = (qx - 0.5) * aspect, ry = qy - 0.5;
            let ca = Math.cos(-STATE.globalAngle), sa = Math.sin(-STATE.globalAngle);
            let nx = rx * ca - ry * sa, ny = rx * sa + ry * ca;
            return { x: (nx / aspect + 0.5) * W, y: (ny + 0.5) * H };
        }
        // Клетка ФИГУРЫ → холст: метка едет вместе со своей клеткой при любом зуме, панораме и повороте
        function figCellToScreen(cx, cy) {
            return gridCellToScreen(cx + Math.floor(((STATE.gCols || 1) - STATE.COLS) * 0.5), cy - STATE.uOffY, true, true);
        }
        // Столбец фигуры на своей высоте экрана → холст. По X держимся за узор, по Y стоим на месте.
        function figColToScreen(cx, sy) {
            return gridCellToScreen(cx + Math.floor(((STATE.gCols || 1) - STATE.COLS) * 0.5), sy, true, false);
        }

        // ===== ВЫДЕЛЕННЫЕ ЯЧЕЙКИ КАК ГОЛОСА СИНТЕЗАТОРА =====
        // У каждой метки три привязки на выбор:
        //   «столбец»  — запомнен столбец узора (cx) и высота метки на экране (fy). Метка держится
        //                за свой столбец при зуме и панораме, а СТРОКИ бегут сквозь неё — значение
        //                мигает 1/0 в такт прокрутке. Это звукосниматель, он и даёт ритм.
        //   «к клетке» — запомнена конкретная клетка узора (cx/cy), метка едет вместе с ней.
        //                Значение при этом НЕ меняется от прокрутки — клетка своё значение не теряет;
        //                мигать оно может только от эха, слоёв, Ёлки и Аниматрицы.
        //   «к экрану» — запомнена точка холста: узор течёт под ней, но зум сдвигает метку на другую клетку.
        const CELLSEL = {
            pts: [],        // {px, py — экранный якорь; cx, cy — клетка фигуры (null в радаре)}
            marks: [],      // DOM-метки
            voices: [],     // {osc, gain} для режима «держать»
            vals: [],
            flips: [],      // сколько раз значение сменилось за последнюю секунду — видно, что чтение живое
            flipAcc: [], flipTime: 0, lastPoll: 0,
            recBuf: [],     // строка «01·01·...» на каждую метку — растущая запись значений
            lastRecordTime: 0,
            MAX: 16, MAXREC: 3000,
            // В радаре привязаться к клетке нечем (там строка/столбец — это радиус и угол), там всегда экран
            anchor: function() { return STATE.isRadar ? 'screen' : UI.cellAnchorSelect.value; },
            toggle: function(px, py) {
                const dpr = window.devicePixelRatio || 1;
                let near = Math.max(10 * dpr, Math.min(STATE.effX || 0, STATE.effY || 0) * 0.75);
                for(let i = 0; i < this.pts.length; i++) {
                    if(Math.abs(this.pts[i].px - px) <= near && Math.abs(this.pts[i].py - py) <= near) { this.remove(i); return; }
                }
                let c = cellAtPoint(px, py);
                let p = { px: px, py: py, cx: null, cy: null, fy: 0.5 };
                if(c && !STATE.isRadar) {
                    p.cx = c.x; p.cy = c.y + STATE.uOffY;      // клетка фигуры: прокрутка уже внутри cy
                    p.fy = (c.y + 0.5) / (STATE.gRows || 1);   // доля высоты экрана — переживает зум и смену размера окна
                    let s = figCellToScreen(p.cx, p.cy); p.px = s.x; p.py = s.y;   // метку сажаем ровно на клетку
                }
                this.push(p);
            },
            push: function(p) {
                if(this.pts.length >= this.MAX) return;
                this.pts.push(p); this.vals.push(undefined);   // undefined — «ещё не читали», чтобы метка отрисовалась в первом же кадре
                this.flips.push(0); this.flipAcc.push(0); this.recBuf.push('');
                let el = document.createElement('div'); el.className = 'cell-marker';
                el.innerHTML = '<i>' + (this.pts.length) + '</i><span>·</span>';
                UI.cellMarkers.appendChild(el); this.marks.push(el);
                this.voices.push(null);
                this.retune();
            },
            restore: function(list) { this.clear(); (list || []).forEach(p => this.push({ px: p.px, py: p.py, cx: (p.cx === undefined ? null : p.cx), cy: (p.cy === undefined ? null : p.cy), fy: (p.fy === undefined ? 0.5 : p.fy) })); },
            remove: function(i) {
                this.flips.splice(i, 1); this.flipAcc.splice(i, 1); this.recBuf.splice(i, 1);
                this.stopVoice(i);
                this.pts.splice(i, 1); this.vals.splice(i, 1); this.voices.splice(i, 1);
                this.marks[i].remove(); this.marks.splice(i, 1);
                for(let k = 0; k < this.marks.length; k++) this.marks[k].querySelector('i').textContent = k + 1;
                this.retune(); this.renderRecordOut();
            },
            clear: function() {
                for(let i = 0; i < this.pts.length; i++) this.stopVoice(i);
                this.pts = []; this.vals = []; this.voices = []; this.flips = []; this.flipAcc = []; this.recBuf = [];
                this.marks.forEach(m => m.remove()); this.marks = [];
                this.readout(); this.renderRecordOut();
            },
            // Текстовое поле показывает запись каждой метки на своей строке
            renderRecordOut: function() {
                let el = document.getElementById('cellRecordOut'); if(!el) return;
                el.value = this.recBuf.map((s, i) => (i + 1) + ': ' + s).join('\n');
                el.scrollTop = el.scrollHeight;
            },
            freq: function(i) {
                let oct = parseInt(UI.cellOctaveInput.value, 10) || 0;
                return SYNTH.scaleNotes[i % SYNTH.scaleNotes.length] * Math.pow(2, oct + Math.floor(i / SYNTH.scaleNotes.length));
            },
            level: function() { return ((parseInt(UI.cellVolRange.value, 10) || 0) / 100) * 0.22; },
            startVoice: function(i) {
                SYNTH.init(); if(SYNTH.ctx.state === 'suspended') SYNTH.ctx.resume();
                let osc = SYNTH.ctx.createOscillator(), g = SYNTH.ctx.createGain();
                osc.type = UI.cellWaveSelect.value || 'square';
                osc.frequency.setValueAtTime(this.freq(i), SYNTH.ctx.currentTime);
                g.gain.value = 0; osc.connect(g); g.connect(SYNTH.masterGain); osc.start();
                this.voices[i] = { osc: osc, gain: g };
            },
            stopVoice: function(i) {
                let v = this.voices[i]; if(!v) return;
                try { v.gain.gain.cancelScheduledValues(SYNTH.ctx.currentTime); v.gain.gain.setTargetAtTime(0, SYNTH.ctx.currentTime, 0.01); v.osc.stop(SYNTH.ctx.currentTime + 0.1); } catch(e) {}
                this.voices[i] = null;
            },
            // Короткий щипок — им озвучиваются режимы «щелчок». Мерцание 1/0 на такой ноте слышно
            // как отдельные удары, тогда как ровный сустейн на 60 Гц ухо принимает за один тон.
            pluck: function(i) {
                SYNTH.init(); if(SYNTH.ctx.state === 'suspended') SYNTH.ctx.resume();
                let now = SYNTH.ctx.currentTime;
                let osc = SYNTH.ctx.createOscillator(), g = SYNTH.ctx.createGain();
                osc.type = UI.cellWaveSelect.value || 'square';
                osc.frequency.setValueAtTime(this.freq(i), now);
                let lv = Math.max(0.0001, this.level());
                g.gain.setValueAtTime(lv, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
                osc.connect(g); g.connect(SYNTH.masterGain); osc.start(now); osc.stop(now + 0.1);
            },
            // Тембр/октаву меняем на лету, не перезапуская голоса
            retune: function() {
                if(!SYNTH.ctx) return;
                for(let i = 0; i < this.voices.length; i++) {
                    let v = this.voices[i]; if(!v) continue;
                    v.osc.type = UI.cellWaveSelect.value || 'square';
                    v.osc.frequency.setTargetAtTime(this.freq(i), SYNTH.ctx.currentTime, 0.01);
                }
            },
            readout: function() {
                let el = document.getElementById('cellReadout'); if(!el) return;
                if(!this.pts.length) { el.textContent = 'нет выделенных ячеек'; return; }
                el.textContent = this.vals.map((v, i) => (i + 1) + ':' + ((v === 0 || v === 1) ? v : '·') + '(' + this.flips[i] + '/с)').join('  ');
            },
            // Каждый кадр: пересчитываем, где сейчас метка, читаем клетку и подтягиваем звук.
            // Плеер может стоять — читаем всё равно, значение берётся из текущего состояния сцены.
            update: function() {
                if(!this.pts.length) return;
                const sound = UI.cellSynthCheck.checked;
                const mode = UI.cellModeSelect.value;                       // hold | step | edge
                const now = performance.now();
                const step = parseInt(UI.cellStepRange.value, 10) || 0;
                const poll = (now - this.lastPoll) >= step;                 // шаг 0 — каждый кадр
                if(poll) this.lastPoll = now;
                const anchor = this.anchor();
                const cRect = UI.canvas.getBoundingClientRect(), pRect = UI.cellMarkers.getBoundingClientRect();
                const kx = cRect.width / (UI.canvas.width || 1), ky = cRect.height / (UI.canvas.height || 1);
                let sizeX = STATE.isRadar ? 14 : Math.min(200, Math.max(9, (STATE.effX || 12) * kx));
                let sizeY = STATE.isRadar ? 14 : Math.min(200, Math.max(9, (STATE.effY || 12) * ky));
                // Раз в секунду счётчик смен обнуляем: он показывает, что чтение действительно живое
                let tick = (now - this.flipTime) >= 1000; if(tick) this.flipTime = now;
                // Запись — фиксированные 60 замеров в секунду, отдельно от «Шага» (тот только для звука)
                const recording = UI.cellRecordCheck && UI.cellRecordCheck.checked;
                const recTick = recording && (now - this.lastRecordTime) >= (1000 / 60);
                if(recTick) this.lastRecordTime = now;
                let redraw = false;
                for(let i = 0; i < this.pts.length; i++) {
                    let p = this.pts[i], bit;
                    if(anchor === 'column' && p.cx !== null) {
                        // Столбец держим за узор, высоту метки — за экран: строки бегут сквозь неё
                        let sy = Math.floor(p.fy * (STATE.gRows || 1));
                        let s = figColToScreen(p.cx, sy); p.px = s.x; p.py = s.y;
                        p.cy = sy + STATE.uOffY;                                       // клетка под меткой прямо сейчас
                        bit = bitAtFigCell(p.cx, p.cy, null);
                    } else if(anchor === 'cell' && p.cx !== null) {
                        let s = figCellToScreen(p.cx, p.cy); p.px = s.x; p.py = s.y;   // метка едет за своей клеткой
                        bit = bitAtFigCell(p.cx, p.cy, null);
                    } else bit = bitAtScreen(p.px, p.py);

                    if(recTick) {
                        this.recBuf[i] += (bit === 0 || bit === 1) ? String(bit) : '·';
                        if(this.recBuf[i].length > this.MAXREC) this.recBuf[i] = this.recBuf[i].slice(-this.MAXREC);
                    }

                    let prev = this.vals[i];
                    if(bit !== prev) { this.vals[i] = bit; this.flipAcc[i]++; redraw = true; }
                    if(tick) { this.flips[i] = this.flipAcc[i]; this.flipAcc[i] = 0; redraw = true; }

                    let m = this.marks[i];
                    m.style.left = (cRect.left - pRect.left + p.px * kx) + 'px';
                    m.style.top = (cRect.top - pRect.top + p.py * ky) + 'px';
                    m.style.width = sizeX + 'px'; m.style.height = sizeY + 'px';
                    m.style.fontSize = Math.max(8, Math.min(16, Math.min(sizeX, sizeY) * 0.7)) + 'px';
                    if(bit !== prev) {
                        m.querySelector('span').textContent = bit === null ? '·' : bit;
                        m.className = 'cell-marker' + (bit === 1 ? ' on' : (bit === null ? ' empty' : ''));
                    }

                    if(!sound) { if(this.voices[i]) this.stopVoice(i); continue; }
                    if(mode === 'hold') {
                        if(!this.voices[i]) this.startVoice(i);
                        if(poll) this.voices[i].gain.gain.setTargetAtTime(bit === 1 ? this.level() : 0, SYNTH.ctx.currentTime, 0.006);
                    } else {
                        if(this.voices[i]) this.stopVoice(i);
                        // step — щёлкаем по таймеру, пока в клетке единица; edge — только в момент прихода единицы
                        if(mode === 'step') { if(poll && bit === 1) this.pluck(i); }
                        else if(bit === 1 && prev !== 1) this.pluck(i);
                    }
                }
                if(redraw) this.readout();
                if(recTick) this.renderRecordOut();
            }
        };
        UI.cellClearBtn = document.getElementById('cellClearBtn');
        UI.cellClearBtn.addEventListener('click', () => CELLSEL.clear());
        document.getElementById('cellRecordClearBtn').addEventListener('click', () => { CELLSEL.recBuf = CELLSEL.recBuf.map(() => ''); CELLSEL.renderRecordOut(); });
        UI.cellSelectCheck.addEventListener('change', () => document.body.classList.toggle('cell-picking', UI.cellSelectCheck.checked));
        UI.cellWaveSelect.addEventListener('change', () => CELLSEL.retune());
        UI.cellOctaveInput.addEventListener('input', () => CELLSEL.retune());
        UI.cellSynthCheck.addEventListener('change', () => { if(UI.cellSynthCheck.checked) SYNTH.init(); });
        function cellStepLabel() { let v = parseInt(UI.cellStepRange.value, 10) || 0; document.getElementById('cellStepLabel').textContent = v ? v + ' мс' : 'каждый кадр'; }
        UI.cellStepRange.addEventListener('input', cellStepLabel); cellStepLabel();
        // Смена привязки: пересаживаем метки на клетку под ними, чтобы они не прыгнули
        UI.cellAnchorSelect.addEventListener('change', () => {
            if(UI.cellAnchorSelect.value === 'screen' || STATE.isRadar) return;
            CELLSEL.pts.forEach(p => { let c = cellAtPoint(p.px, p.py); if(c) { p.cx = c.x; p.cy = c.y + STATE.uOffY; p.fy = (c.y + 0.5) / (STATE.gRows || 1); } });
        });

        // ГЕНЕРАЦИЯ МАТРИЦЫ
        // Прежняя матрица всегда становится подложкой и повторяется по кругу под новой фигурой — генерация
        // фигур подложку больше не стирает, убрать её можно только вручную кнопкой «Очистить сетку».
        // Пустые клетки фигуры (в т.ч. обрезанный фон) пропускают подложку наружу, заполненные — перекрывают.
        function overlayOnPrev(m, w, h, prev, pw, ph) {
            if(!prev || !prev.length || !pw || !ph) return { m: m, w: w, h: h };
            let W = Math.max(w, pw), H = Math.max(h, ph); let res = createEmptyMatrix(W, H);
            // Подложку переносим как есть, вместе с её пометками активности — заново её не пересчитываем,
            // иначе ровные линии сетки попадают в «изменившиеся» и красятся активным цветом
            // Клетки подложки помечаем флагом g: в шейдере они продолжают повторяться даже при размыкании,
            // поэтому сетка остаётся бесконечной, а фигура поверх неё — единственной
            for(let y=0; y<H; y++) { let src = prev[y % ph] || []; for(let x=0; x<W; x++) { let c = src[x % pw]; res[y][x].c = c ? c.c : ' '; res[y][x].a = c ? (c.a || 0) : 0; res[y][x].g = 1; } }
            let ox = Math.floor((W - w) / 2), oy = Math.floor((H - h) / 2);
            for(let y=0; y<h; y++) for(let x=0; x<w; x++) { let cell = m[y][x]; if(cell.c !== ' ') { let t = res[y + oy][x + ox]; t.c = cell.c; t.a = cell.a || 0; t.g = 0; } }
            return { m: res, w: W, h: H };
        }

        function generateMatrix() {
            let prevM = STATE.lines, prevW = STATE.COLS, prevH = STATE.ROWS;
            let seed = UI.zerkSeedInput.value.trim() || "1"; let h = parseInt(UI.zerkCountInput.value, 10) || 250; let rule = UI.zerkRuleSelect.value;
            let w = seed.length + 2*h; STATE.COLS = w; STATE.ROWS = h; let m = createEmptyMatrix(w, h); let cx = Math.floor(w/2 - seed.length/2);
            if(rule === 'orbital') { for(let y=0; y<h; y++) { let len=2+y*4; for(let i=0; i<len; i++) m[y][i].c = (i%2===0)?'1':'0'; }
            } else if (rule === 'diagonal') { let nMat = Array.from({length: h}, () => Array(w).fill(0)); for(let i=0; i<seed.length; i++) { if(seed[i] === '1') { for(let y=0; y<h; y++) { let x=cx+i+y; if(x<w) nMat[y][x]++; } for(let y=0; y<h; y++) { let x=cx+i-y; if(x>=0) nMat[y][x]++; } } } for(let y=0; y<h; y++) for(let x=0; x<w; x++) m[y][x].c = (nMat[y][x]%2===1)?'1':'0';
            } else if (rule === 'ziggurat') { for(let y=0; y<h; y++) { for(let x=cx-y; x<=cx+y+seed.length-1; x++) { m[y][x].c = ((x-(cx-y))%3===0 || ((cx+y+seed.length-1)-x)%3===0) ? '1' : '0'; } }
            } else if (rule === 'vortex') { for(let y=0; y<h; y++) { for(let x=cx-y; x<=cx+y+seed.length-1; x++) m[y][x].c = (Math.abs(x-cx+y)%3===0) ? '0' : '1'; }

        // Вписать фигуру в экран и сбросить панораму/скролл
        function fitView() {
            STATE.offsetX = 0; STATE.offsetMatY = 0; STATE.layer2Y = 0; STATE.panY = 0; SEARCH.marks.clear();

        // Сдвиг короткой строки внутри общей ширины maxLen — портировано из Zerkalius-fold.html
        // (alignShift), см. #pasteAlignSelect/loadFigureFromText() ниже. "half"-варианты (⇱½ и
        // т.п.) из fold.html НЕ портированы — там это чисто CSS-подвижка на 0.5 символа для
        // ШРИФТОВОГО рендера строк, а тут дискретная матрица ячеек: половины ячейки не бывает,
        // "halfcenter"/"halfstairs" дали бы РОВНО ТЕ ЖЕ индексы, что center/stairs (см. запрос
        // пользователя, портируем то же выравнивание, но применительно к вставке фигуры Ctrl+V).
        function alignShift(maxLen, len, align) {
            const diff = maxLen - len;
            if (align === 'right') return diff;
            // "Лесенка" — сдвиг растёт с длиной САМОЙ строки (len-1), а не с остатком до maxLen,
            // поэтому НАМЕРЕННО может вылезти за maxLen — ширину матрицы (w) под это специально
            // досчитывает вызывающий код (loadFigureFromText), в отличие от fold.html (там это
            // просто текст, ему разъезжаться некуда).
            if (align === 'stairs') return len ? len - 1 : 0;
            if (align === 'center') return diff >> 1;
            return 0; // left (по умолчанию — прежнее поведение, каждая строка с x=0)
        }

        // Ctrl+V: вставить фигуру (строки из 0/1) прямо на холст
        function loadFigureFromText(txt) {
            let lines = txt.replace(/\r/g, '').split('\n').filter(l => /[01]/.test(l)); if(!lines.length) return false;
            let prevM = STATE.lines, prevW = STATE.COLS, prevH = STATE.ROWS;
            let h = lines.length, maxLen = Math.max(...lines.map(l => l.length));
            let align = (document.getElementById('pasteAlignSelect') || {}).value || 'left';
            let shifts = lines.map(l => alignShift(maxLen, l.length, align));
            // w — ширина матрицы: обычно maxLen, но у "Лесенки" отдельные строки уходят правее
            // maxLen (см. alignShift) — расширяем под самый дальний правый край, иначе запись
            // ушла бы за границы массива.
            let w = Math.max(maxLen, ...lines.map((l, i) => l.length + shifts[i]));
            let m = createEmptyMatrix(w, h);
            for(let y=0; y<h; y++) for(let x=0; x<lines[y].length; x++) { let ch = lines[y][x]; if(ch === '0' || ch === '1') m[y][x + shifts[y]].c = ch; }
            let mg = overlayOnPrev(precalcAct(m), w, h, prevM, prevW, prevH); m = mg.m; STATE.COLS = mg.w; STATE.ROWS = mg.h;
            STATE.lines = m; STATE.animatrixRow = 0; resetClearBackup(); updateDataTexture(); fitView();

        }
        window.addEventListener('paste', (e) => {

        // Перетаскивание текстового файла (или выделенного текста) в ЛЮБОЕ место окна — загрузка фигуры.
        // На холст вешать нельзя: сверху лежат панель, счётчик FPS и плавающие кнопки, файл падал мимо и открывался в браузере.
        const overField = (e) => { let t = e.target; return !!(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')); };

        // ПОИСК ПАТТЕРНОВ: префиксы строки поиска (1 бит, 2 бита, ...) ищутся по строкам матрицы;

        // Реальный шаг строки в <textarea> у части браузеров/масштабов экрана на доли пикселя отличается
        // от заданных в CSS 14px — на длинном списке паттернов это копится, и номера строк слева
        // (#searchHL) съезжают относительно текста. scrollHeight самого поля для замера не годится:
        // он не может быть меньше высоты видимой области, поэтому на коротком списке (не переполняющем
        // поле) даёт совсем не то число. Меряем на отдельном скрытом клоне textarea вне потока документа,
        // где высота ничем не ограничена и scrollHeight — честная высота содержимого.
        let searchLineHMeasured = null, searchLineHMeasureTA = null;
        function getSearchLineHeight() {
            if(searchLineHMeasured !== null) return searchLineHMeasured;

        // 'Roboto Mono' грузится асинхронно (@import с Google Fonts) — если замер выше произошёл

        if(document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => { searchLineHMeasured = null; renderSearchHL(); });
        }
        function setSearchPattern() {
            let raw = document.getElementById('searchInput').value.replace(/\r/g, '').split('\n');

            let skip1 = document.getElementById('searchSkipFirstCheck').checked;

            SEARCH.marks.clear(); SEARCH.currentMarks.clear(); if(SEARCH.currentMarksTimer) clearTimeout(SEARCH.currentMarksTimer);

        }
        // Слой подсветки под полем: полоса на каждой строке, золотая — если паттерн уже найден,
        // голубая с рамкой — если это та самая находка, к которой сейчас перелетели («К находке»)
        function renderSearchHL() {
            let ta = document.getElementById('searchInput'), hl = document.getElementById('searchHL');
            let raw = ta.value.replace(/\r/g, '').split('\n'); let html = '';
            let curK = (SEARCH.gotoIdx >= 0 && SEARCH.history[SEARCH.gotoIdx]) ? SEARCH.history[SEARCH.gotoIdx].k : -1;
            let lineH = getSearchLineHeight();
            for(let i=0; i<raw.length; i++) {
                let k = SEARCH.lineMap[i];
                let isPat = (k !== undefined && k >= 0);
                let done = isPat && SEARCH.found[k];
                let isCur = isPat && k === curK;
                let style = 'height:' + lineH.toFixed(3) + 'px;' + (isCur ? 'background:rgba(0,220,255,0.35);outline:1px solid rgba(0,220,255,0.8);outline-offset:-1px' : 'background:' + (done ? 'rgba(255,215,0,0.28)' : 'transparent'));

            }

        }
        // Итоговая картинка в памяти: те же правила наложения слоёв и эха, что в шейдере
        function wrapIdx(v, n) { return ((v % n) + n) % n; }
        function composedRows() {
            const R = STATE.ROWS, C = STATE.COLS;
            let layers = UI.dualCoreCheck.checked ? Math.max(2, parseInt(UI.layersRange.value, 10) || 2) : 1;
            let l1 = UI.freezeLayer1Check.checked ? 0 : STATE.offsetMatY;
            let echoOn = UI.echoModeCheck.checked, mask = UI.dualMaskCheck.checked;
            let plain = (layers === 1 && !echoOn), out = [];
            for(let y=0; y<R; y++) {
                let base = STATE.lines[y] || [], s = '';
                if(plain) { for(let x=0; x<C; x++) s += base[x] ? base[x].c : ' '; out.push(s); continue; }
                let extra = [];
                for(let k=1; k<layers; k++) extra.push(STATE.lines[wrapIdx(Math.floor(y + STATE.layer2Y * k - l1), R)] || []);
                let eRow = echoOn ? (STATE.lines[wrapIdx(Math.floor(y - STATE.echoOff), R)] || []) : null;
                for(let x=0; x<C; x++) {
                    let a = base[x] ? base[x].c : ' ';
                    for(let e=0; e<extra.length; e++) {
                        let b = extra[e][x] ? extra[e][x].c : ' ';
                        if(a !== ' ' && b !== ' ') { if(mask && a === b) a = ' '; } else if(b !== ' ') a = b;
                    }
                    if(eRow) { let b = eRow[x] ? eRow[x].c : ' '; if(a !== ' ' && b !== ' ') { if(a === b) a = ' '; } else if(b !== ' ') a = b; }

        // Линии поиска: строки, колонки и обе диагонали — общий список с шагом (dy, dx)
        function searchSections() {
            const R = STATE.ROWS, C = STATE.COLS, dir = document.getElementById('searchDirSelect').value;
            let secs = [];
            if(dir === 'all' || dir === 'h') secs.push({ kind: 'h', n: R });
            if(dir === 'all' || dir === 'v') secs.push({ kind: 'v', n: C });
            if(dir === 'all' || dir === 'd') { secs.push({ kind: 'd1', n: R + C - 1 }); secs.push({ kind: 'd2', n: R + C - 1 }); }
            return secs;
        }
        function lineGeom(secs, L) {
            const R = STATE.ROWS, C = STATE.COLS;
            let i = L;
            for(let s=0; s<secs.length; s++) {
                if(i >= secs[s].n) { i -= secs[s].n; continue; }
                if(secs[s].kind === 'h') return { y0: i, x0: 0, dy: 0, dx: 1, len: C, sym: '→' };
                if(secs[s].kind === 'v') return { y0: 0, x0: i, dy: 1, dx: 0, len: R, sym: '↓' };
                if(secs[s].kind === 'd1') { let d = i - (R - 1); let y0 = Math.max(0, -d), x0 = y0 + d; return { y0: y0, x0: x0, dy: 1, dx: 1, len: Math.min(R - y0, C - x0), sym: '↘' }; }
                let sm = i; let y0 = Math.max(0, sm - C + 1), x0 = sm - y0; return { y0: y0, x0: x0, dy: 1, dx: -1, len: Math.min(R - y0, x0 + 1), sym: '↙' };
            }
            return null;
        }

        function scanPatterns() {
            let dirty = false;
            let seq = document.getElementById('searchSeqCheck').checked;
            let active = [];
            for(let k=0; k<SEARCH.prefixes.length; k++) { if(!SEARCH.found[k]) { active.push(k); if(seq) break; } }
            if(!active.length) return;
            let comp = composedRows();
            let secs = searchSections(); let total = 0; for(let s=0; s<secs.length; s++) total += secs[s].n;
            if(!total) return;

                scanned += g.len;

                    let f = str.indexOf(needle);
                    if(f !== -1) {
                        SEARCH.found[k] = true;
                        for(let j=0; j<needle.length; j++) SEARCH.marks.add((g.y0 + g.dy * (f + j)) * STATE.COLS + (g.x0 + g.dx * (f + j)));
                        let mid = f + (needle.length - 1) / 2;
                        SEARCH.last = { k: k, y: g.y0 + g.dy * f, x: g.x0 + g.dx * f, cy: g.y0 + g.dy * mid, cx: g.x0 + g.dx * mid, sym: g.sym };
                        SEARCH.history.push(SEARCH.last);
                        dirty = true; active.splice(a, 1);
                    }
                }
            }
            let n = 0; for(let i=0; i<SEARCH.found.length; i++) if(SEARCH.found[i]) n++;
            document.getElementById('searchStatus').textContent = 'Найдено: ' + n + '/' + SEARCH.prefixes.length + (SEARCH.last ? ' · №' + (SEARCH.last.k + 1) + ' ' + SEARCH.last.sym + ' стр.' + SEARCH.last.y : '');
            if(dirty) { updateDataTexture(); renderSearchHL(); }
        }
        document.getElementById('searchHighlightCheck').addEventListener('change', () => {
            STATE.isPlaying = false; UI.playBtn.innerHTML = '▶ ПУСК GPU'; // пауза, чтобы разглядеть подсветку на застывшей картинке

        document.getElementById('searchInput').addEventListener('input', setSearchPattern);

        // Ручное растягивание #searchWrap (resize: vertical) не шлёт событие scroll на textarea,

        document.getElementById('searchDirSelect').addEventListener('change', setSearchPattern);
        // Перелёт по находкам: каждый клик — на одну назад (от самой последней к самой первой), по кругу
        document.getElementById('gotoFoundBtn').addEventListener('click', () => {
            if(!SEARCH.history.length) { document.getElementById('searchStatus').textContent = 'Пока ничего не найдено'; return; }

            let item = SEARCH.history[SEARCH.gotoIdx];
            let spX = (parseInt(UI.spacingXRange.value, 10) || 100) / 100, spY = (parseInt(UI.spacingYRange.value, 10) || 100) / 100;
            let gx = UI.canvas.width / (STATE.fSize * spX), gy = UI.canvas.height / (STATE.fSize * spY);
            let C = Math.floor((gx - STATE.COLS) / 2);
            let cx = (item.cx !== undefined) ? item.cx : item.x, cy = (item.cy !== undefined) ? item.cy : item.y;

            // прокрутить список к её строке и обвести её.
            let needle = SEARCH.needles[item.k] || SEARCH.prefixes[item.k] || '';

        UI.searchRateRange.addEventListener('input', () => { let v = parseInt(UI.searchRateRange.value, 10); document.getElementById('searchRateLabel').textContent = v === 0 ? 'каждый кадр' : (v / 1000) + 'с'; });
