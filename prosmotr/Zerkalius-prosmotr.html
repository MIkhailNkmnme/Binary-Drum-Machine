<!-- Zerkalius Просмотр GIF — v0.011. Покадровый просмотрщик и склейка GIF: открыть один или несколько GIF (кнопкой или бросив
     на страницу), листать по кадру и через 2 / 4 / 8, играть с любой скоростью, отметить участок «с — по» и положить в склейку;
     участки — из разных GIF, в любом порядке; склейку посмотреть и скачать одним GIF. Всё в самой странице, без библиотек:
     свой разбор GIF (LZW, палитры, прозрачность, способы смены кадра, чересстрочность) и своя сборка (тот же LZW, что в Code).
     v0.001: заведена 2026-09-29 по слову пользователя («нужен GIF-просмотрщик нормальный, чтобы покадрово, через кадр 2, 4, и
             разные участки выбирать, склеивать»). Цветов на один GIF — до 256 (у GIF из Zerkalius их 4–8).
     v0.002: «масштабировать колёсиком, клик — выбор определённого набора GIF и его раскладки, так же с размерами ромбов и
             треугольников». Колесо — масштаб к курсору, мышью — двигать; галка у GIF — в набор; набор играет разом, кадр в
             кадр, раскладкой: в ряд, столбиком, сеткой, △ треугольником (ряды 1, 2, 3 …), ◇ ромбом (1, 2 … n … 2, 1); у
             треугольника и ромба — размер в рядах, клетки заполняются GIF набора по кругу; раскладку — в GIF и PNG.
     v0.003: по снимку «склейка кадр 13 / 64 · Zerkalius-romby-… #49 · 250 мс» — «тут текст прыгает, название файла надо в сторонку»: счётчик
             и имя файла — два поля постоянной ширины; имя (в склейке оно меняется от кадра к кадру) — в своём, бледнее, длинное — с многоточием,
             целиком — в подсказке. Ползунок кадров больше не дёргается.
     v0.004: «пауза по щелчку»: щелчок по картинке (без протяжки — протяжка по-прежнему двигает вид) — пауза / играть, как пробел.
     v0.005: «у GIF общая сцена — надо строчную прокрутку вверх-вниз, туда-сюда, на огромных скоростях; задавать шаг прыжков
             размерами ромбов или треугольников». Сцена (GIF или раскладка) крутится по кругу, как барабан строк: ↓ ↑ или ↕
             туда-сюда с размахом; прыжок — 1 … 512 строк, строка — сколько-то px; скорость — до 5000 прыжков в секунду.
     v0.006: «надо постолбцовую ещё свёртку, нарезку», «если не ромбовую…» — ось прокрутки: по строкам, по столбцам, по
             диагоналям ↘ ↙ (вдоль рёбер ромбов); нарезка — полосы шириной в прыжок поперёк движения: целиком, встречно
             (соседние в разные стороны), лесенкой (каждая следующая — на прыжок больше).
     v0.007: разбор GIF «Аниматрица шаг1 проходы 526–781»: ромбы то растут, то сбрасываются, а соседние кадры мигают (чётные
             вдвое плотнее) — «да (поле кадра, только нечётные), и потом надо разобрать весь гиф, поделить на ромбы различной
             длины и сортировать по чёт / нечёт, и ещё как, и просто по порядку». Поле «кадр №»; кадры: все / нечётные /
             чётные. «◇ Разобрать» — в каждом кадре доля пустых ромбов (чёрных дыр внутри картинки), по ней GIF делится на
             участки отдельно по нечётным и чётным кадрам: ромб — пока дыры растут, сброс — новый ромб, между ними — шум;
             участки — в склейку. Склейку можно сортировать: по порядку, нечёт / чёт вперёд, по длине, по крупности ромбов,
             наоборот, вперемешку. Под ползунком — полоска-график дыр по кадрам (нечётные — жёлтым, чётные — голубым),
             щелчок по ней — к кадру.
     v0.008: по снимку столба ромбов — «как по сетке ромбов разрезать и потом их проиграть по порядку своих размеров в
             группу». «◇ Резать»: кадр режется по сетке ромбов от вершины треугольника (вершина и наклон ищутся сами), ромбы
             одного размера — группой: на своих местах с зазором, в строку или сеткой. Размер — 8 … 512 строк или «все»:
             весь фильм ромбами 16, потом 32, 64 … (или от крупных к мелким). Нарезку — в GIF. Чётность кадров теперь — по
             номеру кадра в GIF, а не по месту в ленте (в склейке и нарезке они разные).
     v0.009: по снимку «◇ 64 × 0» — «пустые картинки»: размер ромба умножался на «строку … px» прокрутки, а там стояло 64 —
             ромб 64 × 64 = 4096 px в кадр не влезал. Размер ромба теперь — px кадра, от прокрутки не зависит. «В строку»
             переносится по ширине кадра (была лента до 8192 px, в окне мельчало до ×0.1).
     v0.010: «каждый ромб своим маленьким фильмом — но сохранить прямо тут отдельной кнопкой, если нужно будет, а так всё в
             редакторе». Раскладка «по одному ромбу»: лента — весь фильм ромба 1, потом ромба 2 … (ряд за рядом, слева
             направо), размеры — по выбору (все — от мелких к крупным); ◇◀ ▶◇ и PageUp / PageDown — соседний ромб на том же
             кадре; двойной щелчок по ромбу в группе — он один. «💾 ромб» — фильм этого ромба одним GIF (мелкий — крупнее,
             до 256 px). Ромбы режутся раз на размер, группы собираются из них; полоска-график считается раз на ленту.
     v0.011: «в просмотрщике можно менять форму 1 и 0? сейчас там квадраты, хотелось бы по умолчанию ромбы». Форма клеток:
             ◆ ромбы (по умолчанию; у шахматной сетки треугольника соседи по диагонали смыкаются рёбрами), ◇ ромбы в клетке,
             ● круги, ▪ квадраты (как в GIF). Кнопка «0» — нули внутри картинки тусклыми клетками той же формы. Видно от
             увеличения ×2; сцена рисуется в m раз крупнее (3 … 12). PNG — с формой, GIF-файлы — исходными пикселями. -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerkalius Просмотр GIF — v0.011</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0c10; color: #d7e1eb; font: 13px/1.35 'Roboto Mono', Consolas, monospace; user-select: none; }
  h1 { margin: 0; font-size: 16px; color: #ffcc00; font-weight: bold; }
  .wrap { display: grid; grid-template-columns: 240px 1fr 280px; gap: 8px; height: 100vh; padding: 8px; }
  .panel { background: #15171e; border: 1px solid #2c303a; border-radius: 5px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .item { padding: 5px 6px; border: 1px solid #2c303a; border-radius: 4px; background: #1c1f28; cursor: pointer; font-size: 11px; }
  .item.on { border-color: #ffcc00; background: #2a2412; }
  .item.insel { box-shadow: inset 3px 0 0 #22d3ee; }
  .item b { color: #ffcc00; font-weight: normal; }
  .item .sub { color: #8a94a6; }
  .item .row { display: flex; gap: 4px; align-items: center; }
  .item .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item input[type=checkbox] { margin: 0; accent-color: #22d3ee; cursor: pointer; }
  button, select, input[type=number] { font: inherit; font-size: 12px; background: #202430; color: #d7e1eb; border: 1px solid #3a3f4c; border-radius: 3px; padding: 3px 7px; }
  button { cursor: pointer; }
  button:hover { border-color: #ffcc00; }
  button.big { font-size: 15px; padding: 3px 10px; }
  button.on { background: #2a2412; border-color: #ffcc00; color: #ffcc00; }
  button.mini { padding: 0 5px; font-size: 11px; }
  input[type=number] { width: 64px; }
  .stage { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
  /* v0.002: картинка по центру, а если крупнее окна — прокрутка (margin:auto вместо центровки флексом — иначе левый край уходит) */
  .view { flex: 1; min-height: 0; background: #000; border: 1px solid #2c303a; border-radius: 5px; overflow: auto; display: flex; position: relative; cursor: grab; }
  .view.pan { cursor: grabbing; }
  .view.drop { outline: 2px dashed #22d3ee; outline-offset: -6px; }
  #cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; margin: auto; flex: none; }
  .bar { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .bar .sp { flex: 1; }
  #pos { flex: 1; min-width: 120px; accent-color: #ffcc00; }
  /* v0.003, «текст прыгает — название файла в сторонку»: счётчик и имя — постоянной ширины, ползунок не дёргается */
  .num { color: #ffcc00; flex: 0 0 auto; width: 30ch; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .numName { color: #8a94a6; flex: 0 0 auto; width: 38ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ab { color: #22d3ee; }
  .tot { color: #8a94a6; font-size: 11px; }
  .lbl { color: #8a94a6; font-size: 11px; }
  .sel { color: #22d3ee; }
  input[type=file] { display: none; }
  /* v0.007: полоска-график дыр по кадрам */
  #graph { width: 100%; height: 34px; display: none; background: #07080b; border: 1px solid #2c303a; border-radius: 3px; cursor: pointer; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } .view { height: 60vh; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1 id="appTitle">Просмотр GIF <span style="color:#8a94a6; font-size:11px;">v0.011</span></h1>
    <div class="bar">
      <button id="openBtn" title="Открыть один или несколько GIF (их можно и просто бросить на страницу)">📂 Открыть GIF</button>
      <input type="file" id="file" accept="image/gif,.gif" multiple>
    </div>
    <div class="lbl">Открытые <span class="sel" title="Галка у GIF — в набор">· ☑ — в набор</span></div>
    <div class="list" id="gifs"></div>
    <div class="lbl sel">Набор</div>
    <div class="bar">
      <select id="laySel" title="Как показывать набор (галки у GIF): один — только выбранный GIF; остальные — все GIF набора разом, кадр в кадр">
        <option value="one" selected>▭ один GIF</option>
        <option value="row">⇢ в ряд</option>
        <option value="col">⇣ столбиком</option>
        <option value="grid">▦ сеткой</option>
        <option value="tri">△ треугольником</option>
        <option value="rhomb">◇ ромбом</option>
      </select>
      <input type="number" id="laySize" min="0" max="16" step="1" value="0" title="Размер треугольника или ромба — рядов (0 — сколько надо, чтобы поместился весь набор); клетки заполняются GIF набора по кругу" style="width:52px;">
    </div>
    <div class="bar">
      <button id="selAllBtn" class="mini" title="Все открытые — в набор">☑ все</button>
      <button id="selNoneBtn" class="mini" title="Снять набор">☐ никого</button>
      <button id="layGifBtn" class="mini" title="Скачать раскладку набора одним GIF — все кадры с выбранным шагом">💾 раскладку GIF</button>
    </div>
    <!-- v0.008: нарезка кадра по сетке ромбов -->
    <div class="lbl sel">◇ Нарезка по ромбам</div>
    <div class="bar">
      <button id="rcutBtn" title="Резать кадр по сетке ромбов от вершины треугольника — вкл / выкл (GIF или склейка; с раскладкой набора — нет)">◇ Резать</button>
      <select id="rcutSize" title="Размер ромба — строк (px) кадра. «Все» — группы ромбов одного размера играют по очереди: весь фильм ромбами одного размера, потом следующего">
        <option value="up" selected>все: мелкие → крупные</option>
        <option value="down">все: крупные → мелкие</option>
        <option value="8">ромб 8</option>
        <option value="16">ромб 16</option>
        <option value="32">ромб 32</option>
        <option value="64">ромб 64</option>
        <option value="128">ромб 128</option>
        <option value="256">ромб 256</option>
        <option value="512">ромб 512</option>
      </select>
    </div>
    <div class="bar">
      <select id="rcutLay" title="Как разложить группу ромбов: на своих местах, раздвинутые зазором; в строку по порядку (ряд за рядом, слева направо); сеткой; по одному — каждый ромб своим фильмом, по очереди (двойной щелчок по ромбу в группе — он один)">
        <option value="place" selected>на местах</option>
        <option value="line">в строку</option>
        <option value="grid">сеткой</option>
        <option value="one">по одному ромбу</option>
      </select>
      <input type="number" id="rcutGap" min="0" max="64" step="1" value="4" title="Зазор между ромбами, px" style="width:46px;"><span class="lbl">px</span>
      <button id="rcutGifBtn" class="mini" title="Скачать нарезку одним GIF — всю ленту, с шагом и чётностью">💾 GIF</button>
    </div>
    <div class="bar">
      <button id="rPrevBtn" class="mini" title="По одному: предыдущий ромб, тот же кадр (PageUp)">◇◀</button>
      <button id="rNextBtn" class="mini" title="По одному: следующий ромб, тот же кадр (PageDown)">▶◇</button>
      <button id="rOneGifBtn" class="mini" title="Сохранить фильм этого ромба одним GIF (с шагом и чётностью; мелкий ромб — крупнее, до 256 px)">💾 ромб</button>
    </div>
  </div>

  <div class="stage">
    <div class="view" id="view" title="Колесо — масштаб к курсору, тянуть мышью — двигать; сюда можно бросить GIF"><canvas id="cv" width="1" height="1"></canvas></div>
    <div class="bar">
      <button class="big" id="firstBtn" title="К первому кадру (Home)">⏮</button>
      <button class="big" id="prevBtn" title="Назад на шаг (←; Shift+← — на один кадр)">◀</button>
      <button class="big" id="playBtn" title="Играть / пауза (пробел)">▶</button>
      <button class="big" id="nextBtn" title="Вперёд на шаг (→; Shift+→ — на один кадр)">▶▶</button>
      <button class="big" id="lastBtn" title="К последнему кадру (End)">⏭</button>
      <select id="stepSel" title="Шаг: листать и играть через сколько кадров">
        <option value="1">каждый кадр</option>
        <option value="2">через 2</option>
        <option value="4">через 4</option>
        <option value="8">через 8</option>
        <option value="16">через 16</option>
      </select>
      <select id="parSel" title="Какие кадры: все, только нечётные (1, 3, 5 …) или только чётные (2, 4, 6 …) — листать, играть и класть в склейку">
        <option value="all" selected>все кадры</option>
        <option value="odd">нечётные</option>
        <option value="even">чётные</option>
      </select>
      <span class="lbl">мс</span><input type="number" id="msInp" min="10" max="5000" step="10" value="100" title="Сколько миллисекунд держать кадр при игре">
      <button id="revBtn" title="Играть назад">⇆</button>
      <button id="loopBtn" class="on" title="По кругу: дошёл до конца — снова с начала">🔁</button>
      <select id="zoomSel" title="Масштаб картинки (или колесом над ней)">
        <option value="fit" selected>вписать</option>
        <option value="1">×1</option><option value="2">×2</option><option value="3">×3</option><option value="4">×4</option><option value="6">×6</option><option value="8">×8</option>
        <option value="custom" disabled>×?</option>
      </select>
      <select id="cellShape" title="Форма клеток на экране: ромбы — сетка ромбов, соседние по диагонали смыкаются рёбрами; ромбы в клетке, круги — каждая в своём квадрате; квадраты — как в самом GIF. Видно при увеличении; в GIF-файлы идут исходные пиксели">
        <option value="rh" selected>◆ ромбы</option>
        <option value="rhi">◇ ромбы в клетке</option>
        <option value="ci">● круги</option>
        <option value="sq">▪ квадраты</option>
      </select>
      <button id="zeroBtn" class="on" title="Нули внутри картинки — тусклыми клетками той же формы (видна вся сетка)">0</button>
      <button id="pngBtn" title="Скачать то, что на экране (кадр или раскладку), картинкой PNG — с формой клеток">🖼 PNG</button>
    </div>
    <div class="bar">
      <input type="range" id="pos" min="0" max="0" value="0" title="Кадр">
      <input type="number" id="frInp" min="1" max="1" step="1" value="1" title="Кадр № — набрать и Enter (или стрелками поля)">
      <span class="num" id="num">—</span>
      <span class="numName" id="numName"></span>
    </div>
    <canvas id="graph" height="34" title="Доля пустых ромбов по кадрам: нечётные — жёлтым, чётные — голубым; щелчок — к кадру"></canvas>
    <div class="bar">
      <button id="aBtn" title="Начало участка — этот кадр ( [ )">[ с</button>
      <button id="bBtn" title="Конец участка — этот кадр ( ] )">по ]</button>
      <span class="ab" id="abTxt">участок: —</span>
      <span class="sp"></span>
      <button id="addBtn" title="Положить участок в склейку — с выбранным шагом (Enter)">➕ В склейку</button>
    </div>
    <!-- v0.005: строчная прокрутка сцены по кругу -->
    <div class="bar">
      <button id="scrBtn" title="Прокрутка сцены по кругу — вкл / выкл (кадры при этом играют и листаются как обычно)">⇅ Прокрутка</button>
      <select id="scrAxis" title="Ось прокрутки: по строкам, по столбцам или по диагонали — вдоль рёбер ромбов">
        <option value="rows" selected>≡ по строкам</option>
        <option value="cols">‖ по столбцам</option>
        <option value="diagR">↘ по диагонали</option>
        <option value="diagL">↙ по диагонали</option>
      </select>
      <select id="scrDir" title="Куда крутить: вперёд (вниз / вправо / по диагонали вниз), назад или туда-сюда">
        <option value="down" selected>→ вперёд</option>
        <option value="up">← назад</option>
        <option value="both">⇄ туда-сюда</option>
      </select>
      <select id="scrCut" title="Нарезка: полосы шириной в прыжок, поперёк движения">
        <option value="all" selected>целиком</option>
        <option value="counter">полосы встречно</option>
        <option value="stairs">полосы лесенкой</option>
      </select>
      <select id="scrStep" title="Прыжок — сколько строк: размером ромба или треугольника">
        <option value="1">прыжок 1 строка</option>
        <option value="2">2 строки</option>
        <option value="4">4 строки</option>
        <option value="8" selected>8 — ромб / △ 8</option>
        <option value="16">16 — ромб / △ 16</option>
        <option value="32">32 — ромб / △ 32</option>
        <option value="64">64 — ромб / △ 64</option>
        <option value="128">128 — ромб / △ 128</option>
        <option value="256">256 — ромб / △ 256</option>
        <option value="512">512 — ромб / △ 512</option>
      </select>

/* ---------- разбор на ромбы (v0.007) ----------
   Дыра — чёрное место не меньше «px» в поперечнике: точка, у которой в квадрате px × px вокруг нет ни одной светлой.
   Считается только внутри картинки — в каждой строке от первой светлой точки до последней, чтобы фон вокруг треугольника
   не шёл в счёт. Доля дыр по кадрам — g.holes. Участки режутся отдельно по нечётным и чётным кадрам (соседние мигают):
   ромб — пока дыры есть и не падают (упали ниже DROP от прежнего — сброс, новый ромб), без дыр — шум; ромб в один кадр — шум. */

    const o = y * W; let c = 0;
    for (let x = 0; x < Math.min(r, W); x++) if (fr[o + x]) c++;
    for (let x = 0; x < W; x++) {
      if (x + r < W && fr[o + x + r]) c++;
      if (x - r - 1 >= 0 && fr[o + x - r - 1]) c--;
      hz[o + x] = c > 0 ? 1 : 0;
    }
  }
  for (let y = 0; y < Math.min(r, H); y++) { const o = y * W; for (let x = 0; x < W; x++) cnt[x] += hz[o + x]; }

    if (y + r < H) { const o = (y + r) * W; for (let x = 0; x < W; x++) cnt[x] += hz[o + x]; }

$('sortSel').addEventListener('change', () => {
  const m = $('sortSel').value; $('sortSel').value = '';

  if (!S.gvals) { const v = new Float32Array(SEQ.length); SEQ.forEach((r, i) => { v[i] = r[0] >= 0 && S.gifs[r[0]] && S.gifs[r[0]].holes ? S.gifs[r[0]].holes[r[1]] : -1; }); S.gvals = v; }

async function openFiles(files) {
  for (const f of files) {
    if (!/\.gif$/i.test(f.name) && f.type !== 'image/gif') continue;
    try {
      const g = parseGif(await f.arrayBuffer(), f.name);
      S.gifs.push(g); S.cur = S.gifs.length - 1; S.mont = false; S.i = 0; S.a = S.b = null; $('msInp').value = g.delays[0];
    } catch (e) { alert(f.name + ': ' + e.message); }
  }
  abTxt(); refresh();
}

window.addEventListener('resize', draw);
$('pos').addEventListener('input', () => go(parseInt($('pos').value, 10) || 0, 1));
$('aBtn').addEventListener('click', () => setAB('a'));
$('bBtn').addEventListener('click', () => setAB('b'));
function setAB(w) { if (!SEQ.length || S.mont || layOn()) return; S[w] = SEQ[S.i][1]; abTxt(); }
$('addBtn').addEventListener('click', addSeg);
function addSeg() {
  if (S.mont || layOn() || S.cur < 0) return;
  const n = S.gifs[S.cur].frames.length;
  const w = parWant(), a = S.a !== null ? S.a : (w || 0);
  let b = S.b !== null ? S.b : n - 1;
  if (w !== undefined && (b - a) % 2) b += a <= b ? -1 : 1;   // v0.007: конец — той же чётности, что начало
  S.segs.push({ g: S.cur, a: a, b: b, st: stepEff() });
  S.a = S.b = null; abTxt(); lists();
}
$('showMontBtn').addEventListener('click', () => { if (!S.segs.length && !S.mont) return; S.mont = !S.mont; S.i = 0; refresh(); });
$('clearBtn').addEventListener('click', () => { S.segs = []; S.mont = false; refresh(); });
$('laySel').addEventListener('change', () => { S.i = 0; refresh(); });
$('laySize').addEventListener('input', () => draw());
$('selAllBtn').addEventListener('click', () => { S.sel = new Set(S.gifs.map((_, k) => k)); if (layout() === 'one') $('laySel').value = 'grid'; refresh(); });
$('selNoneBtn').addEventListener('click', () => { S.sel.clear(); refresh(); });
$('pngBtn').addEventListener('click', () => {
  const ref = SEQ[S.i]; if (!ref) return;
  const nm = ref[0] === -1 ? 'Zerkalius-raskladka-' + layout() + '-kadr-' + (ref[1] + 1) : S.gifs[ref[0]].name.replace(/\.gif$/i, '') + '-kadr-' + (ref[1] + 1);
  (shapeNow() !== 'sq' && S.shapeKey === S.offKey ? offS : off).toBlob(bl => download(bl, nm + '.png'));   // v0.011: с формой клеток
});

// общая палитра для нескольких GIF: фон (чёрный) — 0; щель раскладки — свой цвет
function unify(used, extra) {
  const pal = [[0, 0, 0]], key = new Map([[0, 0]]), maps = {};
  const idx = c => { const kk = (c[0] << 16) | (c[1] << 8) | c[2]; let m = key.get(kk); if (m === undefined) { m = pal.length; pal.push(c); key.set(kk, m); } return m; };
  for (const k of used) maps[k] = Uint8Array.from(S.gifs[k].cols.map(c => Math.min(255, idx(c))));
  const ex = extra ? idx(extra) : 0;
  return pal.length > 256 ? null : { pal, maps, ex };
}
$('saveBtn').addEventListener('click', () => {
  if (!S.segs.length) return;
  const refs = []; for (const sg of S.segs) for (let f = sg.a; sg.a <= sg.b ? f <= sg.b : f >= sg.b; f += (sg.a <= sg.b ? sg.st : -sg.st)) refs.push([sg.g, f]);
  const used = [...new Set(refs.map(r => r[0]))];
  const OW = Math.max(...used.map(k => S.gifs[k].W)), OH = Math.max(...used.map(k => S.gifs[k].H));
  const U = unify(used); if (!U) { alert('Вместе больше 256 цветов — склейку одним GIF не собрать'); return; }
  const frames = refs.map(([k, f]) => {
    const g = S.gifs[k], src = g.frames[f], mp = U.maps[k], out = new Uint8Array(OW * OH);
    const ox = Math.floor((OW - g.W) / 2), oy = Math.floor((OH - g.H) / 2);
    for (let y = 0; y < g.H; y++) { const b = (oy + y) * OW + ox; for (let x = 0; x < g.W; x++) out[b + x] = mp[src[y * g.W + x]]; }
    return out;
  });
  const cs = Math.max(2, Math.round((parseInt($('outMs').value, 10) || 100) / 10));
  download(encodeGif(frames, OW, OH, U.pal, cs), 'Zerkalius-skleyka-' + frames.length + '-kadrov.gif');
});
// v0.002: раскладка набора — одним GIF, все кадры с выбранным шагом
$('layGifBtn').addEventListener('click', () => {
  if (!layOn()) { alert('Отметьте GIF галками и выберите раскладку'); return; }
  const G = geom(), used = setList(), U = unify(used, GAP_COL);
  if (!U) { alert('Вместе больше 256 цветов — раскладку одним GIF не собрать'); return; }
  const n = Math.max(...used.map(k => S.gifs[k].frames.length)), st = step(), frames = [];
  if ((Math.ceil(n / st)) * G.W * G.H > 4e8) { alert('Слишком большая раскладка для одного GIF — возьмите шаг больше или меньше клеток'); return; }
  for (let f = 0; f < n; f += st) {
    const out = new Uint8Array(G.W * G.H).fill(U.ex);
    for (const c of G.cells) {
      const g = S.gifs[c.g], mp = U.maps[c.g], src = g.frames[f % g.frames.length];
      for (let y = 0; y < c.ch; y++) out.fill(mp[0], (c.cy + y) * G.W + c.cx, (c.cy + y) * G.W + c.cx + c.cw);
      for (let y = 0; y < g.H; y++) { const o = (c.y + y) * G.W + c.x, s = y * g.W; for (let x = 0; x < g.W; x++) out[o + x] = mp[src[s + x]]; }
    }
    frames.push(out);
  }
  const cs = Math.max(2, Math.round((parseInt($('outMs').value, 10) || 100) / 10));
  download(encodeGif(frames, G.W, G.H, U.pal, cs), 'Zerkalius-raskladka-' + layout() + '-' + used.length + 'gif-' + frames.length + '-kadrov.gif');
});

/* ---------- клавиши ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  const k = e.key;
  if (k === 'ArrowLeft') { go(S.i - (e.shiftKey ? 1 : stepEff()), -1); e.preventDefault(); }
  else if (k === 'ArrowRight') { go(S.i + (e.shiftKey ? 1 : stepEff()), 1); e.preventDefault(); }
  else if (k === ' ') { play(!S.playing); e.preventDefault(); }
  else if (k === 'PageUp') { rJump(-1); e.preventDefault(); }   // v0.010: по одному — соседний ромб
  else if (k === 'PageDown') { rJump(1); e.preventDefault(); }
  else if (k === 'Home') go(0, 1);
  else if (k === 'End') go(SEQ.length - 1, -1);
  else if (k === '[') setAB('a');
  else if (k === ']') setAB('b');
  else if (k === 'Enter') addSeg();
  else if (k === '0') { S.zoom = 'fit'; $('zoomSel').value = 'fit'; draw(); }
  else if (k === 'ArrowUp') { jump(-1); if (SEQ.length) blit(); e.preventDefault(); }   // v0.005: прыжок прокрутки
  else if (k === 'ArrowDown') { jump(1); if (SEQ.length) blit(); e.preventDefault(); }
});
refresh();
</script>
