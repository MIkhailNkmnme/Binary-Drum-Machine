<!-- Zerkalius Просмотр GIF — v0.006. Покадровый просмотрщик и склейка GIF: открыть один или несколько GIF (кнопкой или бросив
     на страницу), листать по кадру и через 2 / 4 / 8, играть с любой скоростью, отметить участок «с — по» и положить в склейку;
     участки — из разных GIF, в любом порядке; склейку посмотреть и скачать одним GIF. Всё в самой странице, без библиотек:
     свой разбор GIF (LZW, палитры, прозрачность, способы смены кадра, чересстрочность) и своя сборка (тот же LZW, что в Code).
     v0.001: заведена 2026-09-29 по слову пользователя («нужен GIF-просмотрщик нормальный, чтобы покадрово, через кадр 2, 4, и
             разные участки выбирать, склеивать»). Цветов на один GIF — до 256 (у GIF из Zerkalius их 4–8).
     v0.002: «масштабировать колёсиком, клик — выбор определённого набора GIF и его раскладки, так же с размерами ромбов и
             треугольников». Колесо — масштаб к курсору, мышью — двигать; галка у GIF — в набор; набор играет разом, кадр в
             кадр, раскладкой: в ряд, столбиком, сеткой, △ треугольником (ряды 1, 2, 3 …), ◇ ромбом (1, 2 … n … 2, 1); у
             треугольника и ромба — размер в рядах, клетки заполняются GIF набора по кругу; раскладку — в GIF и PNG.
     v0.003: по снимку «склейка кадр 13 / 64 · Zerkalius-romby-… #49 · 250 мс» — «тут текст прыгает, название файла надо в сторонку»: счётчик
             и имя файла — два поля постоянной ширины; имя (в склейке оно меняется от кадра к кадру) — в своём, бледнее, длинное — с многоточием,
             целиком — в подсказке. Ползунок кадров больше не дёргается.
     v0.004: «пауза по щелчку»: щелчок по картинке (без протяжки — протяжка по-прежнему двигает вид) — пауза / играть, как пробел.
     v0.005: «у GIF общая сцена — надо строчную прокрутку вверх-вниз, туда-сюда, на огромных скоростях; задавать шаг прыжков
             размерами ромбов или треугольников». Сцена (GIF или раскладка) крутится по кругу, как барабан строк: ↓ ↑ или ↕
             туда-сюда с размахом; прыжок — 1 … 512 строк, строка — сколько-то px; скорость — до 5000 прыжков в секунду.
     v0.006: «надо постолбцовую ещё свёртку, нарезку», «если не ромбовую…» — ось прокрутки: по строкам, по столбцам, по
             диагоналям ↘ ↙ (вдоль рёбер ромбов); нарезка — полосы шириной в прыжок поперёк движения: целиком, встречно
             (соседние в разные стороны), лесенкой (каждая следующая — на прыжок больше). -->

<body>

<script>
/* ---------- разбор GIF ---------- */
let GIF_ID = 0;   // v0.005: у каждого открытого GIF свой номер — для кэша картинки сцены
function lzwDecode(minSize, data, n) {
  const out = new Uint8Array(n), clear = 1 << minSize, eoi = clear + 1;
  const prefix = new Int16Array(4096), suffix = new Uint8Array(4096), first = new Uint8Array(4096), stack = new Uint8Array(4097);
  for (let i = 0; i < clear; i++) { prefix[i] = -1; suffix[i] = i; first[i] = i; }
  let size = minSize + 1, mask = (1 << size) - 1, next = eoi + 1, prev = -1, cur = 0, bits = 0, dp = 0, op = 0;
  while (op < n) {
    while (bits < size) { if (dp >= data.length) return out; cur |= data[dp++] << bits; bits += 8; }
    const code = cur & mask; cur >>>= size; bits -= size;
    if (code === clear) { size = minSize + 1; mask = (1 << size) - 1; next = eoi + 1; prev = -1; continue; }
    if (code === eoi) break;
    if (prev === -1) { out[op++] = suffix[code]; prev = code; continue; }
    let c = code, sp = 0;
    if (code >= next) { stack[sp++] = first[prev]; c = prev; }
    while (c >= clear) { stack[sp++] = suffix[c]; c = prefix[c]; }
    stack[sp++] = suffix[c];
    while (sp > 0 && op < n) out[op++] = stack[--sp];
    if (next < 4096) { prefix[next] = prev; suffix[next] = suffix[c]; first[next] = first[prev]; next++; if (next > mask && size < 12) { size++; mask = (1 << size) - 1; } }
    prev = code;
  }
  return out;
}
function deinterlace(idx, w, h) {
  const out = new Uint8Array(w * h); let r = 0;
  for (const [s0, st] of [[0, 8], [4, 8], [2, 4], [1, 2]]) for (let y = s0; y < h; y += st) { out.set(idx.subarray(r * w, r * w + w), y * w); r++; }
  return out;
}
// кадры — готовые картинки: номера цветов общей таблицы этого GIF (0 — фон, чёрный), по пикселю
function parseGif(buf, name) {
  const b = new Uint8Array(buf); let p = 0;
  const u8 = () => b[p++], u16 = () => { const v = b[p] | (b[p + 1] << 8); p += 2; return v; };
  if (String.fromCharCode(b[0], b[1], b[2], b[3]) !== 'GIF8') throw new Error('это не GIF');
  p = 6; const W = u16(), H = u16(), fl = u8(); u8(); u8();
  let gct = null; if (fl & 0x80) { const n = 2 << (fl & 7); gct = b.subarray(p, p + n * 3); p += n * 3; }
  const cols = [[0, 0, 0]], key = new Map([[0, 0]]);
  const canvas = new Uint8Array(W * H), frames = [], delays = [];
  let gce = { delay: 10, disp: 0, tr: -1 };
  while (p < b.length) {
    const t = u8();
    if (t === 0x21) {
      const lab = u8();
      if (lab === 0xF9) { u8(); const f = u8(), d = u16(), ti = u8(); u8(); gce = { delay: d, disp: (f >> 2) & 7, tr: (f & 1) ? ti : -1 }; }
      else { let n; while ((n = u8())) p += n; }
    } else if (t === 0x2C) {
      const x = u16(), y = u16(), w = u16(), h = u16(), f = u8();
      let pal = gct; if (f & 0x80) { const n = 2 << (f & 7); pal = b.subarray(p, p + n * 3); p += n * 3; }
      const minSize = u8(), chunks = []; let tot = 0, n;
      while ((n = u8())) { chunks.push(b.subarray(p, p + n)); tot += n; p += n; }
      const data = new Uint8Array(tot); let o = 0; for (const c of chunks) { data.set(c, o); o += c.length; }
      let idx = lzwDecode(minSize, data, w * h); if (f & 0x40) idx = deinterlace(idx, w, h);
      const map = new Int16Array(256).fill(-1);
      const saved = gce.disp === 3 ? canvas.slice() : null;
      for (let yy = 0; yy < h; yy++) {
        const Y = y + yy; if (Y >= H) break;
        for (let xx = 0; xx < w; xx++) {
          const X = x + xx; if (X >= W) break;
          const pi = idx[yy * w + xx]; if (pi === gce.tr) continue;
          let m = map[pi];
          if (m < 0) {
            const r = pal ? pal[pi * 3] : 0, g = pal ? pal[pi * 3 + 1] : 0, bl = pal ? pal[pi * 3 + 2] : 0, k = (r << 16) | (g << 8) | bl;
            m = key.get(k);
            if (m === undefined) { if (cols.length >= 256) throw new Error('больше 256 цветов — такой GIF не поддерживается'); m = cols.length; cols.push([r, g, bl]); key.set(k, m); }
            map[pi] = m;
          }
          canvas[Y * W + X] = m;
        }
      }
      frames.push(canvas.slice()); delays.push(gce.delay * 10 || 100);
      if (gce.disp === 2) { for (let yy = 0; yy < h; yy++) canvas.fill(0, (y + yy) * W + x, (y + yy) * W + Math.min(W, x + w)); }
      else if (gce.disp === 3 && saved) canvas.set(saved);
      gce = { delay: 10, disp: 0, tr: -1 };
    } else break;
  }
  if (!frames.length) throw new Error('в GIF нет кадров');
  return { id: ++GIF_ID, name, W, H, cols, frames, delays };
}

/* ---------- сборка GIF (тот же LZW, что в Code) ---------- */
function lzwEncode(ix, minSize, tab) {
  const clear = 1 << minSize, eoi = clear + 1, bytes = [];
  tab.fill(-1);
  let size = minSize + 1, next = eoi + 1, cur = 0, bits = 0;
  const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
  emit(clear);
  let pre = ix[0];
  for (let i = 1; i < ix.length; i++) {
    const k = ix[i], key = (pre << 8) | k, code = tab[key];
    if (code !== -1) { pre = code; continue; }
    emit(pre);
    if (next === 4096) { emit(clear); tab.fill(-1); next = eoi + 1; size = minSize + 1; }
    else { if (next >= (1 << size)) size++; tab[key] = next++; }
    pre = k;
  }
  emit(pre); emit(eoi);
  if (bits > 0) bytes.push(cur & 255);
  return bytes;
}
function encodeGif(frames, w, h, palette, delayCs) {

      S.gifs.push(g); S.cur = S.gifs.length - 1; S.mont = false; S.i = 0; S.a = S.b = null; $('msInp').value = g.delays[0];

}

$('zoomSel').addEventListener('change', () => { const v = $('zoomSel').value; S.zoom = v === 'fit' ? 'fit' : parseFloat(v); draw(); });
window.addEventListener('resize', draw);
$('pos').addEventListener('input', () => { S.i = parseInt($('pos').value, 10) || 0; draw(); });
$('aBtn').addEventListener('click', () => setAB('a'));
$('bBtn').addEventListener('click', () => setAB('b'));
function setAB(w) { if (!SEQ.length || S.mont || layOn()) return; S[w] = SEQ[S.i][1]; abTxt(); }
$('addBtn').addEventListener('click', addSeg);
function addSeg() {
  if (S.mont || layOn() || S.cur < 0) return;
  const n = S.gifs[S.cur].frames.length;
  const a = S.a !== null ? S.a : 0, b = S.b !== null ? S.b : n - 1;
  S.segs.push({ g: S.cur, a: a, b: b, st: step() });
  S.a = S.b = null; abTxt(); lists();
}
$('showMontBtn').addEventListener('click', () => { if (!S.segs.length && !S.mont) return; S.mont = !S.mont; S.i = 0; refresh(); });
$('clearBtn').addEventListener('click', () => { S.segs = []; S.mont = false; refresh(); });
$('laySel').addEventListener('change', () => { S.i = 0; refresh(); });
$('laySize').addEventListener('input', () => draw());
$('selAllBtn').addEventListener('click', () => { S.sel = new Set(S.gifs.map((_, k) => k)); if (layout() === 'one') $('laySel').value = 'grid'; refresh(); });
$('selNoneBtn').addEventListener('click', () => { S.sel.clear(); refresh(); });
$('pngBtn').addEventListener('click', () => {
  const ref = SEQ[S.i]; if (!ref) return;
  const nm = ref[0] === -1 ? 'Zerkalius-raskladka-' + layout() + '-kadr-' + (ref[1] + 1) : S.gifs[ref[0]].name.replace(/\.gif$/i, '') + '-kadr-' + (ref[1] + 1);
  off.toBlob(bl => download(bl, nm + '.png'));
});

// общая палитра для нескольких GIF: фон (чёрный) — 0; щель раскладки — свой цвет
function unify(used, extra) {
  const pal = [[0, 0, 0]], key = new Map([[0, 0]]), maps = {};
  const idx = c => { const kk = (c[0] << 16) | (c[1] << 8) | c[2]; let m = key.get(kk); if (m === undefined) { m = pal.length; pal.push(c); key.set(kk, m); } return m; };
  for (const k of used) maps[k] = Uint8Array.from(S.gifs[k].cols.map(c => Math.min(255, idx(c))));
  const ex = extra ? idx(extra) : 0;
  return pal.length > 256 ? null : { pal, maps, ex };
}
$('saveBtn').addEventListener('click', () => {
  if (!S.segs.length) return;
  const refs = []; for (const sg of S.segs) for (let f = sg.a; sg.a <= sg.b ? f <= sg.b : f >= sg.b; f += (sg.a <= sg.b ? sg.st : -sg.st)) refs.push([sg.g, f]);
  const used = [...new Set(refs.map(r => r[0]))];
  const OW = Math.max(...used.map(k => S.gifs[k].W)), OH = Math.max(...used.map(k => S.gifs[k].H));
  const U = unify(used); if (!U) { alert('Вместе больше 256 цветов — склейку одним GIF не собрать'); return; }
  const frames = refs.map(([k, f]) => {
    const g = S.gifs[k], src = g.frames[f], mp = U.maps[k], out = new Uint8Array(OW * OH);
    const ox = Math.floor((OW - g.W) / 2), oy = Math.floor((OH - g.H) / 2);
    for (let y = 0; y < g.H; y++) { const b = (oy + y) * OW + ox; for (let x = 0; x < g.W; x++) out[b + x] = mp[src[y * g.W + x]]; }
    return out;
  });
  const cs = Math.max(2, Math.round((parseInt($('outMs').value, 10) || 100) / 10));
  download(encodeGif(frames, OW, OH, U.pal, cs), 'Zerkalius-skleyka-' + frames.length + '-kadrov.gif');
});
// v0.002: раскладка набора — одним GIF, все кадры с выбранным шагом
$('layGifBtn').addEventListener('click', () => {
  if (!layOn()) { alert('Отметьте GIF галками и выберите раскладку'); return; }
  const G = geom(), used = setList(), U = unify(used, GAP_COL);
  if (!U) { alert('Вместе больше 256 цветов — раскладку одним GIF не собрать'); return; }
  const n = Math.max(...used.map(k => S.gifs[k].frames.length)), st = step(), frames = [];
  if ((Math.ceil(n / st)) * G.W * G.H > 4e8) { alert('Слишком большая раскладка для одного GIF — возьмите шаг больше или меньше клеток'); return; }
  for (let f = 0; f < n; f += st) {
    const out = new Uint8Array(G.W * G.H).fill(U.ex);
    for (const c of G.cells) {
      const g = S.gifs[c.g], mp = U.maps[c.g], src = g.frames[f % g.frames.length];
      for (let y = 0; y < c.ch; y++) out.fill(mp[0], (c.cy + y) * G.W + c.cx, (c.cy + y) * G.W + c.cx + c.cw);
      for (let y = 0; y < g.H; y++) { const o = (c.y + y) * G.W + c.x, s = y * g.W; for (let x = 0; x < g.W; x++) out[o + x] = mp[src[s + x]]; }
    }
    frames.push(out);
  }
  const cs = Math.max(2, Math.round((parseInt($('outMs').value, 10) || 100) / 10));
  download(encodeGif(frames, G.W, G.H, U.pal, cs), 'Zerkalius-raskladka-' + layout() + '-' + used.length + 'gif-' + frames.length + '-kadrov.gif');
});

/* ---------- клавиши ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  const k = e.key;
  if (k === 'ArrowLeft') { go(S.i - (e.shiftKey ? 1 : step())); e.preventDefault(); }
  else if (k === 'ArrowRight') { go(S.i + (e.shiftKey ? 1 : step())); e.preventDefault(); }
  else if (k === ' ') { play(!S.playing); e.preventDefault(); }
  else if (k === 'Home') { S.i = 0; draw(); }
  else if (k === 'End') { S.i = SEQ.length - 1; draw(); }
  else if (k === '[') setAB('a');
  else if (k === ']') setAB('b');
  else if (k === 'Enter') addSeg();
  else if (k === '0') { S.zoom = 'fit'; $('zoomSel').value = 'fit'; draw(); }
  else if (k === 'ArrowUp') { jump(-1); if (SEQ.length) blit(); e.preventDefault(); }   // v0.005: прыжок прокрутки
  else if (k === 'ArrowDown') { jump(1); if (SEQ.length) blit(); e.preventDefault(); }
});
refresh();
</script>
