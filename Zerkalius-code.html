            }
        };

        const MODULE_ALGORITHMS = {
            findDiagonals: function(visibleLines, visibleHeight) {
                if (visibleLines.length === 0) return [];
                const H = visibleHeight; let W = 0;
                for(let r=0; r<H; r++) if(visibleLines[r] && visibleLines[r].text.length > W) W = visibleLines[r].text.length;
                const boldMask = Array.from({length: H}, () => Array(W).fill(false));
                const validChars = ['0', '1'];
                for (let r = 0; r < H; r++) {
                    if (!visibleLines[r]) continue;
                    const text = visibleLines[r].text;
                    for (let c = 0; c < text.length; c++) {
                        const char = text[c]; if (!validChars.includes(char)) continue;
                        let len = 1; while (r + len < H && visibleLines[r+len] && c + len < visibleLines[r+len].text.length && visibleLines[r+len].text[c+len] === char) len++;
                        if (len > 1) for (let k = 0; k < len; k++) boldMask[r+k][c+k] = true;
                    }
                }
                for (let r = 0; r < H; r++) {
                    if (!visibleLines[r]) continue;
                    const text = visibleLines[r].text;
                    for (let c = 0; c < text.length; c++) {
                        const char = text[c]; if (!validChars.includes(char)) continue;
                        let len = 1; while (r + len < H && visibleLines[r+len] && c - len >= 0 && visibleLines[r+len].text[c-len] === char) len++;
                        if (len > 1) for (let k = 0; k < len; k++) boldMask[r+k][c-k] = true;
                    }
                }
                return boldMask;
            },
            checkSymmetry: function(shapeLines) {
                if (!shapeLines || shapeLines.length === 0) return "Пусто";
                let symCount = 0; let totalCount = 0;
                for(let line of shapeLines) {
                    let s = line.text.trim();
                    if(s.length === 0) continue;
                    let left = s.substring(0, Math.floor(s.length/2));
                    let right = s.substring(Math.ceil(s.length/2)).split('').reverse().join('');
                    totalCount += left.length;
                    for(let i=0; i<left.length; i++) if(left[i] === right[i]) symCount++;
                }
                if(totalCount === 0) return "N/A";
                let percent = Math.round((symCount / totalCount) * 100);
                return percent === 100 ? "Симметрия: 100% ⚖️" : `Асимметрия (${percent}%) 📐`;
            }
        };

        /* 35.53: GIF-КОДИРОВЩИК — свой, без библиотек: страница работает и с диска, без интернета, а внешний
           файл пришлось бы возить рядом. Палитра на 4 цвета (фон, «0», «1», подпись), сжатие LZW — как в
           стандарте GIF89a; порядок роста размера кода — как у проверенного omggif (иначе картинку не прочтёт
           ни один просмотрщик). Кадры — массивы номеров цвета, по пикселю; delay — в сотых долях секунды. */
        const GIFENC = {
            encode: function(frames, w, h, palette, delay) {
                const out = [];
                const w16 = v => { out.push(v & 255, (v >> 8) & 255); };
                const str = t => { for (let i = 0; i < t.length; i++) out.push(t.charCodeAt(i)); };
                str('GIF89a'); w16(w); w16(h);
                // 35.57: палитра 4 или 8 цветов (2 или 3 бита) — по длине переданной
                const bits = palette.length > 4 ? 3 : 2, nCol = 1 << bits;
                out.push(0x80 | ((bits - 1) << 4) | (bits - 1), 0, 0);   // глобальная палитра
                for (let i = 0; i < nCol; i++) { const c = palette[i] || [0, 0, 0]; out.push(c[0], c[1], c[2]); }
                out.push(0x21, 0xFF, 0x0B); str('NETSCAPE2.0'); out.push(0x03, 0x01, 0, 0, 0);   // по кругу без конца
                for (const fr of frames) {
                    out.push(0x21, 0xF9, 0x04, 0x04); w16(delay); out.push(0, 0);
                    out.push(0x2C); w16(0); w16(0); w16(w); w16(h); out.push(0);
                    out.push(bits);   // минимальный размер кода LZW: 2 для 4 цветов, 3 для 8
                    const data = this.lzw(fr, bits);
                    for (let i = 0; i < data.length; i += 255) {
                        const n = Math.min(255, data.length - i);
                        out.push(n);
                        for (let k = 0; k < n; k++) out.push(data[i + k]);
                    }
                    out.push(0);
                }
                out.push(0x3B);
                return new Uint8Array(out);
            },
            lzw: function(ix, minSize) {
                const clear = 1 << minSize, eoi = clear + 1, bytes = [];
                const tab = this._tab || (this._tab = new Int32Array(1 << 20));   // ключ: (префикс << 8) | цвет
                tab.fill(-1);
                let size = minSize + 1, next = eoi + 1, cur = 0, bits = 0;
                const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
                emit(clear);
                let pre = ix[0];
                for (let i = 1; i < ix.length; i++) {
                    const k = ix[i], key = (pre << 8) | k, code = tab[key];
                    if (code !== -1) { pre = code; continue; }
                    emit(pre);
                    if (next === 4096) { emit(clear); tab.fill(-1); next = eoi + 1; size = minSize + 1; }
                    else { if (next >= (1 << size)) size++; tab[key] = next++; }
                    pre = k;
                }
                emit(pre); emit(eoi);
                if (bits > 0) bytes.push(cur & 255);
                return bytes;
            }
        };

        const MODULE_DATA = {
            normalizeLines: function(rawLines) {
                if (!Array.isArray(rawLines)) return [];
                return rawLines.map((item, index) => {
                    if (typeof item === 'string') return { text: item, color: '' };
                    else if (item && typeof item === 'object') return { text: item.text || '', color: item.color || '' };
                    return { text: '', color: '' };
                });
            },
            saveToLocalStorage: function(data) { try { localStorage.setItem('saved_binary_lines_v24', JSON.stringify(data)); } catch (e) {} },
            loadFromLocalStorage: function() {
                const saved = localStorage.getItem('saved_binary_lines_v24');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            MODULE_STATE.originalLines = this.normalizeLines(parsed);
                            this.precalculateLines(true); UI.statusInfo.textContent = "Загружено из памяти"; return true;
                        }
                    } catch (e) {}
                }
                return false;
            },
            
            // 35.16: сетка ВСЕГДА на весь экран. Было 150×100 при любом окне и кегле — на большом
            // экране по краям оставалась пустота. Теперь столбцов — сколько символов входит в ширину
            // холста, строк — сколько входит в высоту (у радара — в диагональ: кольца должны дойти
            // до углов), с запасом по краям. Числа чётные: сетка 1010 при прокрутке по кругу
            // смыкается без шва. Под экран она перестраивается сама (см. refitVacuum).
            generateVacuum: function() {
                const fs = parseInt(UI.fontSizeRange?.value || 24, 10);
                const lh = parseFloat(UI.lineHeightRange?.value || 1.2);
                const box = UI.screenContainer;
                const W = (box && box.clientWidth) || window.innerWidth, H = (box && box.clientHeight) || window.innerHeight;
                const ctx = UI.ctx; ctx.save(); ctx.font = `normal ${fs}px ${UI.fontSelect?.value || 'monospace'}`;
                const cw = (ctx.measureText('0').width || fs * 0.6) * charSpacing(); ctx.restore();   // 35.37
                const sp = Math.max(1, fs * lh);
                let h = Math.ceil((MODULE_STATE.isRadarActive ? Math.hypot(W, H) : H) / sp) + 4; if (h % 2) h++;
                let w = Math.ceil(W / cw) + 4; if (w % 2) w++;
                h = Math.min(h, 1024);
                let matrix = [];
                for(let i=0; i<h; i++) {
                    let row = "";
                    for(let j=0; j<w; j++) row += (i % 2 === j % 2) ? '1' : '0';
                    matrix.push({text: row, color: ''});
                }
                MODULE_STATE.originalLines = matrix;
                this.saveToLocalStorage(MODULE_STATE.originalLines);
                this._vacuumPending = true;
                this.precalculateLines(true);
            },

            // Если на холсте сетка — перестроить её под нынешний экран (окно, кегль, интервал,
            // шрифт, радар поменялись). Любая другая загрузка снимает признак, и тогда не трогаем.
            refitVacuum: function() {
                if (!MODULE_STATE.isVacuum) return;
                clearTimeout(this._refitT);
                this._refitT = setTimeout(() => {
                    if (!MODULE_STATE.isVacuum) return;
                    const idx = MODULE_STATE.currentIndex;
                    this.generateVacuum();
                    MODULE_STATE.currentIndex = idx % Math.max(1, MODULE_STATE.lines.length);
                    RENDERER.renderFrame();
                }, 150);
            },

            generateSierpinski: function() {
                let seed = UI.zerkSeedInput.value.trim() || "1";
                let h = parseInt(UI.zerkCountInput.value, 10) || 100;
                let rule = UI.zerkRuleSelect.value;
                let matrix = [];
                
                if (rule === 'orbital') {
                    for(let y=0; y<h; y++) {
                        let len = 2 + y * 4; 
                        let rowStr = "";
                        for(let i=0; i<len; i++) rowStr += (i%2===0) ? '1' : '0';
                        matrix.push(rowStr.split(''));
                    }
                } else if (rule === 'diagonal') {
                    let w = seed.length + 2 * h; 
                    let numMatrix = Array.from({length: h}, () => Array(w).fill(0)); 
                    let centerStart = Math.floor((w - seed.length) / 2);
                    
                    for(let i=0; i<seed.length; i++) {
                        if(seed[i] === '1') {
                            for(let y=0; y<h; y++) { let x = centerStart + i + y; if(x < w) numMatrix[y][x]++; } 
                            for(let y=0; y<h; y++) { let x = centerStart + i - y; if(x >= 0) numMatrix[y][x]++; } 
                        }
                    }
                    
                    for(let y=0; y<h; y++) {
                        matrix[y] = [];
                        for(let x=0; x<w; x++) {
                            matrix[y][x] = (numMatrix[y][x] % 2 === 1) ? '1' : '0';
                        }
                    }
                } else {
                    let w = seed.length + 2 * h; 
                    matrix = Array.from({length: h}, () => Array(w).fill('0')); 
                    let centerStart = Math.floor((w - seed.length) / 2);
                    
                    if (rule === 'vortex') {
                        for (let y = 0; y < h; y++) {
                            for (let x = centerStart - y; x <= centerStart + y + seed.length - 1; x++) {
                                if (Math.abs(x - centerStart + y) % 3 === 0) matrix[y][x] = '0'; else matrix[y][x] = '1';
                            }
                        }
                    } else if (rule === 'ziggurat') {
                        for(let y=0; y<h; y++) {
                            let bgChar = y % 2 === 0 ? '1' : '0';
                            matrix[y].fill(bgChar);
                        }
                        for(let y=0; y<h; y++) {
                            for(let x = centerStart - y; x <= centerStart + y + seed.length - 1; x++) {
                                let dLeft = x - (centerStart - y);
                                let dRight = (centerStart + y + seed.length - 1) - x;
                                if (dLeft % 3 === 0 || dRight % 3 === 0) matrix[y][x] = '1'; else matrix[y][x] = '0';
                            }
                        }
                    } else {
                        let ruleBin = parseInt(rule, 10).toString(2).padStart(8, '0');
                        for(let i=0; i<seed.length; i++) matrix[0][centerStart+i] = seed[i];

                        for(let y=1; y<h; y++) {
                            for(let x=1; x<w-1; x++) {
                                let left = matrix[y-1][x-1] === '1' ? 1 : 0;
                                let center = matrix[y-1][x] === '1' ? 1 : 0;
                                let right = matrix[y-1][x+1] === '1' ? 1 : 0;
                                let idx = 7 - ((left << 2) | (center << 1) | right);
                                matrix[y][x] = ruleBin[idx] === '1' ? '1' : '0';
                            }
                        }
                    }

                    if (UI.trimZerosCheck.checked && rule !== 'ziggurat') {
                        for(let y=0; y<h; y++) {
                            let rowStr = matrix[y].join('');
                            let first1 = rowStr.indexOf('1');
                            let last1 = rowStr.lastIndexOf('1');
                            if(first1 !== -1 && last1 !== -1) {
                                for(let x=0; x<w; x++) if (x < first1 || x > last1) matrix[y][x] = ' '; 
                            } else {
                                matrix[y].fill(' ');
                            }
                        }
                    }
                }

                let shape = matrix.map(row => { return { text: row.join(''), color: ''}; });
                let names = { 'ziggurat': 'Зиккурат', 'vortex': 'Воронка 3D', 'orbital': 'Орбитальный Конус', 'diagonal': 'Диагональная Сетка' };
                this.implantOrReplace(shape, names[rule] || `Фрактал (R${rule})`);
            },

            implantOrReplace: function(shape, sourceName) {
                let symStatus = MODULE_ALGORITHMS.checkSymmetry(shape);

                if (UI.implantModeCheck.checked && MODULE_STATE.originalLines.length > 0) {
                    let bgH = MODULE_STATE.originalLines.length;
                    let bgW = MODULE_STATE.originalLines[0]?.text.length || 0;
                    let shH = shape.length;
                    let shW = Math.max(...shape.map(l => l.text.length));
                    
                    let startY = Math.floor((bgH - shH) / 2);
                    let startX = Math.floor((bgW - shW) / 2);
                    
                    for(let i=0; i<shH; i++) {
                        if(startY+i >= 0 && startY+i < bgH) {
                            let bgStr = MODULE_STATE.originalLines[startY+i].text;
                            let shStr = shape[i].text.padEnd(shW, ' ');
                            
                            let newStrArr = bgStr.split('');
                            for(let k=0; k<shStr.length; k++) {
                                let targetX = startX + k;
                                if(targetX >= 0 && targetX < bgStr.length && shStr[k] !== ' ') {
                                    newStrArr[targetX] = shStr[k];
                                }
                            }
                            MODULE_STATE.originalLines[startY+i].text = newStrArr.join('');
                        }
                    }
                    UI.statusInfo.textContent = `Вживлено: ${sourceName} | ${symStatus}`;
                } else {
                    MODULE_STATE.originalLines = shape;
                    UI.statusInfo.textContent = `Генерация: ${sourceName} | ${symStatus}`;
                }
                
                this.saveToLocalStorage(MODULE_STATE.originalLines);
                this.precalculateLines(true);
            },

            // 35.39: текст (файл кнопкой «📂 Текст», брошенный на холст, код страницы) всегда ЗАМЕНЯЕТ строки.
            // «Вживление» — галочка Генератора форм, к тексту она не относится; с ней файл вклеивался в середину
            // прежних строк, обрезался по их размеру, и казалось, что загрузка не работает. \r из файлов Windows
            // срезается: иначе он оставался невидимым символом в конце каждой строки.
            processTextData: function(text, sourceName) {
                const raw = text.replace(/^﻿/, '').split(/\r?\n|\r/).map(l => l.replace(/\t/g, ' ')).filter(l => l.trim().length > 0);
                if (raw.length === 0) { UI.statusInfo.textContent = `Пустой файл: ${sourceName}`; return; }
                const shape = this.normalizeLines(raw);
                const implantState = UI.implantModeCheck.checked; UI.implantModeCheck.checked = false;
                try { this.implantOrReplace(shape, sourceName); } finally { UI.implantModeCheck.checked = implantState; }
                MODULE_STATE.currentIndex = 0; MODULE_STATE.offsetX = 0; MODULE_STATE.offsetY = 0;
                UI.statusInfo.textContent = `Загружено: ${sourceName} — строк ${raw.length}`;
                RENDERER.updateTimeline(); RENDERER.renderFrame();
            },

            /* 35.43: ПОДСЧЁТ ЦИКЛОВ АНИМАТРИЦЫ (запрос пользователя: «нужен подсчёт циклов аниматрицы»).
               Проход — волна дошла от первой строки до последней. После каждого прохода берётся отпечаток всего
               текста (FNV-1a по всем строкам) и кладётся в animSeen: отпечаток → номер прохода. Встретился
               отпечаток, который уже был, — текст вернулся в прежнее состояние, и дальше картина ходит по кругу:
               это и есть цикл, его период — разница номеров. Отпечаток исходного текста — проход 0, поэтому
               «вернулось к началу» тоже ловится. Сбрасывается при загрузке текста (precalculateLines с isFirstLoad). Правки текста
               другими средствами (Вставить 0/1 и пр.) счётчик не сбрасывают — цикл тогда может оказаться ложным. */
            animHash: function() {
                let h = 2166136261;
                for (const l of MODULE_STATE.originalLines) {
                    const t = l.text;
                    for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
                    h ^= 10; h = Math.imul(h, 16777619);
                }
                return h >>> 0;
            },
            animReset: function() {
                MODULE_STATE.animPasses = 0; MODULE_STATE.animSeen = null; MODULE_STATE.animCycle = null;
                MODULE_STATE.animHist = null; MODULE_STATE.animHistSize = 0;   // 35.51
                if (this.animLogOn) {   // 35.49: в журнале — отметка и новый текст с нуля
                    this.animLog.prev = null;
                    this.animLogAdd('##### ЗАГРУЖЕН НОВЫЙ ТЕКСТ — счёт проходов заново #####\n\n');
                    this.animLogSnap('НОВЫЙ ТЕКСТ');
                }
                this.animInfoUpd();
            },
            /* 35.49: ЖУРНАЛ АНИМАТРИЦЫ (запрос пользователя: «как смотреть это кино будем» → «журнал в файл»).
               На видео мелкий текст волны не разглядеть, а журнал точен до символа. ⏺ Журнал пишет весь текст в
               момент старта, затем — после каждого прохода волны (animPassDone) и при загрузке нового текста
               (animReset). У записи заголовок: что это (старт / проход N / новый текст), отпечаток всего текста
               (тот же FNV-1a, что ищет цикл), число непробельных символов, сколько символов изменилось с прошлой
               записи и найденный цикл. Больше ANIMLOG_MAX текст не пишется — только заголовки: иначе на большом
               тексте и долгой записи файл разрастался бы на сотни мегабайт. 💾 отдаёт .txt в любой момент. */
            ANIMLOG_MAX: 40e6,
            animLogOn: false, animLog: null,
            animLogAdd: function(t) { this.animLog.parts.push(t); this.animLog.size += t.length; },
            animLogSnap: function(title) {
                const st = MODULE_STATE, log = this.animLog, lines = st.originalLines.map(l => l.text);
                let chars = 0;
                for (const t of lines) for (let i = 0; i < t.length; i++) if (t[i] !== ' ') chars++;
                let head = '=== ' + title + ' · отпечаток ' + this.animHash().toString(16).padStart(8, '0') + ' · непробельных ' + chars;
                if (log.prev) {
                    let changed = 0; const n = Math.max(log.prev.length, lines.length);
                    for (let i = 0; i < n; i++) {
                        const a = log.prev[i] || '', b = lines[i] || '', m = Math.max(a.length, b.length);
                        for (let k = 0; k < m; k++) if ((a[k] || ' ') !== (b[k] || ' ')) changed++;
                    }
                    head += ' · изменилось с прошлой записи ' + changed;
                }
                if (st.animCycle) head += ' · ЦИКЛ: период ' + st.animCycle.period + ', повтор ' +
                    (st.animCycle.from ? 'после прохода ' + st.animCycle.from : 'исходного текста');
                head += ' ===\n';
                const body = lines.join('\n') + '\n\n';
                if (!log.cut && log.size + body.length > this.ANIMLOG_MAX) {
                    log.cut = true;
                    this.animLogAdd('(дальше текст не пишется: журнал дошёл до ' + Math.round(this.ANIMLOG_MAX / 1e6) + ' МБ — только заголовки записей)\n\n');
                }

            animLogToggle: function() {
                const st = MODULE_STATE;
                if (this.animLogOn) {
                    this.animLogOn = false;
                    this.animLogAdd('=== ЗАПИСЬ ОСТАНОВЛЕНА · ' + new Date().toLocaleString('ru-RU') + ' ===\n\n');
                    UI.statusInfo.textContent = `Журнал остановлен: записей ${this.animLog.recs} — «💾 Журнал в файл»`;
                    this.animLogUi(); this.animInfoUpd();
                    return;
                }
                if (!st.originalLines.length) { UI.statusInfo.textContent = 'Журнал: на холсте нет текста'; return; }
                const W = st.originalLines.reduce((m, l) => Math.max(m, l.text.length), 0);
                this.animLog = { parts: [], size: 0, prev: null, recs: 0, cut: false, t0: new Date() };
                this.animLogOn = true;
                this.animLogAdd('ZERKALIUS CODE — ЖУРНАЛ АНИМАТРИЦЫ\n' +
                    'начат: ' + this.animLog.t0.toLocaleString('ru-RU') + ' · строк: ' + st.originalLines.length + ' · ширина: ' + W +

            mirrorXor: function(mode) {

            },
            mirrorUndo: function() {

            rhombFilm: function(mode) {

                const gif = GIFENC.encode(frames, gw, gh, pal, mode === 'time' ? 25 : 45);

                lnk.download = name; lnk.click(); setTimeout(() => URL.revokeObjectURL(lnk.href), 3000);
                UI.statusInfo.textContent = `🎞 Ромбы: ${frames.length} кадров, ромб ${S} строк · ${name}`;
            },
            animGif: function(stepPasses) {

            animPassDone: function() {

               показывает строки по кругу). Здесь — пауза и такой кадр, чтобы первая строка стояла у ВЕРХНЕГО КРАЯ

            toTop: function() {
                const n = MODULE_STATE.lines.length;
                if (!n) return;

                const vh = parseInt(UI.heightRange.value || 15, 10), half = Math.floor(vh / 2);
                const step = parseInt(UI.fontSizeRange.value || 24, 10) * parseFloat(UI.lineHeightRange.value || 1.2);
                const H = UI.canvas.clientHeight || window.innerHeight;
                const startY = (H - (vh - 1) * step) / 2;
                const i0 = Math.max(0, Math.ceil((step / 2 - startY) / step));
                MODULE_STATE.currentIndex = (((half - i0) % n) + n) % n;
                MODULE_STATE.offsetY = 0; MODULE_STATE.frozenIndex = null;
                RENDERER.updateTimeline(); RENDERER.renderFrame();
                UI.statusInfo.textContent = 'Начало текста — у верхнего края экрана';

                cancelAnimationFrame(MODULE_STATE.rafId);
                MODULE_STATE.currentIndex = 0; MODULE_STATE.dualCoreIndex = 0; MODULE_STATE.algoPointer = 0; MODULE_STATE.globalAngle = 0;
                MODULE_STATE.frozenIndex = null;   // 35.42
                UI.playBtn.innerHTML = '▶'; UI.playBtn.style.background = '#00ff66'; UI.playBtn.style.color = '#000'; UI.playBtn.classList.remove('playing');
                
                const bgAudio = document.getElementById('bgAudio');

            },
            loop: function(timestamp) {
                if (!MODULE_STATE.isPlaying) return;
                
                const speedVal = parseInt(UI.speedRange?.value || 920, 10);
                const speedMs = 1001 - speedVal; 

                const delta = timestamp - MODULE_STATE.lastTickTime;
                
                if (delta < speedMs) {
                    if (AUDIO_VISUALIZER.isInit || UI.spin3dCheck?.checked || UI.breathingZoomCheck?.checked || !MODULE_STATE.snapGrid) {   // 35.38: плавно — кадр на каждый экранный кадр
                        MODULE_STATE.breathTime += 0.02; 
                        if (UI.spin3dCheck?.checked) MODULE_STATE.globalAngle += 0.5; 
                        RENDERER.renderFrame(); 
                    }
                }

                if (delta >= speedMs) {
                    MODULE_STATE.lastTickTime = timestamp - (delta % Math.max(1, speedMs)); 
                    
                    let multStep = parseInt(UI.speedMultInput?.value || 1, 10);
                    if (multStep < 1) multStep = 1;

                    let tickShift = 0;   // 35.38: на сколько строк сдвинулись за этот шаг — для плавного режима
                    for (let m = 0; m < multStep; m++) {
                        if (UI.autoPilotCheck?.checked && AUDIO_VISUALIZER.isInit) {
                            if (AUDIO_VISUALIZER.bassLevel < 30) MODULE_STATE.framesSinceChange++;
                            else MODULE_STATE.framesSinceChange = 0; 
                            if (MODULE_STATE.framesSinceChange > 60) {
                                SCENE_MANAGER.loadRandomScene(); 
                                MODULE_STATE.framesSinceChange = -100; 
                            }
                        }

                        // 35.27: 🔎 Поиск (логгер узоров) убран по слову пользователя.

                        if (UI.zerkaliusAnimCheck?.checked && MODULE_STATE.originalLines.length > 0) {
                            // 35.51: «Плеер — целыми циклами» — за шаг весь проход волны
                            if (document.getElementById('animByPassCheck')?.checked) MODULE_DATA.animPassFull();
                            else MODULE_DATA.runAnimatrixGlobal();
                        }

                        if (UI.echoModeCheck?.checked && MODULE_STATE.originalLines.length > 0) {
                            if (!MODULE_STATE.isReverse) {
                                MODULE_STATE.echoHistory.push(JSON.parse(JSON.stringify(MODULE_STATE.originalLines)));
                                if(MODULE_STATE.echoHistory.length > 300) MODULE_STATE.echoHistory.shift();
                                
                                let lines = MODULE_STATE.originalLines; let newLines = [];
                                for(let i=0; i<lines.length; i++) {
                                    let prev = (i > 0) ? lines[i-1].text : lines[lines.length-1].text;
                                    let curr = lines[i].text; let res = ""; let len = Math.max(curr.length, prev.length);
                                    for(let k=0; k<len; k++) {
                                        let c1 = curr[k] || ' '; let c2 = prev[k] || ' ';
                                        if (c1 === c2 && c1 !== ' ') res += ' ';
                                        else if (c1 !== ' ' && c2 === ' ') res += c1;
                                        else if (c2 !== ' ' && c1 === ' ') res += c2;
                                        else res += c1;
                                    }
                                    newLines.push({text: res, color: lines[i].color});
                                }
                                MODULE_STATE.originalLines = newLines; MODULE_DATA.precalculateLines(false);
                            } else {
                                if (MODULE_STATE.echoHistory.length > 0) { MODULE_STATE.originalLines = MODULE_STATE.echoHistory.pop(); MODULE_DATA.precalculateLines(false); }
                            }
                        }

                        if (UI.elkaCheck?.checked && MODULE_STATE.originalLines.length > 0) {
                            let dir = MODULE_STATE.isReverse ? -1 : 1;
                            let allChars = MODULE_STATE.originalLines.map(l => l.text).join('');
                            if (allChars.length > 0) {
                                if (dir > 0) allChars = allChars.substring(1) + allChars[0]; else allChars = allChars.slice(-1) + allChars.slice(0, -1);
                                let ptr = 0;
                                for (let i = 0; i < MODULE_STATE.originalLines.length; i++) {
                                    let len = MODULE_STATE.originalLines[i].text.length;
                                    MODULE_STATE.originalLines[i].text = allChars.substring(ptr, ptr + len); ptr += len;
                                }
                                MODULE_DATA.precalculateLines(false);
                            }
                        }

                        let step = steps[MODULE_STATE.algoPointer % steps.length];
                        if (MODULE_STATE.isReverse) step = -step;
                        
                        if (UI.freezeScrollCheck && UI.freezeScrollCheck.checked) step = 0; 

                        MODULE_STATE.currentIndex = (MODULE_STATE.currentIndex + step + MODULE_STATE.lines.length) % MODULE_STATE.lines.length;
                        tickShift += step;
                        
                        if (UI.dualCoreCheck?.checked) {
                            let mult = parseInt(UI.dualCoreSpeedInput.value, 10) || 2;
                            MODULE_STATE.dualCoreIndex = (MODULE_STATE.dualCoreIndex + (step * mult) + MODULE_STATE.lines.length) % MODULE_STATE.lines.length;
                        }

                        MODULE_STATE.algoPointer++; 
                    }
                    MODULE_STATE.lastShift = tickShift;
                    RENDERER.renderFrame(); RENDERER.updateTimeline();
                }
                MODULE_STATE.rafId = requestAnimationFrame((ts) => this.loop(ts));
            },
            getAlgorithmSteps: function() {

                if (matches) { const steps = matches.map(x => parseInt(x, 10)).filter(x => !isNaN(x)); if (steps.length > 0) return steps; }
                return [1];
            }
        };

                        reader.onload = ev => {

                            if (/\.json$/i.test(file.name) && SCENE_MANAGER.importScenes(ev.target.result, file.name)) return;
                            MODULE_DATA.processTextData(ev.target.result, file.name);
                        };
                        reader.readAsText(file);
                    });
                    window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
                    window.addEventListener('drop', e => { if (hasFiles(e)) e.preventDefault(); });
                }
                document.addEventListener('paste', function(e) { 
                    const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : ''; 
                    if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') return; 
                    let text = e.clipboardData.getData('text/plain'); 
                    if (text) { text = text.replace(/\t/g, ' '); MODULE_DATA.processTextData(text, 'Буфер обмена'); e.preventDefault(); if(!MODULE_STATE.isPlaying) RENDERER.renderFrame(); } 
                });
                
                if(UI.speedRange) { UI.speedRange.addEventListener('input', (e) => { const val = parseInt(e.target.value, 10); UI.speedVal.textContent = (1001 - val) + ' мс'; }); }
                if(UI.fontSizeRange) UI.fontSizeRange.addEventListener('input', (e) => { if(UI.fontSizeVal) UI.fontSizeVal.textContent = e.target.value + 'px'; scheduleRender(); });
                if(UI.heightRange) UI.heightRange.addEventListener('input', (e) => { if(UI.heightVal) UI.heightVal.textContent = e.target.value; scheduleRender(); });
                if(UI.lineHeightRange) UI.lineHeightRange.addEventListener('input', (e) => { if(UI.lineHeightVal) UI.lineHeightVal.textContent = e.target.value; scheduleRender(); });
                const csr = document.getElementById('charSpacingRange');   // 35.37
                if (csr) csr.addEventListener('input', (e) => { const v = document.getElementById('charSpacingVal'); if (v) v.textContent = parseFloat(e.target.value).toFixed(1); scheduleRender(); });
                if(UI.zerkaliusBtn) UI.zerkaliusBtn.addEventListener('click', () => MODULE_DATA.generateSierpinski());
                
                const rerenderEvents = [
                    UI.cylinderCheck, UI.elkaCheck, UI.hideStaticCheck, UI.deltaModeSelect, UI.neonGlowCheck, 
                    UI.findDiagonalsCheck, UI.logicalOpSelect, UI.dualCoreCheck, UI.dualCoreSpeedInput, UI.dualMaskCheck, UI.freezeLayer1Check,
                    document.getElementById('rhombGridCheck'), document.getElementById('rhombGridStep'),   // 35.54
                    document.getElementById('rowBandsCheck'), document.getElementById('symAxisCheck'),   // 35.55, 35.56
                    document.getElementById('rhombLettersCheck'),   // 35.59
                    document.getElementById('bitColorsCheck'), document.getElementById('zeroColorPicker'), document.getElementById('oneColorPicker'),   // 35.60
                    document.getElementById('gridColorsCheck'), document.getElementById('gridZeroPicker'), document.getElementById('gridOnePicker'),   // 35.61
                    document.getElementById('gridSparseInput'),   // 35.62
                    UI.activeColorPicker, UI.activeAlphaRange, UI.staticColorPicker, UI.staticAlphaRange, UI.fontSelect, UI.freezeScrollCheck, UI.spin3dCheck, UI.breathingZoomCheck, UI.autoPilotCheck, UI.speedMultInput, UI.rainbowTextCheck, UI.syntaxColorCheck
                ];
                const scheduleRender = () => (window.__zerkScheduleRender || (() => RENDERER.renderFrame()))();
                rerenderEvents.forEach(el => { if(el) { el.addEventListener('change', scheduleRender); el.addEventListener('input', scheduleRender); }});
                // 35.42: ⚓ поставили — слой 1 встаёт на ту строку, что сейчас в центре; сняли — идёт дальше с неё же,
                // а не с того места, куда за это время ушёл счётчик кадров. Скачка нет ни в ту, ни в другую сторону.
                // 35.43: счётчик циклов Аниматрицы виден, пока она включена
                if (UI.zerkaliusAnimCheck) UI.zerkaliusAnimCheck.addEventListener('change', () => MODULE_DATA.animInfoUpd());
                // 35.49: журнал Аниматрицы
                const alB = document.getElementById('animLogBtn'), alS = document.getElementById('animLogSaveBtn');
                if (alB) alB.addEventListener('click', () => MODULE_DATA.animLogToggle());
                if (alS) alS.addEventListener('click', () => MODULE_DATA.animLogSave());
                // 35.51: ⏮ / ⏭ цикл, PageUp / PageDown
                const cycNext = () => { if (!MODULE_STATE.originalLines.length) return; MODULE_DATA.animPassFull(); RENDERER.renderFrame(); UI.statusInfo.textContent = `Аниматрица: цикл ${MODULE_STATE.animPasses || 0}`; };
                const cycBack = () => { MODULE_DATA.animPassBack(); RENDERER.renderFrame(); };
                const abB = document.getElementById('animBackBtn'), anB = document.getElementById('animNextBtn');
                if (abB) abB.addEventListener('click', cycBack);
                if (anB) anB.addEventListener('click', cycNext);
                // 35.53: 🎞 GIF — сборка тяжёлая (секунды на большом тексте), поэтому сперва сообщение, потом работа
                const gifB = document.getElementById('animGifBtn'), gifS = document.getElementById('animGifStep');
                // 35.58: ⧖ Зеркало через центр с XOR и ↶
                const mxB = document.getElementById('mirrorXorBtn'), mxM = document.getElementById('mirrorXorMode'), mxU = document.getElementById('mirrorXorUndo');
                if (mxB) mxB.addEventListener('click', () => MODULE_DATA.mirrorXor(mxM ? mxM.value : 'up'));
                if (mxU) mxU.addEventListener('click', () => MODULE_DATA.mirrorUndo());
                // 35.57: 🎞 Ромбы в кино
                const rfB = document.getElementById('rhombFilmBtn'), rfM = document.getElementById('rhombFilmMode');
                if (rfB) rfB.addEventListener('click', () => {
                    UI.statusInfo.textContent = 'Ромбы собираются в кино…';
                    setTimeout(() => MODULE_DATA.rhombFilm(rfM ? rfM.value : 'frame'), 30);
                });
                if (gifB) gifB.addEventListener('click', () => {
                    UI.statusInfo.textContent = 'GIF собирается…';
                    setTimeout(() => MODULE_DATA.animGif(parseInt(gifS ? gifS.value : '1', 10) || 1), 30);
                });
                document.addEventListener('keydown', e => {
                    if ((e.key !== 'PageDown' && e.key !== 'PageUp') || e.ctrlKey || e.altKey || e.metaKey) return;
                    const t = e.target && e.target.tagName;
                    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || (e.target && e.target.isContentEditable)) return;
                    e.preventDefault();
                    if (e.key === 'PageDown') cycNext(); else cycBack();
                });
                if (UI.freezeLayer1Check) UI.freezeLayer1Check.addEventListener('change', () => {
                    if (UI.freezeLayer1Check.checked) MODULE_STATE.frozenIndex = MODULE_STATE.currentIndex;
                    else if (MODULE_STATE.frozenIndex != null) { MODULE_STATE.currentIndex = MODULE_STATE.frozenIndex; MODULE_STATE.frozenIndex = null; RENDERER.updateTimeline(); }
                    scheduleRender();
                });
                // Запись: одна кнопка на старт и стоп, рядом счётчик времени.
                if (UI.recBtn) {
                    UI.recBtn.addEventListener('click', () => {
                        const timer = document.getElementById('recTimer');
                        if (RECORDER.rec) {
                            RECORDER.stop();
                            clearInterval(RECORDER.timer);
                            UI.recBtn.classList.remove('recording');
                            if (timer) timer.style.display = 'none';
                            RECORDER.notify('● СОХРАНЕНО');
                            return;
                        }
                        if (!RECORDER.start(60)) return;
                        UI.recBtn.classList.add('recording');
                        if (timer) timer.style.display = 'block';
                        RECORDER.timer = setInterval(() => {
                            const sec = Math.floor((Date.now() - RECORDER.startedAt) / 1000);
                            if (timer) timer.textContent = `● REC ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
                        }, 500);

                    });
                }
                // К каждому ползунку в панели — по стрелке слева и справа: колесо
                // и перетаскивание годятся для грубой настройки, а точное значение
                // пальцем не поймать. Удержание повторяет шаг.
                document.querySelectorAll('.controls input[type="range"]').forEach(el => {
                    if (el.dataset.arrowed) return;
                    el.dataset.arrowed = '1';
                    const wrap = document.createElement('span');
                    wrap.className = 'range-with-arrows';
                    el.parentNode.insertBefore(wrap, el);
                    const mk = (text, dir) => {
                        const b = document.createElement('button');
                        b.type = 'button'; b.className = 'range-arrow'; b.textContent = text;
                        b.tabIndex = -1;
                        const step = () => {
                            const st = parseFloat(el.step) || 1;
                            const min = parseFloat(el.min), max = parseFloat(el.max);
                            let v = parseFloat(el.value) + dir * st;
                            if (!isNaN(min)) v = Math.max(min, v);
                            if (!isNaN(max)) v = Math.min(max, v);
                            const dec = (String(st).split('.')[1] || '').length;
                            el.value = dec ? v.toFixed(dec) : v;
                            el.dispatchEvent(new Event('input', { bubbles: true }));
                            el.dispatchEvent(new Event('change', { bubbles: true }));
                        };
                        let hold = null, rep = null;
                        const stop = () => { clearTimeout(hold); clearInterval(rep); hold = rep = null; };
                        b.addEventListener('mousedown', ev => { ev.preventDefault(); step();
                            hold = setTimeout(() => { rep = setInterval(step, 55); }, 380); });
                        ['mouseup', 'mouseleave', 'blur'].forEach(t => b.addEventListener(t, stop));
                        return b;
                    };
                    wrap.appendChild(mk('\u25C2', -1));
                    wrap.appendChild(el);
                    wrap.appendChild(mk('\u25B8', +1));
                });

                // Показываем значение множителя рядом с "x" — у ползунка своей подписи нет.
                if (UI.speedMultInput) {
                    const multVal = document.getElementById('speedMultVal');
                    const showMult = () => { if (multVal) multVal.textContent = UI.speedMultInput.value; };
                    UI.speedMultInput.addEventListener('input', showMult);
                    showMult();
                }
                window.addEventListener('resize', () => RENDERER.renderFrame());
            }
        };

        // 35.8: вкладки, как в Layers. Полоса #menuTabs строится из разделов .tab-sec в порядке
        // разметки (сначала левая панель, потом правая). Щелчок — спрятать/показать раздел.
        // Какие спрятаны — помнится в браузере; память может быть недоступна, тогда всё открыто.
        const TABS = {
            KEY: 'zcode_tabs_off_v2',   // 35.23: v1 → v2, чтобы новое умолчание «всё открыто» дошло и до тех, у кого в памяти «только плеер»
            init: function() {
                const bar = document.getElementById('menuTabs');
                let off = [];
                // 35.23: по умолчанию (ничего не сохранено) открыты ВСЕ разделы (в 35.10–35.22 — только ▶ Плеер).
                let savedOff = null;
                try { savedOff = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { savedOff = null; }
                off = Array.isArray(savedOff) ? savedOff : [];
                document.querySelectorAll('.tab-sec').forEach(sec => {
                    const b = document.createElement('button');
                    b.type = 'button'; b.textContent = sec.dataset.title;
                    b.title = 'Показать / спрятать раздел «' + sec.dataset.title + '»';
                    if (off.includes(sec.dataset.tab)) sec.classList.add('off');
                    b.addEventListener('click', () => { sec.classList.toggle('off'); this.sync(); });
                    sec._tabBtn = b; bar.appendChild(b);
                    this.addHead(sec);
                });
                this.restoreLayout();
                const h = document.createElement('button');
                h.type = 'button'; h.className = 'help'; h.textContent = '❓ Помощь'; h.title = 'Описание и как пользоваться';
                h.addEventListener('click', () => HELP.open());
                const rl = document.createElement('button');
                // 35.13: ↺ — поочерёдно «все разделы» / «только плеер». Разделы остаются там, куда их
                // перенесли; меняется только видимость. Shift+щелчок — сброс раскладки на исходную.
                rl.type = 'button'; rl.textContent = '↺';
                rl.title = 'Щелчок: все разделы ⇄ только плеер. Shift+щелчок: вернуть раскладку по умолчанию';
                rl.addEventListener('click', e => {
                    if (e.shiftKey) { if (confirm('Вернуть раскладку по умолчанию (все разделы открыты, плеер окном внизу по центру)?')) this.resetLayout(); return; }
                    const secs = Array.from(document.querySelectorAll('.tab-sec'));
                    const othersOpen = secs.some(sec => sec.dataset.tab !== 'player' && !sec.classList.contains('off'));
                    secs.forEach(sec => sec.classList.toggle('off', othersOpen && sec.dataset.tab !== 'player'));
                    this.sync();
                });
                bar.appendChild(rl);
                bar.appendChild(h);
                this.sync(false);   // рисовать рано: холст ещё не настроен, это сделает onload
            },
            sync: function(render) {
                const off = [];
                document.querySelectorAll('.tab-sec').forEach(sec => {
                    const isOff = sec.classList.contains('off');
                    if (isOff) off.push(sec.dataset.tab);
                    if (sec._tabBtn) sec._tabBtn.classList.toggle('on', !isOff);
                    if (sec.dataset.tab === 'player') document.body.classList.toggle('player-on', !isOff);
                });
                ['leftPanel', 'rightPanel'].forEach(id => {
                    const p = document.getElementById(id);
                    p.classList.toggle('empty', !p.querySelector('.tab-sec:not(.off)'));
                });
                // Столбец кнопок стоит у левой панели: нет её — прижимается к краю.
                const leftGone = document.body.classList.contains('menu-off') || document.getElementById('leftPanel').classList.contains('empty');
                document.body.classList.toggle('panel-hidden', leftGone);
                try { localStorage.setItem(this.KEY, JSON.stringify(off)); } catch (e) {}
                if (render !== false) RENDERER.renderFrame();
            },

            // 35.9: разделы перемещаются, как меню в Layers. Тащат за шапку: над панелью — встаёт
            // между разделами там, где курсор; мимо панелей — висит на холсте плавающим окном.
            // Раскладка (где какой раздел и в каком порядке) помнится в браузере.
            LAYOUT_KEY: 'zcode_layout_v1',
            addHead: function(sec) {
                const head = document.createElement('div');
                head.className = 'sec-head';
                head.title = 'Потяните, чтобы перенести раздел: в другое место, в соседнюю панель или на холст';
                head.innerHTML = '<span class="grip">✥</span><span class="ttl"></span><button type="button" class="x" title="Спрятать раздел (вернуть — вкладкой сверху)">✕</button>';
                head.querySelector('.ttl').textContent = sec.dataset.title;
                head.querySelector('.x').addEventListener('click', e => { e.stopPropagation(); sec.classList.add('off'); this.sync(); });
                head.addEventListener('pointerdown', e => {
                    if (e.button !== 0 || e.target.closest('.x')) return;
                    e.preventDefault();
                    this.drag = { sec: sec, x0: e.clientX, y0: e.clientY, started: false };
                });
                sec.insertBefore(head, sec.firstChild);
                if (!this._dragBound) {
                    this._dragBound = true;
                    document.addEventListener('pointermove', e => this.dragMove(e));
                    document.addEventListener('pointerup', () => this.dragEnd());
                    window.addEventListener('resize', () => document.querySelectorAll('.tab-sec.floating').forEach(f => this.clamp(f, parseFloat(f.style.left) || 0, parseFloat(f.style.top) || 0)));
                }
            },
            panelUnder: function(x, y) {
                for (const id of ['leftPanel', 'rightPanel']) {
                    const p = document.getElementById(id);
                    const r = p.getBoundingClientRect();
                    if (r.width && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return p;
                }
                return null;
            },
            // Плавающее окно не уводим за край: шапка должна оставаться, за что схватить.
            // 35.48: окно ЦЕЛИКОМ на экране, а не «хотя бы 60 px шапки»: сузили окно браузера (открыли боковую
            // панель) — плеер уезжал за правый край и оставался обрезанным. Теперь при сужении окна и при открытии
            // страницы плавающие окна въезжают обратно целиком. У плеера сверху висят дубли 🔃 🛰️ (top −44 px) —
            // под них оставлен зазор. Окно шире экрана прижимается к левому краю.
            clamp: function(f, x, y) {
                const w = f.offsetWidth || 284, h = f.offsetHeight || 60;
                const top0 = f.classList.contains('fixed-player') ? 44 : 0;
                f.style.left = Math.round(Math.max(0, Math.min(window.innerWidth - w, x))) + 'px';
                f.style.top = Math.round(Math.max(top0, Math.min(window.innerHeight - h, y))) + 'px';
            },
            dragMove: function(e) {
                const d = this.drag; if (!d) return;
                if (!d.started) {
                    if (Math.abs(e.clientX - d.x0) < 4 && Math.abs(e.clientY - d.y0) < 4) return;   // это был щелчок
                    const r = d.sec.getBoundingClientRect();
                    d.dx = d.x0 - r.left; d.dy = d.y0 - r.top; d.started = true;
                    d.sec.classList.add('dragging'); document.body.classList.add('tab-dragging');
                }
                const panel = this.panelUnder(e.clientX, e.clientY);
                document.querySelectorAll('.controls').forEach(p => p.classList.toggle('drop-hover', p === panel));
                if (panel) {
                    if (d.sec.classList.contains('floating')) { d.sec.classList.remove('floating'); d.sec.style.left = ''; d.sec.style.top = ''; }
                    const slot = panel.querySelector('.scrollable-settings');
                    const before = Array.from(slot.children).find(c => c !== d.sec && c.classList.contains('tab-sec') && !c.classList.contains('off')
                        && e.clientY < c.getBoundingClientRect().top + c.getBoundingClientRect().height / 2);
                    if (before) { if (d.sec.nextSibling !== before) slot.insertBefore(d.sec, before); }
                    else if (slot.lastElementChild !== d.sec) slot.appendChild(d.sec);
                } else {
                    if (!d.sec.classList.contains('floating')) { d.sec.classList.add('floating'); document.body.appendChild(d.sec); }
                    this.clamp(d.sec, e.clientX - d.dx, e.clientY - d.dy);
                }
            },
            dragEnd: function() {
                const d = this.drag; this.drag = null;
                if (!d || !d.started) return;
                d.sec.classList.remove('dragging'); document.body.classList.remove('tab-dragging');
                document.querySelectorAll('.controls').forEach(p => p.classList.remove('drop-hover'));
                this.saveLayout(); this.sync();
            },
            saveLayout: function() {
                const lay = {};
                document.querySelectorAll('.tab-sec').forEach(sec => {
                    if (sec.classList.contains('floating')) lay[sec.dataset.tab] = { z: 'float', x: parseInt(sec.style.left, 10) || 0, y: parseInt(sec.style.top, 10) || 0 };
                    else if (sec.parentElement && sec.parentElement.id) lay[sec.dataset.tab] = { z: sec.parentElement.id, i: Array.from(sec.parentElement.children).indexOf(sec) };
                });
                try { localStorage.setItem(this.LAYOUT_KEY, JSON.stringify(lay)); } catch (e) {}
            },
            restoreLayout: function() {
                let lay = null;
                try { lay = JSON.parse(localStorage.getItem(this.LAYOUT_KEY) || 'null'); } catch (e) { lay = null; }
                if (!lay) {
                    // 35.10: раскладка по умолчанию — плеер плавающим окном внизу по центру холста.
                    const pl = document.querySelector('.tab-sec[data-tab="player"]');
                    if (pl) {
                        pl.classList.add('floating'); document.body.appendChild(pl);
                        this.clamp(pl, (window.innerWidth - pl.offsetWidth) / 2, window.innerHeight * 0.56);
                    }
                    return;
                }
                const secs = Array.from(document.querySelectorAll('.tab-sec'));
                ['leftSlot', 'rightSlot', 'leftPanel'].forEach(z => {
                    const zone = document.getElementById(z);
                    secs.filter(s => lay[s.dataset.tab] && lay[s.dataset.tab].z === z)
                        .sort((a, b) => lay[a.dataset.tab].i - lay[b.dataset.tab].i)
                        .forEach(s => zone.appendChild(s));
                });
                secs.forEach(s => {
                    const l = lay[s.dataset.tab];
                    if (l && l.z === 'float') { s.classList.add('floating'); document.body.appendChild(s); this.clamp(s, l.x, l.y); }
                });
            },
            // Вернуть разделы на свои места — на случай, если раскладку запутали.
            resetLayout: function() {
                try { localStorage.removeItem(this.LAYOUT_KEY); localStorage.removeItem(this.KEY); } catch (e) {}
                location.reload();
            }
        };

        // 35.12: двойники 🔃 и 🛰️ на плеере. Щелчок жмёт настоящую кнопку у холста, а вид
        // (включена / цвет) копируется с неё при каждом изменении — состояние одно, кнопок две.
        const PLAYER_DOCK = {
            init: function() {
                document.querySelectorAll('.pl-extra').forEach(b => {
                    const orig = document.getElementById(b.dataset.for);
                    if (!orig) return;
                    const copy = () => {
                        ['active-yellow', 'active-green', 'active-red'].forEach(c => b.classList.toggle(c, orig.classList.contains(c)));
                        b.style.background = orig.style.background || '';
                    };
                    b.addEventListener('click', () => orig.click());
                    new MutationObserver(copy).observe(orig, { attributes: true, attributeFilter: ['class', 'style'] });
                    copy();
                });
            }
        };

        // 35.8: ❓ Помощь — описание и инструкция в отдельном окне поверх страницы. Esc или ✕ закрывают.
        const HELP = {
            el: null,
            open: function() {
                if (!this.el) {
                    this.el = document.createElement('div');
                    this.el.id = 'helpOverlay';
                    this.el.innerHTML = '<div id="helpBox"><button type="button" id="helpClose" title="Закрыть (Esc)">✕</button>' +
                        document.getElementById('helpText').innerHTML + '</div>';
                    this.el.addEventListener('click', e => { if (e.target === this.el || e.target.id === 'helpClose') this.close(); });
                    document.addEventListener('keydown', e => { if (e.key === 'Escape' && this.el.classList.contains('show')) this.close(); });
                    document.body.appendChild(this.el);
                }
                this.el.classList.add('show');
            },
            close: function() { if (this.el) this.el.classList.remove('show'); }
        };

        /* 35.44: F5 НЕ СБРАСЫВАЕТ (запрос пользователя: «F5 не должен сбрасывать, начать с того же»). Раньше при
           каждом открытии ставился стартовый вид (радар, 350 строк, 60 мс, цвет как код…) и затирал всё, что
           настроили. Теперь при уходе со страницы (F5, закрытие вкладки, переход в Хаб) состояние целиком ложится
           в память браузера: текст холста, вид и галочки (тот же снимок, что у ★-сцены), скорость, цвета,
           радар, рамка, выбранная сцена, кадр плеера и играл ли он. При открытии оно возвращается; стартовый
           вид остаётся только для самого первого открытия, пока запомненного нет. Не влез текст в память
           (очень большой файл) — пишется без текста, а текст берётся как раньше. */
        const SESSION = {
            KEY: 'zcode_session_v1',
            bind: function() {
                const save = () => this.save();
                window.addEventListener('pagehide', save);
                window.addEventListener('beforeunload', save);
                document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
            },
            collect: function(withText) {
                return {
                    v: 1, ui: SCENE_MANAGER.snapshotUi(),
                    speed: UI.speedRange.value, theme: UI.themeSelect.value,
                    act: UI.activeColorPicker.value, actA: UI.activeAlphaRange.value,
                    stat: UI.staticColorPicker.value, statA: UI.staticAlphaRange.value,
                    echo: UI.echoModeCheck.checked, dual: UI.dualCoreCheck.checked, dualMask: UI.dualMaskCheck.checked,
                    freezeY: UI.freezeScrollCheck.checked, spin3d: UI.spin3dCheck.checked,
                    breathing: !!(UI.breathingZoomCheck && UI.breathingZoomCheck.checked),
                    elka: UI.elkaCheck.checked, neon: UI.neonGlowCheck.checked,
                    rainbow: !!(UI.rainbowTextCheck && UI.rainbowTextCheck.checked),
                    frame: MODULE_STATE.isFrameActive, radar: MODULE_STATE.isRadarActive,
                    scene: UI.sceneSelect.value, idx: MODULE_STATE.currentIndex,
                    ox: MODULE_STATE.offsetX, oy: MODULE_STATE.offsetY, playing: MODULE_STATE.isPlaying,
                    // 35.52: и счёт Аниматрицы — иначе после F5 «пройдено циклов 0» при уже прокрученном тексте
                    anim: { passes: MODULE_STATE.animPasses || 0, row: MODULE_STATE.animatrixRow || 0,
                        cycle: MODULE_STATE.animCycle || null, seen: MODULE_STATE.animSeen ? Array.from(MODULE_STATE.animSeen) : null },
                    text: withText ? MODULE_STATE.originalLines : null
                };
            },
            save: function() {
                try { localStorage.setItem(this.KEY, JSON.stringify(this.collect(true))); }
                catch (e) { try { localStorage.setItem(this.KEY, JSON.stringify(this.collect(false))); } catch (e2) {} }
            },
            restore: function() {
                let st = null;
                try { st = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { st = null; }
                if (!st || st.v !== 1) return false;
                this.apply(st, !!st.playing);
                UI.statusInfo.textContent = 'Продолжено с того же места';
                return true;
            },
            // 35.45: поставить снимок целиком — и при открытии страницы, и для ★-сцены (у неё снимок в поле full).
            // play — запускать ли плеер после.
            apply: function(st, play) {
                // Сначала текст: его загрузка сама выставляет «Экран» по числу строк, а снимок ниже вернёт свой.
                if (Array.isArray(st.text) && st.text.length) {
                    MODULE_STATE.originalLines = MODULE_DATA.normalizeLines(st.text);
                    MODULE_DATA.precalculateLines(true);
                } else if (!MODULE_DATA.loadFromLocalStorage()) SCENE_MANAGER.loadScene("sourcecode", true);
                if (st.ui) SCENE_MANAGER.applyUi(st.ui);
                if (st.speed) { UI.speedRange.value = st.speed; UI.speedVal.textContent = (1001 - UI.speedRange.value) + ' мс'; }
                if (st.theme) UI.themeSelect.value = st.theme;
                if (st.act) UI.activeColorPicker.value = st.act;
                if (st.actA != null) UI.activeAlphaRange.value = st.actA;
                if (st.stat) UI.staticColorPicker.value = st.stat;
                if (st.statA != null) UI.staticAlphaRange.value = st.statA;
                UI.echoModeCheck.checked = !!st.echo; UI.dualCoreCheck.checked = !!st.dual; UI.dualMaskCheck.checked = !!st.dualMask;
                UI.freezeScrollCheck.checked = !!st.freezeY; UI.spin3dCheck.checked = !!st.spin3d;
                if (UI.breathingZoomCheck) UI.breathingZoomCheck.checked = !!st.breathing;
                UI.elkaCheck.checked = !!st.elka; UI.neonGlowCheck.checked = !!st.neon;
                if (UI.rainbowTextCheck) UI.rainbowTextCheck.checked = !!st.rainbow;
                MODULE_STATE.isFrameActive = !!st.frame; UI.toggleFrameBtn.classList.toggle('active-yellow', !!st.frame);
                MODULE_STATE.isRadarActive = !!st.radar;
                UI.toggleRadarBtn.classList.toggle('active-yellow', !!st.radar);
                UI.toggleRadarBtn.style.background = st.radar ? '#00ff66' : '#cc33ff';
                if (st.scene != null && Array.from(UI.sceneSelect.options).some(o => o.value === st.scene)) UI.sceneSelect.value = st.scene;
                const n = MODULE_STATE.lines.length || 1;
                MODULE_STATE.currentIndex = (((st.idx | 0) % n) + n) % n;
                MODULE_STATE.offsetX = +st.ox || 0; MODULE_STATE.offsetY = +st.oy || 0;
                MODULE_STATE.frozenIndex = null;   // ⚓ встаёт на кадр снимка
                // 35.52: счёт Аниматрицы (загрузка текста выше его обнулила — ставим запомненный). Отпечатки прошлых
                // циклов тоже: без них повтор с циклом до F5 не нашёлся бы. Историю для ⏮ не храним — она большая:
                // назад можно будет только до того места, где открыли страницу.
                if (st.anim) {
                    const a = st.anim;
                    MODULE_STATE.animPasses = a.passes | 0; MODULE_STATE.animatrixRow = a.row | 0;
                    MODULE_STATE.animCycle = a.cycle || null;
                    MODULE_STATE.animSeen = Array.isArray(a.seen) ? new Map(a.seen) : null;
                    MODULE_STATE.animHist = null; MODULE_STATE.animHistSize = 0;
                }
                SCENE_MANAGER.syncLabels();
                MODULE_DATA.animInfoUpd();   // 35.48: галку Аниматрицы поставил снимок, без события — счётчик показать сразу
                RENDERER.updateTimeline(); RENDERER.renderFrame();
                if (play && !MODULE_STATE.isPlaying) PLAYER.start();
            }
        };

        window.onload = function() { 
            TABS.init();
            PLAYER_DOCK.init();
            // 35.16: сетка следит за экраном — перестраивается при смене окна, кегля, интервала, шрифта, радара.
            const refit = () => MODULE_DATA.refitVacuum();
            window.addEventListener('resize', refit);
            [UI.fontSizeRange, UI.lineHeightRange, document.getElementById('charSpacingRange'), UI.fontSelect].forEach(el => { if (el) { el.addEventListener('input', refit); el.addEventListener('change', refit); } });
            if (UI.toggleRadarBtn) UI.toggleRadarBtn.addEventListener('click', refit);
            if (UI.canvas) UI.canvas.addEventListener('wheel', refit, { passive: true });
            EVENTS.init(); 
            const spVal = parseInt(UI.speedRange.value, 10); UI.speedVal.textContent = (1001 - spVal) + ' мс';
            // 35.44: есть запомненное состояние — продолжаем с него, стартовый вид ниже не ставится
            SESSION.bind();
            if (SESSION.restore()) return;
            if(!MODULE_DATA.loadFromLocalStorage()) {
                SCENE_MANAGER.loadScene("sourcecode", true);
            }

            // 35.3–35.4: стартовый вид по просьбе пользователя (два скриншота) — радар и рамка включены,
            // свечение выключено, 60 мс на шаг, x1, масштаб 19px, экран 350, интервал 0.7, цвет как код,
            // Матрица с фоном 0.8, Серпинский / Оригинал, анимации сдвига сняты, и сразу Play.
            // Ставится ПОСЛЕ сцены: сцена "sourcecode" включает неон и гасит радар.
            UI.speedRange.value = 941; UI.speedVal.textContent = (1001 - 941) + ' мс';
            UI.fontSizeRange.value = 19; UI.fontSizeVal.textContent = '19px';
            UI.heightRange.max = Math.max(parseInt(UI.heightRange.max, 10), 350); UI.heightRange.value = 350; UI.heightVal.textContent = '350';
            UI.lineHeightRange.value = 0.7; UI.lineHeightVal.textContent = '0.7';
            UI.fontSelect.value = 'monospace';
            UI.rainbowTextCheck.checked = false; UI.syntaxColorCheck.checked = true;
            UI.themeSelect.value = 'matrix';
            UI.activeColorPicker.value = '#ffffff'; UI.activeAlphaRange.value = 1.0;
            UI.staticColorPicker.value = '#00ff66'; UI.staticAlphaRange.value = 0.8;
            UI.speedMultInput.value = 1; const multVal = document.getElementById('speedMultVal'); if (multVal) multVal.textContent = '1';
            UI.deltaModeSelect.value = 'serpinski';
            const logicalOp = document.getElementById('logicalOpSelect'); if (logicalOp) logicalOp.value = 'original';
            UI.zerkaliusAnimCheck.checked = false; UI.elkaCheck.checked = false; UI.cylinderCheck.checked = false;
            UI.findDiagonalsCheck.checked = false; UI.neonGlowCheck.checked = false;
            MODULE_STATE.isFrameActive = false; UI.toggleFrameBtn.classList.remove('active-yellow'); // 35.12: рамка по умолчанию выключена
            MODULE_STATE.isRadarActive = true; UI.toggleRadarBtn.classList.add('active-yellow'); UI.toggleRadarBtn.style.background = '#00ff66';
            MODULE_STATE.isReverse = true; UI.toggleReverseBtn.classList.add('active-green'); // 35.6: 🔃 реверс включён с ходу
            RENDERER.renderFrame();
            if (!MODULE_STATE.isPlaying) PLAYER.start();
        };
    </script>
    <script src="_js/recorder.js"></script>
    <script src="_js/hub-link.js"></script>
</body>
</html>
