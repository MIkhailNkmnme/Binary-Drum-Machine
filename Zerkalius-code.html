                    UI.canvas.addEventListener('mousedown', function(e) { MODULE_STATE.isDragging = true; MODULE_STATE.hasMoved = false; MODULE_STATE.dragStartX = e.clientX; MODULE_STATE.dragStartY = e.clientY; MODULE_STATE.startOffsetX = MODULE_STATE.offsetX; MODULE_STATE.startOffsetY = MODULE_STATE.offsetY; });
                    UI.canvas.addEventListener('mousemove', function(e) { if (MODULE_STATE.isDragging) { const dx = e.clientX - MODULE_STATE.dragStartX; const dy = e.clientY - MODULE_STATE.dragStartY; if (Math.abs(dx) > 3 || Math.abs(dy) > 3) MODULE_STATE.hasMoved = true; MODULE_STATE.offsetX = MODULE_STATE.startOffsetX + dx; MODULE_STATE.offsetY = MODULE_STATE.startOffsetY + dy; RENDERER.renderFrame(); } });
                    window.addEventListener('mouseup', function(e) { MODULE_STATE.isDragging = false; });
                    UI.canvas.addEventListener('click', function(e) { if (!MODULE_STATE.hasMoved && MODULE_STATE.lines.length > 0) { if (MODULE_STATE.isPlaying) PLAYER.pause(); else PLAYER.start(); }});
                    // Колесо шлёт события пачками, и на каждое шла полная перерисовка —
                    // отсюда рывки при смене масштаба. Склеиваем: сколько бы событий ни
                    // пришло, перерисовка будет одна на кадр.
                    // Один планировщик на всё: колесо, ползунки, пипетки цвета. События
                    // ввода летят пачками (перетаскивание ползунка — это десятки событий
                    // в секунду), а раньше каждое вызывало полную перерисовку и они
                    // выстраивались в очередь, задерживая отклик на сотни миллисекунд.
                    // Проигрыватель уже рисует кадр в своём цикле, поэтому запрос от
                    // интерфейса — это пометка «картинка устарела»: если кадр в этом
                    // такте всё равно нарисуется, второй раз рисовать нечего.
                    let uiRaf = 0;
                    const scheduleWheelRender = () => {
                        MODULE_STATE.uiDirty = true;
                        if (uiRaf) return;
                        uiRaf = requestAnimationFrame(() => {
                            uiRaf = 0;
                            if (!MODULE_STATE.uiDirty) return;   // проигрыватель успел раньше
                            RENDERER.renderFrame();
                        });
                    };
                    window.__zerkScheduleRender = scheduleWheelRender;
                    UI.canvas.addEventListener('wheel', function(e) { if (MODULE_STATE.lines.length === 0) return; e.preventDefault(); if(UI.fontSizeRange) { let size = parseInt(UI.fontSizeRange.value, 10); if (0 > e.deltaY) size = Math.min(100, size + 1); else size = Math.max(1, size - 1);  UI.fontSizeRange.value = size; if(UI.fontSizeVal) UI.fontSizeVal.textContent = size + "px"; } scheduleWheelRender(); }, { passive: false });
                }

                if(UI.themeSelect) { UI.themeSelect.addEventListener('change', function() { const t = THEMES[this.value]; if(t) { UI.activeColorPicker.value = t.act; UI.activeAlphaRange.value = t.actA; UI.staticColorPicker.value = t.stat; UI.staticAlphaRange.value = t.statA; RENDERER.renderFrame(); } }); }
                if(UI.toggleMenuBtn) { UI.toggleMenuBtn.addEventListener('click', function() { /* 35.8: прячет/показывает обе панели разом, вкладки остаются */ const off = document.body.classList.toggle('menu-off'); this.style.background = off ? '#222' : '#00ff66'; TABS.sync(); }); }
                // 35.24: кнопка ⇄ (поменять панели местами) убрана по слову пользователя — «не нужно больше».

                if(UI.toggleCenterBtn) UI.toggleCenterBtn.addEventListener('click', function() { MODULE_STATE.isCenterActive = !MODULE_STATE.isCenterActive; if(MODULE_STATE.isCenterActive) { this.classList.add('active-yellow'); MODULE_STATE.isTrackRowActive = false; UI.toggleTrackBtn.classList.remove('active-red'); } else this.classList.remove('active-yellow'); RENDERER.renderFrame(); });
                if(UI.toggleFrameBtn) UI.toggleFrameBtn.addEventListener('click', function() { MODULE_STATE.isFrameActive = !MODULE_STATE.isFrameActive; if(MODULE_STATE.isFrameActive) this.classList.add('active-yellow'); else this.classList.remove('active-yellow'); RENDERER.renderFrame(); });
                if(UI.toggleRadarBtn) UI.toggleRadarBtn.addEventListener('click', function() { MODULE_STATE.isRadarActive = !MODULE_STATE.isRadarActive; if(MODULE_STATE.isRadarActive) { this.classList.add('active-yellow'); this.style.background = '#00ff66'; } else { this.classList.remove('active-yellow'); this.style.background = '#cc33ff'; MODULE_STATE.globalAngle = 0; } RENDERER.renderFrame(); });
                if(UI.toggleTrackBtn) UI.toggleTrackBtn.addEventListener('click', function() { MODULE_STATE.isTrackRowActive = !MODULE_STATE.isTrackRowActive; if(MODULE_STATE.isTrackRowActive) { this.classList.add('active-red'); MODULE_STATE.trackedRowIndex = MODULE_STATE.currentIndex; MODULE_STATE.isCenterActive = false; UI.toggleCenterBtn.classList.remove('active-yellow'); } else { this.classList.remove('active-red'); MODULE_STATE.trackedRowIndex = -1; } RENDERER.renderFrame(); });
                if(UI.toggleReverseBtn) UI.toggleReverseBtn.addEventListener('click', function() { MODULE_STATE.isReverse = !MODULE_STATE.isReverse; if(MODULE_STATE.isReverse) this.classList.add('active-green'); else this.classList.remove('active-green'); });
                if(UI.timelineRange) UI.timelineRange.addEventListener('input', (e) => { if (MODULE_STATE.isPlaying) PLAYER.stop(); MODULE_STATE.currentIndex = parseInt(e.target.value, 10); scheduleRender(); });
                if(UI.prevBtn) UI.prevBtn.addEventListener('click', () => { if (MODULE_STATE.isPlaying) PLAYER.stop(); if (MODULE_STATE.lines.length > 0) { MODULE_STATE.currentIndex = (MODULE_STATE.currentIndex - 1 + MODULE_STATE.lines.length) % MODULE_STATE.lines.length; RENDERER.renderFrame(); RENDERER.updateTimeline(); }});
                if(UI.nextBtn) UI.nextBtn.addEventListener('click', () => { if (MODULE_STATE.isPlaying) PLAYER.stop(); if (MODULE_STATE.lines.length > 0) { MODULE_STATE.currentIndex = (MODULE_STATE.currentIndex + 1) % MODULE_STATE.lines.length; RENDERER.renderFrame(); RENDERER.updateTimeline(); }});
                if(UI.stopBtn) UI.stopBtn.addEventListener('click', () => PLAYER.stop());
                if(UI.playBtn) UI.playBtn.addEventListener('click', () => { if (MODULE_STATE.lines.length > 0) { if (MODULE_STATE.isPlaying) PLAYER.pause(); else PLAYER.start(); }});
                if(UI.exportExcelBtn) UI.exportExcelBtn.addEventListener('click', () => MODULE_DATA.exportToExcel());
                if(UI.exportBtn) UI.exportBtn.addEventListener('click', async () => { if (MODULE_STATE.originalLines.length === 0) return alert("Нет данных!"); const jsonStr = JSON.stringify(MODULE_STATE.originalLines, null, 2); const blob = new Blob([jsonStr], { type: "text/plain;charset=utf-8" }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "Zerkalius_Data.txt"; link.click(); URL.revokeObjectURL(link.href); });
                
                if(UI.fileLoader) UI.fileLoader.addEventListener('change', function(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { MODULE_DATA.processTextData(e.target.result, file.name); }; reader.readAsText(file); });
                document.addEventListener('paste', function(e) { 
                    const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : ''; 
                    if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') return; 
                    let text = e.clipboardData.getData('text/plain'); 
                    if (text) { text = text.replace(/\t/g, ' '); MODULE_DATA.processTextData(text, 'Буфер обмена'); e.preventDefault(); if(!MODULE_STATE.isPlaying) RENDERER.renderFrame(); } 
                });
                
                if(UI.speedRange) { UI.speedRange.addEventListener('input', (e) => { const val = parseInt(e.target.value, 10); UI.speedVal.textContent = (1001 - val) + ' мс'; }); }
                if(UI.fontSizeRange) UI.fontSizeRange.addEventListener('input', (e) => { if(UI.fontSizeVal) UI.fontSizeVal.textContent = e.target.value + 'px'; scheduleRender(); });
                if(UI.heightRange) UI.heightRange.addEventListener('input', (e) => { if(UI.heightVal) UI.heightVal.textContent = e.target.value; scheduleRender(); });
                if(UI.lineHeightRange) UI.lineHeightRange.addEventListener('input', (e) => { if(UI.lineHeightVal) UI.lineHeightVal.textContent = e.target.value; scheduleRender(); });
                if(UI.zerkaliusBtn) UI.zerkaliusBtn.addEventListener('click', () => MODULE_DATA.generateSierpinski());
                
                const rerenderEvents = [
                    UI.cylinderCheck, UI.elkaCheck, UI.hideStaticCheck, UI.deltaModeSelect, UI.neonGlowCheck, 
                    UI.findDiagonalsCheck, UI.logicalOpSelect, UI.dualCoreCheck, UI.dualCoreSpeedInput, UI.dualMaskCheck, UI.freezeLayer1Check,
                    UI.activeColorPicker, UI.activeAlphaRange, UI.staticColorPicker, UI.staticAlphaRange, UI.fontSelect, UI.freezeScrollCheck, UI.spin3dCheck, UI.breathingZoomCheck, UI.autoPilotCheck, UI.speedMultInput, UI.rainbowTextCheck, UI.syntaxColorCheck
                ];
                const scheduleRender = () => (window.__zerkScheduleRender || (() => RENDERER.renderFrame()))();
                rerenderEvents.forEach(el => { if(el) { el.addEventListener('change', scheduleRender); el.addEventListener('input', scheduleRender); }});
                // Запись: одна кнопка на старт и стоп, рядом счётчик времени.
                if (UI.recBtn) {
                    UI.recBtn.addEventListener('click', () => {
                        const timer = document.getElementById('recTimer');
                        if (RECORDER.rec) {
                            RECORDER.stop();
                            clearInterval(RECORDER.timer);
                            UI.recBtn.classList.remove('recording');
                            if (timer) timer.style.display = 'none';
                            RECORDER.notify('● СОХРАНЕНО');
                            return;
                        }
                        if (!RECORDER.start(60)) return;
                        UI.recBtn.classList.add('recording');
                        if (timer) timer.style.display = 'block';
                        RECORDER.timer = setInterval(() => {
                            const sec = Math.floor((Date.now() - RECORDER.startedAt) / 1000);
                            if (timer) timer.textContent = `● REC ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
                        }, 500);

                    });
                }
                // К каждому ползунку в панели — по стрелке слева и справа: колесо
                // и перетаскивание годятся для грубой настройки, а точное значение
                // пальцем не поймать. Удержание повторяет шаг.
                document.querySelectorAll('.controls input[type="range"]').forEach(el => {
                    if (el.dataset.arrowed) return;
                    el.dataset.arrowed = '1';
                    const wrap = document.createElement('span');
                    wrap.className = 'range-with-arrows';
                    el.parentNode.insertBefore(wrap, el);
                    const mk = (text, dir) => {
                        const b = document.createElement('button');
                        b.type = 'button'; b.className = 'range-arrow'; b.textContent = text;
                        b.tabIndex = -1;
                        const step = () => {
                            const st = parseFloat(el.step) || 1;
                            const min = parseFloat(el.min), max = parseFloat(el.max);
                            let v = parseFloat(el.value) + dir * st;
                            if (!isNaN(min)) v = Math.max(min, v);
                            if (!isNaN(max)) v = Math.min(max, v);
                            const dec = (String(st).split('.')[1] || '').length;
                            el.value = dec ? v.toFixed(dec) : v;
                            el.dispatchEvent(new Event('input', { bubbles: true }));
                            el.dispatchEvent(new Event('change', { bubbles: true }));
                        };
                        let hold = null, rep = null;
                        const stop = () => { clearTimeout(hold); clearInterval(rep); hold = rep = null; };
                        b.addEventListener('mousedown', ev => { ev.preventDefault(); step();
                            hold = setTimeout(() => { rep = setInterval(step, 55); }, 380); });
                        ['mouseup', 'mouseleave', 'blur'].forEach(t => b.addEventListener(t, stop));
                        return b;
                    };
                    wrap.appendChild(mk('\u25C2', -1));
                    wrap.appendChild(el);
                    wrap.appendChild(mk('\u25B8', +1));
                });

                // Показываем значение множителя рядом с "x" — у ползунка своей подписи нет.
                if (UI.speedMultInput) {
                    const multVal = document.getElementById('speedMultVal');
                    const showMult = () => { if (multVal) multVal.textContent = UI.speedMultInput.value; };
                    UI.speedMultInput.addEventListener('input', showMult);
                    showMult();
                }
                window.addEventListener('resize', () => RENDERER.renderFrame());
            }
        };

        // 35.8: вкладки, как в Layers. Полоса #menuTabs строится из разделов .tab-sec в порядке
        // разметки (сначала левая панель, потом правая). Щелчок — спрятать/показать раздел.
        // Какие спрятаны — помнится в браузере; память может быть недоступна, тогда всё открыто.
        const TABS = {
            KEY: 'zcode_tabs_off_v2',   // 35.23: v1 → v2, чтобы новое умолчание «всё открыто» дошло и до тех, у кого в памяти «только плеер»
            init: function() {
                const bar = document.getElementById('menuTabs');
                let off = [];
                // 35.23: по умолчанию (ничего не сохранено) открыты ВСЕ разделы (в 35.10–35.22 — только ▶ Плеер).
                let savedOff = null;
                try { savedOff = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { savedOff = null; }
                off = Array.isArray(savedOff) ? savedOff : [];
                document.querySelectorAll('.tab-sec').forEach(sec => {
                    const b = document.createElement('button');
                    b.type = 'button'; b.textContent = sec.dataset.title;
                    b.title = 'Показать / спрятать раздел «' + sec.dataset.title + '»';
                    if (off.includes(sec.dataset.tab)) sec.classList.add('off');
                    b.addEventListener('click', () => { sec.classList.toggle('off'); this.sync(); });
                    sec._tabBtn = b; bar.appendChild(b);
                    this.addHead(sec);
                });
                this.restoreLayout();
                const h = document.createElement('button');
                h.type = 'button'; h.className = 'help'; h.textContent = '❓ Помощь'; h.title = 'Описание и как пользоваться';
                h.addEventListener('click', () => HELP.open());
                const rl = document.createElement('button');
                // 35.13: ↺ — поочерёдно «все разделы» / «только плеер». Разделы остаются там, куда их
                // перенесли; меняется только видимость. Shift+щелчок — сброс раскладки на исходную.
                rl.type = 'button'; rl.textContent = '↺';
                rl.title = 'Щелчок: все разделы ⇄ только плеер. Shift+щелчок: вернуть раскладку по умолчанию';
                rl.addEventListener('click', e => {
                    if (e.shiftKey) { if (confirm('Вернуть раскладку по умолчанию (все разделы открыты, плеер окном внизу по центру)?')) this.resetLayout(); return; }
                    const secs = Array.from(document.querySelectorAll('.tab-sec'));
                    const othersOpen = secs.some(sec => sec.dataset.tab !== 'player' && !sec.classList.contains('off'));
                    secs.forEach(sec => sec.classList.toggle('off', othersOpen && sec.dataset.tab !== 'player'));
                    this.sync();
                });
                bar.appendChild(rl);
                bar.appendChild(h);
                this.sync(false);   // рисовать рано: холст ещё не настроен, это сделает onload
            },
            sync: function(render) {
                const off = [];
                document.querySelectorAll('.tab-sec').forEach(sec => {
                    const isOff = sec.classList.contains('off');
                    if (isOff) off.push(sec.dataset.tab);
                    if (sec._tabBtn) sec._tabBtn.classList.toggle('on', !isOff);
                    if (sec.dataset.tab === 'player') document.body.classList.toggle('player-on', !isOff);
                });
                ['leftPanel', 'rightPanel'].forEach(id => {
                    const p = document.getElementById(id);
                    p.classList.toggle('empty', !p.querySelector('.tab-sec:not(.off)'));
                });
                // Столбец кнопок стоит у левой панели: нет её — прижимается к краю.
                const leftGone = document.body.classList.contains('menu-off') || document.getElementById('leftPanel').classList.contains('empty');
                document.body.classList.toggle('panel-hidden', leftGone);
                try { localStorage.setItem(this.KEY, JSON.stringify(off)); } catch (e) {}
                if (render !== false) RENDERER.renderFrame();
            },

            // 35.9: разделы перемещаются, как меню в Layers. Тащат за шапку: над панелью — встаёт
            // между разделами там, где курсор; мимо панелей — висит на холсте плавающим окном.
            // Раскладка (где какой раздел и в каком порядке) помнится в браузере.
            LAYOUT_KEY: 'zcode_layout_v1',
            addHead: function(sec) {
                const head = document.createElement('div');
                head.className = 'sec-head';
                head.title = 'Потяните, чтобы перенести раздел: в другое место, в соседнюю панель или на холст';
                head.innerHTML = '<span class="grip">✥</span><span class="ttl"></span><button type="button" class="x" title="Спрятать раздел (вернуть — вкладкой сверху)">✕</button>';
                head.querySelector('.ttl').textContent = sec.dataset.title;
                head.querySelector('.x').addEventListener('click', e => { e.stopPropagation(); sec.classList.add('off'); this.sync(); });
                head.addEventListener('pointerdown', e => {
                    if (e.button !== 0 || e.target.closest('.x')) return;
                    e.preventDefault();
                    this.drag = { sec: sec, x0: e.clientX, y0: e.clientY, started: false };
                });
                sec.insertBefore(head, sec.firstChild);
                if (!this._dragBound) {
                    this._dragBound = true;
                    document.addEventListener('pointermove', e => this.dragMove(e));
                    document.addEventListener('pointerup', () => this.dragEnd());
                    window.addEventListener('resize', () => document.querySelectorAll('.tab-sec.floating').forEach(f => this.clamp(f, parseFloat(f.style.left) || 0, parseFloat(f.style.top) || 0)));
                }
            },
            panelUnder: function(x, y) {
                for (const id of ['leftPanel', 'rightPanel']) {
                    const p = document.getElementById(id);
                    const r = p.getBoundingClientRect();
                    if (r.width && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return p;
                }
                return null;
            },
            // Плавающее окно не уводим за край: шапка должна оставаться, за что схватить.
            clamp: function(f, x, y) {
                const w = f.offsetWidth || 284, KEEP = 60;
                f.style.left = Math.round(Math.min(window.innerWidth - KEEP, Math.max(KEEP - w, x))) + 'px';
                f.style.top = Math.round(Math.min(window.innerHeight - 24, Math.max(0, y))) + 'px';
            },
            dragMove: function(e) {
                const d = this.drag; if (!d) return;
                if (!d.started) {
                    if (Math.abs(e.clientX - d.x0) < 4 && Math.abs(e.clientY - d.y0) < 4) return;   // это был щелчок
                    const r = d.sec.getBoundingClientRect();
                    d.dx = d.x0 - r.left; d.dy = d.y0 - r.top; d.started = true;
                    d.sec.classList.add('dragging'); document.body.classList.add('tab-dragging');
                }
                const panel = this.panelUnder(e.clientX, e.clientY);
                document.querySelectorAll('.controls').forEach(p => p.classList.toggle('drop-hover', p === panel));
                if (panel) {
                    if (d.sec.classList.contains('floating')) { d.sec.classList.remove('floating'); d.sec.style.left = ''; d.sec.style.top = ''; }
                    const slot = panel.querySelector('.scrollable-settings');
                    const before = Array.from(slot.children).find(c => c !== d.sec && c.classList.contains('tab-sec') && !c.classList.contains('off')
                        && e.clientY < c.getBoundingClientRect().top + c.getBoundingClientRect().height / 2);
                    if (before) { if (d.sec.nextSibling !== before) slot.insertBefore(d.sec, before); }
                    else if (slot.lastElementChild !== d.sec) slot.appendChild(d.sec);
                } else {
                    if (!d.sec.classList.contains('floating')) { d.sec.classList.add('floating'); document.body.appendChild(d.sec); }
                    this.clamp(d.sec, e.clientX - d.dx, e.clientY - d.dy);
                }
            },
            dragEnd: function() {
                const d = this.drag; this.drag = null;
                if (!d || !d.started) return;
                d.sec.classList.remove('dragging'); document.body.classList.remove('tab-dragging');
                document.querySelectorAll('.controls').forEach(p => p.classList.remove('drop-hover'));
                this.saveLayout(); this.sync();
            },
            saveLayout: function() {
                const lay = {};
                document.querySelectorAll('.tab-sec').forEach(sec => {
                    if (sec.classList.contains('floating')) lay[sec.dataset.tab] = { z: 'float', x: parseInt(sec.style.left, 10) || 0, y: parseInt(sec.style.top, 10) || 0 };
                    else if (sec.parentElement && sec.parentElement.id) lay[sec.dataset.tab] = { z: sec.parentElement.id, i: Array.from(sec.parentElement.children).indexOf(sec) };
                });
                try { localStorage.setItem(this.LAYOUT_KEY, JSON.stringify(lay)); } catch (e) {}
            },
            restoreLayout: function() {
                let lay = null;
                try { lay = JSON.parse(localStorage.getItem(this.LAYOUT_KEY) || 'null'); } catch (e) { lay = null; }
                if (!lay) {
                    // 35.10: раскладка по умолчанию — плеер плавающим окном внизу по центру холста.
                    const pl = document.querySelector('.tab-sec[data-tab="player"]');
                    if (pl) {
                        pl.classList.add('floating'); document.body.appendChild(pl);
                        this.clamp(pl, (window.innerWidth - pl.offsetWidth) / 2, window.innerHeight * 0.56);
                    }
                    return;
                }
                const secs = Array.from(document.querySelectorAll('.tab-sec'));
                ['leftSlot', 'rightSlot', 'leftPanel'].forEach(z => {
                    const zone = document.getElementById(z);
                    secs.filter(s => lay[s.dataset.tab] && lay[s.dataset.tab].z === z)
                        .sort((a, b) => lay[a.dataset.tab].i - lay[b.dataset.tab].i)
                        .forEach(s => zone.appendChild(s));
                });
                secs.forEach(s => {
                    const l = lay[s.dataset.tab];
                    if (l && l.z === 'float') { s.classList.add('floating'); document.body.appendChild(s); this.clamp(s, l.x, l.y); }
                });
            },
            // Вернуть разделы на свои места — на случай, если раскладку запутали.
            resetLayout: function() {
                try { localStorage.removeItem(this.LAYOUT_KEY); localStorage.removeItem(this.KEY); } catch (e) {}
                location.reload();
            }
        };

        // 35.12: двойники 🔃 и 🛰️ на плеере. Щелчок жмёт настоящую кнопку у холста, а вид
        // (включена / цвет) копируется с неё при каждом изменении — состояние одно, кнопок две.
        const PLAYER_DOCK = {
            init: function() {
                document.querySelectorAll('.pl-extra').forEach(b => {
                    const orig = document.getElementById(b.dataset.for);
                    if (!orig) return;
                    const copy = () => {
                        ['active-yellow', 'active-green', 'active-red'].forEach(c => b.classList.toggle(c, orig.classList.contains(c)));
                        b.style.background = orig.style.background || '';
                    };
                    b.addEventListener('click', () => orig.click());
                    new MutationObserver(copy).observe(orig, { attributes: true, attributeFilter: ['class', 'style'] });
                    copy();
                });
            }
        };

        // 35.8: ❓ Помощь — описание и инструкция в отдельном окне поверх страницы. Esc или ✕ закрывают.
        const HELP = {
            el: null,
            open: function() {
                if (!this.el) {
                    this.el = document.createElement('div');
                    this.el.id = 'helpOverlay';
                    this.el.innerHTML = '<div id="helpBox"><button type="button" id="helpClose" title="Закрыть (Esc)">✕</button>' +
                        document.getElementById('helpText').innerHTML + '</div>';
                    this.el.addEventListener('click', e => { if (e.target === this.el || e.target.id === 'helpClose') this.close(); });
                    document.addEventListener('keydown', e => { if (e.key === 'Escape' && this.el.classList.contains('show')) this.close(); });
                    document.body.appendChild(this.el);
                }
                this.el.classList.add('show');
            },
            close: function() { if (this.el) this.el.classList.remove('show'); }
        };

        window.onload = function() { 
            TABS.init();
            PLAYER_DOCK.init();
            // 35.16: сетка следит за экраном — перестраивается при смене окна, кегля, интервала, шрифта, радара.
            const refit = () => MODULE_DATA.refitVacuum();
            window.addEventListener('resize', refit);
            [UI.fontSizeRange, UI.lineHeightRange, UI.fontSelect].forEach(el => { if (el) { el.addEventListener('input', refit); el.addEventListener('change', refit); } });
            if (UI.toggleRadarBtn) UI.toggleRadarBtn.addEventListener('click', refit);
            if (UI.canvas) UI.canvas.addEventListener('wheel', refit, { passive: true });
            EVENTS.init(); 
            const spVal = parseInt(UI.speedRange.value, 10); UI.speedVal.textContent = (1001 - spVal) + ' мс';
            if(!MODULE_DATA.loadFromLocalStorage()) {
                SCENE_MANAGER.loadScene("sourcecode", true);
            }

            // 35.3–35.4: стартовый вид по просьбе пользователя (два скриншота) — радар и рамка включены,
            // свечение выключено, 60 мс на шаг, x1, масштаб 19px, экран 350, интервал 0.7, цвет как код,
            // Матрица с фоном 0.8, Серпинский / Оригинал, анимации сдвига сняты, и сразу Play.
            // Ставится ПОСЛЕ сцены: сцена "sourcecode" включает неон и гасит радар.
            UI.speedRange.value = 941; UI.speedVal.textContent = (1001 - 941) + ' мс';
            UI.fontSizeRange.value = 19; UI.fontSizeVal.textContent = '19px';
            UI.heightRange.max = Math.max(parseInt(UI.heightRange.max, 10), 350); UI.heightRange.value = 350; UI.heightVal.textContent = '350';
            UI.lineHeightRange.value = 0.7; UI.lineHeightVal.textContent = '0.7';
            UI.fontSelect.value = 'monospace';
            UI.rainbowTextCheck.checked = false; UI.syntaxColorCheck.checked = true;
            UI.themeSelect.value = 'matrix';
            UI.activeColorPicker.value = '#ffffff'; UI.activeAlphaRange.value = 1.0;
            UI.staticColorPicker.value = '#00ff66'; UI.staticAlphaRange.value = 0.8;
            UI.speedMultInput.value = 1; const multVal = document.getElementById('speedMultVal'); if (multVal) multVal.textContent = '1';
            UI.deltaModeSelect.value = 'serpinski';
            const logicalOp = document.getElementById('logicalOpSelect'); if (logicalOp) logicalOp.value = 'original';
            UI.zerkaliusAnimCheck.checked = false; UI.elkaCheck.checked = false; UI.cylinderCheck.checked = false;
            UI.findDiagonalsCheck.checked = false; UI.neonGlowCheck.checked = false;
            MODULE_STATE.isFrameActive = false; UI.toggleFrameBtn.classList.remove('active-yellow'); // 35.12: рамка по умолчанию выключена
            MODULE_STATE.isRadarActive = true; UI.toggleRadarBtn.classList.add('active-yellow'); UI.toggleRadarBtn.style.background = '#00ff66';
            MODULE_STATE.isReverse = true; UI.toggleReverseBtn.classList.add('active-green'); // 35.6: 🔃 реверс включён с ходу
            RENDERER.renderFrame();
            if (!MODULE_STATE.isPlaying) PLAYER.start();
        };
    </script>
    <script src="_js/recorder.js"></script>
    <script src="_js/hub-link.js"></script>
</body>
</html>
