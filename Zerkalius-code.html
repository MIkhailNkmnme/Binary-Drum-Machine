<!DOCTYPE html>
<!--
===========================================================================
PROJECT: Binary Drum Machine (Zerkalius: Genesis)
VERSION: Pro 35.24 (Стартовый вид: радар, рамка, цвет как код, 60 мс, сразу Play; Play мигает; обводка у включённых кнопок, столбец кнопок, реверс с ходу; запись мигает и обведена; вкладки слева/справа, ❓ Помощь; разделы перетаскиваются и плавают; по умолчанию все разделы открыты, панели светлее; разделы в панели — карточками; рамка выкл., 🔃 🛰️ дублями над плеером; курсор ✥ на шапке; Сетка — отдельный слой-фон, под радаром кольцами, на мелком масштабе — пикселями; ↺ — все разделы ⇄ только плеер; кнопки ⇄ больше нет)
"We are not just moving strings, we are weaving the fabric of the Matrix."
===========================================================================
-->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Binary Drum Machine (Zerkalius 35.24)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        /* Шрифт сначала ищется на самой машине, и только потом — файлом рядом со
           страницей. Файлов RobotoMono*.ttf в проекте нет и не было, поэтому ссылки
           на них убраны: браузер честно ругался на них в консоль при каждой загрузке.
           Шрифт всё равно приезжает с Google Fonts строкой @import выше, а local()
           подхватит его, если он уже установлен в системе. */
        @font-face {
            font-family: 'Roboto Mono Local';
            src: local('Roboto Mono'), local('RobotoMono-Regular');
            font-weight: normal; font-style: normal;
        }

        body { 
            background: #050505; color: #00ff66; 
            font-family: 'Roboto Mono Local', 'Roboto Mono', monospace; 
            margin: 8px; overflow: hidden; height: calc(100vh - 16px);
            transition: background 0.3s;
        }

        .main-layout { display: flex; gap: 12px; height: 100%; align-items: stretch; flex-direction: row; transition: 0.3s; }
        
        .controls { 
            width: 300px; min-width: 300px; display: flex; flex-direction: column; 
            background: #1c1e24; padding: 6px; border-radius: 4px; border: 1px solid #2c303a; 
            box-sizing: border-box; height: 100%; transition: 0.3s;
        }

        .fixed-top { flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; border-bottom: 2px solid #222; padding-bottom: 6px; margin-bottom: 4px; }
        
        .scrollable-settings { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
        .scrollable-settings::-webkit-scrollbar { width: 6px; }
        .scrollable-settings::-webkit-scrollbar-track { background: #111; }
        .scrollable-settings::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .fixed-player { flex-shrink: 0; background: #23262e; border: 1px solid #2c303a; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; border-top: 2px solid #00ff66; }

        h3 { margin: 0 0 3px 0; color: #ffffff; text-shadow: 0 0 10px rgba(0,255,102,0.3); font-size: 14px; text-align: center; }
        
        .player-buttons { display: flex; gap: 4px; width: 100%; }
        .player-buttons button { font-size: 16px; font-family: inherit; border: none; cursor: pointer; border-radius: 3px; padding: 4px 2px; display:flex; align-items:center; justify-content:center;}
        #playBtn { flex: 2; background: #00ff66; color: #000; } #playBtn:hover { background: #00cc52; }
        /* 35.5: пока идёт Play, кнопка мигает — видно издалека, что машина работает. */
        @keyframes playBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        #playBtn.playing { animation: playBlink 1s ease-in-out infinite; }
        #stopBtn { flex: 1.2; background: #ff3333; color: #fff; } #stopBtn:hover { background: #cc0000; }
        #prevBtn, #nextBtn { flex: 1; background: #202020; color: #fff; border: 1px solid #333; font-size: 14px; }
        /* 35.12: 🔃 и 🛰️ на плеере. 35.20: это ДУБЛИ — кнопки у холста остаются на месте */
        .player-buttons .pl-extra { flex: 0 0 30px; height: 30px; border-radius: 50%; background: #333; color: #fff;
            font-size: 14px; box-shadow: 0 0 5px rgba(0,0,0,.5); }
        /* 35.14: у плавающего плеера 🔃 и 🛰️ висят СНАРУЖИ окна; 35.21: не по бокам, а НАД ним —
           🔃 над левым углом, 🛰️ над правым. В боковой панели — по краям строки кнопок (там снаружи места нет). */
        .tab-sec.floating.fixed-player { overflow: visible; max-height: none; }
        .tab-sec.floating .player-buttons .pl-extra { position: absolute; top: -44px;
            width: 34px; height: 34px; font-size: 16px; }
        .tab-sec.floating #plReverseBtn { left: 0; }
        .tab-sec.floating #plRadarBtn { right: 0; }
        #plRadarBtn { border-radius: 7px; background: #cc33ff; }
        .player-buttons .pl-extra.active-yellow, .player-buttons .pl-extra.active-green { outline: 2px solid #00ff66; outline-offset: 2px; }

        .btn-export { background: #00ccff; color: #000; font-size: 11px; font-weight: bold; border: none; border-radius: 3px; padding: 5px; cursor: pointer; width: 100%; text-align: center; }
        .btn-export-excel { background: #217346; color: #fff; font-size: 11px; font-weight: bold; border: none; border-radius: 3px; padding: 5px; cursor: pointer; width: 100%; text-align: center; }
        
        .btn-zerkalius { background: #ffcc00; color: #000; font-size: 11px; font-weight: bold; padding: 6px; border: none; border-radius: 3px; cursor: pointer; margin-top: 2px; width: 100%; }
        
        .btn-mod { background: #444; color: #00ff66; border: 1px solid #00ff66; font-size: 10px; font-weight: bold; padding: 4px; border-radius: 3px; cursor: pointer; flex: 1; text-align: center; }
        .btn-mod:hover { background: #00ff66; color: #000; }
        .btn-mod.cyan { color: #00ccff; border-color: #00ccff; } .btn-mod.cyan:hover { background: #00ccff; color: #000; }
        .btn-mod.magenta { color: #ff00ff; border-color: #ff00ff; } .btn-mod.magenta:hover { background: #ff00ff; color: #000; }

        .btn-vacuum { background: #00ccff; color: #000; border: none; font-size: 11px; font-weight: bold; padding: 4px; border-radius: 3px; cursor: pointer; width: 100%; margin-top: 2px;}
        .btn-vacuum.grid-on { outline: 2px solid #00ff66; outline-offset: 2px; background: #00ff66; }   /* 35.17: слой сетки включён */
        .btn-clear-canvas { background: #330000; color: #ff6666; border: 1px solid #ff6666; font-size: 11px; font-weight: bold; padding: 5px; border-radius: 3px; cursor: pointer; width: 100%; margin-bottom: 4px;}
        .btn-clear-canvas:hover { background: #ff6666; color: #000; }

        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; flex: 1; }
        .btn-file { display: block; text-align: center; background: #252525; color: #fff; border: 1px solid #3c3c3c; padding: 5px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-audio { background: #9900ff; color: #fff; border: 1px solid #cc66ff; }
        .btn-mic { background: #ff3366; color: #fff; border: 1px solid #ff6699; padding: 5px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; flex: 1; text-align: center;}
        .btn-mic:hover { background: #ff6699; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

        .control-group { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 6px; }
        .control-group-highlight { background: #23262e; padding: 6px; border-radius: 3px; border: 1px solid #2c303a; }
        .control-group-blue { background: #0a1128; padding: 6px; border-radius: 3px; border: 1px solid #1a2a50; }
        .control-group-gold { background: #1a1a00; padding: 6px; border-radius: 3px; border: 1px solid #ffcc00; }
        .control-group:last-of-type { border-bottom: none; }

        label { font-size: 11px; display: flex; justify-content: space-between; align-items: center; user-select: none; color: #888; }
        .compact-row { display: flex; gap: 4px; justify-content: space-between; align-items: center; }
        .checkbox-row { display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 2px; cursor: pointer; }
        .checkbox-row span { color: #aaa; font-weight: normal; font-size: 11px; }
        .checkbox-row:hover span { color: #fff; }

        input[type="range"] { width: 100%; cursor: pointer; margin-top: 1px; }
        input[type="text"], input[type="number"] { background: #151515; color: #fff; border: 1px solid #333; padding: 4px; border-radius: 3px; font-family: inherit; font-size: 11px; outline: none; width: 100%; box-sizing: border-box; }
        input[type="color"] { border: none; width: 28px; height: 16px; padding: 0; background: none; cursor: pointer; }
        select { background: #222; color: #fff; border: 1px solid #444; padding: 3px; border-radius: 3px; width: 100%; font-family: inherit; font-size: 11px; outline: none; cursor: pointer;}
        
        #statusInfo { font-size: 10px; color: #ffcc00; text-align: center; margin-top: 1px; min-height: 11px; }
        #screenContainer { flex-grow: 1; background: #000000; border: 2px solid #111; border-radius: 5px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        #screenCanvas { display: block; cursor: grab; } 
        #screenCanvas:active { cursor: grabbing; }
        
        /* ПЛАВАЮЩИЕ КНОПКИ */
        .float-btn { position: absolute; z-index: 10; border: none; cursor: pointer; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: opacity 0.3s, background 0.2s, box-shadow 0.2s; left: 8px;}
        #toggleMenuBtn { top: 8px; background: #00ff66; color: #000; box-shadow: 0 0 8px rgba(0, 255, 102, 0.5); border-radius: 3px; height: 26px; width: 34px;}
        
        #toggleCenterBtn { top: 50%; transform: translateY(-120px); background: #333; color: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #toggleTrackBtn { top: 50%; transform: translateY(-70px); background: #333; color: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #toggleReverseBtn { top: 50%; transform: translateY(-20px); background: #333; color: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #toggleFrameBtn { top: 50%; transform: translateY(30px); background: #ffcc00; color: #000; box-shadow: 0 0 8px rgba(255, 204, 0, 0.5); }
        #toggleRadarBtn { top: 50%; transform: translateY(80px); background: #cc33ff; color: #fff; box-shadow: 0 0 10px rgba(204, 51, 255, 0.6); border-radius: 8px; }
        /* 35.6: включённая кнопка — обводка с отступом (раньше у 🎯 📌 🔃 состояние было не видно вовсе). */
        .float-btn.active-yellow, .float-btn.active-red, .float-btn.active-green { outline: 2px solid #ffcc00; outline-offset: 3px; }
        .float-btn.active-red { outline-color: #ff3333; }
        .float-btn.active-green { outline-color: #00ff66; }
        #toggleRadarBtn.active-yellow { outline-color: #00ff66; }

        .align-btn { right: 8px; left: auto; background: #0a1128; color: #00ccff; border: 1px solid #1a2a50; border-radius: 4px; height: 28px; width: 34px;}
        #alignLeftBtn { top: 8px; }
        #alignCenterBtn { top: 40px; background: #00ccff; color: #000; box-shadow: 0 0 8px rgba(0, 204, 255, 0.5); }
        #alignRightBtn { top: 72px; }

        .color-palette { display: flex; flex-direction: column; gap: 2px; background: #1a1a1a; padding: 4px; border-radius: 3px; margin-top: 2px; }
        .palette-row { display: flex; gap: 4px; align-items: center; justify-content: space-between; }
        .palette-row span { font-size: 9px; color: #ccc; width: 45px; }
        .palette-row input[type="range"] { margin: 0; }
        
        textarea { 
            background: #050505; color: #ffcc00; border: 1px solid #ffcc00; 
            font-family: inherit; font-size: 10px; width: 100%; height: 60px; 
            margin-top: 4px; border-radius: 3px; resize: none; display: none; 
            padding: 4px; box-sizing: border-box; box-shadow: inset 0 0 5px rgba(255,204,0,0.2);
        }

        /* Своё место у правого края, ниже кнопок выравнивания. В дзен-режиме
           кнопка остаётся видимой — иначе запись не остановить, не выходя из него. */
        #screenContainer #recBtn { right: 8px; left: auto; top: 112px; background: #1a1a1a; color: #ff5555;
            border: 1px solid #552222; font-size: 18px; }
        #recBtn:hover { background: #331111; color: #ff8888; }
        body.zen-mode #recBtn { opacity: 0.35 !important; pointer-events: auto !important; }
        body.zen-mode #recBtn.recording { opacity: 1 !important; }
        /* Холст всегда занимает всё окно, панель плавает поверх него. Так кадр не
           зависит от того, открыта панель или нет — а в запись панель не попадает
           в любом случае, потому что пишется холст, а не экран. */
        .controls { position: absolute; top: 0; left: 0; height: 100%; z-index: 60;
            box-shadow: 0 0 24px rgba(0,0,0,.75); }
        body.panel-right .controls { left: auto; right: 0; }
        /* Кнопки отодвигаются от панели, пока она открыта, и возвращаются к краю,
           когда её скрыли или включили дзен. */
        #screenContainer .float-btn:not(.align-btn) { left: 312px; }
        body.panel-right #screenContainer .float-btn:not(.align-btn) { left: auto; right: 312px; }
        body.panel-right #screenContainer #recBtn { right: auto; left: 8px; }
        #screenContainer .align-btn { right: 8px; left: auto; }
        body.panel-right #screenContainer .align-btn { left: 8px; right: auto; }
        body.panel-hidden #screenContainer .float-btn:not(.align-btn),
        body.zen-mode #screenContainer .float-btn:not(.align-btn) { left: 8px; right: auto; }
        body.panel-hidden.panel-right #screenContainer .float-btn:not(.align-btn),
        body.zen-mode.panel-right #screenContainer .float-btn:not(.align-btn) { left: auto; right: 8px; }
        #recBtn.recording { color: #fff; background: #cc0000; border-color: #ff3333;
            animation: recBlink 1s ease-in-out infinite; outline: 2px solid #ff3333; outline-offset: 3px; }
        /* 35.7: запись мигает цветом (не прозрачностью — в Дзене прозрачность у ⏺ прибита !important) и обведена кольцом. */
        @keyframes recBlink { 0%, 100% { background: #cc0000; box-shadow: 0 0 12px #ff3333; } 50% { background: #330000; box-shadow: 0 0 2px #ff3333; } }
        #recTimer { position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
            font: bold 12px 'Courier New', monospace; color: #ff5555; background: rgba(0,0,0,.6);
            padding: 2px 8px; border-radius: 3px; z-index: 50; display: none; }
        /* Моноширинные цифры в счётчиках: иначе смена значения меняет ширину
           подписи и тянет за собой пересчёт раскладки соседних элементов. */
        #timelineVal, #speedMultVal, #fontSizeVal, #heightVal, #lineHeightVal, #speedVal {
            font-variant-numeric: tabular-nums; }
        .range-with-arrows { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
        .range-with-arrows input[type="range"] { flex: 1; min-width: 0; }
        .range-arrow { flex: 0 0 auto; width: 14px; height: 14px; padding: 0; line-height: 12px;
            font-size: 9px; color: #888; background: #1a1a1a; border: 1px solid #333;
            border-radius: 2px; cursor: pointer; user-select: none; }
        .range-arrow:hover { color: #00ff66; border-color: #00ff66; }
        .range-arrow:active { background: #00ff66; color: #000; }
        body.zen-mode .controls { display: none !important; }
        body.zen-mode .float-btn { opacity: 0 !important; pointer-events: none; }
        body.zen-mode .main-layout { gap: 0; }
        body.zen-mode #screenContainer { border: none; border-radius: 0; }
        body.zen-mode { margin: 0; height: 100vh; }

        /* 35.6: выравнивание |< >|< >| и запись ⏺ — в общий столбец круглых кнопок, под 🛰️
           (раньше стояли отдельно, в правом верхнем углу холста). Столбец ездит вместе с панелью. */
        body #screenContainer #alignLeftBtn, body #screenContainer #alignCenterBtn,
        body #screenContainer #alignRightBtn, body #screenContainer #recBtn { left: 312px; right: auto; top: 50%; }
        body.panel-right #screenContainer #alignLeftBtn, body.panel-right #screenContainer #alignCenterBtn,
        body.panel-right #screenContainer #alignRightBtn, body.panel-right #screenContainer #recBtn { left: auto; right: 312px; }
        body.panel-hidden #screenContainer #alignLeftBtn, body.panel-hidden #screenContainer #alignCenterBtn,
        body.panel-hidden #screenContainer #alignRightBtn, body.panel-hidden #screenContainer #recBtn,
        body.zen-mode #screenContainer #alignLeftBtn, body.zen-mode #screenContainer #alignCenterBtn,
        body.zen-mode #screenContainer #alignRightBtn, body.zen-mode #screenContainer #recBtn { left: 8px; right: auto; }
        body.panel-hidden.panel-right #screenContainer #alignLeftBtn, body.panel-hidden.panel-right #screenContainer #alignCenterBtn,
        body.panel-hidden.panel-right #screenContainer #alignRightBtn, body.panel-hidden.panel-right #screenContainer #recBtn,
        body.zen-mode.panel-right #screenContainer #alignLeftBtn, body.zen-mode.panel-right #screenContainer #alignCenterBtn,
        body.zen-mode.panel-right #screenContainer #alignRightBtn, body.zen-mode.panel-right #screenContainer #recBtn { left: auto; right: 8px; }
        #alignLeftBtn { transform: translateY(132px); }
        #alignCenterBtn { transform: translateY(168px); }
        #alignRightBtn { transform: translateY(204px); }
        #recBtn { transform: translateY(248px); }
        /* 35.8: вкладки, как в Layers. Полоса сверху по центру; левая панель — как была, правая —
           зеркально у правого края. Пустая панель прячется целиком. */
        #rightPanel { left: auto; right: 0; }
        body.panel-right #leftPanel { left: auto; right: 0; }
        body.panel-right #rightPanel { left: 0; right: auto; }
        .controls.empty, body.menu-off .controls { display: none !important; }
        .tab-sec.off { display: none !important; }
        /* 35.9: у раздела — шапка (строится скриптом): за неё раздел таскают в другое место панели,
           в соседнюю панель или на холст, где он становится плавающим окном. ✕ — спрятать раздел. */
        .sec-head { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: bold;
            color: #22d3ee; letter-spacing: .5px; margin: 0 0 3px; padding: 1px 0 2px; border-bottom: 1px solid #1a2a50;
            cursor: move; user-select: none; touch-action: none; }   /* 35.15: курсор «перемещение» (✥), было grab */
        /* 35.10: ✥ — видно, что за шапку можно тащить */
        .sec-head .grip { color: #22d3ee; font-size: 13px; line-height: 1; opacity: .8; }
        .sec-head .ttl { flex: 1; }
        .sec-head .x { background: none; border: none; color: #555; cursor: pointer; font-size: 11px; padding: 0 2px; line-height: 1; }
        .sec-head .x:hover { color: #ff3333; }
        .sec-head:hover .grip { opacity: 1; text-shadow: 0 0 6px #22d3ee; }
        .tab-sec.floating { position: fixed; z-index: 80; width: 284px; max-height: 80vh; overflow-y: auto; margin: 0;
            background: #1c1e24; border: 1px solid #22d3ee; border-radius: 4px; padding: 6px; box-sizing: border-box;
            box-shadow: 0 0 24px rgba(0,0,0,.85); }
        .tab-sec.dragging { opacity: .85; outline: 1px dashed #22d3ee; }
        body.tab-dragging, body.tab-dragging * { cursor: move !important; user-select: none !important; }
        body.tab-dragging:not(.menu-off) .controls.empty { display: flex !important; opacity: .55; }
        .controls.drop-hover { outline: 2px solid #22d3ee; outline-offset: -2px; }
        body.zen-mode .tab-sec.floating { display: none !important; }
        /* 35.11: раздел в боковой панели — отдельная карточка с рамкой: иначе разделы сливались
           в одну ленту и не было видно, где кончается один и начинается другой. */
        .controls .tab-sec { background: #22252d; border: 1px solid #34465e; border-radius: 4px;
            padding: 5px 6px 6px; box-shadow: 0 1px 3px rgba(0,0,0,.35); flex-shrink: 0; }
        .controls .tab-sec:hover { border-color: #22d3ee; }
        .controls .tab-sec.fixed-player { border-top: 2px solid #00ff66; }
        #menuTabs { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 70;
            display: flex; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 720px); min-width: 120px;
            border: 1px solid #22d3ee; border-radius: 3px; overflow: hidden; background: #101010;
            box-shadow: 0 0 12px rgba(0,0,0,.8); }
        #menuTabs button { background: #101010; color: #888; border: none; border-right: 1px solid #222;
            font-family: inherit; font-size: 11px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
        #menuTabs button:last-child { border-right: none; }
        #menuTabs button:hover { color: #fff; background: #1a1a1a; }
        #menuTabs button.on { color: #000; background: #22d3ee; font-weight: bold; }
        #menuTabs button.help { color: #ffcc00; }
        body.zen-mode #menuTabs { display: none; }
        #screenContainer #recTimer { top: 40px; }
        /* 35.8: окно ❓ Помощь */
        #helpOverlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.72); display: none;
            align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
        #helpOverlay.show { display: flex; }
        body.zen-mode #helpOverlay { display: none; }
        #helpBox { position: relative; background: #101010; border: 1px solid #22d3ee; border-radius: 4px;
            box-shadow: 0 0 30px rgba(34,211,238,.25); width: min(760px, 100%); max-height: 100%; overflow-y: auto;
            padding: 16px 20px; box-sizing: border-box; color: #ccc; font-size: 12px; line-height: 1.55; }
        #helpBox h2 { margin: 0 30px 8px 0; font-size: 16px; color: #fff; }

        <template id="helpText">
            <h2>Zerkalius Code — как пользоваться</h2>
            <p class="help-lead">Машина берёт текст (по умолчанию — собственный исходный код страницы) или двоичные строки и
            гонит их кадр за кадром по холсту: сдвигает, отражает, сравнивает строку с соседями и подсвечивает то, что
            меняется. Смотреть можно как ленту, как цилиндр, как спираль радара. Всё, что на холсте, можно записать в видео.</p>

            <h3>С чего начать</h3>
            <ul>
                <li>Страница открывается сразу играющей: сцена «Код Матрицы», радар и реверс включены, рамка выключена.</li>
                <li><b>Щелчок по холсту</b> — пауза / продолжить. <b>Двойной щелчок</b> или <b>щелчок колесом</b> — режим Дзен (только картинка, без панелей).</li>
                <li><b>Колесо мыши</b> над холстом — масштаб. <b>Перетаскивание</b> — сдвинуть картинку.</li>
                <li>Свой материал: вкладка <b>📂 Файл</b> → «📂 Текст» (файл .txt) или выбрать готовую сцену в «📍 Карта Сокровищ».</li>
            </ul>

            <h3>Вкладки</h3>
            <p>Полоса вверху — вкладки, как в Layers. Каждая показывает или прячет свой раздел; подсвеченные открыты.
            Левые разделы стоят в левой панели, правые — в правой; если все разделы панели спрятаны, панель исчезает.
            Какие вкладки закрыты, браузер запоминает.</p>
            <p><b>Разделы перемещаются.</b> Возьмите раздел за шапку (значок ✥ и название) и тащите: над панелью он встанет
            между другими разделами, там где курсор, — можно и в соседнюю панель; мимо панелей — повиснет на холсте
            отдельным окном, которое тоже двигается за шапку. ✕ в шапке прячет раздел. <b>↺</b> на полосе вкладок
            поочерёдно открывает все разделы и оставляет только ▶ Плеер; <b>Shift+↺</b> возвращает раскладку
            по умолчанию (все разделы открыты, плеер окном внизу по центру). Раскладку браузер запоминает.</p>
            <dl>
                <dt>📂 Файл</dt><dd>🧽 очистка холста; сцены — выбрать из списка и «💾 Сохр.» текущий вид как свою (★);
                    «📂 Текст» — загрузить .txt; «🎵 Трек» — музыкальный файл; «🎤 Звук ПК» — захват звука вкладки/экрана
                    (в окне выбора поставить галочку «звук»); «💾 Сохр.» — выгрузить строки; «📊 в Excel»; «Сетка» — включает и выключает отдельный слой-фон: шахматку 1010
                    на весь холст позади строк, с тем же шагом, что у символов; под 🛰️ радаром — кольцами, по тем же
                    окружностям, что и строки. На мелком масштабе (символ меньше 5 px) — по пикселям: «1» ярко, «0» тускло. Строки и «Экран» она не трогает.</dd>
                <dt>🔊 Звук</dt><dd>Визуализатор (картинка пульсирует от баса), 🤖 Авто-пилот (сам меняет сцены), Каскадное эхо (шлейф);
                    «Вставить 0 / 1», «Заполнить 1010» — правка строк.</dd>
                <dt>🔎 Поиск</dt><dd>Введите узор, например 11011: строки, где он встретился, сохраняются в поле ниже.</dd>
                <dt>🔺 Формы</dt><dd>Генератор: правило клеточного автомата (90, 30, 110, 18, 150) или фигура (Воронка, Зиккурат,
                    Орбитальный конус, Диагональная сетка), сид и число строк → «Создать фигуру». «Вживить в центр» — фигура
                    встаёт внутрь текущей матрицы, а не вместо неё.</dd>
                <dt>🧬 Слои</dt><dd>Dual Core: второй слой поверх первого со своей скоростью; XOR-линза; ⚓ заморозить первый слой.</dd>
                <dt>▶ Плеер</dt><dd>◀ шаг назад, ▶ / ⏸ старт-пауза (мигает, пока идёт), ■ стоп и сброс, ▶▶ шаг вперёд.
                    «Кадр» — перемотка. Скорость: красный ползунок — сколько шагов за тик (x1…x100), синий — пауза между тиками (правее — быстрее).</dd>

        // Пишет холст как есть — со всеми изменениями настроек на ходу. Если играет

        const RECORDER = {
            rec: null, startedAt: 0, timer: null, mime: '', _noticeTo: null,
            sid: 0, sink: null, pumpRaf: 0,
            // Своё короткое сообщение: функции уведомлений в этой машине нет.
            notify(text) {
                const el = document.getElementById('recTimer');
                if (!el) return;
                el.textContent = text; el.style.display = 'block';
                clearTimeout(this._noticeTo);
                this._noticeTo = setTimeout(() => { if (!this.rec) el.style.display = 'none'; }, 1800);
            },
            pickMime() {
                const want = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4',
                              'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
                return want.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
            },
            audioTrack() {
                const A = AUDIO_VISUALIZER, bgAudio = document.getElementById('bgAudio');
                if (!A.isInit || !A.audioCtx || !A.source) return null;
                try {
                    if (!this._dest) { this._dest = A.audioCtx.createMediaStreamDestination(); A.source.connect(this._dest); }
                    if (A.audioCtx.state === 'suspended') A.audioCtx.resume();
                    return this._dest.stream.getAudioTracks()[0] || null;
                } catch (e) { return null; }
            },
            start(fps) {
                const canvas = document.getElementById('screenCanvas');
                this.mime = this.pickMime();
                if (!canvas || !this.mime) { this.notify('ЗАПИСЬ НЕ ПОДДЕРЖИВАЕТСЯ'); return false; }
                const stream = canvas.captureStream(fps || 60);
                const at = this.audioTrack();
                if (at) stream.addTrack(at);
                this.sid = Date.now();
                // Куски уходят на диск по ходу записи, а не копятся в памяти вкладки:
                // закрытая посреди записи вкладка больше её не уносит. Приёмник и само
                // хранилище общие, из recorder.js.
                const V = window.__zerkVault;
                this.sink = V ? V.sink(this.sid, { mime: this.mime, startedAt: this.sid, name: this.fileBase(this.sid) })
                              : (() => { const mem = []; this.notify('ПАМЯТЬ ВКЛАДКИ — НЕ ЗАКРЫВАЙТЕ');
                                         return { push: b => mem.push(b), finish: async () => mem, drop: async () => {} }; })();

                this.rec = new MediaRecorder(stream, { mimeType: this.mime, videoBitsPerSecond: 16000000 });
                this.rec.ondataavailable = e => { if (e.data && e.data.size) this.sink.push(e.data); };
                this.rec.onstop = () => this.save();
                // Шаг в start(1000) соблюдает только webm: mp4-муксер Chrome копит кадры
                // у себя и отдаёт их примерно раз в три секунды, а на requestData()
                // отвечает пустыми кусками. Столько и потеряется при обрыве.
                this.rec.start(1000);
                this.startedAt = Date.now();

                // Пока идёт запись, холст перерисовывается каждый кадр экрана.
                // captureStream отдаёт кадр только когда картинка сменилась, а между
                // шагами проигрывателя (при 81 мс это дюжина шагов в секунду) она не
                // меняется — в файле выходило 12 кадров в секунду с рваными
                // промежутками, и это видно как подтормаживание. Через общий
                // планировщик, поэтому лишней перерисовки не будет: если кадр в этом
                // такте рисует сам проигрыватель, второй раз никто не рисует.
                const pump = () => {
                    if (!this.rec) return;
                    window.__zerkScheduleRender?.();
                    this.pumpRaf = requestAnimationFrame(pump);
                };
                this.pumpRaf = requestAnimationFrame(pump);

                window.__zerkRecGuard?.on();
                return true;
            },
            stop() {
                cancelAnimationFrame(this.pumpRaf); this.pumpRaf = 0;
                if (this.rec && this.rec.state !== 'inactive') this.rec.stop();
                this.rec = null;
                window.__zerkRecGuard?.off();
            },
            fileBase(at) {
                const d = at ? new Date(at) : new Date(), pad = n => String(n).padStart(2, '0');
                return `zerkalius-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            },
            download(parts, base) {
                if (!parts.length) return false;
                const ext = this.mime.startsWith('video/mp4') ? 'mp4' : 'webm';
                const a = document.createElement('a');
                a.download = `${base}.${ext}`;
                a.href = URL.createObjectURL(new Blob(parts, { type: this.mime }));
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 30000);
                return true;
            },
            async save() {
                const sink = this.sink, sid = this.sid;

                // не откроется, и человек должен узнать это сейчас, а не через неделю.
                const ok = await (window.__zerkRecorder?.hasHeader(parts) ?? true);
                if (this.download(parts, this.fileBase(sid) + (ok ? '' : '-BEZ-ZAGOLOVKA'))) await sink.drop();
                if (!ok) this.notify('ЗАПИСЬ БЕЗ ЗАГОЛОВКА — НЕ ОТКРОЕТСЯ');
            }

        // === КРИПТО-ХЕШ (СПЕКТР) ===
        // Цвет ячейки берётся из хеша её координат и содержимого — как в
        // визуализациях хеш-сумм: тот же узор всегда даёт ту же раскраску,
        // а изменение одного бита перекрашивает ячейку в произвольный цвет.
        function cryptoHue(row, col, ch) {
            let h = 2166136261;
            h ^= (row + 0x9e37); h = Math.imul(h, 16777619);
            h ^= (col + 0x85eb); h = Math.imul(h, 16777619);
            h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619);
            h ^= h >>> 13; h = Math.imul(h, 16777619); h ^= h >>> 16;
            return (h >>> 0) % 360;
        }

        // === ПОДСВЕТКА СИНТАКСИСА ===
        // Красит символы по их роли в коде — теги, атрибуты, строки, числа,
        // комментарии — вместо радуги по коду символа. Разбор построчный, без
        // состояния между строками: для радара этого достаточно, а результат
        // кэшируется по тексту строки, иначе разбор пойдёт на каждый кадр.
        const SYNTAX_COLORS = {
            tag:     '86, 156, 214',    // < > имена тегов
            attr:    '156, 220, 254',   // имена атрибутов
            str:     '206, 145, 120',   // строки в кавычках
            num:     '181, 206, 168',   // числа
            comment: '106, 153, 85',    // комментарии
            punct:   '212, 212, 212',   // скобки, знаки
            text:    '160, 160, 160'    // прочий текст
        };
        const SYNTAX_CACHE = new Map();
        function syntaxColorsFor(text) {
            let got = SYNTAX_CACHE.get(text);
            if (got) return got;
            const n = text.length, out = new Array(n);
            let inStr = null, inTag = false, inComment = false, afterTagOpen = false;
            for (let i = 0; i < n; i++) {
                const ch = text[i];
                if (inComment) {
                    out[i] = SYNTAX_COLORS.comment;
                    if ((ch === '>' && text.slice(i-2, i+1) === '-->') || (ch === '/' && text[i-1] === '*')) inComment = false;
                    continue;
                }
                if (inStr) {
                    out[i] = SYNTAX_COLORS.str;
                    if (ch === inStr) inStr = null;
                    continue;
                }
                if (text.startsWith('<!--', i) || text.startsWith('/*', i) || text.startsWith('//', i)) {
                    inComment = !text.startsWith('//', i);   // // гасится концом строки сама собой
                    out[i] = SYNTAX_COLORS.comment;
                    if (!inComment) { for (let k = i; k < n; k++) out[k] = SYNTAX_COLORS.comment; return cacheSyntax(text, out); }
                    continue;
                }
                // #rrggbb прямо в коде красится сам в себя: цвет строки кода —
                // ровно тот, который она задаёт. Слишком тёмные подсветляем,
                // иначе на чёрном фоне их просто не видно.
                if (ch === '#') {
                    const m = /^#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})/.exec(text.slice(i, i + 8));
                    if (m) {
                        let h = m[1];
                        if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
                        let r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
                        const lum = 0.2126*r + 0.7152*g + 0.0722*b;
                        if (lum < 70) { const k = (70 - lum) / 255 + 0.35; r += (255-r)*k; g += (255-g)*k; b += (255-b)*k; }
                        const lit = `${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}`;
                        for (let k = 0; k < m[0].length && i + k < n; k++) out[i + k] = lit;
                        i += m[0].length - 1;
                        continue;
                    }
                }
                if (ch === '"' || ch === "'") { inStr = ch; out[i] = SYNTAX_COLORS.str; continue; }
                if (ch === '<') { inTag = true; afterTagOpen = true; out[i] = SYNTAX_COLORS.tag; continue; }
                if (ch === '>') { inTag = false; out[i] = SYNTAX_COLORS.tag; continue; }
                if (ch >= '0' && ch <= '9') { out[i] = SYNTAX_COLORS.num; continue; }
                if (inTag) {
                    if (ch === ' ') { afterTagOpen = false; out[i] = SYNTAX_COLORS.punct; continue; }
                    out[i] = afterTagOpen ? SYNTAX_COLORS.tag : SYNTAX_COLORS.attr;
                    continue;
                }
                out[i] = /[A-Za-zА-Яа-яЁё_]/.test(ch) ? SYNTAX_COLORS.text : SYNTAX_COLORS.punct;
            }
            return cacheSyntax(text, out);
        }
        function cacheSyntax(text, out) {
            if (SYNTAX_CACHE.size > 4000) SYNTAX_CACHE.clear();
            SYNTAX_CACHE.set(text, out);
            return out;
        }

            audioCtx: null, analyser: null, dataArray: null, isInit: false, audioScale: 1, audioGlow: 0, bassLevel: 0, source: null,
            initCore: function() {
                if(!this.isInit) {

            },
            initFile: function(file) {
                this.initCore();
                const bgAudio = document.getElementById('bgAudio');
                bgAudio.src = URL.createObjectURL(file);
                
                if(this.source) this.source.disconnect();
                this.source = this.audioCtx.createMediaElementSource(bgAudio);
                this.source.connect(this.analyser);
                this.source.connect(this.audioCtx.destination); 
                
                document.getElementById('audioBtnText').textContent = "🎵 Файл Готов";

                // Трек обычно подкладывают на ходу, когда картинка уже крутится. Раньше
                // play() звучал только в момент нажатия «Пуск», поэтому загруженный

                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                if (MODULE_STATE.isPlaying) bgAudio.play().catch(() => {});
            },
            initMic: async function() {
                this.initCore();
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
                    const audioTracks = stream.getAudioTracks();
                    if (audioTracks.length === 0) {
                        alert("Вы не выбрали трансляцию звука! При выборе окна поставьте галочку 'Предоставить доступ к аудио системы'.");
                        stream.getTracks().forEach(t => t.stop());
                        return;
                    }
                    const audioStream = new MediaStream([audioTracks[0]]);
                    if(this.source) this.source.disconnect();
                    this.source = this.audioCtx.createMediaStreamSource(audioStream);
                    this.source.connect(this.analyser);

        const MODULE_ALGORITHMS = {
            findDiagonals: function(visibleLines, visibleHeight) {
                if (visibleLines.length === 0) return [];
                const H = visibleHeight; let W = 0;
                for(let r=0; r<H; r++) if(visibleLines[r] && visibleLines[r].text.length > W) W = visibleLines[r].text.length;
                const boldMask = Array.from({length: H}, () => Array(W).fill(false));
                const validChars = ['0', '1'];
                for (let r = 0; r < H; r++) {
                    if (!visibleLines[r]) continue;
                    const text = visibleLines[r].text;
                    for (let c = 0; c < text.length; c++) {
                        const char = text[c]; if (!validChars.includes(char)) continue;
                        let len = 1; while (r + len < H && visibleLines[r+len] && c + len < visibleLines[r+len].text.length && visibleLines[r+len].text[c+len] === char) len++;
                        if (len > 1) for (let k = 0; k < len; k++) boldMask[r+k][c+k] = true;
                    }
                }
                for (let r = 0; r < H; r++) {
                    if (!visibleLines[r]) continue;
                    const text = visibleLines[r].text;
                    for (let c = 0; c < text.length; c++) {
                        const char = text[c]; if (!validChars.includes(char)) continue;
                        let len = 1; while (r + len < H && visibleLines[r+len] && c - len >= 0 && visibleLines[r+len].text[c-len] === char) len++;
                        if (len > 1) for (let k = 0; k < len; k++) boldMask[r+k][c-k] = true;
                    }
                }
                return boldMask;
            },
            checkSymmetry: function(shapeLines) {
                if (!shapeLines || shapeLines.length === 0) return "Пусто";
                let symCount = 0; let totalCount = 0;
                for(let line of shapeLines) {
                    let s = line.text.trim();
                    if(s.length === 0) continue;
                    let left = s.substring(0, Math.floor(s.length/2));
                    let right = s.substring(Math.ceil(s.length/2)).split('').reverse().join('');
                    totalCount += left.length;
                    for(let i=0; i<left.length; i++) if(left[i] === right[i]) symCount++;
                }
                if(totalCount === 0) return "N/A";
                let percent = Math.round((symCount / totalCount) * 100);
                return percent === 100 ? "Симметрия: 100% ⚖️" : `Асимметрия (${percent}%) 📐`;
            }
        };

        const MODULE_DATA = {
            normalizeLines: function(rawLines) {
                if (!Array.isArray(rawLines)) return [];
                return rawLines.map((item, index) => {
                    if (typeof item === 'string') return { text: item, color: '' };
                    else if (item && typeof item === 'object') return { text: item.text || '', color: item.color || '' };
                    return { text: '', color: '' };
                });
            },
            saveToLocalStorage: function(data) { try { localStorage.setItem('saved_binary_lines_v24', JSON.stringify(data)); } catch (e) {} },
            loadFromLocalStorage: function() {
                const saved = localStorage.getItem('saved_binary_lines_v24');

                        }

                }
                return false;
            },
            
            // 35.16: сетка ВСЕГДА на весь экран. Было 150×100 при любом окне и кегле — на большом
            // экране по краям оставалась пустота. Теперь столбцов — сколько символов входит в ширину
            // холста, строк — сколько входит в высоту (у радара — в диагональ: кольца должны дойти
            // до углов), с запасом по краям. Числа чётные: сетка 1010 при прокрутке по кругу
            // смыкается без шва. Под экран она перестраивается сама (см. refitVacuum).
            generateVacuum: function() {
                const fs = parseInt(UI.fontSizeRange?.value || 24, 10);
                const lh = parseFloat(UI.lineHeightRange?.value || 1.2);
                const box = UI.screenContainer;
                const W = (box && box.clientWidth) || window.innerWidth, H = (box && box.clientHeight) || window.innerHeight;
                const ctx = UI.ctx; ctx.save(); ctx.font = `normal ${fs}px ${UI.fontSelect?.value || 'monospace'}`;
                const cw = ctx.measureText('0').width || fs * 0.6; ctx.restore();
                const sp = Math.max(1, fs * lh);
                let h = Math.ceil((MODULE_STATE.isRadarActive ? Math.hypot(W, H) : H) / sp) + 4; if (h % 2) h++;
                let w = Math.ceil(W / cw) + 4; if (w % 2) w++;
                h = Math.min(h, 1024);
                let matrix = [];
                for(let i=0; i<h; i++) {
                    let row = "";
                    for(let j=0; j<w; j++) row += (i % 2 === j % 2) ? '1' : '0';
                    matrix.push({text: row, color: ''});
                }
                MODULE_STATE.originalLines = matrix;
                this.saveToLocalStorage(MODULE_STATE.originalLines);
                this._vacuumPending = true;
                this.precalculateLines(true);
            },

            // Если на холсте сетка — перестроить её под нынешний экран (окно, кегль, интервал,
            // шрифт, радар поменялись). Любая другая загрузка снимает признак, и тогда не трогаем.
            refitVacuum: function() {
                if (!MODULE_STATE.isVacuum) return;
                clearTimeout(this._refitT);
                this._refitT = setTimeout(() => {
                    if (!MODULE_STATE.isVacuum) return;
                    const idx = MODULE_STATE.currentIndex;
                    this.generateVacuum();
                    MODULE_STATE.currentIndex = idx % Math.max(1, MODULE_STATE.lines.length);
                    RENDERER.renderFrame();
                }, 150);
            },

            generateSierpinski: function() {
                let seed = UI.zerkSeedInput.value.trim() || "1";
                let h = parseInt(UI.zerkCountInput.value, 10) || 100;
                let rule = UI.zerkRuleSelect.value;
                let matrix = [];
                
                if (rule === 'orbital') {
                    for(let y=0; y<h; y++) {
                        let len = 2 + y * 4; 
                        let rowStr = "";
                        for(let i=0; i<len; i++) rowStr += (i%2===0) ? '1' : '0';
                        matrix.push(rowStr.split(''));
                    }
                } else if (rule === 'diagonal') {
                    let w = seed.length + 2 * h; 
                    let numMatrix = Array.from({length: h}, () => Array(w).fill(0)); 
                    let centerStart = Math.floor((w - seed.length) / 2);
                    
                    for(let i=0; i<seed.length; i++) {
                        if(seed[i] === '1') {
                            for(let y=0; y<h; y++) { let x = centerStart + i + y; if(x < w) numMatrix[y][x]++; } 
                            for(let y=0; y<h; y++) { let x = centerStart + i - y; if(x >= 0) numMatrix[y][x]++; } 
                        }
                    }
                    
                    for(let y=0; y<h; y++) {
                        matrix[y] = [];
                        for(let x=0; x<w; x++) {
                            matrix[y][x] = (numMatrix[y][x] % 2 === 1) ? '1' : '0';
                        }
                    }
                } else {
                    let w = seed.length + 2 * h; 
                    matrix = Array.from({length: h}, () => Array(w).fill('0')); 
                    let centerStart = Math.floor((w - seed.length) / 2);
                    
                    if (rule === 'vortex') {
                        for (let y = 0; y < h; y++) {
                            for (let x = centerStart - y; x <= centerStart + y + seed.length - 1; x++) {
                                if (Math.abs(x - centerStart + y) % 3 === 0) matrix[y][x] = '0'; else matrix[y][x] = '1';
                            }
                        }
                    } else if (rule === 'ziggurat') {
                        for(let y=0; y<h; y++) {
                            let bgChar = y % 2 === 0 ? '1' : '0';
                            matrix[y].fill(bgChar);
                        }
                        for(let y=0; y<h; y++) {
                            for(let x = centerStart - y; x <= centerStart + y + seed.length - 1; x++) {
                                let dLeft = x - (centerStart - y);
                                let dRight = (centerStart + y + seed.length - 1) - x;
                                if (dLeft % 3 === 0 || dRight % 3 === 0) matrix[y][x] = '1'; else matrix[y][x] = '0';
                            }
                        }
                    } else {
                        let ruleBin = parseInt(rule, 10).toString(2).padStart(8, '0');
                        for(let i=0; i<seed.length; i++) matrix[0][centerStart+i] = seed[i];

                        for(let y=1; y<h; y++) {
                            for(let x=1; x<w-1; x++) {
                                let left = matrix[y-1][x-1] === '1' ? 1 : 0;
                                let center = matrix[y-1][x] === '1' ? 1 : 0;
                                let right = matrix[y-1][x+1] === '1' ? 1 : 0;
                                let idx = 7 - ((left << 2) | (center << 1) | right);
                                matrix[y][x] = ruleBin[idx] === '1' ? '1' : '0';
                            }
                        }
                    }

                    if (UI.trimZerosCheck.checked && rule !== 'ziggurat') {
                        for(let y=0; y<h; y++) {
                            let rowStr = matrix[y].join('');
                            let first1 = rowStr.indexOf('1');
                            let last1 = rowStr.lastIndexOf('1');
                            if(first1 !== -1 && last1 !== -1) {
                                for(let x=0; x<w; x++) if (x < first1 || x > last1) matrix[y][x] = ' '; 
                            } else {
                                matrix[y].fill(' ');
                            }
                        }
                    }
                }

                let shape = matrix.map(row => { return { text: row.join(''), color: ''}; });
                let names = { 'ziggurat': 'Зиккурат', 'vortex': 'Воронка 3D', 'orbital': 'Орбитальный Конус', 'diagonal': 'Диагональная Сетка' };
                this.implantOrReplace(shape, names[rule] || `Фрактал (R${rule})`);
            },

            implantOrReplace: function(shape, sourceName) {
                let symStatus = MODULE_ALGORITHMS.checkSymmetry(shape);

                if (UI.implantModeCheck.checked && MODULE_STATE.originalLines.length > 0) {
                    let bgH = MODULE_STATE.originalLines.length;
                    let bgW = MODULE_STATE.originalLines[0]?.text.length || 0;
                    let shH = shape.length;
                    let shW = Math.max(...shape.map(l => l.text.length));
                    
                    let startY = Math.floor((bgH - shH) / 2);
                    let startX = Math.floor((bgW - shW) / 2);
                    
                    for(let i=0; i<shH; i++) {
                        if(startY+i >= 0 && startY+i < bgH) {
                            let bgStr = MODULE_STATE.originalLines[startY+i].text;
                            let shStr = shape[i].text.padEnd(shW, ' ');
                            
                            let newStrArr = bgStr.split('');
                            for(let k=0; k<shStr.length; k++) {
                                let targetX = startX + k;
                                if(targetX >= 0 && targetX < bgStr.length && shStr[k] !== ' ') {
                                    newStrArr[targetX] = shStr[k];
                                }
                            }
                            MODULE_STATE.originalLines[startY+i].text = newStrArr.join('');
                        }
                    }
                    UI.statusInfo.textContent = `Вживлено: ${sourceName} | ${symStatus}`;
                } else {
                    MODULE_STATE.originalLines = shape;
                    UI.statusInfo.textContent = `Генерация: ${sourceName} | ${symStatus}`;
                }
                
                this.saveToLocalStorage(MODULE_STATE.originalLines);
                this.precalculateLines(true);
            },

            processTextData: function(text, sourceName) {
                const raw = text.split('\n').map(l => l.replace(/\t/g, ' ')).filter(l => l.trim().length > 0);
                const shape = this.normalizeLines(raw);
                this.implantOrReplace(shape, sourceName);
                MODULE_STATE.offsetX = 0; MODULE_STATE.offsetY = 0;
            },

            runAnimatrixGlobal: function() {
                let lines = MODULE_STATE.originalLines;
                let H = lines.length;
                if (H < 2) return;
                
                if (MODULE_STATE.animatrixRow === undefined || MODULE_STATE.animatrixRow >= H - 1) {
                    MODULE_STATE.animatrixRow = 0;
                }
                
                let row1 = MODULE_STATE.animatrixRow;
                let row2 = row1 + 1;
                
                let str1 = lines[row1].text;
                let str2 = lines[row2].text;
                
                let resStr = "";
                let len = Math.max(str1.length, str2.length);
                for(let k=0; k<len; k++) {
                    let c1 = str1[k] || ' ';
                    let c2 = str2[k] || ' ';
                    
                    let cNew = c2;
                    if (c1 === c2 && c1 !== ' ') cNew = ' ';
                    else if (c1 !== ' ' && c2 === ' ') cNew = c1;
                    else if (c2 !== ' ' && c1 === ' ') cNew = c2;
                    else if (c1 !== ' ' && c2 !== ' ') cNew = c1; 
                    
                    resStr += cNew;
                }
                lines[row2].text = resStr;
                MODULE_STATE.animatrixRow++;
                
                this.precalculateLines(false);
            },

            precalculateLines: function(isFirstLoad = false) {
                const op = UI.logicalOpSelect?.value || 'original';
                const raw = MODULE_STATE.originalLines;
                if (raw.length === 0) { MODULE_STATE.lines = []; return; }
                
                const processed = [];
                for (let i = 0; raw.length !== i; i++) {
                    const line = raw[i];
                    let text = line.text;
                    
                    if (op === 'not') text = text.split('').map(char => (char === '0' ? '1' : (char === '1' ? '0' : (char === ' ' ? ' ' : char)))).join('');
                    else if (op === 'xor' && i > 0) {
                        const prevText = raw[i - 1].text;
                        text = text.split('').map((char, charIdx) => {
                            const prevChar = prevText[charIdx];
                            if ((char === '0' || char === '1') && (prevChar === '0' || prevChar === '1')) return char === prevChar ? '0' : '1';
                            return char;
                        }).join('');
                    } else if (op === 'reverse') text = text.split('').reverse().join('');
                    
                    const diffFlags = []; const diffFlagsLeft = []; const diffFlagsRight = []; const mutFlags = [];
                    const prevText = i > 0 ? processed[i - 1].text : "";
                    
                    if (isFirstLoad) MODULE_STATE.mutationTracker[i] = [];
                    if (MODULE_STATE.mutationTracker[i] === undefined) MODULE_STATE.mutationTracker[i] = [];

                    for (let charIdx = 0; charIdx < text.length; charIdx++) {
                        const char = text[charIdx];
                        let isDiff = char !== (prevText ? prevText[charIdx] : undefined);
                        diffFlags.push(isDiff);
                        diffFlagsLeft.push(char !== (prevText ? prevText[charIdx - 1] : undefined));
