<!DOCTYPE html>
<!--
===========================================================================
PROJECT: Zerkalius Code (до 35.31 — Binary Drum Machine)
VERSION: Pro 35.64 (Стартовый вид: радар, рамка, цвет как код, 60 мс, сразу Play; Play мигает; обводка у включённых кнопок, столбец кнопок, реверс с ходу; запись мигает и обведена; вкладки слева/справа, ❓ Помощь; разделы перетаскиваются и плавают; по умолчанию все разделы открыты, панели светлее; разделы в панели — карточками; рамка выкл., 🔃 🛰️ дублями над плеером; курсор ✥ на шапке; Сетка — отдельный слой-фон, под радаром кольцами, на мелком масштабе — пикселями; ↺ — все разделы ⇄ только плеер; кнопок ⇄ и ⚙ больше нет, 🔎 Поиск убран; пресеты — целые сцены, логическая операция работает; выравнивание по видимому краю; 13 шрифтов, свои, без интернета; ▦ скачки ⇄ 〰 плавно в плеере; файл можно бросить на холст; межсимвольный интервал; крайние панели прозрачные; защита от выделения; ⚓ заморозка — на месте, без прыжка в центр; подсчёт циклов Аниматрицы; ▶ — включить выбранную сцену; F5 не сбрасывает — всё как было; ★ — полный пресет вместе с текстом; ★-сцены файлом для другого компьютера; счётчик Аниматрицы — внизу, среди уведомлений; вкладки в одну строку, плавающие окна целиком на экране; журнал Аниматрицы в файл; ⤒ / Home — к началу текста; Аниматрица целыми циклами: ⏮ ⏭, PageUp/PageDown, плеер по циклам; счёт циклов переживает F5; 🎞 GIF цикла прямо из страницы; ◇ ромбическая сетка; ▤ полосы периодов; ◇ сетка «авто» по проходу, ⫼ ось симметрии; 🎞 ромбы в кино; ⧖ зеркало через центр с XOR; 🔤 буквы в ромбах; 🎨 цвета 0 / 1; 🎨 цвета сетки; разреженность сетки; щелчок по заголовку — перезагрузка; текст закрывает сетку)
"We are not just moving strings, we are weaving the fabric of the Matrix."
===========================================================================
-->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zerkalius Code 35.64</title>
    <style>
        /* 35.32: девять добавочных шрифтов холста лежат в самом проекте — _fonts/js/*.js (base64 внутри скрипта),
           и работают без интернета, в том числе когда страница открыта файлом с диска. См. CODE_FONTS в скрипте. */

        /* Шрифт панели — Roboto Mono. Сначала ищется установленный в системе (local()), иначе — тот, что
           приходит из проекта скриптом _fonts/js/roboto-mono.js (35.32; до того — с Google Fonts через @import). */
        @font-face {
            font-family: 'Roboto Mono Local';
            src: local('Roboto Mono'), local('RobotoMono-Regular');
            font-weight: normal; font-style: normal;
        }

        body { 
            background: #050505; color: #00ff66; 
            font-family: 'Roboto Mono Local', 'Roboto Mono', monospace; 
            margin: 8px; overflow: hidden; height: calc(100vh - 16px);
            transition: background 0.3s;
        }

        .main-layout { display: flex; gap: 12px; height: 100%; align-items: stretch; flex-direction: row; transition: 0.3s; }
        
        .controls { 
            width: 300px; min-width: 300px; display: flex; flex-direction: column; 
            background: #1c1e24; padding: 6px; border-radius: 4px; border: 1px solid #2c303a; 
            box-sizing: border-box; height: 100%; transition: 0.3s;
        }

        .fixed-top { flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; border-bottom: 2px solid #222; padding-bottom: 6px; margin-bottom: 4px; }
        
        .scrollable-settings { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
        .scrollable-settings::-webkit-scrollbar { width: 6px; }
        .scrollable-settings::-webkit-scrollbar-track { background: #111; }
        .scrollable-settings::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .fixed-player { flex-shrink: 0; background: #23262e; border: 1px solid #2c303a; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; border-top: 2px solid #00ff66; }

        h3 { margin: 0 0 3px 0; color: #ffffff; text-shadow: 0 0 10px rgba(0,255,102,0.3); font-size: 14px; text-align: center; }
        
        .player-buttons { display: flex; gap: 4px; width: 100%; }
        .player-buttons button { font-size: 16px; font-family: inherit; border: none; cursor: pointer; border-radius: 3px; padding: 4px 2px; display:flex; align-items:center; justify-content:center;}
        #playBtn { flex: 2; background: #00ff66; color: #000; } #playBtn:hover { background: #00cc52; }
        /* 35.5: пока идёт Play, кнопка мигает — видно издалека, что машина работает. */
        @keyframes playBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        #playBtn.playing { animation: playBlink 1s ease-in-out infinite; }
        #stopBtn { flex: 1.2; background: #ff3333; color: #fff; } #stopBtn:hover { background: #cc0000; }
        #prevBtn, #nextBtn { flex: 1; background: #202020; color: #fff; border: 1px solid #333; font-size: 14px; }
        #topBtn { flex: 1; background: #202020; color: #ffcc00; border: 1px solid #333; font-size: 15px; }   /* 35.50 */
        /* 35.12: 🔃 и 🛰️ на плеере. 35.20: это ДУБЛИ — кнопки у холста остаются на месте */
        .player-buttons .pl-extra { flex: 0 0 30px; height: 30px; border-radius: 50%; background: #333; color: #fff;
            font-size: 14px; box-shadow: 0 0 5px rgba(0,0,0,.5); }
        /* 35.14: у плавающего плеера 🔃 и 🛰️ висят СНАРУЖИ окна; 35.21: не по бокам, а НАД ним —
           🔃 над левым углом, 🛰️ над правым. В боковой панели — по краям строки кнопок (там снаружи места нет). */
        .tab-sec.floating.fixed-player { overflow: visible; max-height: none; }
        .tab-sec.floating .player-buttons .pl-extra { position: absolute; top: -44px;
            width: 34px; height: 34px; font-size: 16px; }
        .tab-sec.floating #plReverseBtn { left: 0; }
        .tab-sec.floating #plRadarBtn { right: 0; }
        #plRadarBtn { border-radius: 7px; background: #cc33ff; }
        .player-buttons .pl-extra.active-yellow, .player-buttons .pl-extra.active-green { outline: 2px solid #00ff66; outline-offset: 2px; }

        .btn-export { background: #00ccff; color: #000; font-size: 11px; font-weight: bold; border: none; border-radius: 3px; padding: 5px; cursor: pointer; width: 100%; text-align: center; }
        .btn-export-excel { background: #217346; color: #fff; font-size: 11px; font-weight: bold; border: none; border-radius: 3px; padding: 5px; cursor: pointer; width: 100%; text-align: center; }
        
        .btn-zerkalius { background: #ffcc00; color: #000; font-size: 11px; font-weight: bold; padding: 6px; border: none; border-radius: 3px; cursor: pointer; margin-top: 2px; width: 100%; }
        
        .btn-mod { background: #444; color: #00ff66; border: 1px solid #00ff66; font-size: 10px; font-weight: bold; padding: 4px; border-radius: 3px; cursor: pointer; flex: 1; text-align: center; }
        .btn-mod:hover { background: #00ff66; color: #000; }
        .btn-mod.cyan { color: #00ccff; border-color: #00ccff; } .btn-mod.cyan:hover { background: #00ccff; color: #000; }
        .btn-mod.magenta { color: #ff00ff; border-color: #ff00ff; } .btn-mod.magenta:hover { background: #ff00ff; color: #000; }

        .btn-vacuum { background: #00ccff; color: #000; border: none; font-size: 11px; font-weight: bold; padding: 4px; border-radius: 3px; cursor: pointer; width: 100%; margin-top: 2px;}
        .btn-vacuum.grid-on { outline: 2px solid #00ff66; outline-offset: 2px; background: #00ff66; }   /* 35.17: слой сетки включён */
        .btn-clear-canvas { background: #330000; color: #ff6666; border: 1px solid #ff6666; font-size: 11px; font-weight: bold; padding: 5px; border-radius: 3px; cursor: pointer; width: 100%; margin-bottom: 4px;}
        .btn-clear-canvas:hover { background: #ff6666; color: #000; }

        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; flex: 1; }
        .btn-file { display: block; text-align: center; background: #252525; color: #fff; border: 1px solid #3c3c3c; padding: 5px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-audio { background: #9900ff; color: #fff; border: 1px solid #cc66ff; }
        .btn-mic { background: #ff3366; color: #fff; border: 1px solid #ff6699; padding: 5px; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; flex: 1; text-align: center;}
        .btn-mic:hover { background: #ff6699; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

        .control-group { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 6px; }
        .control-group-highlight { background: #23262e; padding: 6px; border-radius: 3px; border: 1px solid #2c303a; }
        .control-group-blue { background: #0a1128; padding: 6px; border-radius: 3px; border: 1px solid #1a2a50; }
        .control-group-gold { background: #1a1a00; padding: 6px; border-radius: 3px; border: 1px solid #ffcc00; }
        .control-group:last-of-type { border-bottom: none; }

        label { font-size: 11px; display: flex; justify-content: space-between; align-items: center; user-select: none; color: #888; }
        .compact-row { display: flex; gap: 4px; justify-content: space-between; align-items: center; }
        .checkbox-row { display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 2px; cursor: pointer; }
        .checkbox-row span { color: #aaa; font-weight: normal; font-size: 11px; }
        .checkbox-row:hover span { color: #fff; }

        input[type="range"] { width: 100%; cursor: pointer; margin-top: 1px; }
        input[type="text"], input[type="number"] { background: #151515; color: #fff; border: 1px solid #333; padding: 4px; border-radius: 3px; font-family: inherit; font-size: 11px; outline: none; width: 100%; box-sizing: border-box; }
        input[type="color"] { border: none; width: 28px; height: 16px; padding: 0; background: none; cursor: pointer; }
        select { background: #222; color: #fff; border: 1px solid #444; padding: 3px; border-radius: 3px; width: 100%; font-family: inherit; font-size: 11px; outline: none; cursor: pointer;}
        
        /* 35.35: строка состояния живёт внизу холста; щелчки проходят сквозь неё к холсту. В Дзене гаснет вместе с кнопками. */
        #statusInfo { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 9;
            font-size: 11px; color: #ffcc00; text-align: center; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
            background: rgba(0,0,0,.55); padding: 2px 10px; border-radius: 3px; pointer-events: none; }
        body.zen-mode #statusInfo { opacity: 0; }
        /* 35.47: «это внизу показывать, пусть там все уведомления». Счётчик циклов Аниматрицы стоит над строкой
           состояния тем же видом, своим цветом. Строка состояния — для разовых сообщений (сцена сохранена,
           файл загружен), счётчик обновляется на каждом шаге, поэтому у него своя строка: иначе он затирал бы
           сообщения, не дав их прочесть. */
        #animInfo { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9;
            font-size: 11px; color: #ff8a8a; text-align: center; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
            background: rgba(0,0,0,.55); padding: 2px 10px; border-radius: 3px; pointer-events: none; }
        body.zen-mode #animInfo { opacity: 0; }
        /* 35.36: файл тащат над холстом — пунктир по краю */
        #screenContainer.drop-file { outline: 2px dashed #00ff66; outline-offset: -8px; }
        #screenContainer { flex-grow: 1; background: #000000; border: 2px solid #111; border-radius: 5px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        #screenCanvas { display: block; cursor: grab; } 
        #screenCanvas:active { cursor: grabbing; }
        
        /* ПЛАВАЮЩИЕ КНОПКИ */
        .float-btn { position: absolute; z-index: 10; border: none; cursor: pointer; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: opacity 0.3s, background 0.2s, box-shadow 0.2s; left: 8px;}
        
        #toggleCenterBtn { top: 50%; transform: translateY(-120px); background: #333; color: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #toggleTrackBtn { top: 50%; transform: translateY(-70px); background: #333; color: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #toggleReverseBtn { top: 50%; transform: translateY(-20px); background: #333; color: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #toggleFrameBtn { top: 50%; transform: translateY(30px); background: #ffcc00; color: #000; box-shadow: 0 0 8px rgba(255, 204, 0, 0.5); }
        #toggleRadarBtn { top: 50%; transform: translateY(80px); background: #cc33ff; color: #fff; box-shadow: 0 0 10px rgba(204, 51, 255, 0.6); border-radius: 8px; }
        /* 35.6: включённая кнопка — обводка с отступом (раньше у 🎯 📌 🔃 состояние было не видно вовсе). */
        .float-btn.active-yellow, .float-btn.active-red, .float-btn.active-green { outline: 2px solid #ffcc00; outline-offset: 3px; }
        .float-btn.active-red { outline-color: #ff3333; }
        .float-btn.active-green { outline-color: #00ff66; }
        #toggleRadarBtn.active-yellow { outline-color: #00ff66; }

        .align-btn { right: 8px; left: auto; background: #0a1128; color: #00ccff; border: 1px solid #1a2a50; border-radius: 4px; height: 28px; width: 34px;}
        #alignLeftBtn { top: 8px; }
        #alignCenterBtn { top: 40px; background: #00ccff; color: #000; box-shadow: 0 0 8px rgba(0, 204, 255, 0.5); }
        #alignRightBtn { top: 72px; }

        .color-palette { display: flex; flex-direction: column; gap: 2px; background: #1a1a1a; padding: 4px; border-radius: 3px; margin-top: 2px; }
        .palette-row { display: flex; gap: 4px; align-items: center; justify-content: space-between; }
        .palette-row span { font-size: 9px; color: #ccc; width: 45px; }
        .palette-row input[type="range"] { margin: 0; }
        
        textarea { 
            background: #050505; color: #ffcc00; border: 1px solid #ffcc00; 
            font-family: inherit; font-size: 10px; width: 100%; height: 60px; 
            margin-top: 4px; border-radius: 3px; resize: none; display: none; 
            padding: 4px; box-sizing: border-box; box-shadow: inset 0 0 5px rgba(255,204,0,0.2);
        }

        /* Своё место у правого края, ниже кнопок выравнивания. В дзен-режиме
           кнопка остаётся видимой — иначе запись не остановить, не выходя из него. */
        #screenContainer #recBtn { right: 8px; left: auto; top: 112px; background: #1a1a1a; color: #ff5555;
            border: 1px solid #552222; font-size: 18px; }
        #recBtn:hover { background: #331111; color: #ff8888; }
        body.zen-mode #recBtn { opacity: 0.35 !important; pointer-events: auto !important; }
        body.zen-mode #recBtn.recording { opacity: 1 !important; }
        /* Холст всегда занимает всё окно, панель плавает поверх него. Так кадр не
           зависит от того, открыта панель или нет — а в запись панель не попадает
           в любом случае, потому что пишется холст, а не экран. */
        .controls { position: absolute; top: 0; left: 0; height: 100%; z-index: 60;
            box-shadow: 0 0 24px rgba(0,0,0,.75); }
        /* 35.40: крайние панели прозрачные (запрос пользователя) — ни фона, ни рамки, ни тени; холст виден
           сквозь промежутки. Фон остаётся у карточек разделов (.tab-sec), иначе кнопки терялись бы на
           бегущих цифрах. Полоса прокрутки — тоже без подложки. */
        .controls { background: transparent; border-color: transparent; box-shadow: none; }
        .scrollable-settings::-webkit-scrollbar-track { background: transparent; }
        /* 35.41: «защити от выделения все панели». Ползунки, кнопки и холст тянут мышью, а протяжка для
           браузера — ещё и выделение текста: подписи и значки заливались синим. Запрет ставится на всю
           страницу разом, как в Октаэдре, — и панели, и плавающие окна, и кнопки у холста, и новые
           разделы получают его сами. Разрешено там, где выделять надо: поля ввода и окно ❓ Помощь. */
        body { user-select: none; -webkit-user-select: none; }
        input, textarea, select, [contenteditable], #helpOverlay { user-select: text; -webkit-user-select: text; }
        body.panel-right .controls { left: auto; right: 0; }
        /* Кнопки отодвигаются от панели, пока она открыта, и возвращаются к краю,
           когда её скрыли или включили дзен. */
        #screenContainer .float-btn:not(.align-btn) { left: 312px; }
        body.panel-right #screenContainer .float-btn:not(.align-btn) { left: auto; right: 312px; }
        body.panel-right #screenContainer #recBtn { right: auto; left: 8px; }
        #screenContainer .align-btn { right: 8px; left: auto; }
        body.panel-right #screenContainer .align-btn { left: 8px; right: auto; }
        body.panel-hidden #screenContainer .float-btn:not(.align-btn),
        body.zen-mode #screenContainer .float-btn:not(.align-btn) { left: 8px; right: auto; }
        body.panel-hidden.panel-right #screenContainer .float-btn:not(.align-btn),
        body.zen-mode.panel-right #screenContainer .float-btn:not(.align-btn) { left: auto; right: 8px; }
        #recBtn.recording { color: #fff; background: #cc0000; border-color: #ff3333;
            animation: recBlink 1s ease-in-out infinite; outline: 2px solid #ff3333; outline-offset: 3px; }
        /* 35.7: запись мигает цветом (не прозрачностью — в Дзене прозрачность у ⏺ прибита !important) и обведена кольцом. */
        @keyframes recBlink { 0%, 100% { background: #cc0000; box-shadow: 0 0 12px #ff3333; } 50% { background: #330000; box-shadow: 0 0 2px #ff3333; } }
        #recTimer { position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
            font: bold 12px 'Courier New', monospace; color: #ff5555; background: rgba(0,0,0,.6);
            padding: 2px 8px; border-radius: 3px; z-index: 50; display: none; }
        /* Моноширинные цифры в счётчиках: иначе смена значения меняет ширину
           подписи и тянет за собой пересчёт раскладки соседних элементов. */
        #timelineVal, #speedMultVal, #fontSizeVal, #heightVal, #lineHeightVal, #speedVal {
            font-variant-numeric: tabular-nums; }
        .range-with-arrows { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
        .range-with-arrows input[type="range"] { flex: 1; min-width: 0; }
        .range-arrow { flex: 0 0 auto; width: 14px; height: 14px; padding: 0; line-height: 12px;
            font-size: 9px; color: #888; background: #1a1a1a; border: 1px solid #333;
            border-radius: 2px; cursor: pointer; user-select: none; }
        .range-arrow:hover { color: #00ff66; border-color: #00ff66; }
        .range-arrow:active { background: #00ff66; color: #000; }
        body.zen-mode .controls { display: none !important; }
        body.zen-mode .float-btn { opacity: 0 !important; pointer-events: none; }
        body.zen-mode .main-layout { gap: 0; }
        body.zen-mode #screenContainer { border: none; border-radius: 0; }
        body.zen-mode { margin: 0; height: 100vh; }

        /* 35.6: выравнивание |< >|< >| и запись ⏺ — в общий столбец круглых кнопок, под 🛰️
           (раньше стояли отдельно, в правом верхнем углу холста). Столбец ездит вместе с панелью. */
        body #screenContainer #alignLeftBtn, body #screenContainer #alignCenterBtn,
        body #screenContainer #alignRightBtn, body #screenContainer #recBtn { left: 312px; right: auto; top: 50%; }
        body.panel-right #screenContainer #alignLeftBtn, body.panel-right #screenContainer #alignCenterBtn,
        body.panel-right #screenContainer #alignRightBtn, body.panel-right #screenContainer #recBtn { left: auto; right: 312px; }
        body.panel-hidden #screenContainer #alignLeftBtn, body.panel-hidden #screenContainer #alignCenterBtn,
        body.panel-hidden #screenContainer #alignRightBtn, body.panel-hidden #screenContainer #recBtn,
        body.zen-mode #screenContainer #alignLeftBtn, body.zen-mode #screenContainer #alignCenterBtn,
        body.zen-mode #screenContainer #alignRightBtn, body.zen-mode #screenContainer #recBtn { left: 8px; right: auto; }
        body.panel-hidden.panel-right #screenContainer #alignLeftBtn, body.panel-hidden.panel-right #screenContainer #alignCenterBtn,
        body.panel-hidden.panel-right #screenContainer #alignRightBtn, body.panel-hidden.panel-right #screenContainer #recBtn,
        body.zen-mode.panel-right #screenContainer #alignLeftBtn, body.zen-mode.panel-right #screenContainer #alignCenterBtn,
        body.zen-mode.panel-right #screenContainer #alignRightBtn, body.zen-mode.panel-right #screenContainer #recBtn { left: auto; right: 8px; }
        #alignLeftBtn { transform: translateY(132px); }
        #alignCenterBtn { transform: translateY(168px); }
        #alignRightBtn { transform: translateY(204px); }
        /* 35.29: «>|<» не влезало в 34 px и переносилось на две строки. Под радаром выравнивания нет — кнопки гаснут. */
        .align-btn { white-space: nowrap; padding: 0; font-size: 12px; letter-spacing: -1px; }
        body.radar-on .align-btn { opacity: .35; }
        #recBtn { transform: translateY(248px); }
        /* 35.38: ▦ / 〰 — в строке плеера: скачки по сетке ⇄ плавно */
        .player-buttons #snapBtn { flex: 0 0 34px; background: #00ff66; color: #000; font-size: 15px; }
        .player-buttons #snapBtn.smooth { background: #22d3ee; color: #000; }
        /* 35.8: вкладки, как в Layers. Полоса сверху по центру; левая панель — как была, правая —
           зеркально у правого края. Пустая панель прячется целиком. */
        #rightPanel { left: auto; right: 0; }
        body.panel-right #leftPanel { left: auto; right: 0; }
        body.panel-right #rightPanel { left: 0; right: auto; }
        .controls.empty, body.menu-off .controls { display: none !important; }
        .tab-sec.off { display: none !important; }
        /* 35.9: у раздела — шапка (строится скриптом): за неё раздел таскают в другое место панели,
           в соседнюю панель или на холст, где он становится плавающим окном. ✕ — спрятать раздел. */
        .sec-head { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: bold;
            color: #22d3ee; letter-spacing: .5px; margin: 0 0 3px; padding: 1px 0 2px; border-bottom: 1px solid #1a2a50;
            cursor: move; user-select: none; touch-action: none; }   /* 35.15: курсор «перемещение» (✥), было grab */
        /* 35.10: ✥ — видно, что за шапку можно тащить */
        .sec-head .grip { color: #22d3ee; font-size: 13px; line-height: 1; opacity: .8; }
        .sec-head .ttl { flex: 1; }
        .sec-head .x { background: none; border: none; color: #555; cursor: pointer; font-size: 11px; padding: 0 2px; line-height: 1; }
        .sec-head .x:hover { color: #ff3333; }
        .sec-head:hover .grip { opacity: 1; text-shadow: 0 0 6px #22d3ee; }
        .tab-sec.floating { position: fixed; z-index: 80; width: 284px; max-height: 80vh; overflow-y: auto; margin: 0;
            background: #1c1e24; border: 1px solid #22d3ee; border-radius: 4px; padding: 6px; box-sizing: border-box;
            box-shadow: 0 0 24px rgba(0,0,0,.85); }
        .tab-sec.dragging { opacity: .85; outline: 1px dashed #22d3ee; }
        body.tab-dragging, body.tab-dragging * { cursor: move !important; user-select: none !important; }
        body.tab-dragging:not(.menu-off) .controls.empty { display: flex !important; opacity: .55; }
        .controls.drop-hover { outline: 2px solid #22d3ee; outline-offset: -2px; }
        body.zen-mode .tab-sec.floating { display: none !important; }
        /* 35.11: раздел в боковой панели — отдельная карточка с рамкой: иначе разделы сливались
           в одну ленту и не было видно, где кончается один и начинается другой. */
        .controls .tab-sec { background: #22252d; border: 1px solid #34465e; border-radius: 4px;
            padding: 5px 6px 6px; box-shadow: 0 1px 3px rgba(0,0,0,.35); flex-shrink: 0; }
        .controls .tab-sec:hover { border-color: #22d3ee; }
        .controls .tab-sec.fixed-player { border-top: 2px solid #00ff66; }
        #menuTabs { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 70;
            display: flex; flex-wrap: nowrap; justify-content: center; max-width: calc(100vw - 624px); min-width: 120px;
            border: 1px solid #22d3ee; border-radius: 3px; overflow: hidden; background: #101010;
            box-shadow: 0 0 12px rgba(0,0,0,.8); }
        #menuTabs button { background: #101010; color: #888; border: none; border-right: 1px solid #222;
            font-family: inherit; font-size: 11px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
        #menuTabs button:last-child { border-right: none; }
        #menuTabs button:hover { color: #fff; background: #1a1a1a; }
        #menuTabs button.on { color: #000; background: #22d3ee; font-weight: bold; }
        #menuTabs button.help { color: #ffcc00; }
        /* 35.48: полоса не переносится на вторую строку (там «❓ Помощь» съезжала вниз, когда окно у́же — например,
           с открытой боковой панелью браузера). Вкладки сжимаются в одну строку, длинные подписи обрезаются
           многоточием; полное имя — во всплывающей подсказке. Места под полосу — всё между двумя панелями. */
        #menuTabs button { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        body.zen-mode #menuTabs { display: none; }
        #screenContainer #recTimer { top: 40px; }
        /* 35.8: окно ❓ Помощь */
        #helpOverlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.72); display: none;
            align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
        #helpOverlay.show { display: flex; }
        body.zen-mode #helpOverlay { display: none; }
        #helpBox { position: relative; background: #101010; border: 1px solid #22d3ee; border-radius: 4px;
            box-shadow: 0 0 30px rgba(34,211,238,.25); width: min(760px, 100%); max-height: 100%; overflow-y: auto;
            padding: 16px 20px; box-sizing: border-box; color: #ccc; font-size: 12px; line-height: 1.55; }
        #helpBox h2 { margin: 0 30px 8px 0; font-size: 16px; color: #fff; }
        #helpBox h3 { margin: 16px 0 6px; font-size: 13px; color: #22d3ee; border-bottom: 1px solid #1a2a50; padding-bottom: 3px; }
        #helpBox .help-lead { color: #9fffc8; }
        #helpBox p, #helpBox ul { margin: 4px 0; }
        #helpBox ul { padding-left: 18px; }
        #helpBox b { color: #fff; }
        #helpBox dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 4px 0; }
        #helpBox dt { color: #ffcc00; font-weight: bold; white-space: nowrap; }
        #helpBox dd { margin: 0; }
        #helpClose { position: sticky; top: 0; float: right; margin: -6px -10px 0 0; background: #222; color: #fff;
            border: 1px solid #444; border-radius: 3px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; }
        #helpClose:hover { background: #ff3333; border-color: #ff3333; }
        @media (max-width: 560px) { #helpBox dl { grid-template-columns: 1fr; } #helpBox dt { margin-top: 4px; } }
        @media (max-width: 950px), (max-height: 500px) and (orientation: landscape) {
            .main-layout { flex-direction: column-reverse !important; }
            .controls { width: 100% !important; min-width: 100% !important; height: 45vh !important; }
            #screenContainer { height: 55vh !important; flex-grow: unset !important; }
            .scrollable-settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px; }
            .control-group { border-bottom: none; border-right: 1px solid #222; }
            #rightPanel { top: 45vh !important; left: 0 !important; right: auto !important; }
            #menuTabs { max-width: calc(100vw - 16px); }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- 35.8: панель разбита на вкладки, как в Layers: полоса вкладок сверху (#menuTabs, строится
             скриптом из .tab-sec), разделы — в левой и правой панели; вкладка прячет/показывает свой раздел. -->
        <div class="controls" id="leftPanel">
            <div class="fixed-top">
                <h3 id="appTitle" style="cursor:pointer;" title="Щелчок — перезагрузить страницу (как F5: текст, вид и счёт Аниматрицы сохранятся)">Zerkalius Code 35.64</h3>
            </div>
            <div class="scrollable-settings" id="leftSlot">
                <div class="tab-sec" data-tab="file" data-title="📂 Файл">
                <div class="control-group" style="border-bottom:none;">
                <button id="clearCanvasBtn" class="btn-clear-canvas">🧽 Мгновенная Очистка Холста</button>

                <div class="control-group control-group-gold" style="border-bottom: none; padding-bottom: 2px;">
                    <div class="compact-row">
                        <select id="sceneSelect" style="font-weight:bold; color:#ffcc00; flex: 2; border: 1px solid #ff9900;">
                            <option value="">📍 Карта Сокровищ (Выбрать...)</option>
                        </select>
                        <!-- 35.44: ▶ — включить выбранную сцену. Выбрать в списке уже выбранную браузер не даёт (нет события
                             change), и только что сохранённую ★ было не включить заново. -->
                        <button id="loadSceneBtn" class="btn-zerkalius" title="Включить сцену, выбранную в списке (и ту, что уже выбрана)" style="background:#00ff66; color:#000; margin: 0; flex: 0 0 30px; padding: 3px;">▶</button>
                        <button id="saveSceneBtn" class="btn-zerkalius" style="background:#ff9900; margin: 0; flex: 1; padding: 3px;">💾 Сохр.</button>
                    </div>
                    <!-- 35.46: перенос ★-сцен на другой компьютер — одним файлом .json, целиком, с текстами -->
                    <div class="compact-row" style="margin-top:4px;">
                        <button id="exportScenesBtn" class="btn-zerkalius" title="Все свои ★-сцены целиком (с текстами) — одним файлом .json, чтобы перенести на другой компьютер" style="background:#2a2d36; color:#ffcc00; border:1px solid #ff9900; margin:0; flex:1; padding:3px;">📤 Сцены в файл</button>
                        <button id="importScenesBtn" class="btn-zerkalius" title="Добавить ★-сцены из файла .json (свои не затираются). Файл можно и просто бросить на холст" style="background:#2a2d36; color:#ffcc00; border:1px solid #ff9900; margin:0; flex:1; padding:3px;">📥 Из файла</button>
                        <input type="file" id="importScenesInput" accept=".json,application/json" style="display:none">
                    </div>
                </div>

                <div class="compact-row">
                    <div class="file-input-wrapper"><span class="btn-file">📂 Текст</span><input type="file" id="fileLoader" accept=".txt"></div>
                    <div class="file-input-wrapper">
                        <span class="btn-file btn-audio" id="audioBtnText">🎵 Трек</span>
                        <input type="file" id="audioLoader" accept="audio/*">
                    </div>
                    <button id="micBtn" class="btn-mic" title="Попросит доступ к захвату окна (Выбери вкладку с системным аудио)">🎤 Звук ПК</button>
                </div>
                
                <audio id="bgAudio" loop style="display:none;"></audio>

                <div class="compact-row">
                    <button id="exportBtn" class="btn-export">💾 Сохр.</button>
                    <button id="exportExcelBtn" class="btn-export-excel">📊 в Excel</button>
                    <button id="generateVacuumBtn" class="btn-vacuum" style="margin:0;">Сетка</button>
                </div>
                </div>
                </div>
                <div class="tab-sec" data-tab="sound" data-title="🔊 Звук">
                <div class="control-group">
                    <label class="checkbox-row" style="margin-top: 2px; background: #2a0044; padding: 4px; border-radius: 3px;">
                        <input type="checkbox" id="audioReactCheck" checked>
                        <span style="color:#cc66ff; font-weight:bold;">Визуализатор Звука (Пульсация)</span>
                    </label>
                    <label class="checkbox-row" style="margin-top: 2px; background: #00331a; padding: 4px; border-radius: 3px;">
                        <input type="checkbox" id="autoPilotCheck">
                        <span style="color:#00ff88; font-weight:bold;">🤖 AI Авто-Пилот (Рандом Сцен)</span>
                    </label>
                    <label class="checkbox-row" style="margin-top: 2px; background: #2a0000; padding: 4px; border-radius: 3px;">
                        <input type="checkbox" id="echoModeCheck">
                        <span style="color:#ff6666; font-weight:bold;">Каскадное Эхо (Шлейф)</span>
                    </label>
                    <div class="compact-row" style="margin-top: 4px;">
                        <button id="insertZerosGlobalBtn" class="btn-mod">Вставить 0</button>
                        <button id="insertOnesGlobalBtn" class="btn-mod magenta">Вставить 1</button>
                        <button id="fill1010Btn" class="btn-mod cyan">Заполнить 1010</button>
                    </div>
                </div>
                </div>
                <div class="tab-sec" data-tab="gen" data-title="🔺 Формы">
                <div class="control-group control-group-highlight" style="border-color: #ffcc00;">
                    <label style="color:#ffcc00; text-align:center;">Генератор Форм</label>
                    <select id="zerkRuleSelect" style="margin: 4px 0; background: #222;">
                        <option value="90">Правило 90 (Классика)</option>
                        <option value="30">Правило 30 (Хаос)</option>
                        <option value="110">Правило 110 (Правый Сдвиг)</option>
                        <option value="18">Правило 18 (Серпинский V2)</option>
                        <option value="150">Правило 150 (Инопланетная вязь)</option>
                        <option value="vortex" style="color:#00ccff; font-weight:bold;">🌌 Квантовая Воронка (Змейка 3D)</option>
                        <option value="ziggurat" style="color:#ff9900; font-weight:bold;">🛕 Зиккурат (Полосатая Воронка)</option>
                        <option value="orbital" style="color:#00ffcc; font-weight:bold; background:#003322;">🎯 Орбитальный Конус 1-0-1</option>
                        <option value="diagonal" style="color:#ff3333; font-weight:bold; background:#330000;">🕸️ Диагональная Сетка (Изометрия)</option>
                    </select>
                    <div class="compact-row">
                        <label>Сид:<input type="text" id="zerkSeedInput" value="1" style="width: 50px; text-align:center;"></label>
                        <label>Строк:<input type="number" id="zerkCountInput" value="50" style="width: 50px; text-align:center;"></label>
                    </div>
                    <label class="checkbox-row" style="margin-top: 4px;"><input type="checkbox" id="trimZerosCheck" checked><span>Обрезать фон (висеть в пустоте)</span></label>
                    <label class="checkbox-row"><input type="checkbox" id="implantModeCheck" checked><span style="color:#00ccff; font-weight:bold;">Вживить фигуру в центр матрицы</span></label>
                    <button id="zerkaliusBtn" class="btn-zerkalius">Создать Фигуру</button>
                </div>
                </div>
                <div class="tab-sec" data-tab="dual" data-title="🧬 Слои">
                <div class="control-group control-group-highlight" style="border-color: #ff00ff;">
                    <label style="color:#ff00ff; text-align:center; width: 100%;">Двойное Измерение (Dual Core)</label>
                    <label class="checkbox-row" style="margin-top:2px;"><input type="checkbox" id="dualCoreCheck"><span>Включить Наложение Слоев</span></label>
                    <label class="checkbox-row" style="margin-top:2px;"><input type="checkbox" id="dualMaskCheck"><span>Проникающая Маска (XOR линза)</span></label>
                    <label class="checkbox-row" style="margin-top:2px;"><input type="checkbox" id="freezeLayer1Check"><span style="color:#ffcc00; font-weight:bold;">⚓ Заморозить Слой 1 (Стоит на месте)</span></label>
                    <div class="compact-row" style="margin-top: 4px;">
                        <label>Множитель скорости Слой 2:</label>
                        <input type="number" id="dualCoreSpeedInput" value="2" min="1" max="10" style="width: 40px; text-align:center;">
                    </div>
                </div>
                </div>
            </div>
            <div class="fixed-player tab-sec" data-tab="player" data-title="▶ Плеер">
                <div class="player-buttons">
                    <button id="plReverseBtn" class="pl-extra" data-for="toggleReverseBtn" title="Включить реверс движения">🔃</button>
                    <button id="prevBtn" title="Шаг назад">◀</button>
                    <button id="playBtn" title="Старт / Пауза">▶</button>
                    <button id="stopBtn" title="Стоп и сброс">■</button>
                    <!-- 35.50: ⤒ — к началу: пауза, первая строка текста у верхнего края экрана (клавиша Home) -->
                    <button id="topBtn" title="К началу (Home): пауза, первая строка текста — у верхнего края экрана">⤒</button>
                    <button id="nextBtn" title="Шаг вперед">▶▶</button>
                    <!-- 35.38: скачки ⇄ плавно (была кнопкой ▦ у холста, 35.33) -->
                    <button id="snapBtn" title="Скачки: строки прыгают по строкам сетки, перетаскивание — по клеткам. Щёлкните — плавно">▦</button>
                    <!-- 35.12: пока плеер открыт, 🔃 и 🛰️ живут здесь (двойники кнопок у холста, см. PLAYER_DOCK) -->
                    <button id="plRadarBtn" class="pl-extra" data-for="toggleRadarBtn" title="Топологический Радар (Вид сверху / Спираль)">🛰️</button>
                </div>
                
                <div class="control-group" style="border: none; padding: 0;">
                    <label>Кадр: <span id="timelineVal">0 / 0</span></label>
                    <input type="range" id="timelineRange" class="timeline-slider" min="0" max="0" value="0">
                </div>

                <div class="control-group" style="border: none; padding: 0;">
                    <div class="compact-row">
                        <label style="flex:1;">Скорость (1 - 1000мс):</label>
                        <label style="color:#ff3333; font-weight:bold;">x<span id="speedMultVal" style="display:inline-block; min-width:22px; text-align:right;">1</span></label>
                    </div>
                    <!-- Множитель шагов за тик: раньше было поле с микроскопическими стрелками,
                         теперь ползунок — значение видно в подписи "x" справа сверху. -->
                    <input type="range" id="speedMultInput" min="1" max="100" value="1" style="accent-color:#ff3333;" title="Сколько шагов симуляции за один тик таймера">
                    <input type="range" id="speedRange" min="1" max="1000" value="920" title="Интервал таймера в миллисекундах: правее — быстрее">
                    <div class="compact-row" style="margin-top:2px;">
                        <span style="font-size:10px; color:#555;">🐌</span>
                        <span id="speedVal" style="font-size:10px; color:#00ff66;">80 мс</span>
                        <span style="font-size:10px; color:#555;">🚀</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls" id="rightPanel">
            <div class="scrollable-settings" id="rightSlot">
                <div class="tab-sec" data-tab="motion" data-title="↕ Движение">
                <div class="control-group">
                    <label>Алгоритм Y-сдвига:</label>
                    <input type="text" id="algorithmInput" value="1" placeholder="например: 1, 1, 2, -3, 1" style="text-align: center;">
                    <label class="checkbox-row" style="margin-top: 4px; background: #003300; padding: 2px;"><input type="checkbox" id="freezeScrollCheck"><span style="color:#00ff66; font-weight:bold;">Заморозить Y-Скролл (Только X)</span></label>
                    <label class="checkbox-row" style="margin-top: 2px; background: #330033; padding: 2px;"><input type="checkbox" id="spin3dCheck"><span style="color:#cc33ff; font-weight:bold;">3D Вращение (Орбита Радара)</span></label>
                    <label class="checkbox-row" style="margin-top: 2px; background: #331100; padding: 2px;"><input type="checkbox" id="breathingZoomCheck"><span style="color:#ff9933; font-weight:bold;">🫁 Дыхание (Авто-Масштаб)</span></label>
                </div>
                </div>
                <div class="tab-sec" data-tab="logic" data-title="Δ Логика">
                <div class="control-group control-group-highlight">
                    <label class="checkbox-row" style="margin:0;"><input type="checkbox" id="hideStaticCheck"><span><b style="color:#ffcc00">Скрыть статику (Delta)</b></span></label>
                    <select id="deltaModeSelect" style="margin-top:4px;">
                        <option value="top">Вертикаль (▲)</option>
                        <option value="leftDiag">Лев. диагональ (↖)</option>
                        <option value="rightDiag">Прав. диагональ (↗)</option>
                        <option value="serpinski" selected>Серпинский (↖↗)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Логическая операция:</label>
                    <select id="logicalOpSelect">
                        <option value="original">Оригинал (Без изменений)</option>
                        <option value="not">Инверсия NOT (0 ⇄ 1)</option>
                        <option value="xor">Разница XOR (со сдвигом)</option>
                        <option value="reverse">Зеркало (Реверс строки)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="checkbox-row"><input type="checkbox" id="zerkaliusAnimCheck"><span><b style="color:#ff3333">Аниматрица (Волна Сверху-Вниз)</b></span></label>
                    <!-- 35.49: журнал Аниматрицы — весь текст после каждого прохода волны, в файл .txt -->
                    <div class="compact-row" style="margin:0 0 3px 22px;">
                        <button id="animLogBtn" type="button" title="Начать / остановить запись журнала: весь текст в момент старта и после каждого прохода волны" style="margin:0; flex:1; padding:2px 4px; font-size:10px; background:#2a1212; color:#ff8a8a; border:1px solid #ff3333; border-radius:3px; cursor:pointer;">⏺ Журнал</button>
                        <button id="animLogSaveBtn" type="button" title="Скачать журнал файлом .txt (можно и во время записи)" style="margin:0; flex:1; padding:2px 4px; font-size:10px; background:#2a1212; color:#ff8a8a; border:1px solid #ff3333; border-radius:3px; cursor:pointer;">💾 Журнал в файл</button>
                    </div>
                    <!-- 35.51: целыми циклами (проходами волны) — назад / вперёд и плеер по циклам -->
                    <div class="compact-row" style="margin:0 0 3px 22px;">
                        <button id="animBackBtn" type="button" title="PageUp. Назад: к началу текущего цикла, а с границы — к предыдущему" style="margin:0; flex:1; padding:2px 4px; font-size:10px; background:#2a1212; color:#ff8a8a; border:1px solid #ff3333; border-radius:3px; cursor:pointer;">⏮ Цикл</button>
                        <button id="animNextBtn" type="button" title="PageDown. Вперёд: волна сразу доходит до конца цикла" style="margin:0; flex:1; padding:2px 4px; font-size:10px; background:#2a1212; color:#ff8a8a; border:1px solid #ff3333; border-radius:3px; cursor:pointer;">⏭ Цикл</button>
                    </div>

            <h2>Zerkalius Code — как пользоваться</h2>
            <p class="help-lead">Машина берёт текст (по умолчанию — собственный исходный код страницы) или двоичные строки и
            гонит их кадр за кадром по холсту: сдвигает, отражает, сравнивает строку с соседями и подсвечивает то, что
            меняется. Смотреть можно как ленту, как цилиндр, как спираль радара. Всё, что на холсте, можно записать в видео.</p>

            <h3>С чего начать</h3>
            <ul>
                <li>Первый раз страница открывается сразу играющей: сцена «Код Матрицы», радар и реверс включены, рамка выключена.
                    Дальше F5 и повторное открытие возвращают всё как было: текст, вид, галочки, цвета, сцену и кадр плеера.</li>
                <li><b>Щелчок по холсту</b> — пауза / продолжить. <b>Двойной щелчок</b> или <b>щелчок колесом</b> — режим Дзен (только картинка, без панелей).</li>
                <li><b>Колесо мыши</b> над холстом — масштаб. <b>Перетаскивание</b> — сдвинуть картинку.</li>
                <li>Свой материал: вкладка <b>📂 Файл</b> → «📂 Текст» (файл .txt) или выбрать готовую сцену в «📍 Карта Сокровищ».</li>
            </ul>

            <h3>Вкладки</h3>
            <p>Полоса вверху — вкладки, как в Layers. Каждая показывает или прячет свой раздел; подсвеченные открыты.
            Левые разделы стоят в левой панели, правые — в правой; если все разделы панели спрятаны, панель исчезает.
            Какие вкладки закрыты, браузер запоминает.</p>
            <p><b>Разделы перемещаются.</b> Возьмите раздел за шапку (значок ✥ и название) и тащите: над панелью он встанет
            между другими разделами, там где курсор, — можно и в соседнюю панель; мимо панелей — повиснет на холсте
            отдельным окном, которое тоже двигается за шапку. ✕ в шапке прячет раздел. <b>↺</b> на полосе вкладок
            поочерёдно открывает все разделы и оставляет только ▶ Плеер; <b>Shift+↺</b> возвращает раскладку
            по умолчанию (все разделы открыты, плеер окном внизу по центру). Раскладку браузер запоминает.</p>
            <dl>
                <dt>📂 Файл</dt><dd>🧽 очистка холста; сцены — выбрать из списка (готовая сцена ставит ВСЁ своё: масштаб, интервал, галочки, 🔃 — с чистого листа) и «💾 Сохр.» текущий вид как свою (★ — полный пресет: текст холста, вид, галочки, скорость, цвета, радар, рамка, кадр; ★ из версий до 35.45 помнят только настройки); ▶ рядом со списком включает выбранную сцену, в том числе ту, что в нём уже стоит; «📤 Сцены в файл» — все ★ одним файлом .json (с текстами), «📥 Из файла» (или бросить этот файл на холст) — добавить их на другом компьютере, свои не затираются;
                    «📂 Текст» — загрузить .txt (или просто бросить файл на холст; брошенный звуковой файл встаёт треком); «🎵 Трек» — музыкальный файл; «🎤 Звук ПК» — захват звука вкладки/экрана
                    (в окне выбора поставить галочку «звук»); «💾 Сохр.» — выгрузить строки; «📊 в Excel»; «Сетка» — включает и выключает отдельный слой-фон: шахматку 1010
                    на весь холст позади строк, с тем же шагом, что у символов; под 🛰️ радаром — кольцами, по тем же

                <dt>🔊 Звук</dt><dd>Визуализатор (картинка пульсирует от баса), 🤖 Авто-пилот (сам меняет сцены), Каскадное эхо (шлейф);
                    «Вставить 0 / 1», «Заполнить 1010» — правка строк.</dd>
                <dt>🔺 Формы</dt><dd>Генератор: правило клеточного автомата (90, 30, 110, 18, 150) или фигура (Воронка, Зиккурат,

                <dt>🧬 Слои</dt><dd>Dual Core: второй слой поверх первого со своей скоростью; XOR-линза; ⚓ заморозить первый слой.</dd>
                <dt>▶ Плеер</dt><dd>◀ шаг назад, ▶ / ⏸ старт-пауза (мигает, пока идёт), ■ стоп и сброс (первая строка — в центре экрана), ⤒ или клавиша Home — к началу: пауза, первая строка текста у верхнего края экрана, ▶▶ шаг вперёд.
                    «Кадр» — перемотка. Скорость: красный ползунок — сколько шагов за тик (x1…x100), синий — пауза между тиками (правее — быстрее).</dd>
                <dt>↕ Движение</dt><dd>Алгоритм Y-сдвига (например «1, 1, 2, -3»), заморозить вертикальную прокрутку, 3D-вращение, 🫁 дыхание (авто-масштаб).</dd>
                <dt>Δ Логика</dt><dd>«Скрыть статику» — гасит символы, которые не изменились относительно соседа (сверху, по диагоналям

                    назад и вперёд сразу целым проходом волны, «Плеер — целыми циклами» — ▶ идёт цикл за циклом;
                    ⧖ Зеркало — отразить половину текста через центр экрана (поворот на 180°) и сложить XOR с другой: «низ → вверх»,

        const RECORDER = {

        function cryptoHue(row, col, ch) {
            let h = 2166136261;
            h ^= (row + 0x9e37); h = Math.imul(h, 16777619);
            h ^= (col + 0x85eb); h = Math.imul(h, 16777619);

        const SYNTAX_COLORS = {
            tag:     '86, 156, 214',    // < > имена тегов
            attr:    '156, 220, 254',   // имена атрибутов
            str:     '206, 145, 120',   // строки в кавычках
            num:     '181, 206, 168',   // числа
            comment: '106, 153, 85',    // комментарии

        const SYNTAX_CACHE = new Map();
        // 35.60: цвет «0» / «1» из пикеров раздела «Цвет» как [r, g, b] — для GIF и листов ромбов
        function bitRgb(id, def) {

            return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
        }
        function syntaxColorsFor(text) {
            let got = SYNTAX_CACHE.get(text);
            if (got) return got;
            const n = text.length, out = new Array(n);
            let inStr = null, inTag = false, inComment = false, afterTagOpen = false;
            for (let i = 0; i < n; i++) {
                const ch = text[i];
                if (inComment) {
                    out[i] = SYNTAX_COLORS.comment;
                    if ((ch === '>' && text.slice(i-2, i+1) === '-->') || (ch === '/' && text[i-1] === '*')) inComment = false;
                    continue;
                }
                if (inStr) {
                    out[i] = SYNTAX_COLORS.str;
                    if (ch === inStr) inStr = null;
                    continue;
                }
                if (text.startsWith('<!--', i) || text.startsWith('/*', i) || text.startsWith('//', i)) {
                    inComment = !text.startsWith('//', i);   // // гасится концом строки сама собой
                    out[i] = SYNTAX_COLORS.comment;
                    if (!inComment) { for (let k = i; k < n; k++) out[k] = SYNTAX_COLORS.comment; return cacheSyntax(text, out); }
                    continue;
                }
                // #rrggbb прямо в коде красится сам в себя: цвет строки кода —
                // ровно тот, который она задаёт. Слишком тёмные подсветляем,
                // иначе на чёрном фоне их просто не видно.
                if (ch === '#') {
                    const m = /^#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})/.exec(text.slice(i, i + 8));
                    if (m) {
                        let h = m[1];
                        if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
                        let r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
                        const lum = 0.2126*r + 0.7152*g + 0.0722*b;
                        if (lum < 70) { const k = (70 - lum) / 255 + 0.35; r += (255-r)*k; g += (255-g)*k; b += (255-b)*k; }
                        const lit = `${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}`;
                        for (let k = 0; k < m[0].length && i + k < n; k++) out[i + k] = lit;
                        i += m[0].length - 1;
                        continue;
                    }
                }
                if (ch === '"' || ch === "'") { inStr = ch; out[i] = SYNTAX_COLORS.str; continue; }
                if (ch === '<') { inTag = true; afterTagOpen = true; out[i] = SYNTAX_COLORS.tag; continue; }
                if (ch === '>') { inTag = false; out[i] = SYNTAX_COLORS.tag; continue; }
                if (ch >= '0' && ch <= '9') { out[i] = SYNTAX_COLORS.num; continue; }
                if (inTag) {
                    if (ch === ' ') { afterTagOpen = false; out[i] = SYNTAX_COLORS.punct; continue; }
                    out[i] = afterTagOpen ? SYNTAX_COLORS.tag : SYNTAX_COLORS.attr;
                    continue;
                }
                out[i] = /[A-Za-zА-Яа-яЁё_]/.test(ch) ? SYNTAX_COLORS.text : SYNTAX_COLORS.punct;
            }
            return cacheSyntax(text, out);
        }
        function cacheSyntax(text, out) {
            if (SYNTAX_CACHE.size > 4000) SYNTAX_CACHE.clear();
            SYNTAX_CACHE.set(text, out);
            return out;
        }

                if(!this.isInit) {

                    this.analyser = this.audioCtx.createAnalyser();

                    this.isInit = true;

            initFile: function(file) {
                this.initCore();
                const bgAudio = document.getElementById('bgAudio');
                bgAudio.src = URL.createObjectURL(file);
                
                if(this.source) this.source.disconnect();
                this.source = this.audioCtx.createMediaElementSource(bgAudio);
                this.source.connect(this.analyser);
                this.source.connect(this.audioCtx.destination); 
                
                document.getElementById('audioBtnText').textContent = "🎵 Файл Готов";

                // Трек обычно подкладывают на ходу, когда картинка уже крутится. Раньше

                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                if (MODULE_STATE.isPlaying) bgAudio.play().catch(() => {});
            },
            initMic: async function() {
                this.initCore();
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
                    const audioTracks = stream.getAudioTracks();
                    if (audioTracks.length === 0) {
                        alert("Вы не выбрали трансляцию звука! При выборе окна поставьте галочку 'Предоставить доступ к аудио системы'.");
                        stream.getTracks().forEach(t => t.stop());
                        return;
                    }
                    const audioStream = new MediaStream([audioTracks[0]]);
                    if(this.source) this.source.disconnect();
                    this.source = this.audioCtx.createMediaStreamSource(audioStream);
                    this.source.connect(this.analyser);
                    
                    document.getElementById('bgAudio').pause();
                    document.getElementById('audioBtnText').textContent = "🎵 ПК Звук";
                    document.getElementById('micBtn').textContent = "🔊 Идет Захват";

            update: function() {
                if(!this.isInit || !document.getElementById('audioReactCheck').checked) {
                    this.audioScale = 1; this.audioGlow = 0; this.bassLevel = 0; return;
                }
                
                const bgAudio = document.getElementById('bgAudio');
                if (bgAudio.src && bgAudio.paused && !this.source?.mediaStream) {
                    this.audioScale = 1; this.audioGlow = 0; this.bassLevel = 0; return;
                }

                this.analyser.getByteFrequencyData(this.dataArray);
                let bass = 0; for(let i=0; i<10; i++) bass += this.dataArray[i]; bass = bass / 10;
                this.bassLevel = bass;

                let vol = 0; for(let i=0; i<this.dataArray.length; i++) vol += this.dataArray[i]; vol = vol / this.dataArray.length;

            /* 35.46: ★-СЦЕНЫ ФАЙЛОМ (запрос пользователя: «надо и файл сохранять, чтобы на другой комп потом»).
               Сцены живут в памяти браузера, а она у каждого компьютера и браузера своя. 📤 выгружает все ★ разом
               одним .json — вместе с текстами (полный снимок, 35.45). 📥 (или бросок файла на холст) добавляет
               их в список: свои сцены не затираются, ключи новые, а сцена, которая уже есть точь-в-точь, второй
               раз не добавляется. Метка zerkaliusScenes отличает такой файл от обычного текста. */
            exportScenes: function() {
                const all = MODULE_STATE.customScenes || {}, n = Object.keys(all).length;
                if (!n) { alert('Своих сцен (★) пока нет: сначала «💾 Сохр.» у списка сцен.'); return; }
                const pack = { zerkaliusScenes: 1, saved: new Date().toISOString(), scenes: all };
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([JSON.stringify(pack)], { type: 'application/json' }));
                a.download = 'Zerkalius-сцены-' + new Date().toISOString().slice(0, 10) + '.json';
                a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
                UI.statusInfo.textContent = `Сцен в файле: ${n}`;
            },
            importScenes: function(text, fileName) {   // true — это был файл сцен
                let pack = null;
                try { pack = JSON.parse(text); } catch (e) { return false; }
                if (!pack || pack.zerkaliusScenes !== 1 || !pack.scenes || typeof pack.scenes !== 'object') return false;
                if (!MODULE_STATE.customScenes) MODULE_STATE.customScenes = {};
                const have = new Set(Object.values(MODULE_STATE.customScenes).map(c => JSON.stringify(c)));
                let added = 0, i = 0; const base = Date.now();
                Object.values(pack.scenes).forEach(sc => {
                    if (!sc || typeof sc.name !== 'string') return;
                    if (have.has(JSON.stringify(sc))) return;
                    const key = (base + i++).toString();
                    MODULE_STATE.customScenes[key] = sc;
                    const opt = document.createElement('option'); opt.value = 'custom_' + key; opt.textContent = '★ ' + sc.name;
                    UI.sceneSelect.appendChild(opt); added++;
                });
                try { localStorage.setItem('saved_scenes_v20', JSON.stringify(MODULE_STATE.customScenes)); }
                catch (e) { alert('Сцены добавлены в список, но в память браузера не влезли (около 5 МБ на всё): после закрытия страницы их не будет. Удалите лишние сцены и загрузите файл снова.'); }
                UI.statusInfo.textContent = `Сцены из «${fileName}»: добавлено ${added}` + (added ? '' : ' — все уже были');
                return true;
            },
            saveScene: function() {
                let name = prompt("Назови эту координату (Сцену):", "Мой шедевр");
                if(!name) return;
                let key = Date.now().toString();
                let newScene = {
                    name: name, type: "current_state", speed: UI.speedRange.value, theme: UI.themeSelect.value,
                    echo: UI.echoModeCheck.checked, dual: UI.dualCoreCheck.checked, dualMask: UI.dualMaskCheck.checked,
                    freezeY: UI.freezeScrollCheck.checked, spin3d: UI.spin3dCheck.checked, breathing: UI.breathingZoomCheck?.checked,
                    elka: UI.elkaCheck.checked, neon: UI.neonGlowCheck.checked, frame: MODULE_STATE.isFrameActive, radar: MODULE_STATE.isRadarActive,
                    rainbow: UI.rainbowTextCheck?.checked, freezeLayer1: UI.freezeLayer1Check?.checked,
                    ui: this.snapshotUi(),   // 35.25
                    // 35.45: и текст, и всё остальное — ★ стала полным пресетом (запрос пользователя: «надо и текст, и
                    // сохранять всё вместе, как пресеты»). Снимок тот же, что у F5 (SESSION.collect).
                    full: SESSION.collect(true)
                };
                MODULE_STATE.customScenes[key] = newScene;

                // пишется без текста, и об этом говорится прямо, а не молча.
                try { localStorage.setItem('saved_scenes_v20', JSON.stringify(MODULE_STATE.customScenes)); }
                catch (e) {
                    newScene.full = SESSION.collect(false);
                    try { localStorage.setItem('saved_scenes_v20', JSON.stringify(MODULE_STATE.customScenes)); } catch (e2) {}
                    alert('Не хватает места в памяти браузера: сцена «' + name + '» сохранена без текста. Удалите старые сцены или сохраните текст файлом.');
                }
                let opt = document.createElement('option'); opt.value = "custom_" + key; opt.textContent = "★ " + name;
                UI.sceneSelect.appendChild(opt); UI.sceneSelect.value = "custom_" + key;
